# ============================================================
# 写作知识库 — 从 CUMCM 优秀论文/评审经验中提取的写作技法
# ============================================================

# ---------- 摘要 ----------

- id: "writing-abstract-structure"
  source_paper: "多篇国奖论文综合"
  section_type: "摘要"
  keywords: ["摘要", "结构", "三段式", "开头"]
  technique: "三段式摘要结构：问题背景(1-2句) → 方法+结果(每个问题2-3句) → 总结(1-2句)"
  excerpt: "针对[问题背景]，本文建立了[模型1]、[模型2]等数学模型。对于问题一，采用[方法]得到[关键数值结果]；对于问题二，… 最后通过敏感性分析验证了模型的稳健性。"
  why_effective: "评委首先读摘要，三段式结构在30秒内传递所有关键信息：问题→方法→数值结果→稳健性。每个问题必须有具体数值，这是区分一二等奖的关键"
  dos:
    - "每个问题给出至少1个具体数值结果（误差、得分、排名）"
    - "提及敏感性分析和模型评价"
    - "关键词4-5个，覆盖方法+问题域"
  donts:
    - "不要写'取得了较好的效果'这种模糊描述——必须有数字"
    - "不要在摘要中展开公式推导"
    - "不要超过一页"

# ---------- 问题分析 ----------

- id: "writing-problem-analysis"
  source_paper: "多篇国奖论文综合"
  section_type: "问题分析"
  keywords: ["问题分析", "问题重述", "分析思路"]
  technique: "问题分析不是简单复述题目，而是展示分析思路：每个问题先判断类型，再讨论为什么选这个模型，最后概述求解路径"
  excerpt: "问题一要求预测未来趋势，本质是一个时序预测问题。考虑到数据量较小（仅15个年度数据点），且需要不确定性估计，本文拟采用灰色预测GM(1,1)作为基线模型，配合Bootstrap重采样进行置信区间估计。与ARIMA相比，GM(1,1)对数据量的要求更低…"
  why_effective: "展示了对问题的深入理解而不是机械套模板。评委看到'为什么选这个模型+为什么不选那个'的论证过程，会认为建模有思考深度"
  dos:
    - "明确指出问题属于什么类型（预测/评价/优化/分类）"
    - "与备选方案对比，说明选择理由"
    - "概述后续求解路径，让读者有全局预期"
  donts:
    - "不要原封不动复述题目——评委已经知道题目内容"
    - "不要跳过'为什么选这个模型'的论证"

# ---------- 模型假设 ----------

- id: "writing-assumptions"
  source_paper: "多篇国奖论文综合 + 评阅经验"
  section_type: "模型假设"
  keywords: ["假设", "合理性", "justification"]
  technique: "每个假设必须附带Justification——不仅写'假设XXX'，更要写'因为XXX，所以这个假设合理'"
  excerpt: "假设1：服装面内方向温度均匀，传热仅沿厚度方向。\n合理性说明：服装的厚度（约20mm）远小于面内尺寸（约500mm），面内温度梯度可以忽略。类似的一维传热简化在防护服设计文献[1]中被广泛采用。"
  why_effective: "假设是建模的第一步也是扣分重灾区。不加论证的假设会被质疑'凭什么这样假设'。结合物理量级分析和文献支撑的Justification让评审无话可说"
  dos:
    - "每个假设配一段Justification，至少2-3句"
    - "用量级分析（如'厚度<<面内尺寸'）支撑简化假设"
    - "引用文献或题目数据支撑假设"
  donts:
    - "不要写空洞的假设（如'假设系统是线性的'）而不提供理由"
    - "不要列太多假设——6-8个核心假设即可，太多了说明模型太脆弱"

# ---------- 模型建立与求解 ----------

- id: "writing-model-building"
  source_paper: "多篇国奖论文综合"
  section_type: "模型建立与求解"
  keywords: ["模型", "公式", "求解", "参数来源"]
  technique: "模型章节标准五步结构：问题分析→模型构建(含公式推导)→求解方法→结果展示(图表)→结果分析(每图至少3行文字)"
  excerpt: "5.1.1 问题分析\n[简述该问题的特点和挑战]\n\n5.1.2 热传导模型构建\n根据Fourier定律，一维非稳态热传导方程为：\n$$\\frac{\\partial T}{\\partial t} = \\alpha \\frac{\\partial^2 T}{\\partial x^2}$$\n其中热扩散系数α=k/(ρc)由附件数据拟合得到（见4.2节）。\n\n5.1.3 有限差分数值求解\n采用显式FDM格式离散化...\n\n5.1.4 结果展示\n![温度分布图](fig1.png)\n从图1可以观察到..."
  why_effective: "五步结构让论文逻辑严密、可复现。公式中每个参数都必须有来源说明（数据/文献/实验），避免'黑箱魔法'的评审印象"
  dos:
    - "公式参数必须写明从何而来（数据拟合？文献引用？实验测定？）"
    - "每张图至少配3行分析文字，说明趋势、原因、与结论的关系"
    - "关键阈值的选择需有敏感性分析支撑或文献依据"
  donts:
    - "不要写'取α=0.5'而不解释为什么是0.5"
    - "不要只放图不解释——图片不能自己说话"
    - "不要用分点式列表，必须段落式论述"

# ---------- 敏感性分析 ----------

- id: "writing-sensitivity"
  source_paper: "多篇国奖论文综合 + 评审标准"
  section_type: "敏感性分析"
  keywords: ["敏感性分析", "稳健性", "参数", "鲁棒性"]
  technique: "敏感性分析三段式骨架：参数选择与范围设定（±20%）→ 性能指标变化评估 → 可视化支撑（龙卷风图或敏感性曲线）"
  excerpt: "为验证模型对关键参数变化的稳健性，选取以下参数进行敏感性分析：(1)热扩散系数α，变动范围±20%；(2)对流换热系数h，变动范围±15%。图X展示了各参数变动对峰值温度的影响。结果表明，峰值温度对α的变化最为敏感（±20%→±8°C），但对h不敏感（±15%→±1.2°C），说明模型的结论对材料热物性参数有一定的稳健性。"
  why_effective: "敏感性分析是区分一、二等奖的关键章节。它直接回答了评委最关心的问题：'你的结论到底可不可靠？如果参数测错了会怎样？'"
  dos:
    - "明确指出哪些参数需要敏感性分析及理由"
    - "变动范围有依据（如传感器精度、文献范围）"
    - "展示敏感性分析结果如何支撑模型的稳健性"
    - "至少1-2张敏感性图（龙卷风图最直观）"
  donts:
    - "不要只做±10%一刀切——不同参数的合理变动范围不同"
    - "不要只描述结果而不总结结论"
    - "不要在论文最后才做敏感性分析草草了事——这是核心章节"

# ---------- 模型评价 ----------

- id: "writing-model-evaluation"
  source_paper: "多篇国奖论文综合"
  section_type: "模型评价"
  keywords: ["模型评价", "优点", "缺点", "改进"]
  technique: "模型评价遵循'优点>缺点'原则：列出4-5个具体优点（每个有数据/论证支撑），2-3个缺点（每个附改进方向）"
  excerpt: "本文模型的优势在于：(1)物理机理清晰——基于Fourier定律的热传导模型有坚实的物理基础，而非纯数据驱动；(2)数值求解高效——FDM显式格式单次求解耗时<1秒，适合参数扫描；(3)结果可解释——每个参数有明确物理含义。\n\n模型也存在局限性：(1)一维简化忽略了服装横向的热桥效应，对于有金属夹层的服装可能低估热传导——未来可扩展为准三维模型；(2)材料热物性参数来自附件数据反演，若实测条件变化需重新标定。"
  why_effective: "评委想看的是'你对自己模型的认识有多清醒'。优点空泛=对自己的模型没理解，缺点不提=没有批判性思维。具体优缺点+改进方向=成熟的科研素养"
  dos:
    - "优点多于缺点（4-5个优点 vs 2-3个缺点）"
    - "每个优缺点都要有具体依据，不要'精度高'这种空话"
    - "每个缺点附带改进方向，展示前瞻性思考"
  donts:
    - "不要写'模型非常完美'"
    - "不要只写优点不写缺点——这会扣分"
    - "不要写无法改进的根本性缺陷——挑可改进的说"

# ---------- 图表解读 ----------

- id: "writing-figure-caption"
  source_paper: "多篇国奖论文综合"
  section_type: "图表解读"
  keywords: ["图表", "解读", "引用", "Figure", "caption"]
  technique: "每张图需要三个层次：(1)引入句（As shown in Fig.X）→ (2)数据解读（趋势、数值、统计量）→ (3)结论关联"
  excerpt: "As illustrated in Figure 3, the temperature distribution exhibits two distinct phases. During the heating phase (0-120s), the temperature rises rapidly at a rate of approximately 0.8°C/s, consistent with the high thermal conductivity of Layer I. The transition to a slower rate (0.15°C/s) after 120s reflects the insulating effect of Layer II and the air gap (Layer IV). This two-phase behavior confirms that the air gap plays a critical role in thermal protection, supporting our design recommendation of maintaining at least 5mm air gap thickness."
  why_effective: "不只是'如图所示'，而是从图中提取了三个层面的信息：What（什么趋势）→ Why（物理原因）→ So What（与结论的关系）。这让图表从装饰品变成了论据"
  dos:
    - "每张图配至少3行文字分析"
    - "标注关键统计量（r, p, R², RMSE）在正文中"
    - "图表编号统一为Fig.1, Fig.2...或图1, 图2..."
  donts:
    - "不要只写'如图X所示'而不分析图的内容"
    - "不要让图片孤儿化——图片必须在正文中被引用"
    - "不要在图注中重复正文内容"

# ---------- 公式排版 ----------

- id: "writing-equation-style"
  source_paper: "多篇国奖论文综合"
  section_type: "公式排版"
  keywords: ["公式", "编号", "参数说明", "equation"]
  technique: "公式三要素：编号(右对齐)、变量定义(紧跟公式后)、物理含义(natural language连接)"
  excerpt: "热传导方程：\n$$\\frac{\\partial T}{\\partial t} = \\alpha \\frac{\\partial^2 T}{\\partial x^2} \\tag{5}$$\n其中 $T(x,t)$ 为温度分布(°C)，$\\alpha = k/(\\rho c)$ 为热扩散系数(m²/s)，由附件1中材料参数计算得到（见附录A）。$x$ 方向为服装厚度方向，坐标原点设在Layer I外表面。"
  why_effective: "公式不是装饰品——评委逐行检查参数来源。编号方便引用，变量定义紧跟公式避免翻页查找，物理含义说明展示了从数学到物理的翻译能力"
  dos:
    - "行内公式用$...$，独立重要公式用$$...$$并编号"
    - "每个新引入的符号必须在公式后立即解释"
    - "从题目或数据中来的参数要写清出处"
  donts:
    - "不要堆砌公式而不解释——每个公式必须有narrative"
    - "不要用截图代替公式——评委会认为你不懂LaTeX"
    - "不要公式编号跳跃或缺失"
