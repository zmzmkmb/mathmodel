- id: A题_关于零件参数问题的建模
  source_paper: A题 A题_关于零件参数问题的建模
  problem_type: 统计分析+优化
  keywords:
  - 零件容差设计
  - 质量损失函数
  - 混合整数非线性规划
  context: 在批量生产中联合选择各零件参数的标定中心值与离散容差等级，以权衡加工成本、次废品概率和质量损失并最小化单位产品总费用。
  models:
  - name: 正态分布与独立参数模型
    role: 描述零件参数及产品性能指标的随机波动，并计算产品落入合格、次品和废品区间的概率。
    why: 批量加工误差受到多种随机因素共同影响，可近似服从正态分布；零件参数相互独立的假设便于推导产品性能指标的期望、方差及区间概率。
  - name: 分段质量损失模型
    role: 将产品性能指标偏离目标值以及进入次品、废品区间所造成的经济损失量化为单位产品质量损失。
    why: 仅优化加工价格会倾向于选择低精度容差，分段损失函数能够同时体现性能偏差、次品损失和废品损失，使目标函数符合实际质量成本结构。
  - name: 0-1混合整数非线性规划模型
    role: 以连续的零件标定值和离散的容差等级为决策变量，最小化加工成本与期望质量损失之和。
    why: 每个零件只能从有限容差等级中选择一个，需用0-1变量表达互斥选择；质量损失概率依赖正态分布积分及参数均值、方差，因此目标函数具有非线性。
  - name: 递缩网格搜索与离散穷举算法
    role: 先对连续标定值空间进行多轮分点搜索并保留若干低费用候选区域，再在候选点邻域细化搜索，最后穷举容差等级组合完成选优。
    why: 直接对全部连续变量和离散等级进行细网格穷举会产生指数级计算量，而递缩搜索可快速缩小连续变量范围，有限容差等级则适合在小范围内穷举以避免遗漏可选组合。
  solution_flow: 整理零件价格、可选容差等级、标定值范围、性能目标值及次废品界限等数据→假设零件参数独立且近似正态分布，并由容差估计标准差→计算产品性能指标的均值、方差及次废品概率→建立加工成本与期望质量损失之和的0-1混合整数非线性模型→通过三维曲面和等值线分析敏感性并确定初始搜索区间→采用多轮递缩网格搜索连续标定值，保留多个低费用候选点→在候选邻域细化搜索并穷举离散容差等级→比较总费用，输出最优标定值和容差等级方案。
  validation: 先利用目标函数三维曲面与等值线检查不同标定值区域的敏感性和搜索区间合理性，再通过多轮缩小步长观察目标值是否趋于稳定，并在最优点的小邻域内进行最终枚举复核；最后将优化方案与原设计的单位加工成本、质量损失和总费用进行对比，以总费用显著下降作为实例有效性验证。
  visualization:
  - 目标函数三维曲面图
  - 目标函数等值线图
  - 算法流程图
  - 优化前后费用对比表
  pitfalls_avoided:
  - 避免把离散容差等级当作连续变量直接优化，因为连续松弛结果可能对应实际不存在的加工精度；模型使用0-1变量并在最终阶段穷举可选等级。
  - 避免只最小化零件加工成本，因为低价格、低精度方案可能显著增加次品和废品；目标函数同时纳入加工费用与概率意义下的质量损失。
  - 避免在高维参数空间采用统一细步长穷举，因为网格点数量随变量数呈指数增长；先进行粗搜索和敏感性分析，再逐步缩小候选邻域。
  - 避免仅跟踪单个局部低值点，因为非线性目标未被证明为凸函数或单峰函数；每轮保留若干低费用候选点并分别细化，以降低陷入较差局部极值的风险。
  - 避免对所有零件强行设置相同数量的容差等级，因为部分零件可能只有一个可行等级；对不存在的等级予以剔除或直接固定相应0-1变量。
  innovation_points:
  - 将零件标定中心值设计、离散容差等级选择、正态概率计算和分段质量损失统一到一个混合整数非线性优化框架中，实现成本与质量风险的联合决策。
  - 根据目标函数等值线揭示不同参数区域的敏感性差异，并据此设定局部搜索范围，提高搜索针对性。
  - 采用粗网格筛选、多个候选点保留、邻域递缩和末端离散穷举相结合的分层算法，在较低计算量下获得接近全局最优的可实施方案。
- id: A题_A题
  source_paper: A题 A题_A题
  problem_type: 仿真+优化
  keywords:
  - 定日镜场
  - 光学效率
  - 布局优化
  context: 在给定地理、辐照和工程约束下，对塔式太阳能光热电站定日镜场进行光学性能仿真与参数优化，使年平均输出热功率达到60 MW并最大化单位镜面面积年平均输出热功率。
  models:
  - name: 太阳位置与DNI计算模型
    role: 根据纬度、日期、当地时间和海拔计算太阳赤纬角、时角、高度角、方位角及法向直接辐射辐照度。
    why: 太阳方向和DNI是确定定日镜姿态、入射能量及各时点输出热功率的基础输入。
  - name: 定日镜反射姿态几何模型
    role: 由太阳入射方向和镜面中心指向集热器中心的反射方向求取镜面法向量，并据此计算余弦效率。
    why: 定日镜须满足反射定律，镜面法向量决定有效采光面积和反射光线传播方向。
  - name: 阴影遮挡效率模型
    role: 通过太阳光方向投影和反射光路相交判定，计算相邻定日镜对目标镜面的入射阴影与出射遮挡面积比例。
    why: 高密度镜场中阴影和遮挡是主要光学损失，且与太阳位置、镜场布局和镜面尺寸强相关。
  - name: 大气透射率模型
    role: 依据镜面中心到集热器中心的距离计算反射光传播过程中的大气衰减。
    why: 不同位置定日镜的传播距离不同，忽略该损失会高估远端镜面的能量贡献。
  - name: 锥形光线追迹与截断效率模型
    role: 考虑太阳张角，将镜面反射光建模为锥形光束，通过几何光线追迹或蒙特卡罗采样计算落入圆柱形集热器表面的能量比例。
    why: 太阳光并非严格平行光，集热器尺寸有限，必须刻画光斑溢出造成的截断损失。
  - name: 镜场光学效率与热功率集成模型
    role: 综合阴影遮挡、余弦、大气透射、截断和反射率效率，按镜面面积加权汇总各时点及年平均输出热功率。
    why: 该模型将各类局部光学损失统一映射为题目要求的月平均和年平均性能指标。
  - name: 约束布局优化模型
    role: 以单位镜面面积年平均输出热功率最大为目标，联合优化吸收塔坐标、镜面尺寸、安装高度、镜面数量及镜面位置，并满足额定功率和工程约束。
    why: 设计变量同时包含连续变量、离散数量和高维空间坐标，目标函数非线性、非凸且需通过光学仿真计算。
  - name: 分层启发式求解模型
    role: 先利用环形、交错或径向布局生成可行解，再通过遗传算法、粒子群或模拟退火搜索全局参数，最后进行局部位置调整和镜面增删。
    why: 直接对全部镜面坐标进行穷举不可行，分层求解可降低维度并提高获得高质量可行解的概率。
  solution_flow: 数据→读取地理位置、场地边界、集热器参数、镜面约束及12个月共60个计算时点→建立太阳位置和DNI模型→计算每面定日镜法向量及余弦效率→通过邻域筛选与几何投影计算阴影遮挡效率→计算大气透射率并用锥形光线追迹求截断效率→汇总月均和年均光学效率、总热功率及单位面积热功率→以塔位、镜面尺寸、高度、数量和坐标为决策变量建立约束优化模型→采用规则布局初始化与启发式算法迭代求解→校核60
    MW功率、边界、禁建区、间距和离地安全约束→对最优方案进行精细仿真与结果复算。
  validation: 首先使用反射定律、效率取值范围和能量守恒进行理论校验，确保各分项效率均位于0到1且总效率等于各分项效率乘积；其次选取正午、对称位置和无相邻镜面的简化场景进行几何解析对照；再次提高镜面网格或蒙特卡罗光线采样数量，检验阴影遮挡率与截断效率的数值收敛性；随后逐面检查场地半径、塔周100
    m禁建区、镜间最小距离、边长范围、安装高度及旋转不触地约束；最后对优化结果重新计算全部60个时点，并通过多次随机初始化和参数敏感性分析验证额定功率满足程度及方案稳定性。
  visualization:
  - 定日镜场平面布局图
  - 太阳轨迹与入射方向图
  - 月度光学效率及分项效率折线图
  - 月度输出热功率柱状图
  - 镜场空间效率热力图
  - 优化算法收敛曲线
  pitfalls_avoided:
  - 避免直接对太阳方位角的反余弦结果定象限，因为反余弦无法区分上午和下午，需结合太阳时角符号确定方位，否则镜面法向和遮挡方向会被错误翻转。
  - 避免将所有时点的效率作简单平均后再乘平均DNI，因为功率应按各时点的DNI与面积加权光学效率逐时计算后平均，否则会忽略辐照度与效率的相关性。
  - 避免将太阳光视为严格平行光并把集热器视为点目标，因为太阳张角和有限尺寸集热器会导致明显的光斑溢出，从而高估截断效率。
  - 避免仅以镜面中心连线判断阴影与遮挡，因为真实损失取决于镜面多边形投影的重叠面积，中心线判定会漏判部分遮挡或夸大完全遮挡。
  - 避免对任意两面定日镜进行全时段全组合精确相交计算，因为其复杂度接近镜面数量的平方；应先按太阳方向、反射方向和空间距离建立候选邻域，再进行精确几何计算。
  - 避免使用算术平均定义镜场平均效率，因为镜面面积在问题3中可以不同，应按镜面面积或入射能量加权，否则不同尺寸镜面的贡献会被错误等同。
  - 避免只验证60 MW功率而忽略工程可行性，因为塔周禁建区、圆形边界、镜间距和旋转离地约束均可能使数值最优解无法施工。
  - 避免把当地时间直接等同于真太阳时而不说明假设，因为经度及时差修正会影响太阳时角；若严格沿用题目给定公式，应明确采用题设口径并保持所有时点一致。
  innovation_points:
  - 采用规则环形交错布局与高维启发式优化相结合的分层策略，将塔位和镜面公共参数的全局搜索与单镜位置的局部调整分离，在保证可行性的同时降低优化维度。
  - 使用空间索引和方向性候选邻域筛选阴影遮挡镜对，只对可能发生光路重叠的镜面进行精确投影计算，从而显著降低大规模镜场仿真的计算量。
  - 针对不同尺寸和不同安装高度的情形构建单镜边际贡献指标，以新增镜面带来的年平均热功率与新增面积之比指导镜面选择、增删和位置调整。
  - 采用粗精两级光学计算：优化阶段使用低分辨率网格或少量光线快速评价，候选最优方案再使用高分辨率光线追迹复算，以兼顾搜索效率和结果精度。
- id: 2020_D008
  source_paper: 2020 2020_D008
  problem_type: 统计分析
