- id: Problems_D题
  source_paper: Problems Problems_D题
  problem_type: 优化+仿真+统计分析
  keywords:
  - 湖羊繁育周期调度
  - 羊栏空间利用率
  - 多阶段随机优化
  context: 在湖羊繁殖、哺乳和育肥等阶段具有不同栏位容量及周期约束的条件下，优化种羊规模与配种计划，并针对受孕率、产羔数和生产周期波动制定低期望损失的动态预案。
  models:
  - name: 繁育周期与栏位需求核算模型
    role: 根据交配、怀孕、哺乳、休整和育肥阶段的持续时间及单栏容量，计算每批母羊在各时段的羊栏需求、母羊周转周期和年化出栏量。
    why: 各生产阶段存在明确的时间衔接和容量上限，采用周期守恒关系与向上取整的栏位需求函数可以准确描述羊群流转和空间占用。
  - name: 稳态产能与容量边界模型
    role: 估算112个标准羊栏下合理的种公羊、基础母羊数量及年化出栏范围，并计算实现年出栏1500只所需的羊栏缺口。
    why: 连续生产达到稳定状态后，各阶段平均在栏数量可由生产节拍和阶段停留时间确定，适合利用Little定律、周期比例和整数栏位修正分析长期产能。
  - name: 时间索引整数规划模型
    role: 以每日或批次为时间单位，确定各时点开始配种的母羊数量、种公羊配置及不同生产阶段的羊栏分配，使年化出栏量最大。
    why: 配种批次、羊只数量和羊栏数量均具有整数性，同时存在阶段容量、繁育周期、公母比例和总栏数等离散约束，整数规划能够给出可执行的具体生产计划。
  - name: 多阶段随机规划模型
    role: 将配种作为前置决策，将受孕识别、分娩、断奶、休整和育肥阶段的栏位调整作为后续补救决策，最小化空栏损失与租栏损失之和的期望。
    why: 受孕率、受孕时间、孕期和产羔数具有不确定性，而且当前决策不可根据未来信息反向修改，符合情景树下多阶段决策与非预见性约束的结构。
  - name: 蒙特卡洛情景仿真模型
    role: 生成不同受孕、分娩日期、产羔数和哺乳期组合的生产情景，评估候选计划的栏位短缺概率、平均损失、年化出栏量和风险水平。
    why: 随机因素共同作用后难以得到简单的解析分布，仿真可以复现羊群逐日流转，并检验优化方案在大量可能情景下的稳健性。
  - name: 滚动时域调度与预案集模型
    role: 在受孕结果识别、分娩和断奶等信息逐步揭示后，从预案集中选择对应的栏位重排、断奶日和休整期方案。
    why: 题目允许哺乳期和休整期在一定范围内调控，也允许日期相差不超过7天的羊群合栏，滚动更新可利用新信息降低长期空置与临时租栏损失。
  solution_flow: 数据→整理各阶段持续时间、单栏容量、公母配置比例、受孕率、产羔分布及空栏和租栏损失参数→建立单批母羊从配种到再次配种以及羔羊从出生到出栏的状态转移模型→利用稳态容量模型计算基础母羊规模、种公羊数量、年化出栏范围和1500只目标下的栏位缺口→将配种日期与批量设为整数决策变量，建立逐日羊栏容量约束并求解最大年化出栏量的确定性计划→依据受孕时间、孕期和产羔数构造情景树或蒙特卡洛样本，将哺乳期、断奶期、休整期及合栏安排设为情景相关补救决策→以空栏每天损失1和缺栏每天损失3构造期望损失目标，求解多阶段随机计划及对应预案集→通过多周期仿真和敏感性分析验证可行性、产能与稳健性。
  validation: 先进行羊只流量守恒、阶段时间衔接、单栏容量、公母比例和总栏数约束检查，再将整数规划结果与稳态理论上界进行对照；对随机方案开展多次独立蒙特卡洛仿真，统计平均年化出栏量、平均损失、羊栏利用率、租栏概率、最大缺口和损失分位数，并采用样本外情景检验避免仅适应训练情景；最后改变受孕率、产羔均值、哺乳期、孕期波动及租栏损失系数进行敏感性和极端情景测试。
  visualization:
  - 羊群生产周期与状态转移图
  - 配种批次及羊栏占用甘特图
  - 逐日羊栏需求与112栏容量对比曲线
  - 不同方案年化出栏量与期望损失对比图
  - 随机情景下羊栏缺口和总损失分布图
  pitfalls_avoided:
  - 羊栏需求必须对每个阶段分别向上取整，不能直接用羊只总数除以栏容量后取平均，否则会低估小批次和阶段切换造成的碎片化占栏。
  - 不能只依据各阶段平均栏位需求判断方案可行，因为不同批次的怀孕、哺乳和育肥需求可能在同一日期叠加，必须执行逐日容量校验。
  - 种公羊数量既要满足不低于1:50的总体配置要求，也要满足同一配种批次每栏1只公羊的并发需求，否则总体比例合格的方案仍可能无法实施。
  - 确定性问题中的每胎2只不能直接替代随机问题中的受孕率和产羔分布；同时应区分用于栏位调度的实际存栏情景与用于估算产出的平均死亡率，避免重复扣减羔羊数量。
  - 随机计划不能使用未来才会获知的受孕或产羔信息修改先前配种决策，需设置非预见性约束，否则会得到实际无法执行的理想化结果。
  - 允许7天内合栏不等于任意跨批次混栏，必须同时检查分娩日或断奶日差值、生产阶段一致性和单栏容量，否则会违反防疫与饲养规则。
  - 只追求栏位满载可能导致高峰期频繁租栏，由于缺栏损失是空栏损失的3倍，应保留适度安全余量并优化不对称损失，而不是单纯最大化平均利用率。
  innovation_points:
  - 将湖羊繁育过程表示为具有固定与随机停留时间的离散状态流网络，在同一框架内联结母羊再繁殖循环、羔羊育肥流程和羊栏容量约束。
  - 采用多阶段情景树描述信息逐步揭示过程，把固定配种计划与受孕识别后、分娩后和断奶后的补救安排组合成可执行预案集。
  - 利用35至45天哺乳期与育肥期之间的替代关系、休整期下限以及7天合栏窗口形成柔性调度手段，以削减羊栏需求峰值。
  - 在期望损失目标中显式区分空栏成本和租栏成本，并结合样本外仿真评价出栏能力、平均成本和缺栏风险，实现产能与空间稳健性的平衡。
- id: 1992_92建模题目
  source_paper: 1992 1992_92建模题目
  problem_type: 统计分析+预测+优化
  keywords:
  - 施肥效应曲线
  - 回归与最优施肥
  - 整数分解
  context: 研究氮磷钾施肥量与土豆、生菜产量的响应关系及最优施肥方案，同时求解蛋白质分子量由已知氨基酸分子量组成的整数分解问题。
  models:
  - name: 一元二次肥效回归模型
    role: 分别拟合氮、磷、钾施用量与作物产量之间的非线性关系，并估计最大产量对应的施肥量。
    why: 作物产量通常随施肥量先增加后趋于饱和或下降，二次函数能够用少量参数表达边际产量递减和过量施肥减产现象。
  - name: 分段回归或饱和响应模型
    role: 作为二次模型的改进方案，刻画低施肥区快速增产、高施肥区平台化或缓慢下降的响应特征。
    why: 部分磷、钾数据没有清晰的抛物线峰值，直接使用二次函数可能产生不合理外推，分段模型或Mitscherlich型饱和模型更符合农学机理。
  - name: 经济最优施肥模型
    role: 在肥效函数基础上综合作物价格与肥料成本，以净收益最大化而非单纯产量最大化确定推荐施肥量。
    why: 最大产量点通常不是经济效益最优点，将边际产值与边际施肥成本比较可提高结果的实际应用价值。
  - name: 非负整数线性方程模型
    role: 将分子量分解表示为求解方程X等于各氨基酸分子量与其非负整数个数乘积之和。
    why: 氨基酸出现次数必须是非负整数，且候选组合必须严格满足总分子量约束，因此可自然建模为线性丢番图方程。
  - name: 动态规划与回溯枚举模型
    role: 在拥有计算机时判断给定分子量是否可达，并恢复一个或全部氨基酸组成方案。
    why: 分子量上限为1000，状态空间较小，动态规划可避免大量重复搜索，回溯指针能够输出具体分解结果。
  - name: 生成函数与模约束筛选模型
    role: 在无微型计算机或讨论一般情形时，通过系数判定、同余关系和上下界缩小候选组合范围。
    why: 生成函数可统一描述所有非负整数分解，同余筛选能够排除不可能组合，便于手工制表和理论分析。
  solution_flow: 先整理土豆、生菜的氮磷钾施肥量与产量数据，核对单位、固定水平和异常记录；绘制散点图并分别拟合二次、分段或饱和肥效模型，通过最小二乘法估计参数，计算产量最优点和经济最优施肥量，再利用残差、拟合优度及模型比较评价稳定性；对分子量分解问题建立非负整数方程，在计算机条件下采用动态规划判定可达性并回溯全部组合，在无计算机条件下利用最大使用次数、同余条件、生成函数或预制查表逐层筛选，最后对每个候选组合重新求和验证。
  validation: 肥效模型采用散点趋势检查、残差图、决定系数、均方误差和留一交叉验证比较不同函数形式，并检查最优点是否位于实验施肥区间内，可通过重复田间试验及最优点附近加密试验进行外部验证；整数分解结果需逐项检查系数为非负整数并重新计算加权和是否严格等于X，同时用穷举与动态规划结果交叉核对，并测试无解、唯一解和多解样例。
  visualization:
  - 施肥量—产量散点图及拟合曲线
  - 边际产量或净收益曲线
  - 模型残差图
  - 分子量动态规划可达状态图
  - 氨基酸组成方案堆叠条形图
  pitfalls_avoided:
  - 避免未经核对直接使用表格中的疑似录入或排版异常值，因为个别施肥量顺序或产量记录可能失真，并会显著拉动二次曲线顶点和最优施肥量。
  - 避免把单因素控制实验直接解释为完整的氮磷钾联合效应，因为每次只改变一种营养素且另外两种固定在第七水平，现有数据无法可靠识别营养素之间的交互作用。
  - 避免将二次回归曲线外推到实验范围之外，因为抛物线在远离样本区间后可能预测负产量或虚假的下降趋势，推荐量应限制在可验证的施肥区间内。
  - 避免只按最大产量确定施肥量，因为高投入带来的少量增产可能不足以覆盖肥料成本，还会增加环境污染风险，应优先报告经济最优区间。
  - 避免在整数分解中使用普通实数方程求解，因为连续解或负系数不代表可实现的氨基酸个数组合，必须显式施加非负整数约束。
  - 避免只输出第一个整数分解方案，因为同一分子量可能对应多个氨基酸组合，若不枚举或说明解的数量会遗漏质谱分析中的结构歧义。
  innovation_points:
  - 将产量最优、经济最优和环境约束下的推荐施肥量分层报告，并用最优点附近的置信区间代替单一精确数值。
  - 针对不同肥效曲线形态进行模型竞争，由二次模型、分段模型和饱和模型共同拟合后依据预测误差及农学合理性选模。
  - 把整数分解的可达性判断与方案恢复分离，利用动态规划快速判定、前驱回溯输出全部组合，并结合最大公约数和同余条件预筛选。
  - 针对有计算机和无计算机两种场景分别设计算法：前者采用动态规划或分支定界，后者采用查表、上下界及模运算，兼顾计算效率与手工可操作性。
- id: A题_09年A题
  source_paper: A题 A题_09年A题
  problem_type: 仿真+优化+综合评价
  keywords:
  - 等效转动惯量
  - 离散反馈控制
  - 能量误差
  context: 通过飞轮机械惯量与电动机补偿扭矩共同模拟车辆单轮路试制动过程，并以制动能量误差评价和改进试验台控制方法。
  models:
  - name: 平动能量—转动能量等效模型
    role: 将车轮承受载荷对应的车辆平动惯性折算为试验台主轴上的等效转动惯量。
    why: 在无滑动条件下有v=rω，令车辆平动动能与试验台转动动能相等，可得J_eq=(F/g)r²，从而统一路试与台架试验的能量尺度。
  - name: 环形飞轮惯量与组合配置模型
    role: 计算各飞轮的转动惯量，枚举基础惯量与不同飞轮子集形成的机械惯量，并选择合适配置。
    why: 飞轮为规则环体，可用J=(1/2)ρπh(R²-r²)(R²+r²)准确计算；飞轮只能装入或拆除，因此机械惯量选择本质上是离散组合优化问题。
  - name: 虚拟惯量电机补偿模型
    role: 利用电动机扭矩补偿等效惯量与机械惯量之差，使试验台角减速度和能量消耗尽量等效于路试。
    why: 机械飞轮无法连续取值，而电动机可产生受控扭矩，按照M_e=(J_eq-J_m)α构造虚拟惯量，可弥补机械惯量配置的离散性。
  - name: 扭矩—电流线性映射模型
    role: 把理论补偿扭矩转换为试验台可执行的电动机驱动电流。
    why: 题目给定电流与电机扭矩成正比，因此可用I=kM_e，其中k=1.5 A/(N·m)，直接连接动力学模型与控制执行量。
  - name: 离散时间反馈控制模型
    role: 根据上一时间段观测到的角速度、角减速度或制动扭矩，逐段计算下一时间段的驱动电流。
    why: 实际系统只能获得离散观测值，且制动器扭矩随时间变化、难以预先精确建模，因此采用滚动计算的反馈控制比固定电流控制更适合工程实现。
  - name: 累计能量误差评价与校正模型
    role: 比较目标路试制动能量与试验台制动器实际消耗能量，并将累计误差用于控制性能评价和闭环修正。
    why: 题目明确以能量误差作为核心指标；采用离散积分E_b≈ΣM_b,kω_kΔt计算实际制动能量，可同时反映整个制动过程的扭矩与转速偏差。
  solution_flow: 输入车轮载荷、滚动半径、飞轮尺寸与密度、基础惯量及离散观测数据→由v=rω和动能等效关系计算等效转动惯量→计算各环形飞轮惯量并枚举机械惯量组合，在电机可补偿范围内选择使惯量差较小的配置→建立主轴转动动力学方程，计算补偿惯量、补偿扭矩及对应电流→按10
    ms步长利用上一时段的转速差分或观测扭矩生成下一时段电流→离散积分得到目标能量、实际制动能量和累计能量误差→检查终止转速、补偿范围和控制稳定性，并用能量误差反馈进一步修正电流。
  validation: 首先进行量纲与极限检验，确认J_eq=(F/g)r²的单位为kg·m²，且当J_eq=J_m时补偿电流应为零；其次核验飞轮组合是否包含基础惯量且补偿差值位于[-30,30]
    kg·m²；再用恒减速度算例比较理论角速度轨迹、理论恒定补偿电流与离散控制结果；对于给定试验数据，分别计算目标路试能量E_target=(1/2)J_eq(ω_0²-ω_1²)和试验台制动器能量E_test≈ΣM_b,kω_kΔt，以绝对能量误差和相对能量误差评价控制效果，同时检查末转速、瞬时电流限幅及累计误差是否收敛。
  visualization:
  - 角速度—时间曲线及目标轨迹对比图
  - 驱动电流—时间阶梯曲线
  - 制动扭矩—时间曲线
  - 累计能量误差—时间曲线
  - 机械惯量组合与补偿惯量分布图
  pitfalls_avoided:
  - 不能直接将6230 N当作质量代入惯量公式；载荷是力，必须先除以重力加速度得到等效质量，否则惯量会多出约g倍。
  - 不能忽略无滑动约束v=rω；等效惯量的推导依赖平动速度与主轴角速度的对应关系，遗漏半径平方会造成量纲和数值错误。
  - 计算环形飞轮惯量时不能使用实心圆盘公式；内孔会同时影响质量和惯量，必须采用环体几何参数计算。
  - 机械惯量必须包含不可拆卸的基础惯量，且飞轮只能形成离散子集组合；把飞轮惯量当作连续可调会得到无法实现的配置。
  - 电机补偿扭矩的正负号不能只按惯量差的绝对值确定；机械惯量不足时电机应提供同向驱动扭矩，机械惯量过大时则需要反向补偿。
  - 不能只比较初末转速判断控制方法优劣；即使终点一致，中间过程的制动器能量仍可能偏离路试，应计算全过程扭矩与角速度乘积的积分。
  - 直接使用上一时段观测量会引入一个采样周期的滞后，在制动扭矩突变时产生系统性能量偏差；需要加入预测、平滑或累计能量误差反馈。
  - 由相邻转速差估计角减速度时不能忽略噪声放大和电流突变问题；工程实现中应采用滑动平均、低通滤波及电流限幅。
  innovation_points:
  - 将电动机扭矩解释为可正可负调节的虚拟惯量，使离散飞轮组合能够模拟连续取值的车辆等效惯量。
  - 采用扭矩或角减速度前馈与累计能量误差反馈相结合的双层控制：前馈保证瞬时动力学近似一致，能量闭环消除离散滞后和模型偏差造成的累计误差。
  - 把飞轮组合选择与电机补偿能力联合优化，在满足补偿范围的前提下优先减小惯量差、电流峰值和控制能耗。
- id: B题_B题
  source_paper: B题 B题_B题
  problem_type: 优化+仿真
  keywords:
  - 多波束测深
  - 覆盖宽度与重叠率
  - 测线布设优化
  context: 针对平面斜坡及真实起伏海底，在满足覆盖完整性和条带重叠率要求的条件下优化多波束测量船的测线方向、间距与总长度。
  models:
  - name: 倾斜海底多波束几何覆盖模型
    role: 利用换能器开角、水深和海底坡度计算波束两侧与海底的交点，从而得到真实覆盖宽度。
    why: 平坦海底下的覆盖宽度公式无法反映坡面两侧覆盖范围不对称的问题，必须通过波束射线与海底坡面的几何关系建模。
  - name: 相邻条带重叠率模型
    role: 根据相邻测线间距以及两条测线朝向相邻区域的单侧覆盖宽度，计算实际重叠率并识别漏测区域。
    why: 在水深随位置变化的条件下，直接采用固定覆盖宽度计算重叠率会产生偏差，使用相邻条带边界能够准确刻画重叠或间隙。
  - name: 任意航向等效横向坡度模型
    role: 将海底坡面沿测线法向的高程变化投影到垂直测线的剖面内，建立覆盖宽度关于航向夹角、坡度和船位的函数。
    why: 多波束条带主要在垂直航迹方向展开，只有海底坡度在该方向上的分量直接影响覆盖宽度，因此需要进行方向投影。
  - name: 规则斜坡海域测线优化模型
    role: 以测线总长度最小为目标，以海域完全覆盖及相邻条带重叠率处于10%至20%为约束，联合确定测线方向、数量和位置。
    why: 测线方向会同时影响单条测线长度、有效横向坡度、覆盖宽度和所需测线数量，需进行全局权衡而不能仅局部设置固定间距。
  - name: 真实海底地形插值模型
    role: 根据离散单波束水深数据重建连续海底表面，并估计任意位置的水深、坡度和坡向。
    why: 附件数据仅给出离散网格或采样点水深，而覆盖边界计算和测线优化需要连续位置上的地形参数。
  - name: 复杂海域覆盖布线优化与栅格仿真模型
    role: 在重建地形上生成候选测线，动态调整线间距，并通过栅格或多边形叠加统计漏测面积、重复覆盖程度和测线总长度。
    why: 真实海底起伏使覆盖条带边界呈非规则形状，难以仅凭解析公式评价整体方案，需要数值仿真完成覆盖判定和多目标权衡。
  solution_flow: 读取海域边界、中心水深、坡度、开角及附件测深数据并统一海里与米的单位→建立波束射线与海底坡面的交点模型，推导单侧覆盖宽度、总覆盖宽度和相邻条带重叠率→通过航向投影得到任意测线方向下的等效横向坡度，并计算题设表格→以完全覆盖、重叠率10%至20%为约束，以测线总长度最短为目标搜索规则斜坡海域的测线方向与位置→对真实水深数据进行地形插值，采用自适应间距生成和优化测线→利用栅格或多边形覆盖仿真计算总长度、漏测面积比例及重叠率超过20%的长度→通过边界检查、极限情形和数值复算验证结果。
  validation: 首先在坡度为0的极限情形下检验模型是否退化为平坦海底公式W=2D·tan(θ/2)，并检查航向旋转180度时覆盖宽度的对称性；其次将解析得到的波束端点代回海底平面方程，验证交点和距离计算；再逐对检查相邻测线的重叠率是否落在10%至20%范围内，并对海域边界进行首末条带覆盖检查；对于真实地形，采用加密栅格或多边形叠加复算覆盖次数，统计漏测率和过度重叠指标，同时通过改变栅格分辨率、插值方法及关键参数开展敏感性分析。
  visualization:
  - 多波束射线与倾斜海底交点几何示意图
  - 覆盖宽度随船位和航向变化的曲线图或热力图
  - 规则海域测线与覆盖条带平面布设图
  - 真实海底水深等高线图或三维地形图
  - 覆盖次数栅格图
  - 漏测区与重叠率超过20%区域分布图
  pitfalls_avoided:
  - 避免直接使用W=2D·tan(θ/2)处理倾斜海底，因为坡面会使左右单侧覆盖宽度不相等，并导致覆盖宽度和重叠率被系统性误估。
  - 避免仅以海区平均水深或最浅水深设置固定测线间距，因为前者会在浅水区产生漏测，后者会在深水区造成严重重复覆盖和航程浪费。
  - 避免用η=1-d/W中的单一固定W评价变水深条件下的相邻条带，因为两条测线在相邻方向上的单侧覆盖范围不同，应依据实际条带边界计算交叠量。
  - 避免忽略航向与坡向的夹角，因为多波束覆盖由垂直测线方向上的坡度分量决定，将真实坡度直接代入会错误估计不同航向的覆盖宽度。
  - 避免混用海里和米，因为测线坐标、海域尺度与水深单位不同，未统一单位会使坡度、水深变化量和覆盖宽度出现数量级错误。
  - 避免只检查相邻条带重叠率而不检查海域边界，因为内部测线满足约束并不代表首条和末条条带能够覆盖矩形边缘。
  - 避免将插值后的真实海底视为规则平面，因为局部坡度和坡向持续变化，固定解析间距可能遗漏局部凸起或浅滩区域。
  - 避免用过粗栅格评估覆盖面积，因为狭窄漏测带和局部过度重叠区可能被栅格离散化掩盖，应通过网格加密验证统计结果收敛。
  innovation_points:
  - 将覆盖宽度拆分为左右单侧覆盖距离，并用相邻条带实际边界定义重叠率，从而统一描述斜坡条件下的非对称覆盖、正常重叠与漏测。
  - 利用坡度在测线法向上的投影建立航向相关覆盖模型，把测线方向、覆盖效率和航程长度纳入同一优化框架。
  - 针对真实起伏地形采用连续地形重建、局部覆盖计算与自适应测线间距相结合的方法，降低浅水区漏测和深水区冗余。
  - 通过解析几何模型与栅格或多边形覆盖仿真双重评价，同时输出总航程、漏测面积比例和过度重叠长度，使布线方案具有可验证性和工程可实施性。
- id: A_CUMCM2021-A
  source_paper: A A_CUMCM2021-A
  problem_type: 优化+仿真
  keywords:
  - 旋转抛物面拟合
  - 促动器约束优化
  - 电磁波反射光线追迹
  context: 在FAST主动反射面的机械调节约束下，将300米口径区域由基准球面调整为尽量接近指定焦点和观测方向的旋转抛物面，并评估馈源舱的信号接收效果。
  models:
  - name: 观测方向与局部坐标变换模型
    role: 根据方位角和仰角确定天体来波方向、抛物面对称轴及焦点位置，并将三维曲面问题转换到以观测方向为轴的局部坐标系中。
    why: 任意观测方向下直接使用全局坐标描述旋转抛物面较复杂，局部坐标变换可统一处理天顶方向和倾斜方向两种情形。
  - name: 受约束理想旋转抛物面优化模型
    role: 以馈源舱中心P为焦点、直线SC为对称轴，通过优化抛物面顶点或焦距参数，使可调节点到理想抛物面的总体偏差最小。
    why: 焦点和轴线由观测任务确定，但抛物面顶点仍需结合促动器行程、索长变化和口径范围等约束进行优化，不能仅由几何焦距直接指定。
  - name: 主索节点与促动器运动学模型
    role: 利用促动器沿基准球面径向伸缩、下拉索长度不变的几何关系，将目标节点坐标转换为各促动器伸缩量。
    why: 促动器伸缩量并不等同于节点的简单径向位移，必须同时满足促动器运动方向和下拉索定长条件。
  - name: 非线性约束曲面拟合模型
    role: 联合确定300米口径内节点的调节位置，使其尽量贴合理想抛物面，同时约束促动器伸缩量在-0.6至0.6米内、相邻主索长度变化率不超过0.07%。
    why: 节点位置、索段长度和抛物面误差之间具有非线性关系，需要通过带边界及几何约束的数值优化获得可实施方案。
  - name: 三角反射面光线追迹模型
    role: 以三角面板三个节点确定面板法向量，根据镜面反射定律计算反射光线与馈源接收平面的交点，并统计落入直径1米圆盘内的信号。
    why: 馈源接收比由离散面板的空间姿态和反射方向共同决定，无法只用节点到抛物面的拟合误差代替。
  - name: 面积加权接收比模型
    role: 按各三角面板对入射方向的有效投影面积加权，计算进入馈源有效圆盘的反射信号与300米口径总反射信号之比。
    why: 不同面板的面积和入射倾角不同，简单统计命中面板数量会造成接收比偏差。
  solution_flow: 读取主索节点、促动器端点和三角面板拓扑数据并校验编号映射→由方位角和仰角构造观测单位向量，求直线SC与焦面的交点P→建立以SC为轴的局部坐标系，按垂直于轴线的投影距离筛选300米口径区域→以P为焦点建立旋转抛物面方程，以节点曲面偏差最小为目标，并加入促动器行程、下拉索定长和主索长度变化率约束→采用非线性优化求解抛物面顶点、节点坐标及促动器伸缩量→由调节后的三角面板计算法向量，利用反射定律进行光线追迹→按投影面积统计馈源直径1米有效区域内的信号，得到工作抛物面接收比→对基准球面采用相同算法计算接收比并进行对照验证。
  validation: 首先检查抛物面顶点、焦点和轴线是否共线，并验证每个目标节点代入抛物面方程后的残差；其次逐项核验促动器伸缩量是否位于-0.6至0.6米、下拉索长度是否保持不变、所有相邻主索长度变化率是否不超过0.07%；再检查调节后节点到理想抛物面的均方根误差和最大误差，并验证300米口径节点筛选是否基于轴向投影；最后通过反射角等于入射角、反射线与接收平面交点计算和面积守恒检查验证光线追迹程序，并将工作抛物面接收比与基准球面接收比及天顶对称情形进行对比。
  visualization:
  - 基准球面、理想抛物面与调节后反射面的三维叠加图
  - 节点到理想抛物面的误差云图
  - 促动器伸缩量空间分布图
  - 主索长度变化率分布图
  - 反射光线及馈源接收圆盘命中散点图
  - 工作抛物面与基准球面接收比对比柱状图
  pitfalls_avoided:
  - 不能把促动器伸缩量直接等同于主索节点径向位移，因为节点与促动器顶端之间存在定长下拉索，忽略该几何关系会得到机械上不可执行的调节量。
  - 不能仅按节点到某个空间点的欧氏距离筛选300米口径区域，应按节点在垂直于观测轴平面上的投影半径筛选，否则倾斜观测时会选错参与调节的节点和面板。
  - 不能只最小化节点到抛物面的代数方程残差而忽略量纲和几何意义，应采用法向距离、径向交点误差或归一化残差，否则不同位置节点的拟合权重会失真。
  - 不能将接收比简单定义为命中面板数占总面板数，因为三角面板面积及其对来波方向的投影面积不同，应进行有效面积加权。
  - 不能用单个节点法向量代表整块反射面板的反射方向，应由三角面板三个调节后顶点计算面法向量，否则无法体现面板姿态变化。
  - 不能忽略方位角、仰角的坐标约定和角度单位，方向向量符号或弧度转换错误会同时导致焦点、口径区域和反射方向全部偏离。
  innovation_points:
  - 构建观测方向局部坐标系，将天顶和非天顶观测统一为轴对称抛物面优化问题，并用轴向投影口径实现任意方向下的准确区域筛选。
  - 将理想抛物面参数优化、促动器与下拉索运动学、主索长度变化约束联合起来，使几何拟合结果同时满足实际机械可实施性。
  - 采用三角面板级光线追迹与投影面积加权接收比，将曲面拟合误差进一步映射为馈源舱的实际接收性能指标。
- id: 2021_E025
  source_paper: 2021 2021_E025
  problem_type: 统计分析
  keywords:
  - 文本重复
  - 有效信息缺失
  - 内容完整性审查
  context: 所提供内容仅包含微信公众号推广水印的重复文本，未包含可识别的问题背景、数据、公式或论文正文。
  models:
  - name: 文本重复频次统计
    role: 识别材料中的重复片段并判断是否存在有效论文内容
    why: 输入文本几乎完全由相同推广信息构成，只能通过重复频次和内容完整性检查确认正文缺失，无法可靠提取原论文的数学模型
  solution_flow: 原始文本→清洗重复水印→统计文本片段频次与有效信息占比→检查问题、数据、公式和结论等关键要素→确认论文正文缺失→不进行模型与结论臆测
  validation: 通过逐段去重、关键词检索以及问题背景、变量、公式、求解结果和验证章节的完整性检查进行交叉验证；结果表明除重复推广水印外没有可用于建模知识提取的正文。
  visualization:
  - 重复文本频次条形图
  - 有效信息与水印文本占比饼图
  pitfalls_avoided:
  - 避免根据微信公众号名称或水印内容臆造论文主题，因为这些信息不能反映实际建模问题
  - 避免虚构模型、参数和验证结果，因为输入中不存在公式、数据或求解过程，强行提取会造成事实性错误
  innovation_points:
  - 采用内容完整性审查先判断材料是否满足建模知识提取条件
  - 在正文缺失时保留可核验的文本统计结论并明确限制，避免生成未经材料支持的建模信息
- id: 2020_A212
  source_paper: 2020 2020_A212
  problem_type: 统计分析
  keywords:
  - 重复水印文本
  - 正文缺失
  - 内容有效性检测
  context: 所提供材料仅包含反复出现的微信公众号推广水印，未包含可用于提取建模方案的论文正文。
  models:
  - name: 重复文本频次统计
    role: 识别高频重复片段并判断输入材料是否包含有效论文内容
    why: 材料中的文本块高度重复，利用频次统计可客观区分水印噪声与潜在正文
  - name: 文本去重与有效内容检测
    role: 删除重复水印并检查剩余文本能否支撑模型、流程和结论的提取
    why: 去重后无实质性论文内容，可避免根据水印信息虚构建模方法
  solution_flow: 原始文本→重复片段识别与频次统计→水印去重→有效正文检测→确认正文缺失→停止建模知识推断并建议补充原论文内容
  validation: 比较去重前后的文本长度、唯一文本块比例和建模术语覆盖情况，并通过人工复核确认去重后未出现问题描述、变量定义、模型公式、求解结果或验证内容。
  visualization:
  - 重复文本频次柱状图
  - 去重前后文本长度对比图
  pitfalls_avoided:
  - 避免从微信公众号名称和推广语臆测论文研究主题，因为这些内容与具体建模问题无关
  - 避免虚构核心模型、参数和验证结果，因为输入材料没有提供任何公式、数据、图表或结论依据
  innovation_points:
  - 在知识提取前增加文本有效性与重复度审查，防止噪声材料进入建模知识库
  - 采用去重统计与人工复核结合的方式识别正文缺失，保证结构化结果的可追溯性
- id: 2020_D011
  source_paper: 2020 2020_D011
  problem_type: 统计分析
  keywords:
  - 重复水印文本
  - 有效内容缺失
  - 模型信息不可识别
  context: 所提供内容仅包含重复的微信公众号宣传水印，未包含可用于判断实际问题背景的论文正文。
  models:
  - name: 无法识别（论文正文缺失）
    role: 由于输入中没有模型假设、公式、变量或算法描述，无法提取核心模型及其作用。
    why: 为避免根据无关水印信息虚构模型，保留缺失状态并明确说明不可识别原因。
  solution_flow: 文本去重与噪声识别→检查问题描述、数据、模型、参数和结果→确认仅存在重复宣传水印→判定缺少有效论文内容→无法还原求解与验证流程
  validation: 通过重复文本比对和关键信息检查进行完整性验证；输入未出现数据表、数学公式、参数估计、求解结果或误差指标，因此不能提取论文中的验证策略。
  visualization:
  - 重复文本频次统计图（可用于说明输入内容高度重复）
  - 有效信息占比图（可用于展示论文正文缺失情况）
  pitfalls_avoided:
  - 避免仅凭“数学模型”公众号名称臆测具体建模方法，因为该名称是水印而非论文模型信息
  - 避免虚构问题背景、数据来源和验证结果，因为原文未提供任何可核验的正文证据
  innovation_points:
  - 采用去重与有效信息检测，识别出输入主要由重复水印构成
  - 在资料不足时显式标注不可识别项，避免生成缺乏证据的建模结论
- id: 2021_A028
  source_paper: 2021 2021_A028
  problem_type: 统计分析
  keywords:
  - 重复水印文本
  - 有效信息缺失
  - 内容质量检测
  context: 所提供内容仅包含大量重复的微信公众号推广水印，未包含可用于识别实际问题背景的论文正文。
  models:
  - name: 文本去重与有效内容检测
    role: 识别重复水印并判断输入材料是否包含可提取的建模内容
    why: 原始文本高度重复且没有问题描述、公式、数据、求解结果等论文核心信息，必须先进行内容有效性检查
  solution_flow: 原始文本→重复片段统计与去重→有效信息识别→建模要素检索→判定论文正文缺失，无法继续完成模型参数提取、求解过程复原与结果验证
  validation: 通过逐段比对确认文本均为相同推广信息，并检查是否存在研究对象、变量、公式、数据表、算法步骤和结论；上述关键内容均未发现，因此不推断不存在于材料中的模型。
  visualization:
  - 重复文本频次条形图
  - 有效信息与水印信息占比图
  pitfalls_avoided:
  - 避免根据“优秀论文”标签臆造具体模型，因为材料中没有任何公式、变量或方法名称可作为证据
  - 避免将重复的公众号名称和微信号误判为研究数据，因为这些内容属于页面水印而非论文观测样本
  innovation_points:
  - 采用内容有效性检测机制，在信息不足时拒绝生成未经材料支持的建模结论
  - 通过重复片段识别区分页面水印与论文正文，提高结构化知识提取的可靠性
