  solution_flow: 输入内容清洗→识别并剔除重复水印→检查有效正文→发现无可用建模信息→停止模型与参数提取→标记为材料缺失
  validation: 无法提取论文采用的验证策略；需补充包含数据、模型、结果及检验部分的正文后，才能判断是否使用误差分析、交叉验证、敏感性分析或对照实验。
