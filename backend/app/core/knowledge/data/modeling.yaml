- id: cumcm-2018a
  source_paper: 2018 CUMCM A题 高温作业专用服装设计 官方题解
  problem_type: 物理建模+优化
  keywords:
  - 热传导
  - 偏微分方程
  - 高温防护
  - 服装设计
  - 有限差分
  - 参数优化
  context: 设计高温防护服的三层织物厚度，使皮肤外侧温度不超过44°C，同时兼顾成本与舒适性
  models:
  - name: 一维热传导方程 (Fourier定律)
    role: 核心物理建模
    why: 服装厚度远小于平面尺寸，可简化为一维传热；三层材料+空气层各有一段PDE
  - name: 有限差分法 (FDM)
    role: 数值求解
    why: PDE无解析解，FDM显式格式简单稳定，适合多层介质交界面的通量连续性条件
  - name: 二分搜索
    role: 参数优化
    why: 单变量（厚度）单调递增关系，二分查找高效精确，避免盲目扫描
  solution_flow: 物理假设(一维稳态/非稳态传热) → 建立三层材料+空气层的一维热传导PDE → 有限差分离散化 → 逐时层推进求解温度分布 →
    二分搜索寻找满足安全约束的最小厚度
  validation: 与CFD仿真结果对比验证；检查网格无关性（加密网格后温度变化<1%）；物理量纲一致性验证
  visualization:
  - 温度-时间曲线（多层叠加）
  - 温度空间分布剖面图
  - 参数灵敏度曲线（厚度vs最高温度）
  pitfalls_avoided:
  - 避免盲目使用三维模型——服装面内尺寸远大于厚度，一维近似合理且大幅降低计算量
  - 避免忽略空气层——IV层空气间隙对隔热有显著影响，必须纳入PDE系统
  - 避免直接给定材料参数——需根据附件数据反演热扩散系数
  innovation_points:
  - 将服装设计转化为PDE反问题：给定安全约束，反求最优厚度组合
  - 三层介质+空气层的耦合传热模型，交界处使用热通量连续性条件
- id: cumcm-2019a
  source_paper: 2019 CUMCM A题 高压油管的压力控制 官方题解
  problem_type: 物理建模+优化
  keywords:
  - 流体力学
  - 常微分方程
  - 压力控制
  - 燃油系统
  - 二分搜索
  - 凸轮设计
  context: 设计高压油管的供油策略，使管内压力稳定在100MPa，涉及喷油嘴开闭时序和凸轮转速优化
  models:
  - name: 质量守恒ODE
    role: 核心物理建模
    why: 高压油管内压力变化由进出燃油质量差决定，结合燃油弹性模量建立dp/dt方程
  - name: 二分搜索
    role: 单变量优化
    why: 单向阀开启时长与稳态压力单调相关，二分法高效确定目标时长
  - name: 凸轮运动学模型
    role: 供油驱动
    why: 柱塞运动由凸轮极径决定，需根据附件数据拟合极径-角度关系，建立进油量模型
  solution_flow: 建立油管质量守恒ODE(考虑弹性模量E/ρ关系) → 喷油嘴周期性边界条件 → 数值求解(Euler法)压力变化 → 二分搜索优化单向阀开启时长
    → 扩展到带减压阀的多周期稳定控制
  validation: 稳态压力波动幅度检查(<0.5MPa)；与题目给定调节时间(2s/5s/10s)对比验证；质量守恒检查
  visualization:
  - 压力-时间曲线（含稳态收敛过程）
  - 单向阀开启时长vs稳态压力曲线
  - 凸轮极径-角度关系拟合图
  pitfalls_avoided:
  - 避免忽略燃油密度随压力变化——高压下E不是常数，需查表插值
  - 避免单向阀单向流动假设错误——需检查压力差方向决定流动方向
  innovation_points:
  - 将多周期压力稳定问题分解为：单周期ODE→二分搜索稳态→扩展到带减压阀的多周期
  - 利用压力-密度的弹性模量关系，将质量守恒转化为可数值求解的压力ODE
- id: cumcm-2019b
  source_paper: 2019 CUMCM B题 同心鼓协作策略研究 官方题解
  problem_type: 力学建模+优化
  keywords:
  - 碰撞力学
  - 刚体动力学
  - 团队协作
  - 同心鼓
  - 倾斜控制
  - ODE
  context: 8人拉绳控制同心鼓颠球，在发力时机和力度有误差时，分析鼓面倾斜角度与颠球高度的关系
  models:
  - name: 刚体动力学方程
    role: 核心物理建模
    why: 鼓面视为刚体，建立竖直方向力平衡和绕质心的力矩平衡方程
  - name: 碰撞模型（恢复系数e）
    role: 球-鼓碰撞
    why: 排球与鼓面的碰撞用恢复系数描述能量损失，确定反弹速度
  - name: PSO粒子群优化
    role: 策略优化
    why: 多变量（发力时机、力度）非线性优化，PSO适合求解
  - name: Euler数值积分
    role: ODE求解
    why: 碰撞过程时间极短，Euler法步长0.001s即可满足精度
  solution_flow: 建立鼓面动力学ODE(力平衡+力矩平衡) → 球员发力时序建模(含误差) → Euler法求解鼓面运动→碰撞检测与反弹 → PSO优化策略参数
  validation: 与理想无误差情况对比(误差0时退化为解析解)；改变步长验证数值稳定性
  visualization:
  - 鼓面高度-时间曲线
  - 倾斜角-时间曲线
  - 不同发力策略的颠球高度对比
  pitfalls_avoided:
  - 避免将绳子视为无质量——绳的拉力传递有时延，需考虑绳的波动效应
  - 避免忽略碰撞瞬间的冲量方向——球反弹方向由鼓面法向决定，倾斜时不再竖直
  innovation_points:
  - 将团队协作抽象为力-力矩耦合动力学，量化了'配合精度'对结果的影响
  - 系统分析了倾斜方向与球员位置的几何关系，给出最优发力调整策略
- id: cumcm-2020a
  source_paper: 2020 CUMCM A题 炉温曲线 官方题解
  problem_type: 物理建模+多目标优化
  keywords:
  - 热传导
  - 偏微分方程
  - 回流焊
  - 炉温曲线
  - PSO
  - 多目标优化
  context: 集成电路回流焊工艺中，PCB板穿过各温区时需控制温度曲线在工艺窗口内，求最优炉温和传送带速度
  models:
  - name: 一维非稳态热传导PDE
    role: 核心物理建模
    why: PCB板在传送带上运动，经历不同温区，可建立移动坐标系下的一维传热方程
  - name: PSO粒子群优化
    role: 多目标优化
    why: 非线性、多极值、有约束的优化问题，PSO全局搜索能力强
  - name: 有限差分法(FDM)
    role: 数值求解
    why: 搭配移动坐标系，显式FDM适合时变边界条件的传热问题
  solution_flow: 建立移动坐标系下的一维传热PDE(含对流+辐射边界条件) → FDM离散化→ 代入各温区温度曲线 → 得到PCB温度-时间曲线 →
    PSO优化温区设定温度和带速，使曲线满足工艺窗口
  validation: 与实测炉温曲线对比；检查峰值温度、液相线以上时间等工艺指标
  visualization:
  - 炉温曲线（温度-时间）
  - 传送带速度vs峰值温度
  - PSO收敛曲线
  - 制程窗口图（peak temp vs TAL）
  pitfalls_avoided:
  - 避免忽略辐射传热——高温区(>200°C)辐射不可忽略，需同时考虑对流+辐射
  - 避免将PCB视为等温体——PCB有厚度，必须用一维传热方程，不能用集总参数法(Bi>0.1)
  - 避免单目标优化——需同时优化峰值温度、TAL、升温斜率等多个目标
  innovation_points:
  - 移动坐标系传热模型，将空间温区分布转化为PCB经历的时变边界条件
  - PSO多目标优化兼顾峰值温度、液相时间、升温斜率三个工艺约束
- id: cumcm-2021a
  source_paper: 2021 CUMCM A题 FAST反射面调节 官方题解
  problem_type: 几何建模+优化
  keywords:
  - FAST
  - 反射面
  - 抛物面拟合
  - 几何优化
  - 促动器
  - 三角网格
  context: FAST射电望远镜由三角面板组成反射面，通过调节促动器使反射面逼近理想抛物面，求最优调节方案
  models:
  - name: 抛物面几何拟合
    role: 核心几何建模
    why: 反射面需逼近旋转抛物面以聚焦电磁波，用最小二乘法拟合最佳抛物面参数
  - name: 三角网格展开
    role: 面板建模
    why: 反射面由三角形面板拼接，需建立每个三角形顶点与促动器的几何关系
  - name: 非线性最小二乘优化
    role: 促动器调节量求解
    why: 目标是最小化实际面板与理想抛物面的偏差平方和，约束为促动器行程限制
  solution_flow: 建立反射面三角网格几何模型 → 最小二乘法拟合最优抛物面(焦距+顶点) → 计算每个促动器的理想伸缩量 → 考虑促动器行程约束后重新优化
    → 评估拟合误差
  validation: 拟合残差RMS检查；与基准球面(初始状态)对比信号增益改善
  visualization:
  - 反射面三维透视图
  - 拟合残差分布热力图
  - 促动器调节量分布图
  pitfalls_avoided:
  - 避免忽略促动器行程限制——理想解可能超出物理行程，需加约束重新优化
  - 避免直接将三角面板中心当作采样点——面板顶点才是可控点
  innovation_points:
  - 两步优化策略：先全局拟合最优抛物面，再在约束下局部调整促动器
  - 利用反射面的旋转对称性简化计算，减少变量维度
- id: cumcm-2010a
  source_paper: 2010 CUMCM A题 储油罐的变位识别与罐容表标定 官方题解
  problem_type: 几何建模+参数辨识
  keywords:
  - 储油罐
  - 变位识别
  - 微积分
  - 最小二乘
  - 参数辨识
  context: 储油罐在使用中会发生纵向倾斜和横向偏转，需根据实测油位高度和油量数据反演变位参数并重新标定罐容表
  models:
  - name: 积分法体积计算
    role: 核心几何建模
    why: 油罐是圆柱体+两端球冠，倾斜时油面为斜面，需积分计算不同油位对应的油体积
  - name: 最小二乘参数辨识
    role: 变位参数反演
    why: 通过最小化理论体积与实测体积的残差平方和，反演纵向倾角和横向偏转角
  - name: 数值积分（辛普森法）
    role: 体积计算
    why: 倾斜油罐的体积积分无解析解，需数值积分；辛普森法精度优于梯形法
  solution_flow: 建立油罐几何模型(圆柱+球冠) → 考虑倾斜和偏转的坐标变换 → 积分法推导油位-体积关系 → 最小二乘反演变位参数(α, β)
    → 重新标定罐容表
  validation: 与实测数据对比残差分析；交叉验证（用部分数据标定，其余数据验证）
  visualization:
  - 油罐三维几何模型
  - 理论vs实测油量对比散点图
  - 罐容表标定曲线
  pitfalls_avoided:
  - 避免忽略两端球冠——球冠体积占比不小，忽略会显著降低精度
  - 避免只考虑纵向倾斜——横向偏转同样影响油位读数，需二维变位模型
  innovation_points:
  - 将变位识别转化为参数辨识问题，利用大量实测数据反演，而非直接测量
  - 坐标变换法统一处理倾斜+偏转，将复杂三维积分降维为可数值计算的二重积分
- id: 2018_A401
  source_paper: 2018 CUMCM A题 高温作业专用服装设计
  problem_type: 仿真+优化
  keywords:
  - 多层热传导方程
  - 隐式有限差分与追赶法
  - 枚举优化
  context: 针对高温作业专用服装，通过模拟四层介质中的瞬态温度分布并优化织物层与空气层厚度，使皮肤外侧温度满足安全约束且兼顾成本和穿着舒适度。
  models:
  - name: 一维四层瞬态热传导模型
    role: 描述织物I、II、III层及空气IV层中温度随时间和厚度的变化，是温度仿真与厚度优化的基础模型。
    why: 服装各层主要沿厚度方向传热，在忽略横向传热、辐射和空气对流后，可由Fourier定律与能量守恒推导分层热传导方程。
  - name: 多介质界面耦合模型
    role: 连接相邻介质的热传导方程，在三个界面上施加温度连续和热流密度连续条件。
    why: 不同材料的热导率、密度和比热不同，不能将服装视为单一均匀介质；界面温度与热流连续可保证多层传热过程满足物理守恒。
  - name: Dirichlet-Robin初边值模型
    role: 以37℃作为初始温度，以外界恒温作为左侧Dirichlet边界，并利用牛顿冷却定律建立皮肤侧Robin边界。
    why: 外侧环境温度由实验条件直接给定，而服装内侧与恒温皮肤之间存在对流换热，混合边界比固定皮肤侧温度更符合实际热交换过程。
  - name: 隐式向后有限差分模型
    role: 将连续的时间—空间偏微分方程离散为各时间层上的三对角线性方程组。
    why: 隐式格式对瞬态热传导问题具有较好的数值稳定性，允许在较长工作时间内持续迭代温度场，降低显式格式受稳定步长约束的风险。
  - name: 追赶法
    role: 逐时间层求解有限差分离散后形成的三对角线性方程组，得到完整温度分布。
    why: 离散系统具有三对角结构，追赶法计算量和存储量较小，适合大量时间步及厚度方案的重复仿真。
  - name: 换热系数参数标定模型
    role: 根据实验测得的皮肤外侧温度，采用变步长枚举法估计空气与皮肤之间的换热系数h。
    why: 换热系数难以直接由附件获得且会显著影响Robin边界，通过实测温度反演可提高模型与实验的一致性，最终标定值约为8.6125。
  - name: II层最小厚度单目标优化模型
    role: 在60分钟末温度不超过47℃、超过44℃时间不超过5分钟等约束下，最小化II层厚度。
    why: 较小厚度通常对应更低成本和更高穿着舒适度，且决策变量维度低，可通过变步长循环枚举可靠搜索可行域边界，得到最优厚度19.3 mm。
  - name: II层与IV层多目标优化模型
    role: 在30分钟安全温度约束下，同时从服装成本和穿着舒适度角度优化II层、IV层厚度。
    why: 两层厚度对隔热性能、材料成本和穿着体验的影响不同，需要同时考察两个决策变量及多个目标；双重枚举可获得满足约束的候选组合，论文给出的方案为II层21.7
      mm、IV层6.4 mm。
  solution_flow: 数据→读取各层厚度、热导率、密度、比热、环境温度及皮肤温度实验序列，并将三维传热简化为沿厚度方向的一维四层介质→模型→依据Fourier定律、能量守恒和牛顿冷却定律建立分层瞬态热传导方程，配置37℃初值、外侧Dirichlet边界、皮肤侧Robin边界及界面温度与热流连续条件→参数→利用实验温度数据和变步长枚举法标定换热系数h≈8.6125→求解→采用隐式向后差分离散时空区域，以追赶法逐时间层求解温度场；再将温度仿真器嵌入单循环或双循环枚举，搜索满足温度上限与超温时长约束的最小或多目标厚度方案→验证→将模拟皮肤温度与实验序列对比，计算偏差指数、最大误差，并对厚度与温度关系进行灵敏性分析。
  validation: 使用附件中的皮肤外侧实测温度对换热系数和温度分布进行校准与检验，通过模拟曲线和实测曲线对比评价拟合效果；论文报告偏差指数f为0.4593、最大误差为1.99℃。同时检查最优厚度方案是否同时满足终止时刻温度不超过47℃和温度超过44℃的累计时间不超过5分钟，并通过灵敏性分析考察最优厚度随温度条件变化的稳定性，结果显示近似线性关系。
  visualization:
  - 不同换热系数下模拟皮肤温度与实测温度的时间序列对比折线图
  - 时间—空间二维温度分布图或等温线图
  - 时间—厚度—温度三维曲面图
  - II层厚度与皮肤最高温度或末时刻温度关系图
  - II层—IV层厚度可行域与目标值热力图
  pitfalls_avoided:
  - 避免将四层材料等效为单一均匀介质，因为各层热导率、密度和比热不同；保留分层方程并施加界面温度、热流连续条件，可防止界面处出现不符合能量守恒的温度跳变或热流断裂。
  - 避免直接把皮肤侧温度固定为37℃，因为实际测量对象是皮肤外侧温度且服装内侧与恒温人体之间存在换热；采用Robin边界能够描述温差驱动的热量交换。
  - 避免凭经验任意指定换热系数h，因为该参数对皮肤温度预测高度敏感；利用实验数据进行由粗到细的变步长枚举标定，提高了边界参数的可信度。
  - 避免使用可能受严格稳定条件限制的显式差分格式，因为热扩散系数和网格尺度变化时显式方法容易数值发散；使用隐式向后差分提高长时间仿真的稳定性。
  - 避免仅检查工作结束时的皮肤温度，因为短时间持续高于44℃同样可能造成伤害；优化约束同时包含47℃终值上限和44℃以上累计时长上限。
  - 避免只追求隔热效果而无限增加服装厚度，因为厚度增加会提高成本并降低舒适度；将最小厚度、成本和舒适度纳入单目标或多目标优化准则。
  - 避免用一般矩阵求解器重复处理大量离散系统，因为会增加厚度遍历中的计算开销；利用三对角结构采用追赶法，提高重复仿真的效率。
  innovation_points:
  - 构建了由四个不同介质热传导方程、六个界面连续条件及Dirichlet-Robin混合边界共同组成的一体化温度场模型，实现服装织物层、空气层与人体皮肤之间的耦合仿真。
  - 将实验数据驱动的换热系数反演与机理热传导模型结合，通过变步长枚举逐级缩小参数区间，提高未知边界参数的标定精度。
  - 把隐式差分—追赶法温度仿真器嵌入厚度优化过程，使每个候选厚度方案均通过完整瞬态温度场计算接受安全约束检验。
  - 针对单层厚度和双层厚度决策分别建立单目标与多目标优化框架，同时考虑最高温度、超温持续时间、成本和穿着舒适度。
- id: 2023_A127
  source_paper: 2023 CUMCM A题 定日镜场优化
  problem_type: 优化+仿真
  keywords:
  - 定日镜平均输出热功率优化模型
  - 变步长搜索算法
  - 分区域同心圆规划策略
  context: 针对塔式太阳能热发电系统，通过计算定日镜场光学效率并优化吸收塔位置、镜面规格、安装高度及镜场布局，实现额定功率约束下的高效输出。
  models:
  - name: 坐标转换与定日镜姿态模型
    role: 建立镜场坐标系和镜面坐标系，利用坐标转换矩阵统一描述光线，并根据入射光、反射光和镜面法向量确定各定日镜姿态。
    why: 定日镜朝向随太阳位置和镜塔相对位置变化，必须在统一三维坐标框架下利用反射定律准确计算其方位角与俯仰角。
  - name: 定日镜场光学效率仿真模型
    role: 综合计算余弦效率、大气透射效率、镜面反射率、阴影遮挡效率和集热器截断效率，得到单镜及全镜场光学效率。
    why: 输出热功率由多种相互耦合的光学损失共同决定，仅使用单一效率指标无法准确反映镜场实际能量利用水平。
  - name: 镜面离散化与无效点判断模型
    role: 将矩形镜面离散为采样点，分别判断塔挡、邻镜阴影和反射挡光，使有效点比例转化为阴影遮挡效率。
    why: 镜间遮挡具有复杂的三维几何关系，直接求遮挡多边形交叠面积计算困难，离散采样可将连续面积问题转化为可编程的点判定问题。
  - name: 锥形反射光线离散与截断效率模型
    role: 将具有太阳角宽度的锥形反射光束离散为多条光线，通过求光线与圆柱形集热器的交点，统计成功入射光线比例。
    why: 太阳并非理想点光源，反射光束存在发散角；离散光线追迹能够处理集热器有限尺寸导致的截断损失。
  - name: 定日镜场年平均输出热功率模型
    role: 结合直接法向辐射强度、镜面采光面积、光学效率和时间采样结果，计算单镜、镜场及单位镜面面积的年平均输出热功率。
    why: 该模型将太阳位置、辐照条件和各类光学损失统一映射为优化目标及额定功率约束，是评价设计方案的核心指标模型。
  - name: 分区域同心圆布局模型
    role: 以吸收塔为参照将圆形镜场划分为多个同心圆区域，并根据区域位置设计径向间距、周向间距和错位排布规则，由少量参数生成镜面数量与坐标。
    why: 直接把每一面定日镜坐标作为决策变量会造成超高维组合优化；参数化分区布局既降低搜索维度，又能适应不同距离区域的遮挡特征。
  - name: 定日镜平均输出热功率优化模型
    role: 在场地范围、镜面尺寸、安装高度、镜间安全距离和额定功率等约束下，优化吸收塔位置、统一镜面规格及布局参数。
    why: 问题二属于给定额定功率后的逆向设计问题，需要在满足约束的同时提高单位面积年平均输出热功率并确定可实施的镜场方案。
  - name: 分区域异规格改进优化模型
    role: 允许不同区域采用不同的镜面宽度、镜面高度和安装高度，在区域内部保持规格一致，优化异质化镜场设计。
    why: 镜塔距离不同会导致余弦损失、遮挡损失和截断损失存在空间差异，分区设置规格比全场统一规格具有更大的优化空间，同时避免逐镜优化造成维数爆炸。
  - name: 变步长遍历搜索与二分求解算法
    role: 先以较大步长搜索可行区域，再缩小步长进行局部精细搜索；在异规格设计中结合二分法快速确定满足额定功率的规模或边界参数。
    why: 目标函数由离散布局、点采样和光线追迹构成，通常不可导且计算成本高，变步长搜索比全域高精度遍历更高效，二分法适用于具有近似单调关系的功率约束参数。
  solution_flow: 输入场地、太阳位置与辐照数据、吸收塔和集热器参数以及定日镜约束→建立镜场与镜面坐标系并由反射定律确定各时刻镜面姿态→离散镜面和锥形光束，计算阴影遮挡、截断及其他光学效率→结合时间采样计算单镜、全场和单位面积年平均输出热功率→利用吸收塔选址策略和分区域同心圆规则将布局参数映射为镜面数量与坐标→以额定功率为约束、单位面积年平均输出热功率为主要目标，通过变步长遍历及二分法搜索塔位、间距、镜面尺寸和安装高度→将最优参数重新代入完整光学仿真模型，输出年平均效率、总功率、单位面积功率和镜场坐标并进行结果核验。
  validation: 采用物理一致性、约束可行性和数值收敛相结合的验证策略：检查反射光方向是否指向集热器、各分项效率及总效率是否位于0到1之间；将优化方案重新代入问题一的完整光学计算流程，核验镜面边界、安装高度、最小间距和场地范围等约束；比较镜场年平均输出功率与60
    MW额定目标，文中问题二结果为60.1189 MW、问题三结果为61.8593 MW；同时可通过加密镜面采样点、离散光线和时间采样并比较结果变化，检验离散仿真的收敛性与稳定性。
  visualization:
  - 镜场坐标系与镜面坐标系三维示意图
  - 太阳入射光、镜面法向量和反射光线几何示意图
  - 分区域同心圆镜场布局图
  - 定日镜位置散点图
  - 月度平均光学效率与输出热功率折线图
  - 各分项光学效率对比柱状图
  pitfalls_avoided:
  - 避免直接在不同坐标系中混合计算光线和镜面几何关系；统一通过坐标转换矩阵处理，否则容易出现轴向定义、方位角方向和正负号错误。
  - 避免把太阳光近似为单条理想光线；考虑太阳角宽度并离散锥形光束，否则会高估有限尺寸集热器的截断效率。
  - 避免只以定日镜中心判断全部阴影和挡光；中心未被遮挡不代表整面镜有效，因此对镜面进行离散并统计无效点，以减少遮挡效率的系统性高估。
  - 避免将塔挡、入射阴影和反射挡光混为同一种损失；三类损失的传播方向和几何判据不同，分开判断可防止漏算或重复计算。
  - 避免把数千面定日镜的坐标全部设为独立决策变量；采用分区域同心圆参数化布局，否则搜索维度过高、难以满足镜间距约束且计算成本不可接受。
  - 避免采用固定小步长进行全参数高精度穷举；光学仿真单次评价成本较高，变步长搜索先粗后细可显著减少无效计算。
  - 避免仅最大化镜场总功率而无限增加镜面数量或面积；引入60 MW额定功率、场地及几何约束，并以单位面积年平均输出功率衡量资源利用效率。
  - 避免逐镜自由设置规格导致变量规模失控和工程实施困难；采用区域内同规格、区域间异规格的折中设计，在提升性能的同时保持方案可制造和可管理。
  innovation_points:
  - 提出镜面离散化的“无效点判断策略”，在统一框架下分别处理塔挡、阴影和挡光损失，将复杂三维遮挡面积计算转化为稳定的点级几何判定。
  - 将锥形太阳反射光束离散，并通过光线与圆柱形集热器求交计算截断效率，比理想中心光线模型更符合有限太阳角宽度和有限接收面的物理实际。
  - 提出分区域同心圆规划策略，用少量布局参数唯一生成定日镜数量和坐标，显著降低大规模镜场优化的决策维度。
  - 提出定日镜规格分区域规划策略，根据镜塔距离配置镜面尺寸和安装高度，实现从全场统一规格到空间异质化设计的改进。
  - 将变步长遍历与二分法结合，用于求解离散、不可导且单次评价成本较高的镜场优化问题，在搜索精度和计算效率之间取得平衡。
- id: 2017_A328
  source_paper: 2017 CUMCM A题 CT参数标定与图像重建
  problem_type: 统计分析+仿真+优化
  keywords:
  - CT系统标定
  - Radon逆变换
  - 最小二乘拟合
  - 图像重建
  - 敏感性分析
  context: 针对存在安装误差的二维平行束CT系统，利用已知椭圆—圆形模板的投影数据标定探测器间距、投射角度和旋转中心，并重建未知介质的吸收率分布。
  models:
  - name: Beer-Lambert吸收定律模型
    role: 建立X射线衰减、介质吸收率与探测器接收信息之间的物理关系。
    why: X射线穿过介质后的对数衰减量等于吸收系数沿传播路径的积分，是将测量数据解释为投影线积分并开展CT重建的物理基础。
  - name: Radon变换与逆Radon变换模型
    role: 描述吸收率分布到投影数据的正向映射，并由标定后的投影数据重建未知介质图像。
    why: 平行束CT采集值本质上是吸收率函数沿不同方向的线积分，Radon变换能够准确刻画该成像机制，逆变换可恢复空间吸收率分布。
  - name: 椭圆与圆形模板几何投影模型
    role: 推导模板在不同投射角度下的投影中心、投影宽度及投影强度曲线，建立系统参数与观测数据的解析关系。
    why: 椭圆投影宽度随角度变化，而圆形投影宽度与角度无关，二者具有互补的几何特征，可分别用于估计投射角度和探测器单元间距。
  - name: 二次曲线最小二乘拟合模型
    role: 对椭圆和圆形投影强度平方进行二次拟合，并由拟合系数反演探测器间距、增益系数和投射角度。
    why: 理论推导表明固定角度下投影强度的平方是探测器像素坐标的二次函数，因此可将复杂非线性标定问题转化为稳定、易计算的多项式参数估计问题。
  - name: 形态学处理与高通滤波模型
    role: 提取椭圆投影边界和宽度，获得投射角度、旋转中心及圆形投影位置的粗估计。
    why: 圆与椭圆的投影数据相互叠加，直接整体拟合容易产生参数耦合；利用边缘和形态特征可先获得可靠初值，为后续曲线分离与精确拟合创造条件。
  - name: 线性插值与滤波反投影模型
    role: 将非等角度采样数据转换为等角度投影数据，并完成未知介质吸收率图像的重建和去噪。
    why: 标准逆Radon算法通常要求角度规则采样，线性插值可满足输入格式；滤波反投影可抑制直接反投影产生的模糊，提高边界和吸收率恢复质量。
  - name: 误差传播与敏感性分析模型
    role: 量化二次拟合系数和探测器间距误差向投射角度估计的传播，识别模型的不稳定角度区间。
    why: 角度由反三角函数计算，在极值点附近微小测量误差可能被显著放大，必须通过误差传播分析评价标定精度和稳定性。
  - name: 双椭圆模板优化模型
    role: 以具有不同方向特征的两个椭圆替代原圆—椭圆模板，改善特定角度附近的标定稳定性。
    why: 圆形缺乏方向信息，原模型在反三角函数极值附近存在病态性；双椭圆可提供互补的角度响应，避免两个模板同时处于低灵敏度区间。
  solution_flow: 数据→检查各角度接收值总和并确认其满足线积分特征→利用高通滤波、形态学边界和椭圆投影宽度粗估探测器间距与投射角度→以粗估角度进行初步逆Radon重建并估计旋转中心和圆形投影轨迹→遮蔽圆形投影影响区域，对剩余数据进行椭圆投影强度平方的二次最小二乘拟合→从总投影中扣除椭圆拟合值，提取并拟合圆形投影曲线→依据拟合系数精确计算探测器单元间距、增益系数和各次投射角度→对非等角度数据线性插值，利用滤波逆Radon变换重建图像并通过坐标变换确定旋转中心、介质位置、形状和吸收率→开展误差传播、加噪实验和模板对比，验证模型并优化为双椭圆模板。
  validation: 首先检验同一角度下接收值总和是否近似恒定，以验证数据符合Radon线积分假设；其次通过投影曲线拟合图、残差及角度序列与线性扫描规律的对比评价参数标定精度；再由重建图像与已知模板的中心、形状和相对位置进行几何一致性校验；最后对输入数据人为加入不同强度噪声，重复标定并比较参数偏差，同时利用误差传播公式分析反三角函数在极值点附近的敏感性，并比较原模板与双椭圆模板在各角度下的稳定性。
  visualization:
  - 各扫描角度接收值总和折线图
  - 椭圆投影宽度与投射角度关系图
  - 投影数据正弦图
  - 椭圆与圆形投影分离散点图
  - 二次曲线拟合及残差图
  - 投射角度序列与线性拟合对比图
  - CT重建灰度图与等值线图
  - 噪声强度—参数误差敏感性曲线
  pitfalls_avoided:
  - 避免直接对圆形和椭圆叠加后的整条投影曲线进行统一拟合，因为两类投影相互耦合会造成参数不可辨识或拟合偏差；先估计圆形轨迹并遮蔽其影响区，再拟合椭圆，随后通过相减提取圆形投影。
  - 避免仅凭椭圆投影宽度一次性精确求角度，因为边界检测和像素离散误差会经反三角函数放大；论文仅将形态学宽度用于粗测，再利用完整投影强度曲线和最小二乘系数精化角度。
  - 避免将非等角度采样数据直接输入标准逆Radon算法，因为算法通常假定角度等间隔，直接重建会产生位置偏差和伪影；先按标定角度进行线性插值，再执行滤波反投影。
  - 避免用受圆形投影污染的数据拟合椭圆曲线，因为重叠区观测值不是单一椭圆的投影强度；以估计圆心为中心删除大于圆投影宽度的安全区间，提高分离可靠性。
  - 避免忽略反余弦或反余切函数在极值点附近的病态性，因为此时微小拟合误差会导致角度估计大幅波动；通过误差传播和加噪实验识别低稳定性角度，并采用双椭圆模板提供互补信息。
  - 避免仅依赖直接反投影重建，因为直接反投影会造成明显模糊和条纹伪影；采用频域滤波或卷积反投影，并结合插值、缩放和图像滤波改善重建质量。
  innovation_points:
  - 提出“形态学粗测—投影轨迹遮蔽—椭圆拟合—残差提取圆投影—参数精化”的分阶段解耦标定流程，将几何图像特征与解析投影模型结合。
  - 利用圆形投影强度平方二次曲线的系数比消除增益系数影响，直接估计探测器单元间距，再用椭圆拟合系数反演各次投射角度。
  - 将粗标定结果用于首次图像重建，再通过重建图像中的模板几何关系反向修正旋转中心，形成参数估计与图像重建相互促进的迭代思想。
  - 从反三角函数的误差敏感性出发解释原模板在特定角度附近精度骤降的原因，并设计双椭圆模板，以方向互补性提升全角度标定稳定性。
- id: 2015_A135
  source_paper: 2015 CUMCM A题 太阳影子定位
  problem_type: 优化+仿真
  keywords:
  - 太阳影子定位
  - 天文学计算模型
  - 多目标规划
  - 分层遍历求解
  - 动态目标追踪
  context: 利用竖直杆影子随时间变化的坐标或视频数据，反演拍摄地点的经纬度及可能的记录日期。
  models:
  - name: 太阳高度角与影长计算模型
    role: 根据日期、时刻、经纬度和杆长正向计算太阳高度角及影子长度，并生成影长随时间变化的理论曲线。
    why: 太阳高度角可由太阳赤纬、纬度和时角确定，而竖直杆影长与太阳高度角满足明确的三角关系，能够将天文参数与可观测影子数据连接起来。
  - name: 影长参数敏感性仿真模型
    role: 采用控制变量法分析杆长、当日时刻、日期、经度和纬度对影长的影响规律。
    why: 各参数对影长的作用相互耦合，控制变量仿真可以分离单个因素的影响，并解释影长曲线及最短影长出现的条件。
  - name: 基于影长比与方位角差的多目标规划模型
    role: 在日期已知时，以理论影长比和实测影长比的误差平方和为首要目标，以理论与实测方位角差的误差平方和为次要目标，反演经纬度。
    why: 影长比能够消除未知杆长这一尺度参数，方位角差又不依赖测量坐标系的绝对朝向；联合两类信息可增加数据冗余度并提高抗噪性。
  - name: 经纬度—日期联合反演模型
    role: 将日期作为新增决策变量，与经纬度共同参与多目标规划，通过分层遍历寻找最优地点和日期组合。
    why: 日期通过太阳赤纬和时差影响太阳高度角及影子方向，联合优化能够处理地点和日期同时未知的逆问题。
  - name: 视频动态追踪与太阳高度角提取模型
    role: 逐帧追踪杆顶、影子顶点及影线上参考点的像素坐标，通过向量夹角计算各时刻的太阳高度角。
    why: 视频不能直接提供地面影长坐标，但稳定特征点的像素轨迹和几何夹角可将图像信息转换为可用于天文反演的太阳高度角序列。
  - name: 非线性规划与分层遍历求解模型
    role: 在视频日期已知或未知两种情形下，最小化理论太阳高度角与视频提取值之间的误差，搜索经纬度及日期。
    why: 天文关系关于经纬度和日期具有非线性，且近似公式和视频测量会引入系统误差，难以直接求得精确方程解，因此应转化为非线性最优化问题。
  - name: 太阳赤纬与时差误差修正模型
    role: 比较近似太阳赤纬、时差公式与高精度天文计算结果，并使用更精确公式修正系统偏差。
    why: 太阳赤纬和时差是时角及太阳高度角计算的主要误差来源，其偏差会持续传递到地点和日期的反演结果中。
  solution_flow: 输入等间隔时刻的影子顶点坐标或视频帧数据→由坐标计算影长、影长比和方位角差，或通过动态追踪提取太阳高度角→利用日期计算太阳赤纬和时差，并由经度及标准时间换算本地太阳时和时角→建立太阳高度角、影长和方位角的正向天文学模型→以经纬度及未知日期为决策变量，构造影长比误差和方位角差误差的分层多目标函数，或构造视频高度角误差的非线性目标函数→在可行经纬度和日期范围内遍历、分层筛选最优解→通过参数敏感性分析、高精度天文结果对照、误差分析及备选解讨论验证结果。
  validation: 首先检查正向模型所得影长曲线是否符合正午附近影长最短、正午前缩短和正午后增长的天文规律；其次采用影长信息与方位角信息交叉约束，通过多时刻冗余观测降低单点噪声影响；再将太阳赤纬和时差的近似计算值与MIDC
    SPA高精度天文计算器结果逐日对比，识别并修正系统误差；最后报告最优解之外的其他可行解，分析地点与日期反演的多解性和结果稳定性。
  visualization:
  - 影长—时间变化曲线
  - 影长—日期变化曲线
  - 影长—经度关系曲线
  - 影长—纬度关系曲线
  - 理论值与高精度天文值误差对比图
  - 视频影子顶点动态追踪轨迹图
  pitfalls_avoided:
  - 避免直接使用绝对影长反演地点，因为杆长未知会使影长尺度不可识别；改用不同时刻的影长比可消除杆长这一未知比例因子。
  - 避免直接使用影子的绝对方位角，因为附件坐标系或摄像机朝向未必与真实南北方向对齐；采用时刻间方位角差可消除坐标系整体旋转带来的影响。
  - 避免仅依赖影长信息求解，因为测量误差可能导致经纬度估计不稳定；加入方位角差作为次级目标可增加约束冗余度和抗噪性。
  - 避免把北京时间直接当作当地太阳时，因为经度差和时差会导致时角计算偏移；先换算本地时，再用时差修正为本地太阳时间。
  - 避免在太阳未升起或太阳高度角接近零时解释影长，因为夜间不存在有效太阳影子，晨昏附近理论影长还会趋于极大；分析和绘图时排除无日照区域，并对过大影长进行截断展示。
  - 避免忽略太阳赤纬与时差近似公式的系统误差，因为小的天文参数偏差会传递并放大为地点或日期偏差；通过高精度SPA计算结果进行对照和公式修正。
  - 避免在视频处理中无依据地忽略透视效应；论文先依据影子平面近似垂直于摄像机视线且记录期间转角较小进行判断，再采用无需透视矫正的简化。
  - 避免强求非线性方程存在完全精确解，因为图像测量和天文近似均含误差；将方程求解改写为误差最小化，并同时讨论备选解和多解性。
  innovation_points:
  - 将影长比与方位角差组合成具有优先级的多目标规划模型，既消除了未知杆长和坐标系朝向的影响，又利用冗余信息提升了反演稳健性。
  - 采用分层求解法，先优化影长比误差，再在候选解中优化方位角差误差，避免不同量纲目标简单加权造成权重选择困难。
  - 把视频动态追踪得到的像素向量夹角转换为太阳高度角序列，实现从非结构化视频到天文定位参数的连接。
  - 统一构建从日期、经纬度到太阳高度角和影长的正向模型，并通过遍历优化完成地点与日期的逆向识别。
  - 利用高精度天文计算器对太阳赤纬和时差近似公式进行逐日误差对照，在反演前修正主要系统误差来源。
- id: 2016_A140
  source_paper: 2016 CUMCM A题 系泊系统设计
  problem_type: 优化+仿真
  keywords:
  - 系泊系统设计
  - 刚体力学方程组
  - 多目标优化
  context: 在不同风速、水流速度及水深条件下，优化锚链型号与长度和重物球质量，以减小钢桶倾角、浮标吃水深度及游动区域并满足安全约束。
  models:
  - name: 悬链线模型
    role: 描述锚链悬空段的几何形状、端点倾角和水平投影，并区分锚链完全悬空与部分沉底两种状态。
    why: 锚链可近似为质量均匀、不可伸长的柔性曲线，其平衡形状由自重和端部张力共同决定，符合悬链线的基本力学条件。
  - name: 刚体受力平衡与力矩平衡模型
    role: 建立钢桶与重物球、四节钢管以及浮标之间的耦合平衡方程，计算各部件拉力、倾角和浮标吃水深度。
    why: 系泊系统各部件相互连接且姿态彼此影响，仅使用整体受力平衡无法确定刚体倾角，必须同时引入力矩平衡条件。
  - name: 水下高度与游动区域几何投影模型
    role: 利用锚链、钢桶和钢管的竖直投影满足水深约束，并通过各部分水平投影之和计算浮标最大游动半径。
    why: 系统总高度和游动范围本质上由各部件在竖直、水平两个方向上的几何投影共同决定，可将姿态变量转化为设计指标。
  - name: 风力与水流力载荷模型
    role: 计算浮标及水下构件受到的水平环境载荷，并分析风流同向、反向、垂直及不同水速剖面下的系统响应。
    why: 风速和水流速度及其夹角直接改变系统的水平合力，是决定锚链张力、钢桶倾角和浮标偏移的关键外部因素。
  - name: 加权多目标优化模型
    role: 以钢桶倾斜角、浮标吃水深度和游动区域半径最小为目标，优化重物球质量以及锚链型号和长度。
    why: 三个设计目标量纲不同且可能相互冲突，采用归一化后的加权目标可将其统一为可搜索的综合优化指标，同时保留安全约束。
  - name: 多重搜索遍历模型
    role: 在离散锚链型号与连续锚链长度、重物球质量组成的混合决策空间中搜索可行的最优设计。
    why: 力学状态由非线性方程组隐式确定，难以直接获得目标函数梯度，而锚链型号又是离散变量，因此遍历与多重搜索更易实施且稳健。
  solution_flow: 输入海水密度、水深、风速、水流速度、构件尺寸质量、锚链参数等数据→推导悬链线方程并划分完全悬空和部分沉底状态→按照锚链、钢桶与重物球、钢管、浮标的顺序建立受力平衡、力矩平衡及几何约束方程组→以端点拉力、倾角、吃水深度和锚链端点坐标等为待求参数，使用
    fsolve 求解非线性平衡状态→由水平投影计算游动半径并检查钢桶倾角不超过5度、锚点夹角不超过16度等约束→构造加权多目标函数，对重物球质量、锚链型号和长度进行多重搜索→在不同水深、水速剖面及风流夹角情景下仿真，并通过权重敏感性和极端工况检验设计稳定性。
  validation: 首先将数值解代回受力平衡、力矩平衡、锚链弧长和总高度方程，检查方程残差及几何闭合误差；其次验证钢桶倾角、锚点处锚链夹角等指标是否满足安全约束，并判断锚链沉底状态与计算结果是否一致；再次对12
    m/s、24 m/s和36 m/s风速以及16至20 m水深进行分情景仿真，检验风速增大时倾角、吃水深度和游动半径变化的力学合理性；最后改变多目标权重并比较最优锚链型号、长度和重物球质量是否稳定，以开展敏感性和稳健性验证。
  visualization:
  - 锚链悬链线形状曲线图
  - 钢桶与各节钢管倾角对比图
  - 重物球质量与多目标指标关系曲线
  - 不同水深及风流方向下系统参数对比图
  pitfalls_avoided:
  - 避免将锚链一律按完全悬空处理：低张力条件下部分锚链会贴在海床，若忽略沉底长度，会同时造成弧长、端点位置、锚点夹角和游动半径计算偏差。
  - 避免只列受力平衡而忽略力矩平衡：钢桶和钢管属于可转动刚体，仅靠水平、竖直合力为零不能唯一确定构件倾角，必须加入绕质心或端点的力矩约束。
  - 避免把钢管倾角与两端拉力方向角混为同一变量：刚体轴线方向不必与端部拉力方向重合，混用会导致力矩方程失真。
  - 避免直接加权不同量纲目标：钢桶倾角、吃水深度和游动半径数量级及单位不同，未经归一化就加权会使数值尺度较大的指标支配优化结果。
  - 避免只优化名义工况：设计若仅适用于单一风速、水深或水流方向，可能在最坏工况下违反5度倾角或16度锚链夹角约束，因此需进行多水深、多流速剖面和多风流夹角检验。
  - 避免求解后不检查物理可行性：非线性方程求得的数学根可能出现负吃水深度、异常张力或沉底状态矛盾，必须结合变量边界、约束和状态条件筛除。
  innovation_points:
  - 将悬链线微元分析、各刚体受力与力矩平衡、浮标浮力以及系统几何投影统一为耦合非线性方程组，实现从环境载荷到系统姿态和游动范围的一体化计算。
  - 建立兼顾钢桶倾角、浮标吃水深度和游动半径的多目标设计框架，并处理锚链型号这一离散变量与锚链长度、重物球质量连续变量的混合优化。
  - 同时区分锚链完全悬空与部分沉底状态，并将锚点夹角作为安全约束嵌入优化过程，提高模型的物理真实性。
  - 扩展分析不同水速垂向分布以及风力与水流力同向、反向、垂直和任意夹角情景，并通过权重变化检验最优设计的稳健性。
- id: A题_数码相机定位
  source_paper: 2008 CUMCM A题 数码相机定位
  problem_type: 优化+统计分析+仿真
  keywords:
  - 数码相机定位
  - 小孔成像与坐标变换
  - 公切线与双目标定
  context: 利用已知尺寸的五圆平面靶标，从圆的透视畸变图像中精确恢复圆心像坐标，并进一步确定两部固定相机的相对位姿。
  models:
  - name: 小孔成像模型
    role: 作为圆、直线和切线投影规律以及单目、双目定位公式的基础成像模型
    why: 相机焦距和像平面参数已知，小孔模型能够用中心投影准确描述空间点到像平面的映射，并保留直线及交点等射影性质。
  - name: 变换矩阵模型
    role: 通过世界坐标系、光心坐标系和像坐标系之间的旋转、平移及尺度变换，拟合椭圆边界并求取圆心的像坐标
    why: 齐次坐标矩阵可统一表示相机外参数、焦距和像素尺度；在单圆深度变化较小的近似下，圆平面到像平面的映射可局部线性化，使以圆心为原点时其像坐标可直接由平移项得到。
  - name: 椭圆多元线性回归模型
    role: 根据灰度检测得到的圆周边缘点，拟合一般二次曲线方程并估计椭圆参数
    why: 圆经倾斜的小孔投影后通常形成椭圆，利用大量边缘像素进行最小二乘或多元线性回归，可降低单个像素提取误差的影响。
  - name: 公切线几何模型
    role: 利用全等圆之间的公切线及其交点的射影不变关系，构造并求出各圆心的像
    why: 直线和交点在中心投影下保持关联关系，而靶标各圆半径相同，其公切线交点与圆心连线具有特殊几何结构，可绕开将椭圆中心误认为圆心像的问题。
  - name: 蒙特卡洛式计算机仿真与误差分析模型
    role: 生成不同相机距离和靶标倾角下的理论投影数据，比较模型估计值与真实值并分析精度、稳定性和适用范围
    why: 真实图像中难以直接获得圆心像的绝对真值，仿真能够控制距离、偏角等变量，并定量测量像素误差。
  - name: 双目相机相对位姿模型
    role: 由两部相机各自的旋转矩阵和平移向量推导相对旋转、相对平移，并通过两条反投影射线完成空间特征点定位
    why: 双目定位的核心是统一两个光心坐标系；旋转矩阵与平移向量能够完整、可组合地描述两个刚性坐标系之间的关系。
  - name: 矢量几何定位模型
    role: 在光轴垂直于像平面的条件下，以光心到像点的方向矢量建立射线关系，作为双目位姿和空间点求解的替代方案
    why: 矢量法几何意义直观，可直接利用两相机视线的方向与交会关系求取目标相对光心的位置，并对矩阵模型形成补充验证。
  solution_flow: 输入靶标尺寸、焦距、像素尺度和相机图像→灰度二值化并提取五个圆的边缘点集→建立世界坐标系、光心坐标系和像坐标系→分别采用二次曲线回归与变换矩阵法、公切线几何法求取圆心像坐标→完成像素单位与毫米单位及图像坐标与光心坐标的转换→利用已知靶标圆心坐标估计每部相机的旋转矩阵和平移向量→组合两组外参数得到相机间相对位姿，并通过双目射线交会恢复空间点→用已知真值的仿真数据和两种圆心求解结果的相互比较验证模型。
  validation: 采用仿真真值检验与交叉模型检验相结合的策略：在计算机中设置已知相机位姿和靶标参数，改变相机到靶标的距离以及像平面与圆平面的两个偏角，生成理论投影，统计估计圆心与理论圆心之间的像素误差；重点检验单圆深度近似造成的偏差，并确定距离大于200毫米、偏角约满足-0.5≤α≤0.5和-1≤β≤0.5弧度时误差小于一个像素的稳定区间；同时比较变换矩阵法与公切线法所得五个圆心坐标，利用两者结果接近验证求解一致性。
  visualization:
  - 小孔成像与三坐标系几何示意图
  - 圆及其椭圆像与公切线构造图
  - 像素误差随相机距离变化曲线
  - 像素误差随两个偏角变化的曲面图或等高线图
  pitfalls_avoided:
  - 避免直接把投影椭圆的几何中心当作原圆心的像，因为中心投影一般不保持线段中点，只有圆平面与像平面平行等特殊情形下二者才重合。
  - 避免忽略透视投影中的深度分母；论文仅在圆半径12毫米远小于约1米拍摄距离、同一圆上各点深度差有限时将深度近似为常数，并通过距离和倾角仿真检验该近似的误差范围。
  - 避免混淆像素坐标、毫米坐标和以光心为原点的坐标；模型显式引入每毫米像素数L、焦距以及坐标变换矩阵，统一完成尺度、原点和方向转换。
  - 避免只根据少量边界点确定椭圆而导致噪声敏感；使用灰度检测获得整圈边缘点，再通过多元线性回归拟合一般二次曲线，以平均化像素离散误差。
  - 避免仅用单一算法得出圆心而缺少可靠性判断；同时建立代数变换矩阵法和射影公切线法，并对两组结果进行交叉比较。
  - 避免未经检验就将模型用于任意拍摄姿态；通过仿真明确距离和偏角的适用区间，防止在近距离或大倾角下因透视非线性增强而产生明显偏差。
  innovation_points:
  - 针对同一圆心像提取问题并行建立变换矩阵法和公切线射影几何法，使代数拟合与几何构造能够相互验证。
  - 利用全等圆靶标的特殊结构以及直线、切线和交点在小孔投影下的关联不变性，由椭圆公切线交点反推出原圆心的像，规避椭圆中心偏移问题。
  - 以每个圆心分别作为局部世界坐标原点，使局部仿射近似下圆心像坐标直接对应变换矩阵中的平移参数，简化参数解释和计算。
  - 通过改变拍摄距离和两个空间偏角进行可控仿真，不仅给出误差数值，还确定误差小于一个像素的模型稳定工作区域。
  - 将单目圆心像提取、相机外参数估计和双目射线交会统一到旋转矩阵与平移向量框架中，形成从靶标识别到双目空间定位的完整链路。
- id: A题_DNA序列的分类模型
  source_paper: 2001 CUMCM A题 DNA序列分类
  problem_type: 分类聚类+统计分析+综合评价
  keywords:
  - DNA序列分类
  - 多特征融合
  - 碱基频率
  - 周期性分析
  - 序列熵
  context: 根据20条已知类别DNA序列提取具有生物学和统计意义的特征，建立分类器以判定人工未知序列及自然序列属于A类还是B类。
  models:
  - name: 基于碱基频率与归一化内积的分类模型
    role: 提取DNA序列的全局组成特征，并依据未知序列与A、B两类样本的平均相似性完成初步分类。
    why: A、G、T、C的出现频率具有明确的生物学意义，且两类样本在G、T等碱基含量上存在明显差异；将频率表示为四维向量并计算归一化内积，可以定量衡量序列组成的相似程度。
  - name: 基于同类碱基间隔方差的周期性模型
    role: 刻画相同碱基在序列中的位置规律和周期性，并以G、T间隔方差之比作为分类特征。
    why: 仅统计碱基频率会丢失位置信息，而相邻同类碱基的间隔不受序列片段起点线性平移的影响；间隔方差能够反映出现周期的稳定程度，且G与T的间隔方差比对两类样本具有较强区分能力。
  - name: 基于重复字串信息增量的序列熵模型
    role: 将DNA序列视为信息流，通过累计每个新增字符带来的信息增量，度量单位长度序列的信息含量和前后相关性。
    why: 重复字串越多、重复位置越近，新增字符所带来的信息越少；该模型同时考虑重复次数、重复距离和重复字串长度，可以补充频率与周期性特征无法表达的序列相关结构。
  - name: 标准化加权多特征融合分类模型
    role: 将频率相似性、周期性和序列熵三个目标函数标准化后加权合成统一判别函数，并以零为分类阈值。
    why: 三个单一模型分别描述序列的不同侧面且量纲和值域不同，先进行中心化和尺度调整再加权融合，可以避免某一指标因数值范围较大而支配结果，并同时体现序列的局部特征与全局特征。
  solution_flow: 数据→将20条已知序列划分为A、B两类并对未知序列进行清洗和编号→分别计算A、G、T、C频率向量、同类碱基相邻间隔及其方差、长度1至6的重复字串信息增量→构造F1频率内积比、F2为G与T间隔方差比、F3为单位长度信息量→利用已知样本估计各指标均值和方差，并搜索熵模型参数p=6、a=0.392、b=0.1、c=3→对三个指标标准化，以权重a1=1、a2=-1、a3=0.5构造综合函数F=g1-g2+0.5g3→以F=0为阈值，F>0判为A类、F<0判为B类→回代已知样本检验后，对未知人工序列和182条自然序列分类。
  validation: 先分别将三个单项模型回代到20条已知类别序列，检查各特征对A、B两类的可分辨性及互补性；再用综合判别函数对训练样本进行回代检验，结果为A组函数值均大于零、B组均小于零，样本内区分率达到100%；最后比较未知序列在各单项模型与综合模型下的结果，并依据综合得分的正负给出类别。该验证属于样本内验证，未采用独立测试集或交叉验证，因此100%区分率不能直接等同于模型的样本外泛化准确率。
  visualization:
  - G间隔方差与T间隔方差散点图及过原点斜率分界图
  - 各序列与A、B类内积对比表
  - 综合判别函数得分与分类结果表
  - 三个标准化特征的类别分布对比图
  pitfalls_avoided:
  - 避免使用序列开头是否为“gt”等偶然模式作为分类依据，因为这种特征虽然可能完全区分小样本，却缺乏稳定的生物学意义，容易产生严重过拟合。
  - 避免只使用A、G、T、C频率进行分类，因为频率特征忽略碱基位置、排列顺序和前后相关性，具有相同频率的序列仍可能呈现完全不同的结构。
  - 避免直接使用碱基出现位置ti，因为DNA数据只是完整序列的片段，截取起点变化会引起所有位置整体平移；改用相邻同类碱基间隔ti+1-ti可消除该影响。
  - 避免直接加总三个原始目标函数，因为它们的值域和尺度差异较大，未经标准化会使数值范围较大的指标不合理地主导综合分类结果。
  - 避免将单一特征的样本内高区分度视为充分证据，通过频率、周期性和信息量三类互补指标进行集成，以降低某一类特征不明显时造成的误判。
  innovation_points:
  - 将DNA序列同时表示为碱基组成向量、同类碱基间隔过程和信息流，从频率、周期性、重复相关性三个互补角度提取特征。
  - 提出基于重复字串的信息增量函数，使重复距离、重复字串长度和重复程度共同影响单位长度信息量。
  - 以同类碱基相邻间隔的方差刻画周期稳定性，并使用G、T间隔方差之比增强类别差异。
  - 对多个异尺度指标进行标准化和加权融合，构造符号型统一判别函数，从而兼顾DNA序列的局部结构与全局统计特征。
- id: A题_自动化车床最优刀具检测更换模型
  source_paper: 2000 CUMCM A题 自动化车床管理
  problem_type: 统计分析+优化
  keywords:
  - 刀具寿命分布
  - 检测与预防性更换
  - 更新报酬模型
  - 单位合格品期望损失
  - 不等间隔检测
  context: 根据自动化车床刀具的历史故障数据，在存在故障、误检和漏检的条件下联合优化刀具检测时点与预防性更换周期，以最小化单位合格零件的期望损失。
  models:
  - name: 大样本D正态性检验模型
    role: 检验刀具寿命样本是否可用正态分布描述，为后续可靠性建模提供分布依据。
    why: 样本量为100，属于大样本场合；检验结果未落入显著性水平0.05对应的拒绝域，因此可接受刀具寿命服从正态分布的假设。
  - name: 正态寿命分布与可靠性模型
    role: 利用样本均值和样本标准差估计刀具寿命密度函数f(x)、累积分布函数F(x)及生存概率1-F(x)。
    why: 检测与换刀成本取决于刀具在给定周期前失效的概率以及失效时刻的分布，寿命分布能够统一计算预防性换刀和故障换刀两类事件的概率。
  - name: 更新报酬型单位合格品期望损失模型
    role: 将一次刀具更新周期划分为定期换刀前未失效和定期换刀前已失效两种情形，分别计算检查费、换刀费、维修费和不合格品损失，再以期望总损失除以期望合格品数量构造目标函数。
    why: 刀具更换或故障维修后系统恢复到新的更新周期，具有更新过程结构；采用长期单位合格品期望损失比只比较单周期总成本更能反映经济效益。
  - name: 含误检与漏检的检测决策模型
    role: 在模型二中纳入正常状态下2%的不合格率、故障状态下40%的合格率、误停机损失及连续漏检导致的追加检查和不合格品损失。
    why: 单件抽检并不能完全识别工序状态，若忽略假阳性和假阴性，会系统性低估检查、停机及故障延迟发现造成的成本。
  - name: 等失效概率不等间隔检测模型
    role: 按寿命分布累计概率等分检测区间，通过F的反函数确定各检测时点，使检测间隔随失效风险呈现先缩短后变化的规律。
    why: 正态寿命分布下各时段失效风险不均匀，固定检测间隔不能匹配风险变化；令每个检测区间的累计失效概率近似相同，可在高风险区加密检查、低风险区减少检查。
  - name: 粗细结合的穷举优化模型
    role: 对换刀间隔T、等间隔检测周期Tc或等概率面积area进行离散枚举，先用较大步长定位最优区域，再逐点细化搜索。
    why: 目标函数包含积分、取整、分段函数和几何级数，难以直接求导获得闭式最优解；枚举法实现简单且适合整数件数约束。
  - name: 连续抽检的Bayes决策思想
    role: 针对单件检测误判问题，提出在首次检测后追加检测，并依据连续观测结果判断工序状态。
    why: 多次观测可更新正常与故障状态的后验概率，降低正常工序误停机和故障工序漏报的概率；原文仅提出策略，未完整量化最优判决阈值。
  solution_flow: 整理100次刀具故障寿命数据→采用大样本D检验判断正态性→以样本均值600和样本标准差约196.63估计寿命密度f(x)与分布函数F(x)→按定期换刀前是否失效划分更新周期，计算检查、换刀、维修、不合格品、误停机和漏检延迟等期望损失→以期望总损失除以期望合格品数量构造单位合格品期望损失函数→枚举换刀间隔T与检测间隔Tc，先粗搜索后细搜索→进一步以等失效概率面积area替代固定Tc，利用F的反函数生成不等间隔检测计划→比较等间隔与不等间隔方案的最优目标值，并在模型二中加入2%误检来源和40%漏检来源进行扩展。
  validation: 首先通过显著性水平0.05下的D正态性检验验证寿命分布假设；其次采用由粗到细的枚举搜索检查局部最优区域并获得整数可执行解；最后进行方案对照验证，将等间隔检测与等失效概率不等间隔检测的最小单位损失进行比较：模型一由约4.615降至4.405，模型二由约9.268降至9.047，说明风险自适应检测具有改进效果。原文未进行样本外检验、敏感性分析，也未量化连续抽检规则的误判概率，因此验证仍不充分。
  visualization:
  - 刀具寿命样本直方图与正态密度拟合曲线
  - 累计失效概率分布曲线
  - 等失效概率面积划分示意图
  - 不等间隔检测时点与间隔序列表
  - 换刀间隔和检测间隔对应的目标函数热力图或三维曲面图
  - 等间隔与不等间隔方案单位损失对比柱状图
  pitfalls_avoided:
  - 避免未经检验直接指定刀具寿命分布：先使用D检验确认正态分布假设，否则F(T)、条件失效密度及最优检测周期可能建立在错误分布上。
  - 避免只最小化单个更新周期的总成本：以期望损失除以期望合格品数量，防止通过缩短周期或减少产量得到表面低成本但单位产出经济性较差的方案。
  - 避免混淆无条件密度与周期内条件密度：在已知刀具于T前失效时使用f(x)/F(T)积分，否则会重复或遗漏F(T)这一失效概率权重。
  - 避免仅考虑预防性换刀或仅考虑故障换刀：将T前未失效和T前已失效两类互斥事件分别核算，再按1-F(T)和F(T)加权，保证成本情形覆盖完整。
  - 避免假设检测结果完全准确：模型二显式考虑正常状态下抽到2%不合格品造成的误停机，以及故障状态下抽到40%合格品造成的连续漏检，否则会显著低估检测决策风险。
  - 避免将非光滑目标函数强行用解析求导处理：检查次数包含整除和取整，成本函数还具有分段结构，采用整数穷举和局部细化更稳健。
  - 避免在失效风险不均匀时机械采用固定检测间隔：根据累计失效概率等分检测区间，使检查资源集中于高风险寿命阶段，减少低风险阶段的无效检查。
  innovation_points:
  - 将可靠性寿命分布、更新过程和经济损失统一到单位合格零件期望损失指标中，实现检测周期与预防性换刀周期的联合优化。
  - 利用累计失效概率等分思想设计不等间隔检测计划，通过F的反函数直接生成可执行的检测时点，使检查频率随刀具失效风险动态变化。
  - 在基础模型上引入正常状态不合格率和故障状态合格率，用几何概率结构描述连续漏检及延迟维修成本。
  - 提出基于追加抽检和后验判断的Bayes决策改进方向，以降低单件检测造成的误停机与漏报。
- id: 2018_B225
  source_paper: 2018 CUMCM B题 智能RGV动态调度
  problem_type: 优化+仿真+统计分析
  keywords:
  - RGV动态调度
  - 滚动时域优化
  - 多工序捆绑调度
  - 蒙特卡洛故障仿真
  context: 在由8台CNC、1辆RGV及上下料传送带构成的智能加工系统中，研究单工序、双工序及随机故障情形下以8小时班次产量最大化为目标的RGV动态调度问题。
  models:
  - name: 加工系统状态转换模型
    role: 刻画CNC的空闲、上下料、加工、需求状态以及RGV的等待、移动、上下料、清洗状态，为动态调度和离散事件仿真提供统一的状态描述。
    why: RGV与多台CNC之间存在资源竞争、位置约束和时序联动，必须显式记录设备状态、位置及交互时间，才能准确计算等待时间和可执行指令。
  - name: 单工序CNC总等待时间最小化模型
    role: 将班次内成品数量最大化转化为8台CNC总等待时间最小化，并据此评价候选调度路径。
    why: CNC加工时间固定时，减少空闲和完工等待时间能够提高设备有效工作时间，从而间接提升8小时内的成品产量。
  - name: “八步一走”滚动时域调度模型
    role: 每次决策时遍历未来8次移动或作业的候选路径，以未来总等待时间最小的路径为准，仅执行其第一步，随后根据新状态重新优化。
    why: 完整班次的全局路径组合规模过大，而仅采用最近任务规则容易陷入局部最优；八步前瞻兼顾计算可行性、8台CNC的系统规模和动态响应能力。
  - name: 初始上料顺序枚举模型
    role: 利用同位置两台CNC优先连续服务的原则，将初始上料方案缩减为6种，并逐一仿真以选出最终成品数最多的初始方案。
    why: 初始上料次序会影响后续各CNC完工时刻及RGV任务峰值，枚举经过对称性和位置规则压缩后的有限方案可避免初始条件选择的随意性。
  - name: 双工序CNC刀具配比与对称布局模型
    role: 依据两道工序加工时间及第二道工序后的清洗时间确定两类CNC的候选数量配比，并在对称性原则下优化刀具安装位置。
    why: 两道工序的处理能力不平衡会造成在制品积压或设备空闲，合理配比和对称布局可同时缓解工序瓶颈并减少RGV跨位置移动。
  - name: 三步或四步捆绑联动调度模型
    role: 将双工序物料的转运、第二工序上料及成品下料等关联任务按三步或四步组合，枚举组内顺序并选择完成时间最早的方案。
    why: 双工序任务具有严格的工艺先后关系和中间物料转运约束，单步贪心难以反映任务间耦合，捆绑调度能够直接优化一组关联任务的整体完成时间。
  - name: 随机故障蒙特卡洛仿真模型
    role: 以每道工序1%的概率生成故障，在加工区间内均匀生成故障时刻，并在600至1200秒内生成修复时间；故障CNC暂时退出调度，修复后重新加入。
    why: 故障发生时刻和修复时长均具有随机性，难以仅用确定性模型描述，随机仿真可评估调度策略在设备失效条件下的产量和稳定性。
  - name: 产量均值与方差统计模型
    role: 对随机修复时间以及600秒、900秒、1200秒固定修复时间分别进行20组试验，通过成品数均值和方差比较系统表现。
    why: 单次随机结果不具代表性，均值用于反映平均产能，方差用于衡量调度结果对故障和维修时间波动的敏感程度。
  solution_flow: 输入3组RGV移动时间、奇偶编号CNC上下料时间、单工序或双工序加工时间、清洗时间及8小时班次长度→建立CNC与RGV状态转换和离散事件时间推进机制→单工序枚举6种初始上料顺序并采用“八步一走”滚动优化，双工序根据工序负荷确定刀具配比与对称布局后采用三步或四步捆绑调度→每次依据设备状态、最后交互时间、位置和候选任务计算等待时间或完成时间，执行候选最优方案的第一步并持续滚动至28800秒，同时保证RGV能够返回初始位置→在故障情形中随机生成故障时刻和修复时间，将故障设备动态移出并在修复后重新加入→统计成品数、设备等待时间、作业效率以及多次随机试验的均值和方差→与忽略RGV移动及清洗时间的理想产量上界比较，验证模型效果和鲁棒性。
  validation: 采用三层验证：第一，将模型代入3组独立参数进行算例检验，检查其对不同移动、加工、上下料和清洗时间的适应性；第二，构造忽略RGV移动时间与清洗时间的理想产量上界，以实际产量除以理想产量计算作业效率，单工序效率分别为99.48%、97.55%、100%，双工序效率分别为94.40%、96.76%、100%；第三，在故障场景下对随机修复时间及600秒、900秒、1200秒固定修复时间分别开展20组蒙特卡洛试验，通过产量均值和方差检验策略稳定性，并据此分析维修时间控制范围。
  visualization:
  - 智能加工系统与CNC位置示意图
  - RGV调度甘特图或时序图
  - 不同参数组实际产量与理想产量对比柱状图
  - 不同修复时间下成品数均值与方差对比图
  pitfalls_avoided:
  - 避免让RGV在所有CNC加工期间原地等待：若不提前移动，CNC发出需求后还需承担额外运输时间；模型允许无需求时依据前瞻结果预移动，从而降低设备完工等待。
  - 避免使用只关注最近CNC或最短距离的单步贪心规则：最近任务未必能使未来8台CNC的总等待时间最小，因此采用八步前瞻并滚动执行第一步，降低局部最优风险。
  - 避免直接穷举整个8小时班次的全部指令序列：全局组合数量随决策次数指数增长，计算不可行；通过初始方案压缩、同位置优先和有限步滚动搜索控制复杂度。
  - 避免双工序中仅按单台设备等待时间安排任务：两道工序存在前后置约束和中间物料流，单步指标容易导致工序堵塞，因此采用刀具产能配比和多步捆绑联动。
  - 避免忽略班次终点与RGV归位约束：若末尾继续接受无法完成并返回初始点的任务，会产生不可执行调度；模型在每次决策前检查剩余时间并拒绝不满足归位条件的指令。
  - 避免故障后仍将失效CNC纳入候选任务：这会使RGV产生无效移动或等待；故障发生后将该设备暂时从系统中移除，修复并重新发出需求信号后才恢复调度。
  - 避免根据一次随机故障仿真直接下结论：单次产量容易受故障时刻影响，论文通过多组重复试验及均值、方差分析评估平均性能和稳定性。
  - 避免用实际调度结果自身作为效率基准：缺少统一上界会使不同参数组不可比，因此使用忽略移动和清洗耗时的理想产量作为基准计算作业效率。
  innovation_points:
  - 提出“八步一走”的滚动时域策略，将8台CNC未来多步总等待时间优化与实时状态更新结合，只执行最优候选路径的第一步，兼顾前瞻性与动态适应性。
  - 引入无需求时的主动预移动机制，使RGV利用CNC加工期间的空闲窗口提前靠近下一潜在服务位置，减少需求产生后的响应时间。
  - 针对双工序建立刀具数量配比、对称空间布局与三步或四步任务捆绑相结合的调度框架，同时处理工序产能平衡、位置成本和工艺先后约束。
  - 将随机故障作为设备集合的动态变化处理，即故障设备即时退出、修复后重新加入，使原确定性调度模型能够平滑扩展至随机失效环境。
  - 通过理想产量上界评价效率，并使用不同维修时长下的重复仿真方差评价稳定性，实现了产能水平与风险波动的双重验证。
- id: 2017_B447
  source_paper: 2017 CUMCM B题 拍照赚钱任务定价
  problem_type: 统计分析+预测+优化+分类聚类+综合评价+仿真
  keywords:
  - LOF离群因子
  - 多元回归分析
  - 多目标优化
  - 改进DBSCAN算法
  - 蒙特卡洛仿真
  context: 针对移动众包“拍照赚钱”平台，利用任务位置、会员位置与信誉限额等数据研究任务定价规律，优化定价与任务打包方案，以降低平台成本并提高任务完成率。
  models:
  - name: 非线性回归分析模型
    role: 拟合任务定价与周边用户限额总量、最近用户平均距离及任务离群程度之间的关系，并分别刻画已完成和未完成任务的定价曲面。
    why: 任务定价受到多个可量化因素影响，且散点关系具有明显非线性；回归模型能够从历史数据中识别影响方向、估计参数并形成可用于预测和优化的定价函数。
  - name: LOF局部离群因子模型
    role: 量化单个任务相对于周边任务的局部离群程度，并将其作为任务定价和成功率分析的重要解释变量。
    why: 单纯使用最近任务距离难以反映局部任务簇结构，而LOF通过局部可达密度比较刻画任务点的异常程度，更适合描述任务密集或孤立所导致的执行成本差异。
  - name: 任务成功率综合评价模型
    role: 综合任务定价、用户限额、用户距离、任务离群度、用户信誉和预订时间等因素，估计每个任务的预期成功率。
    why: 任务能否完成并非只由价格决定，需要把用户供给能力、空间可达性和会员优先权等多维因素纳入统一评价函数，为后续优化和打包提供量化依据。
  - name: 多目标定价优化模型
    role: 在合理定价区间内协调任务总定价最小与平均成功率最大两个目标，分别求解固定成功率下成本最低和固定预算下成功率最高的方案。
    why: 平台成本和任务完成率之间存在天然冲突，单一目标无法完整体现运营需求；多目标优化可以形成可比较的成本—成功率权衡方案。
  - name: 改进DBSCAN任务打包模型
    role: 依据任务预期成功率构造任务得分半径，依据会员信誉和预订时间构造用户得分半径，将低成功率任务与邻近高成功率任务组合，并检验任务包是否具有可执行用户。
    why: 任务点空间分布不均且固定邻域半径难以兼顾不同任务的救助需求，采用动态得分半径能够针对低成功率任务扩大搜索范围，同时利用用户可执行性约束避免形成不可落地的任务包。
  - name: 任务价值—路途花费分解定价模型
    role: 把任务价格拆分为任务本身价值与用户路途花费，重新计算联合打包后的总价格。
    why: 打包不会改变任务本身价值，但会降低多个任务之间的重复出行成本；分解定价能够合理反映打包带来的路径与时间节约，避免简单累加原任务价格。
  - name: 用户行为仿真模型
    role: 对会员挑选、系统审核与按预订限额比例分配、用户执行等行为进行模拟，评估新项目定价和打包方案的实际完成率。
    why: 解析成功率模型包含行为假设和回归近似，仿真可以复现任务分配流程，独立检查优化结果在微观用户行为下是否仍然可实现。
  solution_flow: 首先清洗任务与会员数据，纠正疑似经纬度颠倒记录、剔除远离任务区域且无实际影响的会员点，并将GPS球面坐标转换为距离；随后构造任务周边1
    km内用户限额总量、最近若干会员平均距离、LOF离群度、会员信誉和预订时间等特征；随机抽取70%样本建立非线性定价回归模型，用剩余30%样本检验，并分别拟合已完成与未完成任务的定价关系以分析失败原因；再根据两类任务定价曲面确定合理价格区间，建立成功率综合评价函数和多目标优化模型，求解成本优先与成功率优先的定价方案；之后利用动态任务得分半径和用户得分半径执行改进DBSCAN聚类，对任务包进行用户可执行性筛选，并通过任务价值与路途花费分解调整打包价格；最后将模型应用于新项目，输出任务价格、打包结果和预测成功率，并通过用户行为仿真、灵敏度分析和鲁棒性检验评价方案。
  validation: 采用随机70%训练集和30%测试集进行样本外检验，以决定系数、训练与测试均方残差以及均方残差偏移比例评价回归可靠性；通过分别拟合已完成和未完成任务并比较函数曲面验证失败原因；将优化方案与原方案进行同成功率下总价和同总价下成功率的对照，结果显示同等平均成功率下总定价降低2.9%，同等总定价下平均成功率提高9.4%；比较打包前后的预期成功率与原成功率，最高提高7.2%、平均提高2.3%；对新项目进行会员微观行为仿真，模拟成功率与优化模型预测成功率偏差控制在20%以内，并补充鲁棒性和灵敏度检验。
  visualization:
  - 定价与影响因素散点图及非线性拟合曲线
  - 训练集与测试集回归对比图
  - 任务点与会员点空间分布图
  - 用户限额覆盖气泡图
  - LOF值二维排序图与三维分布图
  - 任务价格空间热力图
  - 完成与未完成任务分布对比图
  - 打包前后成功率对比图
  - 用户—系统—任务逻辑关系图与UML时序图
  - 模型求解流程图
  pitfalls_avoided:
  - 纠正会员B1175疑似经纬度写反的问题，避免错误坐标造成距离、用户密度和邻域限额特征严重失真。
  - 剔除远离正常任务区域且周边没有任务点的会员，而不是让其参与最近距离与密度计算，避免无业务关联的极端位置拉大距离统计量。
  - 将经纬度先转换为实际地理距离，避免直接把经纬度差当作平面距离而忽略不同纬度下经度尺度差异。
  - 没有只用会员人数衡量任务供给，而是累加周边会员预订限额，避免把低限额会员和高限额会员视为相同执行能力。
  - 没有仅用任务间最近距离刻画任务分布，而是使用LOF局部可达密度衡量离群度，避免无法识别不同局部密度背景下的孤立任务。
  - 对最近用户平均距离回归曲线后段出现的反常下降进行了识别，并暂不将极端离群区间用于优化，避免少量离群点诱导出违背业务常识的定价规律。
  - 定价优化受到已完成与未完成任务拟合曲面所形成的合理价格区间约束，避免为追求单一目标而产生过低、过高或缺乏历史依据的价格。
  - 任务打包后使用用户得分半径检查周边是否存在可执行会员，避免仅依据任务空间接近性形成无人能够领取的任务包。
  - 打包价格没有简单等于原任务价格之和，而是区分任务价值和路途花费，避免忽略联合执行带来的交通与时间成本节约。
  - 没有仅依赖回归模型的预测成功率评价新方案，而是模拟会员选择、系统分配和执行过程，避免宏观统计关系掩盖微观分配机制带来的偏差。
  innovation_points:
  - 从用户—任务和任务—任务两个层面同时构造定价特征，将周边会员限额、最近会员平均距离和LOF离群度统一纳入定价规律分析。
  - 分别拟合完成任务与未完成任务的定价曲面，以两曲面之间的区域作为合理定价区间，并据此约束多目标优化。
  - 建立成本与完成率双目标定价框架，分别给出固定成功率下最低成本和固定预算下最高成功率两类运营方案。
  - 将DBSCAN的固定邻域半径改造成与任务预期成功率相关的任务得分半径，使低成功率任务拥有更大的匹配范围并可与高成功率任务联合。
  - 引入由会员信誉度和预订时间决定的用户得分半径，对聚类形成的任务包进行可执行性二次检验。
  - 把打包价格分解为不变的任务自身价值和可节省的路途花费，使空间聚类、任务完成率提升与价格调整形成统一闭环。
  - 通过用户行为仿真复现挑选、审核、按限额比例分配和执行过程，为优化方案提供不同于回归检验的机制层验证。
- id: 2015_B285
  source_paper: 2015 CUMCM B题 互联网+出租车调度
  problem_type: 统计分析+分类聚类+综合评价+仿真+优化
  keywords:
  - 出租车时空供需匹配
  - 网格化行为仿真
  - 社会福利最大化
  context: 基于上海市出租车、乘客请求及等待时间等时空数据，评价出租车供需匹配程度，仿真双向补贴对打车难的影响，并优化司机与乘客补贴方案。
  models:
  - name: 时空插值与三维分布模型
    role: 将离散采样点的出租车数量、乘客请求量和等待时间转化为不同时段的连续空间分布曲面。
    why: 原始数据在空间上离散且采样点较松散，需要通过插值直观识别市区、郊区及高低峰之间的供需差异；采用MATLAB的v4插值可改善稀疏区域和数据范围边缘处曲面不连续的问题。
  - name: 基于商圈与城郊区域的空间聚簇模型
    role: 以代表性商圈和城郊区域为簇，将附近采样点聚合，计算簇内平均等待时间和平均空驶率，并降低数据维度。
    why: 出租车供给数据与乘客需求数据的采样坐标并不严格对应，直接逐点相减会产生较大误差；按空间邻域聚合既能实现供需数据对齐，也能保留典型区域特征。
  - name: 平均空驶率供给指标模型
    role: 利用K=(总车辆数-需求数)/总车辆数刻画区域和时段内出租车的相对空载程度，并作为供给水平指标。
    why: 空驶率能够反映出租车有效利用程度，与乘客需求呈反向关系，同时可解释高空驶率与打车难并存的信息不对称现象。
  - name: K-T供需满意度与非线性平衡模型
    role: 建立空驶率K与乘客最长等待时间T之间的关系T=f(K)，通过平衡曲线及平衡点(K0,T0)综合评价供求匹配程度。
    why: 单独使用车辆数、请求量或等待时间无法全面刻画供需状态；将供应侧空驶率与需求侧等待时间联合起来，可区分供大于求、供小于求和供需平衡三种状态。
  - name: 一阶指数衰减拟合模型
    role: 根据聚簇后的K-T散点估计供需平衡曲线，并为各时空样本提供判别基准。
    why: 理论上等待时间随空驶率增加而下降并逐渐趋于下限，一阶指数衰减函数符合该饱和性和单调性；与普通指数及Fourier拟合比较后，其拟合效果最佳。
  - name: 城市网格化最短路径模型
    role: 将研究城区划分为网格，用曼哈顿距离近似实际道路距离，构造起讫点最短路径矩阵和需求矩阵。
    why: 真实道路网络和出租车轨迹规模庞大、结构复杂，网格化能够保留主要空间关系，并显著降低路径计算和行为仿真的复杂度。
  - name: 随机效用选择概率模型
    role: 根据起讫点距离、目标区域需求量及补贴带来的心理预期变化，计算司机从当前位置前往各目标网格搜寻乘客的概率。
    why: 司机选择具有随机性，论文假设随机效用项服从二重指数分布，从而可用Logit形式把距离成本、潜在需求和补贴收益统一转化为选择概率。
  - name: 出租车总空驶里程仿真评价模型
    role: 综合最短路径、空驶车辆数量和司机目的地选择概率，比较无补贴及不同双向补贴政策下的总空驶里程。
    why: 总空驶里程直接反映司机寻找乘客的无效行驶成本；空驶里程越短，通常意味着供需信息匹配效率越高，对缓解打车难越有帮助。
  - name: 社会福利最大化与双向补贴优化模型
    role: 定义司机剩余、乘客剩余及社会总福利，将总福利表示为司机补贴和乘客补贴的二元函数，并求取最优补贴组合。
    why: 只追求订单量或降低空驶里程可能造成补贴成本过高，社会福利模型能够同时考虑司乘收益、出行效用和资源消耗，从整体效率角度设计补贴方案。
  - name: 柯布-道格拉斯剩余价值模型
    role: 刻画司机和乘客相关投入因素对各自剩余价值及社会福利的共同影响，为双向补贴优化提供效用函数基础。
    why: 柯布-道格拉斯函数能够表达多因素共同作用及边际效用递减特征，适合描述补贴、收入、成本和服务效用之间的非线性关系。
  solution_flow: 数据→利用爬虫获取约110天、每小时采样的出租车数量、请求单数和等待时间数据，并区分工作日与非工作日→对离散空间数据进行v4插值，绘制供给、需求和等待时间分布→按商圈1
    km、城郊10 km邻域聚簇，对齐不同采样坐标并计算簇内平均空驶率K与等待时间T→比较一阶指数衰减、指数和Fourier函数，拟合T=f(K)供需平衡曲线，以样本相对曲线及平衡点的位置评价时空供需匹配→将城区网格化，构造OD需求矩阵、车辆到达矩阵和曼哈顿最短路径矩阵→基于随机效用模型引入距离、目标地需求和司乘补贴参数，计算司机选择概率→仿真不同补贴政策下的出租车流动及总空驶里程→构建司机剩余、乘客剩余和社会总福利二元函数→通过非线性函数图像分析和控制变量法搜索司机补贴与乘客补贴的最优组合→结合实际打车软件运营现象进行合理性解释。
  validation: 首先对一阶指数衰减、普通指数和Fourier等候选函数进行拟合效果比较，以最佳拟合曲线作为K-T供需基准；其次通过工作日与节假日、早晚高峰与平峰、市中心与郊区的分组对照，检验模型能否复现高峰等待时间较长、需求较多以及区域供需差异等规律；再次将散点相对平衡曲线的位置与上海出租车数量不足、打车难及高空驶率并存等现实事实进行一致性核验；最后依据距离越远吸引力越低、目标区域需求越高吸引力越强、有效补贴应降低空驶里程等物理和经济含义，对仿真方向及最优补贴结果进行合理性验证。
  visualization:
  - 出租车数量、请求单数和等待时间的三维空间插值曲面图
  - 工作日与节假日的24小时空驶率K-t折线图
  - 空驶率K与等待时间T的散点图及非线性拟合曲线
  - 理想供需平衡曲线与平衡点示意图
  - 城市道路网格与最短路径示意图
  - 司机补贴—乘客补贴—社会总福利二元函数曲面图或等高线图
  - 不同补贴方案下总空驶里程对比图
  pitfalls_avoided:
  - 避免直接计算逐采样点的N-D供求差：出租车数量与请求单数来自不同经纬度采样点，若分别插值后再作差会叠加两次拟合误差，因此先按代表性区域聚簇并在簇内统一统计。
  - 避免把工作日与节假日混合建模：两类日期的人口流动和早晚高峰规律明显不同，混合后会掩盖真实的时间结构，因此先筛选法定节假日和双休日并分组分析。
  - 避免仅用出租车绝对数量评价供需：车辆多不等于有效供给充足，信息不对称会造成高空驶率与打车难并存，因此联合使用空驶率K和等待时间T。
  - 避免在稀疏采样区域使用不适当的普通插值：采样点随机且松散，边界或缺少数据的区域容易产生不连续曲面，因此选用v4插值增强曲面平滑性和可导性。
  - 避免直接在完整真实路网上进行大规模轨迹仿真：真实道路、轨迹和OD组合会造成计算规模过大，因此采用网格中心聚合和曼哈顿距离近似以降低复杂度。
  - 避免把司机决策视为完全确定性最短路选择：现实中司机会综合距离、潜在客流和收益且存在个体随机性，因此使用基于二重指数随机项的选择概率模型。
  - 避免只评价单边补贴：补贴会同时改变司机接单意愿和乘客叫车需求，忽略任一方都会低估供需反馈，因此将司机补贴和乘客补贴共同参数化。
  - 避免把降低空驶里程直接等同于最优政策：过高补贴虽可能改善匹配，却会增加平台或社会成本，因此进一步以司机剩余、乘客剩余和总社会福利约束补贴优化。
  - 避免将单一平台数据无条件外推至整个出租车市场：数据主要来自滴滴快的平台用户，存在覆盖偏差，因此结论被限定为对主要平台样本和特定社会环境下的近似评价。
  innovation_points:
  - 将供应侧平均空驶率K与需求侧等待时间T统一到非线性供需满意度曲线中，用样本相对曲线和平衡点的位置实现供大于求、供小于求和失配状态的综合判别。
  - 利用空间聚簇解决供给与需求采样点不一致的问题，在减少数据规模的同时保留商圈和城郊的典型时空特征。
  - 把智能城市网格化、OD需求挖掘、最短路径和随机效用选择模型结合起来，形成可模拟司机搜客行为的出租车流动框架。
  - 将司机补贴和乘客补贴引入行为吸引力函数，使补贴政策能够通过司乘心理预期变化传导到选择概率和总空驶里程。
  - 在运营效率指标之外引入司机剩余、乘客剩余和社会总福利，将缓解打车难与补贴成本统一为双变量非线性优化问题。
- id: B题_钢管订购和运输优化模型
  source_paper: 2000 CUMCM B题 钢管订购与运输
  problem_type: 优化+统计分析
  keywords:
  - 多式联运最小费用路径
  - 钢管订购与运输
  - 二次规划
  - 灵敏度分析
  - 树形管网
  context: 在钢厂产能、最低起订量和铁路公路分段运价约束下，为线形或树形天然气主管道制定总费用最小的钢管订购、运输与铺设方案。
  models:
  - name: 改进Dijkstra最小费用路径模型
    role: 计算每个钢厂到各主管道结点的单位钢管最小运输费用及对应运输路线，为后续优化生成运输成本矩阵。
    why: 交通网络同时包含按分段里程计价的铁路和按公里计价的公路，不能直接以物理距离作为统一边权，需要先将不同运输方式转换为费用权重，再搜索最小费用路径。
  - name: 钢管订购—运输—铺设二次规划模型
    role: 联合确定各钢厂向各管道结点的供货量，以及钢管从结点向相邻管段两侧铺设的数量，使采购费、干线运输费和沿管道铺设运输费之和最小。
    why: 采购费和钢厂至结点运输费关于订购量为线性函数，而沿管道逐段搬运产生的累计费用可近似表示为铺设长度的二次函数，因此整体可归结为带供需平衡、产能和管段覆盖约束的二次规划。
  - name: 最低起订量分情形约束模型
    role: 表达钢厂要么不生产、要么订购量不少于500单位且不超过产量上限的离散逻辑。
    why: 最低起订量约束属于析取约束，不能简单写成连续变量的统一上下界；论文通过对不满足条件的钢厂分别固定为零或不少于500单位并比较目标值，保证最终方案满足实际生产规则。
  - name: 参数扰动灵敏度分析模型
    role: 分别改变钢厂产量上限和出厂价格，重复求解优化模型，评估各参数对订购计划和最小总费用的影响。
    why: 通过单因素扰动可量化价格和产能参数的边际影响，识别关键供应商，为扩产、议价和风险管理提供依据。
  - name: 树形管网扩展优化模型
    role: 将线形管道的双向铺设变量推广为树形网络中结点到各相邻分支的铺设变量，并计入中转结点产生的附加运输费用。
    why: 树形管网存在分岔和中转，单一左右方向变量无法描述物资流向；采用按有向相邻边定义的铺设量可以保持流量守恒并适配一般网络结构。
  solution_flow: 数据：整理钢厂产能、最低起订量、出厂价格、铁路分段运价、公路单位运价以及交通网络和管道结点距离；模型：先将铁路与公路里程转换为统一的单位运输费用边权，用改进Dijkstra算法计算钢厂到管道结点的最小费用矩阵和运输路线，再建立包含采购费、节点前运输费和沿管道铺设费的二次规划；参数：设置钢厂订购量上限、500单位最低起订规则、结点物料平衡、相邻管段长度覆盖约束和变量非负约束；求解：删除不影响最优铺设的冗余结点，使用MATLAB
    QP函数求连续二次规划，并对最低起订量的不同可行情形分支求解后比较目标值；验证：检查产能、最低起订量、结点流量守恒和全部管段覆盖情况，比较各分支目标值，并通过价格与产能扰动检验方案稳定性，最终得到线形管道最小总费用1291698万元、树形管网最小总费用1418319万元。
  validation: 首先验证最短路径阶段输出的费用与实际铁路、公路计价规则一致，并检查对应路线是否连通；其次对优化结果逐项检查钢厂总订购量是否为零或处于500单位至产能上限之间、各结点到货量是否等于向各方向铺设量、相邻结点铺设量之和是否等于管段长度；再次比较最低起订量不同分支的目标函数值以确认所选方案为可行分支中的最优解；最后分别对钢厂产能上限进行2%至10%的扰动、对出厂价格增加5万元和10万元并重新优化，通过目标值和订购结构变化进行灵敏度验证，识别出S1产能上限和S5销售价格具有较强影响。
  visualization:
  - 铁路—公路—管道综合网络及最小费用路径图
  - 钢厂到管道结点订购量矩阵热力图
  - 各钢厂订购量与产能上限对比柱状图
  - 产能上限扰动—最小总费用灵敏度折线图
  - 出厂价格扰动—订购量及总费用变化图
  pitfalls_avoided:
  - 避免直接把铁路里程和公路里程作为同一种距离权重，因为铁路采用分段阶梯运价、公路采用按公里线性计价，物理最短路径不一定是费用最低路径。
  - 避免只把钢管运输到离散管道结点而忽略全线铺设，因为钢管需要覆盖结点之间的连续管段，必须引入从结点向相邻方向铺设的变量和管段长度守恒约束。
  - 避免将最低起订量简单设置为所有钢厂订购量均不小于500，因为钢厂可以不承担生产任务；正确逻辑应为订购量等于零或位于500与产能上限之间。
  - 避免保留所有候选铺设结点造成变量冗余，因为某些结点始终位于到相邻结点的最小费用路径之后，不可能成为更优的独立铺设点，删除后可降低二次规划规模。
  - 避免在树形管网中继续使用线形管道的左右两方向表示，因为分岔结点可能连接多个管段，还可能承担中转功能，必须按相邻分支设置变量并增加中转运输成本。
  - 避免把铺设费用近似视为完全精确，因为不足整公里按整公里计费会产生离散阶梯效应；论文明确指出二次连续表达是基于铺设距离较大且该项相对总费用较小的近似。
  innovation_points:
  - 采用分层网络处理多种计价机制：先在铁路子网中计算站点间最短铁路距离并转换为铁路费用，再与公路边共同构成费用网络，从而将多式联运问题转化为统一边权的最小费用路径问题。
  - 将最短路径预处理与订购分配二次规划解耦，先生成钢厂—管道结点单位运输成本矩阵，再优化供货量和铺设方向，降低了原始综合网络优化的复杂度。
  - 依据最小费用路径识别并删除无用铺设结点，在不改变最优性的前提下减少决策变量和约束数量。
  - 将线形管道模型推广到树形管网，通过面向相邻分支的铺设变量和中转附加费用描述分岔结点，使方法可用于更一般的运输与物资分配网络。
  - 通过参数扰动重复优化而非仅依据当前订购量判断重要性，定量识别钢厂价格和产能变化对最优方案及总费用的影响。
- id: 2011_2011年全国大学生数学建模竞赛B题省级一等奖论文
  source_paper: 2011 CUMCM B题 交巡警平台调度
  problem_type: 优化+综合评价+统计分析+仿真
  keywords:
  - Floyd最短路算法
  - 指派与选址优化
  - 动态围捕仿真
  context: 在城市交通网络和警务资源有限的背景下，优化交巡警服务平台的辖区划分、增设选址及警力调度，并评价现有平台布局的合理性。
  models:
  - name: Floyd全源最短路模型
    role: 计算交通网络任意两个路口之间的最短距离、最短时间及对应路径，为辖区分配、封锁调度、平台选址和围捕仿真提供基础数据。
    why: 城市路网可抽象为带权图，后续多个子问题均需要节点间最短路；Floyd算法能够一次性获得所有节点对之间的最短距离和路由矩阵。
  - name: 最近平台分区与辖区均衡调整模型
    role: 先按最短出警时间将各路口分配给最近的服务平台，再在满足3分钟到达约束的前提下调整辖区，使各平台管辖的路口数量尽量均衡。
    why: 最近分配能够直接降低出警时间，但单独使用会导致节点密集区域的平台工作量过重，因此需要结合路口密度和辖区规模进行二次调整。
  - name: 瓶颈指派优化模型
    role: 将服务平台警力指派至城区出入口，以所有封锁任务中的最大到达时间最小为目标，确定快速完成全封锁的核心调度方案。
    why: 全封锁完成时间取决于最后一个被封锁的路口，属于典型的最小化最大耗时问题；同时一个平台最多负责一个路口，符合0-1指派模型结构。
  - name: 剩余警力多目标调度模型
    role: 对完成核心封锁任务后剩余的平台警力，分别以最大到达时间最短和总到达时间最短进行优化，并结合路径关系进行人工修正。
    why: 剩余警力不影响首次全封锁时刻，但会影响后续封锁强度和整体调度效率，采用两个目标可兼顾最坏响应时间与总资源消耗。
  - name: 出警时间—工作量评价模型
    role: 利用3分钟覆盖情况、平台工作量均值和工作量标准差评价A区平台设置是否合理，并识别偏远路口和超负荷平台。
    why: 出警时间反映服务及时性，工作量及其标准差反映资源负担和均衡程度，两者是平台布局合理性的关键指标。
  - name: 需求指数与设施选址优化模型
    role: 根据路口是否为城区出入口及其到现有平台的距离构造需求指数，筛选候选增设点，再通过组合搜索最小化平台工作量标准差。
    why: 需求指数能够优先处理风险较高或位置偏远的路口，组合搜索则可在增设数量受限的条件下比较不同选址方案的均衡效果。
  - name: 六城区综合评价与布局调整模型
    role: 综合超过3分钟路口比例、单位平台发案率和单位人口平台数等指标，评价六城区平台配置并提出增设或迁移方案。
    why: 不同城区在人口、面积、案件数量和平台规模上差异明显，不能仅依据平台总数判断，必须使用标准化的相对指标进行横向比较。
  - name: 逃犯动态围捕计算机仿真模型
    role: 模拟报警延迟、警车与逃犯速度差异、逃犯可能路径及警力动态封堵过程，搜索最快围捕时间和围堵调度方案。
    why: 围捕过程具有明显的时空动态性和路径不确定性，静态指派难以描述逃犯可达区域随时间的变化，采用离散事件或时间推进仿真更合适。
  solution_flow: 数据→依据节点坐标、比例尺和道路连接关系构建带权交通网络，并计算相邻节点实际距离→使用Floyd算法生成全源最短距离矩阵和路由矩阵→将60km/h警车速度、90km/h逃犯速度、3分钟响应阈值和15分钟案件处理时间等转化为模型参数→按最近平台原则完成初始辖区划分，并依据辖区节点数和3分钟可达性进行均衡调整→建立最小化最大封锁时间的0-1指派模型，利用LINGO求解核心封锁方案，再优化剩余警力→以出警时间、工作量均值和标准差评价A区布局，构造需求指数并通过组合搜索确定新增平台数量与位置→利用多指标评价六城区配置并提出增设、迁移方案→在MATLAB中仿真逃犯和警力的动态运动，获得最快围捕时间与路径→通过特殊节点分析、指标前后对比和实际合理性检验验证结果。
  validation: 采用多层验证策略：首先检查最短路径与路网连接关系、比例尺换算和路径回溯的一致性；其次利用3分钟可达节点比例检验辖区划分的服务及时性；再次比较增设平台前后的平均工作量和工作量标准差，如A区标准差由50.88分钟降至42.03分钟，以验证选址改善效果；对封锁方案核验每个平台最多承担一个首要封锁任务、13个出入口均被覆盖且最大到达时间达到最小；最后通过特殊点分析和动态仿真复核围捕方案在报警延迟、速度约束和道路拓扑下是否可行，并结合现实警务逻辑进行合理性检验。
  visualization:
  - 交通网络与服务平台空间分布图
  - 交巡警服务平台辖区分区图
  - 偏远路口及候选增设点分布图
  - 平台工作量均值与标准差对比图
  - 六城区综合指标对比表或雷达图
  - 封锁调度路径表
  - 逃犯与警力动态围捕轨迹图
  pitfalls_avoided:
  - 避免直接使用节点间欧氏距离代替道路距离，因为警车只能沿实际道路通行；先构建带权路网并计算最短路径，可防止低估真实出警时间。
  - 避免只按最近平台机械分区，因为节点分布不均会使少数平台辖区过大、工作量过重；在保留3分钟可达性的前提下进行二次均衡调整。
  - 避免把全封锁目标误设为总出警时间最小，因为封锁完成时刻由最晚到达的警力决定；采用最小化最大到达时间的瓶颈目标符合木桶效应。
  - 避免对20个平台和13个封锁点强制一一对应，因为平台数量多于封锁点；先配置完成全覆盖所需的13个平台，再单独优化剩余7个平台的增援任务。
  - 避免仅以平台数量评价布局，因为不同城区的人口、面积和案件规模差异显著；采用单位平台发案率、单位人口平台数和超时路口比例等相对指标。
  - 避免将相邻且服务范围高度重叠的偏远路口同时设为平台，因为会造成重复建设；结合空间位置进行二次筛选，如28与29、38与39分别只选择一个代表点。
  - 避免只解决3分钟覆盖而忽略工作量均衡，因为新增平台即使覆盖偏远点也可能无法缓解高负荷辖区；进一步以工作量标准差作为选址优化指标。
  - 避免用静态最短路直接替代围捕过程，因为逃犯在报警前已逃跑且可达范围持续变化；通过动态仿真同步更新逃犯和警力的位置及可封堵节点。
  innovation_points:
  - 将3分钟响应要求转化为路网最短距离约束，并将最近平台分配与辖区节点数量均衡相结合，形成递进式两阶段分区方法。
  - 针对全封锁任务采用瓶颈指派与剩余警力二次优化相结合的调度框架，同时兼顾首次全封锁速度和后续增援效率。
  - 构造融合城区出入口属性与距离风险的需求指数，再以工作量标准差进行组合搜索，实现服务覆盖与负荷均衡的双层选址优化。
  - 将跨城区综合评价、设施增设与平台迁移统一到人口、案件、空间覆盖和服务负荷等多维指标体系中。
  - 设计全局无差别围捕算法，通过计算机仿真刻画报警延迟、速度差和多路径逃逸条件下的动态警力围堵过程。
- id: 2023_B477
  source_paper: 2023 CUMCM B题 多波束测深方案设计
  problem_type: 预测+优化+仿真
  keywords:
  - 多波束测深
  - 空间几何建模
  - 智能路径优化
  context: 针对海底地形起伏导致固定测线间距易产生漏测或过度重叠的问题，建立覆盖宽度计算、地形拟合与测线优化模型，以实现海域完整覆盖和测线总长度最短。
  models:
  - name: 二维坡面空间几何模型
    role: 计算二维坡面条件下的海水深度、单条测线覆盖宽度及相邻条带重叠率。
    why: 多波束覆盖范围由水深、坡度和换能器开角共同决定，可利用三角关系和正弦定理直接推导解析公式。
  - name: 修正重叠率模型
    role: 将测线间距投影到海底斜面，以重叠部分长度占总覆盖长度的比例评价相邻条带重叠程度。
    why: 传统公式基于水平海底，在坡面上可能给出与实际覆盖关系相反的结果；投影修正可消除坡度对重叠率定义的干扰。
  - name: 三维覆盖宽度模型
    role: 根据测线方向、海底法向水平投影夹角、局部坡度和当前水深计算三维条件下的覆盖宽度。
    why: 不同航向对应不同的横断坡度和水深变化，仅使用二维固定坡度模型无法反映覆盖宽度随位置和方向的变化。
  - name: 贪心递推测线设计模型
    role: 优先选择覆盖宽度最大的航向，并以10%至20%的重叠率为约束，递推确定相邻测线的位置、深度和数量。
    why: 在保证完全覆盖的条件下，局部增大覆盖宽度通常能够减少测线数量和总航程，且递推关系便于快速生成平行测线方案。
  - name: 分段三次埃尔米特插值模型
    role: 对离散单波束测深数据进行初步加密和地形可视化，展示三维海底形态与等深线结构。
    why: 该插值方法能够较好保持原始数据的局部形状和单调性，适合用于数据探索及地形特征的直观分析。
  - name: 随机森林地形拟合模型
    role: 建立坐标到海底深度的连续预测映射，并进一步估计任意位置的梯度、坡度和局部覆盖宽度。
    why: 相比线性回归和支持向量机，其对复杂非线性海底曲面的拟合度更高，可避免仅依靠密集插值造成的数据规模膨胀、缺失点失效和误差累积。
  - name: 改进飞蛾火焰优化算法
    role: 在海域分块后搜索各分区的最佳测线方向和路径，并整合为复杂真实海底上的全局布线方案。
    why: 复杂曲面下的测线规划具有非线性、多约束和较大搜索空间，群体智能算法适合进行路径组合搜索；结合局部梯度、贪心和微分信息可增强搜索针对性。
  solution_flow: 数据→对测深数据统一坐标与单位，利用分段三次埃尔米特插值完成初步加密和地形可视化，并以离散坐标—深度样本训练随机森林→模型→先建立二维坡面的深度、覆盖宽度和修正重叠率模型，再扩展为考虑航向与局部坡度的三维覆盖模型，最后构建贪心递推和改进飞蛾火焰路径优化模型→参数→提取水深、局部梯度、坡度、换能器开角、测线方向及目标重叠率等参数，并以梯度垂直方向或等深线切向作为优选航向→求解→简单平面海域递推生成平行测线并以“以”字形连接，复杂海域分块后迭代搜索各区路径，再合并得到总航线→验证→计算覆盖率、漏测面积占比、测线总长度和重叠率超过20%的航段长度，并进行模型一致性与参数敏感性检验。
  validation: 采用多层验证策略：将三维模型在参数一致的特殊情形下退化并与二维模型结果对比，以检验公式一致性；使用拟合优度R²比较线性回归、支持向量机和随机森林的地形拟合效果；检查所有测线是否满足完整覆盖及重叠率约束，并通过负重叠率识别漏测；改变目标重叠率、航向和开角，比较测线数量、覆盖宽度及路线密度的变化是否符合几何规律；最终以总长度、覆盖率、漏测率和超限重叠航段长度评价方案效果。
  visualization:
  - 坡面覆盖与投影关系几何示意图
  - 不同航向下覆盖宽度的圆锥截面图
  - 重叠率—测线数量关系图
  - 测线位置与水深分布图
  - 测线连接路径图
  - 海底深度三维曲面图
  - 等深线地形图
  - 随机森林拟合效果对比图
  - 开角—坡度—覆盖宽度三维响应图
  pitfalls_avoided:
  - 避免直接沿用水平海底的重叠率公式，因为斜坡条件下水平测线间距不能真实表示海底条带间距，可能出现重叠越明显但计算值越小的反直觉结果。
  - 避免按海域平均水深设置固定测线间距，因为覆盖宽度会随局部水深、坡度和航向显著变化，固定间距容易在浅水区产生漏测、在深水区造成过度重叠。
  - 避免只使用离散插值点参与路径搜索，因为点缺失可能使局部计算失效，过度加密又会造成数据量庞大、计算耗时和误差累积；因此采用随机森林提供任意坐标处的连续深度估计。
  - 避免忽略航向对横断坡度的影响，因为同一点沿不同方向航行时覆盖宽度差异明显；通过海底法向与航向平面的空间关系计算有效坡度。
  - 避免仅优化测线数量而忽略边界超测与连接航程，因为相同测线数量可能对应不同的边界冗余和总路径长度；论文比较深浅两端起始迭代并将平行测线连接成完整航路。
  - 避免把局部最大覆盖宽度直接等同于无条件全局最优，因为复杂地形还存在区域差异和路径衔接约束；通过海域分块、智能搜索和全局整合进行修正。
  innovation_points:
  - 将传统水平海底重叠率推广为基于海底斜面投影的重叠比例，使指标适用于坡面和复杂曲面。
  - 构建由二维坡面几何到三维航向相关覆盖宽度的递进模型，并证明最优覆盖航向通常与局部梯度垂直、与等深线相切。
  - 将覆盖宽度解析模型嵌入贪心递推过程，在重叠率约束下自动确定测线位置、数量和疏密分布。
  - 利用随机森林把离散单波束测深数据转化为可查询任意位置深度与梯度的连续地形代理模型。
  - 融合微分思想、局部梯度信息、贪心策略和改进飞蛾火焰算法，通过分块搜索解决复杂真实海底的多约束测线路径优化问题。
- id: B题_1910
  source_paper: 2008 CUMCM B题 高等教育学费标准
  problem_type: 统计分析+综合评价+分类聚类+优化+仿真
  keywords:
  - 学费走廊
  - 教育社会贡献转化优化
  - 贫困生助学补助
  context: 在政府教育投入有限、地区与家庭收入差异显著的背景下，定量确定不同院校层次和专业的合理学费标准、教育经费投入及贫困生补助金额。
  models:
  - name: 教育财政支出因子分析模型
    role: 对各省教育财政投入的综合实力和发展潜力进行降维评价与排序，为地区差异分析和代表地区选取提供依据。
    why: 预算内教育经费、生均事业费、生均公用经费和教职工工资等指标相关性较强，因子分析可消除指标冗余，并以少数公共因子概括地区教育实力。
  - name: 居民收入聚类分析模型
    role: 依据城镇居民人均可支配收入对地区进行分类，并从各类中选取代表性地区。
    why: 不同地区居民支付能力差异明显，聚类能够将收入水平相近的地区归组，避免逐省建模造成模型复杂和结论碎片化。
  - name: 学费走廊构造模型
    role: 以居民可承受水平和高校办学成本或收益要求构造学费上下限，并测算政府对不同地区居民的学费补贴。
    why: 单一学费点值难以同时兼顾家庭承受能力与高校培养质量，区间形式可以为政府价格调控和财政补贴保留政策空间。
  - name: 教育－社会贡献转化优化规划模型
    role: 在家庭支付能力、教学资源需求和政府社会投入总额等约束下，以大学生未来社会贡献率最大化为目标，联合确定各院校批次、各专业的学费和教育经费分配。
    why: 学费制定涉及教育成本、教育质量、专业社会需求和财政预算之间的多重权衡，优化规划适合处理资源有限条件下的联合决策。
  - name: 贫困生生活质量改善优化规划模型
    role: 在不同家庭收入、专业学费、最低补助率和助学资金总额等约束下，以贫困生生活质量改善最大化为目标，确定分层分类的助学补助金额。
    why: 统一补助标准无法反映家庭收入和专业学费差异，分层优化可以提高有限助学资金的公平性与边际效用。
  - name: 助学补助函数模型
    role: 将优化模型得到的补助规则转化为家庭可支配收入和应缴学费的函数，支持快速计算与政策实施。
    why: 逐个求解优化模型不便于实际管理，显式函数可降低助学金审核和分配的计算成本，并增强政策的可操作性。
  - name: 专业收费计算机仿真模型
    role: 针对广东三类院校和十三类专业进行多次模拟，估计标准学费、国家拨款及社会资助的配置结果。
    why: 专业比例、教育质量系数和潜在社会贡献率等参数具有差异性，通过多次仿真可考察不同组合下的资源配置结果，并辅助优化模型求解。
  solution_flow: 收集各省教育经费、生均事业费、生均公用经费、工资总额、经费增长率、居民可支配收入、院校专业结构和培养成本等数据→数据整理与标准化→利用因子分析评价地区教育综合实力和发展潜力→利用聚类分析划分居民支付能力相近的地区并选择代表地区→构造学费走廊，确定可承受学费区间和地区补贴需求→设定教育成本、教育质量、专业社会贡献率、学生比例及财政限制等参数→建立教育－社会贡献转化优化模型，求解分院校批次和分专业的学费及教育经费配置→建立贫困生生活质量改善优化模型，求解分收入阶层、分专业的补助额度→拟合或推导助学补助函数→以广东三批院校和十三类专业进行仿真计算→将模型学费与高校现行收费标准比较并形成政策建议。
  validation: 采用多层次验证：首先检查因子分析前两个公共因子的累计贡献率，论文中达到97.78%，说明主要信息保留充分；其次比较综合得分排序与东部沿海、经济特区教育实力较强而西北内陆较弱的现实格局是否一致；再次将广东三类院校、十三类专业的模型学费与各高校现行收费进行对照，检验结果的现实合理性，并识别农林类、生物类现行收费明显低于模型标准值的异常；最后通过财政总额、教育成本承担比例、最低补助率和学生支付能力等约束检查结果的预算可行性与政策可实施性。
  visualization:
  - 地区教育综合实力与发展潜力排名图
  - 省份收入聚类分组图
  - 学费走廊上下限区间图
  - 学校教育费用收支关系图
  - 模型学费与现行学费对比柱状图
  - 家庭收入－学费－助学补助函数曲面图
  pitfalls_avoided:
  - 避免仅用教育经费绝对额评价地区教育水平，因为绝对额会受到地区人口规模和经济总量影响；模型同时引入生均指标、增长比例和财政支出占比，并通过因子分析形成综合评价。
  - 避免直接采用全国统一学费标准，因为地区居民收入、地方财政能力和高校培养成本差异显著；通过聚类和学费走廊实行地区分类定价与差异化补贴。
  - 避免只考虑高校培养成本而忽略家庭支付能力，否则可能导致普通家庭因学返贫；优化模型将家庭承受能力和贫困生基本生活费用纳入约束。
  - 避免学费过低导致教学经费不足、教育质量下降；模型把教育经费与教育成本之比同教育质量联系起来，并设置教育成本承担比例和经费配置约束。
  - 避免假设教育投入可以无限提高教育质量，因为投入的边际效益会递减；模型明确假设经费增加到一定程度后对质量改善有限，并设置学生总经费与教育成本比例上限。
  - 避免对所有贫困生实行等额补助，因为家庭收入和专业学费不同会造成横向不公平；模型按照收入阶层、院校批次和专业类别分配补助。
  - 避免优化结果超出政府和社会的财政承受能力；模型设置可分配教育总经费、贫困生补助总额和财政限制因子，对理论最优结果进行预算调整。
  innovation_points:
  - 将地区教育实力因子评价、居民收入聚类、学费走廊和微观资源配置优化串联，形成从宏观地区差异到院校专业定价的多层次建模框架。
  - 以潜在社会贡献率最大化而非单纯成本回收作为学费和教育经费配置目标，将专业社会需求、教育质量和人才培养效益纳入定价。
  - 在学费优化基础上进一步建立贫困生生活质量改善模型，实现学费标准、政府教育投入和困难学生补助的联动决策。
  - 把复杂的助学金优化结果转化为家庭可支配收入与应缴学费的显式补助函数，提高资助政策的透明度、计算效率和可执行性。
  - 对广东三类院校和十三类专业进行细分仿真，使模型能够识别农林类、生物类等具体专业的收费偏差，而非只给出全省平均标准。
- id: 2018_C052
  source_paper: 2018 CUMCM C题 会员画像数据挖掘
  problem_type: 统计分析+综合评价+分类聚类+预测+优化
  keywords:
  - RFMS指标
  - 会员生命周期
  - 连带促销
  context: 针对大型百货商场会员流失与精细化运营需求，利用会员、销售流水、消费明细和商品数据构建会员画像、价值分级、状态转移、激活分析及促销策划体系。
  models:
  - name: 会员消费特征描述统计与群体对比模型
    role: 从消费频次、消费总额、平均消费金额、单次最高消费、年龄和性别等维度刻画会员特征，并比较会员与非会员的消费价值差异。
    why: 描述统计和分组对比能够直接揭示客户结构、消费分布及群体差异，为后续指标选择、价值评价和营销策略制定提供数据依据。
  - name: FMS会员购买力综合评价模型
    role: 以消费频次F、消费总额M和单次最高消费S评价每位会员的购买力，通过百分位阈值评分并按G=100F+10M+S形成8种购买力类别，再映射为铂金、黄金、白银和青铜四个价值等级。
    why: F和M分别反映持续消费能力与累计贡献，S补充传统RFM模型对单次高额购买能力刻画不足的问题；百分位评分能够降低量纲和偏态分布对评价结果的影响。
  - name: RF消费状态评价模型
    role: 利用最近一次消费时长R和消费频次F构造状态指标Z=R×F，在不同时间窗口中将会员划分为非活跃、一般活跃、很活跃及休眠状态。
    why: 会员活跃度同时取决于消费是否近期发生以及消费是否频繁，RF组合比单一频次或单一最近消费时间更能反映当前消费状态。
  - name: 滑动时间窗口会员生命周期模型
    role: 以半年为基本单位设置并滑动、扩展研究窗口，计算会员从入会到各窗口的生命周期，分析不同生命周期会员的状态分布及其随时间的变化。
    why: 静态全周期统计会掩盖会员状态转移，滑动窗口可以动态追踪新会员增长、活跃会员变化和非活跃会员规模，适合刻画生命周期演化。
  - name: 非活跃会员激活率模型
    role: 追踪相邻窗口中的状态转移，将上一窗口非活跃且下一窗口转为一般活跃或很活跃的会员占上一窗口非活跃会员总数的比例定义为激活率。
    why: 该定义直接对应非活跃到活跃的实际转化事件，能够量化会员挽回概率，并支持不同时段激活效果的横向比较。
  - name: 促销活动—激活率关系模型
    role: 建立A(t_{i+1})=f(x_n,x_d,x_z,x_l)，分析促销总次数、底价促销次数、折扣促销次数和折扣力度对非活跃会员激活率的影响。
    why: 这些变量可由实际销售流水识别，既覆盖促销频度也覆盖促销强度，可用于判断折扣活动的即时作用和延迟作用，并为会员唤醒活动提供依据。
  - name: 会员偏好与商品交叉连带率模型
    role: 按商品品牌或类别统计会员购买次数形成偏好排序，并计算热销类别之间的交叉连带率，据此组合主推商品与关联商品，设计节日促销方案。
    why: 消费偏好反映需求基础，交叉连带率反映商品共同购买关系，将两者结合比单纯依据销量选品更有利于扩大关联消费和提升促销收益。
  solution_flow: 数据→清洗异常办卡日期、出生日期、负售价、负销量、负消费金额和负积分记录，并通过卡号及“消费时间—商品编码—消费金额”等字段匹配会员信息、销售流水、消费明细与商品表→统计年龄、性别、频次、金额、客单价和单次峰值，完成会员与非会员对比→按总体百分位确定F、M、S评分阈值及位权，计算购买力得分并完成8类划分和四级价值映射→以半年为单位构造6个滑动时间窗口，计算生命周期、R和F并识别消费状态→比较相邻窗口状态转移，计算5个时段的非活跃会员激活率→提取促销次数、底价活动次数、折扣活动次数和折扣率，拟合或分析其与激活率的关系→统计商品类别偏好及交叉连带率，筛选热销类别并形成组合促销方案→通过随机抽样评价、群体统计一致性和跨窗口状态转移结果验证模型。
  validation: FMS模型采用随机抽取会员并将模型等级与实际消费质量对照的方式检验，结果中高质量评价命中率为62.5%，其余样本也处于中上评价水平；消费特征模型通过会员与非会员在频次、总额和平均金额上的同向差异进行外部合理性检验；生命周期与激活模型通过连续时间窗口追踪同一会员的真实状态转移，并比较2015—2017年各时段激活率及促销活动变化，检验时间一致性和业务解释性；促销方案则利用历史购买偏好、热销排序和交叉连带率进行数据支持。
  visualization:
  - 会员性别比例饼图
  - 年龄段人数及占比柱状图
  - 消费频次与消费总额分布表或直方图
  - 平均单次消费与单次最高消费分布图
  - 不同性别和年龄段消费频次分组柱状图
  - 不同性别和年龄段消费金额分组柱状图
  - 会员与非会员消费指标对比表
  - 生命周期—活跃状态分布图
  - 各时间窗口激活率折线图
  - 商品偏好排行与交叉连带率矩阵图
  pitfalls_avoided:
  - 没有直接把全部消费明细视为本地会员数据，而是用会员卡号匹配本地会员，并用消费时间、商品编码和消费金额关联销售流水，从而避免非本地会员或非会员混入目标会员群体造成价值高估。
  - 剔除了异常办卡日期、异常出生日期以及负售价、负销量、负消费金额和负积分记录，避免退货、录入错误或无效会员信息扭曲频次、金额和购买力评分。
  - 比较会员与非会员时统一使用两类数据都具备的消费行为指标，没有强行使用非会员数据中缺失的年龄和性别信息，从而避免因指标口径不一致产生伪差异。
  - 将研究窗口内无消费记录的会员单独定义为休眠状态，而不是直接归入非活跃会员并进入激活率分母，避免休眠样本大量稀释真实非活跃会员的转化概率。
  - 使用相邻时间窗口追踪同一会员的状态变化，而不是用不同年份的总体人数直接代替状态转移，避免将新增会员或样本构成变化误判为会员激活。
  - FMS各指标先按总体百分位阈值评分再组合，避免消费金额、频次和峰值金额量纲不同以及长尾分布导致某一指标机械主导综合得分。
  - 在偏好分析之外继续计算商品交叉连带率，避免仅凭单品热销程度进行组合促销而忽略商品之间是否存在真实共同购买关系。
  innovation_points:
  - 在传统RFM框架中分离价值评价与状态评价：用FMS刻画购买力、用RF刻画活跃状态，使会员贡献能力和当前活跃程度不被混为同一概念。
  - 引入单次最高消费S补充累计消费总额与频次，识别低频但单次购买能力很强的高质量会员，并采用位权编码实现细分类别与价值等级映射。
  - 将半年滑动时间窗口、生命周期和状态转移结合，动态刻画新会员、活跃会员、非活跃会员及休眠会员的演化，而非只给出静态画像。
  - 把非活跃会员激活率与促销次数、促销类型和折扣力度相联系，并识别大折扣活动可能存在的延迟效应，为活动前宣传和会员唤醒提供依据。
  - 将会员商品偏好与交叉连带率联合用于促销选品，使方案同时考虑会员愿意购买什么以及哪些商品容易被共同购买。
- id: 2023_C126
  source_paper: 2023 CUMCM C题 商超蔬菜销售数据分析
  problem_type: 统计分析+预测+优化
  keywords:
  - Bayesian模型
  - VAR模型
  - 收益最大化优化
  - 同期平均
  - 零膨胀数据
  context: 基于商超三年蔬菜销售、批发价格、退货和损耗数据，分析品类及单品销量关系，并制定未来一周的补货与定价策略以提高收益、降低损耗。
  models:
  - name: Shapiro-Wilk正态性检验与相关性分析
    role: 识别销量分布特征及不同蔬菜单品之间的关联关系，并构造T/F相关性判别矩阵。
    why: 销量数据含大量零值且显著偏离正态分布，需要先检验传统正态回归的适用性；相关性分析可识别可能存在互补或替代关系的单品。
  - name: Bayesian正态销量模型
    role: 以目标单品日销量为响应变量、其他相关单品销量为解释变量，估计单品之间影响方向、影响强度及参数后验区间。
    why: 在经过同期平均降低零值比例后，Bayesian框架可结合宽松先验和MCMC获得参数后验分布，并量化参数估计的不确定性与单品间关系。
  - name: Bayesian对数正态销量模型
    role: 描述西兰花等右偏、非负销量与销售次数、批发价、零售价、退货及损耗之间的关系，并与正态模型进行对比。
    why: 部分单品销量具有明显右偏和非负特征，对数变换后更适合使用正态似然建模，也可减弱极端销量对参数估计的影响。
  - name: VAR(2)多变量时间序列模型
    role: 联合预测未来一周各蔬菜品类或单品的销售量和补货量，并刻画不同序列之间的动态影响。
    why: 销售量、补货量和损耗等指标具有时间依赖及相互影响；结合蔬菜当日未售、隔日大多无法继续销售的经营规律，将滞后阶数设为2。
  - name: 收益最大化约束优化模型
    role: 在销量和补货量预测结果基础上，联合确定未来一周补货总量、成本加成定价和经营单品组合。
    why: 商超决策不仅要求满足需求，还受到损耗、批发成本、陈列量不低于2.5千克及单品数量控制等约束，因此需通过约束优化平衡收入、成本与损耗。
  solution_flow: 销售明细、批发价格、退货及损耗数据→按单品编码和日期透视汇总，形成日销售数据，并用同期平均将三年同期数据转换为年度序列以减少零值和计算量→进行Shapiro-Wilk检验及相关性分析，筛选关联单品→建立Bayesian正态或对数正态销量模型，设置弱信息先验并通过MCMC获得参数后验估计→依据进货量等于销售量与退货量之和除以一减损耗率计算历史补货量，建立VAR(2)预测未来一周销售量和补货量→依据成本加成定价关系构造收益最大化目标及陈列、损耗、补货和单品数量约束，求解补货与定价策略→通过MCMC诊断、参数区间和不同方法结果一致性验证方案。
  validation: 首先用Shapiro-Wilk检验确认销量不服从正态分布，并通过相关系数阈值及双侧显著性检验验证单品关联；Bayesian模型采用参数轨迹图检查MC链平稳与收敛，采用核密度图检查后验分布形态，采用自相关图确认滞后约10期后相关性衰减，并结合MC误差、后验标准差和95%可信区间评价估计精度；VAR阶数依据蔬菜最多跨两日销售的业务机理确定；最终通过VAR结果与频率法分别确定经营单品数量，二者均得到29个单品，以交叉一致性增强决策可信度。
  visualization:
  - T/F相关性判别矩阵
  - MCMC参数动态轨迹图
  - 参数后验核密度估计图
  - MC链自相关图
  - 日进货量点线图
  - Bayesian参数后验估计汇总表
  pitfalls_avoided:
  - 避免在未检验分布的情况下直接使用传统线性回归：Shapiro-Wilk检验显示销量显著偏离正态分布，直接套用经典回归可能导致参数估计和显著性判断失真。
  - 避免直接对大量零值的日销量建立普通连续分布模型：原始数据具有明显零膨胀和季节性断售特征，论文先用同期平均减少零值比例，从而降低建模难度。
  - 避免将三年1084个日样本全部直接输入OpenBUGS：高维数据与大量零值会显著增加MCMC计算压力，因此将三年同期数据汇总为一个年度序列后再进行后验计算。
  - 避免仅凭主观经验确定VAR滞后阶数：根据蔬菜当日进货、最多陈列销售两天的保鲜规律设定VAR(2)，使阶数具有明确业务含义。
  - 避免只预测销量而忽略损耗和退货：通过进货量等于销售量与退货量之和除以一减损耗率，将预测需求转换为可执行的实际补货量。
  - 避免仅依据单一模型确定经营单品数：同时使用VAR预测结果和频率方法确定控制数量，并以两种方法均得到29个单品进行交叉验证。
  innovation_points:
  - 采用同期平均法将三年销售数据压缩为代表性年度序列，同时缓解零膨胀、季节性断售和MCMC计算负担。
  - 将相关系数阈值与显著性结果编码为T/F矩阵，直观展示大量蔬菜单品之间的关联网络。
  - 针对不同单品分布特征分别建立Bayesian正态模型和对数正态模型，并使用完整的后验轨迹、核密度、自相关及MC误差进行诊断。
  - 形成“Bayesian关系解释—VAR动态预测—收益最大化优化”的分层建模链条，将统计规律、短期预测与经营决策统一起来。
  - 把蔬菜易腐、最多跨两日销售的实际经营机制转化为VAR模型的二阶滞后结构，提高模型设定的可解释性。
- id: 2012_A335
  source_paper: 2012 CUMCM A题 葡萄酒质量评价
  problem_type: 统计分析+综合评价+分类聚类+预测
  keywords:
  - 双向方差分析
  - 优势矩阵
  - 逐步回归
  - 置信区间
  - Pearson关联分析
  context: 基于评酒员评分、酿酒葡萄理化指标和葡萄酒理化指标，分析评价可信度、划分葡萄等级，并研究理化性质与葡萄酒质量之间的关系。
  models:
  - name: 双向方差分析模型
    role: 分别以评酒员和酒样为区组，检验评酒员主观差异与酒样质量差异是否显著，并比较两组评分结果的可信度。
    why: 评分同时受到评酒员个人尺度和酒样真实差异的影响，双向方差分析能够分离两类变异来源，并通过F统计量和显著性水平进行定量判断。
  - name: 评酒数据标准化模型
    role: 按评酒员对评分进行中心化和尺度统一，降低不同评酒员评分均值及波动范围不同带来的影响。
    why: 不同评酒员可能存在宽严尺度和打分离散程度差异，标准化可消除位置与尺度效应，使酒样间差异更具可比性。
  - name: 置信区间数据处理模型
    role: 识别并收敛评酒员对同一酒样的异常或分歧评分，形成更稳健的评价数据。
    why: 原始评分可能因个别评酒员主观偏差而出现极端值，置信区间法能够保留合理波动，同时削弱异常评分对均值和方差分析的干扰。
  - name: K-Means均值聚类模型
    role: 根据葡萄理化指标的数值相似性，对样本或指标进行初步类别划分，为等级确定提供基础。
    why: 葡萄理化指标数量多、结构复杂且缺少先验等级标签，聚类适合从数据内部相似性出发发现自然分组。
  - name: 优势因子矩阵综合评价模型
    role: 比较各类别和样本在外观、风味、加工、保健等指标上的相对优势，并结合葡萄酒质量加权计算葡萄综合等级优势值。
    why: 单纯聚类只能给出类别而不能说明等级高低，优势矩阵可将指标间的相对优劣转化为可加总的优势值，从而实现有序分级。
  - name: Pearson相关系数矩阵模型
    role: 分析酿酒葡萄理化指标、葡萄酒理化指标以及外观、香气、口感评分之间的线性关联方向和强度。
    why: 相关系数矩阵能够快速筛选高关联指标对，为后续回归变量选择和可能的物质作用机制分析提供依据。
  - name: 逐步多元回归模型
    role: 以葡萄理化指标为解释变量、葡萄酒各理化指标为被解释变量，筛选显著变量组合并建立数量关系。
    why: 酿造过程具有多因素共同作用特征，逐步回归可通过变量进入和剔除机制减少冗余变量，提取对目标指标贡献较显著的因素组合。
  - name: 多级嵌套逐步回归模型
    role: 第一级建立葡萄酒理化指标到外观、香气、口感等质量评分的回归关系，第二级建立酿酒葡萄理化指标到关键葡萄酒理化指标的回归关系，以论证质量评价的可行性。
    why: 葡萄指标通常先经酿造过程转化为葡萄酒成分，再影响感官质量；分级建模比直接将葡萄指标回归到质量评分更符合实际作用链条。
  solution_flow: 数据→校正缺失、格式错误和数量级异常数据，将极小型、居中型和区间型指标统一转化为极大型指标并无量纲化→对原始评分实施双向方差分析，识别评酒员主观差异→分别采用标准化和置信区间法处理评分，再次进行方差分析并确定红、白葡萄酒较可信的评价组→依据外观、风味、加工、保健等维度建立葡萄指标体系，使用K-Means形成初始类别→构造优势因子矩阵，结合可信葡萄酒评分进行加权汇总并划分葡萄等级→构造Pearson相关系数矩阵筛选高关联指标→采用逐步回归建立葡萄指标与葡萄酒指标的关系→采用两级嵌套逐步回归连接葡萄指标、葡萄酒指标与外观、香气、口感质量→通过显著性检验和结果合理性分析判断模型有效性及质量评价可行范围。
  validation: 以0.01或0.05为显著性水平，利用F统计量、临界F值和P值检验方差差异及回归方程整体显著性；比较原始数据、标准化数据和置信区间处理数据的双向方差分析结果，检查是否有效降低评酒员效应并增强酒样区分度；对逐步回归保留变量及方程进行显著性检验，并结合相关系数方向、酿造机理和红白葡萄分级区分度开展合理性验证；只有第一级质量回归和第二级指标传导回归均显著时，才认定葡萄理化指标能够间接评价相应质量维度。
  visualization:
  - 双向方差分析结果表
  - 相关系数矩阵热力图
  - 葡萄样本聚类与等级分布图
  - 综合优势值排序柱状图
  - 逐步回归拟合散点图
  - 回归残差诊断图
  pitfalls_avoided:
  - 避免直接对评酒员原始平均分进行比较，因为评酒员的宽严尺度和评分波动差异可能掩盖酒样真实质量差异；先用双向方差分析识别评酒员效应，再进行标准化或置信区间处理。
  - 避免将不同方向的指标直接聚类或加权，因为极大型、极小型、居中型和区间型指标的优劣方向不一致会造成距离和综合得分失真；建模前统一转换为极大型指标。
  - 避免不同单位和数量级主导聚类结果，因为含量较大或量纲较大的指标会在欧氏距离中获得不合理权重；通过无量纲化处理提高指标可比性。
  - 避免仅凭聚类编号直接解释质量等级，因为聚类标签本身没有高低次序；引入优势因子矩阵比较类别相对优劣，再形成有序等级。
  - 避免仅依据单一高相关系数推断因果关系，因为酿造过程存在多物质交互与共同影响；相关分析只用于筛选和提出假设，最终结合多元逐步回归与显著性检验。
  - 避免把酿酒葡萄指标直接等同于葡萄酒感官质量，因为葡萄成分需经过发酵和加工转化后才作用于感官表现；采用“葡萄指标→葡萄酒指标→质量评分”的多级嵌套结构。
  - 避免因逐步回归自动筛选变量而直接接受方程，因为自动选变量可能保留偶然相关或产生过拟合；需同时检查方程F检验、变量显著性、相关方向和实际酿造机理。
  innovation_points:
  - 将评酒员和酒样同时作为区组开展双向显著性检验，并通过比较两类F统计量区分主观评价差异与酒样真实差异。
  - 将置信区间处理与标准化处理进行对照，以处理后评酒员效应降低程度和酒样区分能力作为方法优劣依据。
  - 在无监督聚类基础上引入优势因子矩阵，使无序类别转化为具有明确高低关系的葡萄质量等级。
  - 将葡萄自身品质指标与其酿造出的葡萄酒质量共同纳入等级优势值，使葡萄分级兼顾原料性质与最终产品表现。
  - 把传统逐步回归扩展为多级嵌套结构，刻画葡萄理化指标经葡萄酒理化指标间接影响外观、香气和口感质量的传导路径。
  - 对葡萄酒质量进行外观、香气和口感分维度评价，而非仅建立总分模型，从而识别哪些感官维度可被理化指标有效解释。
- id: 2016_D056
  source_paper: 2016 CUMCM D题 风电场运行维护优化
  problem_type: 统计分析+综合评价+优化
  keywords:
  - 风能资源评估
  - 风机匹配
  - 双目标维护优化
  context: 基于风电场全年15分钟风速、实际输出功率及不同机型参数，评估风资源利用状况、筛选适配机型，并优化124台风机的维护计划与维修人员排班。
  models:
  - name: 风速数据完整性与合理性检验模型
    role: 检查风速数据的缺失、格式错误、取值越界和时间变化异常，并利用同一时段的合理观测均值修正错误数据。
    why: 风功率与风速高度敏感，少量异常值也可能显著影响功率密度、发电量和机型匹配结果，因此必须先依据行业标准保证数据质量。
  - name: 多时间尺度风速统计模型
    role: 将15分钟风速依次聚合为逐小时、逐日、逐月和年平均风速，并统计不同风速区间的有效小时数。
    why: 多尺度统计既能满足风资源评估对连续逐小时数据的要求，也能刻画风速的日、月和季节变化特征。
  - name: 风功率密度综合评价模型
    role: 计算平均风功率密度、有效风功率密度、年平均风速和年有效小时数，并依据风能资源等级标准判定风场资源等级。
    why: 风功率密度体现单位迎风面积上的可利用风能，比单独使用平均风速更能反映风资源的发电潜力。
  - name: 插值积分风能利用率模型
    role: 将理论输出功率和实际输出功率插值为关于时间的连续函数，通过定积分分别计算理论发电量与实际发电量，进而求得风能利用率。
    why: 功率观测是离散时间数据，插值积分能够统一时间尺度并近似计算全年累计电量，从而定量比较理论产出与实际产出。
  - name: 基于偏差标准差与协方差的一致性分析模型
    role: 利用偏差的标准差评价理论功率与实际功率的变化幅度一致性，利用协方差评价二者变化趋势一致性。
    why: 单一利用率只能反映全年总量差异，一致性分析可进一步揭示实际出力是否跟随理论出力变化及其波动偏差。
  - name: 三次多项式分段功率曲线拟合模型
    role: 拟合不同机型在有效风速区间内的风速—功率关系，并结合切入风速、额定风速、切出风速和额定功率构造分段功率函数。
    why: 厂商仅提供离散功率曲线或关键参数，三次多项式能够描述非线性的风速—功率关系，而分段形式可体现风机不同运行工况。
  - name: 风资源—风机匹配综合评价模型
    role: 将典型位置的风速代入各机型功率曲线，计算预计发电量、容量系数、有效小时数和最优小时数，据此比较现有机型与新机型的适配程度。
    why: 容量系数反映综合发电效率，有效小时数反映可运行机会，最优小时数反映高效运行机会，多指标结合比仅比较额定功率更可靠。
  - name: 双目标维护计划与人员排班优化模型
    role: 在不考虑风速时最小化风机最大连续工作间隔并均衡各维修组任务；在考虑风速时兼顾停机发电损失与维修组工作量均衡，同时满足维护频次、连续运行、人员数量和值班规则。
    why: 维护经济效益与人员负荷均衡存在冲突，问题不存在单一绝对最优方案，双目标模型能够刻画两类管理目标之间的权衡。
  - name: 启发式多目标求解算法
    role: 在离散日期、风机和维修组的组合空间内构造并迭代调整可行排班，获得双目标模型的有效解或弱有效解。
    why: 维护排班包含大量离散决策和复杂连续工作约束，精确枚举计算量过大，启发式算法更适合快速搜索可实施的近优方案。
  solution_flow: 导入全年15分钟风速、日实际功率、典型机位风速及机型参数→按照行业标准进行时间连续性、完整率、取值范围和趋势性检验，并修正缺失或无效数据→聚合得到逐小时、逐日、逐月和年平均风速，计算平均及有效风功率密度、有效小时数并完成风资源等级评价→建立理论与实际功率的插值函数，通过积分计算累计电量和利用率，再用标准差与协方差分析幅度及趋势一致性→对各机型风速—功率曲线进行三次多项式分段拟合，将典型机位风速代入并计算发电量、容量系数、有效小时数和最优小时数，完成机型匹配评价→分别建立不考虑和考虑风速信息的双目标维护排班模型，设置每台风机每年维护两次、两次维护间隔不超过270天、每次连续维护2天、每天一组值班、最多4组人员且每组连续工作不超过6天等约束→利用启发式算法搜索兼顾经济效益与工作量均衡的有效解→通过标准阈值、指标交叉比较和约束复核验证评价及排班结果。
  validation: 首先依据风能资源测量与评估标准验证数据质量，检查测量数据完整率是否不低于98%、有效数据完整率是否不低于90%、小时平均风速是否位于0至40米每秒且相邻小时变化是否小于6米每秒；其次检查功率曲线分段函数在切入、额定和切出风速附近的合理性，并用理论与实际功率的利用率、偏差标准差和协方差进行总量及变化一致性交叉验证；最后逐项复核维护方案是否满足每台风机每年维护两次、维护间隔上限、连续维护天数、每日值班、维修组数量及连续工作不超过6天等硬约束，同时比较各组维修台次以检验均衡性。
  visualization:
  - 全年逐小时平均风速时序折线图
  - 逐日或逐月平均风速变化图
  - 理论功率与实际功率对比折线图
  - 不同机型风速—功率曲线图
  - 各机型容量系数与有效小时数分组柱状图
  - 维修人员排班与风机维护甘特图
  pitfalls_avoided:
  - 避免直接使用含缺失值、字符串粘连和异常格式的原始风速数据，因为风功率近似随风速三次方变化，异常值会被显著放大并扭曲资源等级和发电量估计。
  - 避免只检查数值是否越界而忽略时间连续性和趋势突变，因为格式正确但时间缺测或相邻时刻突跳的数据仍可能不符合测风规律。
  - 避免仅用年平均风速评价风资源，因为相同平均风速可能对应完全不同的风速分布和可利用能量，需联合风功率密度、有效小时数等指标。
  - 避免将离散功率样本简单相加且忽略采样时间尺度，因为理论功率与实际功率的记录频率可能不同，先插值并按时间积分才能得到可比的累计发电量。
  - 避免只按新机型额定功率大小判断是否适配，因为当地风速可能长期达不到额定区间，必须比较容量系数、有效小时数和最优小时数。
  - 避免用单一高阶多项式覆盖全部风速范围，因为切入风速以下、额定区间和切出风速以上具有不同物理状态，统一拟合可能产生负功率或超过额定功率。
  - 避免维护计划只追求低风速时停机而忽略人员约束，因为每天值班、连续维护2天和连续工作不超过6天等条件可能使经济上理想的方案不可执行。
  - 避免将经济效益与工作量均衡强行合并为未经解释的单一最优目标，因为两者天然冲突，应保留双目标结构并搜索有效解或弱有效解。
  innovation_points:
  - 构建了从数据质量控制、多时间尺度风速统计、资源等级评价到利用效率分析的一体化风资源评估框架。
  - 除年度风能利用率外，引入偏差标准差和协方差，从变化幅度与变化趋势两个维度评价实际出力对理论出力的跟随程度。
  - 将拟合得到的分段功率曲线与典型机位实测风速结合，并联合容量系数、有效小时数和最优小时数开展多指标机型匹配。
  - 针对维护计划分别设置不考虑风速和考虑风速的两种情景，使安全均衡目标与基于发电损失的经济目标能够进行对照。
  - 将风机维护日期、维修组排班和全天候值班安排纳入同一双目标离散优化框架，并采用启发式算法寻找可实施的多目标有效解。
- id: 2017_D035
  source_paper: 2017 CUMCM D题 巡检线路排班
  problem_type: 优化
  keywords:
  - 无向赋权图与最短路
  - 背包分段
  - 巡检排班优化
  context: 针对化工厂多巡检点具有不同巡检周期、巡检耗时和通行时间的场景，优化巡检回路、最低班次人数及轮岗轮班方案。
  models:
  - name: 无向赋权图最短路模型
    role: 将巡检点作为顶点、点间连通关系作为边、行走时间作为边权，并通过分阶段指定中间点求得覆盖全部巡检点且返回调度中心的较短回路。
    why: 巡检点之间存在明确的网络连通关系和行走成本，图论模型能够描述道路约束，并以总行走时间最小为目标降低巡检过程中的非作业耗时。
  - name: 背包分段模型
    role: 依据最短回路上的累计时间轴，将完整回路划分为若干连续区段，以每段内巡检点的最小巡检周期约束区段长度，并最小化分段数量，将最少分段数解释为每班最低人数。
    why: 在回路和总累计时间确定后，人员配置问题可转化为有限时间长度的覆盖与分段优化问题，适合使用带周期容量约束的背包式整数优化模型。
  - name: 人力资源消耗评价模型
    role: 以工作人员的空闲时间与加班时间之和衡量个人、班次及全天的人力资源消耗，用于比较固定上班、错时上班以及是否安排休息的不同方案。
    why: 巡检总作业量确定后，方案差异主要表现为空闲与加班，因此该指标能够统一量化排班方案的资源浪费程度。
  - name: 周期轮岗轮班均衡模型
    role: 通过班内岗位循环和早、中、晚班周期轮换，使不同人员在一个完整周期内承担相同或接近的工作量与班次负担。
    why: 单日排班可能满足人数最少但无法保证个体公平，周期轮换可以在不增加人员数量的情况下实现长期工作量均衡。
  solution_flow: 整理巡检周期、巡检耗时、点间连通关系及行走时间→构造无向赋权图和权重矩阵→以调度中心为起终点并分阶段指定中间点，利用MATLAB最短路函数生成覆盖巡检点的回路→沿回路累加行走时间、巡检时间以及相应情境下的休息和进餐时间→以各段内最小巡检周期为容量约束建立背包分段模型，最小化分段数并确定每班最低人数→根据分段起点、出发时刻和班次规则生成巡检时间表→计算个人、班次和全天的人力资源消耗→通过轮岗轮班实现长期均衡→进行约束检验、灵敏度分析和稳健性分析。
  validation: 首先逐项检查所有巡检点是否被覆盖、分段时间是否不超过段内最小巡检周期、人员出发时刻和班次安排是否可行；其次核对最短回路的行走时间为72分钟、含巡检耗时的累计时间为139分钟，并验证分段结果对应每班至少4人等结论；最后改变进餐时间进行灵敏度分析，检验排班方案是否保持不变，同时更换最短路求解时指定的中间点进行稳健性分析，观察回路长度和最终配置结果的变化。
  visualization:
  - 建模求解流程图
  - 巡检网络无向赋权图
  - 最短巡检回路图
  - 累计时间轴与分段示意图
  - 巡检排班时间表
  - 轮岗轮班表
  pitfalls_avoided:
  - 避免只按行走时间安排人员而忽略巡检作业耗时：分段前将行走时间与巡检耗时共同计入累计时间，否则会低估任务完成时刻并导致巡检周期约束失效。
  - 避免按平均巡检周期限制区段长度：每段采用该段所有巡检点中的最小巡检周期作为上限，从而防止短周期巡检点因平均化处理而发生超期。
  - 避免仅追求最短路线而忽略最低人员配置：将路线优化与人员分段优化拆成两个阶段，使路线成本和人数目标分别得到处理。
  - 避免仅考察单日或单班的表面均衡：使用多日轮岗及早中晚班轮换，使空闲、加班和夜班负担在完整周期内均衡。
  - 避免把休息和进餐视为不影响时间进程的附加条件：在相关情境下调整累计时间后重新进行分段求解，以防直接沿用无休息方案造成排班不可行。
  innovation_points:
  - 将巡检线路优化与排班人数优化串联，先以图论方法压缩行走时间，再把回路累计时间映射为带巡检周期约束的背包分段问题，并用最少分段数表示最低人数。
  - 建立由个人到班次再到全天的人力资源消耗指标体系，以空闲时间和加班时间统一比较固定上班、错时上班及不同休息安排。
  - 在最低人数不变的基础上引入班内轮岗和班间轮班，通过周期性置换实现长期工作量与班次负担均衡。
- id: 2018_D029
  source_paper: 2018 CUMCM D题 汽车装配顺序优化
  problem_type: 优化+统计分析
  keywords:
  - 整数规划
  - 多目标决策
  - 序贯算法
  context: 在满足品牌顺序、班次产量、动力与驱动间隔、配置连续性以及喷涂颜色兼容规则的条件下，优化一周460辆/日汽车的装配顺序以降低切换成本。
  models:
  - name: 多目标序贯优化模型
    role: 按照品牌、配置、动力、驱动和颜色等属性的优先级，将复杂装配排序问题分解为一系列单目标优化子问题并依次求解。
    why: 各属性约束相互耦合且难以同时达到全局最优，采用按优先级逐层固定前序结果的序贯方法，能够保证关键工艺约束优先满足并降低求解复杂度。
  - name: 品牌与班次分配模型
    role: 将A1、A2品牌车辆分别均分到白班和晚班，并保证每个班次均按照先A1后A2的顺序装配。
    why: 品牌顺序和两班各生产品牌日需求量一半属于刚性约束，先固定品牌区段可以显著缩小后续属性排序的可行域。
  - name: 黑色车辆最小分组整数优化模型
    role: 在每组黑车连续数量为50至70辆、相邻黑车组至少间隔20辆的条件下，最小化黑车组数，并确定各组数量及A1、A2交界处的黑车分配。
    why: 黑车数量最多且黑色与其他颜色之间的切换成本很高，优先减少黑车组数并在品牌交界处合并黑车段可有效减少高成本换色。
  - name: 五步确色启发式排序模型
    role: 依次确定黑车、蓝白间隔、金色与红黄类间隔、银灰类辅助间隔以及棕白车辆的颜色装配顺序。
    why: 九种颜色同时受到喷涂线限制、允许搭配关系和连续喷涂要求的约束，先分类再按稀缺性和工艺优先级排序比直接进行全排列更易获得可行解。
  - name: 动力间隔优化模型
    role: 计算柴油车的分组数以及两批柴油车之间所需汽油车数量，优先将柴油车安排在白班，无法满足时再分配到晚班。
    why: 柴油车连续数量不得超过2辆且批次间优先间隔至少10辆，需要通过分组和均衡分配尽量避免间隔不足5辆或落入5至9辆的高成本区间。
  - name: 驱动间隔优化模型
    role: 计算四驱车分组数、每组四驱车数量及两批四驱车之间的两驱车间隔数量，并在必要时将四驱车分散到两个班次。
    why: 四驱车具有与柴油车相同的连续装配和最小间隔限制，采用分组间隔模型可以直接控制违规风险和高成本短间隔数量。
  - name: 配置连续性规则模型
    role: 在品牌区段内结合动力、驱动和颜色约束，使相同配置车辆尽量连续排列，减少配置切换次数。
    why: 配置切换会增加生产代价，但其优先级低于关键颜色、动力和驱动工艺约束，因此适合作为分层排序中的次级优化目标。
  - name: 层次分析法权重成本评价模型
    role: 确定品牌、配置、动力、驱动和颜色切换的代价权重，并汇总计算装配方案的综合生产成本。
    why: 不同属性切换的成本量纲和严重程度不同，利用层次分析思想设置权重可将多种切换代价统一为可比较的综合成本指标。
  solution_flow: 读取9月17日至23日生产计划数据并用Excel统计各日品牌、颜色、动力、驱动和配置数量→将红黄合并为R类、银灰合并为S类并分析属性交叉分布→固定每班230辆及先A1后A2的品牌框架→建立黑车最小组数模型，求出50至70辆范围内的黑车组数和组容量→用五步确色法确定蓝白、金色-R类、S类及棕白车辆的颜色次序，并满足C1/C2喷涂线限制→分别求解柴油车和四驱车的分组及间隔数量，间隔不足时在两个班次间重新分配→在不破坏高优先级约束的前提下调整相同配置车辆的连续性→利用C语言实现综合排序算法，生成9月20日及一周装配顺序表→按权重汇总各种属性切换次数并计算方案成本。
  validation: 首先进行数量守恒校验，确认每天460辆、每班230辆且各品牌和属性数量与计划一致；其次逐项检查先A1后A2、黑车每组50至70辆、黑车组间至少20辆、柴油车和四驱车连续不超过2辆及间隔要求；再检查蓝白交替、红黄与允许颜色搭配、金色间隔关系以及红黄蓝仅进入C1、金色仅进入C2等喷涂线兼容性；同时检查白班与晚班、当日晚班与次日白班交界处的相邻约束；最后用9月20日样例和连续7天数据运行C程序，通过Excel复核排序结果、切换次数及成本，并以约4550元的9月20日切换代价进行结果评价。
  visualization:
  - 各日期各颜色车辆数量统计表
  - 品牌与配置、动力、驱动、颜色的交叉统计表
  - 白班黑车与其他颜色车辆顺序示意图
  - C1/C2喷涂线分流示意图
  - 五步确色算法流程图
  - 每日汽车装配顺序表
  pitfalls_avoided:
  - 避免直接对460辆汽车进行全属性全排列，因为搜索空间极大且五类属性约束高度耦合；先按品牌、班次和目标优先级分解可显著降低计算复杂度。
  - 避免只按颜色数量贪心排列而忽略喷涂线限制，因为红、黄、蓝只能进入C1且金色只能进入C2；排序时结合车辆位置奇偶和喷涂线去向判断可防止生成不可执行方案。
  - 避免将黑车平均分组导致出现不足50辆或超过70辆的黑车段；通过最小组数模型及组间调配，将剩余黑车补足到合法区间。
  - 避免在A1与A2品牌交界处机械切断黑车段，因为黑色与其他颜色切换成本很高；将A1末尾黑车与A2开头黑车合并为同一组可减少一次高成本换色。
  - 避免只检查单个班次内部约束，因为生产线连续24小时运行；需要同时核验白晚班以及相邻日期交界处的黑车、柴油车、四驱车和颜色间隔关系。
  - 避免强行将全部柴油车或四驱车放入白班而造成严重间隔违规；当可用汽油车或两驱车不足时，将特殊车辆分配到晚班，并优先保证间隔不少于5辆。
  - 避免为了配置连续性破坏颜色、动力或驱动的关键工艺约束；通过明确优先级，使配置切换最小化仅在高优先级约束形成的可行域内进行。
  innovation_points:
  - 提出五步确色法，将九种颜色按黑色、蓝白组合、金色与R类、S类、棕白组合分层处理，把复杂颜色兼容图转化为可执行的顺序生成规则。
  - 在黑车分组中利用A1末段与A2首段的品牌边界进行跨品牌连续拼接，在保持先A1后A2规则的同时减少黑色与其他颜色之间的高成本切换。
  - 将序贯多目标思想与规则启发式结合：先保证品牌和关键工艺硬约束，再优化动力、驱动、颜色及配置切换，使模型兼具可解释性和工程可实施性。
  - 对柴油车和四驱车设置分层退化策略：优先满足至少10辆间隔，无法满足时接受5至9辆的高成本方案，并通过跨班次分配尽量降低违规程度。
- id: 2023_E176
  source_paper: 2023 CUMCM E题 小浪底水库监测方案
  problem_type: 统计分析+预测+优化
  keywords:
  - 水沙通量
  - 小波变换
  - 0-1背包规划
  context: 基于小浪底水文站2016—2021年水位、流量、含沙量及河床断面数据，分析水沙通量变化规律，预测未来趋势并优化采样监测方案及评估调水调沙效果。
  models:
  - name: 季节指数模型
    role: 计算含沙量及水沙通量的月份指数和季度指数，识别旺季、淡季与季节分布特征。
    why: 水文序列具有明显的年内季节波动，季节指数能够消除量纲影响并直观比较不同月份和季度的相对水平。
  - name: 分段正弦函数拟合模型
    role: 刻画含沙量和水沙通量随时间的周期性变化，并分别拟合突变前后的不同阶段。
    why: 序列具有近似年度周期且2018年前后水平和振幅明显改变，分段周期函数比单一全局函数更能反映结构变化。
  - name: 双对数一元回归模型
    role: 分别建立含沙量与水位、含沙量与水流量之间的定量关系，并将回归系数解释为弹性。
    why: 双对数形式适合描述变量间的幂函数关系，系数可直接解释为自变量变化1%引起的含沙量百分比变化。
  - name: Mann-Kendall趋势与突变检验
    role: 利用UF、UB统计序列识别水沙通量的上升或下降趋势、显著性区间及可能突变时刻。
    why: 该非参数方法不要求序列服从特定分布，对异常值较稳健，适合具有偏态和极端值的水文时间序列。
  - name: Fisher最优分割模型
    role: 将有序水沙通量序列划分为类内差异较小、类间差异较大的阶段，以定位结构突变点。
    why: 时间序列天然有序，最优分割能够从分段角度识别显著转折，并可与M-K检验结果交叉验证。
  - name: 小波变换模型
    role: 在不同时间尺度上分析水沙通量的局部周期、丰枯交替和多个突变点。
    why: 传统时域或单一频域分析难以同时定位周期和发生时刻，小波变换具有时频局域化和多分辨率分析能力。
  - name: R/S分析模型
    role: 计算Hurst指数，判断水沙通量未来具有趋势延续、趋势反转还是随机变化特征。
    why: R/S分析可度量时间序列的长期记忆性和分形特征，适合用于未来趋势方向的先验判断。
  - name: 傅里叶级数预测模型
    role: 逼近水沙通量的周期曲线并预测未来两年的月度水通量和沙通量。
    why: 水沙通量表现出明显周期振荡，在满足Dirichlet条件时可由傅里叶级数有效逼近，且能够保留多频率周期成分。
  - name: 0-1背包规划模型
    role: 在监测收益和成本资源约束下决定未来各时段是否采样，形成未来两年的最优监测方案。
    why: 每个候选监测时段只有选择或不选择两种状态，且需在有限成本下最大化动态信息获取价值，与0-1背包问题结构一致。
  - name: 微元法
    role: 依据河床断面起点距与高程数据近似积分，计算断面的平均河底高程并评价调水调沙效果。
    why: 河底断面是不规则曲线，直接取简单平均会忽略不同区间宽度，微元积分能够按断面宽度加权计算平均高程。
  - name: 灰色GM(1,1)预测模型
    role: 预测未来十年的河底高程，分析不实施调水调沙可能造成的河床演变结果。
    why: 河底高程年度样本较少，GM(1,1)对小样本、贫信息且总体趋势较明显的序列具有较低的数据需求。
  solution_flow: 数据→检查日期连续性、补齐时间点、填补缺失值、剔除明显离群点并统一时间尺度和计量单位→利用描述统计与季节指数识别分布和季节性→采用分段正弦拟合、双对数回归、M-K检验、Fisher最优分割和小波变换分析关系、周期与突变→通过最小二乘法估计回归及周期函数参数，利用R/S分析判断未来趋势方向→建立傅里叶级数预测未来两年水沙通量→将候选采样时段的监测价值与成本输入0-1背包模型求解最优采样组合→利用微元法计算平均河底高程并比较调水调沙前后指标→采用GM(1,1)预测未来十年河底高程→通过统计检验、残差诊断、阶段回测和多模型交叉验证评价结果。
  validation: 回归模型通过回归系数95%置信区间、F检验、决定系数R²、残差正态性、同方差性和独立性进行诊断；将M-K检验识别的突变时段与Fisher最优分割的变点相互验证，并用小波等值线和小波方差进一步核验多尺度周期与突变；R/S分析将2016—2017年作为检验阶段、2018—2021年作为预测对照阶段进行历史回测；周期拟合与傅里叶预测通过真实序列和拟合曲线对比评价，同时结合敏感性与稳健性分析检查参数扰动对监测方案和预测结论的影响。
  visualization:
  - 水位、流量和含沙量时序折线图
  - 变量两两散点图
  - 月份指数与季度指数柱状图
  - 年度总水流量和总排沙量柱状图
  - 周期函数及傅里叶拟合对比图
  - 标准化残差直方图
  - 标准化残差与预测值散点图
  - M-K检验UF-UB曲线图
  - Fisher最优分割结果图
  - 小波系数等值线图
  - 小波方差图
  - 河床断面高程曲线图
  pitfalls_avoided:
  - 避免直接使用缺失或日期不连续的数据建模，因为时间断点会破坏季节指数、傅里叶分析和小波变换的时间尺度一致性，故先补齐日期并填补缺失值。
  - 避免将明显离群点直接带入最小二乘拟合，因为极端含沙量会显著拉动回归系数和周期函数振幅，故先通过时序图识别并剔除异常点。
  - 避免同时以水位和水流量建立普通二元回归，因为二者高度线性相关会造成严重多重共线性、参数不稳定和解释失真，故分别建立一元双对数回归模型。
  - 避免把双对数回归系数误解释为绝对增量，因为其系数表示弹性，即自变量增加1%对应因变量约变化β%。
  - 避免混淆瞬时流量、年度水量、含沙量与排沙量的单位，因为m³/s、亿m³、kg/m³和亿吨之间需要结合每日秒数及质量单位进行严格换算。
  - 避免仅使用单一方法判定突变点，因为M-K交点可能具有不确定性，故使用Fisher最优分割和小波变换进行交叉验证。
  - 避免用单一全局周期模型覆盖2018年前后的结构变化，因为突变会使整体参数平均化并降低拟合精度，故采用分段拟合并单独处理突变后的阶段。
  - 避免仅依据傅里叶周期外推判断长期方向，因为周期模型难以准确预测未来突变，故先用R/S分析判断趋势持续性，再结合傅里叶级数预测具体数值。
  - 避免用断面高程的简单算术平均代表河底高程，因为采样点间距不同会产生空间权重偏差，故采用微元法按断面宽度积分。
  - 避免只追求监测频率而忽略成本约束，因为全时段高频采样会造成资源浪费，故将监测价值最大化与成本上限统一到0-1背包规划中。
  innovation_points:
  - 将季节指数、M-K检验、Fisher最优分割和小波变换组合使用，从季节、趋势、单变点和多尺度局部变化多个角度交叉识别水沙通量规律。
  - 将未来采样时段抽象为具有监测价值、监测成本和选取状态的物品，把水文监测方案设计转化为可获得全局最优解的0-1背包问题。
  - 采用R/S分析先判断长期趋势的持续或反转属性，再利用傅里叶级数给出未来两年的周期性数值预测，实现趋势判断与定量预测结合。
  - 针对2018年前后的结构突变采用分段正弦函数拟合，避免单一周期曲线掩盖水沙通量水平和振幅的阶段变化。
  - 利用微元积分代替简单平均计算不规则河床断面的平均高程，使调水调沙效果评价具有明确的空间加权意义。
- id: A题_2009全国大学生数学建模A题0314
  source_paper: 2009 CUMCM A题 眼科病床安排
  problem_type: 综合评价+优化+预测+统计分析+仿真
  keywords:
  - 病床合理安排
  - 加权TOPSIS
  - 分阶段线性规划
  - 模糊层次分析
  - 区间估计
  - 马尔科夫排队系统
  - 非线性规划
  - 动态目标规划
  context: 针对拥有79张病床且不同眼科病种在手术日、术前准备时间、住院时间和紧急程度上存在差异的医院，评价现有FCFS制度并优化病床准入、入院时间预测及床位比例分配。
  models:
  - name: 加权TOPSIS综合评价模型
    role: 构建床位周转次数、床位使用率、患者平均等待住院日和患者平均住院日四维指标体系，评价现有病床安排效率并比较不同病种的服务表现。
    why: 病床安排同时涉及效益型和成本型指标，且各指标量纲与重要性不同；TOPSIS可通过指标同趋势化、归一化和加权距离计算获得与理想方案的相对接近度，适合多指标综合评价。
  - name: 基于平均住院时间的分阶段线性规划模型
    role: 根据次日拟出院人数确定各类患者的次日入院名额，并按照周一至周二、周三至周五、周六至周日三个阶段设置不同准入优先级。
    why: 次日可释放床位数形成明确的容量约束，而各病种平均住院时间和候诊人数可参数化，分阶段线性规划能够在满足床位及候诊队列约束的同时缩短平均住院时间和系统逗留时间。
  - name: 基于可能度的模糊层次分析模型
    role: 利用区间判断矩阵、可能度矩阵和排序向量估计线性规划中各病种的相对优先级权重。
    why: 病种优先级不仅取决于住院时间，还受到急症程度、手术日和术前准备时间等难以精确量化因素影响；区间数和模糊层次分析可以表达专家判断的不确定性，并对优先级进行系统排序。
  - name: 基于病床周转次数的优化模型
    role: 以提高一定周期内病床周转次数为目标，给出区别于平均住院时间目标的病床准入方案。
    why: 床位周转次数是医院资源利用效率的核心指标，从该指标直接建模可检验不同优化目标下方案的可操作性，并避免仅以患者住院时间衡量医院效率。
  - name: 入院时间置信区间估计模型
    role: 依据当前住院患者、候诊患者及历史服务数据，在置信度0.95下预测新确诊患者的大致入院时间区间。
    why: 患者入院时间受随机到达、随机出院和队列位置共同影响，点预测容易造成虚假精确；置信区间能够量化不确定性，更适合门诊阶段的信息告知。
  - name: 马尔科夫排队动态平衡模型
    role: 描述患者到达、等待、入院和出院之间的状态转移，计算患者等待入院概率与病床占用概率，为入院时间估计提供理论依据。
    why: 在患者到达服从Poisson分布、住院时间服从负指数分布的假设下，系统具有马尔科夫性，可通过稳态平衡方程刻画病床占用和候诊队列的随机动态。
  - name: 周末停手术情形下的优先级修正模型
    role: 在周六、周日不安排手术的约束下修正各类患者在不同日期的入院优先级，并重新求解次日入院安排。
    why: 若直接沿用工作日优先级，患者可能在周末占床但无法接受手术，从而增加无效术前等待和平均住院时间；重新分段和调整优先级能够显式反映周末服务中断。
  - name: 固定床位比例非线性规划模型
    role: 以各类患者分配床位数或床位比例为决策变量，使所有患者在系统内的平均逗留时间最短，并给出便于管理的比例分配方案。
    why: 各病种的等待时间会随床位配额非线性变化，固定比例方案还需要满足总床位数、流量和比例边界等约束，因此适合使用非线性规划统一优化等待时间与住院时间。
  - name: 出入院流量平衡动态目标规划模型
    role: 根据各病种入院与出院流量的动态平衡关系，对固定比例方案进行补充和修正，协调多类管理目标。
    why: 静态样本比例可能无法适应到达率和出院率随时间的变化；动态目标规划可设置床位利用、流量平衡、候诊控制和比例稳定等目标及偏差变量，使分配方案更加客观和稳健。
  solution_flow: 整理门诊、入院、手术和出院记录并按病种统计到达比例、候诊人数、平均住院时间和床位状态→构建床位周转次数、使用率、平均等待住院日和平均住院日指标体系，使用加权TOPSIS诊断现行FCFS方案→按手术日和病种特征划分一周时段，利用模糊层次分析估计病种优先权重→以次日出院人数为可用床位约束，求解分阶段线性规划及床位周转优化模型→利用统计区间估计和马尔科夫稳态概率预测入院时间→加入周末停手术约束并重新优化→以79张病床的病种配额为变量求解固定比例非线性规划和动态目标规划→通过案例仿真、指标复算、情景对比和流量平衡检查验证方案。
  validation: 首先用2008年7月13日至9月11日的历史数据计算现行方案的TOPSIS相对接近度，并以0.5026的结果识别效率不足；随后将优化方案代入同一指标体系，比较床位周转次数、床位使用率、平均等待住院日和平均住院日。针对分阶段模型，使用给定次日出院人数进行案例仿真，检查入院人数不超过释放床位、各病种分配不超过候诊人数以及外伤优先约束。针对周末情景，对比允许周末手术与周末停手术时的床位安排和逗留时间。针对随机模型，检验稳态流入流出平衡、概率归一性及95%入院区间的覆盖合理性，并可通过改变到达率、平均住院时间和病种比例开展敏感性分析。
  visualization:
  - 各病种患者比例饼图
  - 每日候诊人数柱状图
  - 住院人数及床位使用率时间序列曲线
  - 分时段患者入院优先级流程图
  - 各病种TOPSIS相对接近度与排序柱状图
  - 优化前后平均等待时间和平均住院时间对比图
  - 病床比例分配堆叠柱状图
  - 入院时间预测置信区间图
  pitfalls_avoided:
  - 避免仅用床位使用率评价方案：病床长期接近100%并不代表服务高效，高占用率可能与超过12天的候诊时间并存，因此同时引入周转次数、等待时间和住院时间。
  - 避免将成本型指标直接与效益型指标混合计算：平均等待日和平均住院日越小越好，论文先进行倒数同趋势化，再归一化，防止评价方向颠倒和量纲主导结果。
  - 避免机械沿用FCFS规则：不同病种的紧急程度、术前准备时间和固定手术日不同，统一先到先服务会使已占床患者等待手术并降低周转效率，因此采用分病种、分时段优先级。
  - 避免忽略外伤急症的刚性需求：外伤患者需要有空床即入院且次日手术，若与普通病种共同竞争床位会产生医疗风险，因此在所有阶段设置绝对优先。
  - 避免只按平均住院时间选择患者：单纯优先短住院患者可能长期挤压其他病种，因此使用模糊层次分析权重和轮流照顾原则兼顾效率、公平及医疗需求。
  - 避免忽略周末无手术造成的无效占床：若周末仍按原优先级收治无法及时手术的患者，会延长术前等待和住院时间，因此单独建立周末停手术情景并修正优先级。
  - 避免给患者承诺确定的入院日期：随机到达和随机出院使点预测误差较大，因此提供95%置信水平下的时间区间，并用排队稳态概率支撑估计。
  - 避免直接把截取数据段的起始住院人数设为零：样本开始前已有住院患者，设为零会低估床位占用；论文结合时间序列趋稳特征，将样本期视为接近满床的稳态区间。
  - 避免按历史患者比例机械分床：患者占比不等于合理床位占比，各病种服务率和住院时间不同，因此以平均系统逗留时间最短为目标求解非线性配额，并用动态流量平衡修正。
  - 避免在床位安排中叠加不存在的手术能力约束：题目说明手术条件充分，模型仅保留医生排班和不同病种手术日冲突，防止无依据约束导致可行域过度收缩。
  innovation_points:
  - 将综合评价、确定性优化、随机排队预测和动态床位配置整合为一套覆盖现状诊断、次日决策、患者告知及长期管理的多层模型体系。
  - 依据白内障固定手术日、双眼分两次手术及其他病种错峰手术等业务规则划分周内阶段，使入院优先级随日期动态变化，而不是采用固定排序。
  - 使用区间判断矩阵和可能度排序确定病种优先权重，把专家经验中的模糊性显式嵌入线性规划。
  - 同时从平均住院时间和床位周转次数两个目标构建安排模型，可比较患者时间效益与医院资源效率之间的差异。
  - 以95%置信区间结合马尔科夫稳态概率预测入院时间，使患者端的信息服务具有统计置信依据。
  - 在便于管理的固定比例方案之外引入出入院流量平衡的动态目标规划，兼顾比例稳定性与需求变化。
- id: B题_论文f
  source_paper: 2008 CUMCM B题 高等教育学费探讨
  problem_type: 综合评价+统计分析+优化
  keywords:
  - 学费合理性指数
  - 价格需求曲线
  - 成本分担
  context: 针对高校学费过高会损害教育公平、过低又难以保障培养质量的矛盾，结合培养成本、财政拨款、家庭收入和毕业收益等数据评价现行学费并制定合理收费与补助标准。
  models:
  - name: 地域—专业逐步线性回归模型
    role: 识别地域和专业类别对高校学费的影响，并估计不同培养模式下的平均学费。
    why: 学费同时受到地域经济水平和专业培养成本等因素影响，逐步线性回归能够筛选显著变量、量化边际影响，并为均值接近度指标提供分类基准。
  - name: 学费合理性多指标综合评价模型
    role: 从培养费用分担度、公平性、同类均值接近度和相对回报投入比四个维度计算学费合理性指数。
    why: 学费合理性涉及财政负担、家庭支付能力、横向收费差异和个人教育回报，单一指标无法全面刻画，因此需对多维指标标准化、赋权并综合评价。
  - name: 基于价格需求曲线的补助制度模型
    role: 分析单一学费定价对不同收入家庭造成的不公平，并推导低收入群体补助额度与学费变动之间的关系。
    why: 不同收入群体对学费的支付能力和需求弹性存在差异，价格需求曲线可以反映学费变化对入学需求的影响，从而支持差异化定价与精准补助。
  - name: 高等教育成本分担比例优化模型
    role: 估算生均培养成本，确定国家与个人的合理成本分担比例及相应学费标准，并分别讨论一般家庭和困难家庭的受教育条件。
    why: 高等教育属于政府和个人共同受益的准公共产品，依据谁受益谁付费原则，并以国家纯公共收益最大化为目标，可以从经济学机制上推导财政投入和个人缴费比例。
  solution_flow: 收集城乡家庭分档收入、生源比例、各校各专业学费、毕业后收入、国家财政拨款和在校生规模等数据→按地域发展水平与专业类型进行分类，并用逐步线性回归分析学费影响因素→构造培养费用分担度、公平性、均值接近度和相对回报投入比指标，采用分段线性收入分布估算学费可负担比例→通过极差法和最大值归一化处理指标，使用三级比例相对比较法确定权重并计算学费合理性指数→建立价格需求曲线模型研究差异化收费及补助额度→估算生均培养成本，以国家纯公共收益最大化推导国家投入、个人分担比例和合理学费→利用显著性检验、样本计算、阈值比较、现实数据检验及参数灵敏度分析验证模型。
  validation: 首先对地域—专业回归进行统计检验，模型p值为6.38×10^-6且R²为0.71，说明解释变量整体显著并具有较好的拟合能力；其次将综合评价模型应用于不同高校和专业样本，比较四项指标及合理性指数，并依据培养成本个人分担不超过25%、公平性指标不低于0.6等现实标准进行合理性检验；同时通过遍历学费区间检验分担度随学费先增后降的规律及最优区间，并比较仅考虑城镇家庭与综合考虑城乡家庭时的结果；补助模型使用实际收入和收费数据验证可行性，成本分担模型则通过关键参数灵敏度分析检验结论的稳健性。
  visualization:
  - 城乡家庭收入分布柱状图
  - 地域—专业分类学费表或分组柱状图
  - 学费与培养费用分担度关系曲线图
  - 多指标评价雷达图
  - 价格—需求曲线图
  - 参数灵敏度曲线图
  pitfalls_avoided:
  - 避免仅用平均家庭收入判断学费可负担性：城乡收入差异和收入分布不均会掩盖低收入家庭的支付困难，因此按城乡、收入档次及生源比例构造分段线性可负担函数。
  - 避免只从学校培养成本评价学费：仅考虑成本会忽略教育公平和个人教育回报，因此同时引入分担度、公平性、同类均值接近度与回报投入比四类指标。
  - 避免直接将量纲和方向不同的指标相加：各指标取值范围及正负效用不同，未经处理会造成大尺度指标支配结果，因此采用极差法或最大值法归一化。
  - 避免假定提高学费必然增加学校学费收入：学费上涨会减少可负担和有需求的人数，模型通过遍历价格区间识别分担度先升后降及平台区间。
  - 避免对所有家庭实行无差别的一刀切收费：不同收入群体的支付能力和价格需求关系不同，统一定价可能排斥低收入学生，因此引入差异化定价和补助机制。
  - 避免只报告单一最优收费结果而忽略参数不确定性：生均成本、公共收益和支付能力等参数存在估计误差，因此对成本分担模型开展灵敏度分析。
  innovation_points:
  - 将家庭收入分布、城乡生源比例与学费支付阈值结合，构造能够同时反映实际缴费人数和培养成本贡献的分担度指标。
  - 把绝对合理性指标与相对合理性指标统一到一个评价体系中：前者衡量费用分担和教育公平，后者衡量同类收费偏差及教育回报。
  - 利用价格需求曲线把教育公平问题转化为不同收入群体的需求与定价问题，推导补助额度随学费变化的联动关系。
  - 基于准公共产品和成本分担理论，以国家纯公共收益最大化推导政府与个人的合理分担比例，使收费标准兼具评价依据和优化机制。
- id: 2010_2010年数学建模A题全国一等奖论文
  source_paper: 2010 CUMCM A题 储油罐变位识别
  problem_type: 统计分析+仿真
  keywords:
  - 分段积分建模
  - 最小二乘参数估计
  - 蒙特卡洛模拟
  context: 针对地下储油罐因地基变形产生纵向倾斜和横向偏转而导致原罐容表失效的问题，建立油位高度、储油量与变位参数之间的关系并重新标定罐容表。
  models:
  - name: 无变位储油罐几何积分模型
    role: 通过对椭圆柱或圆柱与球冠组合罐体的液体截面进行积分，建立无变位状态下油位高度与储油体积的基准关系。
    why: 罐体几何形状明确，储油体积可由液体截面积沿高度或罐长方向积分得到，能够提供具有物理意义的理论罐容曲线。
  - name: 纵向倾斜五区域分段积分模型
    role: 依据液面与罐体端部、油位探针及罐顶罐底的相对位置，将储油状态划分为五个区域，分段计算倾斜后的储油体积。
    why: 纵向倾斜后不同油位区间的液体边界和积分区域发生改变，且低油位和高油位存在探针测量盲区，单一体积公式无法覆盖全部工况。
  - name: 横向偏转油位转换模型
    role: 利用几何投影关系将油位探针的测量高度转换为实际竖直油位高度，再代入体积模型计算储油量。
    why: 横向偏转主要改变探针方向而非液面方向，需要修正测量高度与真实液位之间的系统性偏差。
  - name: 纵横向变位综合罐容模型
    role: 将纵向倾斜造成的分段体积变化与横向偏转造成的油位修正结合，建立储油量关于油位高度、纵向倾角和横向偏角的一般关系。
    why: 实际储油罐可能同时发生两个方向的变位，综合模型才能用于实际检测数据反演和变位后罐容表标定。
  - name: 非线性最小二乘参数估计模型
    role: 以实际进出油量与理论体积变化量之间的残差平方和最小为目标，估计纵向倾角和横向偏角，得到约为2.16度和4.50度的变位参数。
    why: 变位角不可直接从油位数据读取，而多组检测数据提供了超定约束，最小二乘法能够综合利用全部观测并抑制随机测量误差。
  - name: 平均影响率评价指标
    role: 计算多个油位点上变位前后储油量绝对差的平均值占罐体总容积的比例，定量评价变位对罐容表的总体影响。
    why: 低油位时储油量很小，普通相对误差会被异常放大；以总罐容归一化可以更稳定地反映整体影响，论文得到纵向倾斜4.1度时平均影响率约为4.87%。
  - name: 蒙特卡洛体积仿真模型
    role: 随机采样估算解析模型中被忽略的复杂球冠局部体积，并与近似积分模型的总储油量进行比较。
    why: 倾斜状态下球冠边界复杂、精确解析积分困难，蒙特卡洛方法可绕开复杂积分，对近似处理引入的误差进行独立检验。
  solution_flow: 读取罐体尺寸、探针位置及进出油检测数据→建立无变位几何积分基准模型→按液面位置划分五个区域并构建纵向倾斜分段体积模型→利用投影关系修正横向偏转下的测量油位→组合得到储油量关于油位高度及两个变位角的模型→以检测体积变化残差平方和最小估计纵向倾角和横向偏角→按规定油位间隔计算并输出新罐容表→通过实测对比、误差分析和蒙特卡洛仿真验证模型。
  validation: 首先将无变位和变位状态下的理论储油量与实验测量值绘制曲线比较，并分析理论值与测量值之差及相对误差；其次检查拟合参数下理论体积变化与实际进出油数据的一致性；最后采用蒙特卡洛随机采样计算被省略的球冠局部体积，与分段近似模型结果交叉验证，总储油量一致度约为99%，说明近似误差较小。
  visualization:
  - 理论值与测量值的油位高度—储油量对比曲线
  - 变位前后油位高度—储油量对比曲线
  - 绝对误差随油位高度变化曲线
  - 相对误差随油位高度变化曲线
  - 罐体五区域几何分区示意图
  - 不同油位间隔的罐容标定表
  pitfalls_avoided:
  - 避免用单一公式描述全部倾斜工况：倾斜后液面与罐端的交线会随油位改变，且探针在极低和极高油位存在无示数或饱和区，因此采用五区域分段积分以保证积分边界正确。
  - 避免将探针读数直接视为真实竖直液位：横向偏转会使探针随罐体倾斜，若不进行余弦投影修正，会把测量方向偏差错误归因于储油体积变化。
  - 避免因球冠局部解析式过度复杂而强行精确求解：在小倾角条件下省略体积较小的局部区域，并用蒙特卡洛模拟量化误差，兼顾模型可计算性与可靠性。
  - 避免仅使用低油位相对误差评价变位影响：低油位储油量接近零会使相对误差虚高，因此以总罐容为归一化基准定义平均影响率。
  - 避免仅凭单个观测点确定两个变位角：单点信息不足且易受测量噪声影响，因此利用多组进出油数据进行最小二乘整体拟合。
  - 避免忽略理论容积与实测容积之间的系统偏差：通过理论值—测量值曲线及比例关系检查罐体实际尺寸、标定误差和测量误差对结果的影响。
  innovation_points:
  - 将倾斜储油罐按液面与探针、罐底和罐顶的相对位置划分为五个区域，建立兼顾测量盲区的分段几何积分模型。
  - 定义以总罐容归一化的平均影响率，避免低油位小基数导致相对误差失真，从整体上量化变位对罐容表的影响。
  - 将复杂球冠局部体积近似与蒙特卡洛独立验证结合，在保持模型可求解性的同时给出近似精度依据。
  - 通过非线性最小二乘将油位—体积关系模型用于反演纵向倾角和横向偏角，实现变位识别与罐容表标定的一体化。
- id: A0285_A285
  source_paper: A0285 A0285_A285
  problem_type: 统计分析+综合评价+分类聚类+预测
  keywords:
  - Wilcoxon符号秩检验
  - 肯德尔和谐系数
  - 主成分分析
  - 层次分析综合评价
  - 典型相关分析
  - 多元线性回归
  context: 基于两组品酒员的感官评分以及酿酒葡萄和葡萄酒的理化指标，分析评分差异与可信度、完成葡萄分级、揭示两组理化指标间的联系，并判断能否用理化指标评价葡萄酒质量。
  models:
  - name: 单样本K-S正态性检验与P-P图
    role: 识别各组葡萄酒评分数据的概率分布，为后续显著性检验方法的选择提供依据。
    why: 评分数据是否满足正态性会影响参数检验的适用性，K-S检验结合P-P图可以同时提供定量和直观的分布判断。
  - name: Wilcoxon符号秩检验
    role: 检验两组品酒员对同一批红、白葡萄酒的评价结果是否存在显著性差异。
    why: 两组评分对应同一批酒样，属于配对数据；同时感官评分可能受到评价尺度和位置差异影响，采用不要求配对差值严格服从正态分布的非参数方法更稳健。
  - name: 肯德尔和谐系数
    role: 度量同一品酒组内多名品酒员对各酒样排序的一致性，并据此比较两组评价结果的可信度。
    why: 可信度不能仅由平均分高低判断，秩方法能够弱化评分尺度差异，直接刻画多评价者之间的排序一致程度。
  - name: 主成分分析
    role: 从酿酒葡萄的多项理化指标中提取少数互不相关的综合成分，构建分级评价指标体系。
    why: 原始理化指标数量多且相关性强，直接使用会产生信息重复和共线性；主成分分析可以在保留大部分信息的同时降低维度。
  - name: 层次分析综合评价模型
    role: 融合酿酒葡萄理化主成分、葡萄酒外观、香气、口感和整体评分，计算葡萄质量综合评价值并划分等级。
    why: 葡萄质量由多个层级、不同类型指标共同决定，层次化综合评价便于组织指标体系、确定相对重要性并形成统一评价得分。
  - name: 典型相关分析
    role: 识别并量化酿酒葡萄理化指标组与葡萄酒理化指标组之间的整体联系。
    why: 两侧均为多变量，逐对相关分析会割裂变量组内部关系并产生大量零散相关系数；典型相关分析通过两组变量的线性组合提取最主要的组间关联。
  - name: 多元线性回归
    role: 建立葡萄及葡萄酒理化指标到葡萄酒质量评分的映射，实现质量评价与预测。
    why: 目标变量是连续质量评分，多元线性回归能够量化各筛选指标的边际影响，并给出可解释、可检验的质量评价方程。
  solution_flow: 数据→检查缺失值和异常值，采用同项目其余品酒员均值进行修补，并对不同量纲的理化指标标准化→通过K-S检验和P-P图判断评分分布，使用配对Wilcoxon检验比较两组评分差异→将评分转换为秩，计算肯德尔和谐系数并选择组内一致性更高的评分组→对葡萄理化指标进行主成分分析，依据特征值与累计贡献率提取综合成分→结合葡萄酒感官质量指标建立层次化综合评价体系，计算综合评价值并进行等级划分→利用典型相关分析提取葡萄与葡萄酒两组理化指标的主要联系，并据此筛选冗余变量→随机划分建模样本和检验样本，估计多元线性回归系数→利用留出样本比较模型评价值与实际评分，检验理化指标评价葡萄酒质量的可行性。
  validation: 评分分布采用P-P图与单样本K-S检验交叉验证；两组评分差异通过Wilcoxon统计量、显著性水平0.05及P值判断；品酒组可信度通过肯德尔和谐系数及其卡方显著性检验评价；主成分提取以特征值、旋转载荷和累计方差贡献率检验信息保留程度；回归模型采用随机留出的检验样本进行外部验证，并对模型预测评价值与真实品酒评分实施显著性差异检验，以判断模型的评价结果是否与人工评分一致。
  visualization:
  - 正态P-P图
  - 主成分碎石图
  - 累计方差贡献率图
  - 主成分载荷矩阵热力图
  - 典型变量相关散点图
  - 回归预测值与实际评分对比散点图
  - 葡萄综合得分与等级分布柱状图
  pitfalls_avoided:
  - 避免直接把两组评分当作独立样本进行检验，因为两组品酒员评价的是同一批酒样，忽略配对关系会错误估计差异的随机波动。
  - 避免仅凭均值大小判断哪组品酒员更可信，因为均值反映评分位置而非组内一致性；改用肯德尔和谐系数评价多名品酒员排序的一致程度。
  - 避免在感官评分可能不满足严格参数假设时机械使用配对t检验，因为评分尺度差异和异常值会削弱参数检验的稳健性；使用Wilcoxon符号秩检验降低分布假设要求。
  - 避免将异常录入值直接纳入计算，例如明显超出评分范围的数值会显著扭曲均值、相关系数和回归系数，因此采用先识别剔除、再合理替换的处理策略。
  - 避免对不同量纲的理化指标直接进行主成分分析或综合评价，因为数值尺度较大的指标会获得不合理的主导作用，因此先进行标准化。
  - 避免把27项高度相关的葡萄理化指标全部直接用于评价和回归，因为这会造成信息重复、多重共线性和模型不稳定；先用主成分分析及组间联系进行降维筛选。
  - 避免仅进行大量两两相关分析来解释葡萄与葡萄酒的联系，因为这会忽略两组变量内部结构并增加偶然显著的风险；改用典型相关分析从整体上提取组间关联。
  - 避免用全部样本拟合后再用同一批样本证明回归模型可行，因为这会高估泛化能力；将样本随机划分为建模组和检验组进行留出验证。
  innovation_points:
  - 构建了“差异检验—一致性评价”的双层评分分析框架：先判断两组评分是否显著不同，再用秩一致性而非均值高低选择更可信的评价组。
  - 将葡萄理化主成分与葡萄酒外观、香气、口感和整体感官质量纳入统一的层次化综合评价体系，实现葡萄质量的多源信息融合与等级划分。
  - 采用典型相关分析从变量组整体角度解释酿酒葡萄成分向葡萄酒成分的关联，克服逐指标相关分析信息零散的问题。
  - 把典型相关关系用于回归前的指标筛选，在保留葡萄酒指标的基础上削减可被对应葡萄酒指标表征的葡萄指标，从而降低冗余和共线性。
  - 形成“人工感官评价筛选—理化指标降维—组间关系识别—质量回归预测—留出样本验证”的完整建模链条，使统计解释、综合分级和质量预测相互衔接。
- id: 2023_C228
  source_paper: 2023 2023_C228
  problem_type: 统计分析+分类聚类+预测+综合评价+优化
  keywords:
  - 价格弹性
  - 时间序列分析
  - LSTM
  - VIKOR
  - GBest-PSO
  - NSGA-II
  - 补货决策
  - 自动定价
  context: 针对生鲜蔬菜保质期短、每日进价与可售品种不确定且销售空间受限的场景，利用历史销售、批发价和损耗率数据制定利润与需求兼顾的补货定价策略。
  models:
  - name: 规则分类模型
    role: 依据年度及季度可供天数，将蔬菜单品划分为常年性、季节性和时令性，并识别供应规律不稳定的无关单品。
    why: 蔬菜供应具有明显季节差异，规则分类可将供应频率和季节覆盖情况转化为可解释的类别，为分层分析与预测提供基础。
  - name: ACF自相关分析
    role: 识别总销量及各层级销量在年、周、日等时间尺度上的周期性和滞后相关性。
    why: 销量属于时间序列，ACF能够通过显著滞后峰值判断周期长度，适合检验年周期、周周期和日内重复规律。
  - name: 乘法时间序列分解
    role: 将销量序列分解为趋势、季节或周期成分及随机扰动，提取周期内部的销售变化规律。
    why: 蔬菜销量波动幅度可能随总体水平变化，乘法分解能够同时刻画长期趋势和相对季节波动，并与ACF结果相互印证。
  - name: 偏相关分析
    role: 控制市场总销量等共同外部因素后，识别蔬菜品类之间潜在的替代或互补关系。
    why: 直接相关系数容易把节假日、疫情、季节和整体市场变化造成的同步波动误判为品类间关系，偏相关可降低共同变量的干扰。
  - name: FP-Growth关联规则模型
    role: 从交易或同日可售记录中挖掘单品之间的频繁共现关系和强关联规则。
    why: 销售明细规模较大且单品种类多，FP-Growth无需反复生成候选项集，较Apriori更适合大规模购物篮关联分析。
  - name: Fisher精确检验
    role: 检验打折销售与退货行为之间是否存在显著关联。
    why: 退货记录占比极低，列联表可能存在较小期望频数，Fisher精确检验比依赖大样本近似的卡方检验更稳健。
  - name: 双对数需求模型
    role: 估计各蔬菜品类销量与成本加成定价之间的需求价格弹性。
    why: 双对数模型的价格系数可直接解释为弹性，能够描述价格变化百分比对需求量变化百分比的影响，便于嵌入定价优化模型。
  - name: LSTM预测模型
    role: 预测未来七天各蔬菜品类的销量和批发成本，为补货与定价优化提供基准输入。
    why: 销量和成本存在趋势、周期及非线性时序依赖，LSTM可通过门控机制学习长期与短期依赖关系。
  - name: 价格弹性修正函数
    role: 根据候选售价相对基准价格的变化，修正LSTM给出的基准销量预测，使需求随定价动态变化。
    why: 若直接把销量预测视为固定需求，优化过程无法反映涨价抑制需求、降价刺激需求的经济规律，弹性修正可实现预测模型与决策模型联动。
  - name: 改进GBest-PSO
    role: 求解品类层面的连续补货量与加成率联合优化问题，以最大化未来一周利润。
    why: 利润函数同时包含价格弹性、损耗、成本和需求预测，具有非线性且难以解析求解；粒子群算法适合连续变量全局搜索，引入先验知识可缩小搜索空间并提高收敛效率。
  - name: VIKOR综合评价模型
    role: 综合单品销量和销售次数计算市场需求度，对可售单品进行排序并筛选约40个预选目标。
    why: 顾客需求不能仅由销量表示，销量高可能源于少数大额订单；VIKOR可综合多个存在冲突的需求指标，并兼顾群体效用和个体遗憾。
  - name: 改进NSGA-II
    role: 在单品数量、最低订购量、损耗和可售性等约束下，同时最大化收益与市场需求满足程度，生成Pareto最优补货定价方案。
    why: 单品选择属于离散决策，而补货量和价格属于连续决策，且利润与需求满足程度相互冲突；NSGA-II适合求解混合变量、多约束、多目标非线性规划问题。
  - name: BG-RI混合编码与多重CV约束处理
    role: 分别表示单品是否入选、补货量和定价变量，并在进化搜索中衡量和处理约束违反程度。
    why: 单一编码难以同时表示离散选品和连续补货定价决策，混合编码可保持变量语义；约束违反度机制可减少大量不可行解对NSGA-II搜索效率的影响。
  solution_flow: 数据阶段：对商品、销售、批发价和损耗率附件进行自然连接，对日期时间进行序列化、分类变量进行One-hot编码，并按单品或品类及日、周、月、年聚合；采用3σ规则、加成率上限、低销量低供应规则清洗异常和无关数据。分析阶段：通过供应天数规则完成常年性、季节性、时令性分类，使用ACF与乘法分解识别年、周、日周期，利用销量占比、累计贡献率和单笔销量分析长尾及销售模式，再以偏相关和FP-Growth识别品类及单品关系。预测与参数阶段：建立双对数需求模型估计价格弹性，使用LSTM预测未来七天销量和成本，并用价格弹性修正函数把定价变化映射为需求变化。品类优化阶段：构建包含售价、批发成本、销量、补货量和损耗的利润目标，采用引入先验知识的GBest-PSO求解连续补货与定价方案。单品优化阶段：先过滤滞销单品，再用VIKOR评价需求度并形成候选集，随后采用BG-RI混合编码、约束违反度处理和改进NSGA-II求解利润与市场需求双目标模型，最后从Pareto前沿中选择折中决策方案。
  validation: 采用多层次验证：通过ACF显著性置信区间确认周期峰值，并用时间序列分解得到的季节波动进行交叉印证；将供应分类结果与蔬菜实际生长季节及生活常识对照；偏相关分析通过原假设检验判断关系显著性，打折与退货关系使用Fisher精确检验并以p值小于0.05为显著标准；LSTM使用R方评价预测拟合效果，各品类平均R方达到0.8以上；需求模型检查价格与销量是否呈符合经济理论的负相关及弹性方向；优化结果与历史或平均经营情形进行利润、需求效益对比，验证GBest-PSO方案的收益提升和NSGA-II方案的双效益提升，同时检查最终解是否满足单品数27至33、单品订购量不低于2.5千克等约束。
  visualization:
  - 时间序列折线图
  - ACF自相关函数图
  - 时间序列分解图
  - 销量直方图
  - 累计销量贡献率曲线
  - 品类及单品销量占比图
  - 单笔销量与销售次数蜂窝图
  - 加成率分布图
  - 打折与退货列联关系图
  - Pareto前沿图
  pitfalls_avoided:
  - 避免直接拼接或分别分析多个附件：商品编号、分类、损耗、销售和批发价分散在不同表中，使用自然连接可防止字段错配和信息遗漏。
  - 避免对不同时间粒度的数据直接比较：销售明细过于琐碎，按单品和品类进行日、周、月、年聚合，并以销量加权计算均价和平均加成率，可避免简单平均导致低销量高价商品被过度赋权。
  - 避免把同名不同产地商品直接合并：同货异源单品的进价、售价和销量结构可能明显不同，合并会掩盖供应源差异并扭曲需求与利润估计。
  - 避免异常加成率污染弹性估计和预测：部分记录加成率高达异常水平，采用3σ规则并剔除加成率大于2的记录，可减少录入错误或极端交易对模型参数的影响。
  - 避免用偶发、低销量单品训练稳定时序模型：销售天数少、销量极低且无年度周期的单品缺乏可学习规律，保留它们会增加噪声并削弱预测效果。
  - 避免将销量同步变化直接解释为替代或互补：多个品类会同时受到季节、节假日、疫情和市场总需求影响，因此控制市场总销量后再进行偏相关分析。
  - 避免只用销售量衡量顾客需求：少量大额订单也可能造成高销量，结合销量与销售次数构建VIKOR需求度，可更全面反映购买广度与需求强度。
  - 避免预测与定价优化相互割裂：固定销量预测不随价格变化会产生不符合需求规律的高价方案，因此用价格弹性函数动态修正预测需求。
  - 避免把单品决策错误地建成单目标连续优化：选品是离散变量，补货和定价是连续变量，同时利润与需求满足程度存在冲突，因此采用混合编码的多目标NSGA-II而非单一连续优化模型。
  - 避免优化算法生成大量不可行解：单品数量、最低订购量和可售范围等约束较多，通过多重约束违反度处理和先验知识初始化提升可行解比例与搜索效率。
  innovation_points:
  - 构建“LSTM基准预测—价格弹性动态修正—智能优化决策”的预测与优化耦合框架，使销量预测能够随候选定价实时变化。
  - 从总体、品类、单品三个层级以及年、周、日多个时间粒度分析销售规律，并结合ACF与时间序列分解进行周期识别和交叉验证。
  - 利用供应天数和季度覆盖规则识别常年性、季节性及时令性蔬菜，将供应属性纳入后续分析和数据筛选。
  - 使用偏相关控制市场总体波动，并结合FP-Growth分别刻画品类层面的替代互补关系和单品层面的共现关联。
  - 以VIKOR融合销量和销售次数构造需求度，避免将历史销量简单等同于市场需求。
  - 针对单品选品、补货和定价的混合变量结构，在NSGA-II中引入BG-RI混合编码、先验知识和多重约束违反度机制，实现收益与需求满足程度的双目标优化。
- id: 2018_B203
  source_paper: 2018 2018_B203
  problem_type: 优化+仿真+综合评价
  keywords:
  - 0-1规划
  - RGV动态调度
  - 启发式算法
  - 概率故障
  - 双工序加工
  context: 在1辆RGV服务8台CNC的智能加工系统中，针对单工序、双工序及CNC随机故障情形，优化一个8小时班次内的物料调度路径、刀具配置和系统产量。
  models:
  - name: 无故障单工序0-1单目标规划模型
    role: 以每轮RGV是否访问某台CNC为二元决策变量，在移动、上下料、清洗、加工和班次时长约束下最大化成品数量。
    why: RGV每轮只能选择一台CNC作业，访问决策具有天然的0-1属性，且单工序条件下各CNC功能相同，适合直接以产量最大化为单一目标。
  - name: 无故障双工序0-1双目标规划模型
    role: 联合确定RGV调度路径与CNC刀具分布，优先最大化完成两道工序的成品数，并在最高产量下最小化RGV总工作时间。
    why: 双工序生产同时涉及工序先后关系、物料状态与机床刀具匹配，并存在产量和作业时间两个层次的优化需求，因此需要加入工序匹配约束并采用双目标规划。
  - name: 概率故障动态调度模型
    role: 在单工序和双工序规划模型中加入1%的加工故障概率、随机故障时刻、物料报废和均匀分布维修时间，并实时更新CNC状态及RGV调度。
    why: CNC故障会改变设备可用时间和在制品状态；将维修过程等效为一次较长的不可用作业，可以复用原有调度框架并刻画随机停机影响。
  - name: 最短预计完成时间启发式调度模型
    role: 每轮比较各候选CNC的剩余加工时间与RGV移动时间，以“二者最大值加上下料时间”作为预计完成时间，选择最早可完成服务的CNC。
    why: 完整动态0-1规划随调度轮数增长而迅速扩大，难以直接获得全局最优解；局部最短预计完成时间能够减少RGV等待和CNC空闲，并快速产生近似最优可行解。
  - name: 刀具分布方案循环遍历模型
    role: 遍历同时含有工序一和工序二刀具的254种CNC配置，对每种配置执行动态调度，再依据产量优先、时间次优的规则选取最佳方案。
    why: 8台CNC的可行刀具配置数量有限，完全遍历能够避免仅凭加工时间比例分配刀具所造成的局部偏差，并可与启发式调度有效结合。
  - name: 可预判与仅响应需求信号的双信息模式调度模型
    role: 分别模拟能够利用历史信号预测CNC完成时刻的RGV，以及只能响应当前需求信号的RGV，并比较两种信息能力下的调度效果。
    why: 不同型号RGV的信息处理能力不同，分层建模可以提高方案的普适性，并量化提前移动相对于原地等待的效率收益。
  solution_flow: 输入3组系统作业参数以及RGV移动、上下料、清洗、CNC加工和故障维修参数→初始化8台CNC状态、RGV位置、物料工序状态和班次时钟→建立单工序或双工序0-1动态调度模型，双工序情形进一步枚举刀具分布→计算每台可服务CNC的预计完成时间并按启发式规则选择下一服务对象→更新RGV位置、CNC剩余加工时间、物料状态、成品数量和清洗状态→故障情形按1%概率生成故障，并随机生成故障时刻与600至1200秒维修时间后更新设备状态→循环调度至8小时班次结束→输出调度序列、成品产量、RGV工作时长、刀具方案和故障次数→利用多组参数、仿真数据及两类信息模式进行结果检验和比较。
  validation: 使用3组系统作业参数分别检验无故障单工序、无故障双工序以及概率故障下的单工序和双工序模型；比较产量、RGV总工作时长、最优刀具分布和故障次数，并对可预判模型与仅响应当前信号模型进行多组对照。模型实用性从普适性、经济性、实施可行性和CNC平均非有效工作时长评价，算法有效性从程序运行时间与Matlab内存占用量评价，最后再利用独立仿真数据进行复核。
  visualization:
  - 模型思维导图
  - 启发式算法流程图
  - 调度路径或时序甘特图
  - 不同方案产量与工作时长对比图
  - 故障次数及设备非有效工作时长统计图
  pitfalls_avoided:
  - 设置物料占用状态变量区分首次上料和后续换料，避免系统启动阶段错误地执行下料或清洗，从而高估服务时间并低估产量。
  - 通过RGV上一轮终点等于下一轮起点的路径连续性约束，避免把每轮移动都从固定位置重新计算而低估实际移动时间。
  - 双工序模型同时设置物料工序状态和CNC刀具类型，并要求二者匹配后才能上料，避免将生料送入二工序机床或让已完成一工序的物料重复加工。
  - 刀具配置要求两类工序机床均至少有一台，避免出现全部CNC安装同一种刀具、导致生产链无法完成的形式可行但业务不可行方案。
  - 采用产量优先、同产量下RGV工作时间最少的层次化目标，避免简单加权时因量纲和权重选择不当而牺牲成品产量。
  - 发生故障时立即将当前物料判为报废、清空占用状态并把维修时间写入剩余不可用时间，避免故障机继续被调度或报废品被错误计入产量。
  - 分别建立可预判和仅响应当前需求的调度模式，避免默认所有RGV都能获得CNC未来完成信息，从而导致模型策略在低功能设备上无法实施。
  innovation_points:
  - 依据RGV的信息处理能力建立可预判历史状态与仅响应当前需求信号的两套动态调度模型，并对其生产效果进行对比。
  - 将CNC维修过程等效为一次较长的加工作业，通过状态重置将随机故障、物料报废与原有动态调度框架统一起来。
  - 把有限规模的刀具配置完全遍历与逐轮最短预计完成时间启发式算法结合，实现双工序资源配置和实时路径调度的协同优化。
  - 不仅以成品产量评价方案，还综合考察RGV工作时间、CNC非有效工作时间、程序运行时间和内存占用，从模型实用性与算法有效性两个层面进行验证。
- id: 2016_A433
  source_paper: 2016 2016_A433
  problem_type: 仿真+优化
  keywords:
  - 系泊系统设计
  - 悬链线
  - 多目标遗传算法
  context: 针对近海观测网传输节点，在风力、水流和水深变化条件下设计锚链型号与长度及重物球质量，使系统满足安全约束并尽量减小钢桶倾角、浮标吃水深度和游动范围。
  models:
  - name: 整体静力平衡模型
    role: 将浮标、钢管、钢桶和重物球视为整体，根据浮力、重力、风力及水流力的平衡求出锚链作用力的水平与竖直分量。
    why: 整体法可以消去构件之间的内部约束力，直接建立环境载荷、吃水深度与锚链端部张力之间的关系，为后续姿态和锚链形状计算提供边界条件。
  - name: 基于虚功原理的多刚体倾角模型
    role: 从钢桶到四节钢管逐级进行受力分析，计算钢桶和各节钢管的平衡倾角及连接处约束力。
    why: 钢桶与钢管组成串联刚体系统，直接列写各构件的力矩平衡较繁琐；虚功原理能利用微小转角统一处理重力、浮力、锚链拉力和约束力矩。
  - name: 分段悬链线模型
    role: 在自然坐标系中用tanθ与弧长s的线性关系描述锚链形状，并分别处理锚链全部悬空和部分平铺海床两种状态。
    why: 柔性锚链在均布自重和端部张力作用下近似形成悬链线；采用自然坐标可避免在直角坐标下直接求解双曲函数超越方程，并能方便计算锚点切线角、高度和水平展宽。
  - name: 水深几何闭合模型
    role: 将浮标吃水深度、钢桶与钢管的竖向投影及锚链悬空高度相加，并令其等于实际水深，以反求吃水深度。
    why: 吃水深度同时影响浮力、风载荷和锚链张力，是系统的隐含未知量；利用总水深约束可使受力关系与几何构型闭合。
  - name: 重物球质量控制模型
    role: 以重物球质量为控制变量，通过步长遍历和逐步逼近，寻找同时满足钢桶倾角不超过5度、锚点切线角不超过16度的质量下限。
    why: 重物球质量增大时两个约束角度总体单调减小，使用一维搜索可稳定获得可行阈值，且比构造复杂解析逆模型更直接。
  - name: 风流载荷矢量合成模型
    role: 根据风力、水流力及二者夹角计算水平环境载荷合力，并将其代入原静力模型。
    why: 风向与流向不一定相同，不能简单标量相加；利用余弦定理进行矢量合成能够体现夹角对系统受力和游动方向的影响。
  - name: 加权多目标遗传算法模型
    role: 以锚链型号与长度、重物球质量为设计变量，在不同水深和极端风流条件下优化钢桶倾角、浮标吃水深度和游动范围。
    why: 设计变量兼有离散型号和连续参数，目标之间存在冲突且受非线性悬链线及安全约束影响，遗传算法适合进行全局组合搜索；加权策略可将多个性能指标统一为适应度函数。
  solution_flow: 输入海水密度、水深、风速、水流速及方向、设备尺寸质量、候选锚链参数和重物球质量→假设浮标吃水深度并由整体静力平衡求锚链端部张力→利用虚功原理逐级计算钢桶与钢管倾角→依据竖向张力和锚链折合重量判定全部悬空或部分落底，并建立对应悬链线→通过水深几何闭合方程数值求解吃水深度→计算锚点切线角、锚链水平展宽和浮标游动半径→在给定工况下遍历重物球质量得到安全阈值→在水深16至20米、风速不超过36米每秒和流速不超过1.5米每秒的工况中，用多目标遗传算法优化锚链型号、长度及重物球质量→检查受力平衡、状态判据和安全约束，并结合实际海域参数验证设计。
  validation: 首先使用水平与竖直方向的整体受力平衡检查锚链张力计算；其次通过各构件竖向投影、锚链高度和浮标吃水深度之和等于水深进行几何闭合验证；再次依据Fy是否大于锚链折合总重判断全部悬空假设是否成立，不成立时切换到部分落底模型；对不同风速工况比较倾角、吃水深度和游动范围的变化趋势，并通过细步长质量遍历验证重物球质量阈值；最终检查钢桶倾角不超过5度、锚点切线角不超过16度，并将模型应用于胶州湾实际风流条件进行外部场景验证。
  visualization:
  - 系泊系统及各构件受力分析图
  - 锚链全部悬空与部分落底的悬链线形态图
  - 钢桶倾角和锚点切线角随重物球质量变化曲线
  - 不同风速、水流速及水深下性能指标对比图
  - 多目标遗传算法迭代收敛曲线或Pareto解集图
  - 浮标圆形游动区域示意图
  pitfalls_avoided:
  - 避免不加判断地统一采用全悬空悬链线：当锚链端部竖向力小于锚链折合总重时，全悬空假设在力学上不成立，必须改用部分锚链平铺海床的分段模型。
  - 避免直接在直角坐标系中求解悬链线超越方程：改用自然坐标关系tanθ=ks+b，可直接利用端部张力确定参数，降低数值求解难度。
  - 避免预先固定浮标吃水深度：吃水深度会同时改变浮力、迎风面积和张力，必须通过水深几何闭合方程联立反求，否则各指标之间不自洽。
  - 避免只控制钢桶倾角而忽略锚的抗拖移安全：即使钢桶倾角满足5度要求，锚点切线角仍可能超过16度，因此重物球质量必须同时满足两项约束。
  - 避免将不同方向的风力和水流力直接相加：论文按照风流夹角进行矢量合成，防止高估或低估实际水平环境载荷。
  - 避免在优化中生成大量不可行方案：遗传算法初始化和适应度评价阶段先检查钢桶倾角与锚点切线角约束，可减少无效搜索并保证候选设计安全。
  - 避免忽略海水浮力对钢构件和锚链自重的修正：使用折合重力计算水下有效重量，否则会错误判断锚链悬空状态并造成倾角偏差。
  innovation_points:
  - 将整体静力平衡、串联刚体虚功分析、分段悬链线和水深几何闭合统一耦合，使吃水深度、构件倾角、锚链形状及游动范围能够联立求解。
  - 针对锚链全悬空和部分落底状态建立判别条件与切换模型，提高了不同载荷工况下的物理一致性。
  - 把风速、水流速、风流夹角、水深、锚链密度与长度及重物球质量统一参数化，形成可用于多工况仿真和优化的通用函数模型。
  - 将满足安全约束的控制问题扩展为兼顾吃水深度、游动范围和钢桶倾角的多目标优化，并用遗传算法联合选择离散锚链型号和连续设计参数。
  - 将理论模型进一步应用到胶州湾实际浅海环境，使设计方法从标准工况计算扩展到区域化工程决策。
- id: 2017_B154
  source_paper: 2017 2017_B154
  problem_type: 预测+优化+分类聚类+统计分析
  keywords:
  - ISODATA聚类
  - 回归分析
  - 位势函数法
  - 收益期望优化
  - 最近邻打包
  context: 基于众包拍照任务的地理位置、价格、完成状态及会员分布数据，分析原有定价规律与未完成原因，并优化单任务和打包任务的定价方案。
  models:
  - name: ISODATA聚类模型
    role: 对任务点进行空间聚类，识别广州、佛山、东莞和深圳四个任务区域，并确定各区域中心。
    why: 任务点具有明显的空间集聚特征，ISODATA能够通过类别分裂、合并和迭代更新自适应地形成聚类，适合事先难以严格确定类别边界的地理数据。
  - name: 距离计算与最近中心归属模型
    role: 计算每个任务点到四个聚类中心的距离，并以最小距离确定其所属城市区域及区位特征。
    why: 任务价格与其相对城市中心的位置有关，最近聚类中心距离能够将二维经纬度信息转化为可用于定价分析的单一解释变量。
  - name: 一元线性回归定价模型
    role: 拟合任务价格与任务点到最近城市中心距离之间的关系，得到基础定价公式。
    why: 可视化分析表明价格总体随离市中心距离增加而上升，线性回归形式简单、可解释性强，适合作为基础定价规律。
  - name: 任务吸引力函数模型
    role: 用任务价格和会员到任务点的距离描述任务对会员的吸引力，其中吸引力随价格增加、随距离增加而降低。
    why: 任务是否被领取不仅取决于价格，还受到出行成本影响，将价格和距离联合建模比单独依据区位定价更符合会员决策机制。
  - name: 位势函数会员活跃度模型
    role: 将会员空间分布、会员等级和信誉等信息抽象为空间连续的用户活跃度场。
    why: 离散会员点难以直接反映任务周边的潜在供给能力，位势函数可以综合会员数量、距离和活跃等级，刻画不同位置的可用劳动力强度。
  - name: 任务完成概率模型
    role: 在任务邻域内对任务吸引力与会员活跃度的乘积进行积分，估计每个任务被完成的概率。
    why: 任务完成是需求吸引力与周边劳动力供给共同作用的结果，二者乘积积分能够同时体现价格、距离、会员密度和会员等级的影响。
  - name: 公司期望收益优化模型
    role: 以任务完成概率和单任务净收益构造期望收益函数，并搜索使公司期望收益最大的任务价格。
    why: 过低价格可能降低完成率，过高价格又会压缩公司利润，因此需要在完成概率与支付成本之间进行权衡，而不能仅追求最高完成率。
  - name: 行动力与行动力效率模型
    role: 将会员可投入能力抽象为行动力，并用做任务行动力占移动与做任务总行动力的比例评价任务组织效率。
    why: 任务打包的核心作用是降低多个任务之间的重复移动成本，行动力效率能够直接衡量打包后有效劳动占总投入的比例。
  - name: 分带打包模型
    role: 根据任务点到所属城市中心的距离划分区域，并为不同区域设置不同的包内任务数量。
    why: 市中心和居住区会员密集、单任务易完成，不宜过度打包；偏远区域移动成本较高，采用较大的任务包可以提高出行效率。
  - name: 最近邻层次合并算法
    role: 在给定包容量后不断合并空间上最近的任务点，形成地理位置紧凑的任务包。
    why: 空间相近的任务联合发布可以缩短包内移动距离，最近邻法实现简单，并能直观控制任务包的地理紧凑程度。
  - name: 任务—会员匹配矩阵模型
    role: 综合任务吸引力、会员位置和完成能力，识别跨城市匹配关系，并为新项目确定主要劳动力来源。
    why: 不同城市可能分别出现行动力供给饱和和消耗饱和，仅按行政区域就近分配会忽略跨区域会员更适合完成某些任务的情况。
  solution_flow: 整理任务经纬度、价格、完成状态及会员位置和等级数据→绘制空间分布图并使用ISODATA将任务划分为四个城市簇→计算任务点到最近聚类中心的距离→以417组数据训练线性回归基础定价模型并用其余417组检验→分析高价异常任务和各价格区间的完成密度→建立价格、距离决定的任务吸引力函数及会员分布、等级决定的活跃度位势函数→通过邻域积分估计完成概率→构造公司期望收益函数并优化单任务价格→引入行动力效率，按中心距离分带确定包容量，再用最近邻法形成任务包并重新定价→构造任务—会员匹配矩阵，对新项目进行跨区域匹配、打包和定价。
  validation: 采用样本外验证，将前417个任务作为训练集估计距离—价格回归参数，后417个任务作为检验集比较实际价格与预测价格；同时将聚类中心映射到真实地图，检查其与广州、佛山、东莞、深圳城市中心的一致性；统计不同价格区间和不同城市的完成密度，验证高价格、市中心位置与较高完成率之间的关系；对预测误差超过10元的80元以上任务单独回查实际地址，以偏远程度和任务特殊性解释异常，而非直接将其视为普通随机误差。
  visualization:
  - 任务点价格分区空间分布图
  - 任务完成与未完成密度图
  - 聚类中心地图标注图
  - 价格—中心距离散点图及回归拟合图
  - 实际价格与预测价格误差对比表
  - 任务与会员活跃度空间分布图
  pitfalls_avoided:
  - 避免直接对全部任务使用统一固定价格，因为不同任务到城市中心的距离、交通便利程度及周边会员供给存在明显差异，统一定价会导致偏远任务缺乏吸引力。
  - 避免只依据价格解释任务完成情况，因为同一价格在会员密集区和会员稀疏区的完成概率不同，模型同时引入距离、会员数量、等级和活跃度。
  - 避免用线性回归强行解释所有高价任务，因为80元以上任务出现十元以上的系统性误差，论文将其单独定位并结合偏远性、任务难度和发布紧迫性分析。
  - 避免仅用训练样本评价回归效果，因为样本内拟合可能高估模型泛化能力，论文采用前后各417组数据进行训练和样本外检验。
  - 避免对所有区域设置相同的打包规模，因为市中心任务本身易完成，过度打包可能降低领取意愿；偏远任务则需要较大任务包来分摊移动成本。
  - 避免按照城市边界机械分配会员，因为行动力供给与任务消耗在城市间不平衡，匹配矩阵允许行动力饱和城市的会员承担其他城市边缘任务。
  - 避免只最大化任务完成率而忽略平台成本，因为无限提高价格虽然可能提升完成概率，却会降低公司单任务利润，因此使用期望收益而非完成率作为最终优化目标。
  innovation_points:
  - 将任务吸引力与会员活跃度表示为空间函数，并通过邻域内乘积积分把离散的任务—会员关系转化为可优化的任务完成概率。
  - 提出行动力及行动力效率指标，将会员移动消耗和实际工作消耗纳入统一框架，为差异化打包规模提供量化依据。
  - 将城市聚类、距离分带和最近邻合并结合，形成兼顾宏观区域差异与微观空间紧凑性的两阶段任务打包算法。
  - 利用任务—会员匹配矩阵识别跨城市劳动力调配关系，缓解行动力供给饱和区与任务消耗饱和区之间的不平衡。
  - 采用基础回归定价与高价异常任务修正相结合的分层思路，在保持模型可解释性的同时处理偏远位置、特殊难度和紧迫需求带来的非线性溢价。
- id: 题目_2009全国大学生数学建模A题0318
  source_paper: 题目 题目_2009全国大学生数学建模A题0318
  problem_type: 综合评价+分类聚类+优化+预测+统计分析
  keywords:
  - 病床资源配置
  - 区间组合预测
  - 多目标整数规划
  context: 针对某医院眼科79张病床在急诊优先、非急诊FCFS及特定手术日规则下出现候床队列增长的问题，评价并优化病床与手术安排，同时预测患者入院时间和确定各病种床位分配比例。
  models:
  - name: 灰色关联聚类模型
    role: 计算候选评价指标之间的灰色关联度并进行聚类，为病床安排评价指标体系初筛和去除同类冗余指标。
    why: 候选指标量纲不同、样本量有限且指标之间存在较强关联，灰色关联分析对小样本和不完全信息具有较好的适用性。
  - name: 粗糙集核与约简模型
    role: 利用分辨矩阵求取指标核和最小约简，在保留系统辨识能力的前提下确定核心评价指标。
    why: 粗糙集无需预先指定指标权重或概率分布，可以客观识别不可缺少的属性，并进一步消除冗余指标。
  - name: 基于0-1整数规划的多目标病床安排模型
    role: 以患者是否在某日入院、手术和出院为0-1决策，综合床位容量、手术日期及诊疗阶段时长等约束，安排次日入院患者并尽量缩短各类患者的平均系统逗留时间。
    why: 患者入院、手术和出院属于离散决策，且病床容量和手术日规则均为刚性约束，因此0-1整数规划能够直接表达实际调度过程。
  - name: 线性回归区间预测模型
    role: 根据各时刻不同病种的住院人数和候床人数，预测指定患者可能的入院时间区间。
    why: 住院存量、候床队列与入院等待时间之间具有可估计的数量关系，线性回归结构清晰且便于解释和实施。
  - name: 均值—方差区间预测模型
    role: 利用历史入院等待时间的均值和波动程度构造患者入院时间区间，作为独立的单项预测结果。
    why: 均值反映典型等待水平，方差反映随机波动和预测不确定性，可避免只给出缺乏风险信息的单点预测。
  - name: 基于IOWA算子的区间组合预测模型
    role: 以各单项预测方法的区间相对误差为诱导值，并以区间中心位置误差和区间长度误差的凸组合作为优化准则，融合两类入院时间区间预测。
    why: 不同单项模型包含互补信息且可能在不同时段表现不同，IOWA算子能够依据历史预测表现动态排序和赋权，从而分散单一模型失效风险。
  - name: 手术安排变动下的约束调整与灵敏度分析模型
    role: 在0-1整数规划模型中加入周六、周日不安排手术等新约束，重新评估患者手术时间、入院安排和系统逗留时间。
    why: 医院手术日历变化会改变可行调度集合，直接修改约束比重新构建模型更便于检验原方案的稳定性和适应性。
  - name: Shapley值合作博弈模型
    role: 将四类非外伤手术患者视为合作博弈参与者，以平均逗留时间缩短和出院人数增加作为联盟收益，计算79张病床的固定分配比例。
    why: 不同病种共享床位会产生合作收益，Shapley值可依据各病种对不同联盟的边际贡献进行相对公平且可解释的资源分摊。
  solution_flow: 整理门诊、候床、入院、手术和出院历史数据并按病种及周次统计→对候选指标进行无量纲化，计算灰色关联矩阵并聚类→构造粗糙集分辨矩阵，求核与约简，得到等待入院时间、等待手术时间、总逗留时间和病床周转次数等核心指标→按病种估计等待入院、术前等待和术后康复时间的最小值、最大值及均值→建立含床位容量、FCFS与急诊优先规则、病种手术日历和诊疗阶段衔接约束的0-1整数规划，求解次日入院名单及患者最短和最长逗留时间→分别用线性回归和均值—方差模型生成入院时间区间，再由IOWA算子依据历史区间误差求组合权重并输出组合区间→加入周末禁做手术约束重新优化并开展灵敏度分析→以联盟边际收益计算Shapley值，形成四类病种固定床位配置比例→用历史样本回代、指标对比和预测误差评价验证模型。
  validation: 采用历史样本分时段实证检验：将优化前后的等待入院时间、总逗留时间、出院人数、病床使用率和病床周转次数进行对比；检查0-1规划结果是否满足79张床容量、手术日期和诊疗流程等约束；比较线性回归、均值—方差与IOWA组合预测的区间相对误差、区间中心位置误差和区间长度误差，验证组合预测是否具有优性；通过加入周末不安排手术的情景重新求解，检验调度模型对规则变化的灵敏度和稳健性。
  visualization:
  - 评价指标灰色关联度矩阵热力图
  - 指标聚类树状图
  - 各病种诊疗阶段最短—平均—最长时间分组柱状图
  - 每周入院人数与出院人数对比折线图
  - 病床使用率和病床周转次数趋势图
  - 患者入院—手术—出院调度甘特图
  - 单项预测与IOWA组合预测区间带图
  - 四类病种Shapley床位分配比例饼图
  pitfalls_avoided:
  - 避免直接保留全部候选指标：指标过多会造成信息重复和计算复杂，而指标过少又会丢失关键运行信息，因此先用灰色关联聚类识别相似指标，再用粗糙集核与约简保留系统不可缺少的属性。
  - 避免依赖Delphi法进行纯主观筛选：专家意见缺乏统一客观标准且可能存在偏见，论文使用历史数据驱动的关联度和可分辨性进行指标选择。
  - 避免直接比较不同量纲的指标：等待时间、出院人数和周转次数量纲差异明显，未经处理会扭曲关联度，因此在灰色关联分析前先进行无量纲化。
  - 避免仅以病床使用率达到100%判断方案优秀：满负荷运行缺少应急缓冲，可能加剧候床和调度拥堵，因此同时考察等待时间、逗留时间、周转次数和出院人数，并参考85%至93%的合理使用率区间。
  - 避免把患者逗留时间作为单一整体处理：总逗留时间无法定位拥堵来源，因此将其拆分为等待入院、入院后等待手术和术后康复三个阶段，并分别估计上下界。
  - 避免只按平均时长进行确定性调度：不同患者和病种的诊疗时间具有波动性，单一均值可能低估容量风险，因此同时考虑历史最短和最长两种极端情形。
  - 避免使用连续变量表示离散诊疗事件：患者在某日是否入院、手术或出院只能取是或否，使用0-1变量可防止出现非整数患者或部分入院等不可执行结果。
  - 避免仅依赖单一入院时间预测模型：线性回归可能受结构设定影响，均值—方差模型又可能忽略动态队列信息，因此通过IOWA组合预测综合两者信息并分散预测风险。
  - 避免手术规则改变后继续沿用原调度结果：周末停手术会改变患者术前等待和床位占用周期，因此必须增加相应日历约束并重新优化，而不能只做结果层面的人工修补。
  - 避免简单按历史患者数量平均分床：各病种住院周期和对系统收益的边际贡献不同，平均分配可能不公平且低效，因此使用Shapley值按联盟边际贡献确定比例。
  innovation_points:
  - 将灰色关联聚类与粗糙集核约简串联，兼顾小样本条件下的指标相关性识别与无主观权重的客观降维。
  - 把患者系统逗留时间分解为候床、术前和术后康复三个阶段，并将各阶段历史上下界嵌入0-1整数规划，使次日入院安排同时反映最优与最不利情景。
  - 采用以区间相对误差为诱导值的IOWA算子融合线性回归和均值—方差区间预测，并联合控制区间中心偏差与区间宽度。
  - 在统一的病床调度框架内通过增加手术日历约束处理周末停手术情景，使模型具备规则变动下的灵敏度分析能力。
  - 将固定床位比例设计转化为四病种合作博弈，以缩短平均逗留时间和增加出院人数形成联盟收益，再用Shapley值实现基于边际贡献的公平分配。
- id: 2016_A028
  source_paper: 2016 2016_A028
  problem_type: 仿真+优化+综合评价
  keywords:
  - 系泊系统机理建模
  - 多目标非线性规划
  - 变步长搜索算法
  context: 针对近浅海观测网传输节点，在不同风速、水流速度和水深条件下分析系泊系统姿态，并优化锚链型号、长度及重物球配重。
  models:
  - name: 二维系泊系统力学状态模型
    role: 通过对浮标、钢管、钢桶和锚链逐段进行受力与力矩平衡分析，递推计算构件拉力、作用力方向、倾斜角、浮标吃水深度和游动半径。
    why: 系统状态主要由浮力、重力、风荷载和构件间拉力共同决定，机理模型能够直接反映各物理参数之间的因果关系。
  - name: 海水深度几何约束模型
    role: 利用各构件竖直投影长度之和等于海水深度的条件封闭非线性方程组，并通过水平投影之和计算浮标游动半径。
    why: 仅靠受力平衡无法唯一确定浮标吃水深度和系统空间姿态，需要引入整体几何闭合条件确定系统状态。
  - name: 锚链着地修正模型
    role: 识别第一个脱离海床的链环，重新限定悬空链环递推范围，并将沉底锚链的水平长度计入浮标游动半径。
    why: 低风速条件下部分锚链会沉底，若仍对全部链环使用悬空受力递推关系，会导致锚链形状、锚点夹角和游动范围计算失真。
  - name: 基于最小二乘法的非线性方程搜索模型
    role: 将力学平衡方程和几何约束的残差平方和作为求解目标，搜索浮标吃水深度及各构件状态参数。
    why: 系泊状态方程具有多变量、强非线性和递推耦合特征，直接解析求解困难，而最小二乘搜索适合在较小解空间中寻找满足全部约束的近似数值解。
  - name: 多目标非线性规划模型
    role: 以浮标吃水深度、游动区域和钢桶倾角尽可能小为目标，以水深闭合、钢桶倾角不超过5度及锚点夹角不超过16度等为约束，优化重物球质量、锚链型号和锚链长度。
    why: 系泊设计同时涉及稳定性、通信效果、抗拖移安全性和构件配置，多个目标相互制约，适合采用约束多目标优化统一处理。
  - name: 熵权综合评价模型
    role: 根据各优化指标的信息差异客观确定权重，将多目标非线性规划转化为单目标综合评价问题。
    why: 不同指标量纲和变化幅度不同，直接相加会产生尺度偏差；熵权法能够减少完全依赖主观赋权造成的结果偏移。
  - name: 三维风流耦合状态模型
    role: 在风向与水流方向不一致时，将风力、水流力及构件作用力分解到水平面和竖直平面，计算三维系泊姿态与浮标游动区域。
    why: 问题三中风与水流可能存在夹角，二维共面假设无法描述横向偏移，必须扩展为空间受力模型。
  - name: 变步长搜索优化模型
    role: 先以较大步长搜索锚链型号、长度和重物球质量的可行区域，再缩小步长精细搜索最优设计。
    why: 设计变量同时包含离散变量和连续变量，且状态模型计算复杂、解空间非凸，变步长搜索可兼顾全局探索效率与局部求解精度。
  solution_flow: 输入浮标、钢管、钢桶、锚链和重物球参数以及风速、水流速度、水深等环境数据→建立坐标系并计算重力、浮力、近海风荷载和随深度变化的水流力→逐构件建立平动平衡、转动平衡和作用力递推关系→加入水深投影闭合条件并判断锚链是否着地→以最小二乘残差搜索吃水深度、构件倾角、拉力和锚链形状→计算浮标游动区域、钢桶倾角及锚点夹角→建立以配重、锚链型号和长度为决策变量的多目标非线性规划→采用熵权法综合目标，并通过循环搜索或变步长搜索得到可行范围与最优方案→在不同风速、水流方向、流速和水深情景下复算并检验设计约束。
  validation: 采用物理一致性与情景检验相结合的策略：检查每个构件水平和竖直方向合力残差及力矩残差是否接近零，检查全部构件竖直投影与给定水深是否闭合，检查锚链着地临界条件及张力方向是否合理；随后在12m/s、24m/s和36m/s风速以及16至20m水深、最高1.5m/s流速等典型或极端情景下进行复算，比较倾角、吃水深度和游动半径随环境载荷变化是否符合力学规律，并核验钢桶倾角不超过5度、锚点夹角不超过16度等设计要求。
  visualization:
  - 系泊系统空间坐标与结构示意图
  - 浮标、钢管、钢桶和锚链隔离受力图
  - 不同风速与水流工况下的锚链形状曲线图
  - 各构件倾斜角度对比图
  - 浮标游动区域平面图
  - 重物球质量与钢桶倾角、锚点夹角的关系图
  pitfalls_avoided:
  - 避免在低风速时默认整条锚链全部悬空；部分锚链实际会沉底，继续使用悬空链环递推式会高估竖直投影并错误计算锚链形状和游动半径，因此引入着地临界受力条件和分段模型。
  - 避免只使用平动力平衡而忽略构件转动平衡；钢管和钢桶具有有限长度，仅满足合力为零不能确定其倾角，因此还必须对构件端点取矩建立力矩平衡方程。
  - 避免忽略整体水深闭合约束；逐段受力递推只能给出参数间关系，无法唯一确定吃水深度和完整姿态，因此需令吃水深度与各构件竖直投影之和等于实际水深。
  - 避免将不同量纲的吃水深度、游动半径和钢桶倾角直接相加；这会使数值尺度较大的指标主导优化结果，因此先进行指标标准化并利用熵权法赋权。
  - 避免在风向与水流方向不一致时继续采用二维共面模型；该假设会漏掉横向水动力和侧向游移，因此在问题三中建立三维坐标系并进行空间力分解。
  - 避免仅优化平均工况而忽略极端环境约束；方案若未在最大风速、最大流速和水深变化范围内复核，可能出现钢桶倾角超限或锚被拖移，因此对多种边界工况进行情景验证。
  - 避免对复杂混合变量空间始终使用固定小步长遍历；固定小步长计算量过大，而固定大步长又可能漏掉最优解，因此采用由粗到细的变步长搜索。
  innovation_points:
  - 将逐构件受力与力矩机理分析、整体几何闭合和锚链着地判别统一到递推式系泊状态模型中，实现从环境载荷到完整系统姿态的连续计算。
  - 将状态仿真与多目标非线性规划耦合，以锚链型号、锚链长度和重物球质量为设计变量，同时控制通信设备倾角、锚点安全角和浮标游动范围。
  - 采用熵权法进行客观赋权，将多目标设计指标转化为可计算的单目标综合函数，降低主观权重对最优方案的影响。
  - 针对包含离散与连续变量、非线性强且计算成本较高的解空间，设计粗搜索与精搜索结合的变步长算法，提高求解效率和精度。
  - 将二维静水风载模型扩展为考虑水深变化、流速随深度分布以及风流夹角的三维耦合模型，增强方案对真实海况的适用性。
- id: 2023_B226
  source_paper: 2023 2023_B226
  problem_type: 优化+统计分析+仿真
  keywords:
  - 多波束测线布设
  - 覆盖宽度与重叠率
  - 单目标优化
  context: 基于海底坡度、海水深度及单波束测深数据，在覆盖完整、重叠率合理的条件下优化多波束测深航线，以降低测线总长度并提高海洋测绘效率。
  models:
  - name: 平面几何与正弦定理覆盖宽度模型
    role: 根据海水深度、海底坡度和换能器开角计算多波束条带的左右覆盖宽度及总覆盖宽度。
    why: 多波束声呐的横截面可抽象为波束边界与倾斜海底构成的三角形，利用角度关系和正弦定理能够直接建立具有明确物理意义的解析公式。
  - name: 相邻条带重叠率模型
    role: 结合相邻测线间距、两侧覆盖宽度和坡面距离，计算相邻扫描条带的重叠率并识别漏测区域。
    why: 平坦海底条件下的简单公式不能直接用于倾斜海底，需要分别考虑相邻条带在坡面上的左右覆盖范围，才能准确刻画重叠和漏测。
  - name: 三维向量与空间解析几何模型
    role: 在任意测线方向下，通过坡面法向量、扫描平面法向量及向量叉乘求取两平面交线，进而计算沿测线位置的水深和有效横向坡度。
    why: 当测线不平行于等深线时，覆盖宽度所在剖面不再与最大坡度方向一致，三维向量方法可以统一处理测线方向角、坡面方向和空间交线关系。
  - name: 测线布设单目标优化模型
    role: 以测线总长度最短为目标，以海域完全覆盖、相邻条带重叠率处于10%至20%以及边界覆盖为约束，确定测线方向、数量和间距。
    why: 测线设计的核心是在测量质量约束下减少航行长度，目标明确且约束可量化，适合构建带几何覆盖约束的单目标优化模型。
  - name: 贪心循环遍历算法
    role: 从边界第一条测线开始，逐条选择满足覆盖与重叠约束的最大可行间距，生成矩形海域及各分区的测线方案。
    why: 相邻测线之间存在明显的顺序递推关系，局部选择尽可能大的可行间距可减少测线数量，算法实现简单、计算效率高且便于加入边界约束。
  - name: 最小二乘坡面拟合模型
    role: 将复杂海底按等深线特征划分为多个区域，并利用单波束离散水深数据拟合各区域的局部坡面方程。
    why: 原始海底起伏较大，无法直接套用规则坡面覆盖模型；局部最小二乘拟合可以将离散测深数据转化为可计算的连续坡面，同时降低测量误差的影响。
  - name: 粒子群参数求解算法
    role: 搜索各分区坡面方程的拟合参数，并辅助识别拟合效果不佳、需要进一步细分的区域。
    why: 复杂分区的拟合目标可能具有多参数耦合或非线性特征，粒子群算法对初值要求较低，具有较好的全局搜索能力。
  - name: 模拟退火仿真模型
    role: 对贪心算法得到的测线数量、间距及总长度进行独立仿真检验，比较两种方法的求解误差。
    why: 贪心算法可能受局部最优选择影响，模拟退火能够以概率接受劣解并扩大搜索范围，适合作为近似全局优化的可靠性验证工具。
  - name: 控制变量与灵敏度分析模型
    role: 分析换能器开角、海底坡度和测线间距变化对覆盖宽度、重叠率及最终测线布设结果的影响。
    why: 这些参数直接决定扫描条带几何形状和覆盖效率，灵敏度分析能够检验方案稳定性并给出深水区增大间距、浅水区加密测线等工程建议。
  solution_flow: 输入海域边界、开角、中心水深、坡度及单波束离散水深数据→建立坐标系并用平面几何和三维向量模型计算不同位置的水深、覆盖宽度与重叠率→证明测线平行等深线方向更优并设置总长度最小目标及覆盖、重叠率、边界约束→对复杂海域按等深线分区，采用最小二乘与粒子群拟合局部坡面参数→使用贪心循环遍历逐条确定测线位置、间距和数量→统计总长度、漏测面积占比及重叠率超过20%的测线长度→通过模拟退火对比、拟合误差检查和参数灵敏度分析验证模型。
  validation: 首先以模拟退火对测线布设进行独立仿真，将其结果与贪心算法得到的测线数量和总长度比较，较小误差用于说明优化结果可靠；其次检查各局部坡面的最小二乘拟合效果，对误差较大的区域继续细分并重新拟合；再次计算完全覆盖情况、漏测面积占比和重叠率超过20%的总长度进行工程可行性检验；最后改变开角、坡度和测线间距开展控制变量与灵敏度分析，验证结论的稳定性和参数变化规律。
  visualization:
  - 多波束测深原理与坐标系示意图
  - 覆盖宽度三角几何关系图
  - 相邻条带重叠区域示意图
  - 三维坡面与扫描平面交线图
  - 海底等深线图与区域划分图
  - 局部坡面拟合效果图
  - 测线布设平面图
  - 覆盖宽度随换能器开角变化曲线
  - 重叠率随换能器开角变化曲线
  - 重叠率随测线间距变化曲线
  - 灵敏度分析曲线
  pitfalls_avoided:
  - 避免直接使用平坦海底公式计算倾斜坡面的覆盖宽度和重叠率；坡面两侧波束与海底的交角不同，若仍用对称覆盖公式会系统性误估重叠范围并导致漏测。
  - 避免在任意测线方向下直接把原始坡度代入二维模型；覆盖剖面的有效坡度随测线方向角变化，必须通过平面法向量、叉乘和线面角计算实际横向坡度。
  - 避免全海域采用固定测线间距；水深减小时覆盖宽度同步减小，固定间距容易使浅水区出现负重叠率和漏测，而深水区又会产生过度重叠。
  - 避免只优化相邻测线而忽略海域边界；即使内部重叠率满足要求，首末测线覆盖不足仍会产生边缘漏测，因此需要先确定边界测线并将边界覆盖纳入约束。
  - 避免对起伏明显的复杂海底强行拟合为单一坡面；整体拟合会掩盖局部地形变化，使覆盖宽度计算失真，因此依据等深线分区并对拟合不佳区域继续细分。
  - 避免仅依赖贪心算法结论；贪心策略可能陷入局部最优，论文引入模拟退火进行独立搜索和误差对比，以降低算法偏差带来的风险。
  - 避免只报告测线总长度而忽视测量质量；同时统计漏测海域占比和重叠率超过20%的总长度，防止以牺牲完整性或制造大量冗余覆盖来换取短航程。
  - 避免忽略模型适用条件；明确假设船舶垂荡纵摇、海面障碍和声波折射等影响可忽略，否则理想直线传播和几何覆盖模型可能偏离实际作业。
  innovation_points:
  - 将二维正弦定理覆盖模型推广到任意测线方向，通过三维向量叉乘和线面角把方向角转换为有效水深与横向坡度，实现统一的空间覆盖计算。
  - 先从几何上论证测线平行等深线方向更优，再将方向选择与间距优化分离，降低优化问题维度并提升求解效率。
  - 构建以测线总长度最短为目标、以完全覆盖和重叠率区间为约束的递推式布线方法，并采用边界起始的贪心策略逐条生成可实施测线。
  - 针对真实复杂海底提出等深线分区、局部坡面拟合、拟合不佳区域再细分的自适应地形简化流程，使规则坡面模型能够扩展到起伏海域。
  - 采用贪心算法求解与模拟退火仿真交叉验证，并结合漏测率、过度重叠长度及参数灵敏度形成多层次评价体系。
- id: 2017_B248
  source_paper: 2017 2017_B248
  problem_type: 统计分析+分类聚类+优化+预测
  keywords:
  - K-Means聚类
  - 双目标优化
  - 灰色关联分析
  - 熵权法
  - BP神经网络
  - 深度多重搜索
  context: 针对移动互联网劳务众包平台的拍照任务，研究任务定价与完成情况的影响机制，并设计兼顾企业成本和任务完成率的单任务、打包任务及新项目定价方案。
  models:
  - name: 拉依达准则异常值检测模型
    role: 对任务和会员数据进行预处理，识别并剔除经纬度、信誉值等字段中的异常记录。
    why: 原始附件包含大量空间与会员属性数据，异常经纬度会显著扭曲距离、网格统计和聚类结果，采用3σ准则可在给定置信水平下识别粗大误差。
  - name: 空间网格离散化模型
    role: 将连续经纬度区域划分为50×50网格，统计每个任务所在网格内的任务数、会员数和会员平均完成能力。
    why: 任务密度和会员供给均属于局部空间特征，网格化能够把难以直接比较的连续地理数据转化为可量化的区域指标。
  - name: 熵权综合评价模型
    role: 根据会员预订限额和开始预订时间计算客观权重，构造会员任务完成能力指标。
    why: 会员能力无法由单一字段刻画，熵权法能够依据指标信息差异客观赋权，降低主观确定权重造成的偏差。
  - name: K-Means空间聚类模型
    role: 依据任务经纬度识别任务分布簇及其中心，并计算任务到所属中心的距离；同时用于后续任务打包。
    why: 任务位置呈现局部集中、整体分散的空间结构，K-Means适合按照地理距离划分相近任务并提取区域中心特征。
  - name: 灰色关联分析模型
    role: 测量任务定价与网格任务数、会员数、会员平均完成能力及中心距离之间的关联程度，并比较已完成和未完成任务的差异。
    why: 各影响因素量纲不同且关系可能并非简单线性，灰色关联分析对样本分布要求较低，可用于识别因素与定价变化趋势的一致性。
  - name: 吸引度矩阵与阈值模型
    role: 描述价格、任务与会员距离等因素共同作用下任务对会员的吸引力，并据此判断任务是否可能被选择和完成。
    why: 众包平台中是会员选择任务而非企业直接分配任务，必须显式刻画会员侧的选择偏好，才能将定价映射为任务完成结果。
  - name: 规则约束双目标定价优化模型
    role: 以企业总成本最小和任务完成率最大为目标，在最大吸引、会员竞争、信誉优先、预订时间及预订限额等规则约束下确定任务价格。
    why: 单纯压低价格会降低完成率，单纯提高完成率又会增加成本，因此需要同时考虑相互冲突的经济目标和真实预订机制。
  - name: 深度多重搜索算法
    role: 对定价决策变量进行多层次遍历和搜索，获得满足约束的双目标优化定价方案。
    why: 吸引度阈值、0-1完成状态及会员竞争规则使模型具有非线性、离散和多约束特征，难以直接获得解析解，适合采用搜索算法求取可行近优解。
  - name: 二次嵌套K-Means打包模型
    role: 先将任务划分为150类，再对任务数超过15的类别进行二次聚类，使每个任务包位置集中且任务数不超过15。
    why: 一次聚类可能产生规模过大的任务簇，嵌套聚类能够同时满足空间紧凑性和任务包容量上限。
  - name: BP神经网络预测模型
    role: 以打包任务的空间特征、影响因素、优化价格和完成情况为训练样本，预测新项目任务包的定价及完成状态。
    why: 新项目仅提供位置信息，难以直接重复历史项目的完整参数标定，BP神经网络可学习历史优化结果与空间特征之间的非线性映射。
  solution_flow: 数据→检查任务、会员及新项目数据，利用拉依达准则剔除异常记录，并将经纬度映射到地图和50×50空间网格→模型→通过熵权法计算会员完成能力，利用K-Means提取空间簇与中心距离，以灰色关联分析识别定价和未完成任务的关键因素，随后建立吸引度矩阵和规则约束双目标定价模型→参数→量化网格任务数、会员数、会员平均能力、中心距离、会员信誉、预订时间、预订限额及吸引度阈值→求解→采用深度多重搜索获得成本与完成率折中方案；对打包情形实施二次嵌套聚类并重新计算距离矩阵、吸引度矩阵和阈值；利用历史打包优化结果训练BP神经网络预测新项目价格→验证→通过灰色关联度、已完成与未完成样本对比、原方案与新方案成本和完成率对比，以及单任务、打包任务和新项目方案之间的效果比较评价模型。
  validation: 首先以三维拟合图和地图分布验证“任务越密集、价格越低”的定性规律，再以灰色关联度进行定量验证，四个定价因素的关联度分别达到0.9710、0.9671、0.9633和0.9390；通过比较已完成与未完成任务的关联矩阵确认距离是影响完成情况的突出因素。优化方案采用基准对比验证：相较原方案，问题二方案完成率为84.55%，总成本下降5.58%，完成率提高32.25%；打包方案进一步降低约5.7%的成本并提高完成度；新项目预测方案给出总价54603.58元，150个任务包中预计完成141包，完成率为94%。同时应统一完成率的百分数口径，并对BP神经网络使用独立验证集或交叉验证检查泛化性能。
  visualization:
  - 任务经纬度地图散点分布图
  - 经度—纬度—定价三维曲面拟合图
  - K-Means空间聚类散点图及聚类中心图
  - 空间网格密度图
  - 灰色关联度对比柱状图
  - 成本—完成率双目标对比图
  - 任务打包空间分布图
  - BP神经网络预测值与实际值对比图
  pitfalls_avoided:
  - 避免直接使用异常经纬度参与距离计算和聚类，因为经纬度字段颠倒或远离研究区域的记录会造成错误聚类中心，并放大任务与会员之间的距离。
  - 避免仅依据任务自身价格分析完成情况，因为众包任务是否被领取还受到周边任务竞争、会员数量、会员能力和空间距离的共同影响。
  - 避免把经纬度差直接当作平面距离，因为经纬度量纲与实际公里数不等价；论文通过地球球面坐标和球面距离公式换算实际距离。
  - 避免只从企业成本角度压低价格，因为过低定价会降低任务吸引力和完成率；双目标模型同时约束成本与任务完成效果。
  - 避免假设平台可直接把任务分配给会员，因为实际机制是会员主动选择任务；模型通过最大吸引准则、竞争准则、信誉优先和时间顺序还原预订过程。
  - 避免任务打包后继续沿用单任务的距离和吸引度参数，因为打包会改变会员执行成本和任务吸引力，必须重新计算距离矩阵、吸引度矩阵及吸引阈值。
  - 避免一次聚类产生超过会员可执行规模的大任务包，因为仅保证位置接近并不能保证任务包可操作；对任务数超过15的簇进行二次聚类以满足容量上限。
  - 避免将网格内会员能力总和误称为平均完成能力，因为两者会对会员密集区域产生不同尺度效应；实现时应以能力总和除以有效会员数，并处理无会员网格。
  - 避免混用小数与百分数表示完成率，因为“0.9091%”与“90.91%”含义相差100倍；方案比较前应统一指标定义、单位和基准口径。
  - 避免直接用全部历史样本训练并评价BP神经网络，因为这会高估新项目预测能力；应划分训练集、验证集和测试集，或采用交叉验证与早停机制。
  innovation_points:
  - 将供求关系转化为网格任务数、会员数、会员完成能力和聚类中心距离四类可计算空间指标，实现定价规律由定性观察到定量关联分析的衔接。
  - 从会员主动选择任务的行为机制出发构造吸引度矩阵，并把信誉优先、预订时间和预订限额等平台规则嵌入双目标优化约束。
  - 采用二次嵌套聚类同时保证任务包的地理集中性和数量上限，并针对打包结果动态更新距离、吸引度与阈值。
  - 将历史双目标优化结果作为监督学习标签，利用BP神经网络把已求解项目的定价机制迁移到仅有位置信息的新项目。
  - 通过完成与未完成任务的灰色关联矩阵差异识别失败原因，使影响因素分析不仅服务于解释定价，也直接服务于后续优化模型设计。
- id: 2023_A175
  source_paper: 2023 2023_A175
  problem_type: 仿真+优化
  keywords:
  - 锥形光束追迹
  - 光学效率
  - 蜂窝排列优化
  context: 在太阳能塔式热发电场景下，计算定日镜场的光学效率与输出热功率，并优化吸收塔位置、定日镜尺寸、高度、数量及布局以提高单位镜面面积年平均输出热功率。
  models:
  - name: 太阳位置计算模型
    role: 根据日期、当地时间、纬度和太阳赤纬角计算太阳高度角、太阳方位角及入射主光线方向。
    why: 定日镜姿态、余弦损失和阴影遮挡均随太阳位置变化，必须先确定离散代表时刻下的太阳入射方向。
  - name: 定日镜反射与法向量模型
    role: 令经过定日镜中心的主反射光线指向集热器中心，利用反射定律求取镜面法向量、俯仰角和方位角。
    why: 该控制策略能够使中心光线准确到达集热器，并为镜面姿态调整和后续光线追迹提供几何基础。
  - name: 多坐标系旋转变换模型
    role: 建立镜场大地坐标系、镜面坐标系和光锥坐标系，并通过欧拉角旋转矩阵完成点和方向向量的统一转换。
    why: 遮挡判断、镜面边界判断和集热器截断判断分别适合在不同坐标系中计算，统一变换可降低空间几何计算难度。
  - name: 锥形光束离散追迹模型
    role: 将具有太阳张角的入射光和反射光表示为以主光线为轴的光锥，并对镜面采样点和锥面方向进行网格化追迹。
    why: 太阳光并非理想平行光，只追踪中心光线会低估光斑扩散、局部遮挡和集热器截断损失。
  - name: 阴影遮挡效率模型
    role: 依次判断塔身阴影、其他定日镜对入射光的遮挡以及其他定日镜对反射光的遮挡，并统计未损失光线比例。
    why: 阴影和遮挡是镜场光学效率的重要损失来源，分层判定能够体现不同损失机制并避免重复计损。
  - name: 集热器截断效率模型
    role: 判断成功反射的离散光线是否与集热器有效接收区域相交，以接收光线比例计算截断效率。
    why: 受太阳张角、镜面位置和反射方向误差影响，并非所有反射能量都能到达集热器，需要显式描述光斑溢出损失。
  - name: 定日镜场光学效率与热功率模型
    role: 综合阴影遮挡效率、余弦效率、大气透射率、集热器截断效率和镜面反射率，计算时刻效率、年平均效率、年平均热功率及单位面积热功率。
    why: 该模型将几何光学仿真结果转化为可比较的工程性能指标，并构成优化模型的目标函数和功率约束。
  - name: 蜂窝排列布局模型
    role: 按给定镜面宽度和安全间距在圆形场地内生成定日镜数量与位置，并通过整体旋转角调整布局方向。
    why: 蜂窝排列具有较高空间填充效率，可自动满足相邻底座中心距离约束，并显著降低逐镜位置优化的维数。
  - name: 蒙特卡洛抽样与遍历寻优模型
    role: 随机抽取部分定日镜近似评估候选布局，再遍历镜面尺寸、安装高度、吸收塔坐标和蜂窝旋转角等变量寻找较优方案。
    why: 完整光线追迹计算量大，而决策变量同时包含连续变量和离散布局变量，抽样粗筛结合遍历精算可兼顾效率与可实施性。
  - name: 分层高度调整模型
    role: 以统一尺寸和高度的优化结果为基准，对外围定日镜安装高度进行局部调整，以处理允许镜面参数不一致的扩展问题。
    why: 直接优化每面定日镜的尺寸和高度会导致超高维组合优化，基于已有方案分区调整能够降低求解复杂度。
  solution_flow: 输入场地、吸收塔、集热器、DNI及每月21日五个代表时刻等数据→计算太阳高度角、方位角和入射方向→根据定日镜中心至集热器中心的方向确定反射主光线及镜面法向→建立大地、镜面和光锥坐标系及旋转矩阵→按镜面步长和光锥角度离散生成光线→依次判断塔身阴影、入射遮挡、反射遮挡和集热器接收情况→结合余弦效率、大气透射率和反射率计算各时刻光学效率与热功率→对代表时刻求年平均指标→采用蜂窝排列生成可行布局，利用蒙特卡洛抽样粗筛并遍历镜面尺寸、高度、塔位和旋转角→在额定年平均输出热功率、镜面尺寸、安装高度、镜间距和场地半径约束下最大化单位镜面面积年平均输出热功率→通过全量复算、约束检查和离散步长敏感性分析验证结果。
  validation: 首先对候选最优方案进行完整光线追迹复算，核验年平均输出热功率是否达到额定功率，并检查镜面尺寸、安装高度、相邻镜间距和圆形场地边界等约束；其次改变镜面采样步长τ，比较年平均光学效率、总热功率和单位面积热功率的变化，以检验网格离散结果的稳定性；同时利用太阳方位变化、反射光指向集热器中心及各效率位于0到1之间等几何和物理规律进行合理性校验。
  visualization:
  - 镜场大地坐标系与吸收塔位置示意图
  - 太阳高度角和方位角示意图
  - 定日镜俯仰角与方位角示意图
  - 镜面坐标系和光锥坐标系示意图
  - 塔身阴影及镜间遮挡光路图
  - 定日镜蜂窝布局散点图
  - 不同月份与时刻的光学效率曲线图
  - 采样步长敏感性折线图
  pitfalls_avoided:
  - 避免直接由反三角函数确定太阳方位角，因为反余弦无法区分上午和下午象限；模型按当地时间对方位角正弦符号分类，防止入射方向出现东西颠倒。
  - 避免把太阳光完全视为平行光，因为太阳具有约4.65 mrad的张角；采用锥形光束离散追迹，可更准确估计光斑扩散、局部遮挡和截断损失。
  - 避免在不同坐标系中直接混用点和方向向量，因为镜面边界和遮挡交点的判定会因此失真；模型用旋转矩阵及平移统一完成大地坐标系、镜面坐标系和光锥坐标系之间的转换。
  - 避免对同一条光线重复计算多类遮挡损失，因为已被塔身挡住的光线不应再次计入镜间入射或反射遮挡；模型按照塔身遮挡、入射遮挡、反射遮挡的顺序进行短路判定。
  - 避免只检查直线与镜面平面是否相交，因为交点可能位于有限镜面之外或在光线反方向；模型进一步检查交点是否落在镜面长宽边界内，并结合高度或传播方向筛除无效交点。
  - 避免直接对每面定日镜的位置、尺寸和高度进行全维连续优化，因为变量规模巨大且单次光线追迹成本高；采用蜂窝参数化布局、蒙特卡洛抽样粗筛和分步遍历降低计算量。
  - 避免仅最大化镜场总输出功率，因为单纯增加镜面数量即可提高总功率但可能降低土地和镜面利用效率；模型在满足额定功率的前提下最大化单位镜面面积年平均输出热功率。
  innovation_points:
  - 将太阳光表示为锥形光束，并同时在镜面位置和光锥方向上进行离散追迹，使阴影遮挡和集热器截断计算比单一中心光线模型更精细。
  - 建立大地、镜面和光锥三套坐标系，通过统一旋转矩阵把复杂空间相交问题转化为镜面局部坐标系中的平面边界判断。
  - 将塔身阴影、入射镜间遮挡和反射镜间遮挡拆分为具有先后逻辑的三级0-1判定，提高损失归因的清晰度并避免重复计数。
  - 以蜂窝排列和整体旋转角参数化镜场位置，将高维逐镜布局问题压缩为少量结构参数，同时自然兼顾镜间距和圆形场地约束。
  - 采用蒙特卡洛抽样进行候选方案粗评估，再用完整模型复算较优方案，实现高成本光线追迹与多参数优化之间的计算折中。
- id: 2017_B353
  source_paper: 2017 2017_B353
  problem_type: 分类聚类+统计分析+优化+仿真
  keywords:
  - FCM聚类
  - 中心梯度定价
  - 时空效率定价
  - 任务匹配优化
  - 多阶段轮盘赌算法
  - 任务打包
  - 歧视激励定价
  context: 针对“拍照赚钱”移动众包平台，利用任务位置、价格、完成状态及会员位置、信誉、配额和预订时间等数据，分析原有定价规律并优化任务定价、匹配与打包发布策略。
  models:
  - name: FCM地理中心聚类模型
    role: 根据任务经纬度的空间聚集特征识别定价中心，并将任务划分到佛山、广州、番禺、东莞、宝安和龙华等六个空间簇。
    why: 任务点没有明确类别标签且不同城市辐射范围边界模糊，FCM可用隶属度表达任务对多个中心的归属程度，比硬聚类更适合处理模糊空间边界。
  - name: 地理中心梯度线性定价模型
    role: 分别拟合各空间簇内任务价格与任务到聚类中心距离之间的线性关系，量化平台原有的中心辐射式梯度定价规律。
    why: 空间可视化显示价格随任务到城市中心距离增加而上升，且各聚类中心内距离与价格具有较强的一次线性关系，适合采用一元线性回归估计定价参数。
  - name: 时空效率定价模型
    role: 综合任务与会员的距离、近邻会员密度、会员信誉等级、时空高效与可抵范围以及地区经济发展水平，对单个任务重新定价。
    why: 任务能否完成不仅取决于原始价格，还受到会员到达时间、周围可用会员数量、会员履约能力和地区机会成本影响，多维定价比单一距离定价更能反映真实供需条件。
  - name: 任务匹配规划模型
    role: 以平台总定价提升比例尽可能小、成功执行任务数尽可能大为目标，在单任务至多匹配一名会员、会员任务配额和匹配后可能不执行等约束下优化任务分配。
    why: 任务与会员之间属于带容量限制和履约不确定性的多对一匹配问题，需要用0-1决策变量同时描述任务归属、会员容量和平台成本效益。
  - name: 二维多阶段轮盘赌任务匹配算法
    role: 先在时空高效距离内匹配会员，再扩展到时空可抵距离，并依据会员预订开始时间、任务配额和信誉相关概率分阶段完成任务分配。
    why: 高效集与可抵集可显著缩小每个任务的候选会员范围，轮盘赌机制能够表达会员被选中的概率差异，并降低相较全局遍历的计算复杂度。
  - name: 区域任务打包供需平衡模型
    role: 针对空间位置集中的多个任务确定合理打包规模，并得到最优打包任务数为3、可分析区间为2至5。
    why: 集中任务联合发布能够摊薄会员出行成本，但打包过大会提高执行负担，因此需要从区域任务供给和会员承接能力之间寻找平衡。
  - name: 会员信誉等级定价模型
    role: 在打包发布模式下根据会员信誉等级调整价格或中选概率，使高信誉会员更容易获得打包任务。
    why: 打包任务包含多个子任务，违约造成的损失高于单任务，提高高信誉会员的匹配权重能够降低整包未完成风险。
  - name: 歧视激励定价模型
    role: 面向新项目供大于求且高度聚集的特征，提高对高信誉会员的价格激励，同时为低信誉会员设置保留价格和准入门槛。
    why: 统一定价无法区分不同信誉会员的履约质量，在供给充足时实施差异化激励和准入控制，可将任务优先配置给高质量会员并减少低信誉违约。
  solution_flow: 导入任务与会员数据并进行经纬度空间可视化和数据规范化→观察价格、完成状态与空间位置的分布规律→使用FCM识别六个地理定价中心→在各簇内对中心距离与价格进行一元线性回归，提取原定价规律→划分会员信誉等级并按时空高效距离、时空可抵距离构建候选会员集→引入经济发展系数建立时空效率定价模型→建立带任务唯一匹配、会员配额和履约概率约束的任务匹配规划模型→使用二维多阶段轮盘赌算法进行仿真匹配→通过供需平衡确定任务打包规模，并加入信誉等级定价→针对新项目建立歧视激励定价方案→比较原方案、重新定价方案、打包方案及歧视激励方案的任务完成率和成本表现。
  validation: 先通过地图专题图检验价格和未完成任务的空间分布特征；再使用Calinski-Harabasz指标和Davies-Bouldin指标检验六类FCM聚类的紧密度与分离度；利用各城市距离—价格回归的拟合优度检验中心梯度定价关系，文中各线性拟合相关指标均在0.90以上；最后在历史项目和新项目上开展对照仿真，以任务完成率及平台定价提升为指标比较方案效果，时空效率定价较原方案额外完成20.2%的未完成任务，打包模式较不打包模式提升6.5%，新项目中信誉等级定价和歧视激励定价的完成率分别为34.7%和46.9%。
  visualization:
  - 任务价格空间专题分布图
  - 任务完成状态空间分布图
  - FCM聚类位点图
  - 各聚类中心距离—价格散点图及线性回归图
  - 会员信誉度分级趋势图
  - 任务—会员匹配机制示意图
  - 时空高效距离与可抵距离示意图
  - 不同定价及打包方案完成率对比图
  pitfalls_avoided:
  - 避免直接按行政区或主观边界划分类别：任务点没有明确标签且城市辐射边界模糊，采用FCM隶属度聚类可减少硬划分造成的边界误判。
  - 避免只凭地图观察确定聚类数：对六聚类结果进一步使用CH和DB内部指标评价，防止主观选取中心数量导致类内松散或类间重叠。
  - 避免使用统一的全区域距离定价函数：不同城市经济水平和价格梯度存在差异，分别对六个聚类中心拟合参数并加入经济发展系数，可降低区域异质性带来的偏差。
  - 避免距离和信誉指标量纲不一致直接进入定价公式：对会员—任务距离进行均值方差标准化，并将信誉度分级量化，防止量纲和极端值主导价格计算。
  - 避免只考虑任务价格而忽视供给侧条件：同时纳入任务附近会员数量、信誉等级、预订开始时间和配额，否则高价任务仍可能因缺少可用会员而无法完成。
  - 避免对所有会员进行全局暴力匹配：按时空高效范围和可抵范围构造规模更小的候选集，可降低计算复杂度并符合会员优先承接近距离任务的行为。
  - 避免认为任务匹配成功就必然执行：模型显式区分匹配和成功执行，并加入履约概率约束，防止高估任务完成率。
  - 避免打包规模越大越好的错误假设：打包虽可降低出行成本，但过大任务包会超过会员容量并增加整包违约风险，因此通过供需平衡确定最优规模为3。
  - 避免在供大于求场景下继续采用无差别定价：对高信誉会员实施激励、对低信誉会员设置保留价格和准入门槛，可减少平台为低质量供给支付无效成本。
  innovation_points:
  - 将FCM空间聚类与分区域线性回归结合，形成“地理中心识别—距离梯度拟合”的原始定价规律提取框架。
  - 提出同时融合时间距离、空间会员聚集、信誉效率和区域经济水平的时空效率定价模型。
  - 构造时空高效集与时空可抵集，并设计二维多阶段轮盘赌算法，实现由近及远、受配额和预订时间约束的概率匹配。
  - 将任务联合打包规模选择与会员信誉等级定价结合，在降低集中任务出行成本的同时控制打包违约风险。
  - 针对新项目供大于求和高聚集特征引入歧视激励机制，通过高信誉激励与低信誉准入门槛并行提升任务完成质量。
- id: 唐隽玉，胡文伟，孙雪清_唐隽玉，孙雪清，胡文伟
  source_paper: 唐隽玉，胡文伟，孙雪清 唐隽玉，胡文伟，孙雪清_唐隽玉，孙雪清，胡文伟
  problem_type: 分类聚类+优化
  keywords:
  - 边界灰度匹配
  - 特征匹配聚类
  - 双面一致性约束
  context: 针对司法物证、历史文献和军事情报中的碎纸片复原需求，对单面纵切、单面横纵切及双面横纵切文件进行自动拼接与排序。
  models:
  - name: 图像灰度二值化模型
    role: 将碎片图像转换为灰度矩阵和0-1矩阵，为边界及行特征的数值比较提供统一数据基础。
    why: 原始BMP图像不能直接参与数学运算，二值化既能突出文字与背景差异，又可避免灰度运算中的数值溢出并降低计算复杂度。
  - name: 左右边界匹配模型
    role: 计算一张碎片右边界与其他碎片左边界的差异度，以确定同一图片行内碎片的左右邻接关系和排列顺序。
    why: 规则纵切后，相邻碎片边缘通常来自同一汉字或英文字母，其对应像素差异较小，边界绝对差之和可作为邻接代价。
  - name: 行特征匹配聚类模型
    role: 提取碎片前100个像素行构成特征列向量，并依据特征差异将横纵切碎片聚合为若干图片行。
    why: 横向切割导致碎片同时存在行、列位置无序，先依据文字在同一行中的相似垂直位置进行聚类，可显著缩小后续排序的搜索空间。
  - name: 上下边界匹配模型
    role: 对已经完成行内拼接的图片行计算上下边界差异，从而确定各图片行在原文件中的纵向顺序。
    why: 规则横切产生的相邻图片行在上下边缘具有文字笔画和背景灰度连续性，可将左右边界匹配思想推广至纵向排序。
  - name: 两层筛选拼接模型
    role: 先通过行特征聚类与左右匹配完成行内复原，再通过上下匹配完成行间排序，形成完整页面。
    why: 将二维全局排列分解为行归类、行内排序和行间排序，可减少候选匹配数量，缓解单一边界指标因约束不足而产生的一对多匹配。
  - name: 双面两次特征匹配模型
    role: 先匹配两张碎片的一面，再用两张碎片的另一面进行一致性复核，据此完成双面碎片的分面、聚类和拼接。
    why: 双面碎片的单面外观与单面打印情形相似，仅靠一面容易出现多重匹配或将同一碎片正反面误归一类；加入反面匹配可提供额外的物理一致性约束。
  solution_flow: 数据：读取BMP碎片并构建灰度矩阵，阈值二值化后提取左右边界、上下边界及前100个像素行特征；模型：纵切问题采用左右边界匹配，横纵切问题采用行特征聚类、行内左右匹配和行间上下匹配，双面问题增加正反面两次匹配约束；参数：以255为二值化阈值，以前100个像素行为行特征，以对应边界像素绝对差之和作为匹配代价，并利用每页11行、每行19片等数量约束辅助聚类；求解：遍历候选碎片，选择匹配代价最小的邻接关系，逐步构造行内序列和行间序列，必要时人工合并类别并排除冲突；验证：将序列拼接成完整图像，通过边缘笔画连续性、文字语义连贯性及自动结果与人工校正结果的正确率进行检验。
  validation: 首先将最终序列生成复原图，人工检查碎片交界处字迹断线是否连续以及文本语义是否通顺；其次把人工干预后的结果视为基准答案，对未干预的自动排序进行准确率检验，论文报告中文拼接正确率为90.4%、英文为65.1%；双面问题则通过正面候选匹配与反面复核是否同时成立来进行交叉一致性验证。
  visualization:
  - 碎片拼接复原图
  - 碎片编号排列顺序表
  - 邻接关系与边界匹配值表
  pitfalls_avoided:
  - 避免直接使用碎片外轮廓形状匹配，因为题目中的碎片均为规则矩形且切割边缘光滑，外轮廓缺乏区分度。
  - 避免采用图像重叠度进行匹配，因为规则切割后的相邻碎片没有重叠区域，重合度指标不能有效识别邻接关系。
  - 避免直接在无符号灰度数据上进行减法和绝对值累加，因为MATLAB可能将计算结果限制在0至255范围内而造成溢出或截断；先二值化可保证差异计算稳定。
  - 避免仅用左右边界一次性处理横纵切碎片，因为二维无序会导致定位约束不足，并出现一个碎片对应多个相同或近似最优候选；先按行特征聚类可降低歧义。
  - 避免机械地认为编号后缀a或b分别固定属于同一纸面，因为扫描编号不必然代表物理正反面；应通过双面一致性匹配确定所属页面。
  - 避免只根据双面碎片的一面进行归类，因为可能把同一碎片的正反面归入同一行或产生过多候选；必须利用另一面进行二次复核。
  - 避免忽略聚类后各行碎片数量约束，因为纯特征聚类可能形成15类或16类且类内数量不一致；结合原页面行列规模进行人工合并可消除明显错误类别。
  innovation_points:
  - 提出由行位置筛选与列位置筛选组成的两层拼接框架，将复杂二维复原分解为行特征聚类、行内左右排序和行间上下排序。
  - 将双面碎片的正反面视为成对约束，通过一面初匹配、另一面再验证的两次特征匹配机制提高匹配唯一性和可靠性。
  - 把灰度图像、边界像素和文字行位置统一转换为可计算的矩阵与特征向量，实现图像复原问题的定量化。
  - 采用计算机自动匹配与人工定点干预相结合的策略，仅在聚类类别数量或类内碎片数不符合页面结构时介入，兼顾复原效率与准确率。
- id: 1C2302_成都工业学院 专5 C 肖瑜琳 刘新燕 黄龙
  source_paper: 1C2302 1C2302_成都工业学院 专5 C 肖瑜琳 刘新燕 黄龙
  problem_type: 统计分析+优化+预测
  keywords:
  - 最小二乘拟合
  - 空间曲线曲率与坐标变换
  - 灰色预测
  context: 根据古塔四次三维测绘数据确定各层中心位置，量化倾斜、弯曲和扭曲变形，并预测其未来变化趋势。
  models:
  - name: 最小二乘平面拟合模型
    role: 分别拟合每次测量中各层观测点所在的近似平面，为中心点求解提供几何约束。
    why: 同层观测点理论上近似共面，但受测量误差和局部变形影响存在偏差，最小二乘法可利用全部观测点获得整体残差平方和最小的稳定平面。
  - name: 平面约束下的最小距离平方和优化模型
    role: 在各层拟合平面内寻找与该层全部观测点距离平方和最小的点，并将其定义为该层中心。
    why: 古塔各层观测点近似对称分布，距离平方和最小点能够综合利用所有测点，避免直接选取单点或简单配对中点造成较大误差。
  - name: 倾斜角几何度量模型
    role: 通过塔尖中心与底层中心的水平偏移量和塔高计算倾斜角，量化古塔整体倾斜程度。
    why: 倾斜本质上是不同高度中心点相对底部的水平偏移，采用tan(α)=d/H可消除塔高尺度影响，并具有明确的工程几何意义。
  - name: 二次空间曲线拟合与曲率模型
    role: 以高度为参数拟合各层中心点构成的空间轴线，并利用空间曲线曲率刻画古塔的弯曲程度。
    why: 弯曲是塔身中心轴线偏离直线的连续变化，空间曲线曲率比单层水平位移更能反映不同高度处的局部弯曲特征。
  - name: 平移补偿下的二维坐标旋转变换模型
    role: 比较相邻测量时刻同层固定观测点的水平坐标，在消除平移影响后估计旋转角，并以平均旋转角描述各层相对扭曲度。
    why: 扭曲主要体现为水平截面的旋转，仅比较坐标差会混入整体平移；坐标旋转变换能够将平移与旋转效应分离。
  - name: GM(1,1)灰色预测模型
    role: 分别对倾斜角、弯曲率和相对扭曲度等少样本时间序列建立预测函数，分析未来变形趋势。
    why: 测量仅有四个时点，传统大样本统计预测难以可靠估计参数，而灰色模型适用于信息不完全、样本量较少且趋势较明显的序列。
  solution_flow: 读取四期三维测点数据→根据相邻楼层对应测点变化规律补全第十三层缺失值，并将单点塔尖近似作为塔尖中心→对每层测点进行最小二乘平面拟合，得到平面参数A、B、C→在拟合平面约束下最小化测点距离平方和，求出各层及塔尖中心坐标→由塔尖和底层中心计算塔高、水平偏移及倾斜角→以高度为参数拟合中心轴线并计算空间曲率→通过水平坐标平移与旋转变换估计各层相对扭曲角→将各期变形指标输入GM(1,1)模型，完成累加生成、参数估计和趋势预测→结合拟合残差、灰色预测误差检验及图形结果验证合理性。
  validation: 中心位置模型通过观察同层测点的近似共面性和对称性，并检查拟合平面及距离平方和优化结果的几何合理性进行验证；空间轴线通过中心点三维分布与拟合曲线的一致性进行检验；灰色预测模型对倾斜角、弯曲率和扭曲度序列执行拟合误差检验，以判断预测精度和模型可靠性。由于原始时间点仅有四个，验证应侧重回代拟合误差与工程量级合理性，不宜依赖大规模训练集与测试集划分。
  visualization:
  - 各层观测点三维散点图及拟合平面图
  - 各层中心点三维分布与空间轴线拟合图
  - 倾斜角、弯曲率和扭曲度随时间变化及灰色预测趋势图
  pitfalls_avoided:
  - 避免直接对同层测点坐标取算术平均作为中心：观测点存在非共面偏差，且三维均值未必落在该层的实际截面平面上，因此先拟合平面再进行约束优化。
  - 避免因第十三层缺失一个测点而直接用不完整点集求中心：测点分布不对称会使距离平方和中心产生系统偏移，因此依据相邻楼层对应测点的坐标增量补全数据。
  - 避免将整体水平位移误判为扭曲：两期坐标变化同时包含平移和旋转，若直接用方位角差会混淆变形机制，因此在旋转变换中同时估计水平平移量。
  - 避免用单层偏移量代表整体弯曲：局部位移会受整体倾斜影响，不能反映轴线形状，因此拟合全部楼层中心形成空间曲线并用曲率刻画弯曲。
  - 避免在仅有四期数据时使用参数过多的复杂时间序列模型：小样本容易导致过拟合和参数不稳定，因此采用适合少数据、弱信息系统的GM(1,1)模型。
  innovation_points:
  - 构建“平面拟合—约束优化”的两阶段中心定位方法，将测点共面结构和截面对称结构同时纳入中心估计。
  - 将工程概念转化为可计算指标：用塔尖相对底层的倾斜角描述整体倾斜，用中心轴线的空间曲率描述弯曲，用平移补偿后的水平旋转角描述扭曲。
  - 将三维几何建模与小样本灰色预测结合，实现从中心识别、变形分解到未来趋势预测的一体化分析。
- id: B题_B1920
  source_paper: B题 B题_B1920
  problem_type: 统计分析+综合评价+优化
  keywords:
  - 数据挖掘
  - 多元线性回归
  - 满意度评价
  - 多目标规划
  - 模拟退火
  - 灵敏度分析
  context: 基于我国高校经费、家庭收入和教育收益等数据，分析不同学校及专业的现行学费规律，评价其合理性并寻求兼顾学生、学校和政府利益的最优学费标准。
  models:
  - name: 学费规律模型（多元线性回归模型）
    role: 刻画一本、二本高校现行学费与生均事业性经费支出、财政拨款比例、非学费收入比例及地区经济水平之间的关系，并估计不同学校和专业的学费。
    why: 学费受到多个可量化因素共同影响，多元线性回归既能估计各因素的边际作用，也便于解释当前学费标准的形成规律。
  - name: 专业差异修正模型
    role: 在学校类别回归结果上增加专业学费差异常数项，得到理工、文科、医科、外语和艺术等专业的差异化学费。
    why: 基础回归使用生均数据，无法直接体现专业培养成本差异；采用常数修正可以在数据有限时简洁地补充专业异质性。
  - name: 学费综合评价模型
    role: 将近期满意度与远期满意度综合起来，对现行学费及优化后的学费标准进行评价。
    why: 学费合理性不能由单一成本指标决定，需要同时衡量学生、学校、政府的当前利益以及个人和社会的长期教育收益。
  - name: 近期满意度动态加权模型
    role: 综合学生近期满意度、学校近期满意度和政府近期满意度，衡量各利益主体对学费标准的短期接受程度。
    why: 学生关注支付能力和教育性价比，学校关注经费保障，政府关注财政负担；动态加权能够减少只偏向某一主体造成的评价失真。
  - name: 高校教学质量—经费 Logistic 模型
    role: 描述教育经费投入增加对高校教学质量的非线性提升作用，并用于构造教育性价比与满意度指标。
    why: 教学质量随经费增加通常先快速改善、后趋于饱和，Logistic 曲线比简单线性关系更符合边际效益递减规律。
  - name: 个人收益率与社会收益率模型
    role: 分别估计学生接受高等教育的长期经济回报和高等教育带来的社会长期收益，构成远期满意度指标。
    why: 高等教育具有个人受益和社会受益双重属性，依据经济学收益率理论建模可以为学生与政府的成本分担提供长期依据。
  - name: 学费寻优模型（多目标规划模型）
    role: 以学生、学校、政府的满意度以及近期利益和远期收益为多个目标，求取综合意义下的最优学费。
    why: 各利益主体的目标相互冲突，无法仅通过单目标极值确定合理学费，多目标规划适合处理公平性、可负担性与办学质量之间的权衡。
  - name: 模拟退火求解模型
    role: 对学费多目标规划进行全局近似搜索，获得最优或近优学费方案。
    why: 综合满意度中包含非线性关系且可能存在多个局部最优，模拟退火具有跳出局部极值、适应复杂搜索空间的能力。
  - name: 学费控制模型
    role: 结合最优学费及其灵敏度分析结果，给出便于有关部门实施的学费调控区间和控制依据。
    why: 最优学费会随财政投入、家庭收入和办学成本变化，控制模型能把一次性最优解转化为可动态调整的政策工具。
  solution_flow: 收集2002、2003、2004、2006年教育经费、学校收支、生均支出、居民收入及地区经济数据→进行数据审查、清理、转换、缺失与异常处理→按一本、二本及专业类别整理数据→建立多元线性回归模型并估计参数，提取现行学费形成规律→增加专业差异常数项得到分类学费→构造学生、学校、政府近期满意度以及个人、社会远期收益率，形成综合评价模型→评价现行学费→建立兼顾多主体和长短期利益的多目标规划→使用模拟退火搜索最优学费→将优化结果代回评价模型比较满意度→开展灵敏度分析并建立学费控制模型。
  validation: 首先利用回归模型的F检验判断整体显著性，并结合相关系数和回归系数方向检验经济含义；其次将现行学费和多目标优化学费分别代入综合评价模型，比较优化前后的满意度，检验优化方案是否确有改进；最后改变关键参数进行灵敏度分析，考察最优学费及综合满意度的波动，以验证模型的稳定性和政策结论的稳健性。
  visualization:
  - 不同学校类别历年平均学费折线图
  - 不同专业平均学费对比柱状图
  - 学费评价系统层次关系图
  - 四模型求解流程图
  - 回归拟合与残差诊断图
  - 参数灵敏度曲线图
  pitfalls_avoided:
  - 避免直接填补缺失严重的2005年教育经费数据，因为缺乏可靠依据的插补会引入系统偏差；论文选择跳过该年份并在模型与分析中作相应处理。
  - 避免在二本高校回归中同时直接加入人均GDP和生均事业性经费支出，因为二者相关系数达到0.81，容易造成多重共线性；改用生均事业性经费支出与人均GDP之比作为指数变量。
  - 避免把一本和二本高校混合回归，因为二者财政来源、经费水平及学费与地区经济发展的相关性不同；分别建模可以降低结构异质性造成的参数偏误。
  - 避免只用教育成本或家庭收入单指标判断学费合理性，因为这会忽略学校办学质量、政府财政责任及长期教育收益；评价体系同时纳入三方主体和近期、远期指标。
  - 避免仅依据平均生均学费推断所有专业标准，因为艺术、理工、文科等专业培养成本明显不同；通过专业差异常数项对基础回归结果进行修正。
  - 避免使用局部优化方法直接求解非线性多目标问题，因为综合满意度函数可能存在多个局部极值；采用模拟退火提高获得全局近优解的可能性。
  - 避免只报告单个最优学费点而忽略参数不确定性，因为财政拨款、家庭收入和培养成本会发生变化；通过灵敏度分析确定模型稳定性并支持后续动态控制。
  innovation_points:
  - 构建同时包含近期满意度和远期满意度的学费综合评价体系，将学生、学校、政府三方利益与个人、社会长期收益统一到同一框架中。
  - 采用动态加权思想协调不同利益主体的满意度，增强评价结果的公平性和政策适用性。
  - 利用Logistic模型刻画经费投入与教学质量之间的饱和增长关系，使教育性价比评价更符合边际效益递减规律。
  - 将个人收益率和社会收益率引入学费评价，为政府与学生之间的高等教育成本分担提供经济学依据。
  - 将多目标规划与模拟退火算法结合，在多主体、长短期目标冲突下搜索综合最优学费。
  - 根据灵敏度分析进一步提出学费控制模型，使静态最优结果能够转化为可随经济和财政条件调整的动态政策方案。
- id: 2018_D027
  source_paper: 2018 2018_D027
  problem_type: 优化
  keywords:
  - 汽车装配排序
  - 生产成本优化
  - 有向图路径搜索
  - 遗传算法
  - TSP问题
  context: 在满足品牌班次顺序、特殊车型间隔、颜色连续性及喷涂线分配等工艺约束的条件下，优化每日460辆多属性汽车的总装与喷涂顺序，以降低配置和颜色切换成本。
  models:
  - name: 分阶段分解排序模型
    role: 将原始大规模车辆排列问题依次分解为黑色车辆预排、四驱与柴油车辆定位、白色与棕色车辆连续配置以及剩余复杂颜色车辆路径搜索。
    why: 460辆汽车的全排列搜索空间达到460!，直接求解不可行；利用黑色车辆成批、白色和棕色易连续、其他颜色数量少的结构特征，可显著缩小搜索规模。
  - name: 基于0-1变量的生产成本最小化优化模型
    role: 使用二元变量表示各位置是否为黑色、四驱或柴油车辆，在满足车型数量、连续装配上限和批次间隔约束的条件下，优化四驱与柴油车辆的位置并最小化间隔惩罚成本。
    why: 车辆属性和位置状态天然适合用0-1变量表达，滑动窗口约束可刻画连续数量不超过2辆以及批次间至少间隔5辆或尽量达到10辆的要求。
  - name: 加权切换成本模型
    role: 统一计算同品牌内配置切换、喷涂线颜色切换、黑色与其他颜色切换以及特殊车型间隔不足产生的代价。
    why: 不同工艺违约或切换的严重程度不同，普通配置与颜色切换赋权1、黑色切换赋权10、间隔不足赋予10-k的惩罚，可将多类生产要求转化为可比较的优化目标。
  - name: 有向图邻接矩阵模型
    role: 将剩余未排序车辆视为顶点，将满足颜色衔接规则的前后关系视为有向边，把残余排序问题转化为指定起点和终点的图遍历问题。
    why: 后期剩余车辆数量较少但颜色衔接规则复杂，使用邻接矩阵能够直接编码允许、禁止及不同代价的转移关系，比继续处理完整排列更清晰高效。
  - name: 基于遗传算法的TSP路径优化模型
    role: 在有向图中搜索覆盖剩余车辆的低成本排列路径，以减少配置和颜色切换代价。
    why: 残余问题具有访问各车辆顶点并优化访问顺序的TSP结构，遗传算法适合在组合搜索空间中快速获得较优路径。
  - name: 广度优先搜索路径枚举模型
    role: 搜索有向图中经过指定起点和终点且满足颜色衔接约束的候选路径，为后续喷涂线可行性检查和成本比较提供方案集。
    why: 剩余顶点规模已经通过前序分解大幅降低，广度优先搜索能够系统生成可行路径，降低遗漏满足工艺规则方案的风险。
  solution_flow: 数据：使用Python读取并规范化每日生产计划，以Excel建立生产计划表、每日装配顺序表及剩余数量联动校验；模型：按颜色和工艺特征分阶段求解，先固定黑色车辆区段，再建立0-1生产成本优化模型配置四驱与柴油车辆，随后连续填入白色、棕色等易衔接颜色，最后将剩余复杂颜色车辆构造成有向图；参数：设普通配置或颜色切换成本为1、黑色与其他颜色切换成本为10，特殊车型理想批次间隔为至少10辆、可接受下限为5辆，间隔不足成本为10-k；求解：结合人工初值、计算机优化搜索、遗传算法TSP和广度优先搜索生成候选顺序，并使用Matlab检查C1、C2喷涂线分配后选择总代价最小路径；验证：通过数量、车型属性、装配约束、喷涂线资格及总成本的多层校验，最终将可行低成本顺序写回Excel。
  validation: 采用数据与约束双重验证：Excel利用COUNTIFS将每日装配结果与生产计划逐车型核对，确保品牌、配置、动力、驱动和颜色组合的使用数量准确，并检查车辆是否按要求交替进入C1、C2喷涂线；Matlab逐条验证候选路径的颜色衔接、蓝黄红仅进入C1、金色仅进入C2、四驱和柴油连续数量及批次间隔等约束；同时重新计算配置切换、普通颜色切换、黑色高代价切换和间隔惩罚，对所有可行路径进行成本比较，并将晚班与次日白班的交界纳入连续性校验。
  visualization:
  - 每日汽车装配顺序示意图
  - 有向图邻接矩阵表
  - 生产计划与装配剩余数量联动表
  - 分项成本及总代价统计表
  pitfalls_avoided:
  - 避免直接对460辆汽车进行全排列搜索，因为搜索空间为460!，即使约束完整也难以在竞赛时间内获得结果；通过颜色分组、人工固定高结构区段和残余图搜索实现降维。
  - 避免将理想间隔要求全部设为不可违反的硬约束，因为部分日期的四驱或柴油车辆数量可能使间隔至少10辆无解；模型改用间隔至少5辆的硬下限和10-k软惩罚保持可行性。
  - 避免只优化单日内部顺序而忽略跨日连接，因为当日晚班末尾与次日白班开头同样可能形成特殊车型连续、间隔不足或颜色切换；因此将跨日交界纳入约束检查。
  - 避免只按颜色优化而产生车型数量或属性组合错误，因为同色车辆仍可能具有不同品牌、配置、动力和驱动；通过生产计划表与装配表的多属性COUNTIFS联动校验保证数量守恒。
  - 避免生成总装可行但喷涂不可行的顺序，因为蓝、黄、红只能进入C1而金色只能进入C2；对每条候选路径进一步模拟C1、C2分配并剔除不满足专线要求的路径。
  - 避免将黑色切换与普通颜色切换等价处理，因为黑色换色的实际成本显著更高；通过差异化权重促使黑色车辆形成50至70辆的连续批次并减少与其他颜色的切换。
  innovation_points:
  - 提出人工经验与算法协同的分阶段求解框架，先处理结构明显且高成本敏感的黑色车辆，再优化特殊动力和驱动属性，最后求解复杂残余子问题。
  - 将剩余车辆的颜色衔接规则转化为有向图邻接关系，把复杂排序问题转化为指定起终点的路径搜索问题，并结合遗传算法TSP与广度优先搜索求解。
  - 构建Python数据整理、Excel动态校验与Matlab路径验证相衔接的多工具工作流，使数据处理、人工调整、算法输出和结果复核形成闭环。
  - 采用硬约束与软惩罚结合的建模方式，在保证连续装配安全下限的同时，对无法完全达到理想间隔的情形进行分级处罚，提高模型的实际可行性。
- id: B_CHAPTER12
  source_paper: B B_CHAPTER12
  problem_type: 预测+仿真
  keywords:
  - 公交客流分配
  - 广义成本
  - 超级路径
  - 随机用户平衡
  - O-D矩阵
  context: 基于公交网络、车费与乘客O-D需求，预测乘客的路径选择以及各路线、路段和车站的客流分布。
  models:
  - name: 全有全无分配模型（AON）
    role: 将每个O-D对的全部需求分配到广义成本或总出行时间最小的单一路径上，作为基础方案和对照模型。
    why: 模型结构简单、计算速度快，适用于稀疏网络、城际公交或货运系统，也便于检查网络连通性和最短路径合理性。
  - name: Pathfinder路径搜索分配模型
    role: 以车内时间、候车时间、步行接驳、换乘处罚和车费构成的广义成本搜索超级路径，并按照服务频率在可选路线间分配客流。
    why: 能够处理车费、多个出入口、停车换乘、模式间换乘限制及选时换乘，兼顾传统方法的可解释性、计算效率和实际公交行为。
  - name: 随机用户平衡模型（SUE）
    role: 通过随机扰动路径成本、迭代最短路径加载和流量反馈，模拟乘客偏好差异、路线容量、拥挤以及多路径概率选择。
    why: 当网络中存在大量替代路径、快慢线路混合、容量约束或拥挤效应时，单一路径分配不符合实际，SUE能给出更稳定且行为合理的多路径流量。
  - name: 最优策略与超级路径模型
    role: 从目的地反向计算各节点的期望到达成本，将能够降低期望总成本的公交路段纳入超级路径，并模拟乘客在车站选择首先到达的可接受车辆。
    why: 适合描述重叠服务和乘客逐站决策行为，不要求候选路线完全重叠，比预先固定一条完整路径更符合高频公交环境。
  - name: 广义成本模型
    role: 将车内时间、候车时间、步行时间、换乘处罚、可靠性和车费统一换算为可比较的路径阻抗。
    why: 公交路径选择同时受到时间、费用和换乘不便的影响，使用时间价值将时间货币化后可统一比较不同服务方案。
  - name: 连续平均法（MSA）
    role: 在SUE迭代中对各轮分配流量进行加权平均，使路段客流和广义成本逐步收敛。
    why: 直接使用单轮随机加载结果容易产生较大波动，MSA能够降低迭代振荡并形成稳定的期望客流。
  solution_flow: 数据：整理公交路线与车站、网络拓扑、班次频率、运行时间、容量、车费结构、步行或驾车接驳网络、换乘规则及乘客O-D矩阵，并保证矩阵节点或车站ID与网络一致；模型：根据研究场景选择AON作为基准、Pathfinder作为常规多路径模型，或在存在明显偏好异质性、容量和拥挤影响时采用SUE；参数：设置各时间成分权重、时间价值、换乘处罚、最大换乘次数、最大等待时间、Pathfinder临界参数、随机误差分布与范围、容量及流量—成本函数；求解：计算入口和出口路径，构造广义成本，搜索最短路径或超级路径，按频率或概率加载O-D需求，SUE中依据流量更新成本并通过MSA迭代至收敛；验证：将预测的路段客流、路线客流、车站上下车量、换乘量和路径属性与车载调查及实际计数比较，校准权重和行为参数后再进行全网络分配。
  validation: 先检查公交网络、分区连接线、车站和换乘关系的连通性，再用站到站的小规模分配核验主要O-D间路径是否合理；利用车载调查、自动售检票数据和断面计数，对路线客流、车站上下车量、换乘量及走廊合计客流进行误差检验；对时间价值、候车权重、换乘处罚、最大等待时间、Pathfinder临界参数和SUE误差范围开展敏感性分析；SUE还需监测相邻迭代的流量变化或成本差距是否达到收敛阈值，并通过留出时段或独立调查数据进行样本外验证。
  visualization:
  - 公交路段客流比例符号图
  - 公交走廊客流分级设色图
  - 路线断面客流与容量曲线图
  - 车站上下车量柱状图
  - O-D关键路段流向矩阵热力图
  - 换乘关系桑基图
  - SUE迭代收敛曲线
  - 路径广义成本构成堆叠图
  pitfalls_avoided:
  - 避免在大城市复杂公交系统中直接使用AON，因为把全部O-D需求压到唯一最短路径会忽略多路径选择并造成局部客流严重高估。
  - 避免无条件合并不同模式或长车头时距服务，因为乘客往往会预先选择模式或按时刻表到站，合并频率会虚假降低等待时间并夸大服务吸引力。
  - 避免过度偏重班次频率，因为合并车头时距会偏向高频慢速线路，并可能低估低频快速直达线路的实际使用率。
  - 避免忽略容量和拥挤反馈，因为一次性静态分配可能使满载线路继续承接客流，并低估拥挤、滞站和乘车时间增加造成的服务水平下降。
  - 避免随意设置等待时间、步行时间和换乘处罚权重，因为路径本身由这些权重决定，未经行为调查校准会形成参数与路径选择相互依赖的偏差。
  - 避免设置不合理的最大等待时间，因为将低频线路的等待时间强行截断会使其表现得像高频线路，显著扭曲路线客流。
  - 避免在网络或参数发生变化后复用旧的路径集文件，因为路径集与当前车费、班次、连通性或阻抗不一致会直接导致错误分配。
  - 避免O-D矩阵ID与网络节点或车站ID不匹配，因为网络中不存在的行列将不会被分配，从而造成需求无故损失。
  - 避免忽略市场分割，因为不同乘客对步行、等待、费用和换乘的敏感程度不同，统一参数可能掩盖真实的路径偏好差异。
  - 避免将停车换乘乘客流直接视为车辆流，因为需要按平均车辆乘载率换算，否则会高估停车场周边道路交通量。
  innovation_points:
  - 将车费通过时间价值纳入广义成本，使路径分配能够同时支持客流预测、票价调整和公交收入评估。
  - 结合最优策略和主干线路思想构造可控规模的超级路径，并通过临界参数调节候选路线进入路径集的范围。
  - 将GIS步行网络和道路网络用于精细计算入口、出口及停车换乘接驳阻抗，突破仅依赖质心直连距离的简化假设。
  - 利用SUE的随机扰动、容量反馈和MSA迭代统一刻画乘客偏好异质性、多路径选择及拥挤效应。
  - 支持多个上车点、下车点及混合接驳方式，使大型分区和服务密集区域的客流分配更贴近实际。
  - 将停车换乘产生的驾驶流量反馈到道路交通分配，实现公交系统与道路拥挤之间的联动分析。
- id: 1A0902_基于差分方程和元胞自动机的交通阻塞模型
  source_paper: 1A0902 1A0902_基于差分方程和元胞自动机的交通阻塞模型
  problem_type: 统计分析+预测+仿真
  keywords:
  - 差分方程
  - 元胞自动机
  - 交通阻塞与道路通行能力
  context: 基于城市道路监控视频，研究不同车道占用事故对道路实际通行能力和车辆排队长度的影响，并预测排队队尾到达上游路口的时间。
  models:
  - name: 标准车当量与饱和流率统计模型
    role: 将不同车型统一折算为PCU，并利用事故期间道路饱和时段的断面流量估计事故状态下的实际通行能力。
    why: 不同车型占用道路资源的程度不同，直接按车辆数统计会产生偏差；饱和状态下的实测流率更接近道路在给定事故条件下的最大通行能力。
  - name: 交通流基本图模型
    role: 利用流量、密度和自由流速度之间的关系，估算无事故且视频中未出现饱和状态时的道路最大通行能力。
    why: 正常状态的视频流量没有达到饱和，无法直接由观测流量确定通行能力，因此采用关系式q(ρ)=v_mρ(1-ρ/ρ_m)，并在ρ=ρ_m/2处求得理论最大流量。
  - name: 带随机扰动的差分方程模型
    role: 根据上游到达流、小区出入流和事故断面离开流的守恒关系，递推排队车辆标准当量及排队长度，预测拥堵随时间的演化和队尾到达上游路口的时刻。
    why: 排队长度本质上由离散时间内流入量与流出量之差累积形成，差分方程计算速度快、参数含义明确，适合描述受信号灯周期和随机来车影响的动态排队过程。
  - name: 元胞自动机交通仿真模型
    role: 将道路离散为元胞，将车辆表示为具有有限速度状态的个体，通过行驶、减速、换道和随机扰动规则模拟事故前后的微观交通过程。
    why: 交通拥堵包含车辆相互作用、随机减速和换道等难以用显式函数刻画的行为，元胞自动机能够直观再现车流传播、排队形成与消散过程，并可通过动画展示。
  - name: 换道影响等效通行能力模型
    role: 按照车辆通过事故点所需换道次数对PCU进行加权，并扣除可从路侧缝隙独立通行的非机动车流量，解释不同事故位置下通行能力的差异。
    why: 事故位置不仅改变剩余车道数量，还会改变机动车换道成本以及机动车与非机动车的冲突程度，仅比较原始断面流量无法识别这些结构性影响。
  solution_flow: 数据：人工读取监控视频，划分事故前、事故中和事故后阶段，统计饱和时段断面车型流量、各车道流量比例、拥堵车辆数、排队长度和自由流车速；模型：先用PCU统一车型并估计事故状态通行能力，再用交通流基本图估算正常状态最大通行能力，随后分别建立差分方程和元胞自动机描述排队演化；参数：由视频估计PCU流率、最大拥堵密度ρ_m、自由流速度v_m、各车道流量占比、小区出入流、道路长度及事故断面容量；求解：递推计算排队标准车当量与长度，并通过元胞自动机多次随机仿真，分析事故持续时间、上游来车量和道路通行能力对排队长度及队尾到达时间的影响；验证：将两类模型的平均趋势、实测拥堵片段和通行能力结果进行对比，并通过换道加权后的等效通行能力检验事故位置差异的解释。
  validation: 采用多层验证：首先将视频中多个独立饱和时段合并计算通行能力，降低单一时间窗的偶然误差；其次用四个拥堵时刻的平均密度和多个低密度片段的车辆速度标定基本图参数；再次将差分方程与元胞自动机多次随机仿真的平均排队趋势同视频中的实际堵车过程比较；最后对不同事故位置的数据进行非机动车扣除和换道次数加权，所得等效通行能力分别约为2353
    pcu/h和2389 pcu/h，二者接近，从而验证机制解释的合理性。
  visualization:
  - 排队长度—时间变化曲线
  - 道路通行能力分阶段对比图
  - 不同车道流量占比柱状图
  - 元胞自动机时空演化图或交通动画
  - 事故位置与车辆换道路径示意图
  pitfalls_avoided:
  - 避免直接用事故前视频中的普通流量代表正常道路通行能力，因为该阶段道路未达到饱和，观测值只是实际需求量而非最大供给能力，故改用交通流基本图进行理论估计。
  - 避免把不同车型简单按车辆数等权统计，因为大客车、小汽车和电瓶车对道路资源的占用程度明显不同，故统一换算为标准车当量PCU。
  - 避免用任意事故时段的平均流量估计事故状态容量，因为非饱和时段的流量受上游需求限制，不能反映道路最大通行能力，故只选取出现明显拥堵的饱和片段。
  - 避免将两种事故位置的容量差异简单归因于占用车道位置，因为非机动车可从路侧缝隙通过且不同车道来车比例不同，故同时修正非机动车分流和换道次数影响。
  - 避免完全采用确定性到达流描述交通过程，因为上游信号灯放行和车辆行为会造成周期性与随机波动，故在差分方程中加入随机量，并在元胞自动机中设置随机减速规则。
  - 避免只使用单次随机仿真作结论，因为单次元胞自动机结果可能受随机种子影响，故应进行多次实验并比较平均趋势。
  innovation_points:
  - 从宏观和微观两个层面分别建立差分方程与元胞自动机模型，并通过结果对照说明二者是对同一交通流守恒与车辆交互过程的不同表述。
  - 将事故位置效应拆分为非机动车分流效应和机动车换道成本效应，利用按换道次数加权的等效PCU使两种事故场景的等效通行能力趋于一致。
  - 在缺少正常道路饱和观测的情况下，将视频标定的最大拥堵密度和自由流速度代入交通流基本图，实现实测数据与理论容量估计的结合。
  - 利用视频中的信号周期、车型组成、车道分布和局部出入流对模型进行场景化标定，使模型能够进一步预测140米上游路口受排队回溢影响的时间。
- id: 2023_A165
  source_paper: 2023 2023_A165
  problem_type: 仿真+优化
  keywords:
  - 机理分析
  - 栅格化光线追迹
  - 三分查找与蒙特卡洛优化
  context: 在塔式太阳能光热发电场景下，计算定日镜场的光学效率与输出热功率，并在额定功率及空间布置约束下优化吸收塔位置、镜面尺寸、安装高度和镜场布局。
  models:
  - name: 太阳位置与入射光方向模型
    role: 根据日期、当地时间、纬度和海拔计算太阳赤纬角、时角、高度角、方位角以及太阳入射方向。
    why: 定日镜姿态、余弦损失、阴影遮挡和太阳辐射强度均随太阳位置变化，必须先建立统一的时空光照输入。
  - name: 定日镜反射法向量模型
    role: 根据定日镜中心、集热器中心和太阳入射方向，利用反射定律确定反射方向及镜面法向量。
    why: 定日镜需要将太阳光准确反射至集热器中心，向量形式便于在三维坐标系中统一描述镜面姿态和光线路径。
  - name: 栅格化阴影遮挡判定模型
    role: 将镜面离散为栅格，通过光线与其他定日镜平面的交点、射线方向和矩形内点判定，估计入射阴影效率与反射遮挡效率。
    why: 镜间遮挡具有复杂的三维几何关系，难以直接解析积分；栅格化可将连续面积比例转化为无遮挡栅格数比例，兼顾精度与可计算性。
  - name: 锥形光束截断效率模型
    role: 考虑太阳光束展宽，计算无阴影遮挡栅格的反射锥形光束在圆柱形集热器上的光斑及其被截获比例。
    why: 仅判断中心反射光线是否命中集热器会高估能量接收率，引入光束半角展宽可以更真实地刻画集热器截断损失。
  - name: 余弦效率与大气透射率模型
    role: 利用入射方向与镜面法向量夹角计算余弦效率，并根据定日镜至集热器距离计算大气透射率。
    why: 斜入射和长距离传播是镜场光学损失的主要来源，需要与阴影遮挡、截断和镜面反射损失共同纳入效率核算。
  - name: 定日镜场光学效率与输出热功率模型
    role: 将阴影遮挡效率、余弦效率、大气透射率、截断效率和镜面反射率相乘，并结合DNI与镜面面积汇总镜场输出热功率。
    why: 该模型将各阶段机理损失连接为完整能量链，为月均、年均性能评价及后续优化提供统一目标函数。
  - name: 单位镜面面积年平均输出功率单目标优化模型
    role: 在额定年平均输出热功率、镜场半径、塔周空地、镜面尺寸、安装高度和镜间距等约束下，最大化单位镜面面积年平均输出热功率。
    why: 单位面积功率能够同时反映能量产出和镜面用量，比单纯最大化总功率更适合衡量镜场设计的面积利用效率。
  - name: 三分查找降维优化模型
    role: 在统一镜面尺寸和安装高度的情形下，固定部分设计变量，对镜面宽高、塔位置等变量进行分阶段单变量搜索。
    why: 定日镜位置、数量和尺寸共同决策会形成高维非线性解空间，三分查找可在近似单峰的局部搜索区间内降低计算量并获得较优解。
  - name: 蒙特卡洛随机模拟优化模型
    role: 在各排或各定日镜安装高度可变的高维情形下，对可行参数组合进行随机采样并保留性能更优的方案。
    why: 变量自由度进一步增加后难以使用解析优化或穷举搜索，蒙特卡洛方法对非凸、非光滑且仿真计算型目标具有较好的适应性。
  solution_flow: 输入镜场位置、日期时刻、定日镜与集热器几何参数→计算太阳位置、DNI和入射方向→依据反射定律确定各定日镜法向量→将镜面栅格化并进行射线与矩形相交判定，计算阴影遮挡效率→模拟锥形反射光束与圆柱集热器的相交情况，计算截断效率→结合余弦效率、大气透射率和反射率计算单镜及镜场光学效率、输出热功率和单位面积功率→对12个月21日的5个典型时刻进行平均得到年均指标→构建带额定功率和几何约束的单目标优化模型→统一参数情形采用固定部分变量与三分查找降维求解，可变高度情形采用蒙特卡洛随机搜索→检查约束可行性并比较优化前后效率和功率指标。
  validation: 通过物理规律与数值结果双重检验：检查所有效率是否处于0至1之间、功率和面积是否为正、反射方向是否指向集热器；核验镜场边界、塔周100米空地、镜面宽高关系和最小镜间距等约束；比较优化前后年均光学效率、输出功率和单位面积功率，确认优化方向一致；改变镜面栅格密度、近邻定日镜数量及蒙特卡洛采样规模进行收敛性和敏感性分析，以判断离散误差与随机误差是否可接受。
  visualization:
  - 太阳时角、赤纬角、高度角和方位角几何示意图
  - 入射光、反射光与镜面法向量三维向量示意图
  - 定日镜阴影与反射遮挡示意图
  - 栅格化光线追迹算法流程图
  - 月均与年均效率及输出热功率对比表
  - 优化前后镜场布局散点图
  pitfalls_avoided:
  - 区分直线交点与有效射线交点：除判断交点是否落在其他定日镜矩形内，还利用方向点积判断交点是否位于光线传播的正向半轴，避免将光源后方或反射点后方的几何交点误判为阴影或遮挡。
  - 不以单条中心光线代替真实反射光束：引入4.65 mrad半角展宽并计算集热器接收光斑比例，避免因中心光线命中就认定全部能量被吸收，从而高估截断效率。
  - 不直接对连续镜面面积进行复杂解析积分：将镜面栅格化并以有效栅格比例估算效率，避免三维不规则遮挡区域难以解析求积，同时可通过加密栅格控制误差。
  - 避免在全部定日镜逐点两两检测造成不可承受的计算量：优先检查空间上最近的若干定日镜，降低光线求交复杂度；同时应通过扩大近邻数进行敏感性检查，防止遗漏远处但实际参与遮挡的镜面。
  - 避免直接在所有镜面位置、尺寸和高度上进行高维穷举：统一参数阶段采用结构化布置、固定变量和三分搜索，可变参数阶段在已有较优布局上进行蒙特卡洛调整，从而控制解空间维度和仿真调用次数。
  - 避免只优化总输出功率而忽略镜面用量：以单位镜面面积年平均输出功率为目标，并同时设置额定功率约束，使方案兼顾发电能力与镜面面积利用率。
  innovation_points:
  - 按照太阳光入射、定日镜姿态调整、阴影遮挡、锥形光束截断和能量汇总的物理过程进行分层机理建模，形成可解释的完整光学效率链。
  - 将镜面栅格化光线追迹与空间向量求交、矩形内点判定相结合，在不依赖大型光学软件的情况下实现三维镜场性能仿真。
  - 针对统一参数和自由参数两类设计问题分别采用三分查找降维与蒙特卡洛随机搜索，实现仿真模型和不同维度优化算法的分层耦合。
  - 以典型月日和典型时刻进行年度采样，在年度性能代表性与大规模镜场仿真成本之间取得平衡。
- id: 2023_E032
  source_paper: 2023 2023_E032
  problem_type: 统计分析+预测+优化
  keywords:
  - 水沙通量
  - 突变与周期分析
  - SARIMA预测
  context: 基于黄河某水文站近6年的水位、流量、含沙量及河道断面数据，研究水沙通量规律、预测未来趋势、优化监测方案并评价调水调沙效果。
  models:
  - name: 加权均值替补模型
    role: 补全缺失日期对应的含沙量数据，形成长度一致的日尺度时间序列。
    why: 含沙量记录存在缺测，利用缺失点前后的有效观测值并按时间间隔赋权，可在保持局部变化趋势的同时减少直接删除样本造成的信息损失。
  - name: 分段多项式回归模型
    role: 分别刻画含沙量与水位、含沙量与水流量之间先增后降的非线性关系。
    why: 散点及分组均值曲线存在明显转折，单一函数难以覆盖全部区间，因此在转折点两侧分别采用三次或二次多项式与线性函数进行最小二乘拟合。
  - name: 水沙物质转换模型
    role: 根据总流量、含沙量和泥沙密度估算水流量，并计算单位时间排沙通量。
    why: 原始数据给出的流量同时包含水沙影响，需要通过密度关系完成水流量与泥沙输运量之间的量纲转换。
  - name: 离散通量累加模型
    role: 将各监测时段的流量和排沙通量累加，估算年度总水流量与年度总排沙量。
    why: 监测数据是离散时点观测值，将流量乘以相邻监测时段长度后求和，可近似计算全年通量并处理不等间隔记录。
  - name: 数值积分模型
    role: 对连续时间上的水流量和排沙通量进行积分估计，并用于优化和复核年度总量结果。
    why: 简单日尺度或时段累加可能忽略观测点之间的变化，数值积分能够更合理地逼近流量曲线下面积。
  - name: 累积距平模型
    role: 识别月均流量和月均排沙量长期变化趋势的转折阶段及候选突变时间。
    why: 累积距平曲线的上升、下降和极值能够直观反映序列相对于长期均值的持续偏离及趋势转换。
  - name: Mann-Kendall突变检验
    role: 检验水沙通量序列的上升或下降趋势，并通过UF、UB曲线交点确定可能的突变时刻。
    why: 该方法属于非参数检验，对水文序列的分布形式要求较弱，适合存在偏态、异常波动的水沙监测数据。
  - name: 时间序列季节分解模型
    role: 将月流量和月排沙量分解为长期趋势、季节项和随机残差，提取季节性规律。
    why: 黄河水沙过程受汛期和调水调沙影响，具有明显年内季节波动，分解模型可区分长期变化与重复季节效应。
  - name: 小波分析模型
    role: 利用小波方差和小波变换系数实部等值线识别水沙通量在不同时间尺度上的主周期。
    why: 水文序列具有非平稳和多时间尺度特征，传统单一周期分析难以同时定位周期长度及其随时间的变化。
  - name: SARIMA季节时间序列预测模型
    role: 以2016—2020年月度数据训练模型，以2021年数据测试和调参，并预测未来两年的水沙通量趋势。
    why: 月度水沙通量同时具有趋势、短期自相关和季节周期，SARIMA可通过差分、季节项及自回归移动平均结构联合建模。
  - name: 预测驱动的自适应采样方案
    role: 依据未来两年预测得到的周期、突变风险和高波动时段安排采样次数及具体时间。
    why: 在汛期、调水调沙期和预测突变区间加密监测，在平稳低值期降低频率，可兼顾动态掌握能力与监测成本。
  - name: 断面测量与流速面积模型
    role: 采用梯形分割计算河道断面面积，再通过流速面积法估计平均流速，分析河床冲淤及调水调沙效果。
    why: 断面测深数据是不规则离散点，梯形积分适合估算断面面积；结合流量可进一步判断面积、流速和河底高程变化。
  solution_flow: 对水位、流量、含沙量和断面数据补齐日期、删除跨年重复记录、处理闰日、修补缺失值并统一时间与量纲→按日、月、年和水位或流量区间汇总数据→利用Sturges公式确定分组数，通过最小二乘法确定分段回归参数，采用累积距平、M-K检验、季节分解和小波分析提取突变性、季节性与周期性→按相邻观测时段累加并用数值积分计算年水沙总量→使用2016—2020年数据训练SARIMA，以2021年为测试集调整阶数和季节参数，预测未来两年→根据预测高值期、突变期和调水调沙期制定疏密结合的采样方案→结合断面面积、平均流速和河底高程变化综合评价调水调沙效果。
  validation: 分段回归采用决定系数R²比较不同多项式阶数及各分段拟合效果；年度水流量和排沙量同时使用离散时段累加与数值积分计算并交叉核验；突变时间由累积距平曲线极值与M-K检验的UF、UB交点相互印证；SARIMA采用时间顺序留出法，以2016—2020年为训练集、2021年为测试集，将预测值与真实月度数据拟合比较后调整参数；调水调沙结论再由水沙通量、河底高程、断面面积和平均流速等多类指标进行一致性验证。
  visualization:
  - 含沙量日序列折线图
  - 含沙量—水位分组均值及分段拟合曲线
  - 含沙量—水流量分组均值及分段拟合曲线
  - 月均流量与月排沙量累积距平曲线
  - M-K检验UF与UB交点图
  - 趋势—季节—残差分解图
  - 小波方差图
  - 小波变换系数实部等值线图
  - SARIMA预测值与实际值对比图
  - 未来两年趋势及预测区间图
  - 河道断面形态与河底高程变化图
  pitfalls_avoided:
  - 删除相邻年份交界处重复的“12月31日24:00”和“1月1日0:00”记录，避免同一时刻被重复计入年度通量。
  - 在跨年度同日比较时剔除闰年的2月29日，使各年度日序列维度一致，避免日期错位导致季节规律失真。
  - 对缺失含沙量采用考虑前后时间间隔的加权补值，而不是简单填零，避免人为制造含沙量骤降和低估排沙量。
  - 回归分析中仅保留含沙量有效的配对观测，并对连续变量先分组取均值，避免缺失配对和高频噪声直接干扰关系识别。
  - 针对含沙量随水位或水流量先升后降的结构采用分段拟合，避免用单一线性或高阶全局多项式掩盖转折点并产生区间外异常振荡。
  - 年度总量计算使用实际相邻监测时段长度并统一换算为秒，避免默认等间隔采样导致不规则观测区间被错误赋予相同权重。
  - 在水流量、排沙量、质量与体积之间进行密度和亿单位换算，避免量纲不一致造成数量级错误。
  - 预测模型按时间顺序划分训练集与测试集而非随机打乱，避免未来信息泄漏并保持真实预测场景。
  - 同时使用累积距平与M-K非参数检验识别突变，避免仅凭曲线目测将普通季节峰值误判为结构突变。
  - 使用小波分析而非只依赖平稳周期方法，避免忽略水沙序列周期随时间变化及多尺度并存的非平稳特征。
  innovation_points:
  - 构建“关系回归—突变检验—季节分解—多尺度周期分析—季节预测”的完整水沙通量建模链，将静态水沙关系与动态时间规律统一起来。
  - 将SARIMA预测结果直接转化为自适应采样策略，在预测高值、突变和调水调沙时段加密采样，在稳定期减少采样，实现监测及时性与成本控制的平衡。
  - 使用离散通量累加和数值积分双路径估算年度总量，通过不同计算机制交叉检验结果稳健性。
  - 从水沙通量、河底高程、断面面积和平均流速多个维度评价调水调沙，避免仅依据单一流量或含沙量指标作出结论。
- id: 2023_A092
  source_paper: 2023 2023_A092
  problem_type: 仿真+优化
  keywords:
  - 光学效率
  - 蒙特卡洛光线追迹
  - 遗传算法
  context: 针对塔式太阳能光热发电系统，在额定输出功率及场地、间距等约束下优化吸收塔与定日镜场参数，以最大化单位镜面面积的年平均输出热功率。
  models:
  - name: 太阳位置与定日镜姿态几何模型
    role: 根据日期、时刻和当地纬度计算太阳高度角、太阳方位角及太阳入射方向，再利用反射定律求取各定日镜的法向量、俯仰角和方位角。
    why: 太阳位置和镜面姿态是计算余弦损失、阴影遮挡、反射光路及输出功率的基础，采用空间向量模型可统一描述不同时间与不同镜位的光学关系。
  - name: 定日镜场年平均输出热功率模型
    role: 综合镜面反射率、大气透射率、余弦效率、阴影遮挡效率和集热器截断效率，计算瞬时光学效率、输出热功率及年度平均指标。
    why: 单位镜面面积年平均输出热功率由多个相互耦合的光学损失共同决定，乘积型效率模型能够将各类损失统一映射为可评价、可优化的性能指标。
  - name: 投影离散化阴影遮挡模型
    role: 将相邻定日镜沿入射光线和反射光线方向投影到目标镜面，并通过镜面网格离散点统计投影并集面积，得到阴影遮挡效率。
    why: 入射遮挡与反射遮挡区域可能重叠且形状复杂，直接解析计算并集面积困难；坐标变换、空间投影与离散化统计可稳定处理多镜面遮挡及重叠问题。
  - name: 蒙特卡洛光线追迹截断效率模型
    role: 随机生成锥形太阳光束的入射方向和镜面落点，追踪反射光线并判断其是否与圆柱形集热器有效接收面相交，据此估计截断效率。
    why: 太阳光具有锥形角，反射光斑随传播距离扩散，集热器接收比例难以获得简单解析解；蒙特卡洛方法适合估计复杂空间光路中的能量接收概率。
  - name: 统一参数定日镜场单目标优化模型
    role: 以单位镜面面积年平均输出热功率最大为目标，将吸收塔位置、统一镜面尺寸、统一安装高度、定日镜数量及位置作为决策变量，并施加额定功率、场地边界和镜间距等约束。
    why: 问题二具有高维、非线性、非凸和混合离散连续变量特征，难以用解析法求解，单目标约束优化可直接对应工程设计目标。
  - name: 遗传算法
    role: 对统一参数定日镜场优化模型进行全局启发式搜索，获得吸收塔位置、定日镜尺寸、高度、数量和同心圆式布局方案。
    why: 决策变量数量多、变量类型混合，目标函数还嵌套光学仿真，不易计算梯度；遗传算法对非凸性和不可微性具有较强适应能力。
  - name: 分圈参数化非统一优化模型
    role: 假设定日镜按同心圆排布，并令同一圆环上的镜面尺寸和安装高度一致，将逐镜优化降维为逐环优化。
    why: 问题三若逐镜设置尺寸与高度会造成维数爆炸；利用同心圆布局的各向同性进行分圈参数化，可在保留非统一设计能力的同时显著降低计算量。
  - name: 变步长遍历搜索
    role: 在同心圆参数化基础上，先采用较大步长搜索可行优质区域，再缩小步长优化各环半径、镜面尺寸和安装高度。
    why: 非统一设计变量仍较多，固定细步长全局遍历计算成本过高；变步长策略兼顾搜索范围、局部精度和计算效率。
  solution_flow: 数据→读取场地范围、地理纬度、时间采样点、定日镜及集热器几何参数和镜面反射率等数据→模型→建立太阳位置、镜面姿态、五类光学效率和热功率模型，并构造统一与非统一设计的单目标优化模型→参数→确定太阳赤纬与时角、镜场坐标变换、光线锥角、蒙特卡洛样本量、镜面离散网格及遗传算法参数→求解→逐时刻逐镜计算光学效率和输出功率，使用遗传算法求解统一设计，再利用同心圆分圈降维和变步长遍历求解非统一设计→验证→检查反射方向、效率取值、额定功率及几何约束，并通过提高网格和蒙特卡洛采样精度检验结果稳定性。
  validation: 采用物理一致性、约束可行性和数值收敛性相结合的验证策略：检查法向量是否平分入射与反射方向、反射光线是否指向集热器中心以及各项效率是否位于0到1之间；核验定日镜均处于场地内、相邻镜间距满足安全要求且年平均输出达到额定功率；逐步减小遮挡计算网格步长并增加蒙特卡洛光线数量，比较光学效率和输出功率的变化以检验收敛性；对遗传算法和变步长搜索进行多次运行，比较最优目标值和布局结构的稳定性，并将优化前后单位面积功率进行对照。
  visualization:
  - 太阳视运动轨迹与太阳赤纬变化曲线
  - 定日镜场同心圆布局散点图
  - 入射与反射光路空间几何示意图
  - 镜面投影遮挡区域及离散网格图
  - 遗传算法目标函数收敛曲线
  - 各月份与各时刻光学效率和输出热功率曲线
  pitfalls_avoided:
  - 避免仅用太阳高度角描述太阳位置，因为缺少方位角会导致入射光方向、镜面法向及遮挡投影方向计算错误。
  - 避免把太阳光视为完全平行光，因为太阳具有有限锥形角，远距离传播后会产生光斑溢出，忽略该因素将高估集热器截断效率。
  - 避免将入射遮挡面积与反射遮挡面积直接相加，因为两类遮挡区域可能重叠，直接求和会重复计损；采用离散点集合并集统计总遮挡比例。
  - 避免在不同坐标系中直接混用镜面顶点、光线和法向量，因为镜面坐标系与镜场坐标系方向不同；通过旋转矩阵和平移向量完成统一变换。
  - 避免只计算单一时刻或典型日性能，因为太阳位置和辐照度具有显著时序变化，单点结果不能代表年度性能；采用多日期、多时刻采样并进行年平均。
  - 避免对非统一方案逐块定日镜独立优化，因为变量规模会随镜数急剧增长并造成维数灾难；利用同心圆各向同性，将尺寸和高度按圆环共享。
  - 避免使用固定极细步长进行全空间遍历，因为光学仿真本身计算昂贵，会导致不可接受的时间成本；采用先粗后细的变步长搜索。
  - 避免只追求总输出功率而无限增加镜面面积，因为这不能反映土地和镜面利用效率；以单位镜面面积年平均输出热功率为目标，并将额定功率作为约束。
  innovation_points:
  - 将太阳位置、镜面实时姿态、五类光学损失和法向直接辐射照度统一耦合，形成从空间光路到年度热功率的完整仿真评价链。
  - 针对复杂遮挡区域，将空间投影、坐标变换和镜面网格离散相结合，并用集合并集处理入射遮挡与反射遮挡的重叠。
  - 使用蒙特卡洛光线追迹模拟具有锥形角的太阳光束，通过反射光线与圆柱形集热器曲面的相交判定估计截断效率。
  - 从统一参数优化所得的同心圆布局中提取结构规律，将逐镜非统一设计转化为逐环参数优化，实现基于先验最优结构的有效降维。
  - 采用遗传算法处理统一设计中的高维混合变量，并在非统一设计中采用变步长遍历，形成适配不同变量规模的分阶段优化框架。
- id: A11168020_郑建国_陶禹诺_严洒洒_A11168020_郑建国_陶禹诺_严洒洒
  source_paper: A11168020_郑建国_陶禹诺_严洒洒 A11168020_郑建国_陶禹诺_严洒洒_A11168020_郑建国_陶禹诺_严洒洒
  problem_type: 优化+仿真+综合评价+统计分析
  keywords:
  - 最优控制
  - 轨迹离散化与逐步迭代
  - 动力学微分方程
  context: 针对嫦娥三号从椭圆形着陆准备轨道到月面预定着陆点的软着陆任务，设计满足六阶段状态约束且燃料消耗尽可能小的轨道与控制策略。
  models:
  - name: 主减速段动力学最优控制模型
    role: 依据牛顿第二定律建立水平与竖直方向的轨迹微分方程，以燃料消耗最小为目标，确定推力大小、推力方向、下降时间和主减速轨迹。
    why: 主减速段消耗大部分燃料且水平位移最大，是决定近月点位置和整体着陆性能的关键阶段，必须同时描述变质量、月球重力和发动机推力作用。
  - name: 轨迹离散化逐步迭代模型
    role: 将连续下降时间划分为多个小区间，把每个区间近似为匀变速运动，根据上一时刻状态递推下一时刻的位置、速度和质量。
    why: 动力学方程包含变质量和推力方向等因素，难以直接获得解析解，离散迭代便于利用 MATLAB 搜索满足终端约束的控制参数。
  - name: 地表距离—经纬度转换模型
    role: 将主减速段求得的水平位移转换为月面纬度差，并结合轨道平面和近远月点对称关系确定近月点、远月点的经纬度。
    why: 动力学模型输出的是平面坐标和位移，而任务要求给出月球表面的地理位置，因此需要完成平面轨迹结果与经纬度坐标之间的映射。
  - name: 椭圆轨道近远月点速度模型
    role: 联合机械能守恒定律与开普勒第二定律，计算椭圆准备轨道近月点和远月点的速度大小，并由轨迹切线确定速度方向。
    why: 在忽略摄动且只受月球引力作用的假设下，机械能与角动量守恒能够直接刻画椭圆轨道两个拱点的速度关系。
  - name: 六阶段全局最优控制模型
    role: 以各阶段初始状态和终端状态为约束，以总燃料消耗最小为目标，分别设计主减速、快速调整、粗避障、精避障和缓速下降等阶段的轨迹与控制策略。
    why: 软着陆过程具有明显的分阶段特征，各阶段高度、速度和姿态要求不同，需要采用分段动力学模型并保证阶段连接状态连续。
  - name: 数字高程图平坦度综合评价模型
    role: 将粗避障与精避障阶段的数字高程图划分为九个区域，综合区域相对高程差与高程标准差构造平坦度指标，筛选安全着陆区域。
    why: 仅考察平均高程无法反映地形起伏和局部障碍，结合极差类指标与标准差可以同时衡量区域的整体高差和离散程度。
  - name: 粗避障控制方案燃耗比较模型
    role: 比较先关闭发动机加速后再开机减速与全阶段匀速运动两种可行方案，在满足终端速度约束的条件下选择燃料消耗较少的策略。
    why: 粗避障阶段存在多种满足运动约束的控制方式，通过定量比较推进剂消耗才能确定真正符合优化目标的方案。
  - name: 灵敏度与误差分析模型
    role: 改变近月点高度和主减速发动机推力，分析水平位移、燃料消耗及阶段时间的变化，并以相对误差评价局部和整体方案稳定性。
    why: 轨道初始高度和发动机推力存在测量及执行偏差，考察输出对关键参数扰动的响应可以判断控制策略的鲁棒性和工程可实施性。
  solution_flow: 输入探测器质量、推力范围、比冲、月球参数、准备轨道高度、预定着陆点及数字高程图等数据→在均匀月球引力场和忽略摄动等假设下建立变质量动力学微分方程与燃料最小目标→利用轨迹离散化设定时间步长、推力大小和初始推力角等参数→通过
    MATLAB 逐步迭代和参数试探求解满足阶段终端状态的主减速轨迹及六阶段控制策略→将水平位移转换为经纬度，并由机械能守恒和开普勒第二定律求近远月点速度→利用高程差和标准差评价候选着陆区并比较粗避障控制方案→通过边界状态检验、方案燃耗比较、灵敏度分析和相对误差分析验证模型。
  validation: 首先检查各阶段计算结果是否满足规定高度、水平速度、合速度和着陆速度等终端约束，并检查相邻阶段状态是否能够衔接；其次将近远月点速度代回机械能守恒和开普勒第二定律检验轨道一致性；再比较粗避障两种可行控制方案的燃料消耗验证策略优选结果；最后对近月点高度和发动机推力施加扰动，考察水平位移、燃耗和阶段时间的变化趋势，并用各阶段时间相对误差评估整体稳定性。
  visualization:
  - 软着陆六阶段流程示意图
  - 月球轨道与平面坐标系示意图
  - 主减速段二维轨迹曲线图
  - 数字高程图九宫格分区及平坦度对比图
  - 关键参数—水平位移灵敏度曲线
  - 关键参数—燃料消耗灵敏度曲线
  pitfalls_avoided:
  - 避免直接求解复杂非线性变质量微分方程的解析解，因为质量随燃料消耗变化且推力方向参与控制，采用时间离散与逐步迭代可降低求解难度。
  - 避免仅凭预定着陆点反推准备轨道位置而忽略主减速段水平位移，因为主减速结束点虽接近着陆点上方，但近月点与其之间仍存在数百千米水平距离。
  - 避免把平面水平位移直接当作经纬度差，因为角度与弧长量纲不同，必须利用月球半径和球面弧长关系完成转换。
  - 避免在椭圆轨道速度计算中使用圆轨道速度公式，因为近月点与远月点半径不同，应联合机械能守恒与开普勒第二定律求解。
  - 避免只用单一高程极差选择着陆区，因为极差容易受个别异常点影响；同时引入标准差能够反映区域整体地形波动。
  - 避免默认持续开机或全程匀速必然最省燃料，因为不同控制时序的燃耗可能显著不同，必须在相同终端约束下比较可行方案。
  - 避免只验证名义参数下的最优结果，因为初始高度和实际推力均可能偏离设定值，灵敏度与相对误差分析可揭示方案的稳定性风险。
  innovation_points:
  - 将连续软着陆过程分解为六个具有不同任务目标和边界条件的阶段，并用统一的燃料最小原则协调分段动力学控制。
  - 通过主减速段最优轨迹的水平位移反推近月点地理位置，再结合球面经纬度转换和椭圆轨道对称关系确定完整准备轨道。
  - 将相对高程差与高程标准差融合为平坦度指标，实现数字高程图中候选着陆区域的定量综合评价。
  - 针对粗避障阶段构造两种不同发动机开关时序方案，并以终端状态可行性和燃料消耗共同完成策略优选。
  - 从近月点高度和发动机推力两个关键工程参数出发，同时分析轨迹位移、燃料消耗和阶段时间误差，形成局部与整体相结合的鲁棒性评价。
- id: 2023_C050
  source_paper: 2023 2023_C050
  problem_type: 统计分析+分类聚类+预测+优化+仿真+综合评价
  keywords:
  - 动态定价与补货
  - K-means++聚类
  - 时间序列预测
  - 模拟退火
  - 灰色关联分析
  context: 基于某商超近三年的蔬菜销售、批发价格、损耗率和商品类别数据，分析需求规律并制定品类及单品层面的动态定价与补货策略，以提高经营收益。
  models:
  - name: 描述性统计分析
    role: 利用均值、中位数、极值、标准差、偏度和峰度刻画各蔬菜品类及单品日销量的分布特征与波动程度。
    why: 销量数据具有明显偏态、尖峰和季节波动，仅使用均值难以完整反映其分布规律，需要通过多种统计量识别异常高销量、稳定性及非正态特征。
  - name: Spearman秩相关模型
    role: 分析六大蔬菜品类及相关单品日销量之间的单调关联关系。
    why: 蔬菜销量呈右偏、尖峰且难以满足正态分布假设，Spearman相关系数属于非参数方法，对异常值和非线性单调关系更稳健。
  - name: K-means++聚类模型
    role: 以单品总销量、每日最大销量和日均销量为特征，将单品划分为热销、畅销、平销和滞销四类。
    why: 单品数量多且销售表现差异明显，聚类能够形成可解释的商品分层；K-means++通过拉开初始聚类中心距离，降低普通K-means随机初始化导致局部最优或聚类不稳定的风险。
  - name: Pearson相关分析与线性回归模型
    role: 检验品类销售总量与成本加成定价之间的线性关系，并用最小二乘法估计价格—销量关系。
    why: 优化定价需要量化价格变化对需求量的影响；在检验出负线性相关后，线性回归可提供结构简单、便于嵌入利润优化模型的需求函数。
  - name: 时间序列预测模型
    role: 基于最近半年的品类日销量预测2023年7月1日至7日的每日需求量。
    why: 蔬菜需求具有时间依赖性、季节性和周期性，时间序列模型能够利用近期变化规律；采用近半年数据可增强预测的时效性，减少过早历史数据造成的结构偏移。
  - name: 利润最大化优化模型
    role: 以销售收入扣除采购及损耗成本后的利润最大化为目标，联合确定品类和单品的补货量、售价及可售商品组合。
    why: 定价、需求、补货和损耗相互耦合，单独决策容易造成缺货或积压；优化模型可同时纳入补货量、定价、损耗、陈列量、单品数量及最低订购量等业务约束。
  - name: 模拟退火算法
    role: 搜索品类未来一周及单品在7月1日的近似最优补货和定价方案。
    why: 联合定价补货问题包含离散选品变量、连续决策变量及复杂约束，可能具有非凸性和多个局部最优；模拟退火可通过概率接受劣解跳出局部最优。
  - name: 灰色关联分析模型
    role: 评价季度品种丰富度、节气效应和节日因素与六大蔬菜品类季度平均销量之间的关联程度。
    why: 季度样本量有限，影响因素量纲和变化形态不同，灰色关联分析对小样本及分布假设要求较低，适合衡量各因素与销量序列变化趋势的一致性。
  solution_flow: 数据→合并商品、销售、批发价格和损耗率数据，剔除退货等无效记录并按日、品类和单品聚合→通过描述统计和可视化识别右偏、尖峰、波动及季节性→使用Spearman系数分析销量关联，使用K-means++完成单品销售分层→计算成本加成价格，以Pearson检验和最小二乘回归建立价格—销量关系→基于最近半年销量建立时间序列模型，预测未来一周需求→设置售价、补货量、损耗及是否补货等决策变量，构建利润最大化模型→使用模拟退火求解品类和单品层面的补货定价策略→通过灰色关联分析评价季节、节气、节日和品种丰富度的影响，并结合客流、竞品价格及消费者反馈等外部信息提出决策建议。
  validation: 论文主要采用统计显著性检验与结果交叉解释进行验证：对Spearman和Pearson相关系数计算P值，判断相关关系是否显著；将描述统计结果与日销量折线图、季度趋势图等可视化结果相互印证；检查优化结果是否满足单品数量27—33种、单品订购量不少于2.5千克、陈列量、补货量、定价和损耗等约束，并以最大收益作为方案评价指标。灰色关联度均高于0.5被用于支持所选因素与季度销量具有较强关联。文中未充分报告时间序列滚动回测、预测误差指标、模拟退火多次独立运行稳定性及敏感性分析，实际应用时应补充MAE、RMSE或MAPE、留出集检验、参数扰动和多次重复求解。
  visualization:
  - 品种丰富度饼图
  - 季度平均销量折线图
  - 损耗率直方图
  - 品类总销量柱状图
  - 品类销量占比饼图
  - 日销量时间序列图
  - 单品销量分布图
  - 相关系数矩阵或热力图
  - 聚类结果图
  pitfalls_avoided:
  - 剔除销售单价为负的退货记录，因为将退货直接计入正常销售会扭曲日销量分布、价格—销量关系和需求预测结果。
  - 同时使用中位数、标准差、偏度和峰度而非只比较均值，因为销量数据明显右偏且存在尖峰和极端高销量，单一均值容易掩盖波动性与非正态特征。
  - 对非正态、存在异常值的销量关系优先采用Spearman秩相关，因为直接使用Pearson可能把非线性单调关系误判为弱相关，并对极端值过度敏感。
  - 使用K-means++而不是完全随机初始化的K-means，因为随机初始中心可能过于接近，导致聚类结果不稳定或陷入较差的局部最优。
  - 仅使用最近半年数据预测未来一周，因为蔬菜需求具有较强时效性，直接使用全部三年历史数据可能使陈旧消费结构削弱近期趋势信号。
  - 在利润模型中显式考虑损耗率和单位成本，因为若将补货量全部视为可销售量，会系统性高估实际销量与利润，并诱导过量补货。
  - 在单品优化前依据近期可售记录、最低订购量和27—33种数量范围筛选候选商品，因为对已不可售或不满足陈列要求的单品直接优化会产生无法执行的方案。
  - 未将相关性直接解释为因果性，因为节日、季节、客流和促销可能同时影响多个品类；相关分析只能说明共同变化，不能单独证明替代或互补关系。
  innovation_points:
  - 构建“分布分析—关联识别—需求预测—联合优化—启发式求解”的完整闭环，将统计分析结果直接转化为动态定价与补货决策。
  - 同时覆盖品类和单品两个决策层级：品类层面制定未来一周策略，单品层面结合可售性、最低订购量和商品数量约束制定单日精细化方案。
  - 将K-means++商品分层与价格—销量回归结合，使热销、畅销、平销和滞销单品的经营特征能够辅助差异化补货与定价。
  - 在附件数据之外引入季度品种丰富度、节气、节日、客流量、竞争对手价格与策略以及消费者评价等因素，扩展了仅依赖历史销量的传统决策框架。
  - 使用模拟退火处理包含离散选品、连续补货量与价格变量的复杂优化问题，提高了搜索非凸决策空间和跳出局部最优的能力。
- id: B1302_B0129
  source_paper: B1302 B1302_B0129
  problem_type: 分类聚类+优化
  keywords:
  - 碎纸片自动拼接
  - 最大类间方差二值化
  - 边缘匹配
  - 最小生成树
  - 整数规划
  context: 针对同一页中文印刷文档经纵向或纵横向切割形成的碎纸片，利用图像特征与组合优化方法自动确定碎片的相邻关系和排列顺序，并在必要时进行人工校正。
  models:
  - name: 最大类间方差法（Otsu）
    role: 将灰度碎片图像自适应二值化，分离文字前景与纸张背景，为边缘特征提取和碎片匹配提供统一数据。
    why: 阈值由类间方差最大准则自动确定，能够减少固定阈值对扫描亮度和图像灰度差异的敏感性。
  - name: 边缘绝对距离匹配模型
    role: 对仅纵向切割的碎片，以右边缘向量与候选碎片左边缘向量的绝对差之和衡量拼接误差。
    why: 真实相邻碎片在切割边界两侧的文字和背景分布应最连续，因此边缘像素差越小，相邻可能性越高。
  - name: 贪心序列优化模型
    role: 先识别最左侧碎片，再逐步选择与当前碎片右边缘距离最小的未使用碎片，生成整页横向排列。
    why: 单方向切割时排列结构近似线性链，局部最小边缘误差可以快速构造完整顺序，计算复杂度低且便于实现。
  - name: 一维行特征与同层聚类模型
    role: 把每张碎片压缩为反映文字行分布的一维特征向量，利用特征相似性将纵横切割碎片划分到同一文本行。
    why: 纵横切割后仅依靠左右边缘容易产生跨行误配，而同一行碎片在文字带位置和空白区域分布上具有较强一致性。
  - name: 边界均方误差与宽容约束模型
    role: 用相邻边缘的均方误差评价匹配程度，并结合上下边缘最小空白宽度及文字分离阈值限制候选连接。
    why: 均方误差能量化边缘连续性，几何宽容约束可排除虽然像素差较小但文字位置明显不连续的错误拼接。
  - name: 图论最小生成树模型
    role: 将碎片视为节点、候选拼接关系视为带权边，以边界误差作为权重，筛选整体代价较小的连接结构。
    why: 图模型能够同时处理多个候选相邻关系，避免完全依赖单步贪心，并利用全局连接代价提高复杂碎片拼接的稳定性。
  - name: 关联分析模型
    role: 根据碎片四类方向性特征，即上下区域中横向和纵向文字连接的数量，判断双面碎片之间的同层和相邻关系。
    why: 双面文档可观测信息更多且方向关系复杂，关联特征能够综合利用两面的文字连接证据，降低单面局部特征造成的歧义。
  - name: 整数规划拼接优化模型
    role: 以候选相邻关系为决策变量，在每张碎片位置唯一、连接一致等约束下确定双面文档的整体排列。
    why: 碎片排列属于离散组合优化问题，整数规划能够显式表达唯一性和相邻一致性约束，减少重复使用、遗漏和局部最优。
  solution_flow: 读取碎片图像并转换为灰度矩阵→采用最大类间方差法二值化→提取左右边缘、文字行分布、上下空白宽度及双面方向关联特征→对单向切割数据建立边缘绝对距离矩阵并用贪心法排序→对纵横切割数据先进行同层聚类，再以边界均方误差、几何阈值和图论模型确定行内顺序及行间组合→对双面碎片构造四类关联指标并建立整数规划模型→使用
    MATLAB 求解碎片编号序列→输出重构图像并对少量歧义位置进行人工校正。
  validation: 将求得的碎片编号序列重新合成为完整文档，通过文字行连续性、边缘像素误差、上下行对齐情况和人工可读性检查验证结果；对复杂数据记录自动拼接正确率及人工校正数量、方式和耗时，并比较校正前后的重构图，以检验模型的实用效率。
  visualization:
  - 碎片二值化效果图
  - 左右边缘灰度向量对比图
  - 边界误差矩阵热力图
  - 碎片匹配关系图
  - 算法流程图
  - 拼接前后文档对比图
  pitfalls_avoided:
  - 避免直接在彩色或原始灰度图上匹配，因为扫描亮度、纸张底色和噪声会放大边缘差异；先用自适应阈值二值化可突出文字结构并统一特征尺度。
  - 避免只按单个边缘像素或局部文字点判断相邻关系，因为局部空白和相似汉字笔画容易产生偶然匹配；模型使用整条边缘的累计绝对误差或均方误差。
  - 避免在纵横切割问题中直接套用单行贪心排序，因为不同文本行的碎片可能具有相似边缘；先根据一维文字行特征进行同层分类，再进行行内拼接。
  - 避免将文字被切断造成的边缘突变一概判定为不相邻，因为真实切割线可能穿过汉字；通过上下边缘空白宽度和允许分离阈值设置宽容约束。
  - 避免复杂数据中只追求当前最小边界误差而陷入局部最优，因为一次误配会破坏后续整条序列；引入图论全局连接和整数规划约束，并保留人工校正环节。
  - 避免双面碎片仅使用单面信息，因为单面相似结构可能对应多个候选位置；关联分析同步利用正反两面的方向性连接特征，提高匹配辨识度。
  innovation_points:
  - 针对单向切割、纵横切割和双面切割三个复杂层级分别设计递进式模型，实现由边缘贪心匹配到聚类、图论和整数规划的统一拼接框架。
  - 将二维碎片图像压缩为文字行分布的一维特征向量，先识别同层碎片再执行边缘匹配，有效降低跨行误拼。
  - 把边界像素误差与上下边缘空白宽度、文字分离容差联合使用，使匹配准则兼顾图像相似性和文档排版几何结构。
  - 为双面文档定义上下区域中横向、纵向文字连接数量等四类关联指标，并利用两面信息共同约束碎片位置。
  - 采用自动求解与有限人工校正相结合的策略，在保持自动化效率的同时处理文字重复、边缘模糊等算法难以唯一判定的情况。
- id: 文章_xipoxitong
  source_paper: 文章 文章_xipoxitong
  problem_type: 优化+仿真
  keywords:
  - 系泊系统优化设计
  - 静力平衡
  - 悬链线微元法
  context: 针对近浅海观测网传输节点，在不同风速、水流速度和水深条件下优化锚链型号、长度及重物球质量，以减小浮标吃水与游动范围并满足钢桶和锚链角度约束。
  models:
  - name: 二维静力平衡模型
    role: 分别建立浮标、四节钢管、钢桶与重物球的受力平衡方程，递推计算各连接点张力、倾角和坐标。
    why: 题目假设海面平稳且不考虑波动，系统可视为二维平面内的静态受力平衡问题。
  - name: 悬链线微元离散模型
    role: 将锚链划分为多个微元段，利用张力和角度递推关系模拟锚链形状，并区分有铺底链与无铺底链两种状态。
    why: 锚链柔软、不可伸长且自重沿长度均匀分布，微元法能够刻画张力和切线角沿链长的连续变化。
  - name: 水深边界反求模型
    role: 把浮标吃水深度作为自变量，将系统末端纵坐标与给定海水深度匹配，反求满足布放水深条件的吃水深度。
    why: 给定吃水深度后可以逐级确定整个系统状态，因此原问题可转化为求解系统总深度等于实际水深的非线性方程。
  - name: 离散枚举与迭代求根算法
    role: 通过遍历吃水深度区间或按水深残差迭代更新吃水深度，获得系统平衡构型。
    why: 系统深度与吃水深度之间关系由递推仿真隐式给出，难以直接解析求解，数值搜索具有较强可实现性。
  - name: 约束参数优化模型
    role: 调节锚链型号、锚链长度和重物球质量，使钢桶倾斜角不超过5度、锚点处锚链夹角不超过16度，并尽量减小吃水深度和游动区域。
    why: 设计变量兼有离散变量和连续变量，且系统性能需通过力学仿真计算，适合采用仿真驱动的约束优化方法。
  solution_flow: 输入浮标、钢管、钢桶、锚链、锚和重物球的几何质量参数以及海水密度、风速、水流速度与水深→建立二维坐标系并计算重力、浮力、风力和水流力→由浮标开始，依据静力平衡逐级递推钢管与钢桶的张力、倾角和坐标→将锚链离散为微元，递推生成悬链线并识别铺底状态→以系统末端纵坐标与目标水深之差为残差，通过枚举或迭代反求浮标吃水深度→计算游动半径、钢桶倾角和锚点切线角→搜索锚链型号、长度及重物球质量，筛选满足角度约束且综合性能较优的方案→在不同风速、水流速度和水深工况下进行仿真验证。
  validation: 首先检查浮标、钢管、钢桶和锚链各节点的水平与竖直方向力平衡残差；其次检验计算得到的系统末端深度与给定水深之间的误差是否小于设定精度；再用离散枚举法与迭代求根法交叉比较吃水深度和游动范围结果；最后在12m/s、24m/s、36m/s风速以及16至20m水深、最大1.5m/s流速等工况下开展敏感性与极端工况测试，并核验钢桶倾角不超过5度、锚点处锚链夹角不超过16度。
  visualization:
  - 系泊系统二维构型与锚链悬链线图
  - 各部件受力分析图
  - 吃水深度与系统总深度关系曲线
  - 风速或流速与钢桶倾角、游动半径关系图
  pitfalls_avoided:
  - 避免直接把整条锚链视为直线，因为锚链自重会使张力和切线角沿链长变化，直线近似会显著误判锚点夹角和游动范围。
  - 避免忽略锚链铺底状态，因为铺底后链段纵坐标和切线角应保持为零附近，若仍按悬空链递推会得到穿入海床的不合理构型。
  - 避免将浮标吃水深度任意设定，因为吃水深度同时影响浮力、露出水面的迎风面积及系统总深度，必须结合目标水深反求。
  - 避免混淆钢桶与拉力的角度定义，因为钢桶轴线方向由其上端拉力方向确定，而锚链首端切线由钢桶下端拉力方向确定，二者不能直接替代。
  - 避免数值迭代越出浮标0至2m的物理吃水范围，因为越界会产生完全出水或完全没顶等无效状态，需要缩小步长或施加边界约束。
  - 避免在锚链浮力远小于自重时引入不必要的复杂计算，因为其影响有限；但该忽略应以数量级比较为依据，而不能对更粗或更轻的链型直接沿用。
  innovation_points:
  - 将浮标、分节钢管、钢桶重物球组合体和离散锚链统一为由上至下的张力—角度—坐标递推框架，实现整个系泊系统构型的一体化仿真。
  - 把水深几何约束转化为关于浮标吃水深度的隐式方程，并采用枚举与定向迭代两类算法反求平衡状态，提高了求解的可操作性和可校验性。
  - 在锚链微元迭代中加入切线角接近零时的铺底判别，使同一算法能够兼容锚链完全悬空和部分铺底两种工况。
  - 采用仿真驱动的约束优化思路，将钢桶工作角度、锚抗拖移角度、浮标吃水和游动范围共同纳入锚链与重物球参数设计。
- id: B_C07B1pcw
  source_paper: B B_C07B1pcw
  problem_type: 优化+综合评价
  keywords:
  - 扩展有向图
  - 改进Dijkstra算法
  - 多目标路径优化
  context: 面向北京奥运期间复杂的公汽、地铁及步行交通网络，根据乘客对换乘次数、出行时间和出行费用的不同偏好查询最优出行路线。
  models:
  - name: 公交网络扩展有向图模型
    role: 将公汽、地铁、换乘及步行关系统一表示为有向网络，并通过站点拆分和虚拟边保存线路归属、换乘与计价信息。
    why: 普通线路、环线和单行线具有方向差异，直接以物理站点为结点会丢失乘客当前所在线路的信息，无法准确描述换乘过程及其时间和次数。
  - name: 分段计价边扩展模型
    role: 在同一线路的可达站点之间添加有向边，并在边上记录经过站数及相应票价，以表示单一票制和分段计价规则。
    why: 分段票价取决于一次乘车所跨越的站数，并非相邻站费用的简单累加；添加区间边后可将一次乘车费用转化为非负、可加的边权。
  - name: 虚拟源点—汇点模型
    role: 将实际起点和终点因线路拆分产生的多个结点分别连接到零权虚拟源点和虚拟汇点，把多起点、多终点问题转化为单源最短路问题。
    why: 同一物理站点可能对应多条线路结点，设置虚拟结点可统一其出发与到达状态，并直接适配最短路径算法。
  - name: 改进Dijkstra最短路径模型
    role: 针对换乘次数、出行时间或出行费用分别设置边权，通过永久标号与松弛操作求取单目标最优路线。
    why: 经过网络扩展后，各项边权均非负且路径代价满足线性可加性、局部最优性和无后效性；同时公交网络较稀疏，Dijkstra比Floyd或邻接矩阵乘幂方法更适合大规模实时查询。
  - name: 字典序多目标优化模型
    role: 按照乘客指定的目标优先级依次优化换乘次数、时间和费用，例如先使换乘次数最少，再在其最优解集中使时间最短，最后使费用最低。
    why: 三类指标量纲不同且乘客偏好存在明确主次，简单加权会引入难以解释的权重，并可能以次要指标改善换取主要指标恶化。
  - name: 约束多目标路径模型
    role: 在换乘次数、时间或费用满足给定上限的条件下，优化剩余目标，为有明确容忍阈值的乘客生成满意路线。
    why: 现实需求常表现为“最多换乘若干次、限定时间内到达，再使费用最低”，采用约束形式比单一综合评分更符合用户决策逻辑。
  solution_flow: 数据→读取公交与地铁线路、站点顺序、行驶方向、线路类型、票制及站点关联信息→模型→将普通线、环线和单行线统一为有向线路，按经过线路拆分物理站点，添加行驶边、换乘边、分段计价边、地铁关联边及零权虚拟源汇边→参数→设置公汽相邻站3分钟、地铁相邻站2.5分钟，以及等车、换乘步行、公交与地铁转换时间和分段票价等参数→求解→根据换乘、时间、费用目标设置非负边权，使用Dijkstra松弛与永久标号过程求单目标最短路，再通过字典序或约束方式处理多目标需求→验证→对题设六组起讫站分别比较仅公汽与加入地铁后的换乘次数、时间、费用及完整路线，并对其他站点进行批量测试和定性分析。
  validation: 采用案例验证、规则一致性检查和扩展测试相结合的策略：首先对六组指定站点输出可复核的线路、换乘点、耗时和费用；其次检查环线经过始发站或终点站时是否重新计换乘和票价、单行线方向是否被遵守、分段票价是否与跨越站数一致；再次比较仅公汽与加入地铁后的结果，判断网络扩展是否产生符合实际的改进；最后批量测试其他起讫站的连通性和最优路线，并利用Dijkstra终点获得永久标号时的最优性作为算法正确性依据。
  visualization:
  - 公交网络扩展有向图
  - 站点拆分与换乘虚边示意图
  - 分段计价前后边扩展示意图
  - 不同目标最优路线结果对比表
  - 公交乘客出行需求占比图
  pitfalls_avoided:
  - 避免直接把物理站点作为唯一结点，因为该表示无法记录乘客当前所在的公交线路，会使换乘次数、换乘时间和后续费用依赖历史状态，从而破坏无后效性。
  - 避免把分段票价按相邻站费用机械累加，因为一次乘车费用由整段跨越站数决定，简单累加不能正确表达0—20站、21—40站及41站以上的阶梯票价。
  - 避免将公交网络建成无向图，因为单行线路的上下行站点可能不重合，无向化会生成现实中不可乘坐的逆向路线。
  - 避免把环线当作可以无限连续乘坐且不换车的闭环，因为实际经过始发站或终点站时需要换乘并重新计费，否则会低估换乘次数、时间和费用。
  - 避免在原始公交图上直接套用经典Dijkstra算法，因为原始费用和换乘代价不一定线性可加；先通过拆点、加边恢复可加性和无后效性，才能保证最短路结论成立。
  - 避免使用Floyd算法或邻接矩阵乘幂作为实时查询的主要方法，因为其时间复杂度约为O(n^3)，面对上千至上万规模站点时计算和存储开销过大。
  - 避免把时间、费用和换乘次数直接进行缺乏依据的线性加权，因为三者量纲不同且用户偏好差异明显；改用单目标、字典序和带约束多目标三类方式表达需求。
  - 避免只优化一个目标后任意返回并列解，因为这可能出现换乘最少但时间或费用极差的路线；在主目标相同的解中继续按次级目标进行优化。
  innovation_points:
  - 通过“物理站点按线路拆分+换乘虚边”的状态扩展方法，将隐含的线路状态显式化，使复杂公交换乘问题满足最短路径算法所需的无后效性。
  - 通过添加同一线路站点区间边，将非线性的分段计价规则转化为可加的非负边权，从而统一处理时间、费用和换乘次数。
  - 利用零权虚拟源点和汇点统一同一物理站点对应的多个线路结点，简化为标准单源单汇最短路。
  - 建立兼容公汽、地铁和步行方式的统一网络框架，并允许通过增加边及调整边属性扩展交通方式，而无需改变核心求解算法。
  - 同时支持单目标最优、具有主次关系的字典序多目标优化和带阈值约束的多目标优化，提高路线查询系统对不同乘客需求的适应性。
- id: A352_A-13241002-黄小敏，黄程，王露
  source_paper: A352 A352_A-13241002-黄小敏，黄程，王露
  problem_type: 统计分析+预测
  keywords:
  - 实际通行能力
  - 交通波理论
  - 排队长度预测
  context: 基于交通事故视频数据，定量研究不同车道占用位置对城市道路横断面实际通行能力和车辆排队长度的影响，并预测排队蔓延至上游路口的时间。
  models:
  - name: 标准车当量换算模型
    role: 将小轿车、电动车和公交车等异质交通流统一换算为标准车当量，为通行能力和流量计算提供统一尺度。
    why: 不同车型占用道路资源和对交通流的影响不同，直接使用车辆数会造成流量不可比，采用车型换算系数可提高统计指标的一致性。
  - name: 横断面实际通行能力动态模型
    role: 综合基本通行能力、可用车道数、车道宽度、重型车辆、驾驶员特征、横向干扰、事故位置及服务水平等修正系数，刻画事故发生、持续和撤离期间通行能力的动态变化。
    why: 事故状态下的实际通行能力不仅由单位时间通过车辆数决定，还会受到道路条件、交通组成和环境干扰的共同折减，因此需在观测流量基础上引入多因素修正。
  - name: 基于差异度的占道影响比较模型
    role: 通过实际通行能力差异度、稳定性差异度和总差异度，比较事故占用不同车道时横断面通行能力及其波动性的差别。
    why: 仅比较平均通行能力无法反映交通流稳定程度，联合使用水平差异和波动差异能够更全面地识别事故车道位置的影响。
  - name: 偏相关分析模型
    role: 控制上游车流量后，检验小区路口驶入车辆数与横断面实际通行能力之间的独立相关关系。
    why: 上游流量同时影响局部驶入车辆和断面通行能力，直接相关分析容易产生混杂偏差，偏相关分析可分离上游流量的干扰。
  - name: 交通流守恒与交通波排队长度估算模型
    role: 针对完全堵塞和不完全堵塞两种状态，分别利用上下游流量差的时间积分以及交通波传播关系估算车辆排队长度。
    why: 排队本质上由进入拥堵区与离开拥堵区的车辆累积差形成，而不同堵塞程度下车辆密度和拥堵边界传播机制不同，需要构造适用范围不同的分段估算公式。
  - name: 考虑信号周期的排队长度预测模型
    role: 将上游路口车流量表示为受红绿灯控制的周期函数，并与事故断面通行能力及排队增长模型结合，预测队列到达上游路口的时间。
    why: 事故点靠近信号交叉口，上游到达流具有明显周期性；若仅采用恒定平均流量，会忽略绿灯集中放行和红灯截流对排队增长速度的影响。
  - name: 敏感性分析模型
    role: 分析上游车流量、红绿灯周期、横向干扰和车道宽度变化对通行能力、排队长度及到达时间的影响。
    why: 关键参数来源于视频统计或文献取值，存在波动与不确定性，敏感性分析可识别主导因素并检验预测结论的稳健性。
  solution_flow: 从事故视频提取事故时刻、撤离时刻、车辆类型、上下游断面流量、车辆速度和排队长度等数据，并处理视频跳跃与缺失片段；按车型换算系数统一为标准车当量；建立包含车道数和多类道路交通修正系数的实际通行能力动态模型；通过文献、视频观测和交通流关系确定参数，使用
    MATLAB 计算通行能力时间序列；构造通行能力差异度和稳定性差异度，比较不同事故占道位置，并用公交车车道选择和车辆速度变化进行解释；基于车辆守恒和交通波理论建立完全堵塞与不完全堵塞条件下的排队长度模型；利用附件实测排队数据验证模型，再引入信号灯周期函数和给定上游流量，数值求解排队长度达到140米的时间；最后对上游流量、信号周期、车道宽度和横向干扰开展敏感性分析。
  validation: 采用多层验证策略：首先将实际通行能力曲线中的突变时刻与视频记录的事故发生、开始拥堵和事故撤离时刻进行对应；其次利用同一路段不同占道事故的数据进行横向对比，并以公交车车道占用率、公交车及小轿车速度下降量验证差异结论；再次将两类排队长度公式的估算值与视频实测队长比较，使用关联度评价拟合效果，所得关联度分别约为0.79和0.68；最后通过上游流量和信号周期的敏感性分析检验预测方向与结果稳定性。
  visualization:
  - 实际通行能力时间序列折线图
  - 横向干扰与车道宽度影响力对比柱状图
  - 不同占道情形通行能力差异对比图
  - 排队长度随时间变化曲线
  - 参数敏感性分析曲线
  - 建模求解流程图
  pitfalls_avoided:
  - 避免直接按车辆总数计算交通流量，因为公交车、电动车和小轿车的道路资源占用不同；先换算为标准车当量可防止车型结构差异扭曲通行能力。
  - 避免照搬理论基本通行能力公式，因为其计算值与视频中的实际最大交通量偏差较大；论文改用事故断面的实测单位时间标准车流量作为基础，并通过修正系数刻画实际条件。
  - 避免把视频时间轴默认视为连续数据，因为视频存在跳跃、重复和长时间缺失；对短缺失区间采用均值补充，对缺失过多的后段数据予以舍弃，以减少伪造趋势。
  - 避免仅比较不同事故情形的平均通行能力，因为均值无法反映交通流波动和失稳；同时构造稳定性差异度，使占道影响评价兼顾水平与波动。
  - 避免直接判断小区路口流量与通行能力的相关性，因为上游车流量构成共同影响因素；控制上游流量后进行偏相关检验，可降低混杂因素导致的虚假相关。
  - 避免用单一排队公式覆盖所有拥堵状态，因为完全堵塞与不完全堵塞的密度关系和交通波传播机制不同；分别建立两种适用范围不同的估算公式可减少模型失配。
  - 避免在靠近信号交叉口的场景中将上游流量简单视为恒定值，因为红绿灯会造成周期性到达；引入周期函数后可更合理地预测队列蔓延时间。
  - 避免只给出模型计算结果而缺少现实校验，因为修正系数和密度参数具有经验性；将预测队长与视频实测数据比较，并辅以车辆速度和车道选择数据进行交叉验证。
  innovation_points:
  - 将视频识别得到的异质车辆流量与车道宽度、重型车辆比例、横向干扰、事故位置和服务水平等修正因素耦合，构建事故全过程的横断面实际通行能力动态模型。
  - 提出同时包含实际通行能力差异和稳定性差异的占道影响评价方法，使不同事故车道位置的比较不再局限于均值。
  - 依据完全堵塞与不完全堵塞状态分别推导排队长度公式，将车辆守恒关系与交通波传播机理结合，提高模型对不同拥堵阶段的适应性。
  - 在排队到达时间预测中显式引入上游信号灯周期影响，使上游到达流的时变特征与事故断面通行能力相匹配。
  - 采用通行能力、车道取向、车辆速度和实测队长等多源指标进行交叉验证，增强结论的可解释性和可信度。
- id: 2015_B309
  source_paper: 2015 2015_B309
  problem_type: 综合评价+统计分析+仿真+优化
  keywords:
  - 供需匹配度
  - 最近邻空间分析
  - 补贴方案优化
  context: 基于成都市分时段出租车供给与乘客需求数据，评估出租车资源的时空供需匹配程度，分析平台补贴对打车难的影响并优化补贴策略。
  models:
  - name: 基于最近邻思想的邻域供需匹配模型
    role: 以乘客需求点为中心，统计给定半径内的出租车数量，并与该点需求量比较，以判断局部供给不足、供需平衡或供给过剩。
    why: 城市出租车总量充足并不代表局部供需匹配，邻域模型能够刻画乘客附近实际可获得的出租车资源，揭示均值分析无法发现的空间错配。
  - name: 最小满足半径难易度评价模型
    role: 在多个候选邻域半径上逐步计算匹配状态，以首次实现供给大于需求的最小半径序号作为打车难易度指标。
    why: 单一半径只能给出固定尺度下的二元判断，而最小满足半径能连续反映乘客需要从多大范围调集出租车，指标越大表示打车越困难。
  - name: 球面距离模型
    role: 根据出租车点和乘客点的经纬度计算两点间球面距离，为邻域划分及供需匹配提供空间距离依据。
    why: 原始数据以经纬度表示，不能直接使用平面坐标差作为实际距离；在缺少道路网络和可达路径数据时，球面距离是可操作的近似方案。
  - name: S曲线回归模型
    role: 以乘客累计补贴和司机累计补贴为自变量，以日均订单量占用户数的比例为因变量，拟合补贴投入与平台使用及订单响应之间的非线性关系。
    why: 补贴的边际作用通常具有先增强后趋于饱和的特征，S曲线能够描述用户接受度、订单增长率及补贴效应的饱和现象。
  - name: 补贴方案情景仿真模型
    role: 模拟低峰出行奖励和高需求区域定向调度奖励对需求转移、出租车迁移及供需匹配指标的影响。
    why: 补贴方案实施前无法直接获得真实效果，利用拟合关系和出租车迁移假设进行情景仿真，可比较不同补贴机制缓解打车难的潜力。
  - name: 定向空间调度优化策略
    role: 利用平台实时需求信息，引导部分出租车向人流密集、供给不足区域迁移，并通过现金或积分奖励提高司机接单意愿。
    why: 研究发现问题根源主要是出租车空间分布与乘客需求错位，而非城市总供给不足，因此定向补贴供给侧迁移比普遍补贴或仅转移乘客出行时间更有效。
  solution_flow: 收集成都市24个时点的出租车分布、乘客需求、平台补贴、用户数、订单量、等待时间和空驶率数据→清洗并按时点计算供需均值，绘制时空分布图识别需求高峰→利用经纬度球面距离建立乘客中心的多尺度邻域供需匹配模型→设置0.1千米至50千米的59个半径刻度，计算各需求点由供给不足转为供给充足的最小半径及难易度指标→汇总识别高风险时段和区域→计算司机与乘客累计补贴，以订单量占用户数比例拟合S曲线并进行显著性检验→仿真低峰需求奖励方案，发现影响率约为5%→进一步模拟部分出租车向高需求区域迁移的定向补贴方案→比较调整前后的供需匹配程度并提出实时信息发布、现金或积分奖励等实施建议。
  validation: 首先通过不同时点供需散点图、均值曲线和难易度空间分布图进行直观一致性检验，确认模型识别出的早晚高峰及成都东、双流北、都江堰中心等困难区域与原始数据分布相符；其次对S曲线回归进行统计显著性检验，并放弃拟合效果不显著的用户量响应模型，改用日均订单量占用户数比例以消除计量规模差异；最后采用方案对比和典型时段案例验证，以早高峰8点为例，在出租车点中设定1%的车辆迁移，重新计算局部供需匹配状态，比较低峰奖励方案与高需求区域定向补贴方案的改善幅度。
  visualization:
  - 出租车与乘客需求二维气泡散点图
  - 分时段出租车供给与乘客需求均值折线图
  - 打车难易度空间分布图
  - 所有时段难易度散点图
  - 难易度频数分布图
  - 分时段打车难易度条形图
  - 补贴变化对比表
  - S曲线拟合图
  pitfalls_avoided:
  - 避免仅用全市出租车数量与乘客需求均值判断打车难，因为全市平均供给约为需求的两倍仍可能存在局部无车，必须分析供需的空间错配。
  - 避免把每个乘客机械地分配给全市最近出租车，因为最近车辆可能相距数十千米，司机在市场条件下通常不愿长距离空驶接客，因此改用有限邻域内的可用供给进行匹配。
  - 避免使用单一固定半径评价所有需求点，因为城市中心和远郊的空间尺度不同，单一阈值容易导致结果对参数过度敏感，因此采用59个递增半径并提取最小满足半径。
  - 避免直接用经纬度差计算距离，因为经纬度不是等距平面坐标，直接计算会造成邻域划分误差，因此采用地球球面距离进行近似。
  - 避免仅以订单总量衡量补贴效果，因为订单量受用户规模影响且与问题中的需求量计量口径不同，因此改用日均订单量与用户数的百分比进行标准化拟合。
  - 避免保留统计效果不显著的模型，因为以用户量为因变量的S曲线拟合不显著，继续使用会削弱补贴效果推断的可信度，因此选择显著性更好的订单比例模型。
  - 避免把补贴等同于增加城市出租车总量，因为高峰期的核心矛盾是车辆空间分布不均，普遍补贴可能只增加软件使用而不能增加热点区域供给，因此将补贴定向用于车辆空间迁移。
  - 避免认为任何线上补贴都能覆盖全部乘客，因为老年人等数字弱势群体不会或不便使用打车软件，单纯线上补贴无法缓解其打车困难，需要保留线下叫车渠道或专项服务。
  innovation_points:
  - 将最近邻思想扩展为多尺度邻域供需比较，并用供需由不足转为充足所需的最小半径构造可解释的打车难易度指标。
  - 把出租车资源配置评价细化到时点和乘客需求点，实现对高峰时段与局部困难区域的联合识别，而不是只评价城市总体供需。
  - 将补贴响应的S曲线统计模型与空间供需匹配模型衔接，用订单比例变化和车辆迁移共同评估补贴方案。
  - 由面向所有用户的普遍补贴转向面向供给缺口区域的定向激励，使补贴直接作用于出租车空间错配这一关键原因。
  - 通过反证式方案比较发现低峰出行奖励的模拟影响率仅约5%，据此修正策略并提出基于实时大数据的热点区域调度奖励。
- id: A10009072_吉张鹤轩_杨升_陈同广_A10009072_吉张鹤轩_杨升_陈同广
  source_paper: A10009072_吉张鹤轩_杨升_陈同广 A10009072_吉张鹤轩_杨升_陈同广_A10009072_吉张鹤轩_杨升_陈同广
  problem_type: 优化+分类聚类+综合评价+统计分析+仿真
  keywords:
  - 非线性规划
  - 序列化遗传算法
  - 二体动力学模型
  - K均值聚类
  - 空间线性回归
  - 轨迹仿真
  - 误差与灵敏度分析
  context: 以嫦娥三号月面软着陆为背景，在满足各阶段高度、速度和安全着陆约束的条件下，反推着陆准备轨道并优化分阶段控制策略与落点选择，以降低燃料消耗。
  models:
  - name: 椭圆轨道与开普勒动力学模型
    role: 根据近月点、远月点高度计算准备轨道几何参数以及两端点的速度大小和方向。
    why: 着陆准备轨道为以月心为焦点的椭圆轨道，适合利用椭圆几何性质、万有引力定律和轨道动力学关系确定端点状态。
  - name: 二体动力学微分方程模型
    role: 描述嫦娥三号在月球引力和发动机推力共同作用下的径向、切向运动及质量变化。
    why: 软着陆持续时间较短，月球自转、非球形引力和第三天体摄动影响较小，因此月球—着陆器二体模型能够以较低复杂度刻画主要动力学过程。
  - name: 差分方程与轨迹仿真模型
    role: 将难以解析求解的连续动力学方程离散化，通过时间步进模拟主减速轨迹，并依据末端高度和速度约束筛选推力方向参数。
    why: 原微分方程具有非线性、变质量和多状态耦合特征，直接获得解析轨迹困难；采用小时间步长迭代可以逼近真实运动过程。
  - name: 逆向轨道推断模型
    role: 利用主减速阶段的水平飞行距离和预定着陆点位置反推近月点位置，再根据轨道对称性确定远月点位置。
    why: 题目给出的信息不足以唯一确定轨道平面和长轴空间位置，而着陆阶段的端点条件提供了可用于反推的附加约束。
  - name: 非线性规划模型
    role: 以各阶段推力冲量或燃料消耗最小为目标，将高度、速度、时间、推力范围和阶段衔接状态构造为非线性约束。
    why: 燃料消耗与推力的时间积分成正比，同时飞行状态受非线性动力学和多项端点条件约束，属于典型的多变量非线性轨迹优化问题。
  - name: 序列化遗传算法
    role: 对主减速和快速调整阶段的控制变量进行编码、筛选和迭代，搜索近似全局最优的推力控制方案。
    why: 优化模型维度较高、非线性强且可能存在多个局部最优，遗传算法不依赖梯度，适合进行较大范围的全局搜索；序列化处理还能降低整体优化难度。
  - name: 分阶段局部最优控制模型
    role: 将六阶段着陆过程按任务拆解，并将部分阶段进一步分解为水平和竖直方向的变速运动优化，最后拼接各段最优控制策略。
    why: 不同阶段的控制目标和约束差异明显，直接进行全程联合优化计算量大；分阶段处理能够突出主减速段燃耗并简化后续阶段求解。
  - name: K均值聚类模型
    role: 依据月面高程图像的像素或高程特征，将候选区域划分为安全点与危险点，为粗避障和精避障提供分类结果。
    why: 地形安全标签未知，而高程和纹理特征存在自然分组结构，K均值聚类可在无监督条件下快速完成区域划分。
  - name: 栅格化与最大安全半径评价模型
    role: 对聚类后的地形图进行栅格化和二值化，统计安全格与危险格，并结合最大连续安全半径和水平偏移距离评价候选落点。
    why: 着陆器需要具有一定尺度的连续平坦区域，单个安全像素不能保证着陆安全；最大安全半径能够反映候选点周围的整体避障裕度。
  - name: 最小二乘空间线性回归模型
    role: 在精细地形栅格内拟合平均坡面，计算平均坡度，并与安全半径共同形成最终落点评价指标。
    why: 局部月面可近似为平面，最小二乘拟合能抑制离散高程噪声，并以少量参数稳定描述区域整体倾斜程度。
  - name: 综合落点评价模型
    role: 综合平坦度、平均坡度、最大安全半径和水平转移距离，对候选着陆区域排序并选择目标落点。
    why: 最安全位置未必具有最低机动燃耗，必须同时权衡地形安全性与轨迹调整代价，避免采用单一指标决策。
  - name: 相对误差与灵敏度分析模型
    role: 扰动初始状态、模型参数和约束条件，分析各因素变化对燃耗、末端状态及控制结果的影响。
    why: 动力学参数、图像处理和控制执行均存在误差，需要检验优化方案的稳健性，并识别推力角度等高敏感控制变量。
  solution_flow: 输入月球参数、着陆器质量与推力范围、比冲、准备轨道高度、预定落点和月面高程图；先由椭圆轨道关系计算近远月点速度，再建立二体动力学方程并离散为差分方程；通过改变推力方向参数进行轨迹仿真，以阶段末高度和速度条件筛选可行轨迹，利用水平位移逆推近月点并由对称性确定远月点；随后按着陆任务划分阶段，将燃料消耗转化为推力冲量最小目标，对动力学状态和端点约束进行归一化，使用序列化遗传算法及局部运动模型优化各阶段控制参数；对高程图实施K均值聚类、栅格二值化、最大安全半径搜索和最小二乘坡面拟合，通过综合评价选择粗、精落点；最后拼接各阶段轨迹和控制策略，并用端点约束检查、误差分析和灵敏度分析验证方案。
  validation: 首先检查仿真轨迹是否满足各阶段规定的高度、水平速度、竖直速度和悬停等端点约束，并比较离散仿真末状态与题设状态的偏差；其次通过缩小时间步长检验差分轨迹的数值稳定性，并用推力冲量与质量变化关系核对燃耗；再次对聚类和栅格化结果检查候选落点周围的连续安全半径及拟合坡度；最后对初始速度、质量、推力方向、地形参数和约束边界施加扰动，计算输出相对误差和灵敏度，确认总体方案对多数初值扰动不敏感，同时识别角度控制向量为重点风险因素。
  visualization:
  - 近月椭圆准备轨道示意图
  - 二体模型受力分析图
  - 主减速阶段轨迹图
  - 不同推力方向参数对应的轨迹簇图
  - 水平与竖直速度随时间变化曲线
  - 推力夹角随时间变化曲线
  - 月面高程图及K均值聚类结果图
  - 安全区与危险区二值栅格图
  - 候选落点安全半径分布图
  - 局部坡面拟合与坡度可视化图
  - 参数扰动—结果灵敏度图
  pitfalls_avoided:
  - 避免在信息不足时直接求轨道平面和长轴空间位置：仅凭近远月点高度和预定落点无法唯一确定轨道方位，因此改用着陆轨迹水平位移逆推近月点。
  - 避免强行求解复杂非线性微分方程的解析解：变质量、引力、推力方向和径切向运动相互耦合，直接解析求解困难，因此采用小步长差分迭代进行数值仿真。
  - 避免默认推力始终与速度严格反向：该策略不能同时满足末端高度和速度约束，因此引入推力相对速度反方向的偏角，并通过轨迹簇筛选合适角度。
  - 避免把海拔高度与相对着陆点高度混用：预定落点海拔为负值，若基准不统一会造成阶段高度约束系统性偏差，因此统一采用相对于着陆点的高度。
  - 避免在短时着陆模型中堆叠影响很小的摄动项：月球自转、非球形引力、日月摄动和空气阻力在数百秒尺度内作用有限，忽略这些因素可控制模型复杂度并突出主要动力学。
  - 避免只按单个像素或单一平坦度选择落点：单点安全不能保证着陆器尺度范围内无障碍，因此使用栅格统计、最大安全半径和平均坡度共同判断。
  - 避免只追求地形最安全而忽略转移燃耗：远离当前投影位置的安全区会增加水平机动，因此综合安全半径、坡度和平移距离进行评价。
  - 避免直接对全程所有变量一次性联合优化：全程问题维度高、约束复杂且易陷入局部最优，因此按阶段和方向分解，并重点优化燃耗最大的主减速阶段。
  innovation_points:
  - 在准备轨道空间方位欠定的情况下，将主减速轨迹仿真与球面几何结合，通过着陆水平位移逆向确定近月点位置。
  - 把连续、变质量的非线性动力学方程离散为差分迭代，并通过推力偏角轨迹簇匹配末端状态，实现可计算的制导参数识别。
  - 采用序列化遗传算法分阶段优化控制变量，兼顾全局搜索能力和分段动力学模型的计算效率。
  - 将轨迹优化与月面图像分析耦合，把K均值聚类、栅格二值化、最大安全半径和坡面回归统一到落点决策流程中。
  - 构建兼顾地形安全裕度、坡度和平移燃耗的多指标落点评价体系，使粗避障和精避障与控制策略协同优化。
  - 通过相对误差与灵敏度分析识别推力角度控制的高敏感性，为实际控制中的精度分配和鲁棒性设计提供依据。
- id: B379_B-20001040-向航，王帆，郭树璇
  source_paper: B379 B379_B-20001040-向航，王帆，郭树璇
  problem_type: 分类聚类+优化
  keywords:
  - 碎纸片拼接复原
  - 旅行商问题
  - 误差评估匹配
  - 文字基线
  - 人机交互
  context: 针对单面或双面印刷文件经纵切、横纵交叉切割后形成的大量等尺寸矩形碎片，利用边缘像素与文字排版特征实现自动拼接复原。
  models:
  - name: 基于二值行匹配度的TSP模型
    role: 将仅纵切碎片视为节点，以相邻碎片右、左边缘的行匹配误差作为有向边权，将完整页面复原转化为遍历全部碎片的最短Hamilton回路问题。
    why: 纵切碎片边缘长度大、像素信息丰富，分行统计比仅比较边缘黑色像素总数更能保留文字行间差异，而TSP能够统一描述全局排序目标。
  - name: 基于匹配度的贪心排序算法
    role: 从左侧为空白边距的起始碎片出发，每次选择与当前碎片右边缘匹配度最大的候选碎片，直至碎片池为空。
    why: 仅纵切情形碎片数量较少且匹配度区分性较强，贪心算法计算简单、效率高，并在给定数据上获得了正确的全局拼接序列。
  - name: 基于改进误差评估的汉字拼接模型
    role: 利用碎片上下边缘黑白过渡距离进行逐行分组，再通过包含邻域像素加权信息的左右边缘误差函数完成中文碎片的组内排序与行间拼接。
    why: 汉字结构复杂、笔画密集且缺乏稳定统一的文字基线，需要综合上下边缘过渡特征和左右边缘邻域像素信息提高分组及拼接准确率。
  - name: 基于文字基线误差的英文拼接模型
    role: 提取英文印刷文字的基线和行位置特征，据此对交叉切割碎片进行分行聚类，并结合边缘误差完成行内与行间匹配。
    why: 英文字母通常具有较稳定的“四线三格”排版结构，基线能够有效反映字母的垂直位置，比直接套用汉字特征更具判别力。
  - name: 双面基线联合聚类与匹配模型
    role: 综合碎片正反两面的基线差值，对碎片进行配对聚类并同时确定正反方向，再将双面问题转化为单面RCCSTD的分行、行内和行间拼接问题。
    why: 双面碎片的两侧信息相互约束，联合利用正反面基线既能辅助确定碎片朝向，也能降低仅依赖单面边缘造成的误匹配风险。
  - name: GUI人机交互纠错模型
    role: 在自动分组或边缘匹配出现多个近似候选、疑似误判时展示候选拼接结果，由人工进行确认或调整。
    why: 空白区域、段首缩进和边缘信息不足可能使自动误差函数失去区分度，引入有限人工干预可利用视觉直觉提高结果的可靠性与完整性。
  solution_flow: 数据：读取碎片图像并二值化，提取左右边缘像素、上下边缘黑白过渡距离、文字行和英文基线等特征；模型：对仅纵切问题构建基于行匹配度的TSP模型，对横纵切问题先按中文过渡特征或英文基线进行分行聚类，对双面问题联合两面基线确定分组和方向；参数：设置文字行宽、黑白过渡距离容差、邻域像素权重和匹配阈值；求解：先依据页面空白边距识别左右边界碎片，再通过贪心匹配、组内排序和行间匹配获得完整序列，歧义位置调用GUI人工确认；验证：重构页面图像并检查碎片序列、文字行连续性、边缘误差及正反面方向一致性。
  validation: 将排序后的碎片直接重构为页面图像，并以文字、笔画、基线和页面边距是否连续作为直观检验；同时检查相邻碎片匹配度或误差评估值、各分组成员数量及行间上下边缘的一致性。对于自动算法给出的低置信度或近似候选，通过GUI展示局部拼接效果并由人工复核，从而验证和修正误判；仅纵切中英文数据均得到完整序列，也用于检验模型的跨语言适用性。
  visualization:
  - 拼接复原页面图
  - 碎片排序序列表
  - 算法流程图
  - 中英文字形与基线对比图
  - 局部碎片匹配示意图
  - 分组成员表
  - GUI候选拼接界面
  pitfalls_avoided:
  - 避免仅使用整条边缘的黑色像素总数评价纵切碎片，因为这种统计会抹去不同行文字分布的差异，导致总量相近但行位置不同的碎片被误判为相邻；论文改用逐行匹配度累加。
  - 避免对208张横纵切碎片直接进行全排列或全局TSP搜索，因为组合规模巨大且属于难以直接求解的NP类问题；论文先依据行特征聚类，再进行组内和行间匹配以缩小搜索空间。
  - 避免对中文和英文使用完全相同的分行标准，因为汉字缺乏固定基线，而英文具有稳定的基线排版结构；论文分别采用黑白过渡距离特征和英文文字基线。
  - 避免只依据左边界的11块碎片建立行分组，因为段首缩进会使左边界碎片出现大面积空白，与其真实右邻碎片差异显著，可能形成空组或错组；论文同时利用左右边界碎片建立22个候选组。
  - 避免在边缘信息很少时只比较单列像素，因为局部噪声或字符断笔会放大误差；论文在RCCSTD模型中引入相邻多列像素的加权误差评估。
  - 避免完全依赖自动算法处理空白块和近似候选，因为此类区域的数值特征区分度不足；论文在不确定节点设置GUI人工干预，而不是全程人工拼接。
  - 避免在双面文件中分别独立复原两面，因为独立处理无法利用同一实体碎片的方向约束；论文联合正反面基线差值进行聚类并同步确定朝向。
  innovation_points:
  - 将仅纵切碎片复原抽象为以行级边缘匹配度为权值的有向TSP问题，并结合空白左边距定位起点与贪心策略实现快速排序。
  - 针对中文与英文排版结构差异设计两套特征体系：中文采用上下边缘黑白过渡距离，英文采用文字基线误差，提高了分行聚类的针对性。
  - 在横纵切问题中采用“先分行聚类、再行内拼接、最后行间拼接”的分层求解框架，将大规模组合优化问题分解为多个可控子问题。
  - 构造融合当前边缘及相邻像素列的加权误差函数，相比单边缘像素比较能够利用更多局部图像信息。
  - 利用正反两面的基线差值同时完成双面碎片聚类与方向判定，将双面复原转化为成熟的单面交叉切割复原流程。
  - 将自动匹配与GUI人工纠错结合，只在低置信度和歧义节点引入人工判断，兼顾拼接效率、准确率与结果完整性。
- id: 814姜荣杰，朱佳亭，金建邦_814 姜荣杰 朱佳亭 金建邦
  source_paper: 814姜荣杰，朱佳亭，金建邦 814姜荣杰，朱佳亭，金建邦_814 姜荣杰 朱佳亭 金建邦
  problem_type: 优化+分类聚类
  keywords:
  - 旅行商问题
  - 匹配距离
  - 文本行特征
  context: 针对司法物证、历史文献修复和军事情报中的规则文字碎纸片，研究单面纵切、单面纵横切及双面纵横切碎片的自动拼接复原。
  models:
  - name: 基于哈密尔顿路径的开放旅行商拼接模型
    role: 用于确定单面纵切碎片的全局最优左右排列，并作为后续行内横向拼接和行间纵向拼接的基础模型。
    why: 每张碎片可视为图中的顶点，具有方向性的边界匹配距离可视为边权；完整拼接要求每个碎片恰好出现一次且无需回到起点，因此可转化为最小权哈密尔顿路径，即开放旅行商问题。
  - name: 基于文本行特征与双侧分组的二维分层拼接模型
    role: 用于复原单面纵横切碎片，先将碎片划分到不同文本行，再完成各行的横向排序和碎片行的纵向排序。
    why: 二维碎片直接进行整体排列的组合规模过大，而印刷文本具有稳定的行距和规整性；利用行距特征向量进行行分组后，可将二维拼接分解为多个规模较小的开放旅行商问题。
  - name: 双面联合匹配与双旅行商拼接模型
    role: 用于复原双面打印且纵横切割的碎片，同时利用正反两面的边界及文本信息确定行内和行间关系。
    why: 双面碎片的两面属于同一物理碎片，单独使用一面容易产生歧义；将正反面匹配距离联合计算，并以两条旅行商路径分别表示纸张两面，可利用双倍信息增强约束和拼接可靠性。
  - name: 边界碎片逐列搜索模型
    role: 识别纸张最左侧和最右侧的碎片，为开放路径确定起点、终点，并为文本行分组提供锚点。
    why: 印刷页面左右通常存在比字符间空白更宽的页边距，可通过逐列检查背景像素并逐步缩小候选集合，稳定地筛选边界碎片。
  - name: 文本行特征分类模型
    role: 依据碎片的行距特征向量，将可能处于同一水平行的碎片归入同一组。
    why: 中文字符较规整，英文文本具有相对稳定的基线和行距；将每个像素行编码为有字或留白特征，并通过特征向量异或距离衡量同行程度，能够把版面结构转化为可计算的分类依据。
  solution_flow: 数据：读入碎片图像并转换为像素矩阵，依据背景色和文字色提取左右边缘、上下边缘及文本行信息；模型：构造有向匹配距离矩阵，将碎片或拼接后的碎片行映射为完全图顶点，同时利用页边距识别左右边界碎片、利用行距特征完成行分组；参数：计算横向边界匹配距离、纵向匹配距离、文本行距匹配距离及分组梯度阈值，双面情形采用正反面距离之和；求解：将开放旅行商问题写成带出入度约束、0-1约束和子回路消除约束的整数规划，由
    MATLAB 完成图像处理和结果重排，由 LINGO 通过分支定界求解；验证：按求得序列重构整页图像，检查边界留白、文字行连续性、行距一致性及正反面对应关系，必要时对少数异常位置进行人工调整。
  validation: 采用结构约束与复原效果相结合的验证方式：首先检查每张碎片是否恰好使用一次、路径是否不存在子回路、起终点是否对应页面左右边界；其次对复原图进行视觉检查，观察字符笔画在接缝处是否连续、文本行是否对齐、行距是否一致；最后比较不同附件的人工干预次数，附件1、2、3及双面附件5无需人工干预，附件4仅在行分组后的横向拼接阶段偶尔调整个别碎片，以此评价模型的自动化程度和稳健性。
  visualization:
  - 碎片完全图与最小权哈密尔顿路径示意图
  - 不同边界匹配程度对比图
  - 中英文文本行特征向量示意图
  - 左右双侧行分组流程图
  - 碎片复原结果图
  pitfalls_avoided:
  - 避免把拼接问题直接建成闭合旅行商回路，因为纸张左右边界不相邻，强制回到起点会引入一条无实际意义的边；采用开放哈密尔顿路径并通过页边距确定起终点更符合物理结构。
  - 避免仅设置每个顶点一入一出约束，因为这可能产生多个彼此独立的子回路而非完整拼接序列；模型加入子回路消除约束，保证所有碎片形成一条整体路径。
  - 避免使用对称距离，因为碎片j接在碎片i右侧与碎片i接在碎片j右侧并非同一关系；采用有方向的右边缘到左边缘匹配距离保留拼接方向。
  - 避免直接对全部二维碎片进行一次超大规模排列，因为其组合复杂度极高且容易混淆同行与跨行关系；先按文本行特征分组，再分别执行行内和行间优化，可显著降低求解规模。
  - 避免仅从页面单侧进行行分组，因为段落首行缩进和段尾留白可能使某些分组在达到整行碎片数前提前终止；采用左、右页边距碎片分别作为锚点并融合双侧分组结果。
  - 避免对中英文文本机械使用同一行特征提取规则，因为英文字符存在上下伸部且规整性弱于中文；中文采用逐像素行有字或留白编码，英文则结合基线和行距统计进行特征填充。
  - 避免在双面复原中只利用单面边缘信息，因为局部留白或相似文字会造成匹配歧义；联合正反两面的匹配距离，并用双旅行商路径表达两面的同步结构。
  innovation_points:
  - 将规则碎纸片的排列复原统一抽象为带方向匹配距离的最小权哈密尔顿路径，实现由局部图像匹配到全局组合优化的转换。
  - 利用印刷文本的行距规整性构造二值行特征向量，并以异或结果衡量同行匹配程度，实现二维碎片的自动行分组。
  - 提出从页面左右边界同时向中间进行分组并融合结果的策略，降低首行缩进、段尾留白对分组完整性的影响。
  - 采用分层求解思想，将纵横切二维拼接分解为多个行内开放旅行商问题和一个行间开放旅行商问题，兼顾计算效率与全局排序质量。
  - 在双面碎片复原中引入正反面联合匹配距离和双旅行商结构，使两面信息相互校验，提高自动拼接的准确性并减少人工干预。
- id: 2016_A194
  source_paper: 2016 2016_A194
  problem_type: 优化+仿真
  keywords:
  - 受力平衡
  - 力矩平衡
  - 二分法
  - 系泊系统设计
  context: 在风、海流和水深变化条件下，通过设计锚链型号与长度及重物球质量，控制浮标吃水深度、游动半径、钢桶倾角和锚点安全角度。
  models:
  - name: 多刚体受力平衡模型
    role: 分别建立浮标、钢管、钢桶、重物球和离散锚链在水平与竖直方向上的静力平衡方程，递推计算各节点拉力。
    why: 系泊系统研究的是外载荷作用下的稳态构型，各组成部分在稳态时必须满足水平和竖直方向合力为零。
  - name: 刚体力矩平衡模型
    role: 以构件端部节点为参考点建立钢管、钢桶和每节锚链的力矩平衡方程，求取各构件与水平面的夹角。
    why: 仅使用受力平衡无法唯一确定刚性构件的空间姿态，加入力矩平衡后才能计算钢管、钢桶和锚链的倾角。
  - name: 离散锚链递推模型
    role: 将锚链离散为相互连接的短刚性单元，逐节递推拉力、方向角和位置，并累加水平及竖直投影得到锚链形状、游动半径和系统高度。
    why: 离散化能够统一描述钢管、钢桶和锚链的受力传递，同时便于在 MATLAB 中进行数值迭代和绘制锚链构型。
  - name: 风载荷与水流载荷模型
    role: 依据迎风或迎流投影面积以及速度平方关系计算浮标、钢管、钢桶和锚链承受的水平环境载荷，并将水流力加入原静水模型。
    why: 问题包含最高风速和流速条件，环境载荷是决定系统水平拉力、构件倾角及游动范围的主要因素。
  - name: 几何闭合约束模型
    role: 累加各构件长度的竖直投影并加上浮标吃水深度，使计算高度等于实际水深；累加水平投影得到浮标游动半径。
    why: 受力与力矩方程给出局部姿态后，还必须通过整体水深约束保证各构件组成的系泊构型在几何上闭合。
  - name: 二分搜索模型
    role: 以浮标吃水深度为搜索变量求解给定水深下的稳态构型，并用于逼近满足钢桶倾角和锚链锚点角约束的重物球质量。
    why: 计算水深随吃水深度呈单调变化，二分法比等步长搜索收敛更快，且能稳定获得满足误差要求的数值解。
  - name: 控制变量与遍历优化模型
    role: 先分别分析锚链型号、长度和重物球质量对系统性能的影响，再以锚链长度和重物球质量为决策变量搜索可行设计。
    why: 设计变量包含离散的锚链型号和连续或准连续的长度、质量，采用控制变量法筛选型号后再遍历优化可降低搜索复杂度。
  solution_flow: 数据→整理浮标、钢管、钢桶、重物球和各型号锚链的尺寸、质量、密度以及风速、流速、水深数据→建立风力、浮力、水流力、重力及拉力模型→对各构件建立受力平衡、力矩平衡和离散递推方程→以吃水深度为参数，通过几何闭合条件和二分法求给定水深下的稳态姿态→计算构件倾角、锚链形状、吃水深度和游动半径→将钢桶倾角不超过5度、锚点锚链角不超过16度作为约束，筛选锚链型号并搜索锚链长度与重物球质量→在16至20米水深、36米每秒风速和1.5米每秒流速等工况下进行仿真→通过替换力矩参考点和重复优化计算验证结果。
  validation: 采用双重验证：首先分别以上、下端节点作为力矩参考点重新建立力矩平衡方程，比较问题1和问题2的倾角、吃水深度及游动半径，结果一致；其次对问题3得到的锚链长度和重物球质量重新进行可行域搜索与最优化检验，并在16米和20米边界水深及最大风流载荷下检查钢桶倾角和锚点角约束是否满足。
  visualization:
  - 系统结构与分构件受力示意图
  - 吃水深度—海水深度关系曲线
  - 锚链构型曲线
  - 不同风速与水深下指标对比表
  pitfalls_avoided:
  - 避免只建立合力平衡而忽略力矩平衡，因为刚性钢管、钢桶和锚链单元的拉力方向通常不与构件轴线重合，仅靠水平和竖直受力方程无法确定构件姿态。
  - 避免直接指定浮标吃水深度，因为吃水深度同时影响浮力、迎风面积和系统几何高度；将其作为搜索变量并用实际水深闭合，可防止得到受力成立但几何不闭合的伪解。
  - 避免把锚链简化为单一直杆，因为锚链自重和浮力会使各链节张力方向逐节变化；采用离散链节递推才能描述锚链形状及锚点处切线角。
  - 避免只校核平均工况，因为钢桶倾角和锚点角的控制工况可能出现在不同水深边界；设计时分别在16米浅水条件和20米深水条件下检查关键约束。
  - 避免忽略重物球与锚链的浮力，因为水下有效重力小于空气中的重量，若直接使用名义质量对应的重力会高估下拉作用并导致重物球质量设计偏小。
  - 避免在问题3中沿用纯风载模型，因为海流会同时作用于浮标、钢管、钢桶和锚链；将水流力纳入各构件水平载荷可减少极端海况下的安全性误判。
  innovation_points:
  - 将浮标、钢管、钢桶、重物球和离散锚链统一到受力平衡、力矩平衡与节点递推框架中，可同时输出局部构件倾角和整体锚链构型。
  - 利用吃水深度与系统计算高度之间的单调关系构造二分求根，把复杂的多构件稳态求解转化为稳定的一维闭合搜索。
  - 采用离散型号筛选与连续参数搜索相结合的分层设计方法，先用控制变量法确定锚链型号，再联合修正锚链长度和重物球质量。
  - 针对潮汐水深区间设置边界工况约束，以浅水工况控制钢桶倾角、深水工况控制锚点角，使设计能够覆盖最不利风流环境。
- id: 2013_B506
  source_paper: 2013 2013_B506
  problem_type: 分类聚类+优化
  keywords:
  - 碎纸复原
  - TSP路径优化
  - 分类降维与模拟退火
  context: 针对纵横切割及双面打印文件的矩形碎纸片，利用图像文字特征、分类降维和路径优化实现原始页面的自动或半自动拼接复原。
  models:
  - name: 碎纸距离模型
    role: 根据相邻碎片左右边界识别序列的吻合程度，量化碎片之间的有向拼接代价。
    why: 碎片外形均为规则矩形，轮廓特征缺乏区分度，而字符宽度、行距、字距及边界残缺字符等文字特征能够有效反映相邻关系。
  - name: 复原TSP模型
    role: 将每张碎纸视为节点、碎纸距离视为边权，把拼接顺序搜索转化为总相邻距离最小的哈密顿路径优化问题。
    why: 完整复原要求每张碎片恰好使用一次，并使所有相邻碎片的累计不吻合度最小，与开放式旅行商路径问题的结构一致。
  - name: 模拟退火优化模型
    role: 通过二次交换、三次交换等邻域扰动搜索碎纸排列，近似求解复原TSP模型。
    why: 碎片排列空间随数量呈阶乘增长，属于NP难组合优化问题；模拟退火能够以概率接受劣解，降低陷入局部最优的风险，并且对初始排列依赖较弱。
  - name: 层次特征分类降维模型
    role: 提取文字层起止位置等纵向层次特征，将二维碎片划分为若干行特征相同的类别，再分别转化为一维拼接问题。
    why: 二维切割使单片文字特征显著减少，同时节点数由19增至约208，直接进行全局TSP搜索复杂度过高；先分类可把大规模二维问题分解为多个小规模一维问题。
  - name: 双面碎纸整合与降维模型
    role: 将同一物理碎片的正反面图像整合为三维碎纸对象，利用正反面的层次特征辅助分类，并沿用二维复原流程完成双面页面拼接。
    why: 双面信息增加了判别维度，但在正反面页边距和排版格式一致的假设下，两面的层次结构可以提供互补约束并支持降维。
  - name: 最小干预度评价模型
    role: 以计算机识别顺序与最终复原顺序之间的序列逆序数，刻画需要人工调整的最少次数。
    why: 二维及双面复原需要人工校正，仅报告最终图像无法量化自动化程度；逆序数可以把人工干预成本转化为可比较的数值指标。
  solution_flow: 数据：导入碎片图像并形成像素矩阵，完成二值化、字符层与空白层标准化，并修正特殊字符造成的伪分层；模型：提取字符宽度、字距、行距、上下空白和文字层起止位置，构造左右边界识别序列及碎纸有向距离，对二维和双面碎片先按层次特征分类降维，再建立各类别的复原TSP模型；参数：中文字符尺度取约40×40像素、英文字符尺度取约30×30像素，模拟退火初温97、终温3、衰减系数0.9、马尔可夫链长度10000；求解：利用模拟退火和序列交换搜索最小距离排列，一维直接拼接，二维拆分为11个一维问题，双面先整合正反面后按相同方法求解，对机器无法分类或错拼的少量碎片通过GUI辅助人工校正；验证：生成复原图像和碎片顺序表，检查文字、行距及页面结构的连续性，并用人工校正情况和序列逆序数评价自动复原效果。
  validation: 采用结果可视化与结构一致性相结合的验证策略：将优化得到的序列重新拼接成完整页面，检查相邻边界字符是否闭合、文字行是否连续、行距及上下空白是否一致；一维结果以无需人工干预且复原文本连续作为有效性证据，二维和双面结果通过分类后拼接、GUI人工复核及最终顺序表进行校验；同时提出用机器顺序与最终确认顺序之间的逆序数衡量最小人工干预量，以比较算法的自动化程度。
  visualization:
  - 碎片二值化与标准化对比图
  - 文字层次特征提取示意图
  - 碎片边界识别序列与字符分割示意图
  - TSP拼接路径示意图
  - GUI碎片对比分类界面
  - 复原页面拼接图与碎片顺序表
  pitfalls_avoided:
  - 避免直接使用规则矩形碎片的外轮廓进行匹配，因为所有碎片形状和尺寸近似一致，轮廓无法提供足够的相邻关系辨识信息，故改用文字及排版特征。
  - 避免对约208个二维碎片直接建立并求解全局TSP，因为排列空间呈阶乘增长且单片特征仅约为一维情形的十一分之一，容易造成计算量爆炸和匹配精度下降，故先按文字层次分类降维。
  - 避免特殊英文字母内部空白导致文字层数量被错误增加，因为这会使层次特征提取和行分类发生偏差，故在标准化后将相关字符中间的伪空白行进行修正。
  - 避免仅依赖自动分类处理低信息碎片，因为大面积空白或文字残缺会使层次特征不足、类别不可判定，故将未分类碎片集中后通过GUI与已知类别逐一比较。
  - 避免把碎纸排列建模为必须返回起点的标准闭合TSP回路，因为页面拼接具有明确的左端和右端，不需要末片与首片相连，实际目标采用相邻距离之和最小的开放路径。
  - 避免只展示最终复原图片而忽略人工参与程度，因为经过较多人工调整也可能得到正确结果，故引入最终顺序与机器顺序的逆序数评价最小干预量。
  innovation_points:
  - 利用残缺字符宽度、字距、行距和上下空白构造边界识别序列，并据此定义具有方向性的碎纸距离，将视觉拼接问题转化为可计算的组合优化问题。
  - 提出“分类降维—类内一维复原—人工精校”的分层求解框架，把二维和双面碎纸的大规模搜索拆分为多个较小的TSP问题。
  - 将机器识别与GUI辅助人工判别结合，对自动方法难以处理的低信息碎片进行高效复核，在自动化效率与复原准确性之间取得平衡。
  - 以排列逆序数定义最小人工干预度，使碎纸复原算法不仅能评价最终正确性，还能量化其自动化水平和人工校正成本。
- id: B_cumcm0753
  source_paper: B B_cumcm0753
  problem_type: 优化
  keywords:
  - 公交网络最优路径
  - 邻接矩阵
  - 动态规划
  context: 面向城市公交自主查询系统，在公汽、地铁及步行等出行方式组成的网络中，为不同换乘偏好和票价敏感度的乘客选择最佳路线。
  models:
  - name: 乘客分类与分层决策模型
    role: 依据乘客对换乘次数、出行耗时和票价的敏感程度划分四类人群，并为各类人群确定相应的路线选择准则。
    why: 不同乘客的出行偏好存在明显差异，统一使用单一加权目标难以体现换乘优先、时间优先及票价敏感性，因此需要先分类再优化。
  - name: 站点信息矩阵模型
    role: 记录各线路上行、下行方向的站点归属及站序，为判断可乘线路、行驶方向、站间隔和换乘站提供基础数据。
    why: 公交线路具有方向性且可能包含环线，仅使用无序站点集合无法正确计算可达性和乘车站数，矩阵化表示便于程序检索与计算。
  - name: 线路邻接矩阵与布尔可达矩阵模型
    role: 将公交线路抽象为节点，以共同停靠站表示线路邻接关系，并通过邻接矩阵的布尔幂确定多次换乘可达性和最少换乘次数。
    why: 线路层面的图规模通常小于站点层面的图规模，可先快速筛选满足换乘约束的线路序列，降低路线搜索复杂度。
  - name: 最少换乘约束下的时间—票价优化模型
    role: 针对换乘敏感的人群，先将换乘次数固定为全局最小值，再最小化出行时间；对票价敏感者，将票价折算为时间后加入目标函数。
    why: 该模型以约束方式保持“换乘次数第一、耗时第二”的优先级，避免普通加权求和因权重选择不当而得到换乘较多的路线。
  - name: 换乘承受上限约束下的时间—票价优化模型
    role: 针对时间更敏感的人群，将换乘次数限制在心理承受上限以内，并在可行路线中最小化耗时或耗时与票价折算时间之和。
    why: 时间敏感乘客不一定选择换乘次数绝对最少的路线，只要换乘次数可接受，就可能通过增加换乘缩短总出行时间。
  - name: 票价时间价值转换模型
    role: 利用法定年工作天数、票价和居民年均收入，将货币费用折算为具有相同量纲的时间成本。
    why: 票价与出行时间量纲不同，直接相加缺乏解释性；转换后可形成统一的广义出行成本，同时通过零一参数控制是否考虑票价。
  - name: 基于换乘阶段的动态规划模型
    role: 在已知任意站点间步行时间时，以换乘次数为阶段、站点为状态、到达状态的最少时间为状态变量，递推获得字典序意义下的最少换乘和最短耗时路线。
    why: 加入站间步行后可选连接显著增加，直接枚举路线容易产生组合爆炸；动态规划能够复用子问题结果，并通过优先更新终点状态和提前终止降低计算量。
  solution_flow: 数据：整理公汽、地铁线路的上下行站序、票制票价、相邻站运行时间、换乘时间及站间步行时间；模型：构造站点信息矩阵和线路邻接矩阵，利用布尔矩阵幂判断可达性与最少换乘次数，并按四类乘客建立分层优化目标；参数：设定公汽相邻站平均行驶时间、不同交通方式换乘时间、换乘心理承受上限、票价时间价值系数及票价敏感开关；求解：先生成满足最少换乘或换乘上限的线路序列和中转站组合，再计算站间隔、车内时间、换乘时间、票价及广义出行成本并选取最优路线，加入步行后采用分阶段动态规划递推；验证：对题目给定的六组起终点分别在仅公汽和公汽加地铁场景下求解，检查路线连通性、方向合法性、换乘次数约束及目标值最优性，并比较四类乘客所得方案。
  validation: 采用案例验证与一致性校验相结合的策略：将六组指定起终点作为测试集，逐段核对推荐路线是否经过对应站点、上下行方向是否正确、换乘站是否为相邻线路的公共站点；用邻接矩阵布尔幂核验最少换乘次数，用站序差或环线站间隔公式复算乘车站数，再独立汇总车内时间、换乘时间和票价成本；同时比较候选路线，确认最少换乘型方案不存在换乘更少的可行路线，换乘上限型方案不存在约束范围内成本更低的路线，并通过公汽与公汽加地铁两种场景的结果对比检验模型扩展性。
  visualization:
  - 公交线路—换乘关系网络图
  - 不同乘客类型候选路线的换乘次数与广义耗时对比图
  pitfalls_avoided:
  - 避免将换乘次数、时间和票价简单地无差别加权：换乘次数具有明确的优先级或心理上限，若仅靠权重求和，可能因权重设定不稳而选出换乘更多但时间略短的不符合偏好的路线，因此将其设置为最小换乘约束或承受上限约束。
  - 避免忽略公交线路的上下行方向：两站同属一条线路并不代表在给定方向上可以直接到达，使用上下行站点信息矩阵和有向站序计算可防止产生逆向乘车的伪可行路线。
  - 避免用普通站序差处理环线：环线站点可能在站序中重复出现，直接相减会得到负数或错误站数，因此引入环路起始站偏移量和环路总站数，采用取模公式计算有向站间隔。
  - 避免直接比较不同量纲的票价和时间：将金额直接加入分钟数没有实际意义，因此基于收入与工作时间将票价转换为时间价值，并用零一参数区分票价敏感和不敏感人群。
  - 避免在完整站点路径空间中盲目枚举：公交网络规模大且换乘组合多，直接搜索易发生组合爆炸，因此先在线路层面通过邻接矩阵筛选可达线路序列，并使用换乘上限、动态规划和终点优先更新进行剪枝。
  innovation_points:
  - 将乘客心理偏好转化为四种可计算的路线选择原则，采用“换乘优先的字典序优化”和“换乘上限内的广义时间优化”两类结构，而不是使用一套固定权重服务所有乘客。
  - 建立从站点信息矩阵到线路邻接矩阵、布尔可达矩阵再到候选路线评价的分层求解框架，以较小的线路网络先处理换乘可达性，再计算具体站点路径成本。
  - 通过时间价值方法统一票价与耗时的量纲，并利用票价敏感参数在同一模型中兼容不同人群需求。
  - 针对任意站点间允许步行的扩展场景，设计以换乘次数为阶段的动态规划，并采用终点状态优先转移和满足最优条件后提前停止的策略降低求解复杂度。
- id: B16046004_程双泽_李君昌_陈凌勤_B16046004_程双泽_李君昌_陈凌勤
  source_paper: B16046004_程双泽_李君昌_陈凌勤 B16046004_程双泽_李君昌_陈凌勤_B16046004_程双泽_李君昌_陈凌勤
  problem_type: 优化+仿真
  keywords:
  - 直纹曲面
  - 多目标优化
  - 参数方程
  context: 针对可由平板折叠成形的创意桌，建立几何与优化模型以描述动态折叠过程，并确定满足稳固、易加工和省材料要求的设计加工参数。
  models:
  - name: 空间几何参数化直纹曲面模型
    role: 利用木条铰链、钢筋和桌腿之间的空间几何关系，建立折叠桌侧面在不同折叠角度下的参数方程及直接方程。
    why: 折叠桌侧面由各根木条运动形成直纹曲面，采用参数u描述木条纵向位置、参数v描述横向位置，能够自然表达曲面生成机制和连续动态变化。
  - name: 桌脚边缘线模型
    role: 在直纹曲面参数方程中令木条纵向参数u等于板材长度的一半，提取桌腿末端形成的空间边缘曲线。
    why: 桌脚边缘是直纹曲面的特定参数曲线，该处理可直接由统一曲面模型得到桌脚形状，并用于判断桌腿相交、触地和外观符合程度。
  - name: 开槽长度与铰链位置几何模型
    role: 根据桌面圆周、木条长度、钢筋位置及折叠前后钢钉位置，计算各木条的桌面段长度、桌腿段长度、开槽上下界和空槽长度。
    why: 加工参数均由折叠前后对应点之间的距离决定，利用勾股关系和空间向量长度可将结构运动准确转化为可直接生产的尺寸参数。
  - name: 约束多目标优化模型
    role: 以板材长度最短和总开槽长度最短为目标，优化折叠角、钢筋初始位置和板材长度等设计变量。
    why: 用材最少与加工方便是相互关联且可能冲突的目标，同时设计还受到槽长、桌腿不相交、非中心桌腿不触地和稳固性等多项约束，适合采用多目标约束优化。
  - name: 离散木条动态折叠仿真模型
    role: 计算不同折叠角度下铰链点、钢钉点和桌腿末端点的坐标，并连接对应点生成折叠过程示意图。
    why: 实际桌体由有限根木条组成，将连续曲面离散为木条节点和线段，既符合产品结构，也便于使用Matlab展示至少多个时刻的动态变化。
  - name: 一般桌面与一般板材形状推广模型
    role: 将圆形桌面、长方形板材对应的几何表达推广到任意桌面边缘线、桌脚边缘线和板材轮廓，用于创意折叠桌设计。
    why: 软件需要响应客户自定义形状，参数化边界与统一优化框架能够复用圆桌模型的建模逻辑，并生成正方形桌、8字形桌等特殊方案。
  solution_flow: 输入桌高、桌面直径或自定义边缘线、木条宽度及板材约束→建立以桌面中心为原点的空间坐标系并离散木条→由铰链点、钢筋点和桌腿末端点的几何关系建立直纹曲面参数方程→推导桌脚边缘线、铰链位置、桌腿长度及各木条开槽长度→以折叠角θ、钢筋位置s和板材长度L为决策变量建立板材最短与总槽长最短的多目标优化模型→加入槽不越界、折叠过程桌腿不相交、非中心桌腿不触地及稳固性约束→使用Matlab数值求解最优参数→代回几何模型生成加工尺寸和多角度动态折叠图→检查几何尺寸、约束可行性及目标形状接近程度。
  validation: 采用几何一致性与数值仿真相结合的验证策略：首先将最优参数代回高度关系、圆周关系、木条长度关系和曲面方程，检查桌高、桌面尺寸及端点坐标是否一致；其次逐根检查开槽长度和上下界是否位于木条有效范围内；再对多个折叠角度进行离散仿真，检查桌腿边缘是否相交、非中心木条是否提前触地以及钢筋是否保持平行运动；最后通过不同视角的桌脚边缘线和动态构型图进行可视化合理性检验。
  visualization:
  - 三维直纹曲面图
  - 桌脚边缘空间曲线图
  - 多视角折叠桌结构图
  - 多时刻动态折叠过程示意图
  - 木条编号与加工尺寸表
  pitfalls_avoided:
  - 避免直接把桌侧面当作简单圆柱面或圆锥面，因为各木条的铰链位置和转动长度不同，真实侧面应由木条母线生成的直纹曲面描述。
  - 避免只计算最终桌子状态而忽略折叠中间过程，因为桌腿可能在运动途中发生相交，即使最终构型满足尺寸要求也可能无法实际展开。
  - 避免仅以板材最短作为单一目标，因为过度压缩板长可能导致总开槽长度增大、加工困难或结构稳定性下降，因此同时考虑用材和加工目标。
  - 避免将所有木条采用相同铰链位置和槽长，因为圆形桌面对应的弦长随横向位置变化，各木条桌面段、桌腿段和滑动距离必须分别计算。
  - 避免忽略桌面厚度对有效桌高的影响，因为题设高度包含板厚，计算腿部竖直高度时应扣除桌面厚度，否则折叠角会产生系统误差。
  - 避免只给连续曲面而不给离散加工参数，因为生产对象是有限宽度的木条，必须将连续坐标映射为逐根木条的铰链位置、槽长及槽上下界。
  innovation_points:
  - 用两个几何参数统一描述平板材料上的原始位置与折叠后的空间位置，从而同时获得折叠桌侧面直纹曲面、桌脚边缘线和动态构型。
  - 将产品外形设计与制造参数优化耦合，在同一框架内联合确定折叠角、钢筋位置、板材长度、铰链位置和逐根木条开槽尺寸。
  - 通过固定纵向参数从曲面模型中直接提取桌脚边缘线，使外观曲线、触地约束和稳定性分析能够共享同一套空间几何表达。
  - 将圆形桌面和长方形板材模型推广到任意边缘形状，并结合多目标优化生成正方形、8字形等创意折叠桌，为参数化设计软件提供通用模型基础。
- id: 'A23022014_杜磊_江启文_汪鑫_A23022014_杜磊_江启文_汪鑫 '
  source_paper: 'A23022014_杜磊_江启文_汪鑫 A23022014_杜磊_江启文_汪鑫_A23022014_杜磊_江启文_汪鑫 '
  problem_type: 优化+仿真
  keywords:
  - 软着陆轨道设计
  - 三维动力学模型
  - 参数优化
  - 避障选址
  - 敏感性分析
  context: 在发动机推力、燃料、阶段状态和月面地形等约束下，为嫦娥三号设计从椭圆准备轨道到月面安全着陆点的低燃耗轨道与六阶段控制策略。
  models:
  - name: 简化抛物线下降模型
    role: 根据近月点至主减速结束点的高度和速度条件估算水平位移，确定近月点候选空间范围。
    why: 先用低复杂度模型缩小近月点搜索域，可避免直接在大范围连续空间内进行高成本优化。
  - name: 高斯-克吕格坐标转换模型
    role: 将着陆区域的平面投影坐标转换为月面经纬度坐标，用于表达近月点候选区域。
    why: 动力学计算、地形图和最终轨道结果使用的坐标体系不同，需要统一空间位置表达。
  - name: 月球经纬坐标与月心直角坐标转换模型
    role: 将经纬度和高度转换到月心惯性坐标系，为轨道位置、速度方向和三维动力学计算提供初始状态。
    why: 经纬坐标便于描述月面位置，但矢量动力学和轨道几何关系更适合在月心直角坐标系中处理。
  - name: 二维极坐标动力学最优控制模型
    role: 在近月点、着陆点与月心构成的平面内描述径向速度、角速度、位置和质量变化，并以燃料消耗最少确定最优近月点。
    why: 近月点初选阶段可利用近似共面运动降低模型维数，同时保留月球引力、推力方向、推力大小和质量损耗等主要因素。
  - name: 分段常值控制参数化优化模型
    role: 将连续推力及推力角控制函数离散为多个时间段的参数，把动态最优控制问题转化为静态非线性参数优化问题。
    why: 连续最优控制问题直接求解困难，控制参数化后可使用成熟优化算法，并通过增加时间分段数逐步提高解的精度。
  - name: 椭圆轨道能量守恒与开普勒面积定律模型
    role: 计算15千米近月点和100千米远月点的速度大小，并结合椭圆几何关系确定远月点位置及速度方向。
    why: 着陆准备轨道可近似为二体椭圆轨道，机械能守恒和角动量守恒能够直接刻画近、远月点状态。
  - name: 三维月固坐标动力学模型
    role: 描述六阶段软着陆过程中的三维位置、速度、推力、月球引力、自转影响和质量消耗，生成实际着陆轨道与控制量。
    why: 真实下降过程受到姿态调整、横向机动和地形避障影响，并不严格位于同一平面，必须用三维模型提高轨道与控制策略的可信度。
  - name: 分阶段多目标轨迹优化模型
    role: 分别为主减速、快速调整、粗避障、精避障和缓速下降设置燃料最少、飞行距离最短、水平速度归零和末速度归零等阶段目标与约束。
    why: 六个阶段承担的任务不同，单一全程目标难以同时准确描述减速、姿态调整、避障和垂直软着陆要求。
  - name: 数字高程图边缘检测与危险像素筛选模型
    role: 将相对高程大于50米的像素标记为危险区域，识别大型陨石坑边缘，并通过螺旋搜索确定粗避障安全区中心。
    why: 高程阈值与边缘信息能够快速识别大尺度地形障碍，适合在较高高度完成候选着陆区的初步筛选。
  - name: 安全坡度筛选与螺旋搜索模型
    role: 根据局部高程差计算月面坡度，排除坡度过大或存在细小障碍的区域，对粗选着陆点进行精确修正。
    why: 仅依靠高程阈值可能遗漏局部陡坡和小型障碍，坡度约束能够进一步保证着陆器接地稳定性。
  - name: 悬停与垂直缓速下降模型
    role: 在避障和最终下降阶段控制水平速度趋近于零，并沿月心方向进行竖直匀减速运动直至末速度为零。
    why: 悬停便于完成地形观测和着陆点修正，垂直缓降可减少接地时的横向速度及倾覆风险。
  - name: 误差转移矩阵模型
    role: 将近月点位置、速度等初始状态误差传播到最终着陆点，判断误差影响的数量级。
    why: 线性化误差传播能够在大规模扰动仿真前快速识别误差放大情况，并检验控制策略的基本稳定性。
  - name: 参数扰动与敏感性分析模型
    role: 对近月点初始状态施加5%波动，并改变初始质量、比冲和最大推力，观察着陆误差、推力及控制角变化。
    why: 实际任务存在导航误差和参数不确定性，扰动试验可评估方案鲁棒性并识别需要重点标定或控制的敏感参数。
  solution_flow: 输入月球半径与重力参数、15千米/100千米准备轨道高度、探测器初始质量、发动机推力范围、比冲、预定着陆点及数字高程图；先用简化抛物线模型估算下降水平距离，经坐标转换得到近月点候选区域；建立二维动力学与燃料最少目标，将推力和推力角分段参数化，优化得到近月点，并利用椭圆轨道定律和几何关系求远月点及近远月点速度；再在月心惯性系和月固系中建立三维动力学模型，按准备轨道、主减速、快速调整、粗避障、精避障和缓速下降六阶段设置状态约束与控制目标；读取数字高程图，通过危险像素边缘检测、坡度筛选和螺旋搜索逐级修正着陆点；数值积分并迭代优化推力大小和方向，获得三维轨迹、燃料消耗及阶段控制策略；最后使用误差转移、5%初始状态扰动和关键参数敏感性分析验证轨道精度与鲁棒性。
  validation: 先构造误差转移矩阵，将近月点位置与速度误差传播至最终着陆点，检查输出误差是否仍处于可接受的同一数量级；随后对近月点初始状态施加不超过5%的波动，重复仿真并检验着陆点是否保持在目标区域附近；最后分别扰动初始质量、发动机比冲和最大推力，比较轨迹、推力曲线、姿态角和燃料消耗变化。结果表明初始质量与比冲较敏感，而最大推力不低于4900牛顿时对模型结果影响相对较小。
  visualization:
  - 简化抛物线下降轨迹图
  - 近月点候选区域与虹湾着陆区示意图
  - 月心极坐标系与三维惯性坐标系示意图
  - 三维软着陆轨迹图
  - 数字高程图与危险区域边缘图
  - 安全坡度分布及螺旋搜索路径图
  - 各阶段推力随时间变化曲线
  - 推力方向角随时间变化曲线
  - 参数扰动—着陆误差敏感性曲线
  pitfalls_avoided:
  - 避免直接在整个月面或无限多个可行近月点中进行全局优化；先用抛物线近似确定候选环带，可显著降低搜索维度、计算量和陷入无效区域的概率。
  - 避免把真实软着陆全过程强行限制在二维平面内；二维模型仅用于近月点初选，正式轨迹采用三维动力学，从而纳入横向机动、姿态调整和月球自转等影响。
  - 避免只依据椭圆轨道几何关系确定速度；同时使用能量守恒和开普勒面积定律，保证近月点与远月点速度满足轨道动力学一致性。
  - 避免直接优化无限维连续控制函数；通过分段常值参数化将其转化为有限维参数优化，并增加时间分段数改善控制解精度。
  - 避免用单一燃料最少目标描述全部六阶段；快速调整、避障和末端下降分别设置距离、速度、安全地形及末状态约束，防止得到节省燃料但无法安全着陆的轨迹。
  - 避免仅凭预定经纬度选择着陆点而忽略真实地形；利用数字高程、危险像素边缘和坡度进行粗细两级筛选，降低落入陨石坑或陡坡的风险。
  - 避免仅用高度阈值判断安全区；增加局部坡度筛选可识别高程变化不大但倾斜度过高的区域，改善接地稳定性。
  - 避免只报告理想参数下的单次最优解；通过误差传播、初始状态扰动和参数敏感性分析检验方案在导航误差及设备参数波动下的可靠性。
  innovation_points:
  - 采用“简化抛物线预筛选—二维燃耗优化—三维分阶段轨迹优化”的分层建模框架，在控制计算规模的同时逐步提高物理真实性。
  - 将连续最优控制问题参数化为分段常值推力与推力角优化问题，并通过增加时间分段数获得更高精度的近似控制解。
  - 把边缘检测用于粗避障、把安全坡度筛选用于精避障，并结合螺旋搜索形成由大尺度陨石坑识别到局部地形安全判定的两级选址机制。
  - 使用误差转移矩阵进行数量级预检，再开展5%状态扰动和关键设备参数敏感性仿真，形成由快速线性分析到数值鲁棒性验证的多层检验方案。
- id: 2023_B311
  source_paper: 2023 2023_B311
  problem_type: 优化+仿真
  keywords:
  - 几何分析与解三角形
  - 递推法
  - 多目标规划主要目标法
  context: 针对不同海底坡度与地形条件，设计多波束测深测线，使测深条带尽可能完整覆盖海域，同时控制重叠率并缩短测线总长度。
  models:
  - name: 斜坡海底覆盖宽度几何模型
    role: 建立海水深度、测线位置、换能器开角、海底坡度与测深条带覆盖宽度之间的函数关系。
    why: 多波束声束边界与斜坡海底构成明确的三角几何关系，可利用三角函数和正弦定理得到解析表达式，为重叠率计算和测线优化提供基础。
  - name: 相邻条带重叠率双模型
    role: 分别按坡面投影距离和相邻条带两侧半宽之和定义重叠率，并通过几何作图比较后选取第二种模型。
    why: 平坦海底的重叠率公式不能直接照搬到斜坡海底，必须明确测线间距和覆盖宽度的实际几何含义；模型二直接使用前一条带后半宽与后一条带前半宽，更符合真实重叠区域。
  - name: 任意航向三维覆盖宽度推广模型
    role: 引入测线方向角、测线坡面投影线面角和覆盖宽度方向线面角，将二维斜坡覆盖模型推广到任意航向的三维海底场景。
    why: 问题中的水深变化不仅由位置决定，还受测线相对坡向的方向影响；通过方向角分解获得等效坡度后，可以复用二维覆盖宽度模型。
  - name: 临界重叠率递推布线模型
    role: 以首条测线条带边缘贴合海域边界为初始条件，在重叠率取最小允许值时递推计算后续测线位置。
    why: 沿等深线航行时同一测线上的覆盖宽度保持稳定，重叠率可由相邻测线位置定量控制；取允许的最小重叠率能够在完整覆盖的前提下减少测线数量和总长度。
  - name: 分区多目标规划主要目标模型
    role: 按等深线和地貌差异划分测区，以减少漏测或增大覆盖面积为主要目标，将重叠率限制和测线长度作为约束或次要目标，递推生成各分区航线。
    why: 复杂海底条件下覆盖率、漏测率、过度重叠和总航程彼此冲突，主要目标法可突出完整覆盖需求，并通过约束控制重叠和航程，降低多目标求解复杂度。
  solution_flow: 输入海域边界、中心水深、海底坡度或离散测深数据、换能器开角及重叠率范围→利用斜坡几何关系计算位置水深和条带左右半宽→比较两种重叠率定义并确定适用模型→引入航向角和等效线面角，将覆盖宽度模型推广到三维任意方向→分析不同航向结果并确定测线沿等深线延伸→令首条条带边缘与海域边界重合，以最小临界重叠率递推全部测线位置→对复杂海底按等深线分区，采用主要目标法生成各区航线→计算测线总长度、漏测率和过度重叠指标→通过特殊情形、几何作图、边界覆盖检查及规范对照完成验证。
  validation: 首先用CAD绘制斜坡上海底条带，检查零重叠临界位置并比较两种重叠率模型，确认模型二与实际几何重叠一致；其次检验三维模型的方向对称性、沿等深线时覆盖宽度恒定、顺坡与逆坡时覆盖宽度的单调变化，以及特定航向下覆盖宽度满足理论关系；再次检查最东侧或最外侧测线的条带边界是否覆盖海域边界，并删除不必要的末条测线；最后引用《海道测量规范》关于测线宜平行等深线总方向的规定进行外部合理性验证。
  visualization:
  - CAD几何关系与条带重叠示意图
  - 不同位置和航向下水深、覆盖宽度及重叠率结果表
  - Matlab测线空间分布图与航线图
  pitfalls_avoided:
  - 避免直接将平坦海底公式中的水平测线间距当作斜坡上的有效间距，因为斜坡投影和相邻条带宽度不对称会导致重叠率误判，甚至将实际仍有重叠的区域计算为漏测。
  - 避免只用单条测线的总覆盖宽度作为重叠率分母，因为相邻测线处于不同水深时覆盖宽度不同；改用前一条带后半宽与后一条带前半宽之和，可对应真实相交区域。
  - 避免在三维问题中仍把海底坡度角直接代入二维模型，因为任意航向下测线方向和条带横向方向的等效坡度不同，必须通过航向角计算相应线面角。
  - 避免测线不沿等深线布设，因为长距离航行会使同一测线上的水深和覆盖宽度显著变化，导致无法在整条测线上同时满足10%至20%的重叠率限制。
  - 避免首末测线布置过度外扩或覆盖不足，通过令首条条带边缘贴合边界并检查末条条带是否越过另一侧边界，兼顾完整覆盖与测线数量最少。
  - 避免复杂海底统一使用单一坡度建模，因为曲线等深线和地貌差异会造成局部漏测或过度重叠；按地形特征分区后分别递推布线更稳健。
  innovation_points:
  - 针对斜坡海底重叠率定义不明确的问题，同时构建两种候选模型，并以CAD几何检验而非仅凭公式形式选择更符合实际的模型。
  - 通过测线方向角推导任意坡面直线与水平面的线面角，将二维覆盖宽度公式转换为可适配任意航向的三维解析模型。
  - 将沿等深线航行与最小临界重叠率结合，使覆盖宽度沿线稳定，并可通过递推直接生成测线位置，实现完整覆盖和航程缩短。
  - 对复杂海域采用等深线分区与主要目标法，将漏测最少作为核心目标，并把重叠率限制嵌入测线深度递推过程。
- id: 2018_C008
  source_paper: 2018 2018_C008
  problem_type: 统计分析+综合评价+分类聚类+预测
  keywords:
  - 会员画像
  - RFMT模型
  - 会员生命周期
  - 精准营销
  - 关联规则
  context: 基于大型百货商场的会员信息与消费流水数据，识别会员消费特征、客户价值和生命周期状态，并分析非活跃会员激活及商品连带消费，为会员维系和精准营销提供依据。
  models:
  - name: 描述性统计分析
    role: 从购买力、时间偏好和消费偏好三个维度刻画会员特征，并比较会员与非会员的消费差异。
    why: 消费金额、消费宗数、购买数量、季节分布及特价或高价商品消费占比均可直接通过统计汇总得到，能够直观呈现客户群体的结构和行为差异。
  - name: RFMT会员价值模型
    role: 利用最近消费时间间隔R、消费频率F、消费总金额M和单次最高消费金额T综合评价每位会员的购买力与商业价值。
    why: 传统RFM模型能够同时反映活跃程度、忠诚度和消费贡献，引入T指标后可进一步识别百货商场中具有较强单次高额消费能力的会员。
  - name: 层次分析法（AHP）
    role: 构造RFMT指标判断矩阵，确定R、F、M、T在会员价值综合得分中的权重。
    why: 不同指标对会员价值的贡献程度不同，AHP可将业务经验转化为定量权重，并通过一致性检验控制主观判断中的逻辑矛盾。
  - name: 极差标准化
    role: 消除RFMT指标量纲和数量级差异，并分别处理正向指标与逆向指标。
    why: 消费金额、频率和时间间隔的取值范围差异显著，若直接加权会导致大尺度指标支配结果；其中R越小价值越高，必须进行逆向标准化。
  - name: K-means聚类
    role: 依据RFMT价值得分划分会员价值等级，并结合RFMT相关指标将会员划分为活跃会员、沉默会员和流失会员。
    why: 会员群体不存在天然标签，K-means适合依据样本间的欧氏距离发现内部结构，从而形成可用于差异化管理的客户类别。
  - name: 因子分析
    role: 对非活跃会员的多个相关指标进行降维和综合评价，计算非活跃会员的激活率或激活潜力得分。
    why: 激活可能性受多项相互关联的消费行为指标共同影响，因子分析能够提取少数公共因子、降低共线性并形成综合得分。
  - name: 线性回归模型
    role: 分析非活跃会员激活率与特价商品消费金额占比所反映的促销敏感度之间的关系。
    why: 回归模型可以量化促销敏感度对激活率的边际影响，并检验促销活动是否有助于提高非活跃会员的激活可能性。
  - name: 商品关联规则模型
    role: 从热门商品及其共同购买记录中挖掘商品连带关系，为组合促销、广告投放和邮件推送提供依据。
    why: 关联规则可通过支持度、置信度和提升度识别非偶然的商品共购模式，适合处理零售交易篮数据和制定交叉销售方案。
  solution_flow: 数据→对会员信息表、销售流水表、会员消费明细表和商品信息表去重、关联，过滤其他分店会员，并统一会员与非会员的统计时间窗口→统计消费金额、消费宗数、购买数量、季节消费人数、特价商品占比和高价商品占比，完成会员画像及群体差异分析→在限定时间窗内计算R、F、M、T，区分正向与逆向指标并进行极差标准化→依据业务判断构造AHP判断矩阵，计算权重并完成CI、CR一致性检验→加权计算会员RFMT价值分数，采用K-means划分价值等级及活跃、沉默、流失生命周期状态→对非活跃会员指标进行因子分析，得到激活潜力得分，并以特价商品消费占比为促销敏感度变量建立线性回归→选取销量前十商品，构建交易关联表并挖掘商品关联规则→根据高价值会员、生命周期状态、激活潜力和商品连带关系制定分层促销方案→通过一致性、聚类质量、回归显著性和关联规则有效性进行验证。
  validation: 首先对AHP判断矩阵计算最大特征根、CI和CR，以CR小于0.1作为权重可接受的标准；其次考察K-means类内距离平方和、类间差异及聚类中心的业务可解释性，并比较不同K值下的聚类效果；对因子分析检查指标相关性、公共因子解释方差和因子载荷合理性；对线性回归检验拟合优度、系数方向与显著性，并进行残差、异方差和异常点诊断；对关联规则使用支持度、置信度和提升度筛除低频或偶然共购规则；同时统一会员与非会员的观察时间窗口，通过汇总金额、数量与原始流水核对保证统计口径一致。
  visualization:
  - 会员消费金额、消费宗数和购买数量分级饼图
  - 各年度分季节消费会员人数柱状图
  - 会员与非会员每日消费总金额时间序列折线图
  - RFMT指标分布箱线图
  - 会员价值与生命周期聚类散点图
  - 聚类中心雷达图
  - 促销敏感度与激活率回归散点图
  - 商品关联规则网络图
  pitfalls_avoided:
  - 避免直接合并所有门店的会员消费记录：会员明细中包含其他分店会员，若不先与本商场会员信息表关联筛选，会夸大本商场会员价值并造成画像对象错位。
  - 避免在不同时间范围内比较会员与非会员：原始数据表覆盖区间不统一，统一截取2016年1月至2017年9月可防止总金额和购买数量差异只是由观察期长短造成。
  - 避免重复记录导致消费频次和金额被重复计算：预处理阶段剔除重复数据，并明确一条流水代表一次消费，保证F、M和消费宗数口径一致。
  - 避免将R与F、M、T同方向标准化：最近消费间隔越小通常价值越高，R是逆向指标，若按正向公式处理会把长期未消费会员错误评为高价值会员。
  - 避免未经检验直接使用主观权重：AHP判断矩阵可能存在循环矛盾，必须通过CR小于0.1的一致性检验，否则应调整判断矩阵。
  - 避免用会员与非会员的总消费额直接判断单客价值：非会员人数可能更多，总额较高不等于个体购买力更强，因此同时分析每日消费曲线，并应进一步结合人数、人均金额和客单价。
  - 避免把高销量商品之间的共同出现直接解释为强关联：热门商品天然具有较高共现概率，应同时使用支持度、置信度和提升度过滤伪关联。
  - 避免由促销占比与激活率相关直接得出因果结论：线性回归只能说明统计关系，会员原有购买力、历史活跃度等混杂因素可能同时影响两者，需要进行控制变量分析或后续营销实验验证。
  innovation_points:
  - 在传统RFM模型中增加单次最高消费金额T，形成适合大型百货商场高端消费特征的RFMT会员价值模型。
  - 将会员画像、价值评价和生命周期管理贯通：先识别消费特征，再进行价值聚类和活跃、沉默、流失状态划分，形成多层次会员管理体系。
  - 利用因子分析构造非活跃会员激活潜力得分，并通过回归模型量化促销敏感度与激活率之间的关系，使会员召回策略具有可排序、可解释的依据。
  - 将客户价值分层与商品关联规则结合，在识别目标会员的同时确定推荐商品组合，实现从客户识别到促销内容设计的闭环精准营销。
- id: 2023_D039
  source_paper: 2023 2023_D039
  problem_type: 优化+仿真+统计分析
  keywords:
  - 圈养湖羊空间利用率
  - 整数遍历优化
  - 蒙特卡洛仿真
  context: 在不同性别、生长阶段羊只不可混栏且各阶段栏容有限的条件下，制定湖羊分批繁育与育肥计划，以提高112个标准羊栏的空间利用率和年化出栏量，并降低随机生产因素造成的损失。
  models:
  - name: 羊栏天数平均占用模型
    role: 估算单批次母羊及其羔羊在完整生产周期内的羊栏资源消耗，并据此计算112个羊栏可支持的年化出栏量及达到年出栏1500只时的羊栏缺口。
    why: 稳定生产中多个批次错峰运行可近似抹平羊栏需求波动，因此可用单批次各阶段的栏数与持续时间之积汇总为羊栏天数，实现快速产能估算。
  - name: 基于状态指示变量的非线性整数规划模型
    role: 以批次间隔和各批次基础母羊数量为决策变量，以年化出栏量最大为目标，并约束任意一天的母羊、羔羊和公羊总用栏数不超过112。
    why: 羊只阶段转换具有离散时序特征，栏数计算包含向上取整且决策变量必须为整数，适合用0-1状态变量描述各批次每日状态，并建立整数规划约束。
  - name: 固定间隔与固定批量的遍历优化模型
    role: 将一般整数规划简化为批次间隔g和每批母羊数x等少量整数变量，通过穷举获得可行生产计划，并在最优解邻域调整个别批次规模。
    why: 原模型含大量逐日非线性取整约束，直接求解困难；固定生产节拍后决策空间有限，遍历能够稳定获得全局最优或近全局最优的可行整数解。
  - name: 随机分支生产管理模型
    role: 根据受孕失败、怀孕时间和孕期差异，将同批母羊及其羔羊划分为多个后续管理分支，并确定各分支的哺乳、休整和育肥安排。
    why: 随机孕期会导致分娩和阶段转换时间错位，统一管理会造成栏位冲突或压缩必要休整期，分支管理能够更真实地描述实际生产过程。
  - name: 蒙特卡洛期望损失优化模型
    role: 在225天大周期、25天批次间隔下，对随机受孕和孕期过程进行多周期模拟，估计日均损失数期望，并遍历每批基础母羊数量x寻找期望损失最小的方案。
    why: 随机因素叠加后难以解析计算羊栏冲突和损失的期望，而蒙特卡洛方法能够直接模拟复杂时序及分支；简化后仅有一维整数变量，适合结合遍历求解。
  solution_flow: 整理交配、孕期、哺乳、休整和育肥阶段的持续时间、单栏容量及公母羊配置比例→构造229天确定性生产周期并计算单批次羊栏天数→遍历每批母羊数量，估计年化出栏范围和1500只目标对应的栏位缺口→利用状态指示变量计算各批次在每一天的用栏量，建立以出栏量最大为目标、每日用栏不超过112为约束的非线性整数规划→固定批次间隔和批量，将模型降维后遍历批次数、间隔和母羊数量，并在候选解邻域调整个别批次规模→引入受孕及孕期随机性，设置225天周期、25天间隔和三分支管理规则→进行多周期蒙特卡洛仿真，遍历x并以日均期望损失最小确定随机情形下的生产计划→检查最大用栏数、平均空间利用率、年化出栏量及损失曲线，对方案进行对比验证。
  validation: 首先逐日计算候选计划的羊栏需求，验证任意时刻均不超过112栏；其次比较4批次、10批次及局部调整方案的最大用栏数和平均空间利用率，确认增加批次可削弱集中分娩、育肥和出栏引起的波动；再在最优参数附近进行穷举，检验结果的局部最优性，并通过完整周期及多个重复周期检查计划的稳定性；随机模型中采用充分多周期的蒙特卡洛重复模拟估计期望损失，观察损失随x先降后升且在x=40附近达到最小，以局部和全局羊栏使用曲线核验容量约束及结果合理性。
  visualization:
  - 每日羊栏使用量时间序列图
  - 不同批次方案空间利用率对比图
  - 日均期望损失随每批母羊数量变化曲线
  - 局部与全局羊栏占用状态图
  pitfalls_avoided:
  - 避免只按羊只总数除以单栏容量计算需求，因为不同阶段原则上不能混栏且容量不同，必须对每个批次、每个阶段分别向上取整，否则会系统性低估羊栏需求。
  - 避免直接求解含大量逐日状态、向上取整和整数变量的一般非线性规划，因为约束数量大且非光滑，计算上基本不可解；通过固定间隔和批量将问题降为低维整数遍历。
  - 避免仅按平均羊栏天数制定112栏的具体计划，因为平均可行不代表峰值可行；具体方案必须逐日检查最大用栏数是否超过容量上限。
  - 避免批次数过少导致母羊集中怀孕、羔羊集中育肥和出栏，从而形成明显峰谷；增加错峰批次可平滑需求并提高平均空间利用率。
  - 避免始终按1只公羊配14只母羊机械安排交配栏，因为空闲公羊还需按每栏4只安置；对交配公羊数量进行遍历，可最小化交配栏与空闲公羊栏之和。
  - 避免在随机孕期下仍将同批母羊统一推进阶段，因为分娩时间差异会压缩哺乳期或休整期并引发栏位冲突；采用三分支管理，并用蒙特卡洛估计真实期望损失。
  innovation_points:
  - 将完整繁育—育肥链条统一折算为羊栏天数，用多批次稳态平滑思想把复杂动态过程转化为单位栏位年化产能，实现产能范围和栏位缺口的快速估计。
  - 采用“先构建完整逐日非线性整数模型、再固定节拍降维遍历”的分层建模策略，兼顾模型真实性、可解释性和可求解性。
  - 不仅优化等批量方案，还在其邻域允许个别批次数量调整，得到首批48只、其余批次40只等非均匀计划，使年化出栏量提高到1224只、空间利用率提高到97.38%。
  - 将随机受孕和孕期差异转化为母羊及羔羊的多分支时序管理，并把蒙特卡洛仿真与一维整数遍历结合，以日均期望损失而非单纯平均利用率作为随机环境下的优化目标。
- id: 2017_C007
  source_paper: 2017 2017_C007
  problem_type: 预测+统计分析+综合评价
  keywords:
  - 多元回归分析
  - 残差与显著性检验
  - 层次分析法
  context: 利用试纸照片的RGB、色调和饱和度等颜色读数建立物质浓度预测模型，以减少人工比色造成的主观误差。
  models:
  - name: 多元线性回归模型
    role: 建立五维颜色读数B、G、R、H、S与待测物浓度之间的线性定量关系，并用于不同数据组的拟合与预测。
    why: 相关性分析及朗伯-比尔定律表明颜色读数与物质浓度存在一定线性关系，且模型参数易估计、结果易解释并可进行完整的统计显著性检验。
  - name: 多元非线性二次回归模型
    role: 在二氧化硫数据的线性模型拟合效果不佳时，引入颜色变量的二次项和交互关系，提高浓度预测精度。
    why: 线性回归残差较大，说明简单线性关系不足以描述数据；二次回归能够刻画颜色读数与浓度之间的曲线关系，并使残差降低约一个数量级。
  - name: 层次分析法
    role: 综合量化数据量和颜色维度对模型质量的相对影响，得到二者影响权重分别为0.414和0.586。
    why: 数据量与颜色维度对模型性能的影响具有多指标综合评价特征，层次分析法可将定性判断转化为可比较的影响权重。
  solution_flow: 读取不同物质浓度及五维颜色数据→进行相关性分析和数据完整性检查→以浓度为因变量、B/G/R/H/S为自变量建立多元线性回归→利用MATLAB
    regress估计回归系数、置信区间和残差→依据残差置信区间识别异常点并重新拟合→通过R²、F检验、P值和估计误差方差评价并排序各组数据→针对线性拟合较差的数据使用rstool建立二次回归模型→比较线性与二次模型的剩余标准差和残差→枚举减少样本量及颜色维度进行敏感性分析→利用层次分析法量化两类因素的影响程度。
  validation: 采用多层次验证策略：使用R²衡量拟合程度，以F检验及其P值判断回归方程整体显著性，以估计误差方差和剩余标准差评价预测误差；绘制残差及其置信区间检查残差是否围绕零随机分布并识别异常观测；在剔除异常点后重新拟合并复检统计指标；通过线性模型与二次模型的残差量级对比进行模型优选，同时通过改变样本量和颜色维度开展敏感性与稳健性分析。
  visualization:
  - 回归残差图及残差置信区间图
  - 模型统计指标与误差对比表
  - 不同样本量和颜色维度下的模型性能对比图
  pitfalls_avoided:
  - 避免仅凭较高R²认定模型有效，因为R²只能反映拟合程度，论文同时结合F检验、P值和估计误差方差判断整体显著性与误差水平。
  - 避免异常观测直接扭曲回归系数和显著性指标，通过残差图及残差置信区间识别可疑点，并在剔除后重新拟合和检验模型。
  - 避免在明显非线性的数据上强行使用线性模型，因为二氧化硫数据的线性回归残差较大，改用二次回归后残差降低约一个数量级。
  - 避免在小样本条件下设置过多颜色变量造成自由度不足或模型不成立，通过减少数据量和颜色维度的实验发现样本量不宜低于6，通常以10至15个样本较合适。
  - 避免过度降维导致关键信息丢失，实验表明二维或三维颜色信息仍可建模，而一维颜色模型往往效果较差甚至无法成立。
  innovation_points:
  - 构建由F检验、R²、P值、估计误差方差和数据完整性组成的五准则评价体系，不仅评价拟合效果，还考虑异常点剔除对数据质量和模型可信度的影响。
  - 采用线性回归与二次回归的递进式建模策略，根据残差诊断结果选择模型复杂度，而非预先固定单一函数形式。
  - 将样本量和颜色维度的敏感性实验与层次分析法结合，定量得到二者影响权重0.414和0.586，从而说明颜色维度对模型质量的影响更大。
- id: 2018_B334
  source_paper: 2018 2018_B334
  problem_type: 优化+仿真+综合评价
  keywords:
  - RGV动态调度
  - 最优状态转移图
  - 多阶段决策
  - 事件驱动离散化
  - 故障随机仿真
  context: 针对由8台CNC与1台RGV组成的智能加工系统，在单工序、双工序及随机故障情景下优化RGV调度，以最大化8小时班次内的成品产量并提高系统效率。
  models:
  - name: 带约束的多队列任务调度模型
    role: 将各台CNC抽象为并行任务队列，将RGV的移动、等待、上下料和清洗行为转化为队列间的受约束服务调度问题。
    why: 该抽象能够统一描述CNC并行加工与RGV单资源服务之间的竞争关系，并为事件驱动的状态划分和后续图模型建立提供基础。
  - name: 最优状态转移图模型
    role: 描述单工序情景下系统状态、可行动作和状态转移，以有限班次内完成的成品数量最大为目标搜索最优RGV调度路径。
    why: 系统决策具有离散、动态和强时序约束特征，状态向量可以同时记录当前时刻、RGV位置、各CNC剩余加工时间和累计产量，状态转移矩阵则可刻画移动、等待、上下料及清洗过程。
  - name: 带工序约束的最优状态转移图模型
    role: 在双工序情景中加入CNC类型、工序先后关系、半成品流转方向和两类CNC空间布局约束，优化RGV调度及设备配置。
    why: 双工序物料必须依次经过不同类型CNC，普通状态转移模型无法保证工序合法性；通过限制状态转移方向并使两类加工能力尽量均衡，可以减少半成品阻塞和设备空闲。
  - name: 带故障风险的最优状态转移图模型
    role: 通过故障因子、等待时间和故障修复状态扩展原状态转移模型，模拟CNC随机故障、物料报废及修复后重新入列。
    why: CNC故障会造成加工中断、随机停机和状态转移不确定性，需要把故障概率及修复时间显式纳入状态和评价函数，才能形成具有风险适应能力的动态调度方案。
  - name: 多阶段决策模型
    role: 将完整班次的高维搜索分解为若干阶段，在每一阶段依据等待时间、移动成本、设备负载、工序均衡和预计产量选择动作。
    why: 直接遍历完整状态转移图会产生严重的时间和空间复杂度，多阶段决策结合明确的优化准则可以显著压缩搜索规模，并获得质量较高的近似最优解。
  - name: 最优性剪枝与分支限界搜索模型
    role: 对候选状态转移路径进行回溯搜索，并利用产量上界、剩余工时和终端可行性规则剪除不可能优于当前解的分支。
    why: RGV目标CNC选择属于离散组合优化问题，分支限界和剪枝适合在保持约束可行性的同时减少无效路径搜索。
  - name: 系统产能上界与效率均衡评价模型
    role: 计算CNC满载条件下的理论产量上限、结果偏差率以及各模块工作效率和均衡程度，用于评价调度结果。
    why: 真实最优解难以直接获得，理论产能上界可作为统一参照；同时只比较产量无法反映RGV与不同类型CNC之间的负载失衡，因此需要联合效率与均衡性指标。
  solution_flow: 数据：输入总班次时间、CNC加工时间、不同位置上下料时间、RGV位置间移动时间、清洗时间、CNC类型及故障概率和修复时间；模型：将CNC抽象为并行任务队列，采用事件驱动方式定义由当前时刻、RGV位置、各CNC剩余加工时间、负载状态和累计产量组成的状态向量，并针对单工序、双工序和故障情景分别建立状态转移图；参数：构造移动时间矩阵、CNC类型向量、负载向量、故障因子矩阵及加工能力均衡比例，并搜索双工序CNC的空间排布；求解：在每个事件节点生成可行目标CNC，计算移动、等待、清洗和上下料时间，通过多阶段决策、回溯、分支限界及最优性剪枝选择状态转移，最大化8小时内成品数；验证：将三组参数下的产量、调度序列和设备利用率与CNC满载理论上界比较，并通过偏差率、终端可行性和效率均衡程度检验模型质量。
  validation: 采用题目给出的三组系统参数进行重复算例检验，单工序情景得到382、359、391件，双工序情景得到253、210、240件；首先检查每条调度序列是否满足RGV同一时刻只能服务一台CNC、移动与等待时间、工序先后关系、班次结束前返回原点及工件完工等约束；其次将算法产量与CNC满载条件下的理论产能上界比较并计算结果偏差率，以评价近似最优性；最后统计RGV和各CNC的工作率、等待率及两类CNC加工能力均衡程度，检验系统效率，同时在故障场景中通过随机故障与修复时间仿真考察调度策略的稳定性和风险适应能力。
  visualization:
  - 带约束多队列调度示意图
  - 最优状态转移有向图
  - RGV时空调度甘特图
  - 各CNC工作与空闲状态时间图
  - 理论产能上界与实际产量对比柱状图
  - RGV及两类CNC利用率与负载均衡图
  - 故障情景产量分布或箱线图
  pitfalls_avoided:
  - 避免按1秒固定步长离散时间，因为大量时刻没有新事件，会产生重复状态和无效迭代；改用上料完成、加工完成、故障发生或修复完成等事件驱动的时间跳转。
  - 避免直接穷举完整班次的全部调度序列，因为8台CNC的连续目标选择会导致组合爆炸；采用多阶段决策、分支限界、回溯和产能上界剪枝压缩搜索空间。
  - 避免只最小化RGV移动距离，因为最近的CNC可能尚未完成加工，导致到达后长时间等待；转移代价同时考虑移动时间、目标CNC剩余加工时间、上下料和清洗时间。
  - 避免忽略班次末端约束，否则算法可能统计尚未加工完成的物料，或使RGV无法按时回到原点；在状态扩展时预留完工、下料和返程时间，并对最后一批工件单独处理。
  - 避免双工序设备数量或布局失衡，因为第一类CNC过强会造成半成品积压，第二类CNC过强则会因半成品不足而空闲；先依据加工能力确定近似数量比例，再搜索空间排布并限制合法工序流向。
  - 避免把随机故障简单视为固定加工时间增量，因为故障会导致当前物料报废、设备停机并在修复后重新加入调度；通过故障因子和修复状态显式扩展状态转移。
  - 避免仅以理论满载产能评价算法，因为该上界可能忽略RGV单资源服务与移动冲突；将其作为参照上界，并结合结果偏差率、约束可行性和模块效率均衡进行综合验证。
  innovation_points:
  - 将RGV-CNC加工系统转化为时间维度上的带约束多队列调度问题，并以关键事件而非固定秒级步长进行状态离散化。
  - 使用齐次状态向量和状态转移矩阵统一表达RGV位置、CNC剩余加工时间、设备负载、累计产量及动作耗时，将最大产量问题转化为状态转移图的最大可行深度搜索。
  - 把系统效率均衡原则转化为双工序CNC数量比例、空间布局和阶段决策准则，使设备配置与动态调度协同优化。
  - 在同一状态图框架中逐层加入工序约束和随机故障因子，使模型能够统一覆盖单工序、双工序和故障风险三类场景。
  - 构建CNC满载理论上界、结果偏差率和系统效率均衡指标，在缺少精确全局最优解时为算法效果提供可解释的评价基准。
- id: B_cumcm0754
  source_paper: B B_cumcm0754
  problem_type: 优化+综合评价
  keywords:
  - 邻接关系矩阵
  - 满意度函数
  - 节点带权网络
  context: 面向城市公汽、地铁及步行组成的多方式公共交通网络，为任意起讫站点寻找满足少换乘、低费用和短时间等差异化需求的最佳出行线路。
  models:
  - name: 多准则公交线路优化模型
    role: 以换乘次数、出行费用和出行时间为优化指标，采用不同的字典序优先级描述不同类型乘客的线路选择偏好。
    why: 乘客需求具有明显差异，单一目标无法同时刻画少换乘、低费用和短时间等出行心理，分层优先准则能够给出清晰且可解释的最佳线路。
  - name: 基于邻接关系矩阵的换乘搜索模型
    role: 利用邻接关系矩阵、邻接站点距离矩阵和线路序列矩阵，按照直达、一次换乘、二次换乘的阶段递推搜索可行路线。
    why: 对于采用字典序准则的优化问题，无须枚举全部路径；按换乘次数逐层搜索可在满足首要指标后及时停止，从而降低大规模公交网络的计算量。
  - name: 基于广度优先搜索的公交换乘模型
    role: 逐层生成起点到终点的全部允许换乘路线，并为综合评价模型提供候选线路集合。
    why: 综合满意度准则可能使换乘次数较多但时间或费用更优的线路胜出，因此需要较完整地搜索给定换乘上限内的可行线路，广度优先搜索适合按路径层级进行枚举。
  - name: 满意度综合评价模型
    role: 将换乘次数、出行费用和出行时间转化为可比较的满意度，并从所有可行线路中选取综合满意度最高的方案。
    why: 三个指标量纲和偏好方向不同，满意度函数能够统一指标尺度，并反映普通乘客对多种出行因素的权衡。
  - name: 公汽—地铁多方式最短时间模型
    role: 将地铁视为新增线路，将公汽换公汽、地铁换地铁、公汽换地铁和地铁换公汽的不同换乘耗时纳入总出行时间，以最短时间选择路线。
    why: 公汽与地铁在线路速度和换乘代价上存在差异，统一建模为多方式网络并显式计算换乘时间，可以避免只比较车内行驶时间造成的错误选择。
  - name: 节点带权网络与节点分裂最短路模型
    role: 将站点换乘代价表示为节点权，通过节点分裂把节点权转换为边权，再使用Dijkstra算法求解赋权有向网络的最短路。
    why: 传统最短路算法通常处理边权，不能直接计入站点上的换乘耗时；节点分裂可将问题转化为标准非负边权最短路问题，便于稳定求解。
  - name: 含步行连接的多方式交通网络模型
    role: 将站点间步行视为新增交通线路，以步行时间作为边权，并结合公汽、地铁行驶时间及线路切换耗时构造总时间目标函数。
    why: 实际换乘不一定发生在完全相同的站点，引入步行边可以连接空间上邻近但拓扑上不相交的线路，使模型更符合真实出行过程。
  solution_flow: 数据：整理公汽、地铁线路的有向站点序列、站点邻接关系、相邻站平均行驶时间、票价及不同交通方式间的换乘耗时，并在扩展问题中加入站点间步行时间；模型：构造邻接关系矩阵、距离矩阵和线路序列集合，分别建立字典序多目标优化、满意度综合评价、节点带权最短路及含步行边的多方式网络模型；参数：设置公汽相邻站、地铁相邻站的平均行驶时间，设定各类换乘耗时和最大换乘次数，并确定满意度指标的标准化及权衡规则；求解：先检查直达路线，再按一次、二次换乘递推搜索，对综合准则使用广度优先搜索生成候选集并计算满意度，对公汽—地铁网络采用节点分裂和Dijkstra算法求最短时间路径，最后将步行边并入网络计算总出行时间；验证：检查输出路径的线路方向、站点连续性和换乘合法性，复算换乘次数、费用及总时间，并通过不同算法或不同准则下的结果对比和稳定性分析检验合理性。
  validation: 首先进行可行性验证，确认相邻站点确有对应有向线路、每次换乘均发生在允许换乘的站点或步行连接处，且换乘次数不超过设定上限；其次进行目标值复算，将行驶时间、步行时间和不同方式的换乘时间逐段累加，并独立核对费用与换乘次数；然后对邻接矩阵搜索、广度优先搜索和节点分裂后的Dijkstra结果进行交叉比较，检查最短时间路线是否一致；最后改变平均行驶时间、换乘耗时和满意度权衡参数开展敏感性与稳定性分析，观察最优路线是否发生异常跳变。
  visualization:
  - 多方式公交网络拓扑图及最优路径高亮图
  - 候选线路换乘次数—费用—出行时间对比表或柱状图
  - 满意度与参数敏感性折线图
  pitfalls_avoided:
  - 避免把公交线路当作无向边：论文将上下行线路视为不同的有向线路，否则会生成现实中无法乘坐或方向相反的伪路径。
  - 避免只累计站间行驶时间而忽略换乘代价：公汽、公汽与地铁之间的换乘耗时不同，遗漏该项会系统性偏向换乘较多的路线。
  - 避免在字典序准则下无差别枚举全部路线：按直达、一次换乘、二次换乘分阶段搜索，并在首要目标已经达到最优时停止，可控制大规模网络的搜索复杂度。
  - 避免用单一加权和直接处理所有乘客偏好：先区分换乘优先、费用优先、时间优先和综合型乘客，防止权重设置掩盖明确的优先级关系。
  - 避免将节点换乘时间直接遗漏在普通边权最短路中：通过节点分裂把节点权转化为边权，使Dijkstra计算的路径代价包含站内换乘时间。
  - 避免假定只有同名或同一物理站点才能换乘：在已知步行时间时加入步行边，可表示邻近站点之间的现实接驳；同时需限制不合理的连续步行或重复换乘，防止网络规模失控。
  - 避免忽略搜索规模爆炸：对纯公交问题设置最多二次换乘的行为假设，并针对不同目标选择矩阵递推、广度优先或最短路算法，而非统一采用全路径枚举。
  innovation_points:
  - 根据乘客出行心理构造四类评价准则，将换乘次数、费用和时间的字典序优化与满意度综合评价结合起来，实现个性化线路推荐。
  - 以换乘次数划分搜索阶段，利用邻接关系矩阵反推出中转站和线路序列，使搜索能够在获得符合优先准则的最优解后提前终止。
  - 将公汽、地铁和步行统一表示为带线路标识的多方式网络，并对不同交通方式切换设置差异化换乘代价。
  - 使用节点分裂处理站点换乘权重，将节点带权网络转化为可由Dijkstra算法求解的标准赋权有向网络。
- id: A题  奥运会临时超市网点设计论文_奥运会临时超市网点的设计
  source_paper: A题  奥运会临时超市网点设计论文 A题  奥运会临时超市网点设计论文_奥运会临时超市网点的设计
  problem_type: 统计分析+分类聚类+预测+优化
  keywords:
  - 人流量分布
  - 购物欲望指数
  - 谱系聚类
  - 最短路径
  - 混合整数优化
  - 临时超市选址配置
  context: 根据奥运观众问卷、场馆容量及交通餐饮设施分布，预测20个商区的人流与购物需求，并优化配置两种规模的临时超市网点。
  models:
  - name: 描述性统计与比例标准化模型
    role: 分别统计性别、年龄与出行方式、餐饮方式及非餐饮消费额之间的关系，并消除不同群体样本规模差异。
    why: 原始人数同时受群体规模和行为偏好影响，使用组内比例标准化后才能识别不同性别、年龄群体的真实倾向。
  - name: Pearson相关系数检验
    role: 检验三次问卷调查结果之间的一致性，判断各次调查能否反映相同的行为规律。
    why: 问卷变量以成对数值形式呈现，Pearson相关系数可衡量不同调查统计结果的线性一致程度，并为合并取平均提供依据。
  - name: 购物欲望指数模型
    role: 把六档非餐饮消费额映射为六级购物欲望指数，并以各消费档人数比例构成群体购物欲望特征向量。
    why: 消费额是离散分档数据，直接比较不便；指数化和向量化可同时保留消费水平与消费结构，为聚类和需求估计提供统一指标。
  - name: 基于欧氏距离的谱系聚类模型
    role: 对按性别、年龄、出行方式划分的48类观众及按性别、年龄、餐饮方式划分的24类观众进行归并，分别形成5类和3类购物行为群体。
    why: 预先不知道合理类别数，谱系聚类能够展示逐级合并过程；特征向量已归一化，使用欧氏距离可以有效衡量消费结构的接近程度。
  - name: 最短路径人流分配模型
    role: 结合场馆容量、看台人流方向、交通方式比例、餐饮方式比例及出入口规则，将观众的进出场和餐饮出行分配到20个商区。
    why: 题目明确假设观众采取最短路径，因而可将交通节点和商区抽象为网络，并依据路径经过关系计算各商区人流量百分比。
  - name: 商区购物需求预测模型
    role: 利用聚类所得群体消费规律、人均日消费额、人流量及流动方向，估计各商区的预期销售额和购物需求。
    why: 网点配置不能只依据经过人数，还需考虑不同观众群体消费能力和购物欲望的差异，因此需要把客流预测转化为货币化需求。
  - name: 双规模MS混合整数优化模型
    role: 以各商区总利润最大为目标，确定每个商区小型与大型MS的整数数量，并约束销售能力满足需求且网点分布基本均衡。
    why: 网点数量必须取整数，两类MS在面积、成本和销售上限方面存在倍数关系，同时需要协调盈利、需求覆盖和空间均衡等多个要求。
  solution_flow: 数据→汇总三次问卷并按性别、年龄、交通、餐饮和消费档分类→用Pearson相关系数检验调查一致性并对组内比例标准化→将消费档映射为购物欲望指数并构造归一化特征向量→采用欧氏距离谱系聚类识别典型消费群体→根据场馆容量、出入口、人流方向和最短路径规则计算20个商区的人流量比例→结合群体占比与人均日消费额预测各商区购物需求→设置大小两类MS的容量、成本和规模因子，以利润最大、需求满足和销售额均衡为约束求整数配置→检查客流比例、容量覆盖、均衡性和盈利性，并讨论结果的现实合理性。
  validation: 首先对三份问卷的对应统计量进行两两Pearson相关检验，相关系数普遍接近1，用于验证行为规律的重复性和合并数据的合理性；其次同时比较原始总人数和组内标准化比例，验证结论不是由样本结构差异造成；再检查20个商区人流量百分比的总和、路径分配是否符合出入口和最短路径假设；最后核验MS方案是否满足需求容量约束、网点数量整数性、销售额均方差上限和利润为正等条件，并结合场馆满座规模及交通餐饮设施位置进行现实合理性判断。
  visualization:
  - 性别或年龄与出行、餐饮方式的交叉统计表
  - 消费额分档分布图
  - Pearson相关系数矩阵热力图
  - 谱系聚类树状图
  - 商区最短路径人流网络图
  - 20个商区人流量百分比柱状图
  - 大小型MS网点配置堆叠柱状图
  - 商区需求与销售能力对比图
  pitfalls_avoided:
  - 避免直接用各群体原始人数判断行为偏好，因为男女和各年龄段样本量不同会造成规模效应；通过组内比例标准化分离群体规模与选择倾向。
  - 避免未经检验就将三次问卷简单合并，因为不同场次可能存在抽样波动或结构差异；先进行两两Pearson相关检验，确认规律一致后再采用综合或平均结果。
  - 避免把同一交通方式的不同方向重复视为不同消费群体，因为数据表明公交和地铁方向对性别偏好影响很小；合并方向可降低分类维度并减少稀疏样本。
  - 避免仅按客流量配置网点，因为同等客流中的群体构成和消费能力可能不同；通过购物欲望聚类与人均消费额将人流转化为实际购物需求。
  - 避免直接对消费额开区间使用无界均值，因为“500元以上”没有自然中点；依据高消费人数随金额快速减少的特征，以600元作为代表值，防止需求估计失控。
  - 避免只追求利润而将MS集中在少数高流量商区，因为这会违背分布均衡和服务覆盖要求；在优化模型中加入需求满足约束及商区最大销售额均方差上限。
  - 避免得到不可实施的小数网点数量，因为MS数量属于离散决策；将大小型MS数量设置为非负整数变量。
  innovation_points:
  - 将消费额分档转化为购物欲望指数，并以六档消费比例向量描述群体，使定性的购物倾向可以量化、聚类并进入需求预测模型。
  - 建立“问卷行为规律—最短路径人流分配—消费需求估计—双规模网点优化”的完整链条，实现统计分析、聚类预测与运筹优化的耦合。
  - 分别从出行方式和餐饮方式对观众进行聚类，兼顾进出场客流与餐饮客流两类不同的空间流动机制。
  - 利用大型MS相对小型MS的统一规模因子描述面积、营业成本和销售能力的倍数关系，在减少参数数量的同时支持两种规模网点的联合配置。
  - 以销售额均方差上限量化商业网点的空间均衡要求，将原本定性的“分布基本均衡”转化为可计算的优化约束。
- id: 2017_A090
  source_paper: 2017 2017_A090
  problem_type: 优化+统计分析+仿真
  keywords:
  - CT系统参数标定
  - 非线性最小二乘
  - 滤波反投影
  - 代数迭代重建
  - 噪声分布检验
  context: 利用已知几何标定板的投影数据标定二维平行束CT系统参数，并根据含噪投影数据重建未知介质的位置、形状与吸收率分布。
  models:
  - name: 圆弦长线性最小二乘拟合模型
    role: 利用圆在各方向投影性质，根据探测值与射线穿过圆的弦长拟合增益系数、探测器间距和位置偏置的初值。
    why: 均匀圆的投影弦长具有明确解析式且方向不变，可将接收数据与吸收路径长度建立近似线性关系，为后续高维非线性标定提供可靠初值。
  - name: 标定板几何投影模型
    role: 建立椭圆与圆的弦长关于旋转中心、探测器偏置、单元间距、增益系数及射线角度的函数关系。
    why: 标定板几何尺寸和吸收率已知，可通过解析计算每条平行射线穿过模板的总长度，从而把CT参数标定转化为理论投影与实测投影的匹配问题。
  - name: 非线性最小二乘迭代优化模型
    role: 以全部180×512组投影数据的均方根误差最小为目标，联合估计旋转中心、探测器间距、增益系数、偏置和180个射线方向。
    why: 待估参数与弦长之间存在平方根、三角函数及截断关系，无法直接线性求解；分阶段迭代、角度平滑和交替优化能够降低高维非线性优化对初值的敏感性。
  - name: 投影坐标校正模型
    role: 根据已标定的旋转中心偏移，将原探测器数据插值映射到中心与托盘原点重合的辅助探测器坐标系。
    why: FBP和ART重建通常假设旋转中心与成像坐标中心一致，若不先校正中心偏移，会产生位置错位、重影和条纹伪影。
  - name: 滤波反投影模型（FBP）
    role: 基于傅里叶中心切片定理，对各角度投影进行傅里叶变换、斜坡滤波、逆变换和反投影累加，以重建连续吸收率图像。
    why: 平行束投影满足Radon变换结构，FBP计算速度快、理论成熟，适合角度较完整的CT投影数据，并可作为迭代重建结果的对照。
  - name: 代数迭代重建模型（ART）
    role: 将成像区域网格化，建立稀疏投影方程Rx=p，逐条射线修正像素吸收率并施加非负约束。
    why: 大型投影矩阵通常稀疏、病态甚至奇异，直接求逆不可行；ART能够处理不完全和含噪投影，并方便融入吸收率非负等先验信息。
  - name: 非局部均值降噪模型（NLM）
    role: 对ART或FBP重建图像进行基于邻域相似性的加权平均，减少噪点和伪影。
    why: NLM利用图像中重复结构进行降噪，相比简单局部平滑能够在抑制噪声的同时保留介质边缘和几何细节。
  - name: Kolmogorov-Smirnov分布检验
    role: 提取低幅值疑似噪声数据，检验其是否服从均匀分布，并估计噪声均值用于预处理。
    why: 先识别噪声的统计分布再去噪，比直接采用固定滤波器更有依据，可针对复杂含噪投影选择相应的数据修正方法。
  - name: 蒙特卡洛式数值仿真验证模型
    role: 预设真实CT参数生成模拟投影，再反求参数，并分别考察无噪声、有人工噪声和不同初始值情况下的标定误差。
    why: 真实数据的系统参数不可直接观测，仿真数据具有已知真值，能够定量评估标定精度、抗噪稳定性和初值敏感性。
  solution_flow: 读取标定板180×512投影数据→利用圆弦长与投影值进行线性最小二乘拟合，获得增益系数和探测器间距等初值→建立圆与椭圆的解析弦长投影模型→以全体理论投影和实测投影的RMSE最小为目标，采用联合拟合、角度平滑、固定角度优化公共参数、固定公共参数逐角优化及全参数再拟合的迭代流程→得到旋转中心、单元间距、增益系数和180个射线方向→按旋转中心偏移对未知介质投影进行坐标校正和插值→分别采用FBP连续重建与ART离散迭代重建→施加吸收率非负约束并使用NLM去噪→对复杂噪声数据进行低幅值提取和K-S分布检验后再重建→输出介质位置、形状、吸收率图像及指定点数值→通过RMSE、双算法对照和已知参数仿真检验精度与稳定性。
  validation: 首先以理论投影与实测投影的RMSE评价标定拟合效果，RMSE由首次求解的4.4161下降至最终的0.0148；其次预设旋转中心、探测器间距和角度等真值生成模拟投影，通过反演值与真值的绝对误差和相对误差评价精度；再向模拟数据加入人工噪声，检验各参数相对误差是否保持在1%以内；使用多组不同迭代初值重复标定以检验初值敏感性；最后比较FBP与ART-NLM的重建图像、边缘表现和指定点吸收率，以交叉验证重建结果的合理性。
  visualization:
  - 投影数据灰度图或热力图
  - 圆弦长理论曲线与观测数据拟合图
  - 探测器与标定板几何关系示意图
  - 原始投影序列差分图
  - 疑似噪声直方图
  - K-S分布检验结果图
  - FBP吸收率重建图
  - ART-NLM吸收率重建图
  - 降噪前后图像对比图
  - 标定参数误差与噪声水平关系图
  pitfalls_avoided:
  - 避免直接把探测器接收值当作几何长度：接收数据包含系统增益，先用已知圆弦长拟合增益系数，否则会导致吸收率和几何尺度同时产生系统性偏差。
  - 避免忽略旋转中心相对托盘中心的偏移：重建前将投影映射到中心对齐的辅助探测器坐标系，否则FBP和ART会出现位置偏移、双影及条纹伪影。
  - 避免一次性盲目优化全部高维参数：180个角度与多个公共参数强耦合，直接求解容易陷入局部最优，因此采用粗拟合、角度平滑、公共参数与角度交替优化、全参数精修的流程。
  - 避免对大型稀疏投影矩阵直接求逆：投影矩阵可能病态或奇异且存储成本高，改用ART逐射线迭代，并通过松弛参数控制收敛。
  - 避免重建过程中出现无物理意义的负吸收率：在ART每轮迭代后施加像素非负约束，使结果满足介质吸收率的物理先验。
  - 避免仅凭视觉判断噪声类型：先从背景低幅值区提取疑似噪声，再通过K-S检验判断分布并估计统计参数，减少随意设置去噪规则造成的信号损失。
  - 避免使用普通均值滤波过度模糊边缘：采用基于邻域相似性的NLM处理重建伪影，在平滑噪声的同时尽量保留介质边界。
  - 避免仅用训练投影的拟合误差宣称模型稳定：进一步使用已知真值仿真、加噪实验和多初值重复求解，分别验证精度、抗噪性和初值鲁棒性。
  innovation_points:
  - 提出分阶段交替标定策略，将圆投影粗估、全参数拟合、角度平滑、公共参数优化、逐角优化和最终联合精修结合，显著降低高维非线性标定的求解难度。
  - 将解析几何标定与CT反演统一起来，先利用圆和椭圆的精确弦长公式标定系统，再通过坐标校正把非标准安装数据转换为标准平行束投影。
  - 并行构建FBP连续模型和ART离散模型，通过速度、平滑性、边缘保持能力及采样点吸收率进行互补比较。
  - 针对复杂数据增加噪声分布检验与NLM后处理，形成投影域统计去噪和图像域结构保持降噪相结合的处理链。
  - 设计具有显著几何特征的新标定模板，利用几何特征直接给出参数初步估计，再将估计值输入非线性最小二乘优化，以提高收敛速度、标定精度和稳定性。
- id: B077_B077
  source_paper: B077 B077_B077
  problem_type: 优化+仿真
  keywords:
  - 光伏组件优化铺设
  - 倾斜面太阳辐射
  - 组件分组与逆变器选配
  context: 基于大同市气象辐射数据和小屋建筑约束，优化屋顶及墙面光伏组件的类型、倾角、排布、串并联分组与逆变器配置，以提高35年发电量和经济效益。
  models:
  - name: 倾斜面太阳辐射量转换模型
    role: 将水平面总辐射分解并转换为不同朝向、不同倾角表面接收的直射辐射、散射辐射和地面反射辐射，为发电量计算提供输入。
    why: 附件主要给出水平面气象数据，而光伏组件安装在屋顶、墙面或倾斜支架上，必须考虑纬度、太阳赤纬角、日落时角、组件倾角和地表反射率对有效辐射的影响。
  - name: 光伏组件性价比单目标评价模型
    role: 以转换效率与单位面积价格之比作为指标，对单晶硅、多晶硅和薄膜组件进行筛选。
    why: 原问题同时要求发电量尽可能大和单位发电量成本尽可能小，采用性价比指标可将双目标选择问题简化为可比较的单目标排序问题。
  - name: 光伏组件矩形排样与分区优化模型
    role: 将屋顶和墙面划分为规则区域，在避开水槽、门窗和边界的条件下最大化可安装组件数量，并通过准一刀切排样和局部调整提高面积利用率。
    why: 建筑可用表面不规则且组件不可分割，单纯用可用面积除以组件面积会高估安装数量，因此需要显式处理几何边界、障碍物和组件方向。
  - name: 串并联分组与逆变器匹配模型
    role: 依据组件开路电压、短路电流、额定功率和逆变器输入电压、电流及容量范围，确定每串组件数、并联支路数、逆变器型号和数量。
    why: 组件数量最大并不代表系统可运行，分组方案还必须满足逆变器输入范围、功率容量以及并联支路端电压差不超过10%等电气约束。
  - name: 固定支架最优倾角网格搜索模型
    role: 遍历候选倾角并计算对应全年倾斜面辐射量，确定架空安装时使年辐射收益最大的固定倾角。
    why: 组件朝向和倾角直接影响年发电量，小屋规模较小，不适合复杂跟踪系统，网格搜索能够稳定求得固定支架的近似最优倾角。
  - name: 小屋建筑尺寸规划模型
    role: 以房屋长、宽、高和屋顶几何参数为决策变量，在占地、室内净高、最高点高度和各立面开窗面积约束下，扩大高辐射表面的可铺设面积。
    why: 第三问允许重新设计小屋，需要将建筑规范与光伏铺设目标统一到一个约束规划框架中，而不能只在既定建筑表面进行排布。
  - name: 35年全寿命周期经济评价模型
    role: 累计组件寿命期内的发电量和售电收益，扣除组件及逆变器投资，计算总效益和静态投资回收期。
    why: 题目要求同时报告35年总发电量、按0.5元每千瓦时计算的经济收益以及投资回收年限，需要统一的寿命周期评价口径。
  solution_flow: 读取大同市月度气象辐射、地理纬度、建筑尺寸、组件参数和逆变器参数→将水平面辐射分解并通过倾斜面辐射模型换算各朝向和倾角的有效辐射→计算组件单位面积价格与转换效率的性价比，分别筛选强光表面和弱光表面的候选组件→对屋顶、墙面及障碍区域进行分区，利用矩形排样、准一刀切和CAD局部调整确定组件数量与布置→对架空方案用网格搜索确定约38.1度的固定倾角，并根据太阳高度角和当地纬度计算阵列水平间距→根据开路电压、短路电流、额定功率和逆变器输入范围设计串并联阵列并筛除不可行配置→在第三问中建立建筑尺寸规划模型，求解满足建筑约束且有利于光伏铺设的长宽高参数→累计35年发电量、收益和投资成本，计算回收期→通过几何、电气和经济约束检查以及多方案比较验证结果。
  validation: 采用多层可行性验证：首先用AutoCAD复核组件是否越过屋面和墙面边界、是否覆盖门窗水槽以及排样数量是否真实可安装；其次逐项核验每串组件数是否处于逆变器允许输入电压范围内、并联支路数是否满足额定电流限制、总功率是否不超过逆变器容量，并检查并联支路端电压差不超过10%；再次比较不同组件、不同逆变器数量以及贴附式与架空式方案，对违反约束的方案直接剔除；最后用35年累计发电量、总收益和投资回收期进行经济一致性检验，确认增加铺设面积和优化倾角能够带来合理的发电及收益改善。
  visualization:
  - 各朝向月度太阳辐射强度折线图
  - 光伏组件CAD铺设平面图
  - 组件串并联分组阵列示意图
  - 小屋外形与尺寸设计图
  - 组件准一刀切排样示意图
  - 不同方案发电量、收益和回收期对比表
  pitfalls_avoided:
  - 避免直接用水平面辐射量估算倾斜屋顶发电量，因为屋顶接收的直射、散射和地面反射辐射会随倾角、纬度和太阳位置变化，直接代入会造成系统性偏差。
  - 避免仅按可用总面积除以组件面积确定组件数量，因为组件不可切割且屋顶存在水槽、门窗和不规则边界，面积法会高估实际可安装数量。
  - 避免将不同型号组件串联，因为不同型号组件的电流和电气特性不一致，串联后易出现失配损耗并违反题目规定。
  - 避免将不同建筑表面上的组件进行串并联，因为各表面的朝向和辐照条件不同，混接会引起明显失配，且题目明确禁止跨表面连接。
  - 避免只按逆变器额定功率进行选型，因为即使总功率满足要求，组件串的开路电压、并联电流或端电压差仍可能超出逆变器输入范围，导致方案无法运行。
  - 避免在北向及低辐射墙面盲目铺满组件，因为这些表面的年辐射量低、利润小且回收期长，增加组件不一定提高整体经济性。
  - 避免为小型光伏小屋采用复杂可变倾角或跟踪支架，因为系统规模较小，额外机械结构和控制复杂度难以被增量发电收益抵消，因此选用固定最优倾角。
  - 避免只追求组件数量而忽略阵列遮挡，因为架空组件前后排间距不足会产生阴影损失，论文根据纬度、太阳高度角和组件几何尺寸计算了水平间距。
  innovation_points:
  - 将辐射转换、组件选型、几何排样、电气分组、逆变器匹配和全寿命经济评价串联为一体化优化流程，使建筑空间约束与光伏系统运行约束同时得到满足。
  - 针对不规则建筑表面采用分区加准一刀切排样，并结合AutoCAD局部调整边界空余区域，比简单面积估算更接近实际可施工方案。
  - 按表面辐照条件差异化选用多晶硅与薄膜组件，并主动剔除低辐射、低利润墙面，实现发电能力与投资经济性的折中。
  - 在重新设计小屋时，将最优屋顶倾角、室内净高、建筑高度、占地尺寸和开窗面积共同纳入规划模型，使建筑外形设计直接服务于光伏铺设与发电目标。
- id: 2016_B294
  source_paper: 2016 2016_B294
  problem_type: 综合评价+分类聚类+仿真+优化
  keywords:
  - 小区开放
  - 道路通行能力
  - 交通流仿真
  - 安全性评价
  - 路网便捷度
  context: 研究封闭住宅小区开放后路网结构、交通流、安全性和出行便捷度的变化，为城市规划与交通管理提供定量决策依据。
  models:
  - name: R型聚类分析模型
    role: 依据影响因素之间的相关性，将候选指标归并为道路通行能力、安全性和便捷度三类。
    why: 候选影响因素数量较多且存在相关性，利用相关系数和最长距离法可以降低指标体系的冗余并形成结构清晰的评价维度。
  - name: 层次分析法（AHP）
    role: 构建目标层、准则层和方案层，计算各评价维度及影响因素的权重，并筛选关键指标。
    why: 在缺少完整客观数据的条件下，AHP能够将专家判断定量化，并通过一致性检验控制判断矩阵的逻辑矛盾。
  - name: 元胞自动机交通流模型
    role: 将道路离散为元胞，模拟车辆在开放前后不同路网和交通参数下的时空演化。
    why: 交通流具有离散性、局部相互作用和非线性演化特征，元胞自动机能够以简单规则刻画拥堵形成、传播和消散过程。
  - name: Nagel-Schreckenberg（NS）模型
    role: 通过加速、安全减速、随机慢化和位置更新规则，求取车辆密度与平均速度的关系并评价道路通行能力。
    why: NS模型能体现车辆跟驰、安全间距及随机扰动，适合比较小区开放导致的车道数、拥堵程度、路旁干扰和支路饱和度变化。
  - name: 信号交叉口潜在危险度模型
    role: 按照机－机、机－非机动车、机－人等冲突类型，结合冲突点数量、恶性程度、信号相位时间和类型权重计算安全风险。
    why: 小区开放会增加交叉口和交通冲突点，仅统计事故数难以反映潜在风险，而潜在危险度可以在事故样本不足时定量评价安全性。
  - name: 最短路模型与Dijkstra算法
    role: 把小区及周边道路抽象为图，计算不同端点之间的最短路径，并据此构造可达度指标。
    why: 道路边权非负且需要获得节点之间的最短通行路径，Dijkstra算法求解稳定、含义明确，适合量化开放后绕行程度和路网便捷性。
  - name: 模糊综合评判模型
    role: 融合道路通行能力、安全性和便捷度三个维度，将多模型输出映射到影响程度评语集，形成总体评价。
    why: 各维度量纲不同且影响等级具有模糊边界，模糊综合评判能够统一处理异质指标并输出可解释的综合等级。
  - name: VISSIM微观交通仿真
    role: 复现典型小区开放前后的交通系统运行，对数学模型的交通流结论进行外部验证。
    why: 解析模型包含理想化假设，使用专业微观交通仿真可检验车辆交互、信号控制和路网变化下结论的可靠性。
  solution_flow: 候选指标、专家判断矩阵、典型小区结构、周边路网与车流参数→采用R型聚类将因素归入通行能力、安全性和便捷度三类→利用AHP计算权重、执行一致性检验并筛选车道数、拥堵系数、路旁干扰系数、区内支路饱和度、交叉口个数和可达度六个关键因素→将开放前后道路结构与交通参数分别输入元胞自动机NS模型、交叉口潜在危险度模型和最短路模型→得到密度－速度关系、交叉口风险和可达度→通过模糊综合评判形成总体影响等级→对五类代表性小区进行开放前后对比并划分为适合开放、不适合开放和影响不大三类→结合实际案例与VISSIM仿真验证后提出规划管理建议。
  validation: 首先对AHP各层判断矩阵进行一致性检验，要求CR小于0.1；其次选择五个结构、周边路网和车流量不同的代表性小区进行开放前后对照与敏感情景比较；最后使用实际案例和VISSIM微观交通仿真复现交通系统，将仿真得到的速度、密度、拥堵变化及运行趋势与模型结论交叉验证。
  visualization:
  - 指标体系层次结构图
  - 变量聚类树状图
  - 影响因素权重排序柱状图
  - 车辆密度－平均速度关系曲线
  - 元胞自动机交通时空演化图
  - 开放前后路网结构对比图
  - 交叉口交通冲突点示意图
  - 典型小区综合评价雷达图
  - VISSIM交通仿真截图
  pitfalls_avoided:
  - 避免直接把九个候选因素全部纳入综合评价，因为高度相关或作用较弱的指标会造成重复计权和模型臃肿；先用R型聚类归类，再用AHP总权重筛选六个关键因素。
  - 避免未经检验直接采用专家打分权重，因为两两比较可能存在循环矛盾；对各判断矩阵计算最大特征值、CI和CR，并以CR小于0.1作为可接受条件。
  - 避免仅用交通流量衡量道路通行能力，因为相同流量可能对应自由流和拥堵流两种状态；同时考察车辆密度与空间平均速度，并利用NS模型描述两者关系。
  - 避免将小区开放简单等同于通行能力提升，因为新增支路也会增加交叉口、冲突点和安全风险；将通行能力、安全性与便捷度分别建模后再综合评价。
  - 避免只按交叉口数量线性判断安全性，因为不同冲突类型、严重程度和信号相位下的风险不同；采用冲突类型权重、恶性程度及实际绿黄灯时间加权计算潜在危险度。
  - 避免用直线距离代替实际出行距离，因为道路连通约束和绕行会导致几何距离失真；将路网图论化并用Dijkstra算法计算真实最短路径。
  - 避免直接混合速度、危险度和可达度等不同量纲指标，因为数值尺度差异会扭曲综合结果；通过标准化、权重配置和模糊隶属度映射到统一评语集。
  - 避免把理想化车辆规则直接视为现实结果，因为模型忽略对向车流、非交叉口事故和车型差异等因素；通过实际案例与VISSIM微观仿真进行外部校验，并明确模型适用边界。
  innovation_points:
  - 建立“指标筛选—分维度机理建模—模糊综合评价—小区类型判别”的完整评价链，将交通效率、安全风险和路网便捷性统一纳入开放决策。
  - 将元胞自动机NS交通流模型用于小区开放前后情景对比，通过改变车道数、拥堵系数、路旁干扰和支路饱和度等参数刻画开放效应。
  - 以信号周期内不同类型交通冲突点的时间加权潜在危险度代替单纯事故统计，使缺少历史事故数据时仍可评价交叉口安全性。
  - 基于Dijkstra最短路径构造可达度指标，将小区内部支路连通性和实际绕行程度转化为可计算的便捷性指标。
  - 提出使用九分位法改进聚类分析中的权重确定，以降低主观分档对指标归类和筛选结果的影响。
  - 提出将主成分分析与层次分析法结合，并从因素集、评语集及权重确定方式三个方面改进模糊综合评判模型，以增强客观性和稳健性。
- id: B149_B149答卷
  source_paper: B149 B149_B149答卷
  problem_type: 优化+仿真
  keywords:
  - 太阳辐射建模
  - 光伏组件与逆变器匹配
  - 倾角方位角及铺设优化
  context: 基于大同市气象数据、建筑几何条件和设备电气参数，优化太阳能小屋外表面的光伏组件铺设、逆变器配置及建筑朝向，以提高全寿命周期发电量和经济收益。
  models:
  - name: 任意倾斜面太阳直射辐射模型
    role: 根据纬度、日期、太阳时、墙面方位角和倾角，将水平面直射辐射换算为各墙面及屋顶的直射辐射。
    why: 光伏表面所接收的直射辐射随安装姿态显著变化，必须通过太阳几何关系和倾斜面与水平面的辐射比进行修正。
  - name: Ray异质分布散射辐射模型
    role: 计算不同倾角表面接收的天空散射辐射，并与直射辐射合成为倾斜面总辐射。
    why: 仅考虑直射辐射会低估实际可利用太阳能，而Ray模型同时考虑太阳光盘附近散射和天空均匀散射，具有较好的现实适配性。
  - name: 光伏组件—逆变器整数匹配模型
    role: 枚举组件型号、串联数量、并联支路数与逆变器型号的可行组合，并满足输入电压、电流和额定功率约束。
    why: 设备种类有限且串并联数量为整数，属于带电气约束的有限组合寻优问题，枚举筛选能够完整获得可行匹配集合。
  - name: 全寿命周期单位面积收益优化模型
    role: 以35年发电价值减去组件和逆变器成本后的单位面积收益为目标，对可行阵列组合排序并筛除亏损方案。
    why: 该指标将发电量最大和单位发电成本最小两个目标统一为经济收益，同时兼顾有限建筑表面积的利用效率。
  - name: 建筑表面约束下的阵列排布模型
    role: 在墙体、屋顶面积以及门窗、天窗不可覆盖等几何约束下，优先铺设单位面积收益较高的阵列组合。
    why: 电气上可行的组合不一定能够放入实际墙面，必须结合组件离散尺寸、建筑边界和开口位置完成二次筛选。
  - name: 倾角—方位角搜索优化模型
    role: 先通过最佳倾角模型确定全年最优倾角，再在方位角区间内采用固定步长搜索全年累计辐射最大的朝向。
    why: 架空安装允许调整组件姿态，而辐射目标关于方位角的解析优化较复杂，数值搜索实施简单且能直接利用全年逐时气象数据。
  - name: 太阳能小屋建筑朝向与屋顶几何优化模型
    role: 将最优方位角和倾角用于新小屋设计，在建筑规范约束下调整房屋朝向、屋顶坡度和可铺设面积。
    why: 原建筑的朝向、屋顶倾角和门窗分布限制了光伏利用率，将建筑设计与光伏铺设协同优化可进一步提高总发电量和盈利。
  solution_flow: 数据：整理大同市逐时直射、散射辐射数据，录入建筑尺寸、门窗位置、24种组件和18种逆变器参数；模型：利用太阳几何关系、Klein修正和Ray散射模型计算各表面全年总辐射，将发电量与35年经济价值关联；参数：确定纬度、赤纬角、时角、日出日落时角、表面倾角与方位角，并设置电价、组件效率及设备成本；求解：枚举串并联整数配置并按电压、电流、功率约束筛选，计算单位面积收益后排序，在建筑几何约束下完成贴附式铺设，再搜索架空式最优倾角32度和方位角20度，最后据此重构小屋；验证：检查物理公式、设备约束和几何可实施性，并比较贴附式、架空式及新建小屋方案的发电量、盈利、回收期和单位发电成本。
  validation: 首先进行理论边界检验：当倾角和方位角均为0时，倾斜面退化为水平面，辐射比应为1；其次进行规律一致性检验：计算结果应表现为夏季辐射高于冬季、6月附近达到峰值，且南向屋顶全年辐射高于北向屋顶；再次逐项核验组件串联电压、并联电流、阵列功率、墙面面积及门窗避让约束；最后采用方案对比验证优化效果，架空式相对贴附式总发电量提高14.3%、总盈利提高49.4%、单位发电成本降低12.7%，新建小屋相对原方案总发电量提高42.5%、总盈利提高44.7%。
  visualization:
  - 南、北向屋顶逐月总辐射强度折线图
  - 各墙面与屋顶光伏组件阵列平面布置图
  - 光伏组件串并联及逆变器连接示意图
  - 不同方案经济与发电指标对比表
  - 逆变器—组件可行匹配及单位面积收益排序表
  - 新设计太阳能小屋外形图
  pitfalls_avoided:
  - 避免只使用水平面气象辐射数据直接估算墙面发电量，因为不同倾角和方位角会显著改变直射与散射辐射，必须先换算到实际受光表面。
  - 避免只按逆变器额定功率匹配组件，因为串联开路电压、并联短路电流也可能越界，需同时满足电压、电流和功率三类约束。
  - 避免将电气可行组合直接视为可铺设方案，因为组件具有离散尺寸，且门窗、天窗不能被覆盖，还需进行实际几何排布和边界检查。
  - 避免单纯追求发电量而忽视高价组件和逆变器造成的亏损，因为高辐射利用率不必然带来高经济收益，应以35年净收益和单位面积收益筛选。
  - 避免在低辐射墙面强行铺满组件，因为部分墙面的所有组合在寿命期内均可能亏损，例如东墙最优方案仍为负收益，此时不铺设优于盲目追求面积利用率。
  - 避免在同一逆变器下混接不同规格组件，因为电气特性差异会导致失配损失并增加施工维护难度，因此优先采用同型号组件组成阵列。
  - 避免仅优化组件而固定建筑姿态，因为房屋朝向和屋顶坡度决定长期受光条件，应将南偏西20度朝向和32度屋顶倾角纳入协同设计。
  innovation_points:
  - 将太阳辐射物理模型、设备电气匹配、建筑几何排布和35年寿命周期经济评价连接成一体化优化框架。
  - 用单位面积全寿命周期净收益统一发电量最大与单位发电成本最小两个目标，并据此对数万种组件—逆变器组合进行排序筛选。
  - 分层求解贴附式、架空式和建筑重设计三类方案，使安装姿态优化、设备选配与房屋结构设计逐步协同。
  - 除全年固定最优姿态外，还提出按月调整倾角和方位角的扩展方案，为人工成本允许条件下进一步增加收益提供决策依据。
- id: 2018_D014
  source_paper: 2018 2018_D014
  problem_type: 优化
  keywords:
  - 汽车总装线排序
  - 多约束生产调度
  - 切换成本优化
  context: 在满足品牌班次分配、喷涂线适配、颜色组合、动力与驱动间隔及配置连续性等约束的条件下，为每日460辆汽车制定低切换成本的总装顺序。
  models:
  - name: 分层启发式排序模型
    role: 按照品牌、喷涂线、颜色、驱动、动力、配置的优先级逐层确定车辆排列顺序，并在局部冲突时进行微调。
    why: 问题包含多属性、强约束和软成本目标，直接进行全排列搜索规模过大；分层排序可优先锁定刚性较强的约束，降低后续求解复杂度。
  - name: 黑色车辆分组框架模型
    role: 以数量最多且切换代价最高的黑色车辆为基准，将其划分为每组50至70辆，并保证相邻黑色组之间至少间隔20辆，再将其他颜色填入框架。
    why: 黑色车辆具有连续数量和组间间隔的双重约束，而且与其他颜色切换成本较高，优先确定其位置能够控制主要成本并构建可行排序骨架。
  - name: 奇偶位置喷涂线分配模型
    role: 将总装序列中的奇数位置固定分配至C1线、偶数位置固定分配至C2线，并据此安排只能在指定喷涂线上作业的颜色。
    why: 喷涂线由车辆位置奇偶性唯一决定，而蓝、黄、红只能进入C1线、金色只能进入C2线，因此必须将位置奇偶约束提前纳入颜色排序。
  - name: 稀缺属性间隔插入模型
    role: 优先放置数量较少的四驱车和柴油车，使其连续数量不超过2辆，并尽量保证两批之间分别插入至少10辆两驱车或汽油车。
    why: 四驱与柴油数量较少且具有相似的批量和间隔约束，采用先放置稀缺属性、再用多数属性填充的方法更容易构造可行序列。
  - name: 配置连续化局部优化模型
    role: 在品牌、颜色、动力和驱动位置基本确定后，优先安排数量较少或属性受限的配置，并使同品牌同配置车辆尽量连续。
    why: 配置切换属于成本目标而非首要刚性约束，将其置于最后优化可以避免破坏颜色、喷涂线及间隔等更严格的生产要求。
  solution_flow: 数据→统计每日各品牌、颜色、动力、驱动和配置的车辆数量，并将A1、A2原则上均分到白班和夜班→建立品牌分段、奇偶喷涂线、颜色相容、黑色分组、动力与驱动间隔及配置连续等约束→确定每班A1/A2数量、黑色组数与组长、组间间隔及指定颜色的奇偶位置→采用分层启发式算法依次排列品牌、喷涂线、颜色、驱动、动力和配置，对不满足间隔的局部位置进行微调→核对每日460辆的数量守恒、属性库存一致性、各项装配约束及相邻班次和相邻日期边界，并比较颜色与配置切换次数。
  validation: 对9月17日至9月23日逐日生成装配序列，并进行可行性核验：检查每辆计划车是否被且仅被安排一次，核对各品牌及班次产量，验证奇数位进入C1、偶数位进入C2，检查蓝黄红和金色的喷涂线限制、黑色连续组长度及组间距离、颜色相容关系、四驱与柴油的连续上限和批次间隔；同时检查白班—夜班、当日晚班—次日白班以及七天循环首尾边界。成本效果通过统计喷涂颜色切换次数、黑色与其他颜色的高代价切换次数以及同品牌配置切换次数进行评价；论文主要给出实例可行性验证，未提供与精确算法或基准方案的系统对照。
  visualization:
  - 各日期分品牌颜色数量柱状图
  - 生产循环流程图
  - 算法思路流程图
  - 驱动批次间隔示意图
  - 装配顺序明细表
  pitfalls_avoided:
  - 避免先优化配置连续性，因为配置属于较弱的成本目标，若过早锁定配置块会挤占指定奇偶位置并破坏颜色、动力和驱动等硬约束。
  - 避免忽略喷涂线与总装位置的绑定关系，因为蓝、黄、红只能位于对应C1的奇数位置，金色只能位于对应C2的偶数位置，先排颜色后再分线可能直接产生不可行方案。
  - 避免将黑色车辆随意均匀分散，因为黑色必须以50至70辆连续成组且组间至少间隔20辆，同时其颜色切换代价最高，错误分组会同时造成约束违反和高成本。
  - 避免仅检查单个班次内部约束，因为题目明确要求约束跨越白班与夜班以及相邻日期，班次边界处可能出现黑色组间距不足、柴油或四驱连续超限等问题。
  - 避免只按单一属性排序，因为车辆品牌、颜色、动力、驱动和配置存在耦合；单独满足某类约束后再机械叠加其他属性，可能造成库存数量不匹配或无可行车辆可填。
  - 避免把5至9辆的动力或驱动间隔视为正常方案，因为该区间虽可接受但代价较高，应仅在无法达到至少10辆间隔时作为带惩罚的降级选择。
  innovation_points:
  - 采用约束强度驱动的分层排序策略，将品牌和喷涂线等刚性规则前置，将配置连续性等成本目标后置，从而把复杂多属性调度分解为可操作的连续子问题。
  - 以数量最多且切换成本最高的黑色车辆建立颜色排序骨架，通过跨A1、A2边界连接黑色组并填充其他颜色，兼顾黑色连续区间、组间间隔和切换成本。
  - 将四驱与柴油抽象为结构相似的稀缺属性间隔问题，复用先排稀缺项、再由多数项填充、最后局部微调的启发式规则。
  - 将七天生产计划视为连续循环序列，显式考虑班次、日期以及循环首尾的边界衔接，而不是将每天或每班孤立求解。
- id: 2015_A095
  source_paper: 2015 2015_A095
  problem_type: 优化+仿真
  keywords:
  - 太阳影子定位
  - 双目标规划
  - 粒子群算法
  - 网格逼近
  - Hough变换与透视变换
  context: 利用固定直杆太阳影子的长度与方位随时间的变化，反演视频或观测数据对应的地理位置和拍摄日期。
  models:
  - name: 太阳高度角—影长仿真模型
    role: 根据经纬度、日期、北京时间和杆长计算地方时、时角、太阳赤纬与太阳高度角，进而模拟影长变化。
    why: 垂直杆在水平地面上的影长满足杆长与影长之比等于太阳高度角正切值，且太阳高度角可由标准太阳位置关系确定。
  - name: 太阳方位角模型
    role: 计算不同时间点的理论太阳方位角，并与影子顶点坐标反映的方向变化进行匹配。
    why: 仅使用影长可能产生多组候选位置，引入方位角变化能够增加方向信息并提高地理位置反演的可辨识性。
  - name: 双目标规划模型
    role: 以理论与观测的太阳方位角增量残差、归一化影长残差同时最小为目标，反演经纬度、杆高及日期。
    why: 影长与方位角分别提供尺度和方向特征，联合优化比单一指标更稳健，也能缓解逆问题的多解性。
  - name: 网格逼近算法
    role: 对经纬度和日期等参数进行离散遍历，搜索双目标函数对应的候选最优解。
    why: 参数范围明确且太阳位置模型可直接计算，网格搜索实现简单、结果直观，并可作为其他智能优化算法的基准。
  - name: 基于粒子群算法的目标规划模型
    role: 在日期未知、搜索维数和可行域增大时，高效搜索地点与日期的近似全局最优组合。
    why: 逐日叠加高精度经纬度网格会造成计算量急剧增加，粒子群算法适合连续变量与离散日期混合的非线性黑箱优化，计算时间明显低于全遍历。
  - name: Hough变换与透视变换图像矫正模型
    role: 从抽样视频帧中检测直杆和影子线段，并将斜视图像中的投影长度矫正为地面实际影长。
    why: 摄像机视角会造成长度和角度的透视畸变，未经矫正的像素影长不能直接代入太阳几何模型。
  solution_flow: 数据→读取影子顶点坐标，或对视频间隔抽帧并通过Hough变换检测杆影、透视变换矫正图像→模型→建立地方时、时角、太阳赤纬、太阳高度角、太阳方位角和影长之间的太阳几何模型，再构造方位角增量与归一化影长的双目标规划→参数→设置经度、纬度、坐标轴朝向角、杆高及日期序号，并约束经纬度和太阳高度角的物理范围→求解→日期已知时采用0.01度步长的网格逼近，日期未知时采用粒子群算法搜索地点与日期，并保留因赤纬对称产生的多个候选解→验证→计算影长和太阳方向角残差比，比较网格搜索与粒子群结果，并检查影长随时刻、日期、杆长和经纬度变化是否符合太阳运动规律。
  validation: 采用残差分析与物理一致性检验：分别计算理论值和观测值之间的太阳方向角残差比与影长残差比，典型结果均约为0.35%至2.3%；比较网格逼近和粒子群算法所得经纬度与日期，确认两种算法结果接近；同时检验影长关于杆长呈正比、在当地太阳正午附近达到最小、太阳接近地平线时迅速增大等规律，并将定位结果映射到实际行政地理区域进行合理性核验。
  visualization:
  - 影长—时间变化曲线
  - 影长—日期关系曲线
  - 影长—杆长关系曲线
  - 影长—经度关系曲线
  - 影长—纬度关系曲线
  - 太阳高度角与影长数据表
  - 候选经纬度及误差分析表
  pitfalls_avoided:
  - 避免直接把北京时间当作当地太阳时：不同经度对应不同地方时，若不进行经度时差换算，会使太阳正午时刻、时角和最终定位产生系统偏差。
  - 避免忽略坐标系朝向未知的问题：附件坐标轴未必指向正北，因此引入坐标轴方位朝向角，并优先匹配相邻方位角增量，防止将图像坐标方向误认为真实地理方位。
  - 避免未知杆高或图像尺度影响影长匹配：先对影长序列归一化，再比较其变化形态，从而降低绝对尺度未知对经纬度反演的干扰。
  - 避免仅用影长进行反演：不同地点和日期可能生成相近的影长曲线，联合太阳方位角变化建立双目标函数，可减少多解和误定位。
  - 避免对未知日期进行全年高精度网格穷举：日期加入后搜索空间显著扩大，改用粒子群算法降低计算时间，同时用网格结果进行交叉核验。
  - 避免将斜视视频中的像素投影长度当作真实地面影长：先使用Hough变换提取线段，再通过透视变换矫正，否则摄像机姿态会造成显著尺度和方向误差。
  - 避免强行输出唯一日期：太阳赤纬在一年中可能对应两个相近日期，因此保留多个地点—日期候选组合，更符合该逆问题的固有非唯一性。
  - 避免使用太阳位于地平线以下的数据：通过约束太阳高度角处于有效范围，排除理论上无地面太阳影子的时间与地点组合。
  innovation_points:
  - 将影长变化和太阳方位角增量联合为双目标规划，在坐标朝向与杆高未知的情况下仍可反演地理位置。
  - 采用归一化影长消除未知杆高或图像比例尺的主要影响，并利用方位角差分削弱坐标系绝对朝向未知带来的干扰。
  - 针对日期未知导致的高维大范围搜索，引入粒子群算法替代全年经纬度穷举，在保持结果接近的同时显著缩短计算时间。
  - 构建从视频抽帧、Hough线段检测、透视矫正到太阳几何反演的一体化流程，使模型可由结构化坐标数据扩展到真实视频定位。
  - 承认并输出由太阳赤纬周期对称性导致的多个可能日期，而不是把具有天然多解性的定位问题简化为单一答案。
- id: B_cumcm0737
  source_paper: B B_cumcm0737
  problem_type: 优化+综合评价+仿真
  keywords:
  - 动态规划
  - 最短路径
  - Dijkstra算法
  - CSI准则
  - 多模式公交网络
  context: 面向奥运期间城市公共交通查询需求，在公交、地铁及步行相互衔接的网络中为任意起终点选择兼顾时间、票价和换乘次数的最优出行路线。
  models:
  - name: 基于图论的公交网络模型
    role: 将站点视为节点、公交或地铁区段视为有向边，利用线路—站点直达矩阵、邻接矩阵和可达矩阵描述网络连接关系。
    why: 图模型能够统一表达线路方向、站点顺序、直达关系和多次换乘关系，并为路线枚举和最短路径算法提供结构化基础。
  - name: 分层可达矩阵与换乘网络模型
    role: 分别构造零次、一次、二次及至多若干次换乘的可达矩阵，生成对应换乘层级下的可行路线集合。
    why: 按换乘次数分层能够控制组合搜索规模，判断起终点在给定换乘上限内是否可达，并保留具体线路和换乘站信息。
  - name: 多目标路线优化模型
    role: 以路线总耗时、总票价和换乘次数为主要优化指标，在满足可达性和线路连续性的条件下筛选候选路线。
    why: 乘客对路线的偏好通常不只取决于单一最短时间，必须同时考虑经济成本和换乘便利性。
  - name: CSI综合评价模型
    role: 对候选路线的时间、票价及换乘指标进行极差标准化，形成评价向量，并以评价向量到理想点零向量的距离作为最终排序依据。
    why: 不同指标量纲和数量级不一致，标准化后才能进行综合比较；距离越接近零，表示路线越接近各指标的理想水平。
  - name: 基于夹逼序列的分层动态规划算法
    role: 按照换乘层级逐层扩展和筛选状态，在候选路线中搜索综合目标下的最优解。
    why: 直接枚举大型公交网络中的全部路径会产生组合爆炸，动态规划可利用阶段结构和局部状态压缩提高求解效率。
  - name: 公交—地铁多模式网络仿真模型
    role: 将地铁线路作为特殊线路接入公交网络，并通过交通方式类型标记及换乘时间矩阵、步行时间矩阵计算跨方式换乘成本。
    why: 公交与地铁的运行时间及公交换公交、公交换地铁、地铁换公交、地铁换地铁的换乘成本不同，需要分类建模才能准确评价多模式路线。
  - name: 改进Dijkstra最短路径模型
    role: 对动态规划得到的公交路线结果进行独立检验，并评估模型提供最优线路的有效性和计算速度。
    why: Dijkstra算法是非负权网络最短路径的经典基准方法，可用于交叉验证路线搜索结果是否合理。
  solution_flow: 数据→解析公交与地铁线路、站点顺序、上下行方向、票制及区间行驶时间，对环线和单行线路进行预处理→建立线路—站点直达矩阵、邻接矩阵和分层可达矩阵→构造仅公交、公交—地铁以及进一步加入步行连接的多模式网络→计算每条候选路线的区间行驶时间、候车与换乘耗时、步行时间、票价和换乘次数→采用基于夹逼序列的分层动态规划搜索可行路线→利用CSI准则标准化多目标指标并按理想点距离排序，选出最优路线→使用改进Dijkstra算法对仅公交场景的结果进行交叉验证。
  validation: 采用算法交叉验证：将分层动态规划和CSI评价得到的最优路线与改进Dijkstra算法的最短路径结果进行比较，检查路线可达性、站点与线路衔接合法性以及总耗时计算的一致性；同时通过给定的6组起终点案例检验模型能否稳定输出线路、换乘站、总时间和总票价。
  visualization:
  - 公交及地铁网络拓扑图
  - 邻接矩阵或可达矩阵热力图
  - 候选路线时间—票价散点图
  - 最优路线与换乘站示意图
  - 不同方案总耗时、票价和换乘次数对比表
  pitfalls_avoided:
  - 避免忽略公交上下行方向：用正负站序分别标记上行和下行，否则会把实际不能逆向乘坐的站点错误判为直达。
  - 避免将环线和单向线路按普通双向线路处理：先识别环线并划分方向，对单行线路单独赋值，从而防止产生不存在的反向路径。
  - 避免只计算车内行驶时间：在总耗时中加入候车、换乘和换乘步行时间，否则多次换乘路线会被系统性低估。
  - 避免对不同交通方式采用同一换乘成本：分别设置公交—公交、公交—地铁、地铁—公交和地铁—地铁的换乘耗时及步行时间矩阵，以反映方式衔接差异。
  - 避免直接加总不同量纲指标：先对时间、票价和换乘次数进行标准化，再使用CSI距离综合排序，防止数值尺度较大的指标不合理地主导结果。
  - 避免无约束枚举所有路径：按照换乘次数建立分层可达网络并利用动态规划筛选，降低大型网络中的组合爆炸风险。
  - 避免仅凭单一算法认定结果最优：使用改进Dijkstra算法进行独立复核，减少动态规划状态设计或程序实现错误导致的伪最优结果。
  innovation_points:
  - 以线路—站点有向矩阵为基础，递推构造不同换乘次数的可达矩阵，实现公交、地铁和步行网络的统一分层表达。
  - 将总耗时、总票价和换乘次数标准化为CSI评价向量，并以其到零理想点的距离定义路线综合优劣。
  - 采用基于夹逼序列的分层动态规划，在限制换乘层级的同时快速筛选多目标最优路线。
  - 利用交通方式标记和换乘成本矩阵区分四类跨方式换乘，使公交—地铁路线的时间评价更加细化。
  - 将动态规划求解与改进Dijkstra算法结合，形成多目标推荐与经典最短路径交叉验证的双层求解框架。
- id: B题_高等教育学费标准探究—浙江大学队伍
  source_paper: B题 B题_高等教育学费标准探究—浙江大学队伍
  problem_type: 综合评价+统计分析+优化
  keywords:
  - 学费合理性指数
  - 价格需求曲线
  - 成本分担
  context: 基于国家生均拨款、高校培养成本、城乡家庭收入和毕业收益等数据，评价现行高校学费的合理性，并制定兼顾教育公平、办学质量与成本分担的收费及补助标准。
  models:
  - name: 地域—专业逐步线性回归模型
    role: 分析地域经济发展程度和专业类别对学费的影响，并估计不同培养模式下的平均学费。
    why: 学费同时受到地区和专业因素影响，逐步线性回归可筛选显著变量、量化边际影响，并为均值接近度指标提供同类比较基准。
  - name: 学费合理性多指标综合评价模型
    role: 从培养费用分担度、公平性、同类均值接近度和相对回报投入比四个维度计算学费合理性指数，对学校及专业收费进行排序和诊断。
    why: 学费合理性涉及财政负担、家庭支付能力、横向收费差异和个人教育回报，单一指标无法全面反映，需要标准化后进行加权综合评价。
  - name: 基于价格需求曲线的分层补助模型
    role: 描述不同收入群体对高等教育价格的需求差异，分析统一定价造成的机会不公平，并确定低收入学生补助额随学费变化的关系。
    why: 不同收入家庭的支付意愿和价格敏感度不同，价格需求曲线能够解释高学费导致的需求退出，并为差异化定价和精准补助提供经济学依据。
  - name: 高等教育成本分担比例模型
    role: 估算高校生均培养成本，在国家纯公共收益最大化条件下推导政府投资额、政府与个人成本分担比例及合理学费标准。
    why: 高等教育具有准公共产品属性，政府和个人均能获益，采用成本分担理论并设置公共收益最大化目标，可将合理收费转化为可计算的优化问题。
  solution_flow: 收集城乡家庭收入分档、生源比例、学校与专业学费、毕业收入、国家拨款和在校生规模等数据→按地区发展程度和专业类别进行分类，并用逐步线性回归识别学费影响因素→依据家庭可接受学费不超过收入30%的假设，用分段线性收入分布计算各学费水平下的可负担家庭比例→构造培养费用分担度、公平性、均值接近度和相对回报投入比指标，采用极差法与归一化处理→通过三级标度相对比较法确定权重，计算学费合理性指数并设置预警阈值→利用价格需求关系研究分收入群体定价与补助额度→估算生均培养成本，以国家纯公共收益最大化推导成本分担比例和合理收费标准→通过统计检验、样本计算、阈值分析、数据对照及参数灵敏度分析验证结果。
  validation: 对地域—专业回归模型使用显著性检验和拟合优度检验，得到p值6.38×10^-6且R²为0.71；对综合评价模型用18个学校—专业样本计算四项指标及综合指数，并比较典型对象的指标结构；通过遍历学费区间检验培养费用分担函数的变化规律，得到最大分担比例0.1698及对应学费区间[5594,6259]，并与国际惯例中个人分担比例不超过25%的标准比较；另外分别计算仅考虑城镇家庭和综合考虑城乡差异的结果，以检验城乡因素影响；补助模型通过实际数据检验可行性与合理性，成本分担模型则对关键参数实施灵敏度分析。
  visualization:
  - 城乡家庭年均收入分布柱状图
  - 学费关于地域与专业的回归分析图
  - 四项评价指标雷达图或分组柱状图
  - 学费与培养费用分担比例关系曲线
  - 不同学校专业学费合理性指数排序图
  - 不同收入群体的价格需求曲线
  pitfalls_avoided:
  - 避免仅用学费高低判断合理性，因为相同学费可能在培养成本、家庭承受能力和毕业回报方面表现完全不同，论文通过四维指标进行综合评价。
  - 避免直接将量纲和方向不同的指标相加，因为分担比例、支付能力、均值偏差和投入回报比不可直接比较，论文先进行极差处理和归一化再加权。
  - 避免忽略城乡收入与入学机会差异，因为仅使用城镇收入会高估家庭支付能力和学费分担水平，论文结合城乡收入分布及城乡生源比例进行加权计算。
  - 避免把收入分档数据直接视为离散点，因为这会使学费可负担人数随价格发生不连续跳变，论文假设档内家庭均匀分布并构造分段线性函数。
  - 避免认为提高学费必然增加高校学费收入，因为价格上涨会降低能够支付学费的学生比例，论文通过区间遍历发现分担比例先升后降并存在最大值区间。
  - 避免对不同地区和专业采用统一均值评价，因为专业培养成本和就业前景是学费差异的主要来源，论文先按地域与专业形成九类培养模式，再进行同类比较。
  - 避免完全依赖主观权重，因为任意赋权会显著影响综合排名，论文使用具有互补性和传递约束的相对比较矩阵计算指标权重。
  - 避免用统一定价掩盖低收入群体的机会损失，因为不同收入群体的需求价格弹性不同，论文引入价格需求曲线设计差异化补助。
  innovation_points:
  - 将学费合理性分解为培养成本分担、教育公平、同类收费偏差和个人投入回报四个维度，并融合为可排序、可预警的单一合理性指数。
  - 把城乡分档收入分布、生源结构和家庭可承受比例共同嵌入支付能力计算，使教育公平指标具有明确的人口统计基础。
  - 将地区—专业回归分类结果用于构造同质教育的收费基准，兼顾学费差异的客观合理性与横向可比性。
  - 发现学费收入对培养成本的分担比例并非随学费单调增加，而是存在最优价格区间，为收费优化提供了定量依据。
  - 将价格需求理论与成本分担理论衔接起来，同时给出合理学费、政府投入比例和困难家庭补助方案，形成评价—补助—定价的一体化框架。
- id: 2017_A156
  source_paper: 2017 2017_A156
  problem_type: 优化+仿真
  keywords:
  - 黄金分割法
  - 单目标优化
  - 滤波反投影重建
  context: 利用已知模板的CT投影数据标定旋转中心、探测器单元间距和180个射线方向，并据此重建未知介质的位置、形状及吸收率。
  models:
  - name: 朗伯-比尔吸收模型
    role: 建立射线接收数据与介质沿射线路径吸收率积分之间的关系，并在标定模板吸收率恒为1时化简为接收数据与穿透厚度成正比。
    why: 该模型符合X射线在介质中的指数衰减规律，是连接CT测量数据、几何弦长和介质吸收率的物理基础。
  - name: 圆形模板弦长几何模型
    role: 根据圆的半径、首条有效射线到边缘的距离及探测器间距，计算各平行射线穿过圆形模板的理论厚度。
    why: 圆形模板方向不变性强、弦长具有显式公式，可减少模板姿态对探测器间距标定的影响。
  - name: 探测器间距单目标优化模型
    role: 以相邻理论弦长比与相邻实测数据比的误差平方和为目标，联合搜索首条射线边缘偏移量并确定探测器单元间距。
    why: 使用比值可消除未知增益系数和量纲影响，将系统参数标定转化为一维有界优化问题。
  - name: 黄金分割搜索模型
    role: 在由圆直径和有效射线条数确定的区间内逐步压缩探测器间距的取值范围，直至达到给定精度。
    why: 探测器间距只有一个连续决策变量且初始区间明确，黄金分割法无需导数、计算稳定，适合高精度区间搜索。
  - name: 旋转中心几何标定模型
    role: 分别在射线平行椭圆长轴和短轴时搜索首条有效射线的位置，再利用第256.5条探测器中心线计算旋转中心横、纵坐标。
    why: 探测器阵列中垂线始终经过旋转中心，选择椭圆主轴方向可简化弦长计算，并将二维中心定位分解为两个一维问题。
  - name: 遍历搜索优化模型
    role: 以固定步长遍历首条射线边缘距离或射线角度，选取理论投影与实测投影误差平方和最小的参数。
    why: 变量范围有限且目标函数可能难以解析求导，遍历搜索实现简单，并可通过减小步长控制求解精度。
  - name: 最小二乘比例系数模型
    role: 估计理论穿透厚度与实际接收数据之间的比例系数，为不同角度的投影匹配提供统一尺度。
    why: 接收数据与路径长度近似线性相关，最小二乘法能够利用全部观测降低单点误差影响。
  - name: Radon正变换模型
    role: 根据已标定的旋转中心、探测器间距和候选角度计算模板在512条平行射线上的理论投影。
    why: 二维CT平行束投影本质上是吸收率函数沿直线的积分，Radon变换能够统一描述任意方向的投影数据。
  - name: 射线方向单目标优化模型
    role: 对每组512维接收数据搜索对应角度，使Radon理论投影经比例变换后与实测数据的误差平方和最小，从而标定180个方向。
    why: 角度与数据列之间缺乏直接对应关系，通过整列投影匹配可充分利用模板几何特征，减少局部数据造成的角度歧义。
  - name: 滤波反投影重建模型
    role: 利用标定后的投影角度和系统几何参数，对未知介质数据进行滤波、反投影与降噪，恢复位置、轮廓和吸收率分布。
    why: 滤波反投影基于中心切片定理，适用于平行束CT；相较于直接反投影，频域滤波可抑制反投影模糊，后续降噪可改善伪影。
  - name: 噪声扰动稳定性模型
    role: 向接收数据加入扰动后重新计算旋转中心、探测器间距和射线角度，以参数波动评价标定稳定性。
    why: 设备老化和测量不灵敏主要表现为数据噪声，扰动实验能够直接检验标定结果对观测误差的敏感程度。
  solution_flow: 读取180×512接收数据并依据非零区段识别圆形和椭圆投影→由朗伯-比尔定律得到接收值与穿透厚度的比例关系→利用有效射线条数确定探测器间距初始区间→建立弦长比误差平方和模型并用黄金分割法求得间距0.2768
    mm→筛选椭圆长轴、短轴对应数据列，遍历首条有效射线边缘偏移量并由探测器中心线求得旋转中心(-9.3040, 6.2149)→用最小二乘法估计投影比例系数1.7725→对候选角度实施Radon正投影并最小化理论值与实测值误差，迭代获得180个射线方向→将标定参数代入滤波反投影和降噪算法，重建未知介质并读取指定位置吸收率→通过误差范围、残差比较和加噪扰动分析检验精度与稳定性。
  validation: 精度验证包括：根据圆直径与有效射线条数给出探测器间距的可行区间，以黄金分割终止区间小于10^-5控制数值精度；比较理论弦长比、Radon理论投影与实测数据的残差平方和，检查参数拟合一致性；分析基准数据列选择对旋转中心和角度的影响。稳定性验证采用加噪扰动实验，在接收数据受扰后重复完整标定，比较旋转中心坐标、探测器间距及射线角度的波动范围，并利用已知模板或新模板的重建结果检查几何位置和吸收率恢复效果。
  visualization:
  - 接收数据非零区段与探测器编号分布图
  - 圆形和椭圆模板的射线弦长几何示意图
  - 黄金分割搜索区间收敛图
  - 目标函数随探测器间距或射线角度变化曲线
  - 180个射线方向角分布图
  - 未知介质滤波反投影重建灰度图
  - 加噪前后标定参数误差对比图
  pitfalls_avoided:
  - 避免直接用接收数据绝对值拟合几何厚度，因为系统增益系数未知会引入尺度偏差；改用相邻数据比与弦长比构造目标函数以消除比例系数。
  - 避免在圆形与椭圆投影重叠的数据列上标定间距，因为不同介质的贡献难以分离；优先选取两段非零区域之间存在零值间隔的数据列。
  - 避免用椭圆任意方向的弦长标定探测器间距，因为姿态和求交公式复杂且误差敏感；选用具有旋转对称性的圆形模板。
  - 避免忽略512个探测器为偶数造成的中心索引偏差；阵列中心应位于第256与257条射线之间，即按第256.5条中心线计算。
  - 避免使用单个最大值直接判定所有扫描方向，因为噪声或模板重叠可能导致误判；以整列512维理论投影与实测投影的误差平方和确定角度。
  - 避免直接反投影导致中心发亮、边缘模糊和条纹伪影；在反投影前加入频域滤波，并在重建后实施降噪。
  - 避免只报告最优参数而不分析可重复性；通过改变基准列和加入测量噪声重新标定，量化参数对数据扰动的敏感性。
  innovation_points:
  - 将未知增益下的CT几何标定转化为相邻投影比值的单目标优化问题，并结合黄金分割与细步长遍历实现无导数高精度求解。
  - 建立从探测器间距、旋转中心、180个射线方向到未知介质滤波反投影重建的完整标定—成像链条，使系统参数与图像恢复相互衔接。
  - 利用椭圆主轴方向和圆形模板的几何特性进行分阶段标定，将复杂多参数问题拆分为多个可控的一维优化问题。
  - 提出由正方形与圆形均匀固体介质组成的新标定模板，以规则边界替代弦长计算复杂的椭圆，增强方向辨识能力并改善标定精度与稳定性。
- id: B题_cumcm0849
  source_paper: B题 B题_cumcm0849
  problem_type: 预测+综合评价+优化+统计分析
  keywords:
  - 学费合理化指数
  - 层次分析法与熵值取权法
  - 灰色预测与蛛网模型
  context: 针对高校学费增长、居民支付能力与高校办学资金需求之间的矛盾，综合供求、支付能力、财政支持、个人收益率和教育成本，并考虑学校属性、专业类型及地域差异，评价和制定合理的高等教育学费标准。
  models:
  - name: GM(1,1)灰色预测模型
    role: 利用有限年份的招生数据预测未来高校招生人数，并为教育市场需求曲线的规模校准提供参数。
    why: 高校扩招后可用时间序列较短，招生人数又受到多种难以完整识别的因素影响，灰色模型适合小样本、贫信息系统的趋势预测。
  - name: 蛛网模型
    role: 构建高等教育市场的供给曲线与需求曲线，通过二者交点确定市场调节下的均衡学费，并利用交点处斜率判断均衡稳定性。
    why: 将教育服务视为具有供求约束的准公共产品后，蛛网模型能够刻画招生供给与家庭入学需求对学费变化的动态响应，并给出稳定均衡价格。
  - name: 回归分析与曲线拟合模型
    role: 分别拟合学费与家庭支付承受力、国家财政教育支出、教育成本等因素之间的函数关系，形成合理化指数的基础指标函数。
    why: 相关变量之间不存在直接可用的确定性公式，需要借助历史统计数据识别数量关系，并通过决定系数评价拟合效果。
  - name: 简化明瑟收益率模型
    role: 衡量接受本科教育相对于高中教育带来的个人收入增量及其与学费之间的关系，构造个人收益率指标。
    why: 高等教育具有投资属性，明瑟收益框架可将学历带来的工资收益差异纳入学费合理性评价。
  - name: 极差归一化模型
    role: 将五个影响因素的指标函数统一到可比较的无量纲尺度，为后续加权综合评价提供标准化输入。
    why: 财政支出、人口比例、收益和教育成本等指标的单位及数量级差异显著，若直接加权会使大数量级指标不合理地主导结果。
  - name: 层次分析法
    role: 建立“学费合理化指数—效率与公平—五类影响因素”的层次结构，通过成对比较矩阵得到五个因素的主观权重。
    why: 学费标准同时涉及效率、公平和多项难以直接统一度量的因素，层次分析法适合将定性判断转化为结构化权重。
  - name: 熵值取权法
    role: 根据指标数据的信息差异度计算客观权重，并对层次分析法所得权重进行修正，形成组合权重。
    why: 层次分析法的成对比较矩阵依赖专家判断，熵权法能够利用样本数据的离散程度降低权重设定中的主观偏差。
  - name: 组合加权综合评价模型
    role: 将标准化后的五项指标函数与组合权重加权汇总，构造学费合理化指数函数，拟合最佳学费曲线及合理波动区间。
    why: 单一因素无法同时反映居民承受能力、高校资金需求和社会公平，组合评价可在多目标冲突下给出综合合理程度及推荐收费水平。
  - name: 学校属性—专业类型—地域差异修正模型
    role: 通过学校等级、财政分配、专业热度和地区财政支持等修正矩阵调整五项指标函数，使平均学费标准转化为分类、分专业和分地区的学费标准。
    why: 模型一只能得到全国平均最优学费，无法反映不同学校办学条件、专业培养成本与需求热度以及地区经济和财政能力的异质性。
  solution_flow: 收集1991—2006年招生规模、城乡家庭收入与支出、历年学费、财政教育支出、毕业生工资和生均教育成本等数据→筛选出教育供求、家庭支付能力、财政及捐助、个人收益率、教育成本五项核心因素→用GM(1,1)预测招生人数，并建立供需曲线和蛛网模型求市场均衡学费→采用回归拟合及简化明瑟模型建立学费与五项因素的函数关系→对指标函数实施极差归一化→以效率和公平为准则建立层次分析模型，计算主观权重→用熵值取权法计算客观权重并形成组合权重→构造学费合理化指数函数，求取指数最优对应的学费及合理波动区间→利用学校属性、专业类型和地域差异修正矩阵调整基础指标与收费结果→通过样本数据、均衡稳定性、灵敏度和稳定性检验评价模型。
  validation: 首先以GM(1,1)预测曲线与历史招生数据的贴合程度检验预测有效性；其次使用回归决定系数检验函数拟合质量，文中家庭支付能力和财政支出拟合的R²分别约为0.9819和0.9879；再次比较蛛网模型均衡点处供给与需求曲线斜率绝对值，以供给曲线斜率大于需求曲线斜率的判据确认3225.51元均衡点稳定；随后用若干实际收费数据检验学校、专业和地域修正后的结果；最后对权重、指标和关键参数进行灵敏度检验与稳定性检验，判断推荐学费及其波动区间是否稳健。
  visualization:
  - 灰色预测值与历史招生人数对比折线图
  - 学费供给曲线与需求曲线及均衡交点图
  - 家庭支付能力分布函数拟合曲线图
  - 学费与国家财政教育支出的回归拟合图
  - 生均教育成本与学费关系拟合图
  - 层次分析法层级结构图
  - 最佳学费曲线及合理波动区间图
  - 灵敏度与稳定性分析图
  pitfalls_avoided:
  - 避免仅依据市场供求关系直接定价，因为高等教育具有准公共产品属性，国家财政拨款、社会公平和居民支付能力都会使完全市场化的均衡价格失真。
  - 避免直接加总不同单位和数量级的指标，因为财政支出、人口比例、工资收益和教育成本的数值尺度差异会使大数量级变量主导综合指数，因此先实施极差归一化。
  - 避免完全依赖层次分析法的专家主观判断，因为成对比较矩阵可能受评价者偏好影响，因此引入熵值取权法，以数据的信息差异度修正权重。
  - 避免把供需曲线交点直接视为可行均衡，因为交点可能处于发散状态，因此进一步比较均衡点处供给与需求曲线斜率，检验蛛网动态稳定性。
  - 避免用全国平均学费覆盖所有高校，因为学校等级、专业培养成本与热度、地区收入及财政支持存在显著差异，因此使用三类修正矩阵进行分类定价。
  - 避免只给出单点学费而忽略数据误差与现实波动，因为统计数据、拟合关系和权重均具有不确定性，因此同时给出最佳学费曲线、合理波动区间并进行灵敏度检验。
  - 避免在小样本招生序列上盲目使用依赖大样本的复杂预测模型，因为扩招后的有效数据较少且影响机制不完全清楚，因此采用适合贫信息系统的GM(1,1)模型。
  innovation_points:
  - 构建以效率和公平为准则、以五项关键因素为方案层的学费合理化指数，将市场均衡、家庭承受能力、高校办学资金和教育投资收益统一到同一评价体系。
  - 将层次分析法的主观权重与熵值法的客观权重组合，在保留政策与专家判断的同时利用数据差异度降低主观偏差。
  - 把GM(1,1)招生预测与蛛网供需模型连接起来，先预测市场规模，再求解学费均衡点并验证其动态稳定性。
  - 在全国平均最优学费模型上引入学校属性、专业类型和地域差异三类修正机制，使模型从平均评价扩展为分类、分专业和分地区定价。
  - 不只输出单一推荐价格，还拟合最佳学费曲线及合理波动区间，并通过灵敏度和稳定性分析增强政策建议的可操作性。
- id: B题_cumcm0849—关于高等教育学费评价的标准及建议
  source_paper: B题 B题_cumcm0849—关于高等教育学费评价的标准及建议
  problem_type: 预测+优化+综合评价+统计分析
  keywords:
  - 学费合理化指数
  - 层次分析法
  - 熵值取权法
  - GM(1,1)灰色预测
  - 蛛网模型
  - 差异化学费修正
  context: 基于1991—2006年统计数据，综合考虑教育供求、家庭承受力、财政支持、个人收益率和教育成本，并结合学校属性、专业类型及地域差异，评价和优化高等教育学费标准。
  models:
  - name: GM(1,1)灰色预测模型
    role: 预测未来高校招生人数，为教育市场需求规模和供求均衡学费的计算提供输入。
    why: 高校扩招后可用历史数据较少，招生规模又受多种难以完全识别的因素影响，灰色模型适用于小样本、贫信息系统的趋势预测。
  - name: 蛛网模型
    role: 构建高等教育供给曲线与需求曲线，通过稳定均衡点求取市场调节下的参考学费。
    why: 可将教育服务视为具有价格响应的准市场商品，并利用供需曲线斜率判断均衡价格是否稳定。
  - name: 回归分析与曲线拟合模型
    role: 拟合学费与家庭支付承受力、国家财政支出、个人收益率及教育成本之间的函数关系。
    why: 各影响因素与学费之间缺少明确的理论解析式，利用历史数据回归可以量化相关关系，并通过决定系数评价拟合程度。
  - name: 简化明瑟收益率模型
    role: 刻画接受本科教育相对于高中教育的个人收益及其与学费之间的关系。
    why: 学费决策不仅取决于培养成本，还应反映高等教育给个人带来的收入增量，明瑟收益框架可将教育投入与工资回报联系起来。
  - name: 极差归一化模型
    role: 统一五个学费影响指标的量纲和数量级，形成可加权综合的标准化指标函数。
    why: 财政支出、人口比例、收益和教育成本等指标单位及数值范围差异明显，未经标准化直接加权会使大数量级指标不合理地支配结果。
  - name: 层次分析法
    role: 以学费合理化指数为目标层、效率与公平为准则层、五项影响因素为方案层，计算各因素的主观权重。
    why: 学费标准同时包含效率和公平等难以直接统一度量的多准则目标，层次分析法能够把定性判断转化为成对比较和定量权重。
  - name: 熵值取权法
    role: 根据指标数据的信息差异度计算客观权重，并对层次分析法权重进行修正，得到组合权重。
    why: 层次分析法的成对比较矩阵带有专家主观性，熵权能够利用数据离散程度补充客观信息，降低单一主观赋权造成的偏差。
  - name: 学费合理化指数优化模型
    role: 将五个标准化指标按组合权重集成为学费的综合评价函数，搜索最佳学费及其合理波动区间。
    why: 单个因素无法同时反映学校运营效率和社会公平，需要通过综合指数比较不同学费方案并确定整体最优水平。
  - name: 学校属性—专业类型—地域差异修正模型
    role: 根据学校等级与财政支持、专业热度及地区经济和财政差异修正五项指标，将全国平均学费推广为分类学费标准。
    why: 模型一只给出平均最优值，忽略不同学校、专业和地区的异质性；加入修正矩阵可提高结论的适用范围和现实合理性。
  solution_flow: 收集并筛选1991—2006年招生规模、城乡家庭收入与支出、平均学费、财政教育支出、毕业生工资和生均教育成本等数据→使用GM(1,1)预测招生人数→按城乡及收入阶层估计家庭支付能力并拟合需求曲线，结合招生人数与历史学费拟合供给曲线→利用蛛网模型求供需均衡学费并通过斜率判断稳定性→分别回归得到家庭承受力、财政支持、个人收益率和教育成本关于学费的函数→对五项指标进行极差归一化→建立“合理性—效率/公平—五因素”的层次结构，通过层次分析法求主观权重→利用熵值法求客观权重并融合为组合权重→构造学费合理化指数函数，求取最佳学费曲线和波动区间→引入学校属性、专业类型和地域差异修正矩阵，得到分类学费标准→通过样本数据、灵敏度分析、稳定性分析和拟合优度检验验证结果。
  validation: 采用多层次验证：用灰色预测拟合图检查招生人数预测与历史趋势的一致性；用回归决定系数检验函数拟合效果，其中家庭承受力和财政支出拟合的R²分别约为0.9819和0.9879；在蛛网均衡点比较供给与需求曲线斜率绝对值，因|Ks|约为311.216、|Kd|约为43.9023且|Ks|>|Kd|，判定3225.51元均衡点稳定；对组合权重、修正因子和输入数据进行灵敏度与稳定性检验；最后用若干实际数据检验学校、专业和地区修正后的学费结果，其平均最佳值约为3000元。
  visualization:
  - GM(1,1)预测值与历史招生人数拟合折线图
  - 高校教育供给—需求曲线及蛛网均衡点图
  - 收入阶层分布与家庭支付承受力拟合曲线图
  - 学费与国家财政教育支出的回归拟合曲线图
  - 生均教育成本与学费关系散点拟合图
  - 层次分析法目标层—准则层—方案层结构图
  - 最佳学费曲线及合理波动区间图
  - 灵敏度变化曲线图
  pitfalls_avoided:
  - 避免仅用市场供求决定学费，因为高等教育具有公共服务属性，国家财政拨款和政策导向会使其偏离完全竞争市场；因此同时纳入财政支持、公平性和教育成本。
  - 避免直接对不同单位和数量级的指标加权，因为财政金额、人口比例、收益率和成本的尺度差异会造成大数值指标主导综合指数；因此先进行极差归一化。
  - 避免完全依赖层次分析法的主观判断，因为成对比较矩阵容易受专家偏好影响；因此引入熵值取权法，根据样本信息量修正权重。
  - 避免在样本较少且影响机制复杂时强行使用高参数时间序列模型，因为扩招后的有效招生数据有限；因此采用适合小样本、贫信息环境的GM(1,1)模型。
  - 避免只求供需曲线交点而不检验其可实现性，因为蛛网系统中的均衡点可能发散；因此比较供给和需求曲线在交点处的斜率以验证动态稳定性。
  - 避免将全国平均最优学费直接用于所有高校，因为学校等级、专业培养成本与热度、地区经济水平和财政支持存在显著差异；因此设置三类修正矩阵形成差异化标准。
  - 避免把高拟合优度直接等同于因果关系，因为财政支出、学费和招生规模可能共同随时间变化；论文将回归关系主要作为综合评价的量化输入，并辅以机制分析和稳定性检验，而非单独作因果结论。
  - 避免给出单一精确学费而忽略数据与参数扰动，因为权重、收入分布和财政支持均存在不确定性；因此同时给出最佳学费曲线、合理波动区间以及灵敏度检验结果。
  innovation_points:
  - 构建兼顾效率与公平的“学费合理化指数”，将供求关系、家庭承受力、财政与社会捐助、个人收益率和教育成本统一到同一综合评价框架。
  - 采用层次分析法与熵值取权法相结合的主客观组合赋权方式，在保留政策价值判断的同时降低主观权重偏差。
  - 将GM(1,1)招生预测、城乡分层支付能力估计和蛛网模型连接起来，从动态供需角度计算并检验市场参考学费。
  - 在全国平均最优学费基础上引入学校属性、专业类型和地域差异三类修正因子，实现由统一定价向分类、分地区定价的扩展。
  - 不仅输出最优点，还给出合理波动区间，并通过斜率稳定性、参数灵敏度和实际数据检验增强结论的可解释性与稳健性。
- id: 2018_A229
  source_paper: 2018 2018_A229
  problem_type: 仿真+优化
  keywords:
  - 非稳态多层热传导
  - 有限差分法
  - 服装厚度优化
  context: 通过模拟高温环境下热量在多层防护服及衣下空气层中的传递过程，优化织物层和空气层厚度，使人体皮肤外侧温度满足热安全要求。
  models:
  - name: 一维多层非稳态热传导模型
    role: 描述四层织物及空气层内部温度随空间和时间的变化，计算完整温度场与皮肤外侧温度。
    why: 服装各层可近似为平行、各向同性介质，且热量主要沿垂直皮肤方向传递；空气层厚度不超过6.4mm时可忽略对流，辐射相对较弱，因此可采用基于Fourier定律的一维非稳态导热方程。
  - name: 多介质界面连续模型
    role: 为相邻材料层设置温度连续和热流连续的衔接条件，将四个区域的热传导方程耦合为统一系统。
    why: 不同材料的导热系数不同，界面处温度应连续，但温度梯度可以跳跃；直接令梯度连续会破坏界面热流守恒。
  - name: 牛顿冷却第三类边界模型
    role: 描述衣下空气层与恒温37℃假人体内低温热源之间的换热，并引入热交换系数作为待标定参数。
    why: 皮肤外侧温度并非固定为37℃，而是在外界加热与人体吸热共同作用下达到动态平衡，因此相比固定温度边界，第三类边界更符合实验现象。
  - name: 后向欧拉有限差分模型
    role: 将连续偏微分方程及其初始条件、界面条件和边界条件离散为逐时刻求解的三对角线性方程组。
    why: 多层介质定解问题难以获得解析解；后向欧拉法具有无条件稳定性，可避免显式格式对时间步长的严格限制，并减少Crank-Nicolson方法在较大网格参数下可能产生的虚假振荡。
  - name: 热交换系数反演标定模型
    role: 利用附件中的皮肤外侧实测温度曲线确定空气层与皮肤边界的热交换系数，并将其用于后续工况预测。
    why: 热交换系数难以仅由材料参数直接给出，而实测温度包含真实边界换热信息，通过反演可提高模型与实验系统的一致性。
  - name: 黄金分割厚度搜索模型
    role: 在给定范围内搜索满足60分钟皮肤温度及超温持续时间约束的最小Ⅱ层厚度。
    why: Ⅱ层厚度是单变量连续决策变量，每次目标评价都需要数值求解偏微分方程，黄金分割法能够减少昂贵的模型调用次数并快速逼近最小可行厚度。
  - name: 二维网格遍历与可行域筛选模型
    role: 按0.1mm步长遍历Ⅱ层和Ⅳ层厚度组合，筛选满足30分钟温度约束的可行点，再依据厚度指标选择最优组合。
    why: 双变量厚度与温度响应之间缺少显式解析关系，且约束由动态温度曲线决定，离散遍历能够直接识别非显式可行域并兼顾空气层厚度上限。
  - name: 加权厚度最小化模型
    role: 以Ⅱ层与Ⅳ层总厚度指标η=d2+d4对可行厚度组合进行排序，确定兼顾轻便性与热舒适性的方案。
    why: 服装厚度与体积、质量、成本及行动便利性相关，在所有热安全可行方案中最小化总厚度可形成明确且可计算的优化准则。
  solution_flow: 读取各层厚度、密度、比热容、导热系数及皮肤实测温度数据→将环境、防护服、空气层和人体简化为四层一维非稳态导热系统→依据Fourier定律建立分层热传导方程，设置37℃初始条件、界面温度与热流连续条件、外侧恒温边界和内侧牛顿冷却边界→利用附件温度曲线反演热交换系数→采用后向欧拉有限差分离散，并用三对角追赶法逐时刻计算温度场→对问题二使用黄金分割法搜索最小Ⅱ层厚度→对问题三遍历Ⅱ层和Ⅳ层厚度组合，筛选可行点并最小化η=d2+d4→检查终止时刻皮肤温度、超过44℃的持续时间及47℃上限，输出温度分布与最优厚度。
  validation: 首先将问题一仿真的皮肤外侧温度时间序列与附件2实测曲线进行拟合和趋势对照，重点检验约1000秒内快速升温以及随后稳定在约48℃的动态平衡特征，并据此标定内边界热交换系数；其次对优化结果进行约束回代，逐时刻检查皮肤温度是否超过47℃以及温度高于44℃的累计或持续时间是否不超过300秒；最后通过比较不同厚度下的温度曲线，检验增大隔热层厚度会减缓升温过程这一物理一致性，并检查有限差分计算是否稳定、无明显非物理振荡。
  visualization:
  - 皮肤外侧温度—时间曲线
  - 温度—空间—时间二维热力图
  - 不同Ⅱ层厚度下的温度曲线对比图
  - Ⅱ层与Ⅳ层厚度可行域散点图
  pitfalls_avoided:
  - 避免直接将四层材料视为同一种均匀介质，因为各层导热系数、密度和比热容不同；采用分区域方程并设置温度连续、热流连续条件，防止界面能量不守恒。
  - 避免把材料界面处的温度梯度误设为连续，因为导热系数不同时只有热流连续，温度梯度允许发生跳跃。
  - 避免在小间隙空气层中盲目加入复杂对流模型，因为空气层厚度不超过6.4mm时难以形成明显对流；忽略次要机制可以降低参数需求和计算复杂度。
  - 避免将人体侧简单设为恒温边界，因为观测量是会升温并达到动态平衡的皮肤外侧温度；采用牛顿冷却第三类边界才能同时体现外界加热和人体吸热。
  - 避免强行求解多层偏微分方程的解析表达式，因为复杂界面和混合边界条件难以解析处理；使用有限差分法可直接获得全时空温度分布。
  - 避免采用过大的显式差分步长或不合适的Crank-Nicolson网格参数，因为可能违反稳定性要求或产生虚假振荡；改用无条件稳定的后向欧拉格式，并通过追赶法高效求解三对角系统。
  - 避免只检查工作结束时的温度，因为即使终点温度低于47℃，仍可能长时间处于44℃以上而造成热损伤；优化时同时约束最高温度和超温持续时间。
  - 避免只追求隔热效果而无限增加厚度，因为这会提高成本、质量并降低行动便利性；在满足热安全约束后最小化单层厚度或总厚度。
  innovation_points:
  - 构建了环境—多层防护服—衣下空气—人体的一体化瞬态传热模型，并利用实测皮肤温度反演人体侧热交换系数，实现实验数据与机理模型的耦合。
  - 将每组服装厚度对应的偏微分方程数值仿真嵌入优化过程，形成单变量黄金分割搜索和双变量可行域遍历相结合的仿真优化框架。
  - 同时采用终止时刻温度、47℃安全上限和44℃以上持续时间作为动态安全约束，相比仅使用单一终点温度更能反映热损伤风险。
  - 在双厚度优化中先构造满足热安全条件的离散可行域，再以总厚度最小为准则筛选方案，使热防护性能与服装轻便性得到统一考虑。
- id: A11141001_陈超_唐梦珏_杨克宇_A11141001_陈超_唐梦珏_杨克宇
  source_paper: A11141001_陈超_唐梦珏_杨克宇 A11141001_陈超_唐梦珏_杨克宇_A11141001_陈超_唐梦珏_杨克宇
  problem_type: 优化+综合评价+仿真
  keywords:
  - 最优控制
  - 微分动力学方程
  - 避障规划
  - 燃耗优化
  - 灵敏度分析
  context: 针对嫦娥三号在无大气月球环境中的软着陆任务，设计着陆准备轨道、六阶段着陆轨迹与分阶段控制策略，并分析误差和参数敏感性。
  models:
  - name: 二体轨道力学模型
    role: 利用机械能守恒与角动量守恒计算100 km×15 km椭圆准备轨道近月点和远月点的速度大小、方向及对跖位置。
    why: 准备轨道阶段探测器可视为质点，且月球引力远大于其他天体摄动，适合采用月球中心引力场下的二体模型。
  - name: 最大恒推力变轨模型
    role: 以变轨时间最短为目标，计算探测器由100 km圆轨道进入100 km×15 km椭圆轨道的制动时间。
    why: 在所需速度增量确定且推力存在上限时，持续采用7500 N最大反向推力可以缩短变轨时间并尽快进入预定轨道。
  - name: 二维极坐标微分动力学模型
    role: 描述主减速阶段月心距、径向速度、角位置、角速度和探测器质量随时间的变化，生成软着陆轨迹。
    why: 软着陆主要发生在同一经线平面内，极坐标能够自然表达中心引力、径向运动和切向运动之间的耦合关系。
  - name: 主减速阶段最优控制模型
    role: 以燃料消耗最小为目标，在初末状态约束下优化最大恒推力的作用方向及其随时间的变化规律。
    why: 主减速阶段需要在较短时间内消除较大的切向速度，采用最大推力并优化推力方向可兼顾快速减速和燃耗控制。
  - name: 快速调整阶段非线性规划模型
    role: 以推进剂消耗最小为目标，在降至2.4 km前水平速度变为零等约束下确定变推力控制序列。
    why: 该阶段同时包含速度、高度、推力范围和末态姿态等非线性约束，适合使用非线性规划统一求解。
  - name: 数字高程图网格化综合评价模型
    role: 在粗避障阶段将高程图划分为10×10像素单元，以高程方差和平移距离构造7∶3加权得分，选择安全且较近的着陆区域。
    why: 高程方差可以度量区域平整程度，平移距离反映避障燃耗，将两者加权可在安全性与经济性之间进行权衡。
  - name: 局部坡度精细避障模型
    role: 在精避障阶段对50×50像素范围进行逐点评价，以像素和周围8点的高程差平方和定义坡度并筛选最佳落点。
    why: 精避障需要识别更小尺度的坑洼和坡面，局部邻域高程差比粗网格方差具有更高的空间分辨率。
  - name: 直线平移避障控制模型
    role: 在确定粗避障或精避障目标区域后，规划探测器沿直线移动至安全着陆区的控制过程。
    why: 两点间直线路径最短，能够减少水平移动距离、姿态调整次数和额外燃料消耗。
  - name: 缓速下降阶段简化动力学模型
    role: 在质量近似不变的条件下，推导发动机推力与初始下降速度之间的关系，使探测器在月面上方4 m处速度降为零。
    why: 缓速下降持续时间短、质量变化小，采用常质量动力学可以降低求解复杂度，同时满足关键末态速度约束。
  - name: 误差传播与局部灵敏度分析模型
    role: 分析月球半径、初始高度、初始速度、推力延时和月球自转引起的误差，并考察推力、近月点高度和比冲上下浮动5%时轨迹状态的变化。
    why: 轨道控制结果依赖初始条件、执行机构和环境参数，误差传播与单因素扰动能够评价控制方案的稳定性和工程可实施性。
  solution_flow: 输入月球参数、轨道高度、探测器质量与推力范围、比冲、阶段边界状态及数字高程图→通过机械能守恒和角动量守恒求近远月点速度，并以经线运动、主减速航程近似和对跖关系初定空间位置→建立二维极坐标动力学方程及质量消耗方程→分阶段设置最短时间、最小燃耗和安全着陆等目标与状态约束，求解最大推力变轨、主减速最优控制和快速调整非线性规划→利用高程众数、网格方差、平移距离和局部坡度完成粗精避障区域评价，并规划直线平移控制→由缓速下降动力学确定末段推力→积分仿真得到完整轨迹、燃耗和水平航程，反向修正近月点与远月点位置→通过文献数据、边界状态、误差传播和±5%参数扰动验证方案。
  validation: 首先将计算得到的近月点速度1.6927 km/s与资料给出的约1.7 km/s制动初速度进行对比；其次检查近月点速度大于远月点速度、近远月点互为对跖点等轨道力学一致性；再通过动力学数值积分验证各阶段末端高度、径向速度、水平速度和悬停条件是否满足约束，并用实际控制策略所得水平航程修正初始位置估计；最后对推力、近月点高度和比冲实施±5%扰动，结合推力爬升延时和月球自转误差检验轨迹与控制策略的稳定性。
  visualization:
  - 环月轨道与近远月点示意图
  - 六阶段软着陆轨迹图
  - 二维极坐标受力示意图
  - 数字高程图网格及候选着陆区评分图
  - 高度与径向速度、水平速度时序曲线
  - 参数扰动灵敏度曲线
  pitfalls_avoided:
  - 避免仅凭最终着陆点直接反推近月点位置，因为近月点位置还取决于尚未确定的软着陆轨迹；论文先用经线运动和航程近似得到初值，再用仿真水平航程修正。
  - 避免把整个软着陆过程视为单一优化问题，因为六个阶段的任务目标和末态约束不同；采用分阶段建模可分别处理最短时间、最小燃耗、速度归零和安全避障。
  - 避免在主减速动力学中只考虑竖直下降，因为初始切向速度约为1.7 km/s且中心引力会造成径向与切向运动耦合；因此采用二维极坐标微分方程。
  - 避免只以地形平坦度选择着陆区，因为过远的安全区会显著增加水平机动燃耗；粗避障评价同时纳入高程方差和平移距离，并设置7∶3权重。
  - 避免粗避障与精避障使用相同空间分辨率，因为粗网格可能遗漏局部坡面和小型障碍；精避障采用更细的像素尺度和8邻域坡度指标。
  - 避免全程假设探测器质量不变，因为主减速阶段燃料消耗达到吨级并会影响加速度；仅在时间短、耗油少的缓速下降阶段采用常质量近似。
  - 避免完全忽略执行机构动态，因为变推力发动机从0提升至7500 N存在约1.2 s延时；误差分析中单独评估推力调节滞后对控制结果的影响。
  - 避免将忽略月球自转视为无条件精确，因为该近似虽然适用于短时平面动力学，却会造成经度偏差；论文进一步估计近月点经度相对误差约为2.42%。
  innovation_points:
  - 建立“近月点初步估计—分阶段轨迹优化—依据仿真航程反向修正”的闭环求解思路，解决着陆轨迹未知时近月点位置无法直接确定的问题。
  - 按照任务功能将软着陆分为变轨、主减速、快速调整、粗避障、精避障和缓速下降等阶段，并为不同阶段配置差异化目标函数与控制策略。
  - 将数字高程图处理与轨迹控制结合：粗避障以高程方差和平移距离进行加权综合评价，精避障进一步采用8邻域高程差平方和刻画局部坡度。
  - 在安全性优先的避障问题中显式加入平移距离指标，使着陆区选择同时兼顾地形风险与燃料消耗。
  - 将初始条件误差、发动机推力延时、月球自转误差和关键参数±5%灵敏度分析统一纳入控制方案评价，提高了模型的工程解释性。
- id: B题_B1919（陈寅）[1]..
  source_paper: B题 B题_B1919（陈寅）[1]..
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 高等教育学费标准
  - 动态加权综合评价
  - 多目标规划
  context: 在兼顾学生家庭支付能力、高校办学财力、教育培养质量及社会经济水平的条件下，评价现行高校学费的合理性并优化学费与奖贷助学金标准。
  models:
  - name: 动态加权综合评价模型
    role: 利用劳动成果、科研成果、劳动占用、劳动消耗和资源利用五类指标，对不同地区、学校类型或专业的学费合理性进行量化评价与排序。
    why: 学费合理性受多个量纲和方向不同的指标共同影响，综合评价可以统一处理多维信息；偏大型正态分布动态权重还能根据指标表现调整贡献度，减少固定权重带来的僵化。
  - name: 多目标规划模型
    role: 以学费价格和生均奖贷助学金为决策变量，在成本分担、家庭负担、社会经济和学校财力约束下，协调培养质量、学生就读比例、学校办学收益和学生收益等目标。
    why: 学费定价同时涉及学生、学校和社会等多方利益，目标之间存在冲突，采用多目标规划能够在多个政策目标与现实约束之间寻求整体最优方案。
  - name: 线性加权单目标优化模型
    role: 将多目标规划中的各项目标标准化并线性加权，转化为可由 LINGO 求解的单目标规划问题，得到全国平均最优学费和生均奖贷助学金。
    why: 原多目标问题通常不存在同时使所有目标达到最优的解，线性加权可构造综合效用函数，降低求解难度并获得明确的政策定价结果。
  - name: 地区—专业—办学层次差异化定价模型
    role: 在全国平均定价模型基础上，引入区域经济水平、专业培养成本、专业社会贡献率和学校重点程度等修正系数，为具体学校和专业制定差异化学费。
    why: 全国平均价格无法反映地区收入、专业成本和学校经费来源的异质性，加入局部修正因素能够提升模型的针对性和实际可执行性。
  solution_flow: 数据：收集教育统计年鉴、教育经费统计年鉴中的毕业生、师资、科研项目、经费收支、学生人数、居民收入和社会经济数据，并计算生均培养成本与生均奖贷助学金；模型：先构造五指标学费合理性评价体系，再建立以学费和生均奖贷助学金为决策变量的多目标规划模型，最后加入地区、专业和办学层次修正；参数：对正向和负向指标分别进行极差标准化，依据实际数据确定偏大型正态动态权重参数，并设定目标权重、成本分担比例和家庭负担上限等参数；求解：使用
    MATLAB 计算各地区综合评价指数及排序，使用 LINGO 将多目标模型线性加权后求全局最优解，得到平均学费 4298.35 元和生均奖贷助学金 644.75
    元；验证：将结果与现行全国平均水平、学校收支平衡要求和家庭承受能力约束进行比较，并检验差异化模型在省份、学校类型和专业层面的适用性。
  validation: 采用多层次验证策略：首先检查标准化后指标是否位于统一尺度内，并验证正向指标增大、负向指标减小时综合评价结果是否符合经济含义；其次将模型应用于全国31个省份，考察评价结果能否形成可解释的地区排序；再次核验优化解是否同时满足成本分担、家庭负担、社会经济和学校财力约束，并与现行学费及奖贷助学金水平比较，计算调整幅度；最后通过改变目标权重、动态权重参数和关键约束上限开展敏感性分析，以检验最优定价及排名的稳健性。
  visualization:
  - 高校教育经费收入与支出结构图
  - 整体建模流程图
  - 31个省份综合评价指数排序柱状图
  - 现行值与优化值对比图
  - 目标权重与最优学费敏感性曲线
  pitfalls_avoided:
  - 避免只按教育培养成本确定学费，因为这种做法会忽略家庭支付能力、学生就读机会和学校收益之间的冲突，论文通过多目标与多约束共同定价。
  - 避免只优化名义学费而忽略贫困学生的实际负担，因为奖学金、贷学金和助学金会改变学生实际支付水平，模型将其合并为生均奖贷助学金并与学费联合优化。
  - 避免直接加总量纲和方向不同的评价指标，因为毕业率、科研产出、生师比和经费比例不可直接比较，模型分别按正向、负向属性进行极差标准化。
  - 避免使用固定权重掩盖不同指标区间的重要性差异，因为同一指标在不同表现水平下对合理性的边际影响可能不同，模型采用偏大型正态分布函数实施动态加权。
  - 避免以全国统一价格直接套用于所有高校，因为地区收入、专业培养成本、社会贡献和办学层次存在显著差异，改进模型通过地区—专业—学校修正系数进行差异化定价。
  - 避免将评价排名直接解释为绝对因果结论，因为综合指数受指标口径、极差标准化样本范围和权重参数影响，应结合敏感性分析及原始指标共同解释。
  innovation_points:
  - 将学费标准与生均奖贷助学金纳入同一价格体系进行联合优化，不仅控制名义收费，也兼顾困难学生的实际教育负担。
  - 采用偏大型正态分布函数构造动态权重，使评价指标的权重随其标准化取值变化，比固定权重综合评价更具灵活性。
  - 将学费合理性评价与学费价格优化分为两个互补环节，既回答现行收费是否合理，也给出应调整到何种水平。
  - 由全国平均定价进一步扩展到地区、专业和办学层次差异化定价，提高模型从宏观政策分析向具体学校专业应用的可迁移性。
- id: B题_高校教育学费标准的研究
  source_paper: B题 B题_高校教育学费标准的研究
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 高等教育学费标准
  - 动态加权综合评价
  - 多目标规划
  context: 针对高校学费过高会加重家庭负担、过低又会影响学校财力和培养质量的矛盾，建立学费合理性评价方法并联合确定最优学费与生均奖贷助学金。
  models:
  - name: 动态加权综合评价模型
    role: 从劳动成果、科研成果、劳动占用、劳动消耗和资源利用五个维度构造学费合理性综合指数，用于不同地区、学校类型或专业之间的排序比较。
    why: 学费合理性受多个量纲和作用方向不同的指标共同影响，单一指标无法完整反映教育投资效益；极差标准化可消除量纲，偏大型正态分布动态权重可根据指标水平调整其评价贡献。
  - name: 多目标规划模型
    role: 以学费价格和生均奖贷助学金为决策变量，在成本分担、家庭负担、社会经济和学校财力约束下，联合优化培养质量、学生就读比例、学校办学收益和学生收益。
    why: 学费定价同时涉及学生、家庭、学校和社会等多个利益主体，目标之间存在冲突，需要通过多目标规划寻找兼顾教育公平、培养质量和财务可持续性的折中最优方案。
  - name: 线性加权单目标转化模型
    role: 将多个学费定价目标按权重合成为单一目标函数，并利用 LINGO 求得全国平均学费和生均奖贷助学金的全局最优解。
    why: 原多目标模型难以直接得到唯一可执行方案，线性加权能够统一不同目标的优化方向，便于使用成熟优化软件进行数值求解和方案比较。
  - name: 地区—专业—办学层次差异化定价模型
    role: 在全国整体定价模型基础上，引入区域经济水平、专业培养成本、专业社会贡献和学校重点程度等修正系数，为具体学校的具体专业制定学费。
    why: 全国平均价格不能反映地区收入、专业冷热与培养成本、公民办学校财政来源等异质性，引入差异化系数可提高定价结果的针对性和实际可操作性。
  solution_flow: 数据：收集教育经费、毕业生、师资、科研项目、学生规模、居民收入和现行学费等统计年鉴数据，并计算生均培养成本与生均奖贷助学金→模型：构造五维教育投资效益指标体系，采用极差法统一正向和逆向指标，再建立动态加权综合评价模型；以学费和生均奖贷助学金为决策变量建立多目标规划模型→参数：依据实际数据确定偏大型正态分布权函数的阈值与尺度参数，并设定多目标权重、成本分担边界和家庭承受能力等约束参数→求解：使用
    MATLAB 计算31个省份的综合评价指数及排序，使用 LINGO 将多目标问题线性加权后求解最优学费4298.35元和生均奖贷助学金644.75元→验证：开展省际实证应用、约束可行性检查，并将优化结果与现行全国平均水平进行对比解释。
  validation: 一是将综合评价模型应用于全国31个省份，检查指标标准化、动态加权和排序结果能否形成可区分的省际评价；二是对多目标规划解进行成本分担、家庭负担、社会经济和学校收支约束的可行性检验，并利用LINGO确认求解状态；三是将最优方案与现行学费及奖贷助学金水平比较，得到学费约下调12.84%、奖贷助学金约提高5.79%的政策解释；四是通过模型向不同地区、学校类型和专业的扩展，检验其适用性与可迁移性。
  visualization:
  - 高校经费收入与支出结构图
  - 整体求解流程图
  - 局部差异因素框架图
  - 各省学费合理性综合指数排序柱状图
  - 现行方案与优化方案对比图
  pitfalls_avoided:
  - 避免直接汇总原始指标：毕业率、科研项目数、生师比和经费指标的量纲及数量级不同，直接相加会使大数量级指标支配结果，因此先采用极差标准化。
  - 避免忽略指标方向差异：劳动消耗指标越小越优，而其余指标越大越优，若统一按正向指标处理会造成评价方向颠倒，因此分别使用正向和逆向标准化公式。
  - 避免只优化学费、不考虑资助：贫困学生的实际支付能力由学费与奖贷助学金共同决定，只降低或提高学费无法准确刻画教育公平，因此将二者设为联合决策变量。
  - 避免单纯追求学校收入最大化：若缺少家庭负担、成本分担和社会经济约束，模型可能给出学生无法承受的高学费，因此设置多类现实约束并同时考虑学生收益和就读比例。
  - 避免用全国统一价格机械覆盖所有高校：地区收入、专业培养成本、社会贡献和公民办学校财政来源差异明显，因此进一步建立地区—专业—办学层次修正模型。
  - 避免以固定主观权重完全替代数据特征：固定权重难以反映指标处于不同水平时的重要性变化，因此使用偏大型正态分布函数实施动态加权。
  innovation_points:
  - 将偏大型正态分布函数作为动态权重函数，使评价指标的贡献随其标准化水平变化，而非始终采用固定权重。
  - 把学费标准与生均奖贷助学金纳入同一价格体系联合优化，同时兼顾学校财务可持续性和学生经济承受能力。
  - 从全国整体定价扩展到地区、专业和办学层次的差异化定价，实现宏观政策方案与具体学校专业定价的衔接。
- id: 2016_B067
  source_paper: 2016 2016_B067
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 小区开放
  - 道路通行能力
  - 熵权模糊综合评价
  context: 研究封闭住宅小区内部道路公共化后，路网容量增加与新增交叉口干扰共同作用下对周边道路通行能力的影响，并为城市规划和交通管理提供定量决策依据。
  models:
  - name: 熵权模糊综合评价模型
    role: 综合车流密度、车流速度、行程时间、延误时间、道路饱和度和交叉路口阻塞率六项指标，评价不同小区开放及增路方案对道路通行能力的总体影响。
    why: 道路通行能力具有多指标、量纲不一且优劣边界模糊的特点；隶属度函数可统一指标尺度，熵权法可依据样本差异客观赋权，减少主观权重对评价结果的干扰。
  - name: 基于电路类比的车辆通行模型
    role: 将道路、车流、信号灯分别类比为导线、电流和开关，并将车流量、车流密度、车流速度与电学量对应，用于分析小区开放前后路网分流、总车流量和行程时间的变化。
    why: 小区开放实质上是在原路网中增加并联通路，电路的并联与分流机制能够直观描述新增道路对交通流的分担作用，并支持开放前后的定量比较。
  - name: 理论递推与0-1变量模型
    role: 以T字形开放路口为基本单元，递推刻画多个开放路口对周边道路通行能力的累积影响，并用0-1变量表示道路或路口是否开放。
    why: 开放方案包含离散的开闭决策，且多个新增路口的影响需要逐步叠加；递推关系与0-1变量能够同时表达网络扩展过程和离散规划状态。
  - name: 多目标规划模型
    role: 在提高道路通行能力、缩短行程时间和控制交叉口延误等目标之间进行协调，用于选择小区开放与道路规划方案。
    why: 开放小区既可能增加路网容量，也可能因新增交叉口和信号灯带来延误，单一目标无法反映方案利弊，需要通过多目标规划权衡相互冲突的交通目标。
  - name: 单变量情景分析模型
    role: 分别改变小区结构、周边道路结构和车流量，在其余因素相对固定时比较10类小区开放前后的道路通行能力。
    why: 小区开放效果受多个因素共同影响，采用控制变量方法可以分离各因素的边际影响，识别适宜开放和不宜直接开放的小区类型。
  - name: Greenshields交通流模型与回归拟合模型
    role: 以Q=vk为基础，拟合速度、密度和流量之间的关系，并以摩托车占比为桥梁构建流量与摩托车占比的关系，评估禁摩措施对开放小区道路通行能力的影响。
    why: Greenshields模型能够用简洁的速度—密度关系描述基本交通流规律，结合实测数据回归可估计模型参数，并将交通组成变化转化为可量化的流量变化。
  solution_flow: 数据→采集不同开放阶段或不同类型小区的车流密度、速度、行程时间、延误时间、道路饱和度和交叉口阻塞率，并利用卫星地图与道路折算系数补充速度、密度及车型占比数据→模型→建立隶属度函数和模糊关系矩阵，使用电路类比分析分流机理，再构建理论递推、0-1变量、多目标规划、单变量情景分析及Greenshields交通流模型→参数→对指标归一化，以熵值和差异系数求取客观权重，依据交通法规和文献设置不同小区结构及道路参数，并通过回归估计速度—密度—流量关系参数→求解→计算各开放方案综合评价值、开放前后车流量与行程时间、10类小区通行能力及禁摩情景下的流量变化，进而筛选较优开放和规划方案→验证→通过开放前后对比、不同增路阶段排序、多类型情景比较、重复观测及回归拟合图检验模型结论的一致性和合理性。
  validation: 采用多层次验证策略：首先用同一小区封闭及四次增路阶段的实测指标进行纵向对比，检查综合评价排序是否符合交通现象；其次对10类小区开展开放前后情景对照和单变量比较，验证模型在不同结构、路网和车流量条件下的适用性；再次对速度等指标进行多次观测取均值以降低偶然误差；最后利用9组实际数据进行Greenshields回归拟合，并通过Q-v、v-m和Q-m关系图检查拟合趋势及政策分析结论。论文未展示独立测试集、显著性检验和系统敏感性分析，因此结论更适合作为方案比较依据，而非无条件外推。
  visualization:
  - 问题分析流程图
  - 封闭与开放小区电路类比图
  - 车流密度或车流速度时间变化曲线
  - 10类小区CAD路网结构图
  - Q-v速度—流量拟合曲线
  - v-m与Q-m关系曲线
  - 开放前后通行能力对比图
  pitfalls_avoided:
  - 避免仅用单一车流量评价开放效果，因为新增道路可能提高总容量，却同时增加信号延误和交叉口阻塞；采用六指标体系可同时覆盖效率、拥堵与服务水平。
  - 避免完全依赖专家主观赋权，因为人为设定权重容易改变方案排序；使用熵权法依据各指标的信息差异计算权重，提高评价的客观性。
  - 避免把新增道路一概视为有利，因为开放路口会增加红绿灯和交通冲突；模型同时纳入延误时间和交叉口阻塞率，体现开放的负面效应。
  - 避免将不同小区的影响因素混杂比较，因为结构、周边路网和车流量同时变化时难以解释结果；采用单变量情景分析分离各因素作用。
  - 避免直接使用不同量纲的原始指标进行加权，因为速度、时间、密度和百分比不可直接相加；先通过隶属度函数和归一化构造无量纲模糊关系矩阵。
  - 避免仅凭示意路网作定量结论，因为结构图不能给出真实速度和密度；结合卫星地图测距、时间数据、道路折算系数及文献参数进行计算。
  - 避免忽略模型适用前提，因为电路类比中的恒定合理密度、路口独立等假设在拥堵传播条件下可能失效；论文明确列出路口独立、增设信号灯和忽略专用转向车道等假设以限定结论范围。
  innovation_points:
  - 将熵权法与模糊综合评价结合，在六维交通指标体系下客观比较封闭、增路和开放方案。
  - 把小区开放形成的新增支路类比为并联电路，以电流分流机制解释道路增容和行程时间缩短，增强模型的直观性。
  - 将理论递推与0-1变量结合，把单个开放路口的交通影响推广到多路口、离散开放方案的规划问题。
  - 联用多目标规划与单变量情景分析，既进行方案优化，又识别小区结构、周边道路结构和车流量对开放效果的差异化影响。
  - 将Greenshields交通流模型与车型组成相联系，以摩托车占比作为中介建立Q-m关系，使开放小区研究能够延伸到禁摩等交通政策评价。
- id: A1303_A0114
  source_paper: A1303 A1303_A0114
  problem_type: 统计分析+预测+仿真
  keywords:
  - 实际通行能力
  - Gibbs抽样
  - ARMA模型
  - 曼-惠特尼U检验
  - 非稳态排队论
  - 分段差分方程
  context: 基于交通事故视频数据，分析不同车道被占用时道路横断面实际通行能力的变化与差异，并预测事故持续条件下车辆排队长度到达上游路口的时间。
  models:
  - name: 标准车当量换算模型
    role: 将小客车、大客车和货车等不同车型的观测数量统一换算为pcu，并计算单位时间内的横断面实际通行能力。
    why: 不同车型占用道路资源和对交通流的影响不同，直接使用车辆数会造成通行能力统计口径不一致。
  - name: Gibbs抽样仿真
    role: 根据红灯、绿灯状态下车辆当量的条件概率分布，对视频中断造成的缺失交通流数据进行随机填补。
    why: 视频存在缺失片段，且通过横断面的车辆数具有随机性；Gibbs抽样可利用条件分布生成与已有交通状态相容的缺失值。
  - name: ARIMA差分与ARMA(0,2)模型
    role: 刻画事故发生至撤离期间实际通行能力随时间的波动过程，并给出时间序列拟合表达式。
    why: 原始通行能力序列存在非平稳波动，一阶差分后通过ADF检验达到平稳，再依据自相关特征选择MA(2)结构进行拟合。
  - name: 曼-惠特尼U检验
    role: 比较视频1和视频2中事故占用不同车道时横断面实际通行能力是否存在显著差异。
    why: 两组样本相互独立，样本量有限且难以保证服从正态分布，采用基于秩的非参数检验比参数检验更稳健。
  - name: 非稳态排队论模型
    role: 以时变车辆到达率、离开率和状态概率描述事故路段车辆数的动态变化，并将平均车辆数转换为排队长度。
    why: 上游信号灯和事故横断面服务能力使到达、离开过程随时间变化，传统稳态排队模型难以反映事故期间不断增长的排队过程。
  - name: 分段差分方程模型
    role: 按照红灯和绿灯阶段分别计算车辆净流入量，递推各时段排队车辆数及排队长度，并估计队尾到达上游路口的时间。
    why: 信号灯具有明确的周期性和分段状态，差分方程能够直接描述各信号阶段内车辆的离散累积过程，并保留事故发生相位的影响。
  solution_flow: 从视频中以30秒为间隔统计各类车辆并进行标准车当量换算，结合上游信号灯状态整理交通流数据；利用Gibbs抽样补全视频中断造成的缺失值，得到完整的实际通行能力序列；对序列进行一阶差分、ADF平稳性检验和自相关分析，建立ARMA(0,2)模型描述通行能力变化；对两个视频采用相同口径处理，并通过曼-惠特尼U检验判断事故占用不同车道造成的通行能力差异；进一步以到达率、事故横断面离开率、车辆平均占道长度和信号周期为参数，分别建立非稳态排队模型与分段差分方程模型；使用MATLAB求解排队长度随时间的变化，并通过令排队长度达到140米反求到达上游路口所需时间。
  validation: 首先通过ADF单位根检验验证一阶差分序列的平稳性，并结合自相关图和拟合优度筛选ARMA阶数；其次采用曼-惠特尼U检验对两事故场景的通行能力差异进行统计显著性验证；最后使用两种机制不同的排队模型进行交叉验证，非稳态排队模型得到约6.656分钟，分段差分方程在事故发生于绿灯和红灯两种边界情形下分别得到约6.42分钟和7.97分钟，前一结果位于两种信号相位结果之间，说明预测量级和变化规律具有一致性。
  visualization:
  - 实际通行能力时间序列折线图
  - 原序列及一阶差分序列自相关图
  - ARMA模型拟合曲线与观测值对比图
  - 排队长度随时间变化曲线
  - 不同到达率、通行能力和事故持续时间下的情景对比图
  pitfalls_avoided:
  - 避免直接删除视频缺失时段，因为删除会破坏时间序列的连续性并可能使通行能力估计产生选择偏差；论文按红绿灯状态构造条件分布并用Gibbs抽样补全数据。
  - 避免把不同车型简单按车辆数等权统计，因为大客车和大型货车对道路资源的占用高于小客车；论文先按规范换算为标准车当量，再统一计算pcu/h。
  - 避免直接对非平稳序列建立ARMA模型，因为趋势或单位根会导致伪回归和不可靠参数；论文先进行一阶差分和ADF检验，再确定MA(2)结构。
  - 避免在小样本且分布未知时直接使用独立样本t检验，因为正态性和方差齐性假设可能不成立；论文改用基于秩的曼-惠特尼U检验。
  - 避免忽略上游信号灯的周期性，因为红灯和绿灯会显著改变车辆到达过程及排队增长速度；论文分别统计信号状态并在差分模型中分段处理。
  - 避免只依赖单一排队模型给出到达时间，因为模型结构误差可能造成结果失真；论文同时采用非稳态排队论和分段差分方程进行交叉核验。
  innovation_points:
  - 将视频交通流人工计数、标准车当量换算、Gibbs缺失值填补和时间序列建模串联起来，形成从非完整视频到动态通行能力表达式的完整分析链。
  - 将上游信号灯状态纳入缺失数据条件分布和排队演化过程，使模型能够解释实际通行能力的周期波动及事故发生相位对排队时间的影响。
  - 采用连续状态思想的非稳态排队模型与离散时间的分段差分方程并行建模，以不同机制得到相近时间尺度，提高结果的可信度和可解释性。
  - 不仅比较事故占道数量，还结合各车道流向比例、驾驶员换道心理和道路环境解释同一横断面上占用车道不同所造成的通行能力差异。
- id: 2015_B340
  source_paper: 2015 2015_B340
  problem_type: 综合评价+统计分析+优化+仿真
  keywords:
  - 供求匹配
  - 动态补贴
  - 多元回归
  - 模糊综合评价
  - Logit模型
  context: 针对“互联网+”背景下出租车资源在不同城市、时段和区域中的供求失衡问题，评价现有补贴效果并设计兼顾匹配效率与平台成本的动态补贴方案。
  models:
  - name: 模糊综合评价模型
    role: 从宏观层面综合评价不同城市和年份的出租车供求匹配程度。
    why: 里程利用率、车辆满载率和万人出租车拥有量具有不同量纲且对匹配程度的影响方向不同，模糊综合评价可通过隶属度和权重将多指标统一为综合偏离分数。
  - name: 多元线性回归供需拟合模型
    role: 分别拟合乘客需求量和出租车供给量，并计算高峰期、低谷期、拥堵区及非拥堵区的供求比。
    why: 供给与需求同时受到车费、等待时间、乘车时间和固定开销等多个因素影响，在机理关系难以精确刻画时，多元回归能够依据观测数据给出可计算的近似函数。
  - name: 供求比评价模型
    role: 以出租车供给量与乘客需求量之比衡量微观时空下的供求匹配状态。
    why: 供求比具有明确的经济含义，可直接区分供不应求、相对平衡和供过于求，并便于比较不同时间段与区域。
  - name: 高斯分布拒单率模型
    role: 描述司机补贴金额变化对司机拒单率的影响，并用于修正有效供给量。
    why: 司机是否拒单具有随机性，且拒单率与司机补贴总体呈负相关，高斯型概率函数可近似刻画补贴刺激下拒单概率的非线性变化。
  - name: Logit拼车率模型
    role: 描述乘客补贴对乘客接受拼车概率的影响，并用于修正实际匹配能力。
    why: 是否接受拼车属于二元选择行为，Logit模型能将补贴等解释变量映射为0到1之间的选择概率，并体现边际激励递减特征。
  - name: 打车难度系数评价模型
    role: 综合供求关系、司机拒单率和乘客拼车率，对补贴前后的打车难度进行量化比较。
    why: 仅使用名义供求比无法反映司机拒单和乘客拼车等真实交易行为，引入行为概率后能够更准确地衡量有效供给与成功匹配水平。
  - name: 等步长逐步搜索优化模型
    role: 在司机补贴和乘客补贴的可行范围内搜索满足目标供求比的补贴组合，并确定基础补贴。
    why: 补贴与供求匹配度之间由多个非线性概率模型共同决定，难以直接解析求最优解，等步长搜索实现简单且能系统比较不同补贴组合。
  - name: 基于供求优化的动态补贴模型
    role: 以基础补贴为基准，根据等待时间、拥堵时间、油费和实时供求状态动态调整司机与乘客补贴。
    why: 固定补贴难以适应明显的时空供求波动，动态补贴能够在控制单次浮动幅度和平台总成本的同时，将供求比维持在合理区间。
  - name: 蒙特卡洛式仿真评价模型
    role: 模拟不同补贴方案下乘客与出租车的匹配过程，比较成功匹配率、打车难度和供求匹配度。
    why: 补贴通过拒单和拼车等随机行为间接影响系统效果，仿真可以呈现概率模型共同作用后的整体结果，并检验方案的实际改善幅度。
  solution_flow: 采集城市出租车运营指标、平台订单和车辆轨迹数据→剔除异常值及经纬度偏差数据并按城市、时段和区域分组→利用模糊综合评价完成宏观匹配评价→通过多元回归估计供给函数与需求函数并计算微观供求比→用高斯模型和Logit模型估计补贴对拒单率、拼车率的影响→构建打车难度系数并比较无补贴及现有补贴方案→采用等步长搜索确定目标供求比区间内的低成本基础补贴→结合等待、拥堵和成本因素建立动态补贴方案→通过仿真比较成功匹配率、供求匹配度与补贴成本。
  validation: 先对车辆轨迹和订单数据进行坏值剔除，再检查回归结果的经济方向与现实规律是否一致；通过高峰期与低谷期、拥堵区与非拥堵区的供求比进行情景合理性检验；将无补贴、快的补贴、滴滴补贴和新方案进行对照，比较打车难度系数及成功匹配率；最后利用随机仿真验证补贴后成功匹配率约提升11%、新方案供求匹配度约提升34.62%，并检查供求比是否进入0.8至1的目标区间。
  visualization:
  - 出租车轨迹散点图
  - 出租车空间分布热力图
  - 分时段道路拥堵地图
  - 不同情景供求比对比柱状图
  - 补贴金额与拒单率或拼车率关系曲线
  - 补贴前后打车难度系数对比图
  pitfalls_avoided:
  - 避免只用单一指标评价城市供求状态：单看出租车数量会忽略车辆利用效率和人口规模，因此联合万人拥有量、车辆满载率与里程利用率并进行标准化加权。
  - 避免混淆宏观城市差异与微观时空波动：城市和年份适合用综合指标评价，而高峰、低谷及不同区域应利用实时供需数据计算供求比。
  - 避免将名义出租车数量直接视为有效供给：司机拒单会使部分车辆无法形成真实服务，因此使用拒单率修正供给能力。
  - 避免忽略拼车对服务容量的提升：乘客接受拼车会改变单位车辆可满足的订单数量，因此通过Logit概率将拼车行为纳入打车难度评价。
  - 避免仅追求供求比等于1而造成补贴费用失控：先将可接受供求比设为0.8至1，再在该区间内搜索最低成本的基础补贴。
  - 避免固定补贴无法适应时空差异：将等待时间、堵车时间、油费和实时供求状态纳入动态调整，同时限制实际补贴相对基础补贴的浮动小于5元。
  - 避免异常轨迹扭曲空间分析和回归参数：建模前剔除信息异常值及经纬度偏差较大的记录。
  innovation_points:
  - 构建宏观模糊综合评价与微观供求回归相结合的双层时空评价框架，同时覆盖城市、年份、时段和区域差异。
  - 将司机拒单概率和乘客拼车概率嵌入供求模型，形成比单纯供求比更贴近真实交易过程的打车难度系数。
  - 把供求匹配目标与平台补贴成本联合考虑，通过目标区间而非单点最优确定低成本基础补贴。
  - 在基础补贴上引入等待时间、拥堵时间、油费和实时供求状态，实现具有幅度约束的动态补贴。
- id: A_cumcm0735
  source_paper: A A_cumcm0735
  problem_type: 预测+仿真+统计分析
  keywords:
  - 人口趋势预测
  - 人口结构演化
  - 老龄化与城镇化
  - 出生性别比
  - 灵敏度分析
  context: 基于中国历史人口数据及低生育、老龄化、出生性别比失衡和城镇化等现实特征，预测中短期与长期人口总量及结构变化，为人口政策制定提供依据。
  models:
  - name: Logistic阻滞增长模型
    role: 从宏观层面预测人口总量的中短期变化趋势，并给出人口容量上限和增长速度。
    why: 中国人口增长受到资源环境和政策约束，增长率会随人口规模增加而下降，Logistic模型能够刻画由较快增长逐渐趋于饱和的过程。
  - name: 线性最小二乘参数估计
    role: 利用历史人口数据估计Logistic模型中的固有增长率和最大人口容量等参数。
    why: 经过适当变换后模型参数可通过线性拟合获得，计算简单，并能够利用样本误差整体确定较稳定的参数。
  - name: GM(1,1)灰色预测模型
    role: 对净增人口序列进行累加生成和中长期外推，预测未来人口总量。
    why: 人口出生和死亡数据存在随机波动，而灰色累加生成可以弱化噪声；同时该模型适合样本量较小、信息不完全的中长期预测问题。
  - name: 年龄—性别—城乡分层动态模拟模型
    role: 按城、镇、乡、性别和年龄逐年推进人口队列，预测总人口、性别结构、老龄化、适婚人口差额、抚养比和人口红利时期。
    why: 仅用人口总量模型无法反映出生、死亡、年龄迁移和城乡转移对人口结构的影响，分层队列仿真能够细致描述人口结构的动态演化。
  - name: Gompertz死亡率拟合模型
    role: 拟合死亡率随年龄变化的规律，为动态模拟中的各年龄人口生存转移提供参数。
    why: 人口死亡风险通常随年龄呈非线性加速上升，Gompertz函数比固定死亡率更符合年龄别死亡规律。
  - name: 城镇化水平趋势拟合模型
    role: 估计未来城镇化比例，并将城乡人口结构变化纳入动态仿真。
    why: 乡村人口向城镇转移会显著改变不同地区的人口规模和年龄结构，因此需要单独拟合城镇化进程。
  - name: 带控制因子的改进动态模型
    role: 在基础动态模型中加入政策和人为调控因素，形成可用于政策情景分析的人口预测方案。
    why: 生育政策、出生性别比治理和城镇化政策并非自然固定过程，引入控制因子可以避免机械外推，使预测更符合现实决策环境。
  solution_flow: 收集并整理1990—2006年人口总量、净增人口、年龄别男女城乡人口、生育率、死亡率和城镇化数据→通过取平均等方法削弱异常值，构造净增人口序列并估算2001年分层初始人口→分别建立Logistic总量模型和GM(1,1)模型，利用最小二乘及灰色估计求取参数→拟合Gompertz年龄别死亡率和城镇化趋势，建立年龄—性别—城乡队列递推模型→逐年模拟出生、死亡、年龄推进及城乡结构变化，并加入政策控制因子进行情景预测→输出人口总量峰值、性别比例、老龄化率、适婚人口差额、抚养比、人口红利和城镇化水平→采用留出样本误差检验、模型间对比及参数灵敏度分析验证结果。
  validation: 将2000—2006年数据不参与初始Logistic拟合，作为留出样本比较预测值与实际值，并计算逐年相对误差，误差约为0%—0.53%；GM(1,1)使用1990—2005年历史数据开展误差检验；同时比较Logistic、灰色预测与动态仿真的人口总量趋势，检查结果的一致性和现实合理性；进一步对Gompertz死亡率发展因子、男女出生比例和妇女生育率进行灵敏度分析，其中出生性别比灵敏度系数为0.8850，并检验生育率变化对预测结果影响的增强趋势。
  visualization:
  - 历史人口与Logistic拟合曲线图
  - 实际值与预测值对比表
  - 逐年相对误差表
  - 人口总量长期趋势及峰值曲线图
  - 年龄—性别人口结构图
  - 老龄化率与抚养比趋势图
  - 城镇化水平拟合及预测曲线图
  - 参数灵敏度变化曲线图
  pitfalls_avoided:
  - 避免直接使用全部历史数据拟合后再用同一批数据评价模型，因为样本内拟合误差会高估预测能力；论文预留2000—2006年数据进行外推检验。
  - 避免直接对波动较强的总人口序列套用GM(1,1)，因为总量的高基数和趋势性可能掩盖年度人口变化；改为对净增人口序列建模，以突出增长机制并利用累加生成削弱随机波动。
  - 避免仅依赖人口总量模型分析长期人口问题，因为Logistic和GM(1,1)无法描述年龄、性别和城乡结构；通过分层动态模拟补充老龄化、性别比、抚养比和城镇化预测。
  - 避免把异常年份数据原样带入死亡率、生育率和结构参数估计，因为局部异常会在长期逐年递推中累积放大；通过取平均和函数拟合平滑异常值。
  - 避免将死亡率设为各年龄统一常数，因为儿童、劳动年龄人口和老年人的死亡风险差异显著；采用Gompertz函数拟合年龄别死亡率。
  - 避免把出生性别比和生育率视为永久不变，因为政策治理与人口行为会改变关键参数；设置2020年前后出生性别比情景并在改进模型中加入人为控制因子。
  - 避免只报告单一预测值而不评估参数不确定性，因为人口长期预测对生育率等参数可能高度敏感；分别对死亡率发展因子、出生性别比和妇女生育率进行灵敏度分析。
  innovation_points:
  - 构建由Logistic中短期预测、GM(1,1)中长期预测和分层动态仿真组成的多层次模型体系，实现宏观总量预测与微观人口结构预测的互补。
  - 将年龄、性别、城镇乡区域、生育率、死亡率和城镇化过程统一纳入逐年人口队列递推，可同时预测人口峰值、老龄化、适婚男女差额、抚养比和人口红利。
  - 不直接对总人口应用灰色模型，而是先构造净增人口序列再进行GM(1,1)预测，以降低出生和死亡随机波动对趋势估计的影响。
  - 在动态模型中引入政策控制因子，并设置出生性别比阶段性调整情景，使模型能够用于人口政策干预和情景比较。
  - 对死亡率、生育率和出生性别比等关键机制分别实施灵敏度分析，识别长期人口预测中的主要不确定性来源。
- id: 2017_A298
  source_paper: 2017 2017_A298
  problem_type: 仿真+优化+综合评价
  keywords:
  - CT系统参数标定
  - Radon变换与滤波反投影
  - 自适应降噪
  context: 利用已知几何模板的投影数据标定二维平行束CT系统的旋转中心、探测器间距和扫描角度，并据此重建未知介质、估计吸收率及改进标定模板。
  models:
  - name: X射线指数衰减与对数增益模型
    role: 建立接收数据、介质吸收率和射线穿透长度之间的关系，并估计系统增益系数。
    why: X射线穿过均匀介质时满足指数衰减规律，经对数处理后投影值与吸收率线积分成正比，可将仪器输出还原为具有明确物理意义的路径长度或投影数据。
  - name: CT参数标定离散模型
    role: 将180个扫描方向、512个探测器对应的射线表示为直线，并通过直线与圆、椭圆的交弦长度建立参数方程。
    why: 模板几何形状和吸收率已知，可利用理论交弦长度与实测投影之间的对应关系反求扫描角度、探测器间距和旋转中心。
  - name: 简化离散几何标定模型
    role: 从每个方向选取跨度较大、等距且只穿过椭圆的三条射线，分别求解180个方向角；同时利用非零投影带宽及几何尺寸约束探测器间距。
    why: 直接求解180×512规模的高维非线性方程组计算困难且稳定性较差，选择具有代表性的射线并引入等距约束可显著降低未知量和计算复杂度。
  - name: 平行束滤波反投影重建模型
    role: 利用Radon投影数据、R-L滤波器和反投影算法恢复未知介质的二维吸收率分布。
    why: 普通反投影会产生明显的星状伪影，而滤波反投影可在反投影前补偿投影数据中的频率衰减，提高边缘和几何结构的重建质量。
  - name: 偏心托盘镶边校正模型
    role: 根据标定得到的旋转中心对原正方形托盘进行虚拟扩展，使扩展区域的几何中心与系统旋转中心重合，重建后再裁除镶边。
    why: 旋转中心与托盘几何中心不重合会导致Radon变换的数据覆盖不完整和空间位置偏移，镶边可保持投影几何的一致性并减少信息缺失。
  - name: 自适应滤波降噪模型
    role: 对存在非系统波动的投影数据或重建结果进行自适应平滑，改善边界模糊和吸收率波动。
    why: 第三组数据受到非系统噪声影响，固定强度滤波可能过度平滑边缘；自适应滤波可依据局部统计特征调整降噪程度，在抑制噪声的同时保留结构边界。
  - name: 归一化均方误差评价模型
    role: 比较模板标准吸收率与反演结果，评价参数标定和图像重建的精度与稳定性，并指导新模板设计。
    why: 归一化均方误差能够消除数据尺度差异，量化反演偏差，并可通过重复扰动或多次标定结果的变化评估稳定性。
  - name: 高辨识度标定模板优化模型
    role: 在原模板精度与稳定性分析基础上重新设计模板几何结构，以提升旋转中心、间距和角度参数的可辨识性。
    why: 原模板在部分方向存在投影重叠、近对称或特征不足的问题，增加方向性和尺度差异明显的几何特征有助于降低参数耦合并提高标定稳定性。
  solution_flow: 读取模板与180×512投影数据并通过非零标记、色阶图识别圆和椭圆的投影带；利用圆直径、椭圆短轴及两物体间空白距离对应的探测器条数求取探测器间距区间并选定代表值；依据指数衰减的对数线性关系，通过投影积分与模板面积匹配估计增益系数并还原数据；建立射线与圆、椭圆的交弦方程，从每个方向选取三条等距且仅穿过椭圆的射线求解斜率和180个扫描角度；根据中央探测器、中垂线和椭圆中心投影位置确定旋转中心；对未知介质投影进行增益校正和偏心镶边，使用R-L滤波的平行束反投影重建吸收率图像并裁除镶边；对噪声较强的数据加入自适应滤波，提取介质位置、形状及指定点吸收率；最后以归一化均方误差评价精度和稳定性，并据此优化标定模板。
  validation: 采用多层验证：首先分别由小圆直径、椭圆短轴和两物体间空白距离得到探测器间距区间，以区间交集检验几何标定的一致性；其次分别利用圆和椭圆的最大投影验证增益与穿透长度的线性关系，并对多列圆投影积分得到的增益系数取平均；对每个扫描方向使用多组三射线组合重复求角并取平均、拟合，以降低随机选点误差；将已知模板的投影数据反演重建，与模板标准几何轮廓和吸收率比较并计算归一化均方误差；最后比较降噪前后的吸收率波动范围、边缘清晰度和重建误差，并通过数据扰动或重复标定考察参数稳定性。
  visualization:
  - 180×512投影数据非零区域二值热力图
  - 投影数据色阶热力图
  - 圆和椭圆的射线交弦几何示意图
  - 180个扫描角度拟合曲线
  - 滤波反投影二维吸收率图
  - 降噪前后重建图像对比图
  - 模板标准图与反演图对比图
  - 标定误差与稳定性评价图
  pitfalls_avoided:
  - 避免直接求解180×512个射线对应的大规模非线性方程组，因为未知量多、计算成本高且容易出现病态或多解；改用每个方向三条跨度大、等距的代表射线构造简化方程组。
  - 避免将附件中的仪器输出直接视为真实穿透长度或吸收率，因为数据经过系统增益处理；先依据指数衰减的对数关系和模板面积积分估计增益系数，再进行标定与重建。
  - 避免选取同时穿过圆和椭圆的射线求椭圆弦长，因为叠加投影无法唯一对应单一几何体；通过色阶图识别重合色带，仅使用只穿过椭圆的射线。
  - 避免只用单一几何特征估计探测器间距，因为边界相切和离散采样会造成一至两个探测器单元的计数误差；综合圆、椭圆和空白间隔三个约束并取区间交集。
  - 避免默认托盘几何中心等于系统旋转中心，因为安装偏差会导致投影坐标错位及Radon数据缺失；根据中央探测器和模板中心投影标定偏移，并在重建前进行镶边校正。
  - 避免使用未滤波的直接反投影，因为其会造成低频过重和星状伪影；采用R-L滤波器补偿频率响应后再反投影。
  - 避免对噪声数据采用过强的固定平滑，因为可能抹去介质边界并使指定点吸收率产生系统偏差；通过多种方法对比后采用依据局部统计特征调节强度的自适应滤波。
  - 避免仅凭重建图像的主观清晰度评价模型，因为视觉效果不能反映参数偏差和数值稳定性；使用已知模板反演结果与标准值之间的归一化均方误差进行定量评价。
  innovation_points:
  - 将完整离散标定方程简化为每个方向的三射线交弦方程，在保留角度辨识信息的同时显著降低计算规模。
  - 联合圆直径、椭圆短轴和物体间空白距离三个独立几何特征，通过约束区间求交提高探测器间距标定精度。
  - 利用模板投影积分与已知面积之间的关系反演系统增益，避免依赖额外的仪器增益参数。
  - 针对旋转中心与托盘几何中心不重合的问题提出虚拟镶边、中心对齐和重建后裁剪的校正流程。
  - 在滤波反投影模型中引入自适应降噪，根据局部数据波动调整滤波强度，从而兼顾边界保持与噪声抑制。
  - 通过归一化均方误差和稳定性分析反向指导标定模板设计，使模板具有更强的方向辨识性和参数可辨识性。
- id: A_cumcm0702
  source_paper: A A_cumcm0702
  problem_type: 预测+仿真
  keywords:
  - 人口增长预测
  - Logistic曲线
  - GM(1,1)灰色预测
  - 年龄结构人口发展方程
  - 人口迁移与老龄化
  context: 基于中国人口总量、年龄结构、生育率、死亡率、性别及城乡迁移数据，预测人口发展的中短期与长期趋势，并分析老龄化、劳动力变化和城镇化影响。
  models:
  - name: Logistic人口增长模型
    role: 预测中国人口总量的长期增长趋势、人口容量及峰值。
    why: 历史人口增长呈现先增长后受资源环境约束而逐渐趋缓的S形特征，Logistic模型能够用饱和人口容量和阻滞项描述这种有限增长过程。
  - name: GM(1,1)灰色预测模型
    role: 利用较短的人口总量时间序列预测2006—2010年的短期人口规模。
    why: 人口变化受社会制度、环境、生活水平等多种难以量化的因素影响，而GM(1,1)只需少量单序列数据，适合信息不完全、小样本且近似平滑的人口短期外推。
  - name: 年龄结构人口发展偏微分方程模型
    role: 刻画人口密度随年龄和时间的演化，并计算总人口、劳动年龄人口、老年人口及老龄化指数。
    why: 仅使用人口总量无法体现不同年龄群体在生育率和死亡率上的显著差异，年龄结构偏微分方程能够同时描述人口老化、死亡损耗和新生人口补充。
  - name: 离散型人口发展方程模型
    role: 将连续人口发展偏微分方程离散化，以便按年份和年龄组开展数值递推与情景仿真。
    why: 实际统计数据通常按离散年份和年龄段给出，连续方程难以直接计算，离散化后可利用生育率、死亡率和初始年龄分布逐期更新人口结构。
  - name: 人口迁移模型
    role: 综合模拟市、镇、乡之间的人口转移及其对城乡人口规模、老龄化、性别比和城镇化的影响。
    why: 全国净国际迁移影响较小，但国内乡村人口向城镇迁移规模巨大，若忽略城乡迁移，将难以解释城镇化进程及城乡年龄结构差异。
  - name: 总和生育率情景分析模型
    role: 比较总和生育率为1.5、1.8和2.0时的人口总量、峰值时间及老龄化指数变化。
    why: 未来生育水平存在政策与行为不确定性，设置多种生育率情景可以评估人口增长和老龄化之间的权衡，并为生育政策提供依据。
  solution_flow: 收集并整理历年人口总量以及市、镇、乡分性别、分年龄人口占比、年龄别死亡率和妇女生育率数据→用Logistic模型拟合长期人口总量并估计增长率、约束参数和饱和人口容量→对1996—2005年人口序列进行一次累加生成，采用最小二乘法估计GM(1,1)的发展系数和灰作用量，得到短期预测→定义年龄—时间人口密度函数，依据人口守恒关系建立含死亡率和出生边界条件的一阶偏微分方程→将连续方程按年龄和年份离散化，递推计算各年龄人口及总人口、劳动人口、老年人口和老龄化指数→加入城乡迁移、性别和生育模式等因素进行综合仿真→设置不同总和生育率情景，比较人口峰值、劳动力规模、老龄化程度和城乡结构→通过拟合误差、灰色关联度、后验差检验及情景合理性验证结果。
  validation: GM(1,1)采用残差检验、关联度检验和后验差检验：计算实际值与预测值的绝对误差和相对误差，平均相对误差约为0.11%；灰色关联度约为0.73，高于0.6的标准；后验方差比C约为0.0363，小误差概率P为1，达到灰色预测精度的较高等级。Logistic模型通过历史人口数据拟合及趋势图检查其与S形增长规律的一致性；年龄结构与迁移模型则通过不同生育率情景对比、人口守恒关系以及峰值时间和人口结构指标的合理性进行检验。
  visualization:
  - 人口总量历史值与预测值折线图
  - Logistic人口增长S形趋势曲线
  - 实际值与GM(1,1)拟合值对比图
  - 预测残差及相对误差图
  - 不同总和生育率情景对比折线图
  - 分年龄人口结构图或人口金字塔
  - 劳动年龄人口与老年人口变化曲线
  - 城乡人口迁移与城镇化趋势图
  pitfalls_avoided:
  - 避免仅用无限指数增长模型进行长期外推，因为该模型忽略资源、环境和人口容量约束，会导致长期人口规模无界增长；通过Logistic阻滞项限制增长并估计饱和值。
  - 避免用单一模型同时承担所有时间尺度的预测，因为短期数据驱动外推与长期饱和趋势的机理不同；分别采用GM(1,1)进行短期预测、Logistic进行长期趋势判断。
  - 避免只依据人口总量判断未来趋势，因为相同总人口可能对应完全不同的年龄结构、生育潜力和死亡水平；引入年龄—时间人口密度方程刻画结构变化。
  - 避免直接将连续偏微分方程用于离散统计数据，因为年龄和年份数据通常按组记录，无法直接代入连续模型；通过离散化建立可执行的逐期递推方程。
  - 避免在GM(1,1)中不经检验直接外推，因为模型精度高度依赖原始序列的平滑性；使用残差、关联度、方差比和小误差概率进行多重精度检验。
  - 避免在全国年龄结构模型中夸大国际迁移影响，因为相对于中国庞大人口基数，短期净国际迁移较小；在全国基础方程中暂时忽略该项，同时在城乡模型中单独考虑规模显著的国内迁移。
  - 避免只给出单一生育率假设，因为未来政策和生育行为存在不确定性；设置1.5、1.8和2.0等多情景，分析人口规模与老龄化指标的敏感性。
  - 避免仅依据少量随机年份反解Logistic参数后就断言预测稳定，因为参数可能对样本年份较敏感；应结合更多历史年份进行拟合、稳健性和样本外检验。
  innovation_points:
  - 构建短期、中期和长期相互衔接的多层预测体系：GM(1,1)负责短期高精度外推，Logistic模型刻画长期容量约束，年龄结构方程解释人口内部演化机制。
  - 由人口总量预测扩展到年龄密度预测，可进一步得到劳动年龄人口、老年人口、老龄化指数和人口峰值等多维指标。
  - 将生育率、年龄别死亡率、生育模式、性别结构和城乡迁移纳入综合人口仿真，提高模型对中国老龄化和城镇化特征的解释能力。
  - 通过多种总和生育率情景定量比较人口规模与老龄化之间的权衡，并提出将总和生育率维持在约1.8的政策参考。
  - 将连续人口发展偏微分方程转化为适配年度和年龄组统计数据的离散递推模型，增强了模型的可计算性和实际应用价值。
- id: 2018_A440
  source_paper: 2018 2018_A440
  problem_type: 仿真+优化+统计分析
  keywords:
  - 非稳态一维传热
  - 有限差分法
  - 厚度优化设计
  context: 针对四层高温作业服，在满足皮肤温度安全约束的前提下，建立瞬态传热模型并优化隔热层与空气层厚度，以兼顾防护性能、舒适性和制造成本。
  models:
  - name: 非稳态一维多层传热偏微分方程模型
    role: 描述高温环境下热量由作业服外层向人体皮肤方向传播的时间—空间温度分布。
    why: 外部边界和材料分布近似均匀，主要温度梯度沿服装厚度方向，可将三维问题合理简化为一维；同时皮肤温度随时间变化，必须采用非稳态模型。
  - name: 第三类边界与界面连续模型
    role: 刻画作业服外表面与环境、内表面与人体之间的对流换热，以及不同材料接触面上的温度和热流连续关系。
    why: 作业服两端均与恒温介质发生对流换热，而各层材料导热系数不同，需通过边界条件和界面条件构成完整、物理一致的传热系统。
  - name: 最小二乘参数估计模型
    role: 利用皮肤外侧实测温度反演外侧与内侧对流换热系数h1和h2。
    why: 换热系数无法由已知材料参数直接确定，可通过最小化模拟温度与实测温度的残差平方和获得参数的最优估计。
  - name: 显式有限差分数值仿真模型
    role: 将连续的偏微分方程在时间和空间上离散，逐时间层计算各层材料及皮肤外侧的温度。
    why: 多层非稳态传热方程难以获得解析解，显式差分实现简单、计算量较小，适合在参数搜索和厚度优化中反复调用。
  - name: 单变量约束优化模型
    role: 在60分钟最大皮肤温度、超过44℃持续时间和厚度范围等约束下，最小化第二层材料厚度。
    why: 第二层厚度是问题二的唯一设计变量，成本和笨重程度可用厚度最小化近似表达，且最优解通常位于安全约束的临界边界附近。
  - name: 多目标厚度优化模型
    role: 同时优化第二层隔热材料厚度和第四层空气层厚度，平衡安全性、舒适性、节约性、性能稳定性与研发效率。
    why: 两层材料对传热速度和隔热水平的作用不同，需要联合设计；通过标量化将多目标问题转化为可求解的单目标约束优化问题。
  - name: 辐射传热扩展模型
    role: 在第三层右边界与皮肤外侧之间加入斯忒藩—玻尔兹曼辐射换热项，用于检验忽略热辐射的合理性。
    why: 热辐射属于潜在传热机制，通过扩展模型重新估计参数并比较结果，可判断简化假设是否显著影响结论。
  solution_flow: 输入各层厚度、导热系数、密度、比热容、环境温度及皮肤外侧实测温度→依据能量守恒建立多层非稳态一维传热方程，配置对流边界、界面连续条件和37℃初始条件→采用最小二乘搜索估计h1、h2→使用满足稳定性条件的显式有限差分法计算时间—空间温度场→以最大皮肤温度、超过44℃时间及厚度范围为约束，分别求解单变量和双变量厚度优化→加入辐射项重新拟合并比较参数、残差和温度结果→输出最优厚度及安全性能指标。
  validation: 首先用模拟皮肤温度与实测温度的拟合曲线、残差平方和及误差范围检验参数估计效果；其次计算傅里叶网格数并验证显式差分满足内节点和边界稳定性限制，避免数值振荡；再次比较稳态温度分布和瞬态变化是否符合传热机理；最后在模型中加入辐射换热项重新估计参数，发现h1基本不变、h2仅由8.344变化至8.496
    W/(m²·K)，说明忽略辐射对主要结论影响较小。
  visualization:
  - 模拟温度与实测温度拟合折线图
  - 时间—空间—温度三维曲面图
  - 稳态温度空间分布曲线图
  - 不同厚度方案下皮肤温度随时间变化对比图
  - 温度分布数据表
  pitfalls_avoided:
  - 避免直接建立复杂三维模型：题目边界条件近似均匀且主要热流沿服装厚度方向，使用三维模型会显著增加计算量，却难以带来有效精度提升。
  - 避免将传热过程误设为稳态：作业安全约束包含工作时长和超过44℃的持续时间，稳态模型无法描述升温速度及高温暴露时长。
  - 避免忽略材料界面的物理连续性：不同层导热系数不同，若不同时满足界面温度连续和热流连续，会造成非物理的温度或能量跳变。
  - 避免直接套用经验换热系数：h1和h2对达到稳态的时间及最终皮肤温度影响不同，利用实测数据反演可减少参数主观设定带来的系统误差。
  - 避免显式差分步长选择不当：若傅里叶网格数超过稳定性上限，数值解会出现振荡甚至发散，因此需联合控制时间步长和空间步长。
  - 避免只约束终点温度或最大温度：灼伤风险还与高温持续时间相关，因此同时设置最大温度不超过47℃和超过44℃时间低于5分钟的约束。
  - 避免未经检验直接删除辐射项：通过建立含辐射的扩展模型并比较换热系数和拟合误差，确认其影响较小后再采用简化模型。
  - 避免将第二层和第四层视为作用完全相同：第二层主要延缓传热、影响升温速度，第四层更直接增强隔热并降低温度水平，联合优化时应体现两者功能差异。
  innovation_points:
  - 将多层复合防护服的三维瞬态传热过程合理降维为带材料界面条件的一维非稳态模型，实现物理真实性与计算效率的平衡。
  - 把实测温度拟合、换热系数反演、温度场仿真和服装厚度优化串联为统一的闭环建模框架。
  - 将最大皮肤温度与超过危险温度的持续时间同时纳入约束，使优化结果比单一温度阈值更符合热损伤机理。
  - 通过含辐射模型与无辐射模型的对照重新标定参数，以定量方式验证模型简化假设。
  - 区分第二层材料的传热延迟作用和第四层空气层的隔热作用，为长时间作业与更高温环境下的差异化设计提供依据。
- id: 2016_B022
  source_paper: 2016 2016_B022
  problem_type: 综合评价+优化+仿真
  keywords:
  - 投影寻踪
  - 模拟退火算法
  - 元胞自动机
  context: 研究封闭小区开放后内部道路接入城市路网对周边道路通行能力、拥堵程度及交叉口运行状况的影响。
  models:
  - name: 投影寻踪综合评价模型
    role: 将饱和度、排队长度、通行能力、延误、车头间距和平均速度六项指标降维为综合评价值，用于比较小区开放前后及不同时段的交通状况。
    why: 多项交通指标量纲、方向和影响程度不同，投影寻踪能够从高维数据中寻找最能反映样本结构的投影方向，降低单指标评价的主观性和不相容性。
  - name: 模拟退火优化模型
    role: 求解使投影指标函数最大化的最优投影方向，并由此确定各评价指标的综合贡献。
    why: 投影方向优化属于带单位向量约束的复杂非线性优化问题，传统解析方法和常规优化软件较难稳定求解，模拟退火具有较强的全局搜索能力，可降低陷入局部最优的风险。
  - name: 交通流微分方程模型
    role: 描述直行车道、T型交叉口和入闸式通道中的车流量、车辆位置、速度、密度及道路负荷系数随时间和空间的变化。
    why: 车辆运动和交通流演化具有明显的连续动态特征，利用连续性方程、动量关系及变道流量平衡可以刻画车辆运行状态之间的耦合关系。
  - name: 元胞自动机交通仿真模型
    role: 把车辆速度、位置、变道、转弯和道路结构等规则映射到二维道路网格中，模拟不同小区形状、道路结构和交通时段下的动态通行过程。
    why: 交通系统包含车辆间局部相互作用、随机变道及交叉口冲突等离散行为，元胞自动机适合通过简单局部规则生成复杂的交通流时空演化。
  - name: Braess悖论检验
    role: 检验新增T型通道后交通拥堵未缓解甚至可能恶化的反常现象，判断新增道路是否导致路网整体效率下降。
    why: 道路供给增加不一定提高网络效率，结合开放前后仿真数据检验Braess悖论，可以解释部分道路开放方案效果不佳的机制。
  solution_flow: 数据→采集或设定小区开放前后九个时段的六项交通指标，并按正负向性进行无量纲化→模型→建立投影寻踪综合评价模型，同时针对直行、T型和入闸式道路建立交通流微分方程与元胞自动机模型→参数→设置道路容量、信号周期、绿信比、车辆到达率、变道概率、转弯概率和元胞演化规则→求解→利用模拟退火获得最优投影方向并计算综合评价值，再通过元胞自动机生成不同小区类型、道路结构及高峰和平常时段的交通演化结果→验证→比较开放前后评价值与仿真拥堵状态，开展变道概率和转弯概率扰动的敏感性分析，并利用仿真数据检验Braess悖论。
  validation: 采用多层次验证：首先比较开放前后18组时段样本的投影评价值，检验模型能否识别高峰期与平常期的交通差异；其次将综合评价结果与元胞自动机生成的车流量及拥堵时空演化图进行交叉验证；再次针对T型通道开放后未缓解拥堵的现象，利用仿真数据实施Braess悖论检验；最后令变道概率和转弯概率在基准值附近约20%的范围内波动，观察综合评价值变化不超过约5%，据此判断模型具有较好的参数稳定性。
  visualization:
  - 交通影响评价指标体系层次图
  - 车辆通行模型求解流程图
  - 不同道路结构示意图
  - 二维元胞自动机交通流时空演化图
  - 开放前后各时段综合评价值对比图
  - 参数敏感性分析曲线
  pitfalls_avoided:
  - 避免直接比较不同单位的指标：饱和度、排队长度、延误、速度等量纲差异明显，若不归一化会使数值尺度较大的指标主导评价，因此先进行正负向识别和无量纲化处理。
  - 避免仅依赖单一交通指标下结论：单看速度、排队长度或通行能力可能得到相互冲突的判断，因此使用投影寻踪将六项指标综合为统一评价值。
  - 避免用同一演化规则描述所有道路：直行车道、T型交叉口和入闸式通道在变道、转弯及汇入冲突方面存在显著差异，因此分类建立车辆通行规则和模型。
  - 避免默认新增道路一定改善交通：新增T型通道可能因车辆路径选择和交汇冲突触发Braess悖论，因此必须比较开放前后的系统级通行效率，而不能只依据道路数量判断。
  - 避免仅依靠静态评价忽略动态拥堵传播：综合评价值无法直接展示车辆排队和拥堵的时空演化，因此引入元胞自动机进行动态仿真并与评价结果相互印证。
  - 避免忽视随机驾驶行为带来的参数不确定性：变道和转弯概率会影响仿真结果，因此通过约20%的参数扰动开展敏感性分析，检验结论是否稳健。
  innovation_points:
  - 构建“多指标综合评价—交通流机理建模—元胞自动机动态仿真”的组合框架，使宏观评价结果与微观车辆演化过程相互支撑。
  - 按直行、T型和入闸式三类局部道路结构分别建模，并进一步结合正方形、三角形小区及高峰期、平常期进行多情景定量分析。
  - 将模拟退火用于投影寻踪最优方向求解，实现六项交通指标权重的客观数据驱动确定。
  - 针对开放通道后拥堵未改善的反常结果引入Braess悖论解释和数据检验，突破“增加道路必然提升通行能力”的直觉判断。
- id: B_cumcm0740
  source_paper: B B_cumcm0740
  problem_type: 优化
  keywords:
  - 广义邻接矩阵
  - 多目标动态优化
  - 公交最优路径
  context: 针对城市公汽、地铁及步行组成的大规模公共交通网络，根据少换乘、少步行、较快捷和较经济等需求查询任意两站点之间的最优出行路线。
  models:
  - name: 广义邻接矩阵模型
    role: 存储任意两站点之间的直达线路、行驶方向、途经站数和收费方式等多维信息，并统一描述公汽与地铁网络。
    why: 普通邻接矩阵只能表示站点是否相邻，无法保存同一站点对之间的多条线路及其属性；广义邻接矩阵能够支持后续路线枚举和时间、费用计算。
  - name: 有限换乘路径枚举模型
    role: 通过广义邻接矩阵的类乘法构造直达、一次换乘和二次换乘路线集合，并删除重复或无效方案。
    why: 完整枚举大型公交网络中的所有路径会导致组合爆炸，而实际乘客通常不会选择换乘次数过多的路线，因此限制换乘次数可以兼顾可行性与计算效率。
  - name: 词典序多目标动态优化模型
    role: 按照乘客指定的首要需求，依次优化换乘次数、总时间、总费用或步行时间，并在当前最优方案集合中继续筛选次级指标。
    why: 不同出行指标之间量纲不同且偏好顺序因人而异，采用分层词典序优化可避免主观设置加权系数，并确保首要需求不被次要指标抵消。
  - name: 公交—地铁扩展网络模型
    role: 将地铁站视为扩展网络节点，把地铁线路信息加入广义邻接矩阵，并利用站点集合表示地铁站与周边公汽站之间的步行换乘关系。
    why: 公汽与地铁在线路层面相互独立，但可通过站外步行完成换乘；站点集合能够把跨交通方式换乘转化为集合元素组合与统一路径搜索问题。
  - name: 步行阈值站点集合模型
    role: 依据站点间步行时间是否小于阈值构造可步行连通的站点子集，再将步行连接与公共交通连接共同纳入路线搜索。
    why: 若直接认为所有站点均可步行互达，候选路径数量和计算规模会急剧增加；设置合理阈值能够排除现实中不可接受的长距离步行方案。
  solution_flow: 读取公汽、地铁线路及站点数据→提取线路编号、上下行方向、途经站数、收费方式和换乘关系→构造并扩充广义邻接矩阵→设置相邻站行驶时间、各类换乘时间、票价参数、最大换乘次数和步行阈值→按直达、一次换乘、二次换乘逐层生成候选路线并去重→计算每条路线的换乘次数、总时间、总费用和步行时间→根据用户需求进行词典序多目标筛选→输出线路编号、方向、换乘站、经过站数、时间和费用，并用给定起讫站案例检验结果。
  validation: 使用题目给定的多组起点—终点进行案例验证，检查输出路线中相邻乘车区段是否真实存在、上下行方向是否正确、换乘站是否同时属于前后线路，并复算途经站数、换乘次数、时间和费用；同时比较不同查询需求下的结果，确认少换乘、最短时间和最低费用方案分别满足对应指标的最优性，并检查路线是否遵守最大换乘次数及跨方式换乘限制。
  visualization:
  - 公交—地铁网络拓扑图
  - 不同需求下最优路线对比表
  - 换乘路径流程图
  pitfalls_avoided:
  - 避免枚举任意两站之间的全部简单路径，因为大型公交网络中路径数量会随节点和线路规模呈组合式增长，导致运行时间和存储空间不可接受；通过限制换乘次数并按层搜索控制复杂度。
  - 避免使用普通0-1邻接矩阵，因为同一站点对可能对应多条线路、不同方向和不同收费方式，单一邻接值会造成线路属性丢失；改用元素为信息集合的广义邻接矩阵。
  - 避免直接生成完整的高阶矩阵乘积，因为其中包含大量与当前起终点无关的元素和同线路重复换乘方案；算法只生成与指定起终点相关的矩阵元素并及时去重。
  - 避免将多目标简单加权求和，因为时间、费用、换乘次数和步行时间量纲不同，权重设置会显著影响结果；采用以用户首要需求为优先级的词典序筛选。
  - 避免把所有站点无条件视为步行连通，因为这会产生不符合乘客行为的超长步行路线并扩大候选集；利用步行时间阈值划分可接受的站点集合。
  innovation_points:
  - 将线路、方向、途经站数和收费方式封装在广义邻接矩阵元素中，并用类矩阵乘法统一生成不同换乘层级的路线。
  - 采用面向用户偏好的词典序多目标优化，在保证首要指标最优的前提下继续优化次级指标，从局部单指标最优推进到更完整的出行方案优化。
  - 以站点集合统一描述地铁站与周边公汽站的步行换乘，并进一步用步行时间阈值扩展到任意站点之间的步行连接。
- id: '5486_5486'
  source_paper: 5486 5486_5486
  problem_type: 统计分析+预测+优化+仿真
  keywords:
  - 道路通行能力
  - 车辆排队长度预测
  - 元胞自动机
  context: 针对城市道路交通事故占用不同车道的情形，利用视频数据分析事故横断面通行能力变化，并预测车辆排队长度及其到达上游路口的时间。
  models:
  - name: 背景差分与形态学车辆检测模型
    role: 从交通视频中识别运动车辆，为流量、车型和排队长度统计提供基础数据。
    why: 视频受到光照、噪声、卡顿和背景变化影响，差异积累背景建模比简单直方图法和平均背景法更适合车流量变化及车辆缓慢运动的场景；结合直方图均衡化、中值滤波、形态学开运算和Canny边缘检测可增强目标轮廓并抑制噪声。
  - name: 道路通行能力修正模型
    role: 根据基本通行能力及车道宽度、侧向净空、纵坡、视距、沿途条件和车型构成等因素计算事故横断面的理论通行能力，并利用单位时间通过的标准车当量估算实际通行能力。
    why: 事故导致可用车道数和交通条件改变，不能直接采用基本通行能力，需要通过道路条件和交通组成修正得到与事故现场相符的容量基准。
  - name: 正态性检验与方差分析模型
    role: 检验两个事故占用不同车道时横断面实际通行能力是否存在显著差异。
    why: 研究对象是两组通行能力样本均值的差异；在正态性和方差齐性条件满足后，方差分析能够判断占用车道位置的影响是否达到统计显著水平。
  - name: 通径分析模型
    role: 分解各车道流量比例对横断面实际通行能力的直接影响、间接影响和综合影响。
    why: 不同车道流量之间可能相互关联，单纯相关分析无法区分直接作用和经其他车道产生的间接作用，通径分析可揭示占用车道影响取决于车道流量分配的机制。
  - name: 城市交通二流理论模型
    role: 从交通流密度和上下游累计车辆数出发，计算事故持续过程中路段排队长度的理论变化。
    why: 排队形成同时受到上游到达流量、事故断面服务能力和拥堵密度影响，二流理论适合描述城市道路拥挤状态下交通流参数与排队扩展之间的关系。
  - name: BP神经网络排队长度预测模型
    role: 建立排队长度与事故横断面实际通行能力、上游车流量及事故持续时间之间的非线性映射。
    why: 排队长度受多个因素共同影响且关系具有明显非线性，难以用简单线性模型准确表达，BP神经网络具有较强的非线性拟合能力。
  - name: 遗传算法优化模型
    role: 优化BP神经网络的初始权重和阈值，提高排队长度模型的训练效果与稳定性。
    why: 传统BP训练容易受初始参数影响并陷入局部最优，遗传算法具有全局搜索能力，可改善网络收敛质量和预测精度。
  - name: 元胞自动机交通流仿真模型
    role: 将车辆离散为元胞并制定行驶、跟驰和受阻规则，仿真事故持续不撤离时排队向上游传播的过程，估算排队到达140米外上游路口的时间。
    why: 交通流具有离散车辆交互、局部跟驰和随机波动特征，元胞自动机能够直观模拟事故瓶颈下排队形成与传播，并便于加入信号灯控制规则。
  solution_flow: 数据→对视频逐帧灰度化，采用直方图均衡化和中值滤波增强图像，以差异积累背景差分、形态学滤波和边缘检测识别车辆；按60秒信号周期统计上游到达量、事故断面通过量、车型构成和排队长度，并按车型折算为标准车当量→模型→利用道路条件修正模型计算理论通行能力，以分钟通过量计算实际通行能力；通过正态性检验、方差齐性检验和方差分析比较不同占道位置，进一步以通径分析解释车道流量比例的作用；运用二流理论计算排队长度，并以实际通行能力和上游流量的夹角余弦综合权重、事故持续时间作为BP神经网络输入，以排队长度作为输出；最后建立元胞自动机仿真排队传播→参数→基本通行能力取2000
    pcu/h，设置车道宽度、侧向净空、纵坡、视距、沿途条件和车型修正系数，车型当量取小型车1、中型车1.5、大型车2，并设置交通密度、道路长度、神经网络权重阈值及元胞运动规则→求解→得到事故期间实际通行能力围绕约1315
    pcu/h的理论值波动，不同占道位置的均值差异不显著，但实际影响与各车道流量比例有关；训练遗传算法优化的BP网络预测排队长度，并通过元胞自动机估算排队到达上游路口约需8.3至9分钟，加入信号灯后约为8至8.4分钟、平均约8.36分钟→验证→通过统计检验、样本拟合、不同模型结果对照及加入信号灯前后的情景仿真验证结论的合理性。
  validation: 首先对两组实际通行能力样本进行正态性检验，显著性水平大于0.05后确认正态假设；再进行方差齐性检验，满足齐性后使用方差分析判断不同占道位置的差异。将两种实际通行能力计算结果与理论通行能力的时间序列进行对照，检查其是否围绕理论值合理波动。对排队长度模型比较BP神经网络输出与视频统计样本的拟合程度，并以二流理论计算结果作为机理参照。对到达时间采用元胞自动机多次仿真给出区间，同时设置不考虑信号灯与考虑信号灯两种情景进行稳健性对比。
  visualization:
  - 理论通行能力与实际通行能力随时间变化折线图
  - 车辆检测与边缘提取效果对比图
  - 正态性检验图和方差分析结果图
  - 排队长度随事故持续时间变化曲线
  - BP神经网络预测值与样本值拟合图
  - 元胞自动机排队传播仿真曲线
  pitfalls_avoided:
  - 避免直接使用质量较差的原始视频人工计数：原视频存在光照不足、噪声、卡顿、暂停和镜头拉伸，先进行图像增强和运动目标检测，并剔除异常片段，可减少车辆漏检、重复计数及流量统计偏差。
  - 避免采用30秒统计窗口造成信号周期干扰：上游路口信号周期为60秒，使用一分钟作为统计单位可以覆盖完整周期，削弱红绿灯造成的周期性高低波动。
  - 避免把不同车型直接等量计数：公交车和中大型车辆占用道路资源明显高于小型车，按1、1.5和2折算为标准车当量可防止通行能力估计失真。
  - 避免未经前提检验直接进行方差分析：先验证样本正态性和方差齐性；若条件不满足应改用非参数检验，从而避免显著性结论因统计假设不成立而失效。
  - 避免仅凭方差分析的“不显著”结论认定占道位置完全无影响：进一步使用通径分析考察车道流量比例的直接和间接作用，区分统计不显著与交通机理上不存在影响。
  - 避免使用静态或简单线性关系预测拥堵排队：排队长度与到达流量、瓶颈通行能力和持续时间之间存在非线性及动态累积效应，采用二流理论、神经网络和元胞自动机相结合可降低模型结构错设风险。
  - 避免BP神经网络受随机初始权重影响而陷入局部最优：使用遗传算法进行全局参数搜索，提高训练结果的稳定性和拟合能力。
  innovation_points:
  - 构建了从视频图像增强、背景差分检测到标准车当量统计的完整数据获取链条，将非结构化交通视频转化为可用于容量分析和排队预测的结构化数据。
  - 将方差分析与通径分析结合：前者判断不同占道位置是否存在显著差异，后者解释差异由各车道流量比例决定的内在机制，兼顾统计结论与交通机理。
  - 利用夹角余弦法综合事故横断面实际通行能力和上游车流量，再与事故持续时间共同输入BP神经网络，降低多因素尺度和权重不统一对预测的影响。
  - 采用二流理论、遗传算法优化BP神经网络和元胞自动机形成机理计算、数据驱动预测与微观仿真的多模型互证框架。
  - 在元胞自动机中进一步加入红绿灯规则，比较信号控制前后的排队到达时间和波动程度，使预测情景更贴近实际城市道路运行条件。
- id: A15010142_王子硕_吴鹏飞_陶立_A15010142_王子硕_吴鹏飞_陶立
  source_paper: A15010142_王子硕_吴鹏飞_陶立 A15010142_王子硕_吴鹏飞_陶立_A15010142_王子硕_吴鹏飞_陶立
  problem_type: 优化+仿真+统计分析
  keywords:
  - 月球软着陆轨道设计
  - Pontryagin极大值原理
  - 蒙特卡洛模拟
  context: 针对嫦娥三号从近月点15 km、远月点100 km的着陆准备轨道到月面预定区域的软着陆任务，设计满足六阶段状态约束且尽量节省燃料的轨道与控制策略。
  models:
  - name: 月心二体动力学模型
    role: 描述着陆准备轨道及动力下降段中探测器在月球中心引力作用下的位置、速度和质量变化规律。
    why: 软着陆持续时间仅为数百秒且月面附近近似真空，月球非球形引力、日地摄动和月球自转的短期影响相对较小，二体模型能在保证主要精度的同时降低求解复杂度。
  - name: 归一化极坐标状态方程模型
    role: 将径向距离、角位置、径向速度、角速度和质量统一表示为可用于轨道积分与最优控制求解的状态变量。
    why: 各状态变量的数量级差异较大，归一化可减少数值积分中的有效位数损失，并使优化变量保持相近量级，从而改善计算稳定性。
  - name: 开普勒椭圆轨道与万有引力模型
    role: 根据近月点和远月点高度计算椭圆轨道几何参数以及两拱点的速度大小和切向方向。
    why: 着陆准备轨道可近似为月球中心引力场中的固定椭圆轨道，开普勒定律和牛顿引力定律能够直接刻画拱点处的轨道速度关系。
  - name: 坐标变换与终端状态反推模型
    role: 利用月心赤道坐标系、月心惯性坐标系和着陆极坐标系之间的旋转关系，由预定着陆点及主减速终端约束反推出近月点、远月点的经纬度和速度方向。
    why: 轨道位置需要由动力学计算结果转换为实际月面经纬度，而同平面、过月球南北极的假设可进一步降低待定方位参数的维数。
  - name: Pontryagin极大值原理最优控制模型
    role: 以主减速阶段燃料消耗最小为目标构造哈密顿函数，通过状态方程、共轭方程和横截条件求得最优推力大小及推力方向制导律。
    why: 主减速阶段持续时间长且消耗绝大部分推进剂，属于带初末状态约束的连续时间最优控制问题，Pontryagin极大值原理可给出必要最优性条件和显式控制结构。
  - name: 两点边值数值仿真模型
    role: 联立状态方程、共轭方程、初始条件和终端约束，数值求解主减速阶段及快速调整阶段的最优轨迹和控制参数。
    why: 最优控制推导后形成初始状态已知、终端状态受约束而初始协态未知的两点边值问题，难以解析求解，必须借助数值积分和计算机仿真。
  - name: 刚体运动分解与月面平面动力学模型
    role: 在近月面阶段将探测器运动分解为质心平动和绕质心转动，并将平动进一步分为垂直下降与水平避障运动。
    why: 粗避障及后续阶段距离月面较近，可将局部月面近似为平面；运动分解能够分别处理主发动机产生的平动和调姿发动机产生的姿态变化，简化控制设计。
  - name: 高程图平坦区域搜索模型
    role: 处理月面高程数据，搜索坡度和起伏满足着陆要求的候选安全区域，为粗避障与精避障提供目标位置。
    why: 近月面轨迹不仅要满足动力学约束，还必须避开陨石坑和崎岖地形，直接利用高程信息筛选平坦区域能够把安全性条件纳入轨迹规划。
  - name: Lommel-Seeliger反射模型与Shape-from-Shading模型
    role: 根据月面影像的明暗变化恢复局部形貌，识别大陨石坑坐标并将其作为匹配跟踪和避障特征点。
    why: 单幅月面图像缺乏直接深度信息，结合符合月面光照特性的反射模型与明暗恢复形状方法，可增强地形识别和视觉匹配能力。
  - name: 自适应模拟退火遗传算法轨道优化模型
    role: 从智能优化角度重新搜索软着陆轨道和控制参数，并与Pontryagin极大值原理的结果进行交叉验证。
    why: 最优控制边值问题可能对初值敏感并存在局部解，融合遗传搜索、模拟退火和自适应机制有助于扩大搜索范围、改善全局寻优能力。
  - name: 蒙特卡洛模拟打靶与统计分布模型
    role: 随机采样月球和地球引力摄动、质量误差、初始轨道高度及经纬度偏差，模拟着陆点散布并统计落点误差分布。
    why: 实际扰动具有随机性且通过非线性动力学传播，解析求取落点分布较困难，蒙特卡洛方法可直接评估命中精度、偏差范围及正态分布特征。
  - name: 单因素灵敏度分析模型
    role: 分别对探测器质量、轨道高度和初始经纬度等参数施加微小变化，比较最终着陆点和轨迹结果的变化。
    why: 逐项扰动能够识别对落点误差影响较大的输入参数，并检验所设计轨道与控制策略对参数不确定性的鲁棒性。
  solution_flow: 输入月球参数、探测器质量与发动机推力范围、比冲、15 km与100 km拱点高度、预定着陆点、高程图和月面影像→建立月心极坐标二体动力学模型并进行无量纲归一化→利用终端状态反推和坐标变换确定近远月点位置，结合开普勒轨道关系求两点速度→以燃料消耗最小构造Pontryagin哈密顿函数，推导最优推力与姿态角制导律→将状态方程和共轭方程转化为两点边值问题并数值仿真主减速与快速调整阶段→在近月面坐标系中分解垂直下降、水平避障和姿态调整运动，结合高程搜索及Shape-from-Shading特征识别规划后三阶段轨迹→采用自适应模拟退火遗传算法复算轨道→通过蒙特卡洛模拟打靶、统计分布检验和单因素灵敏度分析验证精度与鲁棒性。
  validation: 采用多层验证策略：首先检查轨迹是否满足六阶段关键点的初始状态、终端高度、速度和姿态约束；其次将Pontryagin极大值原理所得轨道与自适应模拟退火遗传算法的优化结果进行交叉比较，以识别数值求解误差或局部最优风险；再次在加入月球非球形引力、月球和地球引力摄动等扰动后进行蒙特卡洛模拟打靶，并利用统计软件分析着陆点偏差及其正态分布特征；最后分别扰动质量、轨道高度和经纬度等参数，依据落点与轨迹变化评价模型灵敏度和鲁棒性。
  visualization:
  - 着陆准备轨道月面投影图
  - 高度—时间曲线
  - 速度—时间曲线
  - 发动机推力—时间曲线
  - 姿态角—时间曲线
  - 月面高程图与平坦区域标注图
  - 陨石坑特征识别图
  - 蒙特卡洛着陆点散布图
  - 着陆点偏差统计分布图
  pitfalls_avoided:
  - 避免在全部飞行阶段强行使用同一坐标系：远月面阶段采用月心极坐标以保留轨道曲率，近月面阶段改用局部平面直角坐标，否则会增加避障建模难度或因平面近似使用过早而产生明显几何误差。
  - 避免直接对量纲和数量级差异很大的状态变量积分：对距离、速度、时间、推力和质量进行归一化，否则轨道积分与边值问题迭代容易损失有效数字并出现病态收敛。
  - 避免把所有微小摄动直接加入基础优化模型：先利用短飞行时间论证并忽略月球非球形引力、日地摄动和月球自转，以控制模型复杂度，再在误差分析中恢复这些因素，防止求解成本过高且主要控制规律被次要项掩盖。
  - 避免只优化轨迹而忽视燃料变化：将质量作为状态变量并以终端质量最大化等价表示耗燃最小，否则推力方案可能满足终端状态却缺乏工程经济性。
  - 避免仅凭Pontryagin必要条件认定得到全局最优解：使用自适应模拟退火遗传算法独立复算并交叉验证，降低初始协态选择、数值迭代和局部极值造成误判的风险。
  - 避免在快速调整阶段混淆主发动机与调姿发动机的作用：将刚体运动分为平动和转动，并在调姿推力远小于主推力时忽略其对质心平动的影响，从而避免无必要的高维耦合。
  - 避免只按动力学可达性选取着陆点：同时利用高程图搜索平坦区域并识别陨石坑特征，否则轨迹即使满足速度和高度约束，也可能落入坡面或障碍区域。
  - 避免仅以单次确定性仿真评价落点精度：采用蒙特卡洛随机打靶分析多种扰动传播，否则无法反映实际着陆点的概率散布和极端偏差风险。
  innovation_points:
  - 构建分阶段、多尺度的混合建模框架：远月面阶段使用月心二体极坐标模型，近月面阶段切换到局部平面模型，并将水平避障、垂直下降和姿态调整分别处理。
  - 将Pontryagin极大值原理得到的解析型最优制导结构与自适应模拟退火遗传算法的全局搜索能力结合，实现轨道结果的双方法交叉验证。
  - 把轨道动力学优化与月面视觉感知相结合，通过高程图平坦区域搜索、Lommel-Seeliger反射模型和Shape-from-Shading方法提取陨石坑特征，形成面向安全着陆的轨迹规划方案。
  - 建立从确定性最优轨道、摄动误差传播到概率落点分布的完整验证链，并通过蒙特卡洛打靶和参数灵敏度分析量化控制策略的可靠性与鲁棒性。
- id: A398_A19004009_吴国斌_方荧荧_严格格
  source_paper: A398 A398_A19004009_吴国斌_方荧荧_严格格
  problem_type: 优化+仿真
  keywords:
  - 软着陆轨道设计
  - 动力学模型
  - 最优控制与敏感性分析
  context: 在月球引力环境、发动机推力和阶段状态约束下，为嫦娥三号确定着陆准备轨道及六阶段软着陆轨迹，并设计兼顾燃料消耗与着陆安全的控制策略。
  models:
  - name: 轨道定位与坐标转换模型
    role: 建立下降轨道参考系和月心赤道惯性系，通过旋转矩阵计算近月点、远月点及着陆点的空间坐标和经纬度。
    why: 轨道状态与着陆点分别在不同参考系中描述，必须通过统一的三维坐标转换才能确定轨道关键点的地理位置。
  - name: 霍曼转移轨道模型
    role: 利用轨道能量守恒、开普勒定律和椭圆轨道几何关系，计算近月点与远月点的速度大小、切向方向及转移时间。
    why: 着陆准备轨道是近月点15 km、远月点100 km的椭圆轨道，其关键点速度和飞行时间可由二体轨道理论直接确定。
  - name: 月球软着陆动力学模型
    role: 描述着陆器在月球重力和可调推力作用下的位置、速度与质量变化，并为六阶段轨迹设计提供状态方程和边界约束。
    why: 软着陆轨迹由重力、发动机推力、姿态方向和燃料消耗共同决定，需要动力学方程刻画状态随时间的演化。
  - name: 分阶段燃料最优控制模型
    role: 将六个软着陆阶段分别建模，以燃料消耗最小为主减速段的优化目标，并结合高度、速度、推力范围、姿态和阶段终端状态构造约束。
    why: 不同阶段的任务重点不同，主减速段强调燃料最优，接近段强调偏差修正，避障与着陆段强调安全性，统一控制目标难以准确反映各阶段需求。
  - name: 轨迹离散化非线性规划模型
    role: 把连续软着陆轨迹离散为若干节点，以相邻节点状态连续性为约束，通过函数迭代和数值逼近求解推力及轨迹。
    why: 连续最优控制问题难以直接解析求解，直接离散后可转化为可由数值优化程序处理的非线性规划问题。
  - name: 粗避障与精避障区域搜索模型
    role: 根据不同探测精度划分候选着陆区域，搜索安全性较高的最优着陆区，并通过角度分析计算轨道偏转大小和方向。
    why: 低空阶段存在地形障碍且探测精度随阶段变化，需要将区域筛选与姿态偏转控制结合以保证安全着陆。
  - name: 误差与敏感性分析模型
    role: 对重要状态变量和模型参数设置合理扰动区间，先进行单变量控制实验，再进行多变量联合误差分析以评价方案稳定性。
    why: 初始状态、动力学参数和控制执行均可能存在误差，需要检验轨迹和控制策略对扰动的敏感程度及鲁棒性。
  solution_flow: 输入月球半径、质量、引力常量、着陆器质量、发动机推力与比冲、预定着陆点及各阶段状态要求等数据→建立下降轨道参考系与月心赤道惯性系并推导转换矩阵→利用霍曼转移和轨道能量守恒确定近远月点速度、方向与转移时间→建立球形月球下的主减速段三维动力学模型及近月面阶段的平面动力学模型→按六个阶段设置燃料、安全、速度、高度、推力和终端状态约束→将轨迹离散化为节点并构造状态连续约束，以具有物理意义的状态量和控制量作为初值→使用MATLAB进行非线性规划、函数迭代和数值逼近，得到最优推力、姿态和着陆轨迹→通过粗避障、精避障区域搜索修正着陆点与偏转方向→采用单参数扰动和多变量联合扰动进行误差与敏感性验证。
  validation: 首先检查计算轨迹是否满足近远月点高度、速度方向、六阶段关键点状态、发动机1500至7500 N推力范围及软着陆末端速度等约束；其次利用MATLAB仿真绘制轨迹和状态变化，验证离散节点之间的连续性及燃料目标的收敛性；最后对关键变量和参数实施控制变量扰动及多变量联合扰动，比较着陆位置、末端速度和燃料消耗的变化，以判断模型稳定性与控制策略鲁棒性。
  visualization:
  - 三维月球轨道与软着陆轨迹图
  - 高度、速度、推力及燃料消耗随时间变化曲线
  - 六阶段软着陆过程示意图
  - 粗避障与精避障候选着陆区域分布图
  - 参数扰动—输出误差敏感性曲线
  pitfalls_avoided:
  - 避免在主减速长距离飞行阶段直接采用平面月球模型，因为该阶段跨越的月面距离较长，忽略月球曲率会造成明显的位置和轨迹偏差，因此采用均匀球体下的三维动力学模型。
  - 避免对所有软着陆阶段使用完全相同的目标函数和约束，因为各阶段分别侧重减速节能、轨迹修正、障碍规避和安全着陆，统一建模会掩盖阶段任务差异，因此采用六阶段分段控制。
  - 避免在不同坐标系中直接混用经纬度、轨道坐标和速度方向，因为这会导致旋转次序、符号和方向错误，因此先明确坐标轴定义并构造连续旋转变换矩阵。
  - 避免对非线性规划初值进行无物理意义的随机猜测，因为软着陆优化对初值敏感且容易不收敛或陷入不可行区域，因此使用满足基本运动规律的状态量与控制量作为初始解。
  - 避免只分析单一参数扰动而高估模型稳定性，因为实际误差可能同时作用于初始位置、速度和控制参数，因此在控制变量分析后进一步实施多变量联合误差分析。
  - 避免将轨道倾角、升交点赤经等未完全给定参数对应的位置结果误认为唯一解，因此先保留含参数的定位表达式，再通过给定参数情景计算示例结果。
  innovation_points:
  - 利用离散节点处的状态连续性约束，将常推力月球软着陆连续最优控制问题直接转化为非线性规划问题，并采用具有明确物理意义的状态和控制初值提高数值求解的可行性与收敛性。
  - 采用分尺度混合建模：主减速段考虑月球曲率并使用球形三维模型，近月面的接近、避障和着陆阶段采用平面近似，在计算复杂度与轨迹精度之间取得平衡。
  - 把燃料最优轨迹、粗精两级避障区域搜索和姿态偏转角计算纳入统一的六阶段控制框架，同时通过单变量与多变量扰动分析评价控制策略的稳定性。
- id: C15018009_丁晓彤_回荣洲_段君宜_论文正文
  source_paper: C15018009_丁晓彤_回荣洲_段君宜 C15018009_丁晓彤_回荣洲_段君宜_论文正文
  problem_type: 预测+优化+统计分析
  keywords:
  - 盈亏平衡分析
  - 最小二乘拟合
  - 混合整数优化
  - 0-1规划
  - 存栏动态管理
  context: 针对最大容量为10000头、依靠自有种猪繁育的生猪养殖场，综合留种、淘汰、配种、出栏时机、市场价格和饲料成本制定利润最大化经营策略。
  models:
  - name: 多元成本收益盈亏平衡模型
    role: 核算种猪、后备种猪、肉猪和变动成本以及肉猪销售收入，反求达到盈亏平衡所需的每头母猪年均产仔量。
    why: 产仔量直接决定可出售肉猪数量，而配种方式、养殖周期、种猪淘汰率和单位成本共同影响收支，因此适合通过总收入等于总成本的方程确定盈亏临界点。
  - name: 养殖规模饱和整数规划模型
    role: 在10000头容量限制下，优化公猪、母猪、小猪和后备种猪数量，计算母猪存栏数及小猪留种比例。
    why: 各类猪的数量必须为整数，同时受到繁殖平衡、公母种猪配比、淘汰补充和总容量等约束，整数规划能够保证方案具有实际可执行性。
  - name: 最小二乘线性回归模型
    role: 利用2002—2013年历史数据拟合饲料价格与生猪销售价格之间的关系，并据预测猪价推算未来饲料成本。
    why: 未来利润计算需要同步估计饲料价格，而历史数据表明饲料价格与猪价具有正向相关关系，最小二乘法可通过最小化残差平方和估计线性关系参数。
  - name: 0-1生产与出栏时序优化模型
    role: 用二元变量表示各时期是否配种生产及是否出栏，在生长周期和批次间隔约束下选择生产与销售时间。
    why: 生产和出栏属于离散决策，并存在从配种到出栏约9个月、生产间隔不少于180天和出栏间隔不少于150天等时序限制，0-1规划能够刻画这些逻辑关系。
  - name: 母猪规模动态利润最大化模型
    role: 在已优化的生产与出栏时点基础上，以各期母猪数量为决策变量，联动肉猪存栏、养殖成本和销售收入，求三年总利润及平均年利润。
    why: 母猪数量决定未来仔猪和肉猪供给，但受到场地容量、数量变化规律及繁殖周期约束，需要通过动态优化在扩繁收益与存栏成本之间取得平衡。
  solution_flow: 收集种猪和肉猪饲养成本、销售价格、淘汰率、公母猪配比及历史饲料价格等数据→按配种方式和3至5年养殖周期建立成本收益方程并判断盈亏平衡→建立容量、繁殖平衡、淘汰补充和整数约束模型，求饱和状态下的种猪结构→用最小二乘法估计猪价与饲料价关系，获得未来成本参数→设置生产和出栏0-1变量，优化批次时点→进一步将母猪数量设为动态决策变量，以三年利润最大为目标求解经营策略→通过情景对比、约束检查和收支及存栏曲线检验结果。
  validation: 采用多层次验证：首先绘制总成本线与总收入线检查盈亏平衡点是否真实存在，避免仅依赖代数解；其次分别使用2012、2013和2014年市场参数，并比较自然配种、人工授精及不同养殖周期下的结果，进行跨年份和多情景稳健性检验；再次核查整数规划结果是否满足10000头容量、产仔数量守恒、公母猪配比和淘汰补充约束；最后通过拟合散点与回归直线、母猪及肉猪存栏曲线检查价格关系和动态经营方案的合理性。
  visualization:
  - 总成本—总收入盈亏平衡图
  - 历史饲料价格与猪肉价格散点拟合图
  - 未来三年生猪价格预测曲线
  - 母猪存栏数时间序列曲线
  - 肉猪存栏数时间序列曲线
  pitfalls_avoided:
  - 避免在2014年单位销售收入不足以覆盖边际成本时强行给出盈亏平衡产仔量；论文先检查成本线与收入线是否相交，发现无交点后明确判定不存在盈亏平衡，并改用2012和2013年数据开展情景分析。
  - 避免只计算现有公母种猪而忽略淘汰后的补栏需求；模型显式引入公猪45%和母猪30%的年淘汰率，从仔猪中预留后备种猪，否则会高估可出售肉猪数量和利润。
  - 避免把猪的数量当作连续变量产生不可执行的小数头数；饱和规模模型对公猪、母猪和小猪数量设置整数约束，以保证经营方案可落地。
  - 避免仅用静态容量约束而忽略两批仔猪可能同时存栏；模型按母猪一年约两胎的繁殖特征计入多批小猪，从而防止实际峰值存栏超过10000头。
  - 避免根据高猪价只优化销售收入而假定饲料成本固定；模型利用历史数据拟合猪价与饲料价关系，使未来利润同时反映收入和成本的联动变化。
  - 避免将配种、生产和出栏视为同一期决策；模型加入从配种到肉猪出栏约9个月以及生产、出栏批次间隔约束，防止出现时间逻辑上不可实现的方案。
  innovation_points:
  - 将盈亏平衡、种群结构优化、价格成本拟合和动态经营优化串联为分层建模框架，实现从单头母猪生产效率到全场三年经营策略的逐级求解。
  - 采用两阶段动态优化：先在母猪数量固定时利用0-1变量确定生产和出栏时点，再将时点结果转化为条件并优化母猪规模，降低了同时优化时序与规模的复杂度。
  - 同时比较自然配种与人工授精，并把公母种猪配比和差异化淘汰率嵌入容量模型，使配种技术选择能够直接反映到留种比例和有效母猪存栏上。
  - 将猪肉预测价格通过回归关系映射为未来饲料价格，使市场端价格预测与生产端成本预测联动，提高利润测算的动态性。
- id: A_cumcm0705
  source_paper: A A_cumcm0705
  problem_type: 预测+仿真+统计分析
  keywords:
  - 人口增长预测
  - 年龄结构与老龄化
  - 城乡人口转移
  context: 基于中国人口出生、死亡、性别、年龄及城乡结构数据，预测人口规模的中短期与长期变化趋势并识别人口峰值。
  models:
  - name: 模型1.1：分地区出生—死亡递推模型
    role: 作为人口结构预测的基础模型，按市、镇、乡的生育率和女婴比例递推总人口。
    why: 人口增量可直接分解为出生人口减死亡人口，同时市、镇、乡生育特征差异明显，需要保留地区异质性。
  - name: 模型1.2：年龄分层人口递推模型
    role: 在模型1.1上加入少儿、劳动年龄和老年人口的结构系数及分年龄死亡率。
    why: 不同年龄阶段的死亡风险和人口占比显著不同，固定使用统一死亡率会忽略年龄结构对人口增长的影响。
  - name: 模型1.3：时变年龄结构人口模型
    role: 通过拟合随时间变化的人口结构系数，刻画老龄化加速并完成中长期人口预测。
    why: 中国老年人口比重并非常数，采用时变结构系数可避免固定年龄构成导致长期人口规模持续虚高，并能够预测人口峰值。
  - name: 模型2.1：Logistic阻滞增长模型
    role: 从宏观自然增长率角度描述人口增长受容量制约的趋势，并提供独立预测基准。
    why: 人口增长率通常随人口规模扩大而下降，阻滞增长微分方程能够表达人口趋向上限的非线性机制。
  - name: 模型2.1改进：新陈代谢Logistic模型
    role: 滚动使用前一年人口信息更新预测，以增强模型对时间变化趋势的响应。
    why: 仅以单一基期人口预测未来会造成信息固化，引入滚动更新可逐年吸收最新状态并改善趋势刻画。
  - name: 模型2.2：年龄队列动态演化模型
    role: 按年龄逐年推进人口队列，综合女性年龄别生育率、出生性别比和年龄别死亡率预测人口。
    why: 出生、死亡和年龄递进具有明确的人口学机制，队列模型比单纯总量外推更适合长期预测人口结构变化。
  - name: 模型2.3：含城乡转移变量的动态人口模型
    role: 在年龄队列模型中加入乡村人口向城镇转移及城镇化变量，修正市、镇、乡人口比例。
    why: 城乡人口占比并非长期不变，忽略人口流动会高估乡村参数的持续影响；加入转移变量可使地区结构更贴近现实数据。
  - name: GM(1,1)灰色预测模型
    role: 作为小样本时间序列预测的对照模型，用于比较结构模型与纯数据外推模型的效果。
    why: 灰色模型对样本量要求较低且适合平稳、无突变序列，但难以处理政策、城镇化或人口结构变化造成的跳跃，因此只作为比较基准。
  solution_flow: 整理2001—2005年市、镇、乡分年龄和分性别死亡率、1995—2005年育龄妇女生育率、出生性别比及人口结构数据→对女性比例、生育率、女婴比例、死亡率和城乡占比进行加权统计与趋势拟合→依次建立分地区出生—死亡模型、年龄分层及时变结构模型、Logistic阻滞增长模型、年龄队列动态模型和城乡转移改进模型→由历史自然增长率估计Logistic参数，由分地区和分年龄数据估计生育率、死亡率、性别比例、结构系数及转移参数→采用年度递推和微分方程解析解计算未来15年及20—50年人口规模→与历史调查数据、国家人口计生委及联合国预测结果比较，依据相对误差和长期趋势合理性筛选模型。
  validation: 采用历史回代、外部基准比较和趋势合理性检验相结合的策略：用2001年或2005年数据预测已有年份并与实际调查人口比较，计算相对误差；将中短期结果与国家人口计生委预测对照，将峰值年份与联合国预测对照；同时检查人口是否呈现先增后降、长期上限是否合理以及老龄人口比重是否符合老龄化规律。文中模型1.1中短期误差不超过5%，模型1.2不超过3.7%，模型1.3不超过3.85%，模型2.1对2002—2005年的误差约为0.11%—0.36%，最终依据误差及机制完整性优先选择模型2.3，并将模型1.3作为表现良好的结构化方案。
  visualization:
  - 人口总量年度趋势折线图
  - 总女性比例时间序列折线图
  - 市镇乡女婴比例对比折线图
  - 市镇乡育龄妇女生育率对比折线图
  - 中短期与长期人口预测表
  - 不同模型预测曲线对比图
  pitfalls_avoided:
  - 避免把生育率、死亡率和出生性别比永久设为常数，因为生育观念、医疗水平及人口素质变化会使这些参数随时间改变，固定参数会造成长期预测持续偏高。
  - 避免只使用全国平均参数而忽略市、镇、乡差异，因为城乡生育率和出生性别比差距较大，直接平均会掩盖地区结构对人口增量的影响。
  - 避免假设少儿、劳动年龄和老年人口比例长期稳定，因为中国处于快速老龄化阶段，固定年龄结构会低估老年人口比重及其较高死亡率，并使长期总人口预测失真。
  - 避免假设城乡人口完全不流动，因为乡村人口向城镇转移和城镇化会持续改变各地区权重，固定城乡占比会使预测长期偏离真实人口结构。
  - 避免仅依赖单一基期进行50年外推，因为参数和人口状态信息会逐渐陈旧；通过新陈代谢式滚动更新和时变结构系数提高模型对动态变化的适应性。
  - 避免将灰色模型直接用于存在结构突变的长期人口序列，因为GM(1,1)更适合平滑数据，难以解释老龄化、城镇化和政策变化引起的拐点，因此仅将其用作对照。
  - 避免只按样本内误差选择模型，因为短期拟合良好不代表长期机制合理；论文同时检查人口峰值、长期上限和先增后降趋势，以排除长期人口持续异常增长的模型。
  innovation_points:
  - 构建由地区差异、出生性别比、育龄妇女生育率、年龄别死亡率和人口结构系数共同驱动的人口递推框架，使总量预测具有明确的人口学解释。
  - 将少儿、劳动年龄和老年人口结构系数设为时间函数，显式描述快速老龄化到趋于稳定的过程，从而预测约2033年前后的人口峰值。
  - 在年龄队列动态模型中加入城乡人口转移变量，使市、镇、乡人口权重随城镇化演化，而非沿用固定地区比例。
  - 采用微观队列递推、宏观Logistic阻滞增长和灰色预测三类方法交叉比较，并结合误差与长期趋势合理性进行模型筛选。
- id: 2012_A441
  source_paper: 2012 2012_A441
  problem_type: 统计分析+综合评价+分类聚类+预测
  keywords:
  - 葡萄酒质量评价
  - 酿酒葡萄理化指标
  - 评酒员一致性
  - 逐步回归
  - Q型聚类
  context: 基于两组评酒员的红、白葡萄酒评分及酿酒葡萄理化指标，分析评价结果的一致性与可信度，并建立葡萄分级和葡萄酒质量预测模型。
  models:
  - name: Q-Q图与正态性检验
    role: 判断两组评酒员评分差异是否服从正态分布，为后续检验方法的选择提供依据。
    why: 评分数据存在偏态、集中和极端值，不能直接假设正态分布，需要先检验参数检验的适用条件。
  - name: Wilcoxon符号秩检验
    role: 检验两组评酒员对同一批葡萄酒的评分是否存在显著差异。
    why: 两组评分为配对数据，且正态性检验不通过，因此采用对分布假设要求较弱的非参数配对检验。
  - name: Z-score标准化
    role: 消除不同评酒员打分尺度以及不同理化指标量纲和波动范围的影响。
    why: 评酒员存在宽严尺度差异，各理化指标的单位和数量级也不一致，直接比较或回归会使大尺度变量占据主导地位。
  - name: 单因素方差分析
    role: 在评分标准化后进一步检验两组评酒结果是否仍存在系统性组间差异。
    why: 标准化削弱了评酒员个体尺度偏差，方差分析可用于判断处理后的组间差异是否显著。
  - name: 评分可靠性离散度模型
    role: 分别刻画同一酒样在不同评酒员之间的评分一致性，以及同一评酒员区分不同酒样质量的能力，从而选择更可信的评分组。
    why: 仅检验均值差异不能完整衡量评分质量，需要同时考虑组内一致性和评酒员对样品的区分度。
  - name: 逐步多元线性回归
    role: 从大量酿酒葡萄理化指标中筛选对葡萄酒评分具有显著影响的变量，并建立葡萄理化指标到葡萄酒预期得分的预测关系。
    why: 候选指标数量多、样本量相对较小且指标间可能存在多重共线性，逐步回归可在控制模型规模的同时完成变量筛选。
  - name: Q型聚类分析
    role: 根据标准化后的葡萄酒综合评分对红、白葡萄酒样品进行分组，并形成质量等级。
    why: 样品等级事先未知，聚类能够依据样品之间的相似性进行无监督分类，减少直接设定等级阈值的主观性。
  - name: 最近类中心距离分类
    role: 将葡萄理化指标回归得到的葡萄酒预期得分，与各葡萄酒等级的中心分数比较，并把葡萄样品划入距离最近的等级。
    why: 葡萄质量与其所酿葡萄酒质量密切相关，使用到各等级中心的一维欧氏距离可以实现直观、可解释的等级映射。
  - name: 多元回归与相关关系分析
    role: 描述酿酒葡萄多个理化指标与葡萄酒理化指标及最终质量之间的函数关系和影响方向。
    why: 葡萄与葡萄酒之间是多指标共同作用关系，简单的单变量相关分析无法反映多因素联合影响。
  solution_flow: 数据→检查满分约束、缺失值和明显异常值，并以同指标相邻重复测量均值或同酒样其余评分均值进行修正→对评分和理化指标实施Z-score标准化→利用频数分布图、Q-Q图和正态性检验识别分布特征→采用Wilcoxon符号秩检验及标准化后的方差分析比较两组评分→构造评酒员一致性与区分能力离散度指标，选取更可靠的一组评分→以葡萄酒标准化评分为因变量、葡萄理化指标为自变量进行逐步回归并筛选关键指标→对葡萄酒评分进行Q型聚类，计算各质量等级中心→由回归模型预测各葡萄样品对应的葡萄酒得分，再按最近类中心距离完成葡萄分级→通过拟合优度、显著性检验和葡萄与葡萄酒等级吻合率验证模型。
  validation: 首先用Q-Q图和正态性检验验证统计检验前提，并以Wilcoxon符号秩检验确认原始配对评分存在显著差异；随后对评酒员评分标准化，再用方差分析检验组间差异是否消失。通过同一酒样的评分离散度和同一评酒员对不同样品的评分离散度评价数据可靠性。回归模型使用R-squared检验拟合效果，红、白葡萄相关模型的拟合优度约为0.96和0.87。最后将葡萄预测等级与对应葡萄酒聚类等级交叉比较，红葡萄和白葡萄的等级一致率分别约为88.9%和85.7%，据此验证分级模型的有效性。
  visualization:
  - 评分频数分布直方图
  - 正态性Q-Q图
  - Q型聚类树状图
  - 等级中心与预测得分距离图
  - 评分离散度对比表
  - 实际等级与预测等级交叉对比表
  pitfalls_avoided:
  - 避免在评分差异不服从正态分布时直接使用配对t检验；论文先通过Q-Q图识别非正态性，再采用Wilcoxon符号秩检验，降低错误分布假设导致的显著性偏差。
  - 避免把不同评酒员的宽严尺度误判为酒样质量差异；对每位评酒员的评分进行Z-score标准化，削弱主观评分起点、尺度和波动范围不同造成的系统偏差。
  - 避免不同理化指标因单位和数量级差异而主导回归结果；所有指标先标准化，使回归系数和变量影响具有可比性。
  - 避免明显录入或检测异常值扭曲回归和聚类结果；对远离同一指标其他重复测量的数据进行识别，并用相邻重复测量均值或同酒样其余有效评分均值替代。
  - 避免仅凭两组评分均值接近就判断评分可靠；额外构造样品内评分一致性和评酒员区分能力指标，从一致性与鉴别力两个方向评价评分组。
  - 避免在小样本下把全部理化指标一次性纳入模型；使用逐步回归筛除不显著变量并缓解多重共线性，但同时指出变量较多时仍存在过拟合风险。
  - 避免人为直接设定质量等级分界点；先采用Q型聚类形成数据驱动的等级，再用各类平均分作为等级中心进行分类。
  - 避免仅依靠葡萄酒评分对葡萄进行分级而忽略葡萄自身属性；通过理化指标回归得到预期葡萄酒得分，使葡萄分级同时利用原料指标与成酒质量信息。
  innovation_points:
  - 构造双维度评分可靠性指标：一方面要求同一酒样在不同评酒员之间的评分离散度较小，另一方面要求评酒员对不同质量酒样具有较大的评分区分度，从而比单纯均值或方差比较更全面。
  - 建立“葡萄理化指标筛选—葡萄酒得分预测—葡萄酒聚类分级—最近等级中心匹配”的跨对象分级链条，将葡萄原料属性与最终成酒质量统一到同一评价框架中。
  - 对评酒员评分先实施个体尺度标准化，再比较组间一致性，使分析重点由主观打分习惯转向酒样之间的相对质量差异。
  - 采用实际葡萄等级与对应葡萄酒等级的吻合率进行外部验证，使无监督聚类和回归预测结果获得具有业务含义的交叉检验。
- id: 2016_B044
  source_paper: 2016 2016_B044
  problem_type: 综合评价+仿真+统计分析+优化
  keywords:
  - 交叉口延误时间
  - 元胞自动机
  - 控制变量法
  - 相关性分析
  - 优化路径选择
  context: 研究不同小区结构、周边道路结构和车流条件下，开放小区内部道路对周边车辆通行效率产生的疏流收益与出入口分合流损失。
  models:
  - name: 前后延时差综合评价模型
    role: 以小区开放前后受影响交叉口平均延误时间之差作为核心评价指标，统一衡量开放小区对周边道路通行的净影响。
    why: 小区开放既会通过内部道路分流降低信号交叉口延误，也会因出入口分流、合流增加排队延误，平均延误时间能够将两类方向相反的效应统一量化。
  - name: 信号交叉口平均延误模型
    role: 根据绿信比、信号周期和道路饱和率计算有信号灯交叉口的平均延误时间。
    why: 开放小区引起的道路流量变化会直接改变饱和率，该模型可以把实时交通量转化为可比较的延误指标。
  - name: 无信号交叉口分合流延误模型
    role: 依据右转车辆比例、行人与非机动车修正系数、转弯条件和道路通行能力，估计小区出入口处的额外排队延误。
    why: 若只计算主路分流收益，会系统性高估开放效果；该模型能够刻画车辆减速转弯及出口合流形成的局部瓶颈。
  - name: 元胞自动机车辆通行模型
    role: 将车辆视为元胞，对车辆进入研究区域、一般道路行驶、信号交叉口通行和无信号交叉口通行进行离散动态仿真。
    why: 道路交通具有离散、局部交互和时变特征，元胞自动机便于描述跟驰、停车、排队、分流和合流行为，并可输出各道路实时交通量。
  - name: 等概率随机路径选择模型
    role: 模拟路况信息不完全时，车辆在交叉口对可行道路进行随机选择的行为。
    why: 驾驶员缺乏实时路况信息时难以识别最优路径，随机选择能够作为信息不完全情景下的基准行为规则。
  - name: 优化路径选择模型
    role: 综合道路逻辑距离、实时交通量及入口占用情况构造权重函数，引导车辆选择权重最小的道路。
    why: 该模型能够模拟实时交通信息充分传播后的理性择路行为，减少拥堵道路和被占用入口的继续流入，从而提高路网资源利用率。
  - name: 控制变量与相关性分析模型
    role: 分别改变小区内部道路长度、内部道路节点数和车辆进入概率，分析这些因素与前后延时差或负效应发生比率之间的关系。
    why: 开放效果受到多个结构与流量因素共同影响，控制变量法可以隔离单因素作用，相关性及显著性检验可增强结论的统计可信度。
  solution_flow: 构建小区及周边道路拓扑并设置信号周期、绿灯时间、道路容量、道路长度、节点数、车辆进入概率和转向比例等参数→以车辆为元胞建立进入区域、一般道路、信号交叉口和无信号交叉口四类状态转移规则→分别在小区开放前后以及信息不完全和信息较完全情景下运行交通仿真→统计各道路实时交通量，计算信号交叉口延误与出入口分合流延误→汇总得到开放前后延时差→采用控制变量实验改变内部道路长度、节点数和车流量，并进行相关性与显著性分析→搜索使延时改善最大的车流量或采用最小权重路径选择→通过简化模型、完整模型和多情景结果对比验证结论并形成规划与交通管理建议。
  validation: 采用多层次情景验证：首先在不含分合流效应的简化路网中检验开放后延误应下降这一方向性结论；其次在完整模型中加入出入口排队，检查模型能否同时产生正效应和负效应；再通过控制变量重复仿真，考察延时差随道路长度、节点数和车流量变化的稳定趋势，并利用相关性分析和显著性水平检验统计关系；最后比较随机择路与优化择路结果，验证实时信息和优化路径选择能否降低负延时差出现概率。模型中的道路容量、车辆长度、速度、转弯参数和修正系数采用交通工程参考值，以保证参数合理性。
  visualization:
  - 小区及周边道路拓扑示意图
  - 小区出入口分流与合流示意图
  - 开放前后平均延误时间对比折线图
  - 前后延时差与内部道路长度关系图
  - 前后延时差与道路节点数关系图
  - 前后延时差与周边车流量关系图
  - 随机择路与优化择路效果对比图
  pitfalls_avoided:
  - 避免只用道路流量或平均速度作为单一指标，因为二者无法同时反映内部道路分流带来的容量收益和出入口排队造成的速度损失，改用开放前后交叉口总延误差评价净效应。
  - 避免把所有道路都纳入研究范围造成边界过宽和无关误差，仅选择与小区出入口存在分合流关系的道路及内部道路的替代道路作为受影响范围。
  - 避免忽略小区出入口分流、合流效应而高估开放收益，在完整模型中显式计算入口减速延误，并通过元胞冲突规则模拟出口合流排队。
  - 避免默认驾驶员总能选择最优道路，分别设置路况信息不完全时的随机择路和信息充分时的优化择路，使行为假设与现实信息条件匹配。
  - 避免多因素同时变化导致因果关系混淆，通过控制变量法分别改变内部道路长度、节点数量和车辆进入概率，再结合显著性检验判断相关关系。
  - 避免允许无信号出入口车辆随意左转而低估冲突和拥堵风险，限定只有设置交通信号灯时才允许左转进出小区。
  - 避免重复计算出口合流延误，元胞自动机已通过同一时刻出口起始元胞只能容纳一辆车的冲突规则产生排队，因此不再额外叠加同类延误。
  innovation_points:
  - 构造前后延时差指标，将信号交叉口因分流产生的延误缩短与小区出入口因分合流产生的排队增长统一到同一净效应评价框架中。
  - 将交通系统分解为车辆进入、一般道路、有信号交叉口和无信号交叉口四个元胞自动机子模型，实现复杂小区路网的模块化仿真。
  - 设计同时考虑道路逻辑距离、实时交通量和入口占用状态的路径权重函数，并将信息不完全与信息充分两类驾驶行为纳入统一模型。
  - 通过简化模型与完整模型逐层加入分合流效应，识别小区开放由正效应转为负效应的机制及适用边界。
  - 将小区内部交通复杂度量化为道路节点数，将周边道路结构量化为可替代道路长度，将车流量量化为车辆进入概率，从而支持可重复的控制变量实验。
- id: 2018_A466
  source_paper: 2018 2018_A466
  problem_type: 仿真+优化
  keywords:
  - 一维复合介质热传导方程
  - Crank-Nicholson方法
  - 非线性约束优化
  context: 针对高温作业服的多层传热过程进行数值仿真，并在人体皮肤温度安全约束下优化隔热材料层与空气层厚度，以降低成本和缩短研发周期。
  models:
  - name: 一维复合介质非稳态热传导模型
    role: 描述环境、四层服装介质与假人皮肤之间的瞬态传热过程，计算各层温度随空间和时间的变化。
    why: 服装各层可近似为平行无限大平板，主要温度梯度位于厚度方向，且各层无内热源，因此可将三维热传导问题简化为具有分段材料参数的一维复合介质热传导问题。
  - name: 稳态热阻关系与最小均方根误差参数拟合模型
    role: 利用皮肤外侧稳态温度建立两个对流换热系数之间的关系，再通过实验温度序列拟合确定环境侧与皮肤侧对流换热系数。
    why: 题目未直接给出对流换热系数，而稳态条件可减少未知参数维数；以模拟温度与实测温度的均方根误差为目标，可由数据反演得到参数hI和hIV。
  - name: Crank-Nicholson有限差分模型
    role: 对分层非稳态热传导偏微分方程、对流边界条件及层间连续条件进行离散，逐时刻求解温度场。
    why: 该隐式中心差分格式具有二阶时间与空间精度，并具有较好的数值稳定性，适合长时间、多介质瞬态传热仿真。
  - name: 单变量非线性约束优化模型
    role: 在皮肤外侧最高温度不超过47摄氏度且高于44摄氏度的累计时长不超过300秒的条件下，求II层最小厚度。
    why: 问题二只有II层厚度一个决策变量，目标是减少材料消耗，且约束指标必须通过热传导仿真获得，适合采用由粗到细的定步长搜索求取可行最小值。
  - name: 双变量区域搜索与字典序优化模型
    role: 搜索II层和IV层的可行厚度组合，并优先最小化II层厚度，再在此前提下选择使系统更快达到稳态的IV层厚度。
    why: II层决定主要材料成本，而IV层为空气间隙、对直接材料成本影响较小，因此采用成本优先、研发周期次优的字典序目标比简单加权求和更符合实际决策偏好。
  - name: 局部灵敏性分析模型
    role: 考察各层厚度及对流换热系数发生小幅变化时皮肤外侧温度的响应，识别关键影响因素。
    why: 实际生产存在厚度误差，参数拟合也存在估计误差，灵敏性分析能够判断模型结果的稳健性并为制造精度控制提供依据。
  solution_flow: 读取各层密度、比热、导热率、厚度范围及皮肤外侧实测温度数据→依据无限大平板、无内热源和忽略辐射等假设建立分层一维非稳态热传导方程，并配置对流边界、界面温度连续和热流连续条件→由αi=ki/(ρici)计算热扩散率，利用稳态温度关系消去一个未知对流系数，再以实验温度序列的均方根误差最小为准拟合得到hI=117.41
    W/(m²·摄氏度)、hIV=8.36 W/(m²·摄氏度)→采用Crank-Nicholson格式求解温度场和皮肤外侧温度曲线→问题二对II层厚度实施粗搜索与逐级缩小步长的精搜索，得到最小可行厚度17.6
    mm→问题三对II层和IV层厚度进行二维区域搜索，并按先成本后研发周期的字典序准则得到19.3 mm和6.4 mm→通过实验拟合误差、物理规律、约束复核及灵敏性分析验证结果。
  validation: 首先比较模拟皮肤外侧温度与附件实测温度，以均方根误差及逐时刻残差检验参数拟合效果，残差最大约0.025摄氏度且随后维持在较小范围；其次检查温度场是否满足由外层向内层递减、随时间升高并趋于稳态的传热规律；再次对优化结果重新仿真，确认最高温度低于47摄氏度且超过44摄氏度的时长分别为281秒和290秒；最后对各层厚度作正负0.5
    mm扰动并考察换热系数变化，验证模型能识别不同层的隔热贡献，同时确认结果对环境侧换热系数hI相对不敏感。
  visualization:
  - 对流换热系数与均方根误差关系曲线
  - 模拟温度与实测温度残差曲线
  - 时间—空间—温度三维分布图
  - 各层交界面温度随时间变化曲线
  - II层厚度与皮肤最高温度关系曲线
  - II层厚度与超过44摄氏度时长关系曲线
  - II层—IV层可行厚度区域散点图
  - 最优厚度下皮肤外侧温度时间序列图
  - 厚度扰动与皮肤外侧稳态温度关系图
  pitfalls_avoided:
  - 避免直接把多层服装等效为单一均匀材料，因为不同层的导热率、密度和比热不同，统一参数会掩盖层间隔热差异并造成温度场失真。
  - 避免只设置界面温度连续而忽略热流连续，因为在无接触热阻、无界面热源的条件下，层间能量守恒要求两侧导热热流相等。
  - 避免任意指定未知对流换热系数，因为边界换热参数会影响温度预测；先利用稳态关系降维，再结合完整实验温度序列拟合，可提高参数的可辨识性与可信度。
  - 避免仅检查工作结束时的皮肤温度，因为安全约束同时包含最高温度和超过44摄氏度的持续时间，只验证终点温度可能漏掉中间时段的热暴露风险。
  - 避免一开始就在全部厚度范围内使用极小步长穷举，因为每个候选厚度都需要调用偏微分方程求解器；采用粗到细搜索和单调性缩小范围可显著降低计算量。
  - 避免将II层和IV层厚度简单等权处理，因为II层消耗实体材料而IV层为空气间隙；使用成本优先、研发周期次优的字典序目标更符合工程经济含义。
  - 避免忽视生产厚度偏差，因为模型对层厚较敏感；通过局部扰动分析可识别IV层等关键尺寸，并提示实际加工时需要重点控制相应公差。
  innovation_points:
  - 将实验数据反演与机理传热模型结合：先借助稳态解析关系降低对流换热参数维数，再利用瞬态温度序列完成拟合，兼顾物理可解释性与数据适配性。
  - 构建仿真与优化一体化框架，将Crank-Nicholson温度场求解器作为约束评价器，直接把皮肤温度和热暴露时长转化为厚度设计约束。
  - 针对双层厚度设计采用区域搜索与字典序优化，明确区分实体材料成本和空气层对研发周期的影响，避免主观加权系数导致决策结果不稳定。
  - 利用厚度—安全指标的单调关系开展由粗到细的自适应搜索，在保证厚度精度的同时减少重复热传导仿真次数。
- id: 2017_B264
  source_paper: 2017 2017_B264
  problem_type: 统计分析+优化
  keywords:
  - 任务定价
  - 任务分配优化
  - 最大流启发式算法
  context: 针对移动众包拍照平台，在会员位置、信誉、接单限额和地区收益期望存在差异的条件下，研究任务合理定价、任务分配及联合打包，以有限成本提高任务完成率。
  models:
  - name: 经纬度球面距离模型
    role: 将任务与会员的经纬度转换为球面距离，为邻域统计、满意度计算、任务打包和分配约束提供基础数据。
    why: 任务选择和完成成本与空间距离密切相关，采用地球球面余弦公式比直接使用经纬度欧氏距离更符合实际地理关系。
  - name: 多因素任务定价规律模型
    role: 以基础价格为起点，综合会员密集程度、任务集中程度和任务难易程度解释原有任务定价。
    why: 会员供给越充足、任务越集中，单项任务所需激励通常越低；任务越困难则需要更高报酬，因而可用加减项形式刻画这些因素对价格的影响。
  - name: 地区与信誉修正定价模型
    role: 在原定价模型中加入经济发达地区溢价，并用会员接单限额修正有效会员供给能力，形成新的任务定价方案。
    why: 原模型忽略地区收入水平造成的收益期望差异，也把不同信誉和接单限额的会员等同处理，容易高估或低估局部任务承接能力。
  - name: 会员满意度与任务完成可能性模型
    role: 利用任务报酬与距离成本之比衡量会员满意度，并引入信誉罚函数和地区阈值判断会员是否愿意接单。
    why: 会员接单的核心依据是净收益或性价比，而平台又具有高信誉会员优先的机制，因此需要同时刻画距离成本、价格、信誉和地区期望。
  - name: 0-1任务分配优化模型
    role: 以有效完成任务数量最大为目标，在会员接单限额、任务唯一分配、满意度阈值、预约优先级和总预算约束下确定会员与任务的匹配关系。
    why: 任务分配属于离散匹配问题，每个任务是否分配给某会员具有明确的0-1属性，且需要同时满足容量、预算和行为规则等多重约束。
  - name: 基于最大流的启发式分配算法
    role: 将会员容量与任务唯一分配关系转化为网络流结构，并结合满意度和预约顺序处理复杂约束，求解任务分配方案。
    why: 原始整数优化模型约束复杂、直接精确求解成本较高，而最大流结构适合处理二部匹配和容量限制，可在较短时间内获得高质量可行解。
  - name: 空间任务打包定价与分配模型
    role: 依据任务距离、完成状态和价格差异将多个任务组成任务包，再把任务包视为新任务重新定价和优化分配。
    why: 打包能够分摊会员出行成本，提高低吸引力任务的整体性价比，并借助已完成或高价格任务带动邻近未完成任务。
  solution_flow: 读取任务位置、原价格、完成状态以及会员位置、信誉、预约时间和接单限额数据→利用球面距离公式构造任务—会员及任务—任务距离矩阵，并统计固定邻域内会员数和任务数→通过散点图、热力图和区域对比识别会员密度、任务集中度、难度及地区期望对价格和完成情况的影响→建立基础多因素定价模型，并由实际价格反推部分任务难度→加入地区溢价和会员有效容量修正得到改进定价→根据价格、距离成本、信誉和地区阈值构造会员可接受任务集合→建立以完成量最大为目标的0-1分配模型→采用基于最大流的启发式算法求得匹配方案→按照空间邻近、完成状态互补和价格差异原则打包后重新定价与分配→通过总费用、平均价格和任务完成率的前后对比评价方案，并将缺少难度信息的模型用于新项目。
  validation: 首先将基础定价公式代入附件中的实际任务，检验多数任务价格是否符合模型规律，并用典型已完成和未完成任务进行案例解释；其次在近似相同的总费用条件下比较原方案、改进定价分配方案和打包方案的完成率，改进方案相对原方案提高24.5%，打包后又提高7.2%；最后对新项目剔除不可观测的任务难度因素进行外推，结合优化分配得到87.8%的预测完成率，以成本基本稳定和完成率持续提升作为实施效果验证依据。
  visualization:
  - 任务完成状态与地理位置分布图
  - 会员地理位置分布图
  - 任务价格空间热力图
  - 价格—邻域会员数散点图
  - 价格—任务集中度散点图
  - 未完成任务原因空间标注图
  - 优化前后总定价与完成率对比表
  pitfalls_avoided:
  - 避免直接用经纬度坐标作平面欧氏距离，因为经纬度单位与实际路程不一致且会产生空间尺度误差，论文先通过球面余弦公式转换为地理距离。
  - 避免仅凭任务价格高低解释是否完成，因为完成情况还受会员供给、任务竞争、距离成本、任务难度和地区收入期望共同影响，模型采用多因素联合分析。
  - 避免将邻域内所有会员视为完全相同的一个供给单位，因为高信誉会员具有更高接单限额和优先选择权，改进模型以可承接任务总量修正会员密集程度。
  - 避免对不同城市使用统一满意度阈值，因为经济发达地区会员的收益期望更高，相同价格在不同地区可能产生不同接单结果，模型设置分区域期望阈值和地区价格补偿。
  - 避免允许同一任务被重复计入完成量，因为这会虚增目标函数，分配模型明确约束每个任务最多由一名会员完成。
  - 避免完全沿用平台给出的过高会员限额，因为单个会员预约过多可能无法及时履约，模型将有效接单限额上限设为5以降低任务被占用却未完成的风险。
  - 避免在新项目中强行使用无法观测的任务难度变量，因为附件3仅提供任务位置，继续使用该因素会导致参数不可识别，因此外推时主动舍弃难度项。
  innovation_points:
  - 将会员—任务双向选择机制统一为“定价—满意度—可接受集合—优化分配”的连续建模链条，使价格设计与任务匹配不再相互割裂。
  - 用会员接单限额刻画有效会员供给，并结合信誉优先权和预约时间建立更符合平台运行规则的分配约束。
  - 针对复杂0-1分配模型设计基于最大流的启发式算法，利用网络流容量结构提高求解效率。
  - 提出空间邻近、完成状态互补和价格差异驱动的三类打包原则，通过共享出行成本带动低吸引力任务完成。
  - 在总费用基本不变的约束下同时评价定价、分配和打包策略，以完成率增量而非单纯拟合价格作为方案优劣标准。
- id: 2017_A053
  source_paper: 2017 2017_A053
  problem_type: 仿真+优化+统计分析
  keywords:
  - 平行束CT参数标定
  - 滤波反投影重建
  - 标定模板设计
  context: 针对存在安装误差的平行束CT系统，利用已知圆—椭圆模板的投影数据标定探测器间距、旋转中心和投影角度，并重建未知物体的形状、位置及吸收率。
  models:
  - name: 探测器间距区间估计模型
    role: 利用小圆在任意投影方向上直径不变的性质，根据接收到信号的探测器数量及投影对称性建立圆直径与探测器间距的不等式，估计探测器单元间距。
    why: 小圆的投影宽度不随扫描方向改变，能够把已知直径转换为探测器尺度，并通过区间约束降低离散采样和边界相切状态带来的误差。
  - name: 小圆圆心相对运动微分方程模型
    role: 将发射—接收系统的旋转等价为模板绕固定旋转中心反向转动，通过微元法建立小圆圆心在探测器坐标轴上的正弦运动方程，并反演旋转中心位置。
    why: 小圆距离旋转中心较远，其投影轨迹变化比椭圆更明显，正弦轨迹中的振幅、相位和偏置分别对应几何距离、初始方位与探测器坐标偏移，具有明确的物理意义。
  - name: 特征点参数辨识模型
    role: 选取椭圆长轴投影方向、短轴投影方向和小圆轨迹最低点三个特殊状态，构造方程组求解运动方程中的未知参数。
    why: 三个特征状态具有明确的几何约束，能够用较少数据闭合三个未知参数的方程组，并减少直接对全部离散数据进行非线性求解的复杂度。
  - name: 分段圆心轨迹提取模型
    role: 在小圆与椭圆投影分离时采用限制窗口内极值搜索，在二者投影重合时采用Prewitt边缘检测并对上下边界取中点，从而提取180个方向下的小圆圆心位置。
    why: 分离段的衰减极值可直接表征圆心，而重合段存在衰减叠加，整体极值会偏离圆心，因此必须使用边缘信息恢复圆的中心轨迹。
  - name: 投影角度反演模型
    role: 将提取的180个圆心坐标代入已标定的正弦运动方程，逐列反求实际投影角度及其变化范围。
    why: 安装误差可能使名义上的等间隔角度与真实扫描方向不一致，利用实测圆心轨迹反演角度可为后续反投影提供更准确的几何参数。
  - name: 滤波反投影重建模型
    role: 依据Radon变换、傅里叶中心切片定理和卷积滤波，对各方向投影进行频域滤波，再执行反投影以重建二维吸收分布。
    why: 直接反投影的点扩散函数具有长尾，会形成星状伪影；在反投影前使用R-L、S-L或Hamming等滤波器可以补偿频率响应，提高边缘清晰度和空间分辨率。
  - name: 离散坐标插值与图像缩放模型
    role: 采用最近邻插值和线性插值完成投影极坐标系与图像直角坐标系之间的离散映射，并通过双线性插值调整重建矩阵规模。
    why: 像素点映射到探测器轴后通常不落在整数采样位置，若直接取整会产生明显的几何错位和锯齿，因此需要插值估计非采样点的投影值。
  - name: 吸收率黑箱增益标定模型
    role: 以已知模板分布矩阵的吸收率为基准，比较标定数据经过重建后的灰度值，识别投影数据增益与真实吸收率之间的映射关系，并将其用于未知样品。
    why: 重建灰度值受投影数据尺度、滤波和归一化影响，不能直接视为物理吸收率；借助已知标准模板进行系统级标定能够统一输出灰度与吸收率量纲。
  - name: 参数搜索修正模型
    role: 以标定参数为初值，将不同旋转角度范围和旋转中心参数代入重建算法，通过重建质量与模板一致性比较进一步修正参数。
    why: 仅由少量离散特征点求得的参数存在量化误差，而重建结果综合利用了全部投影数据，可作为全局反馈对初始几何参数进行二次校准。
  - name: 多边形超定标定模板模型
    role: 保留小圆并引入正方形或正六边形模板，利用多个边方向产生更多特征投影，建立超定方程组并可结合遗传算法搜索最优参数。
    why: 椭圆最多提供有限的显著方向，难以平均离散特征点误差；多边形可产生多个稳定特征方向，使参数能够通过冗余观测和最小误差原则估计。
  solution_flow: 读取已知模板及180组探测器投影数据→依据小圆投影宽度与对称性建立不等式并估计探测器间距→将扫描系统旋转等价为模板反向旋转，建立小圆圆心正弦运动方程→提取长轴、短轴和轨迹最低点，求解旋转中心相关参数→对投影分离段进行窗口极值搜索，对重合段进行Prewitt边缘检测，获得180个圆心坐标→代入运动方程反演真实投影方向→建立以旋转中心为原点的投影坐标系，对投影执行傅里叶变换、卷积滤波、反投影和离散插值→重建二维图像并经缩放、二值化提取形状、位置及特征点→利用已知模板吸收率标定灰度增益，将同一映射用于未知样品→以重建模板与已知模板的一致性搜索修正旋转中心和角度范围→通过几何投影误差、图像质量及不同模板方案进行验证。
  validation: 采用多层验证：首先检查探测器间距是否落在由三类小圆投影状态共同确定的可行区间，并计算最大相对误差；其次将求得的旋转中心和角度重新代入滤波反投影模型，比较重建标定模板与已知模板在轮廓、椭圆中心、圆位置和吸收率上的一致性；再次对候选角度范围进行分段搜索，以伪影程度和几何重合度选择修正参数；最后检验修正后旋转中心在探测器平面上的投影是否接近探测器中心，并据此反推出探测器安装偏差，形成几何结果与重建结果的交叉验证。
  visualization:
  - 投影矩阵二维灰度图或热力图
  - 小圆三类一维投影曲线
  - 小圆圆心正弦轨迹及特征点图
  - Prewitt边缘检测结果图
  - 180个实际投影角度变化曲线
  - 滤波反投影重建灰度图
  - 二值化轮廓与特征点标注图
  - 不同滤波器或参数下的重建效果对比图
  pitfalls_avoided:
  - 避免直接用椭圆中心轨迹标定旋转中心，因为旋转中心接近椭圆中心时投影位置变化幅度较小，离散采样误差会被放大；改用偏离旋转中心的小圆可提高参数可辨识性。
  - 避免把接收到信号的探测器数量直接等同于小圆直径，因为边界射线是否与圆相交以及圆心是否落在中心射线上会造成28个或29个单元的差异；通过多种相切和对称状态建立区间不等式更稳健。
  - 避免在小圆与椭圆投影重合区域直接寻找全局衰减极值，因为两种物体的衰减叠加会使极值偏离小圆圆心；改用Prewitt算子提取边界并取上下边界中点。
  - 避免直接采用未滤波反投影，因为其点扩散函数在非原点处不为零，会产生明显星状伪影；先在频域进行卷积滤波再反投影。
  - 避免在极坐标与直角坐标转换时简单四舍五入，因为离散投影位置通常不对应整数探测器索引，会造成条纹、锯齿和空间偏移；采用最近邻、线性及双线性插值。
  - 避免把MATLAB重建图像的归一化灰度直接解释为吸收率，因为滤波、反变换及显示归一化会改变数值尺度；使用已知模板建立增益映射后再输出物理吸收率。
  - 避免机械接受由三个特征点得到的初始参数，因为特征点来自离散采样且椭圆特征方向存在平台区；将参数带回完整重建流程，根据模板一致性进行二次修正。
  - 避免认为名义上每次转动1度就代表真实投影角严格等间隔，因为安装与旋转误差会使实际方向偏移；利用180个小圆圆心位置逐方向反演实际角度。
  innovation_points:
  - 将扫描装置绕物体旋转等价为模板绕固定系统反向旋转，并以小圆投影轨迹构造具有明确几何含义的正弦运动方程，实现旋转中心与投影方向的联合标定。
  - 针对小圆与椭圆投影的分离段和重合段采用极值搜索与边缘检测两种方法分段提取圆心，提高复杂叠加投影下的轨迹识别精度。
  - 把图像重建算法视为黑箱系统，以已知模板吸收率为标准识别输入增益与输出灰度之间的关系，实现重建灰度到物理吸收率的统一。
  - 利用完整图像重建结果反向修正几何标定参数，使局部特征点标定与全投影数据重建形成闭环校准。
  - 提出正方形和正六边形等多方向标定模板，通过增加稳定特征方向建立超定方程组，并预留遗传算法等全局搜索方法以降低单个特征点误差的影响。
- id: 2017年全国数模题目讲解_建模教学研究-谢金星
  source_paper: 2017年全国数模题目讲解 2017年全国数模题目讲解_建模教学研究-谢金星
  problem_type: 统计分析+综合评价
  keywords:
  - 数学建模能力测评
  - 创造性思维
  - 教学实验
  - 相关性分析
  - 教学方法比较
  context: 针对中国高校偏重知识技能、建模教育实证与定量研究不足的问题，通过大学生教学实验研究数学建模能力与创造性思维、其他数学课程成绩及不同教学方法之间的关系。
  models:
  - name: 数学建模能力测评模型（TMMS）
    role: 利用标准化测试工具量化学生的数学建模能力，形成可用于比较和关联分析的能力指标。
    why: 数学建模能力具有多维性，不能仅以课程成绩或竞赛获奖情况代替，专门的测评工具能够提高评价的针对性和可操作性。
  - name: 相关性分析模型
    role: 分析数学建模能力与创造性思维水平、其他数学课程成绩之间的关联方向和强度。
    why: 研究问题关注多个连续测量指标之间的关系，相关分析可定量检验建模能力是否与创造性思维及传统数学学习表现相关。
  - name: 组间差异检验模型
    role: 比较不同教学方式或不同学生群体在数学建模能力与创造性思维指标上的差异。
    why: 仅比较均值不足以判断教学效果，采用显著性检验能够区分真实教学差异与抽样波动。
  - name: 对照教学实验模型
    role: 将分析式教学方法与建构式教学方法进行对比，评估不同教学路径对学生建模能力发展的影响。
    why: 教学方法优劣需要在明确参与者、教学任务和评价指标的条件下进行实证比较，避免依赖教师经验或主观总结。
  solution_flow: 选取33名自动化专业大学二年级学生并记录其背景与相关课程成绩→实施数学建模能力测试及创造性思维测评→整理测评得分和教学实验数据→计算描述统计量并检验测量质量→采用相关性分析研究建模能力与创造性思维、其他数学课程成绩的关系→通过组间差异检验比较分析式与建构式教学效果→结合统计显著性、效应差异和教育情境解释结果→形成建模课程教学建议。
  validation: 通过明确样本年级、专业、学校层次和建模活动经历保证研究对象可解释；检查测评工具的信度、效度及评分一致性；对教学前基础水平和实验条件进行控制或比较；使用显著性检验、效应量与相关系数共同判断结果；结合原始测评表现和教学观察进行定量与定性互证，并在结论中明确33人单班样本对外推性的限制。
  visualization:
  - 建模能力与创造性思维得分散点图
  - 不同教学方法测评得分箱线图
  - 各项能力指标均值及误差棒图
  - 建模能力与数学课程成绩相关矩阵热力图
  pitfalls_avoided:
  - 避免把竞赛成绩或课程总评直接等同于数学建模能力，因为这些结果还受到选拔机制、团队合作和教师指导等因素影响，应使用专门的TMMS测评工具。
  - 避免仅凭教学经验宣称某种教学方法更优，因为缺少对照、量化指标和显著性检验时，观察到的差异可能来自学生基础或随机波动。
  - 避免将研究写成年终工作总结或竞赛成绩汇报，因为这类材料无法回答具体研究问题，也难以与国际建模教育研究形成可检验的学术对话。
  - 避免只报告相关关系而解释为因果关系，因为建模能力、创造性思维和数学成绩可能共同受到既有能力、学习动机等混杂因素影响。
  - 避免忽略真实世界联系，因为纯数学解题或单纯讲授数学内容不符合数学建模教育研究的核心要求，任务和评价均需体现现实问题到数学模型的转化。
  - 避免对33名同班学生的结果作过度推广，因为样本规模较小且来自单一专业和学校层次，结论主要适用于相近教学情境。
  innovation_points:
  - 在中国高校数学建模教育研究以定性经验总结为主的背景下，引入可重复的量化测评和教学实验，将建模能力研究转化为具体、可检验的问题。
  - 同时考察数学建模能力、创造性思维和传统数学课程成绩，揭示建模教育相对于知识技能型课程可能具有的独特培养价值。
  - 将分析式与建构式教学路径纳入同一评价框架，为建模课程教学方法选择提供基于数据的证据。
  - 强调测评工具、实验对象、数据收集、分析技术和研究限制的完整报告，提高建模教育研究的规范性与可复现性。
- id: B_cumcm0746
  source_paper: B B_cumcm0746
  problem_type: 优化
  keywords:
  - 多目标优化
  - 分层优化
  - 最短路径
  context: 针对公汽、地铁与步行等不同交通方式组合，在较快捷、较经济和换乘次数最少三类乘客偏好下求解起终点之间的最优公交出行路线。
  models:
  - name: 多目标目标规划模型
    role: 以总出行时间、总费用和换乘次数为评价指标，在固定换乘次数下生成并筛选可行路线。
    why: 公交路线选择同时涉及时间、费用和换乘等相互冲突的目标，多目标规划能够统一描述不同乘客的出行偏好与路线约束。
  - name: 词典序分层优化模型
    role: 将多目标问题按偏好转化为有优先级的单目标问题，例如先最小化时间再最小化费用，或先最小化费用再最小化时间。
    why: 三类偏好具有明确的目标优先级，词典序优化比简单加权求和更能避免主目标被次要目标补偿，并保留主目标最优条件下的次优筛选能力。
  - name: 分层网络模型
    role: 按照换乘次数构造逐层扩展的有向网络，分别建立时间边权图和费用边权图，并利用动态规划求解固定换乘次数下的最短路径。
    why: 换乘次数较少时，路线天然具有分层结构；将集合枚举转化为网络最短路能够降低搜索复杂度，并便于实施先主目标、后次目标的两阶段筛选。
  - name: 双向完全图最短路模型
    role: 以全部站点为节点，为任意有序站点对建立有向边，并根据直达线路、地铁换乘或步行方式初始化时间与费用边权，再求受换乘次数约束的最优路径。
    why: 统一的图结构便于融合公汽、地铁和步行等交通方式；通过将不可达边设为无穷大、对多种连接方式进行比较过滤，可以避免显式枚举急剧扩张的方案集合。
  - name: Dijkstra最短路径算法
    role: 在非负时间或费用边权的双向图上计算起终点之间的最短路径，并在主目标最优路径集合中按次目标继续筛选。
    why: 各类出行时间与费用边权均为非负，满足Dijkstra算法的适用条件，能够较高效地求解站点网络中的单源最短路问题。
  - name: 公汽—地铁集合搜索模型
    role: 扩展站点、线路、分段时间和分段费用向量，生成包含公汽与地铁换乘的固定换乘次数可行方案集，再实施分层优化。
    why: 加入地铁后，跨站换乘和不同交通方式间的换乘耗时需要被显式记录；集合搜索模型能够准确表达公汽—地铁组合路线的可行性及其时间、费用构成。
  solution_flow: 数据：整理公汽与地铁线路、站点顺序、直达关系、票制、相邻站行驶时间、候车与不同方式间换乘时间以及站间步行时间；模型：构造固定换乘次数的可行方案集、分层有向网络或双向完全图，并设置时间与费用双重边权；参数：计算各路段基段数、分段票价、候车时间、换乘时间和步行时间，将不可达连接赋无穷大，并将换乘次数限制在合理范围内；求解：先在每个换乘次数下按乘客偏好实施词典序优化，利用动态规划或Dijkstra算法求局部最优解，再跨换乘次数比较得到全局最优路线；验证：检查路线连通性、线路方向与换乘约束，比较不同模型和不同交通方式范围下的时间、费用及换乘指标，并分析加入地铁或步行后的指标改善。
  validation: 采用可行性校验与对比验证相结合的策略：逐段检查输出路线是否存在对应直达线路、方向是否正确、换乘站是否有效以及换乘次数是否超限；重新累计各路段行驶、候车、换乘和步行时间及票价，验证目标值计算一致性；对目标规划、分层网络和双向完全图在相同输入与偏好下的结果进行交叉比较；进一步比较仅公汽与公汽加地铁等场景，检验扩展交通方式后最优目标值不会劣化，并考察快捷偏好下时间改善和经济偏好下费用改善是否符合实际解释。
  visualization:
  - 分层公交换乘网络图
  - 起终点最优路线示意图
  - 不同交通方式组合的时间与费用对比柱状图
  - 换乘次数—时间—费用关系图
  pitfalls_avoided:
  - 避免直接对时间、费用和换乘次数进行无依据的加权求和，因为不同指标量纲不一致且权重难以解释；采用词典序分层优化能够严格体现乘客的首要偏好。
  - 避免在加入任意站间步行后继续显式枚举全部路线，因为每个站点都会增加大量后继选择，方案树会发生组合爆炸；改用双向完全图并通过最小边权比较和不可达边过滤控制计算规模。
  - 避免忽略上下行方向而产生实际不可乘坐的路线，将公交线路的上下行视为不同线路，并以有向边表示站点间通行关系。
  - 避免只求固定换乘次数下的局部最优解而误判总体最优路线，先分别求各换乘次数下的局部最优方案，再在允许范围内进行全局比较。
  - 避免主目标相同的多条路线被任意舍弃，在第一阶段保留全部主目标最优路径，再使用费用或时间作为次级目标筛选。
  - 避免对不存在直达关系的站点对参与正常最短路计算，将相应时间和费用边权设为无穷大，以保证所得路径满足交通网络的真实连通性。
  - 避免环线起点与终点同名导致站序和基段数计算混乱，将环行线路中相同的起点站与终点站作为两个顺序节点处理。
  - 避免遗漏候车与不同交通方式换乘的附加耗时，在总时间中分别加入初始候车、公汽换公汽、地铁换地铁、公汽换地铁和地铁换公汽的时间参数。
  innovation_points:
  - 将乘客的快捷、经济和少换乘偏好统一表示为具有不同优先级顺序的多目标词典序优化问题，实现同一框架下的个性化路线推荐。
  - 提出先按固定换乘次数局部优化、再跨换乘次数全局选优的两阶段策略，兼顾乘客心理可接受性与算法可计算性。
  - 同时构造时间边权图和费用边权图，通过先删除非主目标最短路径、再在残余网络上优化次目标，实现严格的双层最短路筛选。
  - 利用双向完全图统一表达公汽、地铁和步行连接，仅需修改站点对之间的时间与费用边权即可扩展交通方式，增强了模型的通用性。
  - 针对不同首要偏好采用联动边权初始化：快捷偏好下先确定最短时间及其对应费用，经济偏好下先确定最低费用及其对应时间，从边级别保留词典序最优的直达连接。
- id: 2017_D018
  source_paper: 2017 2017_D018
  problem_type: 优化
  keywords:
  - 0-1规划
  - 巡检排班
  - 路线优化
  context: 在化工厂26个巡检点具有不同巡检周期、作业耗时和路网行走时间的条件下，优化三班制巡检人员数量、工作时间与巡检路线，并兼顾休息要求和工作量均衡。
  models:
  - name: 巡检点间最短路模型
    role: 根据巡检点连通关系计算任意两点之间的最短行走时间，为排班与路线优化提供距离时间矩阵。
    why: 原始数据仅包含部分点位之间的连通与耗时，巡检路线可能经过多个中间点，因此必须先计算点对点最短通行时间，避免将直连时间或不可达路径错误代入优化模型。
  - name: 多目标0-1整数规划排班—路径联合优化模型
    role: 在固定上班时间且不考虑休息的情形下，联合确定每班巡检人数、各工人的巡检点分配、巡检顺序和时间安排。
    why: 工人是否巡检某点、是否经过某条路径均属于离散决策，适合使用0-1变量描述；同时需要兼顾人员数量最少、总耗时较小、巡检频次满足和工人负荷均衡等目标与约束。
  - name: 带休息约束的0-1整数规划模型
    role: 在基础排班模型中加入连续工作约2小时后休息5至10分钟的规定，并调整单人有效工作时间和工作时段约束。
    why: 休息会占用班次时间并分割连续作业过程，直接影响单人可承担的巡检任务量，因此必须显式设置休息间隔、休息时长及有效工作量约束。
  - name: 错时上班多目标优化模型
    role: 允许不同工人的上班起始时间错开，分别对无休息和有休息情形重新优化，并与固定班次方案比较。
    why: 固定交接时刻容易导致周期性巡检任务集中和人员冗余；通过放宽统一开工时间，可以利用时间错峰提高人员利用率并进一步减少每班人数。
  solution_flow: 读取巡检周期、巡检耗时和路网连通数据→对26个巡检点统一编号并用穷举最短路方法生成点间最短行走时间矩阵→检测周期与巡检耗时数据的有效性→设置工人—点位分配、路径选择等0-1决策变量以及班次时长、巡检频次、时序衔接、单点单人作业和负荷差约束→分别建立固定上班、固定上班含休息、错时上班无休息和错时上班含休息模型→利用Excel整理数据并使用LINGO求解→输出人员数量、巡检时间表和路线图→通过任务覆盖、时间可行性及工作量均衡性检验结果，并比较固定与错时方案的人力消耗。
  validation: 首先对周期和巡检耗时进行异常值检测，并以约85%和92%的数据正确率作为数据有效性依据；其次检查每个巡检点在8小时内的实际巡检次数是否达到由巡检周期决定的需求次数，检查同一时刻一名工人是否只执行一个任务、单个点是否只由一人巡检以及路线是否连通；再次统计各工人的总工作量，固定班次无休息方案中5人的工作量为472至480分钟、相互差异不超过约10分钟，以验证负荷均衡与班次时长可行性；最后比较固定上班与错时上班的最优人数，检验错时方案是否确实降低人力需求。
  visualization:
  - 巡检时间表
  - 巡检路线图
  - 工人—巡检点0-1分配表
  - 工作量占比饼图
  pitfalls_avoided:
  - 避免直接使用局部连通边耗时代表任意两巡检点的通行时间，因为两点之间可能需要经过多个中间节点；先构造最短时间矩阵可保证路线耗时计算合理。
  - 避免只追求人员最少而造成部分点位漏检，因为模型按巡检周期约束每个点在8小时班次内的最低巡检次数。
  - 避免人员数量较少但个别工人超负荷或任务分配严重不均，因为模型限定单人工作时间范围，并控制任意两名工人的工作量差不超过约10分钟。
  - 避免忽略作业资源冲突，因为模型假设并约束同一时刻一名工人只能巡检一个点，且同一巡检点同一时刻只需一名工人作业。
  - 避免将休息时间当作有效巡检工时，因为含休息模型从班次总时长中扣除休息时间，并按照约110至120分钟连续工作设置阶段性休息约束。
  - 避免仅给出点位分配而不验证实际可执行路线，因为结果进一步转换为具体巡检时间表和连通路线图，用于核对行走、巡检与时序衔接。
  innovation_points:
  - 将人员配置、点位分配、巡检时序、路径选择和工作量均衡统一纳入0-1整数规划，实现排班与路线的一体化优化。
  - 在固定三班制之外引入错时上班机制，并对有无休息两类场景分别优化比较，使无休息情形由每班5人降至4人、含休息情形由每班6人降至5人。
  - 将劳动制度要求转化为可计算约束，通过连续工作约2小时后的休息安排和有效工时修正，提高方案的实际可执行性。
- id: 2017_B315
  source_paper: 2017 2017_B315
  problem_type: 统计分析+优化+分类聚类+仿真+综合评价
  keywords:
  - 众包任务定价
  - 吸引力因子
  - 聚类搭售
  context: 基于历史任务与会员的地理位置、价格、信誉和完成情况，分析众包拍照任务的定价规律，并优化单任务及联合发布任务的定价与分配方案。
  models:
  - name: 多尺度邻域密度定价模型
    role: 计算任务点周边的会员密度和任务密度，识别历史定价规律，并构造与两类密度负相关的候选定价公式。
    why: 任务价格和完成情况具有明显的空间异质性，而会员密度与任务密度能够分别刻画任务的潜在供给能力和集中完成带来的规模收益。
  - name: 基于库仑定律类比的吸引力因子模型
    role: 综合任务价格、会员信誉、会员到任务点的距离及区域困难因子，度量任务对会员的吸引力，并据此进行任务分配。
    why: 任务吸引力与价格、信誉正相关，与距离负相关，类库仑表达式能够以简洁形式表达这些单调关系，并允许通过困难因子吸收区位、交通和信息不对称等影响。
  - name: 按预订优先级的贪心任务分配模型
    role: 按照预订开始时间和信誉排序会员，再在预订限额内依次分配吸引力最大的未分配任务。
    why: 该模型符合平台中高信誉会员优先、会员配额受限以及同一任务不可重复分配的实际规则，且便于直接开展仿真。
  - name: 单位长度期望收益路径模型
    role: 以路径总报酬与路径长度之比衡量任务组合吸引力，通过逐点扩展路径为会员选择一组收益效率较高的任务。
    why: 会员通常追求在较短行程内获得更多报酬，该模型比逐个任务独立选择更能反映连续完成多个任务时的路径效应。
  - name: 信誉归一化与概率完成模型
    role: 在保持会员信誉排序的前提下进行对数变换，并将归一化信誉映射为会员完成任务的概率。
    why: 原始信誉值差异过大，直接使用会导致少数高信誉会员对分配和完成率估计产生过强影响，对数压缩可增强数值稳定性。
  - name: K-means聚类与邻域搭售模型
    role: 将空间上集中的任务聚为任务包，并依据单项价格、总价格及吸引力提升条件推导联合定价的上下界。
    why: 集中任务具有一次出行完成多项工作的可能性，聚类能够识别适合联合发布的任务，而搭售定价可兼顾会员接受意愿与平台成本。
  - name: 多指标仿真评价模型
    role: 通过模拟任务选择与完成过程，计算分价格完成率、总完成率、会员总盈利、平台总收益以及价格—完成率稳定性。
    why: 任务价格会同时影响分配结果、完成概率和平台收益，单一完成率无法全面评价方案，需要从完成效果和经济效益两方面比较。
  solution_flow: 数据→清洗任务、会员和信誉数据并换算经纬度距离，绘制空间分布→采用多尺度邻域统计会员密度与任务密度，结合价格分布和区域经济水平分析历史定价规律及未完成原因→构造密度定价公式，并建立类库仑吸引力模型和单位长度期望收益模型→设定信誉变换、距离衰减指数、困难因子、预订限额和任务价格等参数→按照预订时间与信誉顺序，利用贪心规则或路径扩展算法完成会员—任务匹配→使用K-means和小邻域划分集中任务，根据搭售约束确定任务包价格区间→对历史项目和新项目进行仿真→利用完成率、价格—完成率曲线、会员盈利和平台收益比较新旧方案并反馈调整定价。
  validation: 首先计算候选密度定价变量与历史价格的相关系数，比较不同定价公式对原方案的解释能力；其次将原定价方案和新定价方案输入相同的会员排序、任务分配及完成概率机制进行对照仿真，比较各价格档完成率、总完成率、会员总盈利和平台总收益；同时利用价格—完成率折线图检查各价格档表现是否稳定，避免总体完成率掩盖局部低完成率；对于联合发布方案，则比较搭售前后的完成率及双方收益，并检验任务包价格是否满足高于单项价格、低于单项价格之和以及搭售吸引力增强的约束；最后依据新旧项目空间分布的相似性，将历史模型迁移到新项目并进行模拟评估。
  visualization:
  - 任务与会员地理散点分布图
  - 任务价格空间分布图
  - 任务密度与会员密度热力图
  - 不同价格区间任务分布图
  - 任务完成与未完成空间分布图
  - 价格—完成率折线图
  - K-means任务聚类图
  pitfalls_avoided:
  - 避免仅用固定半径邻域计算空间密度，因为会员和任务均为离散点，单一半径会使边界点和局部偶然分布造成较大误差；模型让半径在区间内变化并对密度取平均。
  - 避免只依据经济发展水平或行政区位定价，因为这会使任务密集的城市中心价格过低、吸引力不足；定价同时纳入会员密度、任务密度、距离和困难因子。
  - 避免将原始信誉值直接代入吸引力和完成概率，因为信誉差异过大会导致分配结果被极端值支配；采用保持排序的对数变换将其压缩到稳定区间。
  - 避免把任务视为彼此独立并忽略连续执行路径，因为会员可能在一次出行中完成多个邻近任务；单位长度期望收益模型按整条路径的收益效率选择任务。
  - 避免重复分配同一任务，因为按会员逐个选择时容易产生冲突；每次分配后立即从剩余任务集合中删除已选任务。
  - 避免仅以总完成率判断定价优劣，因为高完成率价格档可能掩盖部分价格档的严重失败；同时检查分价格完成率及价格—完成率曲线的稳定性。
  - 避免默认任务搭售必然提高完成率，因为任务包可能只改变收益分配而不改变会员选择；论文通过仿真发现搭售对完成率影响有限，但会影响会员盈利和平台收益。
  - 避免任意压低任务包价格，因为过低会削弱会员参与意愿、过高会损害平台收益；利用单项价格之和和吸引力增强条件共同限定搭售价格上下界。
  innovation_points:
  - 采用半径连续变化并取平均的多尺度邻域方法，同时刻画任务点的会员密度和任务密度，降低离散空间数据对局部密度估计的敏感性。
  - 将价格、信誉、距离和区域困难程度统一到类库仑吸引力因子中，使任务定价模型与会员分配机制形成可仿真的闭环。
  - 提出单位长度期望收益路径模型，用整条执行路径的报酬效率替代单任务吸引力，更贴近会员连续完成邻近任务的决策行为。
  - 将K-means空间聚类与经济学搭售思想结合，并通过吸引力约束推导任务包定价区间。
  - 建立包含分价格完成率、总完成率、会员盈利和平台收益的多目标评价与反馈机制，实现历史方案、新方案及联合发布方案的统一比较。
- id: A题 SARS的传播论文_SARS传播预测的数学模型
  source_paper: A题 SARS的传播论文 A题 SARS的传播论文_SARS传播预测的数学模型
  problem_type: 预测+统计分析+仿真
  keywords:
  - SARS传播预测
  - 房室模型
  - 时变参数
  - 控制措施评估
  - 经济影响分析
  context: 基于疫情早期公布的确诊、疑似、死亡和治愈数据，建立传染病动力学与经济预测模型，刻画SARS传播趋势并评估隔离控制措施及其经济影响。
  models:
  - name: SIR房室模型
    role: 将人群划分为易感者、感染者和移出者，描述感染、治愈与死亡引起的人群状态转移，并预测感染人数、高峰期和持续时间。
    why: 结构简单、机理清晰，能够抓住传染率、治愈率和死亡率等关键因素，适合数据有限条件下的疫情早期预测。
  - name: SEIR、SQIR、SEQIJR等扩展房室模型
    role: 引入潜伏者、隔离者、疑似患者、确诊患者和住院患者等状态，更细致地模拟SARS潜伏、诊断和隔离过程。
    why: SARS具有潜伏期、诊断延迟和隔离干预等特征，扩展分舱能够更真实地反映各类人群之间的转移关系及控制措施效果。
  - name: 离散差分递推模型
    role: 将连续时间感染者方程按天离散化，利用每日新增、治愈和死亡数据递推计算后续感染人数。
    why: 官方疫情数据以日为单位发布，差分模型与数据频率一致，参数估计和数值计算直接，便于进行滚动短期预测。
  - name: 时变参数回归模型
    role: 根据每日新增病例与现有感染者之比估计传染率，根据每日治愈和死亡人数与现有感染者之比估计移出率，并用指数曲线或分段函数拟合参数随时间的变化。
    why: 隔离力度、公众行为和医疗水平会持续变化，采用时变或分段参数比固定参数更能体现防控政策实施前后的传播差异。
  - name: 复杂网络与Monte Carlo仿真模型
    role: 将区域抽象为网络或空间网格，设置不同年龄、职业和活动范围人群的移动、接触、传播及隔离规则，模拟人口流动和异质接触下的疫情演化。
    why: 传统均匀混合假设难以描述地区差异、超级传播者、医护人员感染和人口流动，随机网络仿真可刻画传播过程的空间性与个体异质性。
  - name: 时间序列与灰色预测模型
    role: 使用ARIMA、GM(1,1)、指数平滑或趋势回归预测无SARS情形下旅游、民航等行业的正常发展水平和恢复时间。
    why: 经济指标通常具有趋势性、季节性且样本量可能有限，时间序列和灰色模型适合构造未发生疫情时的反事实基线。
  - name: 层次分析与数据拟合组合模型
    role: 综合安全、收入、费用、时间和心理恐慌等因素，估计疫情对旅游决策的影响并预测市场恢复过程。
    why: 疫情后的经济恢复不仅取决于历史趋势，还受到难以直接量化的安全感和信心变化影响，组合模型可融合主观权重与客观数据。
  solution_flow: 收集并整理每日确诊、疑似、治愈、死亡及相关经济数据→分析传播途径、潜伏期和隔离机制并绘制人群状态转移图→建立SIR或含潜伏、隔离、疑似状态的扩展房室模型，同时建立经济指标的反事实预测模型→用前期部分数据计算每日传染率、治愈率和死亡率，并通过指数回归、分段拟合或时间序列方法估计参数→采用差分递推、微分方程数值求解或Monte
    Carlo方法预测病例高峰、持续时间和经济损失→调整隔离开始时间、隔离率、遗漏率及传染率因子开展情景仿真→用后续疫情数据和其他地区数据进行样本外验证、误差分析与通用性检验。
  validation: 仅使用疫情早期的一部分数据估计参数和生成预测，将其余时期数据作为留出集，对预测病例曲线、峰值大小、峰值日期和持续时间进行样本外检验；比较预测值与实际统计值的绝对误差、相对误差及趋势一致性；进一步将同一建模与估参方法应用于北京、全国、山西、内蒙古、广东、香港或加拿大等地区进行外部验证；通过改变传染率、隔离率、控制启动时间和遗漏患者比例开展敏感性与情景分析，检验结论的稳健性；经济影响部分则比较无SARS反事实基线与实际数据，并用疫情后数据检验恢复期预测。
  visualization:
  - 疫情房室状态转移框图
  - 实际病例与预测病例时间序列对比曲线
  - 每日传染率及指数拟合曲线
  - 不同隔离强度与启动时间的情景对比图
  - 新增病例、现有病例、治愈和死亡人数趋势图
  - 无疫情经济基线与实际经济指标对比图
  - 预测误差或残差图
  pitfalls_avoided:
  - 避免使用全部疫情数据同时拟合和验证，因为这会造成数据泄漏，使所谓预测退化为事后拟合并产生误差近乎为零的虚假效果；应使用前期数据建模、后期数据检验。
  - 避免将固定指数增长模型直接用于长期预测，因为易感人群、隔离政策和治疗水平会变化，长期指数外推会高估病例并忽略疫情拐点；应采用时变参数或分阶段建模。
  - 避免只追求分舱数量和模型复杂度，因为数据不足时过多参数无法可靠辨识，容易出现过拟合；人口分类应服务于潜伏、隔离、诊断等实际机制。
  - 避免仅报告拟合曲线而不解释传染率、治愈率、死亡率和再生数的含义，因为缺乏可解释参数就无法评价防控措施，也难以迁移到其他地区。
  - 避免忽视基本再生数或有效再生数，因为疫情能否受控的核心条件是再生数降至1以下，仅观察病例下降不能清楚说明控制机制。
  - 避免只验证北京单一地区，因为局部数据拟合良好不能证明模型具有通用性；应在多个地区使用一致方法进行外部检验。
  - 避免夸大数学模型的预测精度，因为疫情初期数据存在漏报、诊断延迟和传播机理不确定性，模型更适合判断趋势和比较政策，而非给出绝对精确的点预测。
  - 避免直接把经济指标下降全部归因于SARS，因为指标本身存在趋势和季节波动；应先预测无疫情基线，再以实际值与基线的差额衡量影响。
  innovation_points:
  - 采用随时间变化或分阶段的传染率、治愈率和死亡率，将政府隔离措施加强、公众行为改变及医疗水平提升显式纳入传播模型。
  - 通过调节控制启动时间、隔离强度和遗漏患者比例开展反事实仿真，定量比较提前控制、推迟控制及不同隔离覆盖率的政策效果。
  - 将疫情动力学预测与经济反事实预测结合，不仅估计病例高峰和持续时间，还估计旅游、民航等行业的损失规模与恢复时间。
  - 利用空间网格、复杂网络和个体移动规则描述年龄差异、人口流动、医院内外传播及超级传播现象，突破均匀混合假设。
  - 采用早期训练、后期检验和跨地区迁移的验证框架，突出模型在真实疫情早期预警中的应用价值。
- id: A_cumcm0715
  source_paper: A A_cumcm0715
  problem_type: 预测+统计分析+仿真+优化
  keywords:
  - 人口发展方程
  - 年龄—性别—城乡结构
  - 总和生育率
  - 出生性别比
  - 老龄化
  - 城镇化
  context: 基于中国人口统计资料，在考虑老龄化、出生性别比升高和乡村人口城镇化的条件下，预测中短期及长期人口总量与结构，并分析政策参数的合理取值。
  models:
  - name: 离散人口发展方程（模型一）
    role: 构建按年龄分组的人口队列递推基准模型，通过出生率、死亡率和年龄转移预测人口规模及年龄结构。
    why: 离散差分方程和转移矩阵能够直接描述人口逐年存活、年龄递进与新生人口补充过程，结构清晰且便于迭代计算。
  - name: 基于性别的人口发展方程（模型二）
    role: 将男性和女性作为两个相互关联的独立人口系统，分别使用分年龄、分性别死亡率递推，并通过出生性别比分配新生儿。
    why: 模型一无法反映男女死亡率差异和出生性别比变化，性别分层后可更准确地预测男女总量、年龄结构及人口性别比例。
  - name: 基于城镇化的多区域人口修正模型（模型三）
    role: 把城市、乡镇和农村划分为三个子系统，在模型二的基础上分别预测自然增长，再依据目标城镇化率计算迁移人口并修正各区域人口。
    why: 中国人口系统并非封闭系统，农村向城市和乡镇迁移会显著改变城乡人口分布；多区域耦合模型可同时刻画出生、死亡、性别、年龄和迁移因素。
  - name: Logistic人口目标模型
    role: 从政策制定者偏好的稳定人口状态出发，描述长期人口增长的饱和特征，并估计适宜总人口范围及总和生育率参数β的大致取值。
    why: 长期人口参数受政策影响大，单纯外推历史参数可靠性不足；Logistic模型能够引入人口容量和稳定状态约束，为长期政策情景与参数优化提供目标基准。
  - name: 单因素敏感性与政策情景分析
    role: 分别改变总和生育率、死亡率、出生性别比和城镇化率，比较不同参数假设下的人口总量及结构演化。
    why: 长期预测不确定性较强，逐项改变关键参数可以识别主要驱动因素、解释模型结果，并为不同人口政策方案提供对比依据。
  solution_flow: 整理历年分城乡、分性别、分年龄人口及死亡率、生育率、出生性别比数据并剔除SARS等异常年份→建立年龄队列离散转移模型→扩展为男女双系统并进一步扩展为城市、乡镇、农村三系统→由分年龄生育率计算总和生育率β和生育模式，由死亡率构造存活率矩阵，并设定出生性别比与城镇化率函数→逐年迭代自然增长，计算农村迁出人口并按城市和乡镇现有人口比例分配→中短期采用历史稳定年份的参数均值预测，长期设置多组政策参数进行单因素与情景仿真→利用Logistic稳定状态估计合理人口区间并反推β的政策取值→通过历史数据对照、结构指标检查和敏感性分析验证结果。
  validation: 采用历史数据拟合或留出年份回代检验，将预测人口总量、男女比例、年龄结构和城镇化率与实际统计值比较；同时检查人口守恒关系、各年龄组非负性、男女新生儿之和等于总出生人口、迁出量等于城市与乡镇迁入量等内部一致性。对中短期参数使用多年数据比较并剔除2003年SARS导致的异常值，对长期结果则通过总和生育率、死亡率、出生性别比和城镇化率的单因素敏感性及多政策情景比较评估稳健性。
  visualization:
  - 人口总量年度预测折线图
  - 分年龄人口金字塔
  - 男女比例及出生性别比趋势图
  - 老年人口占比趋势图
  - 城市—乡镇—农村人口堆积面积图
  - 不同生育率政策情景对比曲线
  - 参数敏感性曲线
  pitfalls_avoided:
  - 避免只用总人口增长率进行简单外推，因为该方法忽略年龄队列递进和育龄妇女规模变化，无法正确反映老龄化及未来出生人口波动。
  - 避免假设男女死亡率完全相同或忽略出生性别比，因为这会使男女规模及长期婚育人口结构预测产生系统偏差。
  - 避免把全国人口视为单一封闭系统，因为农村向城市和乡镇的迁移会改变城乡人口规模及结构，进而影响城镇化预测。
  - 避免将异常年份直接纳入均值估计，因为SARS等突发事件会造成死亡率或生育率异常并扭曲中短期参数，论文在计算均值时剔除了2003年异常数据。
  - 避免用固定历史参数机械外推长期人口，因为长期生育率、性别比和城镇化率高度依赖政策，应使用多情景和敏感性分析表达不确定性。
  - 避免迁移修正破坏人口守恒，因为迁出农村的人口必须与城市、乡镇新增迁入人口相等，并在每次修正后重新进入下一年度迭代。
  - 避免在缺少迁移人口详细结构数据时任意重构年龄和性别分布，模型明确假设迁移不改变地区既有性别、年龄结构，并将其作为局限而非隐含事实。
  innovation_points:
  - 形成“年龄分组→性别分层→城乡多区域耦合”的递进式建模体系，使人口总量、年龄结构、性别结构和城镇化过程能够在统一框架下预测。
  - 由目标城镇化率反推农村迁出人口，再按城市和乡镇现有人口比例进行动态分配，实现人口自然增长模型与社会迁移机制的逐年耦合。
  - 区分中短期与长期预测的参数处理方式：中短期采用剔除异常值后的历史均值，长期采用政策情景和单因素敏感性分析，避免统一参数策略造成失真。
  - 从政府偏好的长期稳定状态出发引入Logistic模型及类似熵扩散的思想，估计合理人口范围，并将其与多区域人口模型结合以约束总和生育率β。
- id: A题 SARS的传播论文_SARS的传播规律研究
  source_paper: A题 SARS的传播论文 A题 SARS的传播论文_SARS的传播规律研究
  problem_type: 预测+统计分析+仿真
  keywords:
  - SARS传播预测
  - 分阶段时滞差分方程
  - 隔离措施情景仿真
  context: 基于北京、山西和内蒙古的SARS疫情数据，刻画疫情从爆发到收敛的传播规律，预测在院患者与新增病例，并评估隔离措施实施时点的影响。
  models:
  - name: 指数增长模型
    role: 作为早期模型和对照基准，用于描述疫情自然传播初期病例数随时间的近似指数增长。
    why: 疫情早期尚未采取有效干预时传播率可近似视为常数，模型形式简单，能够粗略估计高峰到达时间，但不适合描述干预后的阶段性变化。
  - name: 分阶段时滞差分方程模型
    role: 作为核心传播模型，根据潜伏期、院外传播、院内医护感染、死亡和治愈过程，递推每日新增病例数与在院患者数。
    why: 差分形式能够直接匹配政府公布的逐日离散数据，并通过4至5天潜伏时滞以及院内、院外感染率区分SARS的主要传播机制，参数具有明确实际意义。
  - name: 分段常参数模型
    role: 将疫情划分为爆发期、波动期、平稳期和收敛期，在各阶段内分别估计感染率、死亡率和治愈率。
    why: 政府干预和医疗能力提升会使传播参数发生阶梯式变化，分阶段设定参数比使用全程固定参数更符合疫情演化和政策作用机制。
  - name: 隔离措施时点平移仿真
    role: 模拟严格隔离措施提前或延后5天时，在院患者数和新增病例数的变化。
    why: 通过改变爆发期持续时间并依次平移后续阶段参数，可以在保持各阶段传播特征不变的条件下，定量评估措施实施时点的政策效果。
  solution_flow: 收集每日累计确诊、累计死亡、累计治愈及医护人员感染数据→由累计量计算在院患者数i(n)和每日新增病例数a(n)→依据4至5天潜伏期构造带时滞的差分方程，并将新增病例拆分为非医护人员a1(n)和医护人员a2(n)→计算院外感染率λ1、院内感染率λ2、日死亡率μ1和日治愈率μ2→根据参数跃变将疫情划分为爆发期、波动期、平稳期和收敛期→在各阶段采用常参数递推预测i(n)与a(n)，发现预测偏差显著时更新阶段和参数→使用北京、山西、内蒙古实际数据进行拟合检验→平移干预时点，仿真提前或延后5天隔离的影响。
  validation: 采用北京、山西和内蒙古4月下旬至5月底的实际疫情数据进行多地区拟合，将模型计算的每日新增病例数a(n)和在院患者数i(n)与真实值逐日对比；通过拟合曲线检查总体趋势、峰值和下降过程的一致性，并在预测值与实际值出现较大偏差时将其识别为阶段转折点、重新估计参数；同时使用山西数据进行滚动预测和隔离时点情景仿真，以检验模型的预测能力与政策解释能力。
  visualization:
  - 实际值与拟合值对比折线图
  - 实际曲线与滚动预测曲线对比图
  - 阶段转折点标记图
  - 提前、正常和延后隔离的情景对比表及曲线图
  pitfalls_avoided:
  - 避免用疫情后期数据反向拟合传播率后再宣称具有预测能力，因为这属于事后解释，无法为事前防控提供可靠信息。
  - 避免在前后两个传播率之间人为设置缺乏依据的固定过渡期，因为政府措施的生效时间和政策延迟并非恒定，强行平滑会造成转折阶段误差。
  - 避免直接套用香港或广东的参数预测北京，因为不同地区的隔离力度、医疗防护水平和疫情阶段不同，跨地区照搬参数会显著高估或低估最终病例数。
  - 避免使用全程固定感染率描述疫情，因为防控措施会使感染率产生阶梯式下降或短期反弹，固定参数无法同时拟合爆发期和控制期。
  - 避免忽略潜伏期和院内外传播差异，因为非医护人员感染主要由发病前后尚未隔离者造成，而医护人员感染与在院患者规模相关，混合建模会削弱参数解释性。
  - 避免把收敛期零星偶发病例完全归因于确定性模型，因为小样本随机事件超出常参数差分模型的稳定解释范围。
  innovation_points:
  - 将SARS传播拆分为院外非医护人员感染和院内医护人员感染，分别设置λ1和λ2，使模型能够单独评价社会隔离措施与医院防护措施。
  - 把4至5天潜伏期显式嵌入差分方程，以a(n-4)、a(n-5)和i(n-4)描述延迟传播效应，使模型结构与SARS病理过程相对应。
  - 利用感染率、死亡率和治愈率的变化划分爆发期、波动期、平稳期和收敛期，并以参数跃变作为滚动预测更新依据。
  - 通过平移阶段边界模拟隔离措施提前或延后5天，将传播预测模型进一步转化为可用于卫生政策评价的情景仿真工具。
- id: B题论文_c05B1lzx-李蓬蓬、朱小满、解炜，指导教师组
  source_paper: B题论文 B题论文_c05B1lzx-李蓬蓬、朱小满、解炜，指导教师组
  problem_type: 预测+优化+统计分析+仿真
  keywords:
  - DVD在线租赁
  - 需求预测
  - 0-1整数规划
  - 泊松过程
  - 多目标优化
  - 满意度评价
  context: 在线DVD租赁网站需要依据会员偏好、租赁频率和随机归还规律，联合解决DVD需求预测、采购数量确定、库存分配及会员满意度优化问题。
  models:
  - name: 偏好指数修正与相对满意度模型
    role: 将原始偏好名次转换为正向效用，并用绝对满意度与理论最大满意度之比统一评价个人及总体分配效果。
    why: 原始偏好指数越小代表越喜欢，且0表示无需求，不能直接作为最大化目标；归一化后的相对满意度便于比较不同会员和不同采购分配方案。
  - name: 通用租用次数限制模型（GM）
    role: 在每张DVD一个月最多流转两次的假设下，根据A类、B类会员比例计算各类DVD的最低储备量。
    why: 模型结构简单、参数含义清晰，能够在预知需求比例时快速给出正常、悲观和乐观三种采购估计，并作为随机模型的基准方案。
  - name: 泊松过程随机服务模型（RS）
    role: 模拟会员随机归还DVD及归还后立即再次出租的动态流转过程，以最小化满足目标服务人数所需的库存量。
    why: 实际归还时间并非固定在月中或月末，允许DVD多次周转更符合连续经营过程；泊松过程可描述单位时间内随机、独立发生的归还事件。
  - name: 0-1整数线性规划分配模型（BIP）
    role: 在DVD库存和每位会员最多获得3张碟等约束下，确定会员与DVD之间的一次性分配关系，使总体绝对满意度最大。
    why: 会员是否获得某种DVD是天然的二元决策，库存容量、个人租赁上限和需求匹配约束均可线性表达，适合使用整数规划获得可执行方案。
  - name: 双目标0-1采购—分配规划模型
    role: 联合决定每种DVD的购买数量和两轮分配方案，在保证至少95%的会员得到想看DVD及给定满意度水平的条件下最小化采购总量。
    why: 采购成本最小与会员满意度最大存在冲突，将满意度转化为约束并以采购总量最小为目标，可生成满意度—最小采购量关系曲线并选择经营折中方案。
  - name: 抽样统计需求外推模型
    role: 利用问卷样本中的DVD需求比例估计总体会员需求，并为采购和服务水平约束提供参数。
    why: 网站无法直接观察全部潜在需求，需要在样本具有代表性的前提下将调查比例外推至会员总体。
  - name: VIP加权规划与分层规划模型
    role: 分别通过设置不同会员满意度权重或赋予VIP会员优先分配层级，扩展基础采购与分配模型。
    why: 统一最大化总体满意度可能牺牲高价值会员的服务质量，加权规划适用于差异化价值评价，分层规划适用于存在严格服务优先级的业务规则。
  solution_flow: 数据→根据问卷比例估计各DVD总体需求，将会员按月租两次和一次划分为A、B两类，并把原始偏好名次修正为正向满意度→建立GM模型计算固定周转假设下的正常、悲观和乐观库存→估计泊松参数并通过RS模型模拟随机归还与重复出租，求最小储备量→建立BIP模型，以会员—DVD分配变量为0-1决策，在库存和个人租赁上限约束下用Lingo求最大满意度方案→建立采购与两轮分配的双目标0-1规划，将满意度设为约束、采购总量设为目标，逐级改变满意度阈值得到帕累托型关系曲线→引入VIP权重和优先层级进行扩展→通过模型间结果对比、会员满意度分布和不同情景结果检查方案的合理性。
  validation: 采用多层次验证：首先检查分配结果是否满足库存上限、每位会员租赁数量、同一会员不重复租同一种DVD及95%服务覆盖率等硬约束；其次比较GM与RS模型的库存结果，确认随机周转机制能够在保持目标服务量时降低采购量；再次设置正常、悲观、乐观情景考察会员类型构成变化对库存的影响；最后统计1000名会员个人相对满意度并绘制直方图，结合总体满意度、最小采购量关系曲线评价方案的效率与公平性。论文未提供独立样本或真实运营数据的外部检验，因此验证主要属于约束检验、情景分析和模型间对照。
  visualization:
  - 不同DVD采购量对比表
  - 会员个人相对满意度直方图
  - 相对满意度—最小采购总量关系曲线
  - 泊松分布及累积概率示意图
  pitfalls_avoided:
  - 避免直接最大化原始偏好名次：原数据数值越小反而越受偏爱，直接使用会导致优化方向颠倒，因此将非零名次转换为11减原值，并保留0为无需求。
  - 避免只使用绝对满意度比较不同方案：A类会员可租6张、B类会员可租3张，机会集合不同，单纯比较绝对值会产生偏差，因此用实际满意度除以理论最大满意度进行归一化。
  - 避免把DVD视为一个月只能服务一名会员：归还后可立即再次出租，忽略周转会显著高估采购量，因此分别建立固定两次周转模型和随机多次周转模型。
  - 避免把随机归还强行设定为统一日期：实际归还时间具有随机性，固定月中或月末归还仅适合作为基准假设，因此引入泊松过程描述连续经营中的随机归还。
  - 避免多目标直接相加造成量纲和权重任意：采购量与满意度单位不同，随意加权会使结果依赖主观系数，因此把满意度转化为约束并逐步改变阈值，以采购总量最小为目标。
  - 避免只追求总体满意度而忽略重点会员：总效用最大可能让VIP会员得不到优先服务，因此进一步采用加权规划和分层规划表达差异化服务规则。
  - 避免将一次发出3张DVD误解为3张都必须是新需求碟：该解释会不必要地扩大采购量，模型依据实际经营规则将至少获得1张想看的DVD视为一次有效服务，其余可由旧碟等补足。
  innovation_points:
  - 构建“偏好指数修正—绝对满意度—相对满意度”的统一评价体系，使原始排序数据能够直接进入整数规划目标，并支持个人与总体两个层面的比较。
  - 同时给出固定周转的GM模型和随机归还的RS模型，用基准模型与实际化模型的对照体现DVD库存周转对采购量的影响。
  - 将采购与分配联立为双目标0-1规划，通过满意度约束参数化生成满意度—最小采购量曲线，而非只给出单一采购方案。
  - 把一次性分配扩展为月内两轮分配，并区分月租两次和一次的会员类型，使采购方案与实际租赁频率相匹配。
  - 在基础效率模型上引入VIP加权和优先分层机制，使模型能够同时处理会员价值差异与严格服务优先权。
- id: A_cumcm0730
  source_paper: A A_cumcm0730
  problem_type: 预测+统计分析+仿真
  keywords:
  - 人口预测
  - Logistic模型
  - 多元线性回归
  - 时变Leslie矩阵
  - 老龄化与人口政策
  context: 基于中国人口总量、年龄结构、出生率、死亡率和性别比等数据，预测人口中短期与长期发展趋势，并分析老龄化、人口红利及生育政策的影响。
  models:
  - name: 线性回归模型
    role: 根据1995—2005年人口总量数据拟合人口随时间的线性变化，用于短期人口总量预测。
    why: 近年人口总量变化较平稳，线性模型结构简单、参数易由最小二乘法估计，且决定系数和显著性检验表明短期拟合效果较好。
  - name: Logistic人口增长模型
    role: 描述资源和环境容量约束下的人口增长过程，估计人口固有增长率与人口容量。
    why: 人口不可能无限增长，Logistic模型通过随人口规模下降的增长率刻画环境阻滞作用，比无约束指数增长更符合长期人口发展规律。
  - name: 时变Leslie矩阵预测模型
    role: 建立人口年龄结构的离散动力学方程，逐年推演各年龄组人口数量及人口总量，并用于长期人口结构仿真。
    why: 人口变化由年龄别生育率和存活率共同驱动，Leslie矩阵能够保留年龄结构信息；进一步令生育率随时间变化，可反映生育模式和政策环境的动态改变。
  - name: 多元线性回归模型
    role: 综合分析时间、出生率、死亡率和性别比对年底人口总数的共同影响，并进行人口总量估计。
    why: 人口总量由多个社会人口学因素共同决定，多元回归能够同时量化各因素的边际影响，并通过复相关系数、决定系数、F检验和误差指标评价模型。
  - name: 指数拟合模型
    role: 拟合各育龄年龄组生育率随时间的变化轨迹，为时变Leslie矩阵生成未来年度的年龄别生育率参数。
    why: 历史年龄别生育率存在明显时间变化，假设其在约20年后趋于稳定时，指数形式可以描述从当前水平向稳定水平逐步收敛的过程。
  solution_flow: 收集并整理人口总量、年龄别生育率、年龄别死亡率、城乡人口比例和性别比数据→对2003年生育率曲线及个别死亡率异常点进行插值修复，并按城市、镇、乡人口占比加权得到全国参数→分别建立线性模型、Logistic模型、多元线性回归模型和时变Leslie矩阵模型→采用最小二乘法、SPSS回归和指数拟合估计增长率、人口容量、回归系数、生育率及存活率→利用线性与Logistic模型进行短期总量预测，利用Leslie矩阵逐年迭代获得长期年龄结构和人口总量→通过统计检验、误差计算、人口普查数据对照和模型间比较验证结果→扩展分析老龄化、人口红利、性别比失调及二胎政策情景。
  validation: 对线性模型和Logistic模型采用最小二乘拟合，并利用决定系数、F值、P值及参数置信区间检验拟合优度和显著性；对多元回归计算复相关系数、决定系数、方差分析F检验、绝对误差和相对误差；将各模型预测结果相互比较，并使用人口普查或实际统计数据进行外部验证；同时通过灵敏度分析考察生育率、死亡率等参数变化对预测结果的影响。
  visualization:
  - 人口总量时间序列及线性拟合图
  - Logistic增长率与人口规模关系图
  - 城市、镇、乡年龄别生育率对比折线图
  - 不同年份年龄别生育率曲线图
  - 异常数据插值前后对比图
  - 不同年份年龄别死亡率曲线图
  - 预测值与实际值对比图
  - 年龄结构随时间变化的人口金字塔或堆叠面积图
  pitfalls_avoided:
  - 避免直接使用明显异常的2003年年龄别生育率数据，因为异常曲线会扭曲Leslie矩阵首行并使出生人口预测产生持续性偏差，因此依据其他年份曲线进行插值修复。
  - 避免忽略死亡率数据中的孤立异常点，因为2004年82岁组和2005年27岁组的异常值会导致对应年龄组存活率突变，因此先进行插值处理，再计算多年平均死亡率。
  - 避免将年龄别生育率长期设为固定常数，因为不同年份出生率差异明显，固定Leslie矩阵难以反映生育模式变化，因此构造随时间变化的生育率和时变Leslie矩阵。
  - 避免直接混合城市、镇和乡村的生育模式，因为三类地区的生育高峰、总和生育水平及政策执行情况存在明显差异，因此先分别处理，再按人口占比加权形成全国生育率。
  - 避免仅用人口总量模型推断长期年龄结构，因为线性和Logistic模型忽略年龄迁移、生育与死亡机制，只适合总量或短期预测，因此使用Leslie矩阵补充长期分年龄仿真。
  - 避免采用无限增长假设进行长期外推，因为资源和环境会对人口增长产生阻滞作用，因此引入人口容量并使用Logistic模型限制长期增长。
  - 避免在缺乏依据时让所有参数都随时间自由变化，因为这会显著增加估计难度和不确定性；论文根据多年死亡率曲线接近的证据，将死亡率近似视为仅随年龄变化。
  innovation_points:
  - 将年龄别生育率设置为随时间变化的参数，构造时变Leslie矩阵，相比传统固定参数Leslie模型更能反映生育模式和人口政策的动态影响。
  - 按城市、镇和乡村分别刻画生育年龄结构，再依据人口比例加权生成全国年龄别生育率，增强了参数设定的现实性。
  - 组合线性、Logistic、多元回归和Leslie模型，分别服务于短期总量预测、容量约束分析、多因素解释和长期年龄结构仿真，形成多尺度模型体系。
  - 通过调整生育率、死亡率和城乡结构等参数，将人口预测模型扩展到老龄化、人口红利、性别比失调及二胎政策等情景分析。
- id: B_cumcm0704
  source_paper: B B_cumcm0704
  problem_type: 优化+综合评价
  keywords:
  - 公交最优路径
  - 换乘次数约束
  - 多交通方式
  context: 面向奥运期间城市公共交通查询需求，在公汽、地铁及步行衔接网络中为任意起终点选择兼顾时间、费用和换乘次数的最优出行路线。
  models:
  - name: 经典Dijkstra最短路径模型
    role: 作为基础模型和对照方案，用于分析传统最短路径算法在公交网络中的适用性。
    why: Dijkstra算法能够求解非负权图的最短路径，但公交网络存在换乘、线路归属、非物理连通及多目标成本等特征，因此论文将其作为基准并指出其局限。
  - name: 基于最少换乘次数的分层公交路径模型
    role: 作为仅考虑公汽时的核心模型，依次搜索直达、换乘一次、换乘两次和换乘三次的可行路线，并在最少换乘层内优化时间、费用或二者的加权指标。
    why: 乘客调查显示换乘次数是重要决策因素，且减少换乘可降低换乘耗时、步行负担和站点人员滞留风险；分层搜索也能避免无约束遍历整个公交网络。
  - name: 最大可接受换乘次数约束下的扩展优化模型
    role: 突破严格优先选择最少换乘路线的限制，在乘客心理可接受的最大换乘次数内比较全部候选路径。
    why: 严格的换乘次数字典序优化可能过早排除换乘稍多但时间或费用显著更优的路线，引入心理容忍上限可在乘客可接受范围内获得更好的全局方案。
  - name: 公汽—地铁多模式路径模型
    role: 将地铁纳入公交路径选择，组合地铁内最短路径与地铁前后的公汽接驳路径。
    why: 地铁通常具有较高运行速度，可显著缩短长距离出行时间；通过限制公汽与地铁换乘次数、要求尽早进入和尽晚离开地铁，可控制组合搜索复杂度。
  - name: 考虑步行衔接的多模式路径模型
    role: 将最大可接受步行距离内的站点连接加入网络，扩展可直达关系和换乘方式。
    why: 空间上不共站的线路可能通过短距离步行实现有效衔接，加入步行边能够扩大候选线路集合并可能减少车辆换乘次数。
  solution_flow: 整理公交线路、站点顺序、票价、平均行驶时间、换乘时间及地铁和步行衔接数据→构造站点—线路关系并计算任意两站间的最优直达路径Between[i][j]→设定最大换乘次数3次、各类换乘时间、时间与费用权重以及最大可接受步行距离等参数→按照换乘层数枚举中转站并分别求解最短时间、最低费用和时间—费用加权最优路线→进一步加入换乘心理容忍上限、地铁路径和步行连接进行扩展求解→通过给定六组起终点的路线结果及不同模型、不同目标之间的对比检验模型效果。
  validation: 对六组指定起终点分别计算最短时间、最低费用和时间—费用加权三类结果，比较总时间、总费用、换乘次数及具体路线；再从换乘次数是否通常不超过2次、票价是否处于2至3元的可接受范围等现实合理性角度进行检验，并比较扩展模型与最少换乘模型的结果，验证放宽可接受换乘次数、加入地铁和步行衔接后是否获得更优路线。
  visualization:
  - 公交乘客出行因素选择比例柱状图
  - 不同优化目标下路线、时间、费用与换乘次数对比表
  pitfalls_avoided:
  - 避免直接把公交网络等同于普通道路网并机械使用Dijkstra算法，因为公交线路的空间交叉不一定设站连通、同名站点还可能对应不同线路状态，单纯站点邻接关系会产生不可实际乘坐的路径。
  - 避免采用规模为N×N的稠密邻接矩阵并无约束遍历全网，因为大型公交网络中矩阵含大量零值或无穷值，内存占用和矩阵运算时间过高；论文通过直达关系和有限换乘层搜索压缩候选空间。
  - 避免把物理距离最短误认为公交出行最优，因为乘客实际效用还取决于行驶时间、换乘耗时、票价变化和换乘负担，距离最短路线未必具有最短时间或最低费用。
  - 避免严格采用最少换乘次数后立即停止而遗漏更优路径，因为多换乘一次的路线可能在时间或费用上具有明显优势；扩展模型在心理可接受的最大换乘次数内统一比较候选路线。
  - 避免地铁与公汽任意组合导致组合爆炸和不符合乘客习惯的绕行，因为模型限制公汽与地铁换乘不超过2次，并假设地铁内走最短路径、尽早进入且尽晚离开。
  - 避免仅把同站换乘视为可行连接而漏掉邻近站点间的现实衔接，因为部分线路虽不共站却可通过短距离步行连接；模型在最大可承受步行距离内补充步行边。
  innovation_points:
  - 将换乘次数置于公交路径选择的核心位置，采用按换乘层数逐级搜索的算法，并在同一换乘层内分别优化时间、费用或加权综合成本。
  - 提出乘客心理可接受的最大换乘次数，用有限容忍区间替代绝对的最少换乘优先规则，兼顾人性化需求和全局优化能力。
  - 通过对公汽、地铁和步行三类连接设置差异化换乘时间与行为约束，构建可扩展的多模式公共交通路径选择框架。
  - 引入最大可接受步行距离，将邻近但不共站的站点纳入可达关系，从而扩大路线选择范围并减少不必要的车辆换乘。
- id: B_cumcm0731
  source_paper: B B_cumcm0731
  problem_type: 优化+综合评价
  keywords:
  - 公交最佳线路选择
  - 换乘次数
  - 广度优先搜索
  - 线路邻接矩阵
  - 模糊综合评价
  context: 在包含公汽、地铁及步行方式的城市公共交通网络中，为任意起止站点搜索满足时间最少、费用最少或综合效用最高的出行线路。
  models:
  - name: 公交网络四元组模型
    role: 利用站点集合、线路及售票方式集合、线路—站点关系和站点—线路关系对公交网络进行结构化描述，并扩展容纳地铁与步行方式。
    why: 四元组既保留线路站点的有序关系和环线信息，又支持由站点查线路及由线路查站点，便于换乘判断、费用计算和路径搜索。
  - name: 基于Dijkstra算法的换乘次数边界模型
    role: 通过站点相邻矩阵求最少途经站数路径及其换乘数上界，并通过同线可达矩阵求最小换乘次数下界。
    why: 预先限定换乘次数的搜索区间，可以避免在大规模公交网络中无界枚举路径，显著压缩可行解空间。
  - name: 换乘心理接受度模糊隶属函数模型
    role: 采用降半柯西型隶属函数量化乘客对不同换乘次数的接受程度，并以阈值进一步截断不现实的换乘方案。
    why: 乘客对换乘次数的厌恶具有非线性和模糊性，单纯设置固定换乘上限难以反映最小换乘次数及心理落差的差异。
  - name: 时间最小化路径优化模型
    role: 以行车时间、停站时间、换乘时间和步行时间之和最小为目标选择最佳线路。
    why: 适用于上班族等时间敏感乘客，并能统一比较公汽、地铁和步行组合方案。
  - name: 费用最小化路径优化模型
    role: 根据单一票价、分段计价和地铁票价规则计算各段费用，以总票价最低为目标寻优。
    why: 不同线路采用不同计价制度，只用站数或乘坐线路数无法准确代表实际出行成本。
  - name: 时间—费用—换乘综合评价模型
    role: 将票价按照收入和工作时间折算为等效时间，再结合时间费用偏好权重与换乘心理接受度，最大化线路综合评价值。
    why: 单一时间或费用准则不能覆盖乘客异质化需求，综合函数可通过权重参数表达不同人群对时间、费用和换乘的偏好。
  - name: 广度优先搜索与线路邻接矩阵路径搜索模型
    role: 在规定的换乘次数范围内生成起点至终点的可行线路集合，再依据不同目标函数筛选最优路径。
    why: 广度优先搜索适合按换乘层数逐层扩展，线路邻接矩阵则可减少重复站点遍历，提高大规模公交网络中的搜索效率。
  - name: 多交通方式统一网络模型
    role: 将地铁线路直接并入公交四元组，并把站点间步行抽象为仅连接两个站点的短程虚拟公交线路。
    why: 这种等价转换无需为公汽、地铁和步行分别设计算法，能够复用统一的路径生成、计时、计费与评价框架。
  solution_flow: 整理公交、地铁线路顺序、站点归属、售票方式、运行时间、换乘时间及步行时间数据→构建公交网络四元组和站点/线路邻接矩阵→用Dijkstra算法计算换乘次数上下界→利用模糊隶属函数及接受度阈值缩小换乘范围→通过广度优先搜索或线路邻接矩阵算法枚举范围内的可行路径→分别计算总时间、总费用和综合评价值→按时间最少、费用最少及综合评价最高三个准则输出最优线路→通过算例、参数灵敏度与实际合理性进行验证。
  validation: 对给定的多组起止站点分别计算最小换乘次数、理论上界和心理接受范围，并比较不同准则下的最优线路；检查搜索结果是否满足线路连续、换乘站合法、计价规则正确及换乘次数位于允许区间；改变模糊接受阈值、时间费用权重、收入参数和运行或换乘时间进行灵敏度分析，同时利用多数可接受方案不超过3次换乘这一现实经验检验结果合理性。
  visualization:
  - 公交线路—站点网络拓扑图
  - 不同换乘次数的心理接受度曲线
  - 不同准则下最优线路对比表
  - 权重与接受阈值灵敏度曲线
  pitfalls_avoided:
  - 避免直接枚举公交网络中的全部路径；大型网络存在组合爆炸，先计算换乘次数上下界并用心理阈值截断可显著减少搜索规模。
  - 避免只按途经站数判断最优线路；站数少的路径可能换乘频繁或换乘耗时较大，因此将行车、停站、换乘和步行时间统一计入总时间。
  - 避免把所有公交线路按统一票价处理；论文区分单一票价、分段计价和地铁固定票价，否则费用最优结果会发生系统性偏差。
  - 避免仅设置一个固定的“最佳线路”标准；不同乘客对时间和费用的偏好不同，因此同时提供时间、费用和可调权重的综合评价准则。
  - 避免对换乘厌恶进行简单线性惩罚；实际心理接受度随换乘次数呈非线性下降，采用模糊隶属函数能刻画首次增加换乘时较强的心理落差。
  - 避免为公汽、地铁和步行分别建立互不兼容的模型；将地铁并入网络、将步行虚拟成短程线路，可保持路径搜索与评价逻辑的一致性。
  innovation_points:
  - 同时利用最少换乘下界、最短站数路径对应的换乘上界和模糊心理阈值，对换乘次数进行三阶段压缩。
  - 将票价依据平均收入和工作时间折算为等效时间，使时间与费用能够在同一综合评价函数中比较。
  - 把换乘心理接受度直接乘入线路效用，实现时间、费用与换乘体验的统一量化。
  - 通过调整综合评价权重，使同一模型能够覆盖时间优先、费用优先及折中偏好，并在极限情况下退化为单目标准则。
  - 将步行抽象为连接两个站点的虚拟短程公交工具，实现公汽、地铁与步行多方式路径选择模型的统一。
- id: 2017_D002
  source_paper: 2017 2017_D002
  problem_type: 优化
  keywords:
  - 多目标规划
  - 最短路径
  - 图论
  - 巡检路径规划
  - 排班优化
  - 工作量均衡
  context: 针对具有26个巡检点、不同巡检周期与服务耗时的化工厂，在固定或错时三班制以及休息、进餐约束下优化巡检人数、路线和时间表。
  models:
  - name: 加权图最短路径模型
    role: 将巡检点及其连通关系表示为加权图，计算调度中心到各巡检点以及巡检点之间的最短行走路径。
    why: 巡检效率直接受路网连通性和行走时间影响，最短路径可为后续路线组合提供基础距离矩阵并减少无效行走。
  - name: 多目标巡检路径规划模型
    role: 以巡检人员数量最少和人员工作量尽可能均衡为目标，在巡检覆盖、周期不超过35分钟、三班制及班次时长约8小时等约束下确定路线。
    why: 问题同时包含人力成本和公平性目标，且受到周期、覆盖和班次等多类约束，适合采用多目标优化框架统一描述。
  - name: 基于图论的分区循环巡检模型
    role: 将巡检点划分为若干组，为每组构造从首个巡检点出发并返回的循环路线，使一个周期内覆盖尽可能多的巡检点。
    why: 分区后每名工人的责任范围清晰，容易保证35分钟周期约束，也便于形成固定班次下可重复执行的巡检时间表。
  - name: 工作量均衡度模型
    role: 利用各路线行走时间的极差相对最大值衡量路线间工作量差异，并据此设计路线与班次轮换制度。
    why: 仅最小化人数可能造成不同路线劳动强度差异较大，均衡度指标能够量化公平性，并通过轮换实现周或月尺度上的均衡。
  - name: 休息与进餐约束排班模型
    role: 在基础巡检模型中加入每约2小时休息5至10分钟、12时和18时进餐30分钟等约束，通过压缩低频巡检次数、路线分段和增派轮换人员维持连续巡检。
    why: 休息和进餐会造成服务中断，必须显式处理人员暂时不可用的问题，才能保证实际排班可执行且所有巡检点不超期。
  - name: 错时上班优化模型
    role: 调整不同巡检人员或班次的上下班时刻，使巡检任务在班次交接处连续衔接，减少固定上班造成的等待、赶路和冗余配置。
    why: 固定班次可能导致人员无法在指定时刻到达指定巡检点，而错峰交接可提高路线连续性并减少人力浪费。
  solution_flow: 数据：读取26个巡检点的巡检周期、巡检耗时、连通关系和边行走时间，构建加权网络；模型：先求调度中心到各点的最短路径，再分别建立分区循环巡检、多目标人员配置、工作量均衡及含休息进餐的排班模型；参数：设置最小巡检周期35分钟、每班约8小时、每日三班、每约2小时休息5至10分钟及12时和18时进餐30分钟；求解：使用Lingo与Excel并结合图论法筛选单周期不超过35分钟且覆盖点数尽可能多的路线，递推生成到达和离开时刻，比较分区、不分区以及固定、错时上班方案；验证：检查全部巡检点覆盖、巡检周期、班次衔接、休息进餐和时间可达性，并利用均衡度及人员数量评价方案。
  validation: 通过逐点执行“到达时间＝前一点离开时间＋行走时间、离开时间＝到达时间＋巡检耗时”的时间递推生成完整时间表，核验每条循环路线总耗时不超过35分钟、每班可执行13或14个周期且26个巡检点均被覆盖；计算路线行走时间均衡度，发现固定分区方案均衡度约为0.375且高于0.15，因此采用三班、五线轮换改善长期公平性；同时对分区与不分区、固定上班与错时上班方案进行对比，并将虽能减少回程时间但无法满足固定班次到点时刻和班次循环要求的不分区方案判为不可行。
  visualization:
  - 巡检点加权连通网络图
  - 分区循环巡检路线图
  - 不分区巡检路线对比图
  - 各巡检点到达与离开时间表
  - 路线行走时间与巡检耗时对比表
  - 班次轮换排班表
  pitfalls_avoided:
  - 区分“路过巡检点”和“实际巡检点”，对已由其他路线负责的交叉节点只计行走时间而不重复计巡检耗时，避免重复服务导致路线周期被高估或任务分工混乱。
  - 没有仅依据总行走时间判断路线可行性，而是将行走时间与各点巡检耗时共同计入单周期总耗时并限制在35分钟以内，避免路线看似最短却造成巡检超期。
  - 考虑35分钟不能整除8小时，按班次实际安排13或14个循环周期，而非强行假设整周期覆盖，避免班末时间表与实际工时不一致。
  - 对减少回程时间的不分区方案进行了班次交接和指定时刻到达检验；该方案在固定上班条件下无法形成连续班次循环，因此被舍弃，避免只优化路程却忽略时序可执行性。
  - 面对休息和进餐造成的人员不可用，没有简单暂停全部巡检，而是利用低频巡检点的时间冗余、路线分段及增派人员轮换，避免关键巡检点在休息或进餐期间超过规定周期。
  - 没有因单班路线工作量差异较大而直接认定方案公平，而是计算均衡度并采用跨班次、跨路线轮换，使公平性在一周或一月尺度上实现。
  innovation_points:
  - 将巡检网络的空间最短路径、35分钟周期覆盖和三班排班时序联合建模，并允许节点在不同路线中仅作为通行节点，从而兼顾网络可达性与巡检职责划分。
  - 同时比较分区与不分区、固定与错时上班四类机制，不仅以人数和路程评价方案，还通过班次衔接可行性筛除理论节省但实际不可执行的方案。
  - 以路线行走时间构造相对极差均衡度，并通过路线、班次轮换将单日不均衡转化为周或月尺度上的人员工作量均衡。
  - 将休息和进餐视为时间资源缺口，结合低频巡检任务的周期冗余、路线分段和轮换增员进行补偿，实现安全约束与人力成本之间的协调。
- id: B题_cumcm0860
  source_paper: B题 B题_cumcm0860
  problem_type: 综合评价+优化+统计分析+预测
  keywords:
  - 满意度曲线拟合
  - Cobb-Douglas生产函数
  - Mincer收益率
  context: 在高校教育经费需求与家庭学费承受能力相互制约的背景下，综合教学质量、教育投入和家庭负担确定合理学费及其调整区间。
  models:
  - name: 满意度曲线拟合与加权优化模型
    role: 分别构造家庭学费满意度和教学质量满意度函数，并通过乘幂加权形成综合满意度，以其最大值对应的学费作为总体最优收费标准。
    why: 家庭满意度随学费上升而下降，教学质量满意度随投入增加呈边际效益递减，两者方向相反且均具有非线性特征；指数函数和Logistic曲线能够刻画阈值、饱和及快速变化区间，乘幂加权还能避免某一方面极差却被线性补偿的问题。
  - name: 改进Cobb-Douglas教育投入—产出模型
    role: 将资金、师资和教学效率等投入映射为教育产出或学校教学质量，利用全国数据估计参数，再计算不同类型高校的教学质量并反推合理学费。
    why: 高等教育与工业生产均具有多要素投入和产出关系，Cobb-Douglas函数可以表达资本、劳动及其结构比例对产出的弹性影响；取对数后可转化为多元线性回归，便于使用统计数据估计参数。
  - name: 家庭支付能力—高校成本约束定价模型
    role: 从家庭年度结余计算学费上限，从高校生均培养成本与非学费收入缺口计算学费下限，形成合理收费区间，并结合历年数据分析未来学费走势。
    why: 单一最优点难以完整反映社会承受能力和学校办学成本的双重约束，采用上下界模型可以给出更稳健、可执行的定价范围，也便于根据收入和教育成本变化进行动态调整。
  solution_flow: 收集人口、城乡收入与消费、高校生均教育经费、财政投入、学费收入、教职工结构和毕业生工资等数据→将贫困与非贫困家庭分别拟合为指数型满意度曲线，将教学质量拟合为Logistic曲线并构造乘幂加权综合满意度→对综合满意度求极大值得到总体参考学费→以Mincer收益率和学费投入构造教学效率，将改进Cobb-Douglas函数对数线性化→使用全国历年数据进行最小二乘回归并估计投入弹性参数→代入重点本科、普通本科和专科院校数据计算教学质量，再利用质量—学费曲线反推分类学费→计算家庭结余上限和高校生均资金缺口下限，形成合理收费区间并分析变化趋势→通过回归统计量、权重灵敏度和不同模型结果对照检验结论。
  validation: 首先使用决定系数、F统计量和显著性水平检验Cobb-Douglas回归的整体拟合效果，文中得到R²为0.995、F为473.35；其次改变综合满意度中家庭负担权重p，开展灵敏度分析，检验最优学费是否对主观权重过度敏感；再次将模型应用于重点本科、普通本科和专科三类高校，比较其现行学费、估计教学质量和反推合理学费；最后利用满意度最优点与家庭支付能力—高校成本合理区间进行交叉核验。
  visualization:
  - 贫困家庭与非贫困家庭的学费满意度拟合曲线
  - Logistic教学质量—学费关系曲线
  - 综合满意度—学费曲线及最优点标注图
  - 城乡及全国家庭年度结余趋势图
  - 不同类型高校现行学费与模型建议学费对比柱状图
  - 教育投入—产出回归拟合与残差诊断图
  pitfalls_avoided:
  - 避免仅以学校成本决定学费，因为这会忽略城乡家庭尤其是贫困家庭的支付能力，并可能得到社会不可接受的收费标准；模型将贫困生和非贫困生分组并纳入助学贷款、学费减免因素。
  - 避免采用简单线性加权导致指标完全补偿，因为家庭完全无法承受或教学质量极差时，另一项再高也不应使总体评价仍然较高；因此使用S=S1^p×S2^q的乘幂加权形式。
  - 避免假设教学质量会随学费无限线性增长，因为教育投入具有边际效益递减且教学质量存在上限；因此采用有界的Logistic函数描述快速增长与后期饱和。
  - 避免把学费作为教学质量的唯一真实决定因素，因为财政投入、师资数量、专职教师比例和学校效率同样重要；因此进一步建立多投入要素的Cobb-Douglas模型。
  - 避免直接对非线性生产函数进行不稳定参数估计，因为多个指数参数难以直接求解；模型通过取对数将其转化为多元线性回归，再用最小二乘法估计。
  - 避免将全国平均学费结论机械套用于所有高校，因为重点本科、普通本科、专科以及不同专业的投入结构和教学质量存在明显差异；模型使用具体学校数据反推分类收费标准，并在扩展中区分专业类型。
  innovation_points:
  - 将家庭负担满意度与教学质量满意度统一到0至1的尺度，并用乘幂加权构造不可完全补偿的综合满意度目标，实现社会承受能力与教育质量之间的平衡优化。
  - 把Cobb-Douglas生产函数从工业投入—产出系统迁移到高等教育系统，并重新定义资本、劳动、投入结构和产出变量。
  - 参考Mincer收益率，将毕业工资增益与学费投入结合定义教学效率，使教育收益和教育成本同时进入生产函数。
  - 采用总体最优点、具体高校质量反推学费、家庭支付上限与学校成本下限三种视角相互补充，使最终建议同时具备评价、优化和约束定价含义。
  - 对综合满意度权重进行灵敏度分析，并进一步按学校层次和人文、理工、艺术等专业类别扩展收费建议，提高模型的稳健性与可操作性。
- id: B_cumcm0708
  source_paper: B B_cumcm0708
  problem_type: 优化+综合评价
  keywords:
  - 公交地铁线路选择
  - 双向生成树算法
  - 多目标路径优化
  context: 基于公交、地铁线路及票价、乘车时间、换乘时间和步行时间等数据，为任意起终站设计满足不同乘客偏好的最优公共交通路线。
  models:
  - name: 字典序多目标优化模型
    role: 以换乘次数、出行时间和出行费用构成分层目标，从可行路线中筛选最优方案。
    why: 公交乘客通常优先减少换乘，再考虑时间和费用，字典序能够体现目标之间明确的优先级，避免简单加权导致首要目标被补偿。
  - name: 尽量不换乘的贪婪算法
    role: 依次搜索直达、一次换乘、二次换乘及更高换乘次数的路线，作为最小换乘问题的基础求解方法。
    why: 算法符合乘客先寻找直达线路、再逐步增加换乘次数的实际决策习惯，且实现简单，便于与其他算法比较。
  - name: 单向生成树算法
    role: 以起始站为根节点进行广度优先扩展，用树层数表示乘车段数或换乘层级，搜索最少换乘路线。
    why: 广度优先逐层搜索可保证首次到达终点时具有最小换乘层级，并能利用父节点和线路信息恢复完整乘车路径。
  - name: 双向生成树算法
    role: 分别从起点和终点构造生成树，并在两侧搜索前沿的交集中连接路线，作为论文的主要路径搜索算法。
    why: 单向搜索随换乘层数增加会产生大量无法通向终点的无效节点，双向扩展可显著减小树深、搜索域、存储量和运行时间。
  - name: Floyd全源路径算法
    role: 计算任意两个站点之间的可达关系或最少换乘距离，并通过路由矩阵记录路径，作为全局算法和对照方法。
    why: Floyd算法能够一次性获得全体站点两两之间的最优关系，适合频繁查询，但其时间复杂度为O(n^3)，更适合作为算法比较基准或中小规模网络的预处理方法。
  - name: 布尔邻接矩阵可达性模型
    role: 用邻接矩阵表示站点间是否存在直达线路，通过布尔矩阵运算判断经过若干次换乘后的可达性。
    why: 将公交线路换乘关系转化为标准图论结构，便于系统判断直达、一次换乘及多次换乘关系，并为Floyd算法提供输入。
  - name: 分目标最优路径模型
    role: 分别以乘车时间最短、乘车费用最少和换乘次数最少为目标，为公交与地铁混合出行生成不同最优方案。
    why: 引入地铁后，时间、费用和换乘次数之间可能明显冲突，单一评价标准无法覆盖不同类型乘客的出行偏好。
  - name: 综合评价模型
    role: 对时间、费用和换乘次数等指标进行综合评估，为需求偏好不明确的用户推荐折中路线。
    why: 不同单目标模型可能得到差异很大的路线，综合评价能够在多个相互冲突的指标之间形成统一的决策依据。
  - name: 步行阈值扩展模型
    role: 设置邻近站点步行时间上界，将满足阈值的站点间步行连接加入搜索网络，求解公交、地铁和步行组合路线。
    why: 现实中乘客可能通过短距离步行替代频繁换乘，阈值既能扩展合理的换乘范围，又可避免把距离过远的站点错误地视为可步行连接。
  - name: 蚁群算法扩展模型
    role: 利用历史乘客路径选择形成的信息素统计，对实际路线偏好进行学习并搜索推荐路径。
    why: 仅依据理论时间、费用和换乘次数可能忽略拥挤度、舒适性等隐含因素，历史选择数据可间接反映乘客的综合实际偏好。
  solution_flow: 数据：整理公交与地铁线路的站点顺序、站点所属线路、票价、区间运行时间、换乘时间及站点间步行时间；模型：将交通系统表示为站点—线路网络和邻接矩阵，以换乘次数、时间、费用及综合效用为优化目标；参数：确定直达关系、区间权重、换乘成本、换乘次数上界和可步行时间阈值；求解：先搜索直达方案，再采用双向生成树从起终点同步扩展并在前沿交汇处恢复候选路径，同时用贪婪算法和Floyd算法进行对照，最后按字典序、单目标或综合评价规则排序；验证：检查路线连续性与可达性，比较不同算法的输出、运行时间、空间占用及目标值，并对步行阈值和用户偏好变化进行合理性分析。
  validation: 采用多层次验证：首先依据线路—站点关系表逐段核验候选路线是否可直达、换乘站是否同时属于相邻线路以及终点是否可达；其次比较贪婪算法、双向生成树算法与Floyd算法得到的最少换乘结果是否一致；再次计算各候选方案的换乘次数、总时间和总费用，验证字典序或单目标排序是否正确；最后比较算法的时间复杂度和空间复杂度，确认双向生成树在大规模站点网络中比单向生成树和O(n^3)的Floyd算法更适合单次或少量路线查询。
  visualization:
  - 公交地铁站点—线路网络图
  - 单向与双向生成树搜索示意图
  - 候选路线时间—费用—换乘次数对比表
  - 不同算法时间与空间复杂度对比图
  pitfalls_avoided:
  - 避免把公交线路选择简单等同于按物理距离求最短路，因为乘客更关心换乘次数、总时间和费用，最短距离路线不一定具有最佳出行体验。
  - 避免直接将时间、费用和换乘次数无差别加权，因为指标量纲不同且公交场景存在明确优先级；采用字典序或分别建立单目标模型可防止次要指标补偿换乘次数等首要目标。
  - 避免使用单向生成树无限扩展，因为分支数会随换乘层数迅速增长，并产生大量只能由起点到达却不能通往终点的无效站点；双向搜索通过前沿求交缩小搜索空间。
  - 避免对每一次起终点查询都使用Floyd算法，因为其O(n^3)计算量和O(n^2)存储量在大型公交网络中成本较高；单次查询优先采用双向生成树，Floyd更适合全源预处理或算法校验。
  - 避免在扩展树中重复加入已经访问过的站点，因为重复节点会造成环路、冗余路径和搜索规模膨胀；扩展时应维护已访问集合并记录父节点用于路径恢复。
  - 避免将所有站点都视为可步行换乘，因为这会产生不符合现实的长距离步行方案并显著扩大搜索域；仅对步行时间不超过设定上界的邻近站点增加步行边。
  - 避免只统计车内运行时间，因为实际出行时间还包括换乘步行和等候时间；遗漏这些成本会系统性偏向频繁换乘路线。
  - 避免在未限制换乘次数时持续搜索不可达终点，因为可能导致计算时间失控；设置换乘次数上界，并在双向前沿无新节点或确认不可达时终止。
  innovation_points:
  - 将树的层数与换乘层级对应，并把传统从起点单向生长的生成树改进为起点、终点同步生长的双向生成树，通过搜索前沿求交降低时间和空间复杂度。
  - 针对公交、地铁和步行的不同出行特征，分别构建最少换乘、最短时间、最低费用和综合评价模型，使推荐结果能够适配不同乘客偏好。
  - 通过设置邻近站点步行时间上界，将步行边有条件地加入交通网络，使模型能够搜索公交—地铁—步行组合路线，并用短距离步行替代不合理的频繁换乘。
  - 同时使用贪婪算法、双向生成树和Floyd算法求解或校验最少换乘问题，从结果一致性及时间、空间复杂度两个层面对算法进行比较。
  - 提出利用蚁群算法和历史乘客选择信息补充显式成本指标，使路线推荐能够进一步反映拥挤度、舒适性和习惯等难以直接量化的隐含偏好。
- id: 2017_C047
  source_paper: 2017 2017_C047
  problem_type: 预测+综合评价+统计分析
  keywords:
  - 数码照片比色法
  - 颜色模型
  - 回归分析
  context: 利用试纸数码照片的RGB、灰度及HSV颜色读数建立物质浓度辨识模型，并评价实验数据质量及分析数据量和颜色维度的影响。
  models:
  - name: 灰度颜色模型
    role: 将RGB三通道按L=0.299R+0.587G+0.114B降维为单一灰度特征，为组胺、溴酸钾和工业碱的浓度回归提供输入变量。
    why: 这些物质的部分RGB通道随浓度呈明显递减趋势，灰度值能够综合三通道信息并降低模型复杂度。
  - name: 一元线性回归模型
    role: 建立灰度值或单一颜色通道与物质浓度之间的线性预测关系，用于组胺、溴酸钾、工业碱和奶中尿素等数据。
    why: 散点图显示相关颜色指标与浓度近似线性变化，且模型参数易估计、结果易解释，可通过R²、F检验、p值和系数置信区间判断有效性。
  - name: 二次多项式回归模型
    role: 改进溴酸钾颜色读数与浓度之间的拟合关系。
    why: 溴酸钾数据存在一定非线性，二次项加入后R²和F统计量提高，可比线性模型更好地描述弯曲变化趋势。
  - name: Michaelis-Menten非线性回归模型
    role: 刻画硫酸铝钾的饱和度S、二氧化硫的色调H与浓度之间先快速增长、后趋于稳定的关系，并通过反函数实现浓度预测。
    why: 相关散点呈典型饱和增长特征，Michaelis-Menten函数能够体现有限渐近上界，较线性模型更符合数据变化规律。
  - name: 多元线性回归模型
    role: 研究灰度、RGB、H和S等不同颜色特征组合对工业碱浓度预测效果的影响。
    why: 可定量比较增加颜色维度后的解释能力，判断多通道信息是提供有效补充还是引入冗余与共线性。
  - name: 加权标准偏差数据优劣度模型
    role: 综合重复测量的离散程度、颜色指标权重和样本数量，对不同物质的数据质量进行排序。
    why: 缺少浓度真实值时无法直接计算测量偏差，因此以重复测量精密度和数据量作为代理指标，构造可比较的综合评价量。
  solution_flow: 数据→绘制RGB、H、S与浓度的散点图并按L=0.299R+0.587G+0.114B计算灰度值→依据线性、非线性及饱和趋势选择单通道或组合特征→采用最小二乘或非线性回归估计参数→对Michaelis-Menten关系求反函数得到由颜色读数预测浓度的方程→利用R²、F检验、p值、参数置信区间和剩余标准差筛选模型→通过残差识别异常点并重新拟合→删除部分样本及改变颜色维度进行敏感性比较→以样本量和加权标准偏差构造数据优劣度并完成排序。
  validation: 先用R²衡量拟合程度，以F检验和p值检验模型整体显著性，并检查回归系数置信区间是否包含零；非线性模型比较剩余标准差、预测区间及原始点与拟合曲线的一致性；绘制预测残差图识别异常点，删除浓度为0和100的异常观测后重新估计参数，对比剩余标准差由9.1231降至2.9233及预测区间收窄情况；计算相对预测误差并确认其基本控制在10%以内；通过删减溴酸钾重复样本和改变工业碱颜色特征维度开展敏感性分析。
  visualization:
  - RGB各通道与浓度散点图
  - H值和S值与浓度散点图
  - 非线性拟合曲线与原始数据对比图
  - 预测区间图
  - 残差图
  - 数据优劣度排序表
  pitfalls_avoided:
  - 避免对所有物质机械使用同一种颜色模型：不同显色反应在RGB、灰度和HSV空间中的规律不同，统一使用灰度或RGB会导致硫酸铝钾、二氧化硫等饱和型数据拟合失效。
  - 避免仅凭R²判断模型有效性：同时使用F检验、p值、参数置信区间和剩余标准差，防止高拟合度但参数不显著或模型整体不成立。
  - 避免忽略异常点对小样本回归的强影响：利用残差图和预测区间定位工业碱及二氧化硫异常观测，重新拟合并比较误差指标，而不是直接接受受异常值扭曲的参数。
  - 避免在样本覆盖范围之外随意外推：工业碱样本少且浓度主要集中在7至12，因此明确将预测方程的适用范围限制在该区间附近。
  - 避免认为颜色维度越高模型必然越好：灰度、H、S组合后拟合反而下降，说明冗余变量和共线性可能增加估计不稳定性，必须通过实际指标比较后选取特征。
  - 避免把样本数量等同于数据质量：数据评价同时考虑重复测量离散程度、样本量和浓度间隔，防止大量但分布不均或精密度差的数据获得过高评价。
  - 避免直接反演接近饱和上限的颜色读数：Michaelis-Menten反函数的分母在H或S接近渐近值时趋近于零，会放大浓度预测误差，因此模型应在实验颜色范围内使用。
  innovation_points:
  - 建立由散点趋势驱动的颜色空间与回归函数自适应选择流程，在RGB、灰度、H、S以及线性、二次和饱和模型之间进行分层筛选。
  - 对Michaelis-Menten显色响应模型求反函数，将通常用于描述饱和过程的正向模型转化为可直接输入颜色读数、输出物质浓度的辨识公式。
  - 在缺少真实浓度误差信息的条件下，以颜色特征权重、重复测量标准偏差和样本数量构造数据优劣度，实现多组实验数据的综合排序。
  - 通过删减样本和增减颜色特征进行敏感性实验，分别揭示样本容量、数据分布及颜色维度对模型稳定性和拟合效果的影响。
- id: 2015_B013
  source_paper: 2015 2015_B013
  problem_type: 综合评价+统计分析+仿真+优化
  keywords:
  - 出租车供求匹配
  - 补贴缓解率
  - 分区域动态实时补贴
  context: 在移动互联网实现乘客与出租车司机信息互通的背景下，评价出租车资源的时空供求匹配程度、分析现有补贴效果并优化新平台的补贴方案。
  models:
  - name: 供求匹配综合评价模型
    role: 利用里程利用率和供求比率评价不同时间、不同区域的出租车供求匹配程度。
    why: 里程利用率能够反映车辆载客效率和空驶状况，供求比率能够反映车辆数量与订单需求的关系，二者结合可同时刻画运营效率与数量平衡。
  - name: 理想里程利用率模型
    role: 分别从出租车供给能力和居民出行需求出发计算供求平衡时的里程利用率基准值。
    why: 直接使用经验阈值缺乏地区适应性，通过令供给载客里程等于需求载客里程，可由人口、出行频率、车辆数和运营时间等参数得到具有实际含义的平衡点。
  - name: 修正供求比率模型
    role: 将区域划分为供大于求、供求相等和供小于求三类，并构造不因正反偏差相互抵消的数量不平衡指标。
    why: 普通总供求比率会使供过于求和供不应求区域的偏差相互抵消，无法反映局部失衡，因此对供小于求部分采用倒数形式统一偏离方向。
  - name: 归一化欧氏距离评价模型
    role: 将实际里程利用率和供求比率映射到二维指标空间，以实际点到理想平衡点的距离定义综合不平衡度。
    why: 两个指标的量纲和基准不同，先按理想值归一化再计算距离，可以形成统一、直观且可比较的综合评价量。
  - name: 补贴—软件使用率指数模型
    role: 描述乘客和司机的软件使用比例随补贴金额增加而上升并逐渐趋于饱和的关系。
    why: 指数饱和函数满足零补贴时使用比例较低、补贴增加时使用比例上升以及高补贴下边际增长趋近于零的行为特征。
  - name: 补贴—司机意愿半径线性模型
    role: 将司机补贴转化为司机愿意前往接单的最大距离，用于估计乘客周围的可用出租车数量。
    why: 补贴可补偿司机额外行驶的燃油成本，以单位里程成本确定线性斜率，能够将经济激励转化为空间服务范围。
  - name: 缓解程度判断模型
    role: 比较无打车软件与实施补贴方案后的人均周围出租车数量，并以相对提高量定义打车难缓解率。
    why: 仅比较补贴金额不能直接判断乘客是否更容易打到车，而人均可接单车辆数能从乘客可获得性角度量化补贴效果。
  - name: 二维正态分布蒙特卡洛仿真模型
    role: 在抽象城市平面中随机生成乘客和出租车位置，重复模拟不同软件使用状态和意愿半径下的匹配情况。
    why: 现实微观位置数据难以完整获得，二维正态分布可近似城市中心密集、边缘稀疏的空间格局，重复随机仿真能够估计平均服务水平。
  - name: 分区域动态实时补贴优化模型
    role: 将城市划分为多个区域，根据各区域乘客数与出租车数之比，在补贴总量约束下实时确定司机补贴金额。
    why: 统一静态补贴无法处理时空供需差异，按区域供需紧张程度动态分配有限预算，可以引导车辆流向人多车少的区域并提高整体匹配度。
  solution_flow: 采集人口、出租车保有量、居民出行、订单、车辆位置和历史补贴等数据→计算供给载客里程与需求载客里程，确定理想里程利用率和理想供求比率→对指标归一化并计算到平衡点的欧氏距离，评价高峰、常规、市区和郊区的供求匹配→拟合补贴金额与软件使用率、司机意愿半径之间的关系→基于二维正态分布分别仿真无软件和有补贴情形，计算人均可用出租车数及缓解率→按照分区供需比和总补贴约束求解动态补贴金额→通过多次仿真和方案实施前后匹配度对比验证方案。
  validation: 采用多层次验证：首先检查理想点是否满足供给载客里程等于需求载客里程以及理想供求比率等于1；其次对随机空间模型进行多次蒙特卡洛模拟并取均值，以降低单次随机结果的波动；再次比较无软件与有补贴情况下的人均可用出租车数和缓解率；最后将动态补贴方案代入西安市9个区域和不同时段的数据进行计算机仿真，以供求匹配度提高3.84%作为方案有效性的实证依据，并检查补贴金额处于2至10元的可执行范围。
  visualization:
  - 补贴金额随时间变化的折线图
  - 供求比率、里程利用率和综合不平衡度的时序折线图
  - 乘客与出租车空间位置散点示意图
  - 补贴金额与软件使用比例的函数曲线图
  - 缓解程度判断模型流程图
  - 不同时段及不同区域指标对比表
  pitfalls_avoided:
  - 避免仅使用总供求比率评价平衡，因为供过于求区域与供不应求区域的偏差会在加权平均中相互抵消，论文通过对供小于求部分取倒数统一了失衡方向。
  - 避免直接将里程利用率和供求比率相加，因为二者量纲、数量级和理想基准不同；先以理想值归一化，再计算二维欧氏距离，可减少尺度差异造成的评价偏置。
  - 避免仅依据补贴金额大小判断政策效果，因为高补贴不必然等价于乘客更容易打车；模型将补贴依次映射为软件使用率和司机意愿半径，再比较人均可用车辆数。
  - 避免假设软件使用比例与补贴无限线性增长，因为比例存在100%的自然上限且边际激励递减；采用指数饱和函数更符合实际行为规律。
  - 避免使用单次随机仿真结果下结论，因为乘客和车辆的随机位置会造成较大波动；通过重复模拟并对人均可用车辆数取平均提高结果稳定性。
  - 避免采用全城统一、全天固定的补贴标准，因为出租车供需存在显著时空异质性；方案按照区域和时段的实时供需比动态分配补贴。
  innovation_points:
  - 将反映运营效率的里程利用率与反映数量关系的供求比率联合映射到二维空间，以实际点到理想平衡点的归一化距离构造综合不平衡度。
  - 针对普通供求比率中供过于求与供不应求偏差相互抵消的问题，构造方向一致的修正供求比率。
  - 建立“补贴金额—软件使用比例—司机意愿半径—乘客可用车辆数—缓解率”的完整作用链条，把经济激励转化为可量化的空间服务改善。
  - 将城市空间划分、实时供需信息与固定补贴总量约束结合，设计随区域和时段变化的动态补贴机制。
  - 利用二维正态空间分布和蒙特卡洛仿真弥补微观位置数据不足，并通过方案前后供求匹配度变化验证补贴策略。
- id: B_C07B1gcy
  source_paper: B B_C07B1gcy
  problem_type: 优化
  keywords:
  - 公交线路选择
  - 多目标路径优化
  - 优先队列搜索
  context: 面向城市公交自主查询系统，在公汽、地铁及有限步行构成的交通网络中，根据乘客对换乘次数、出行时间和费用的不同偏好选择最佳出行线路。
  models:
  - name: 有向加权图公交网络模型
    role: 将公汽站、地铁站表示为节点，将乘车、换乘和步行行为表示为带有时间、费用等属性的有向边，从而把线路选择转化为路径优化问题。
    why: 公交网络具有明确的站点连接关系和方向性，且行驶、换乘与步行均可量化为边权，适合采用图论模型统一描述。
  - name: 分层序贯多目标优化模型
    role: 分别构造“换乘次数最少—时间最短”“费用最少—时间最短”和“时间最短—费用最少”等字典序优化方案。
    why: 不同乘客通常存在一个最关心的首要指标，采用第一目标与第二目标依次比较，比主观加权求和更能保证首要需求真正达到最优。
  - name: 状态扩展最短路模型
    role: 以“当前线路、当前站点、累计时间、累计费用、换乘次数”描述搜索状态，并通过继续乘车或换乘线路实现状态转移。
    why: 时间和费用不仅取决于站点，还受到当前所在线路、交通方式及换乘类型影响，普通静态最短路节点状态不足以表示这种路径依赖性。
  - name: 基于优先队列的广度扩展算法
    role: 按照乘客指定的字典序目标设置状态键值，每次扩展当前键值最优的未处理状态，直至到达终点并恢复最优线路。
    why: 公交网络规模大但连接稀疏，优先队列可以高效获取当前最优状态，并避免重复扩展已经确定最优的状态，满足实时查询需求。
  - name: 公汽—地铁多方式混合网络模型
    role: 统一计算公汽与地铁的行驶时间、初始候车时间、不同交通方式之间的换乘时间、终点步行时间及分方式票价。
    why: 公汽和地铁在站间运行时间、候车时间、换乘成本和计价规则上均不相同，必须通过方式相关参数进行细化，才能贴近真实出行过程。
  - name: 带步行心理承受上限的多方式路径模型
    role: 把站点之间的步行作为独立交通方式加入网络，并以步行距离或步行时间的心理承受上限限制可选步行边。
    why: 允许短距离步行可以连接原本不能直接换乘的站点并改善路线，但若任意站点均可无约束步行，会产生不符合乘客生理和心理接受程度的方案。
  - name: 双向搜索算法
    role: 在加入大量步行连接后，从起点和终点同时展开搜索，以降低搜索空间和计算时间。
    why: 步行边会显著提高网络连通度和分支数量，单向搜索计算量迅速增大，双向搜索能够更快地在中间区域汇合。
  solution_flow: 数据→读取公汽线路、地铁线路、站点顺序、票制和各类行驶及换乘时间，建立运行线路表与换乘线路表→模型→构建有向加权交通网络，并建立包含当前线路和交通方式的状态扩展模型→参数→设置公汽每站3分钟、地铁每站2.5分钟、不同方式换乘耗时、候车时间、票价函数及步行心理承受上限→求解→按乘客偏好构造字典序键值，利用优先队列广度扩展算法求解，加入步行后采用双向搜索加速，并回溯输出线路、换乘站、总时间、总费用和换乘次数→验证→比较不同首要目标下的路线及指标，检查费用和时间计算规则、状态转移可行性与算法运行效率。
  validation: 首先进行规则一致性检验，核对公汽和地铁站间时间、候车时间、各类换乘时间及分段票价是否被正确累计；其次进行路径可行性检验，确保相邻站、线路方向、换乘站和交通方式转换均真实存在；再对六组给定起终点分别采用不同目标排序求解，比较所得换乘次数、时间和费用，验证不同偏好能够产生符合直觉的差异化方案；最后结合公交网络稀疏性估计算法状态数与转移复杂度，并以单次查询可在约0.5秒内完成作为实时性验证。
  visualization:
  - 优先队列广度扩展算法流程图
  - 不同优化目标下线路指标对比表
  - 公交乘客出行心理调查统计图
  - 公汽—地铁—步行网络结构示意图
  pitfalls_avoided:
  - 避免直接对换乘次数、时间和费用进行主观加权求和，因为权重难以客观确定，且加权解可能导致任何单项指标都不最优，无法满足乘客明确的首要需求。
  - 避免把最短物理距离直接等同于最佳路线，因为短距离路线可能需要频繁换乘，而换乘会增加等待、步行和不确定性成本。
  - 避免只以站点作为最短路状态，因为到达同一站点时当前所在线路不同，后续是否换乘以及产生的时间和费用也不同，合并状态会错误剪枝。
  - 避免混淆换乘耗时与纯等待时间，因为题设换乘耗时已包含步行部分；若重复计入步行时间，会系统性高估总出行时间。
  - 避免忽略同名站点可能位于道路两侧的情况，因为线路共享站名不一定意味着零成本换乘，应计入穿越道路所需的步行时间。
  - 避免将公汽和地铁使用同一套时间与票价规则，因为两种方式的站间运行时间、候车时间、换乘耗时和收费方式均不同，统一处理会造成指标失真。
  - 避免在加入步行后让任意两个站点无条件连接，因为这会产生过长步行甚至以步行替代公交的不现实方案，并导致网络边数和搜索量急剧增加。
  - 避免仅输出一条抽象最优路径或单一指标值，因为实际查询系统还需要给出换乘站、所乘线路、总时间、总费用和换乘次数，才能支持乘客执行方案。
  innovation_points:
  - 从乘客出行心理出发，采用可切换首要目标的字典序多目标优化，而不是固定以换乘次数最少为唯一目标或采用统一加权目标。
  - 利用包含当前线路、站点、时间、费用和换乘次数的扩展状态，处理换乘成本和票价所具有的路径依赖性。
  - 将公汽、地铁和步行统一纳入多方式交通网络，并细分公汽转公汽、公汽转地铁、地铁转公汽和地铁转地铁的不同换乘成本。
  - 提出步行心理承受上限，使短距离步行换乘带来的网络连通性改善与乘客可接受程度之间达到平衡。
  - 针对步行边导致的搜索空间膨胀引入双向搜索，并提出在最优线路拥挤时向乘客提供多线路备选方案。
- id: B题 电力市场的输电阻塞管理论文_电力市场输电阻塞管理模型(特等奖)
  source_paper: B题 电力市场的输电阻塞管理论文 B题 电力市场的输电阻塞管理论文_电力市场输电阻塞管理模型(特等奖)
  problem_type: 统计分析+优化
  keywords:
  - 输电阻塞管理
  - 多元线性回归
  - 分阶段多目标优化
  context: 在独立开放电力市场中，根据机组报价、负荷预测、爬坡能力和线路安全限值制定兼顾电网安全与阻塞成本的机组出力方案。
  models:
  - name: 带常数项的多元线性回归潮流模型
    role: 利用历史或试验样本建立各线路有功潮流与各机组出力之间的局部线性近似关系。
    why: 潮流受随机负荷和网络状态影响，与机组出力仅呈统计规律；局部期望关系曲线的切线不必经过原点，因此带常数项的模型比强制过原点模型拟合更合理。
  - name: 基于损失比例补偿的阻塞费用模型
    role: 计算序内容量少发和序外容量多发造成的利益损失，并作为经济优化目标。
    why: 能够分别刻画阻塞调整对不同机组造成的实际或潜在损失，并通过补偿比例参数适应不同市场管理规则。
  - name: 递归式经济调度预案模型
    role: 按照分段报价由低到高选择容量，再结合机组当前出力、爬坡速率和容量上限生成初始出力分配预案。
    why: 符合电力市场按报价排序成交以及后段容量必须在前段容量选满后才能使用的规则，同时计算简单、适合快速调度。
  - name: 输电阻塞检查模型
    role: 将预案出力代入回归潮流公式，通过线路潮流绝对值是否超过安全限值判断是否发生阻塞。
    why: 阻塞判定可直接表示为一组线性潮流约束不等式，能够快速筛除无须进一步调整的安全预案。
  - name: 无阻塞条件下的最小阻塞费用优化模型
    role: 在满足负荷平衡、线路不越限、机组爬坡约束和容量上限的条件下调整机组出力，使阻塞费用最小。
    why: 当初始预案引起阻塞但仍存在无阻塞可行方案时，该模型可在完全保障线路安全的前提下实现经济性最优。
  - name: 安全裕度利用率最小化的极小极大模型
    role: 在无法完全消除阻塞时，最小化所有线路中最大的相对安全裕度利用率，确定安全水平最高的出力方案。
    why: 以已使用裕度占线路最大可用裕度的比例作为统一指标，可消除不同线路限值和安全裕度尺度差异，并避免某条线路过度占用裕度。
  - name: 安全优先的两步序贯优化模型
    role: 第一步求最小最大裕度利用率，第二步在该最优安全水平不降低的约束下最小化阻塞费用。
    why: 用词典序优化准确落实“安全第一、兼顾经济”，避免采用简单加权和时因权重选择不当而牺牲安全目标。
  - name: 拉闸限电最大供电模型
    role: 当满足全部预测负荷无法保证最低安全水平时，在最低安全约束下最大化机组总出力。
    why: 停电损失通常远高于一般调度成本，因此最大化安全可供电量等价于尽可能减少负荷削减。
  - name: Huffman决策树阶段选择模型
    role: 依据各规划阶段的发生概率和判断代价组织阻塞管理决策节点，快速确定应执行阻塞检查、预案调整、裕度输电或拉闸限电中的哪一阶段。
    why: 将高频且低成本的判断置于较短路径，可降低平均决策次数，避免机械地依次求解所有优化模型。
  - name: 阶梯费用目标的启发式优化模型
    role: 处理由分段报价和清算规则形成的阶梯型、非光滑阻塞费用目标。
    why: 阶梯函数不连续且常规梯度方法难以直接使用，启发式搜索能够在有限时间内获得可行的近优调度方案。
  solution_flow: 整理机组出力与线路潮流样本、报价表、负荷预测、当前出力、爬坡速率及安全限值→分别拟合带常数项和不带常数项的多元线性回归模型→用最小二乘法估计潮流系数并通过F检验、R²等指标选择带常数项模型→按分段报价和爬坡约束递归生成经济调度预案与清算价→代入潮流模型检查线路是否越限→若越限则依次求解无阻塞最小费用模型、安全裕度极小极大模型及固定最优安全水平下的最小费用模型→若满负荷条件下仍无安全可行解，则求解最大安全供电量模型实施拉闸限电→通过Huffman决策树缩短阶段判定路径，并检查最终方案的负荷平衡、机组边界、线路安全和经济费用。
  validation: 对两类潮流回归模型进行整体显著性F检验和拟合优度R²比较，并结合独立电网及局部线性化的物理背景检验常数项的合理性；对调度结果逐项复核负荷平衡、爬坡范围、机组容量、线路潮流限值和最低安全裕度约束；通过比较初始预案、无阻塞调整、裕度输电和拉闸限电各阶段的目标值与可行性验证阶段切换逻辑，并对补偿比例、安全裕度和负荷预测变化开展敏感性分析。
  visualization:
  - 阻塞管理分阶段流程图
  - Huffman决策树图
  - 线路潮流回归拟合图
  - 回归残差诊断图
  - 各线路安全裕度利用率对比图
  - 机组调整前后出力堆叠柱状图
  pitfalls_avoided:
  - 避免强制潮流回归方程通过原点：样本仅覆盖当前运行点附近，局部线性化得到的是期望关系曲线的切线，强制零截距会造成明显拟合偏差。
  - 避免用绝对裕度直接比较不同线路：线路容量和允许相对裕度不同，采用裕度利用率可实现无量纲、公平的安全评价。
  - 避免将安全与经济目标简单加权：权重缺乏统一依据且可能以较小经济收益换取较大安全损失，采用先安全后经济的两步优化可严格保持安全优先级。
  - 避免忽略机组爬坡速率生成不可执行预案：仅按报价排序可能使机组在一个调度时段内无法达到目标出力，因此预案生成和后续优化均显式加入爬坡上下界。
  - 避免只考虑线路限值而忽略负荷平衡和容量边界：即使潮流不越限，若总出力不等于负荷或机组超过可用容量，方案仍不具备物理可行性。
  - 避免在阻塞调整后重新计算清算价并将购电费差额直接定义为阻塞费用：该做法会改变原市场清算基准并可能扩大无关机组的补偿，宜优先采用基于原清算价和实际损失的比例补偿规则。
  - 避免对阶梯型费用目标直接使用依赖梯度的连续优化方法：分段报价导致目标不连续、不可微，应采用分段枚举、最大最小规划或启发式算法。
  - 避免在无安全可行解时仍强行满足全部预测负荷：这会突破电网最低安全要求，应转入拉闸限电模型并最大化安全可供电量。
  innovation_points:
  - 将线路潮流与机组出力关系视为局部统计关系，通过带常数项的多元线性回归建立可用于快速优化的潮流近似模型，并从局部切线角度解释截距的合理性。
  - 提出以相对安全裕度利用率为安全指标的极小极大模型，使不同容量和不同裕度水平的线路能够统一比较。
  - 构建“阻塞检查—调整预案—裕度输电—拉闸限电”的分阶段规划体系，根据可行域变化逐级降低运行要求。
  - 采用词典序两步优化实现先安全后经济，先求最佳安全水平，再在安全目标不恶化的条件下优化阻塞费用。
  - 利用Huffman决策树重组阶段判断顺序，以减少阻塞管理的平均计算和判定时间。
  - 针对分段报价产生的阶梯型目标函数，引入广义函数分析与启发式求解思路，提高非光滑调度模型的可计算性。
- id: B27042017_吴俊锋_谭翔飞_庄重_B27042017_吴俊锋_谭翔飞_庄重
  source_paper: B27042017_吴俊锋_谭翔飞_庄重 B27042017_吴俊锋_谭翔飞_庄重_B27042017_吴俊锋_谭翔飞_庄重
  problem_type: 优化+仿真
  keywords:
  - 折叠桌优化设计
  - 运动学建模
  - 稳定性分析
  - 多目标优化
  - 空间曲线匹配
  context: 针对由多根带滑槽木条和钢筋联动构成的平板折叠桌，研究其折叠运动规律，并在满足稳定性、加工可行性和外形需求的条件下优化材料尺寸及加工参数。
  models:
  - name: 圆面折叠桌离散型动态描述模型
    role: 逐根描述木条长度、转角、角速度、角加速度、末端坐标以及钢筋在滑槽中的相对位置，并计算各木条的滑槽长度。
    why: 实际折叠桌由有限根具有固定宽度的木条组成，离散模型能够直接对应真实零件编号和加工尺寸，便于输出可制造的参数。
  - name: 圆面折叠桌连续型动态描述模型
    role: 将木条宽度趋近于零，以连续变量表示木条位置，建立桌脚边缘线随折叠角度变化的空间曲线方程。
    why: 直接连接离散木条端点只能得到近似折线，连续化处理可获得具有明确几何和物理含义的光滑桌脚边缘线。
  - name: 折叠桌受力与质心稳定性模型
    role: 通过承力结构简化、半桌受力分析、质心计算和力矩平衡，建立桌腿不滑移、不倾覆的稳定性约束。
    why: 折叠桌的首要设计要求是稳固，且末态主要由外侧桌腿承力，因此需要以重心位置、支撑位置和地面摩擦系数定量刻画稳定条件。
  - name: 圆形桌面多目标优化设计模型
    role: 综合稳定性、材料用量、滑槽长度和加工便利性，优化长方形平板长度、钢筋位置及滑槽等设计加工参数。
    why: 稳固性好、加工方便和用材最少之间存在权衡，单一目标无法完整反映设计要求，适合在几何与力学约束下进行加权多目标优化。
  - name: 任意桌形离散优化模型
    role: 将圆形桌面推广为沿桌长方向对称的任意边缘形状，分别计算各位置木条长度并优化平板尺寸和加工参数。
    why: 任意桌面通常缺少统一解析表达式，采用离散采样可以兼容心形、菱形等多种客户输入，并与实际木条加工方式保持一致。
  - name: 桌脚边缘线空间曲线匹配模型
    role: 利用空间曲线间距离的积分或范数，衡量实际桌脚边缘线与客户期望曲线的接近程度，并将其纳入优化目标。
    why: 客户给出的桌脚形状属于整体曲线需求，点对点误差不足以评价全局外形，曲线距离积分能够量化整体造型偏差。
  - name: MATLAB与3D MAX运动仿真模型
    role: 依据优化后的几何和运动学参数生成折叠全过程，展示木条运动及桌脚边缘线的动态演化。
    why: 三维联动机构仅凭公式难以直观检查，数值和三维动画仿真可辅助发现运动干涉、曲线异常及参数设置错误。
  solution_flow: 输入平板尺寸、桌高、桌面边缘、木条宽度和摩擦系数等数据→建立坐标系并离散桌面，计算各木条长度及铰接位置→由钢筋与滑槽的几何约束建立木条转角和末端坐标模型→计算钢筋始末位置、滑槽长度和桌脚边缘线→通过受力、质心、摩擦和力矩平衡建立稳定性约束→以材料消耗、加工便利性、稳定性和目标曲线偏差构造多目标函数→使用MATLAB进行数值优化，得到平板尺寸、钢筋位置和滑槽参数→通过连续曲线绘制、动态仿真和3D
    MAX动画验证设计的运动可行性与造型效果。
  validation: 首先检查初始平摊状态和最终桌高状态是否满足几何边界条件，并验证钢筋在整个运动区间始终位于滑槽内；其次利用滑槽位置函数的单调性确认最大行程出现在折叠末态，据此核对加工长度；再通过质心投影、摩擦约束和力矩平衡检验桌子是否滑移或倾覆；最后将离散木条端点结果与连续桌脚边缘线相互对照，并利用MATLAB动态模拟和3D
    MAX三维动画检查折叠过程、空间造型及加工参数的可实现性。
  visualization:
  - 折叠桌结构与坐标系示意图
  - 桌腿末态几何关系图
  - 木条角加速度变化曲线
  - 桌脚边缘线动态演化图
  - 折叠桌受力简化图
  - 质心计算极坐标示意图
  - MATLAB折叠过程动态图
  - 3D MAX三维动画
  pitfalls_avoided:
  - 避免仅用插值拟合离散木条端点来表示桌脚边缘线，因为这种曲线缺乏明确的机构运动含义；通过木条宽度趋零的连续化模型获得具有物理基础的空间曲线。
  - 避免把每根桌腿单独进行静力分析，因为钢筋内力未知且地面摩擦力在横向的分量难以确定；改为分析关于对称面的半张桌子，使内部横向作用相互抵消。
  - 避免默认所有木条在桌子立置后共同承重，因为微小扰动会使中间木条的滑槽末端脱离钢筋；根据机构运动趋势将承力结构合理简化为外侧桌腿。
  - 避免仅按几何尺寸最小化材料而忽略稳定性，因为过短平板或不合理桌腿倾角可能导致滑移、倾覆；将质心、摩擦和力矩条件设置为硬约束。
  - 避免将最大滑槽长度凭经验设定，因为不同木条的钢筋相对位移不同；利用钢筋位置函数在折叠区间内的单调性，以始末位置差精确确定开槽长度。
  - 避免直接把圆桌解析公式机械套用于任意桌形，因为非圆桌面可能不具备径向对称性；采用沿桌长方向对称的离散表达，并在桌宽方向不对称时分别优化重力作用平面两侧。
  innovation_points:
  - 同时建立离散与连续两类动态模型：离散模型服务于零件加工，连续模型服务于桌脚边缘线的解析描述和造型展示。
  - 将机构几何、静力稳定性、材料消耗和加工便利性统一到多目标优化框架中，直接输出平板尺寸、钢筋位置及各木条滑槽长度。
  - 将圆形桌面的专用设计推广为沿桌长方向对称的任意桌形，并以空间曲线距离积分量化客户期望造型与实际造型的偏差。
  - 结合MATLAB数值计算与3D MAX三维动画，实现从参数求解、运动验证到创意桌形展示的一体化设计流程。
- id: A_cumcm0729
  source_paper: A A_cumcm0729
  problem_type: 预测+统计分析+仿真
  keywords:
  - 系统等级结构模型
  - 乡村人口城镇化
  - 出生性别比
  context: 针对中国人口老龄化、出生性别比升高和乡村人口城镇化等新特点，建立分年龄、性别和城乡系统的人口结构模型，以预测人口发展的中短期与长期趋势。
  models:
  - name: 多系统年龄—性别等级结构转移模型
    role: 将城、市镇和乡村划分为不同人口系统，以单岁年龄为等级，描述人口存活、年龄递进、出生、死亡及城乡迁移，实现中短期人口预测。
    why: 传统指数或Logistic模型无法刻画年龄结构、性别差异和城乡人口转移，而等级结构模型能够同时表达系统内部等级转化、系统间迁移和系统外出生死亡过程。
  - name: 乡村人口城镇化迁移函数模型
    role: 以迁移率v_i(t)=α(t)+β_i(t)量化乡村地域城镇化和劳动力流动对城市、镇及乡村人口结构的影响。
    why: 地域城镇化与劳动力迁移的作用机制和年龄特征不同：α(t)主要反映乡村地域转为城镇，β_i(t)主要反映青壮年劳动力向城市流动，因此需要分项建模。
  - name: 长期五岁年龄组人口队列演化模型
    role: 将全国人口视为单一系统，以五岁为一个年龄等级，动态模拟出生率、死亡率和出生性别比变化对总人口、老龄化率、劳动人口、男女比例及抚养比的长期影响。
    why: 长期预测更关注人口代际更替和年龄结构演化，采用较宽年龄组可降低参数维度，并突出出生率、死亡率和出生性别比的长期累积效应。
  - name: 参数拟合与生育率修正模型
    role: 根据城乡年龄迁移数据拟合年龄相关迁移曲线，并利用外部总和生育率资料构造修正因子，对抽样数据中偏低的生育率进行校准。
    why: 原始调查数据受到抽样误差、漏报和超生人口未充分统计等影响，直接使用会系统性低估新生人口和未来总人口，因此需要结合可靠资料进行统计修正。
  - name: 参数灵敏度仿真模型
    role: 改变地域城镇化参数α(t)和劳动力迁移参数β_i(t)，比较城镇化率达到目标水平所需时间以及人口总量和城乡结构的变化。
    why: 迁移参数既具有估计不确定性，又可受到宏观政策调控，灵敏度分析能够识别关键参数并评估不同城镇化政策力度的影响。
  solution_flow: 整理城乡、年龄、性别、出生率和死亡率数据，并针对抽样误差与漏报进行修正→将城、镇、乡划分为三个系统并建立年龄—性别等级转移矩阵→由出生、死亡、迁入和迁出构造调入向量与退出向量→拟合α(t)和β_i(t)，校准生育率及出生性别比等参数→逐年迭代求解中短期人口状态，并用五岁年龄组模型进行长期仿真→计算总人口、劳动人口、城镇化率、老龄化率和抚养比→通过历史回代、实际数据对比及参数灵敏度分析验证模型。
  validation: 采用历史外推和对照实验相结合的验证策略：首先用2004年数据预测2005年，将总人口、劳动人口、城镇化率、老龄化率和抚养比与实际值比较；其次比较引入迁移函数前后的城市男性、镇女性年龄分布曲线，检验城镇化机制是否显著改善拟合；再次将修正后的2010年、2020年人口预测与权威报告结果对照；最后改变α(t)、β_i(t)等关键参数进行灵敏度分析，检查结论的稳定性与政策解释性。
  visualization:
  - 实际值与预测值年龄分布对比折线图
  - 迁移人口比例随年龄变化的拟合曲线图
  - 人口总量时间序列趋势图
  - 不同城镇化参数情景对比曲线图
  - 人口指标年度预测表
  - 参数—目标达成时间灵敏度曲线图
  pitfalls_avoided:
  - 避免仅用指数增长或Logistic模型预测总人口，因为这类模型忽略年龄、性别和城乡结构，无法解释老龄化、劳动人口拐点及人口迁移造成的结构性变化。
  - 避免把城镇化人口迁移率设为与年龄无关的统一常数，因为劳动力迁移主要集中在50岁以下、尤其是18至35岁人群，统一迁移率会扭曲城市人口年龄分布。
  - 避免混同地域城镇化与劳动力流动，因为前者主要增加镇人口，后者主要增加城市青壮年人口，若合并处理会削弱参数的现实含义和政策解释能力。
  - 避免直接使用明显偏低的抽样生育率，因为漏报、超生人口统计困难及抽样误差会导致未来出生人口和总人口被持续低估，因此使用权威总和生育率构造修正因子。
  - 避免忽视男女死亡率和出生性别比差异，因为统一处理性别会使男女比例、育龄妇女人数及后续出生人口预测产生累积偏差。
  - 避免只报告单一参数情景，因为城镇化参数受政策和经济环境影响较大，采用灵敏度与多情景仿真可以判断预测结果对参数变化的稳健程度。
  innovation_points:
  - 将系统分析与年龄等级结构相结合，同时刻画城、镇、乡三个系统内部的年龄递进以及系统之间的人口迁移。
  - 把乡村人口城镇化分解为地域城镇化α(t)和年龄相关劳动力流动β_i(t)，并分别对应向镇和向城市的主要迁移机制。
  - 在同一框架下分别设计单岁年龄的中短期模型与五岁年龄组的长期模型，兼顾短期迁移细节和长期代际演化。
  - 结合外部权威人口资料修正抽样调查中的生育率偏差，提高人口总量预测的可信度。
  - 通过参数灵敏度分析将人口预测与国家城镇化调控政策联系起来，使模型不仅能够预测，还能够支持政策情景评估。
- id: A题_09A
  source_paper: A题 A题_09A
  problem_type: 仿真+优化+综合评价+统计分析
  keywords:
  - 转动惯量电模拟
  - 惯量补偿
  - 电动机驱动电流控制
  context: 在车辆设计阶段利用由飞轮组、电动机和制动器组成的试验台模拟单轮道路制动过程，通过机械惯量配置与电动机实时补偿使试验台的制动能量和运动状态尽可能接近真实路试。
  models:
  - name: 平动动能—转动动能等效模型
    role: 将车辆指定车轮承受载荷对应的平动动能换算为试验台主轴上的等效转动惯量。
    why: 车辆路试与试验台运动形式不同，利用能量守恒可建立二者统一的惯量尺度，并得到等效惯量J=Gr²/g。
  - name: 环形飞轮转动惯量与组合配置模型
    role: 根据飞轮几何尺寸、密度和厚度计算各飞轮惯量，枚举飞轮组合并确定可实现的机械惯量。
    why: 飞轮只能离散装配，需要先计算单个环形飞轮的质量和转动惯量，再结合基础惯量及电动机补偿范围筛选可行组合。
  - name: 机电混合惯量补偿模型
    role: 将目标等效惯量分解为机械惯量与电动机补偿惯量，即Jv=Jm+Js，并确定电动机应提供的补偿方向和大小。
    why: 机械飞轮组合无法连续匹配任意目标惯量，电动机可补充机械惯量不足的能量，也可在机械惯量过大时提供反向补偿。
  - name: 基于瞬时制动扭矩的驱动电流模型
    role: 利用可观测制动扭矩实时计算电动机输出扭矩和驱动电流，控制律为I=k(1-Jm/Jv)TB。
    why: 由TB=Jv·dω/dt和TD=(Jv-Jm)·dω/dt可消去难以直接获得的角加速度，使控制电流仅依赖可观测扭矩及已知惯量参数。
  - name: 基于瞬时转速的离散控制模型
    role: 根据相邻采样时刻的转速估计角减速度，再计算本时间段所需补偿扭矩与电流。
    why: 主轴转速是可直接观测的离散量，通过差分可估计运动状态，适用于扭矩测量不稳定或需要独立转速反馈的场景。
  - name: 基于惯量因子的能量反馈控制模型
    role: 根据目标惯量、机械惯量及阶段性能量偏差形成惯量补偿因子，动态调整电流。
    why: 相较单纯使用上一时刻扭矩或转速，该方法可直接围绕总制动能量匹配目标进行修正，提高整个制动过程的逼真度和准确度。
  - name: 离散制动能量数值积分模型
    role: 利用等时间间隔采样的扭矩与角速度数据计算试验台制动器吸收的总能量，即对Tω进行离散求和。
    why: 实际观测数据是离散序列，采用小时间步长下的矩形数值积分能够直接估算制动功，并与理论路试能量比较。
  - name: 稳态转速线性回归模型
    role: 对制动平稳阶段的角速度—时间数据进行线性拟合，估计平均角减速度并检验制动状态的稳定性。
    why: 恒定减速度下角速度应近似线性下降，回归斜率、置信区间和R²可用于判断控制结果是否符合设定运动规律。
  - name: 能量误差最小化评价模型
    role: 以目标路试能量与试验台实际吸收能量之差为核心指标，对控制方法进行定量比较和优化。
    why: 惯量模拟的本质是匹配制动器吸收的能量，能量绝对误差和相对误差能够统一评价不同控制策略的模拟效果。
  solution_flow: 输入车轮载荷、滚动半径、飞轮尺寸与密度、基础惯量、目标制动工况及离散观测数据→由能量等效关系计算目标转动惯量→计算各飞轮惯量并枚举机械惯量组合，依据±30
    kg·m²补偿能力筛选方案→建立Jv=Jm+Js、TB=Jv·dω/dt、TD=Js·dω/dt和I=kTD关系，推导依赖瞬时扭矩、瞬时转速或惯量因子的离散控制律→在给定初速度、制动时间和采样步长下求取驱动电流并实施阶梯式控制→对Tω进行离散积分得到试验能量，与理论路试能量比较→利用转速线性回归、扭矩与转速曲线、惯量及采样间隔灵敏度分析验证控制效果并改进滞后问题。
  validation: 采用多层验证：首先以理论动能E0=Jv(ω0²-ω1²)/2作为基准，将采样数据通过ΣTiωiΔt积分得到实际能量E1，计算绝对误差和相对误差，文中案例相对能量误差为5.48%；其次绘制扭矩和转速时序曲线，检查软制动、扭矩振荡及转速下降规律；再次对平稳制动阶段进行线性回归，利用斜率、置信区间、R²、F统计量和p值检验恒减速度假设，案例R²为0.9987；最后从机械惯量配置和采样时间间隔两个维度进行灵敏度分析，判断控制效果对参数变化及离散控制滞后的敏感程度。
  visualization:
  - 扭矩—时间折线图
  - 转速—时间折线图
  - 稳态转速线性回归拟合图
  - 采样保持扭矩与插值扭矩对比柱状图
  - 不同控制策略或惯量配置的能量误差对比图
  pitfalls_avoided:
  - 避免直接把车辆质量当作试验台转动惯量；车辆进行平动而试验台进行转动，必须通过能量等效并结合滚动半径换算，否则会产生量纲和物理意义错误。
  - 避免遗漏主轴等不可拆卸机构的基础惯量；飞轮组合惯量必须加上10 kg·m²基础惯量，否则会错误判断可行组合及电动机补偿量。
  - 避免只选择与目标惯量数值最接近的飞轮组合；还必须检查补偿差Jv-Jm是否落在[-30,30] kg·m²内，否则电动机无法实现所需能量补偿。
  - 避免忽略补偿量的正负号；Jm小于Jv时电动机提供同向驱动能量，Jm大于Jv时需要反向扭矩吸收多余能量，若统一取绝对值会导致控制方向错误。
  - 避免将离散采样值误当作连续控制信号；每个采样周期内电流通常保持不变，制动初期扭矩快速变化时会产生明显的零阶保持滞后和阶跃误差。
  - 避免仅凭最终转速评价模拟质量；终点一致并不代表制动器在全过程吸收的能量一致，因此还需对Tω积分并计算全过程能量误差。
  - 避免对包含软制动过渡段的全部转速数据直接做恒减速度拟合；制动初期扭矩快速建立，不满足稳定线性关系，应提取平稳阶段进行回归。
  - 避免仅用视觉判断控制效果；扭矩曲线看似平稳仍可能存在累计能量偏差，应结合相对能量误差、回归统计量和灵敏度分析定量验证。
  innovation_points:
  - 采用飞轮机械惯量与电动机电惯量相结合的混合模拟方式，使离散飞轮组合能够覆盖连续的目标等效惯量。
  - 通过动力学方程消去角加速度，推导出仅依赖可观测瞬时制动扭矩的简洁电流控制律I=k(1-Jm/Jv)TB。
  - 同时设计基于瞬时扭矩、瞬时转速和惯量因子的三类计算机控制方法，并从简洁性、实时性、准确度和逼真度多个维度比较。
  - 针对上一采样周期数据控制下一周期所造成的滞后与阶跃问题提出改进控制算法，并将缩短采样间隔、状态预测或反馈修正作为提升实时性的方向。
  - 提出以BP神经网络在线整定PID参数的实时闭环控制扩展思路，用于适应制动过程中的非线性、振荡和参数变化。
- id: B题 露天矿生产的车辆安排论文_露天矿生产的车辆安排-房亮
  source_paper: B题 露天矿生产的车辆安排论文 B题 露天矿生产的车辆安排论文_露天矿生产的车辆安排-房亮
  problem_type: 优化
  keywords:
  - 露天矿车辆调度
  - 多目标线性整数规划
  - 矿石品位配矿
  context: 在铲位资源、卸点产量与品位、设备数量及班次时间等约束下，优化露天矿电铲和卡车的运输安排。
  models:
  - name: 最小总运量线性整数规划模型
    role: 模型Ⅰ以吨公里最小为首要目标，并在此基础上减少出动卡车数量，生成低运输成本的班次计划。
    why: 卡车满载量和铲位至卸点距离已知，总运输成本可由各路线运输次数、载重量与距离的线性组合表示，而车辆数和运输次数具有整数性。
  - name: 最大产量多目标优化模型
    role: 模型Ⅱ在现有电铲和卡车数量下最大化班次产量，优先提高岩石产量，并在产量相同时最小化总运量。
    why: 问题具有岩石产量优先、总产量最大和运输距离最小的层级目标，适合采用字典序多目标优化描述。
  - name: 矿石品位搭配模型
    role: 通过不同铲位矿石的组合运输，使各矿石卸点在一个班次内的加权平均铁品位保持在28.5%至30.5%之间。
    why: 单一铲位的矿石品位不一定满足卸点要求，需要依据各铲位运输量和铁含量进行加权混配，同时兼顾矿石储量与卸点需求。
  - name: 车辆循环时间与设备能力约束模型
    role: 根据装车、往返运输和卸车时间计算单车班次最大运输次数，并约束铲位和卸点的并行服务能力。
    why: 每辆卡车的运输能力受8小时班次和路线循环时间限制，且电铲与卸点不能同时服务多辆车，因此仅优化运输量不足以保证计划可执行。
  - name: 最短路径组合与最小元素法
    role: 从满足品位条件的铲位组合中筛选到各卸点距离较短的运输路线，缩小后续优化的候选方案空间。
    why: 道路距离固定且卡车均满载，在运输量确定时最小化吨公里等价于优先选择较短路线，可提升计划生成速度。
  solution_flow: 数据→整理铲位矿石与岩石储量、矿石品位、铲位至卸点距离、卸点需求、车辆载重、速度和装卸时间→模型→建立品位搭配、路线选择、车辆数量与运输次数的多目标线性整数规划→参数→计算各路线循环时间Tij=5+3+2Sij/V，并据8小时班次确定单车最大运输次数→求解→先筛选满足品位的铲位组合和短路径，再分别按总运量最小且车辆数最少、现有车辆下产量最大且岩石优先的目标求解→验证→核查储量、卸点产量、品位、车辆与电铲数量、班次时间以及装卸服务冲突，形成各路线车辆数和运输次数计划。
  validation: 采用约束可行性与班次排程复核相结合的策略：重新计算各卸点实际产量和矿石加权平均品位，确认其达到需求且处于28.5%至30.5%；检查各铲位输出不超过可用储量、启用电铲不超过7台、卡车不超过给定数量；依据每条路线的循环时间逐车核对运输次数能否在480分钟内完成，并通过示例时刻表检查电铲和卸点不存在同时服务两辆车的冲突或卡车等待；最后比较候选路线的总吨公里、车辆数和产量，验证目标优先级得到满足。
  visualization:
  - 铲位—卸点运输网络图
  - 车辆班次甘特图
  - 各路线车辆数与运输次数表
  - 卸点产量及矿石品位对比图
  pitfalls_avoided:
  - 避免只按距离选择路线而忽略矿石品位与铲位储量，因为最短路线组合可能无法满足卸点品位区间或因矿石不足而不可执行。
  - 避免将不同铲位品位直接做简单算术平均，因为运输量不相等时必须按实际运量进行加权平均，否则会错误判断配矿方案合格。
  - 避免仅用总运输量除以车辆载重估算车辆数，因为不同路线循环时间不同，必须用480分钟班次上限计算单车最大运输次数。
  - 避免忽略电铲和卸点的单服务台约束，因为多辆卡车同时到达会产生排队等待，违反题目要求并降低设备利用率。
  - 避免把多个优化目标直接无差别加权，因为题目明确规定岩石优先以及产量相同后再最小化总运量，应采用字典序或分阶段求解保持目标优先级。
  innovation_points:
  - 采用分层优化思想，将总运量、出动车辆数、岩石优先和最大产量等目标按题意排序，减少人为设定权重带来的偏差。
  - 将难以精确实施的分钟级随机排程转化为路线车辆数、运输次数和循环时间约束，并用局部时刻表复核无等待性，兼顾求解速度与计划可执行性。
  - 先利用品位搭配和最短路径规则压缩候选路线，再进行车辆配置优化，提高班次生产计划的快速生成能力。
- id: B题_09B
  source_paper: B题 B题_09B
  problem_type: 统计分析+综合评价+仿真+优化
  keywords:
  - 层次分析法
  - 优先级排队模型
  - 蒙特卡洛模拟
  - 泊松分布
  - 动态规划
  context: 针对眼科住院部79张病床及多病种、不同手术日和急诊优先规则，建立兼顾医院床位利用效率与患者等待体验的病床安排评价和优化方案。
  models:
  - name: 层次分析法综合评价模型
    role: 从医院和患者两个视角构建病床安排合理度指标体系，并将方案划分为A、B、C等级。
    why: 平均住院日、病床使用率、病床周转次数、等待入院时间和等待手术时间量纲不同且重要性不同，层次分析法可通过成对比较确定权重并形成统一评价指标。
  - name: 泊松到达统计模型
    role: 描述不同类型患者每日随机到达医院的数量，为排队仿真生成到达事件。
    why: 患者到达具有随机、离散和相对独立的特征，且论文通过原始数据频次分析发现日到达人数与泊松分布相符。
  - name: 多阶段非抢占优先级排队模型
    role: 将就医过程划分为等待入院、等待手术和术后康复三个阶段，并赋予外伤急诊患者更高的入院与手术优先级。
    why: 病床是数量受限的服务资源，不同病种具有不同准备时间、手术日期和康复时间；非抢占优先机制既符合外伤优先规则，也避免普通患者住院过程被强制中断。
  - name: 蒙特卡洛离散事件仿真模型
    role: 模拟患者随机到达、病床占用、手术等待、康复出院和床位释放过程，计算各项评价指标及安排合理度。
    why: 多病种优先级、随机到达、随机住院时长和固定手术日共同作用后难以获得简洁解析解，随机仿真能够复现系统长期运行状态并比较不同策略。
  - name: 入院等待阈值模型
    role: 依据患者当前排队位置、优先级和排队系统参数，给出预计入院等待时间或入院日期区间。
    why: 仅给出队列顺序不能直接回答患者何时能够入院，引入阈值可将队列状态转换为可解释的等待时间提示。
  - name: 服务流与立体排队改进模型
    role: 在基础排队模型中加入时间维度，描述不同星期的手术服务能力及患者在各阶段间的动态流转。
    why: 白内障手术受固定星期约束，服务能力并非每天恒定；静态服务率无法反映周内周期变化，服务流可以刻画时变服务资源。
  - name: 动态规划手术日期优化模型
    role: 在服务时间发生变化时搜索白内障手术日组合，得到周一和周四进行手术的较优安排。
    why: 手术日期选择会影响术前等待、术后占床和后续床位释放，决策具有跨日期状态转移特征，适合用动态规划求解。
  - name: 动态规划病床划分优化模型
    role: 在总床位数固定的约束下，为不同病种或服务队列确定最优床位分配方案。
    why: 各病种到达率、优先级和平均占床时间不同，固定床位划分属于有限整数资源配置问题，动态规划可系统比较可行分配并优化综合合理度。
  solution_flow: 数据→清洗患者就诊、入院、手术和出院记录，按外伤、白内障单眼、白内障双眼、视网膜疾病和青光眼分类，统计到达人数及各阶段持续时间→模型→建立医院与患者双层综合评价体系，并构建含等待入院、等待手术和术后康复的非抢占优先级排队系统→参数→拟合日到达人数的泊松参数，估计各病种术前准备时间、术后观察时间和住院时间，设置79张总床位、每日预留5张急诊床位及AHP指标权重→求解→利用蒙特卡洛方法模拟患者流转，计算病床使用率、平均住院日、动态周转次数、等待入院时间和等待手术时间，再用综合合理度评价方案；进一步通过动态规划优化手术日期和固定床位划分→验证→进行AHP一致性检验、到达分布拟合检查、历史现状对照、评价等级比较及服务资源变化下的敏感性分析。
  validation: 首先利用患者日到达频次检验泊松分布假设，并用历史样本估计各病种阶段时间；其次对AHP判断矩阵计算最大特征根和一致性，文中各矩阵满足λmax=n；随后将现行FCFS安排代入指标体系得到B级，作为基准，再对排队仿真方案计算同一组指标并得到A级，以验证改进效果；最后减少服务时间或改变床位划分，观察合理度随资源收缩而下降，并比较动态规划前后的目标值，以进行敏感性和稳健性验证。
  visualization:
  - 患者等待入院天数频次分布图
  - 患者等待手术时间频次分布图
  - 多阶段排队流程图
  - 层次分析法指标层级结构图
  - 不同方案综合合理度与等级对比图
  pitfalls_avoided:
  - 避免仅从病床使用率评价方案，因为高使用率可能伴随过长等待和过长住院日，不能同时反映医院效率与患者服务质量。
  - 避免将不同量纲指标直接线性相加，因为病床使用率、周转次数和等待天数不可直接比较，需先按标准值归一化再进行加权。
  - 避免对所有病种机械采用FCFS，因为外伤属于急症且需及时入院和次日手术，应采用非抢占优先级规则并预留急诊床位。
  - 避免把手术服务能力视为每天恒定，因为白内障手术受星期安排约束，必须引入时间维度和服务流描述周期性服务能力。
  - 避免将双眼白内障视为一次普通手术，因为其两次手术之间存在固定日期间隔，会改变术前等待、持续占床时间和床位释放节奏。
  - 避免只使用排队论稳态解析公式，因为多病种、随机住院时间、优先级和固定手术日使系统难以满足简单排队模型的齐次假设，故采用离散事件蒙特卡洛模拟。
  - 避免用急诊样本估计普通患者等待入院分布，因为急诊执行特殊优先规则，混合统计会显著低估普通患者的真实等待时间。
  innovation_points:
  - 构建兼顾医院效益和患者体验的双视角病床安排合理度指标，并利用AHP组合病床使用率、平均住院日、动态周转次数及两类等待时间。
  - 将眼科住院过程拆分为入院、术前等待和术后康复三个相互衔接的服务阶段，形成多病种非抢占优先级排队模型。
  - 将蒙特卡洛仿真与综合评价体系连接，使复杂随机排队策略能够通过统一的合理度等级进行横向比较。
  - 引入等待阈值，将患者队列位置和系统参数转化为预计入院时间，提高模型对患者的信息服务能力。
  - 通过服务流加入星期时间维度，并使用动态规划联合改进白内障手术日期和固定床位划分。
- id: A题论文_长江水质综合评价与预测的数学模型
  source_paper: A题论文 A题论文_长江水质综合评价与预测的数学模型
  problem_type: 综合评价+统计分析+预测+优化
  keywords:
  - 长江水质综合评价
  - 一维水质模型
  - 灰色预测与回归分析
  context: 基于长江流域多站点水质、水文和排污历史数据，综合评价区域水质，识别干流主要污染源，预测未来十年水质变化并估算污染治理需求。
  models:
  - name: 无量纲标准化模型
    role: 对溶解氧、高锰酸盐指数、氨氮和pH值进行同向化与无量纲化处理，为多指标综合评价建立统一尺度。
    why: 各指标量纲、数量级和优劣方向不同，其中溶解氧属于越大越优指标，pH值则以接近中性区间为优，不能直接加权比较。
  - name: 动态加权综合评价模型
    role: 利用偏大型正态分布权函数构造水质综合评价指标，量化各观测站各月份的污染程度。
    why: 固定权重难以同时反映不同水质类别之间的质变和同一类别内部污染物浓度的量变，动态权重可随指标恶化程度提高其惩罚强度。
  - name: Borda综合排序模型
    role: 汇总17个观测站在28个月中的水质排序，形成各地区水质污染程度的总体排序。
    why: 单月排序容易受到季节和偶然观测波动影响，Borda数可以综合多期排序信息，提高地区评价结果的稳定性。
  - name: 简化一维水质降解模型
    role: 描述污染物沿长江干流输移过程中因自然降解导致的浓度变化，并连接上下游流量、浓度、流速和河段距离。
    why: 在流速均匀、断面变化较小、忽略扩散且污染物近似稳态的条件下，一维常微分方程能够以较少参数刻画上游污染对下游的影响。
  - name: 河段排污量上下界模型
    role: 分别假设污染排放集中在河段起点和终点，估计各河段污染物排放速率的上界、下界及平均相对排污量。
    why: 实际排污口数量、位置和排放量未知，无法精确反演；通过极端排放位置构造区间，可以在信息不足时稳健识别主要污染河段。
  - name: GM(1,1)灰色预测模型
    role: 依据近十年总排污量序列预测未来十年的长江流域排污总量。
    why: 历史样本较少且排污量总体呈增长趋势，灰色模型对小样本、贫信息时间序列具有较好的适用性。
  - name: 多元线性回归模型
    role: 建立可饮用水或不可饮用水比例与年总排污量、总水流量之间的定量关系，并分别描述全流域、干流、支流及不同水期。
    why: 水质类别比例主要受污染负荷和水体稀释能力共同影响，回归模型可解释两类因素的边际作用，并可与排污量预测结果衔接。
  - name: 约束反演与治理量估算模型
    role: 在未来不可饮用水和劣V类水比例满足控制目标的条件下，反求所需削减或处理的污水量。
    why: 将水质控制目标代入已建立的排污量—流量—水质比例关系，可把环境目标转化为可执行的污染治理规模。
  solution_flow: 数据→整理17个站点28个月的DO、CODMn、NH3-N和pH数据以及近十年流量、排污量和水质分类数据→对指标进行同向化、极差标准化及pH偏离度处理→构造动态权重综合指标并用Borda数完成站点综合排序→根据上下游浓度、流量、流速、距离和降解系数求各河段排污量上下界与单位长度相对排污量，识别主要污染源→使用GM(1,1)预测未来排污总量→以排污量和总水流量为解释变量建立多元回归模型，预测未来可饮用水比例→依据水质控制约束反演未来污水处理量→通过实际排序一致性、区间估计和历史数据拟合检验结果合理性。
  validation: 采用多层验证策略：首先检查标准化后指标方向是否统一以及综合评价排序是否符合国家水质分类逻辑；其次将识别出的高污染河段与原始监测浓度及洞庭湖等实际地理污染特征进行一致性对照；再次用排污集中于河段首端和末端两种极端情形给出排污量上下界，检验污染源排序对排污位置不确定性的稳健性；最后利用近十年历史数据拟合灰色预测和回归关系，并检查预测趋势是否与排污量增长、水流稀释效应等机理一致，避免仅依赖单一模型结论。
  visualization:
  - 各观测站水质综合得分与Borda排序柱状图
  - 长江干流分河段污染物相对排放量对比图
  - 河段排污量上下界区间图
  - 历年及未来十年总排污量趋势折线图
  - 全流域、干流和支流可饮用水比例预测曲线
  - 观测站及主要污染河段空间分布示意图
  pitfalls_avoided:
  - 避免直接对原始水质指标加权，因为DO、CODMn、NH3-N和pH的量纲、数量级及优劣方向不同，直接相加会使综合得分失真。
  - 避免仅按国家水质类别进行离散评价，因为同一类别内部污染物浓度仍存在明显差异；动态加权同时保留类别间的质差和类别内的量差。
  - 避免把pH值简单视为单调增大或减小指标，因为pH偏离适宜中性值的两个方向都会导致水质恶化，故使用其相对7.5的绝对偏离度。
  - 避免根据单个月份判断地区水质优劣，因为季节性水文变化和偶然测量误差可能改变排序；使用28个月排序的Borda数进行综合。
  - 避免把下游污染浓度全部归因于当地排放，因为上游污染物会随水流迁移且在途中发生自然降解；一维水质模型显式考虑了上下游传输关系。
  - 避免在排污口位置和数量未知时强行给出精确排污量，因为这种点估计缺乏数据支撑；通过首端集中排放和末端集中排放构造可信上下界。
  - 避免直接用河段总排污量比较污染强度，因为河段长度不同会造成不可比；采用单位时间、单位河长的平均相对排污量进行排序。
  - 避免仅由排污量预测水质而忽略稀释作用，因为相同排污量在不同水流量下产生的浓度和水质类别不同；回归模型同时引入总排污量与总水流量。
  - 避免对缺乏明显变化规律的未来水流量进行过度外推，论文使用历史平均流量作为基准情景，但该假设应在应用中配合丰水、平水和枯水情景分析。
  innovation_points:
  - 将国家水质类别标准嵌入偏大型正态动态权函数，使综合指标同时刻画跨类别的质变和类别内部的浓度差异。
  - 将多月动态评价结果与Borda社会选择排序结合，形成兼顾时间波动与总体表现的观测站水质综合排名。
  - 在排污口信息缺失的情况下，通过河段首端和末端集中排放两种极端假设构造排污量上下界，并以单位河长相对排污量定位主要污染源。
  - 把一维机理模型、灰色小样本预测和统计回归模型串联起来，形成从现状评价、污染溯源到长期预测和治理需求反演的一体化框架。
  - 分别针对枯水期、丰水期、水文年以及全流域、干流、支流建立水质比例模型，体现水文时期和空间结构差异。
- id: B_cumcm0709
  source_paper: B B_cumcm0709
  problem_type: 优化
  keywords:
  - 换乘次数
  - 迪杰斯特拉算法
  - 混合出行模式
  - 最佳路线
  context: 面向北京市公交自主查询系统，在仅公汽、公汽与地铁以及加入步行三种场景下，为任意起终站选择满足换乘少、时间短或费用低等需求的最佳出行路线。
  models:
  - name: 公汽系统分层换乘优化模型
    role: 按照换乘次数构造可选线路集合，并分别以总出行时间最短和总费用最少为目标筛选公汽路线。
    why: 公汽线路具有明确的站点顺序、分段计价和换乘关系，先按换乘次数分层枚举可行方案，可降低直接在全部线路组合中搜索的复杂度，并支持不同乘客偏好。
  - name: 公汽—地铁一体化换乘优化模型
    role: 将地铁抽象为特殊公交线路，统一计算公汽行驶、地铁行驶、不同交通方式间换乘所产生的时间和费用。
    why: 把地铁站及其关联公汽站映射到统一线路网络后，可以复用公汽换乘模型的搜索算法，同时利用符号函数保证地铁单一票价只在实际乘坐地铁时计入。
  - name: 基于Dijkstra思想的步行—公交混合路径模型
    role: 将站点间步行作为额外连接方式，搜索任意两站之间换乘次数最少或综合代价较低的混合出行路径。
    why: 加入步行后，线路选择可抽象为带权网络最短路问题，Dijkstra类算法能够系统处理公交直达、公交换乘和站间步行形成的多种连接。
  - name: 换乘次数分层可行线路生成算法
    role: 生成零次、一次、两次及更高换乘次数对应的可选线路集合U_n，为时间和费用优化提供可行域。
    why: 通过起点后继站集合、终点前驱站集合及其交集识别换乘站，并递推扩展更高换乘层，能够保证线路方向和换乘顺序符合实际乘车过程。
  solution_flow: 数据→整理有向公汽线路、地铁站映射、站点顺序、票制、区间行驶时间、换乘时间及步行时间→按换乘次数n生成可行线路集合U_n，并确定最少换乘层U_nmin与其余可行层→设置相邻公汽站和地铁站平均时间、各类换乘时间、公汽分段票价及地铁单一票价等参数→分别建立最短时间与最小费用目标函数，利用Mathematica枚举和筛选最优路线；含步行情形采用Dijkstra思想求解→检查起终点方向、换乘站交集、费用计取和路径可达性，并比较最少换乘方案与其他方案的时间和费用。
  validation: 采用可行性检查与结果对比相结合的验证策略：逐段核验路线是否遵循线路行驶方向、换乘站是否同时属于相邻线路、起终站是否可达；重新累计经过站数、行驶时间、换乘时间和票价以核对目标函数值；将最少换乘集合中的最优方案与其余换乘层的最短时间、最低费用方案进行横向比较，并通过零换乘、一次换乘等简单情形检验递推算法的一致性。
  visualization:
  - 不同换乘次数下的线路连接原理图
  - 换乘线路集合生成算法流程图
  - 起点—换乘站—终点路径示意图
  - 不同候选路线时间与费用对比表
  pitfalls_avoided:
  - 将同一公汽线路的上下行视为不同的有向路线，避免只判断两个站是否属于同一线路而忽略站点先后顺序，进而生成逆向乘车的不可行方案。
  - 在一次换乘搜索中只使用起点之后的站点和终点之前的站点求交集，避免把起点前方或终点后方的站误判为有效换乘站。
  - 将行驶时间与公汽—公汽、公汽—地铁、地铁—公汽和地铁—地铁换乘时间分别累计，避免只按经过站数计算而系统性低估总出行时间。
  - 对单一票制和分段计价公汽线路分别计费，并按每一乘车段的站数计算费用，避免把所有公汽线路统一按固定票价处理造成费用最优路线失真。
  - 利用符号函数仅在实际乘坐地铁时附加一次地铁票价，避免未乘地铁却计费或地铁线路间换乘时重复收取单一票价。
  - 先构造各换乘层的完整可行集合再优化时间或费用，避免仅追求局部最短路而遗漏换乘较多但总时间更短或总费用更低的方案。
  innovation_points:
  - 以换乘次数为分层变量，将庞大的原始线路网络重组为U_n可行方案集合，实现换乘最少、时间最短和费用最低等多种需求的统一求解。
  - 把地铁抽象为一条特殊公汽线路，并把可换乘公汽站映射为该线路站点，从而在不重构整体算法的情况下实现公汽与地铁的一体化建模。
  - 同时保留最少换乘层与其他换乘层的最优解，使查询系统能够提供换乘最少、时间最短和费用最低等差异化候选方案，而非只返回单一路径。
  - 将站点间步行连接纳入交通网络，并借鉴Dijkstra算法形成步行与公交直达、换乘相结合的混合出行模式。
- id: A_cumcm0707
  source_paper: A A_cumcm0707
  problem_type: 预测+仿真+统计分析
  keywords:
  - 人口增长预测
  - 改进灰色预测模型
  - 人口动态转移
  context: 针对中国人口老龄化、出生性别比升高和城镇化等新特征，建立人口增长模型以预测中短期及长期人口规模与结构变化。
  models:
  - name: 改进的GM(1,1)灰色预测模型
    role: 根据人口净增长序列滚动预测中国中短期总人口，并给出人口增长趋缓的趋势。
    why: 人口年度数据具有较强的连续性和记忆特征，而灰色模型所需样本少、适合信息不完全系统；改用净增长序列、优化初值并滚动更新数据窗口后，可降低大人口基数和陈旧初值造成的预测误差。
  - name: 分年龄人口动态转移模型
    role: 按年龄、城乡地区和性别模拟人口逐年转移，预测总人口、劳动年龄人口、老年人口及人口抚养比的长期变化。
    why: 人口规模由上一年年龄结构、生育率、死亡率、性别比例和城镇化水平共同决定，采用动态转移矩阵能够体现人口队列逐年老化以及出生、死亡过程的机制性影响。
  - name: Bertalanffy增长模型
    role: 从宏观层面拟合人口增长总趋势，并与灰色模型和动态转移模型的长期预测结果进行交叉比较。
    why: 该模型是Logistic模型的推广，可通过形状参数灵活调整增长曲线拐点位置，适合刻画具有增长上限且增速逐渐放缓的人口变化过程。
  solution_flow: 收集人口总量、年龄结构、城乡人口比例、分地区分性别死亡率和妇女生育率等数据→对人口总量构造净增长序列并进行1-AGO与紧邻均值生成→用最小二乘法估计GM(1,1)参数，选择较优初值并采用等维滚动方式预测中短期人口→根据城乡比例、性别比例、生育率和死亡率计算分年龄总死亡率及有效出生率，构造人口动态转移矩阵并逐年迭代至未来100年→拟合城镇化比例函数并对难以获得的参数进行合理固定或校正→使用历史总人口估计Bertalanffy模型的增长上限、增长速率和形状参数→输出总人口、劳动年龄人口、老年人口和抚养比变化→通过精度检验、事后预测、情景扰动及多模型结果对比完成验证。
  validation: 灰色模型采用残差、关联度、方差比和小残差概率进行精度分级，并比较不同初值位置后选取检验指标较优的方案；Bertalanffy模型使用1961—2002年数据拟合，以2003—2006年实际人口进行样本外事后预测并计算拟合误差；动态转移模型通过调整出生性别比等参数开展敏感性比较，并将人口峰值年份、峰值规模和长期趋势与《国家人口发展战略研究报告》以及其他两个模型的结果交叉验证。
  visualization:
  - 总人口随时间变化折线图
  - 城镇人口比例拟合曲线
  - 总人口与劳动年龄人口变化曲线
  - 老年人口与人口抚养比变化曲线
  - 不同性别比情景下的人口总量对比图
  - Bertalanffy人口增长拟合与外推曲线
  pitfalls_avoided:
  - 避免直接对大基数人口总量建立灰色模型，因为总量尺度会掩盖年度增量变化并导致残差和方差比偏大，因而改为对人口净增长序列建模。
  - 避免始终使用序列中最旧观测值作为灰色微分方程初值，因为旧数据与未来状态关联较弱且不能充分反映累加序列特征，因而比较多个初值位置并选取精度较高的初值。
  - 避免用固定历史窗口一次性外推全部年份，因为长期外推会不断放大GM(1,1)的结构性误差，因而采用等维滚动更新，每获得一个预测值便删除最旧数据并重新估计参数。
  - 避免将灰色模型用于长期人口结构预测，因为它会机械延续近期净增长递减规律，无法刻画生育、死亡、老龄化和队列更替造成的人口峰值与下降过程。
  - 避免在数据不足时盲目设置过多时变参数，因为分年龄、分地区、分性别的年度死亡率和生育率难以可靠获得，因而使用多年均值并明确固定参数假设，以控制模型不可辨识风险。
  - 避免忽略婴儿漏报和总和生育率口径偏差，因为初始年龄结构和出生规模的误差会在长期队列迭代中累积，因而对婴儿人口比重和生育率数据进行了校正。
  - 避免把出生性别比的短期变化直接等同于总人口性别结构变化，因为其对总量的影响具有累积和滞后特征，因而先简化处理，再通过参数扰动检验长期风险。
  innovation_points:
  - 将GM(1,1)的建模对象由总人口改为人口净增长量，并结合初值优化和等维滚动更新，提高中短期预测精度。
  - 构建同时包含年龄递进、出生、死亡、城乡地区和性别差异的人口动态转移矩阵，将总量预测拓展到劳动人口、老年人口和抚养比等结构指标。
  - 利用拟合函数描述城镇化比例的动态变化，并将其嵌入人口转移过程以反映城乡人口结构演化。
  - 采用灰色模型、机制型动态转移模型和Bertalanffy宏观增长模型进行多尺度交叉预测，区分中短期统计外推与长期人口机制模拟的适用范围。
  - 通过性别比情景扰动和不同模型长期稳态差异提出对固定总和生育率等关键假设的质疑，为后续政策情景分析提供方向。
- id: A题  奥运会临时超市网点设计论文_数学建模超市网点优化设计模型03
  source_paper: A题  奥运会临时超市网点设计论文 A题  奥运会临时超市网点设计论文_数学建模超市网点优化设计模型03
  problem_type: 统计分析+优化+仿真
  keywords:
  - 购买概率
  - 最短路径人流分配
  - 非线性整数规划
  - 均衡率
  - 随机仿真
  context: 依据奥运场馆观众的出行、餐饮和消费调查数据，测算20个商区的人流分布，并优化不同规模临时迷你超市的数量与空间配置，以兼顾购物需求、分布均衡和商业赢利。
  models:
  - name: 描述性统计与相关性分析模型
    role: 提取出行方式、餐饮方式、消费档次、年龄和性别的分布规律，并判断出行方式与餐饮选择、消费档次之间的关联程度。
    why: 问卷数据是后续路径概率、消费额期望和购物需求估计的基础；相关性分析可判断是否需要针对不同交通人群设置差异化消费参数。
  - name: 最短路径概率分配模型
    role: 根据住地到场馆、场馆到餐饮点、餐饮点到住地的出行链，将不同交通方式和餐饮选择的人群分配到各条最短路径，并累计得到20个商区的人流占比。
    why: 题目明确规定观众按最短路径出行；对多条等长最短路径进行等概率分配，可避免主观指定路线造成的人流偏差。
  - name: 商圈屏蔽效应模型
    role: 将新增MS的主要吸引作用限定在所在商区，忽略其对相邻商区购物概率的弱影响，从而实现商区之间的近似解耦。
    why: 基于影响力随距离平方衰减的思想，新增网点对本商区的作用远强于对相邻商区的作用，可显著降低跨商区竞争建模的复杂度。
  - name: 非线性购买概率累加模型
    role: 用“一减去所有MS均未促成购买的概率”计算商区总体购买概率，刻画网点增加带来的规模效应、边际收益递减和同区竞争效应。
    why: 购物吸引力不会随MS数量线性增长；概率互补形式能够保证总购买概率位于0到1之间，并自然表现出逐渐饱和的特征。
  - name: 赢利数学期望模型
    role: 将商区人流量、消费额期望、购买概率、统一赢利率和运营天数结合，计算各商区及整体的预期赢利。
    why: 观众是否购买具有随机性，直接以固定消费收入计算会高估收益；使用数学期望可统一处理消费概率和消费水平的不确定性。
  - name: 非线性整数规划模型
    role: 以各商区大、小MS数量为整数决策变量，以总预期赢利最大化为目标，并加入承载能力、位置均衡和规模类型均衡约束。
    why: 网点数量具有离散性，购买概率又是非线性函数，同时还需满足容量与均衡要求，因此适合构建非线性整数优化模型。
  - name: 启发式均衡调整算法
    role: 先求得满足购物需求约束的局部最优网点配置，再对网点位置和规模类型进行迭代调整，使方案达到规定的均衡水平。
    why: 非线性整数规划含有乘积概率和跨商区极差约束，直接全局求解难度较高；分阶段启发式调整能够提高求解效率并保留方案可解释性。
  - name: 随机模拟检验模型
    role: 随机生成或扰动奥运期间的人流、购买行为等情景，检验网点方案在赢利、容量满足和均衡性方面的稳定性。
    why: 解析优化通常基于期望参数，随机仿真可进一步评价实际客流波动和购买行为不确定性下的方案鲁棒性。
  solution_flow: 数据→清洗并统计问卷中的交通、餐饮、消费、年龄和性别分布，分析变量相关性→按“住地—场馆—餐饮点—住地”的出行链枚举最短路径，对等长路径等概率分流并累计20个商区人流占比→由消费档次计算人均消费额期望，依据网点承载力、成本和吸引概率确定大、小MS参数→建立非线性购买概率与赢利期望模型→以大、小MS数量为整数变量，加入120%容量裕度、位置均衡率和类型均衡率约束进行优化→先求满足需求的配置，再用启发式算法执行均衡调整→通过结果规律分析、灵敏度分析和随机模拟验证方案。
  validation: 采用多层验证：首先检查人流分布是否符合场馆容量递减、出口商区流量较大和对称位置流量近似对称等空间规律；其次分析MS数量变化对购买概率和预期赢利的边际影响，确认存在饱和与竞争效应；再次改变承载能力、购买概率、成本、均衡阈值等关键参数开展灵敏度分析；最后对整个奥运期间的人流与购买行为进行随机模拟，统计赢利、容量约束满足率及均衡指标的波动，以检验方案稳定性和鲁棒性。
  visualization:
  - 出行方式、餐饮方式和消费档次分布柱状图
  - 不同出行方式下餐饮选择与消费档次概率折线图
  - 年龄和性别与消费档次关系图
  - 场馆交通网络与最短路径示意图
  - 20个商区人流分布图
  - 购买概率随MS数量变化的饱和曲线
  - 网点优化配置空间分布图
  - 灵敏度分析曲线或参数扰动图
  pitfalls_avoided:
  - 避免将问卷中的潜在消费额直接视为每名观众每日必然消费额，因为经过商区并不意味着一定购买；模型引入购买概率后再计算消费与赢利期望，可防止系统性高估收入。
  - 避免假设商区吸引力与MS数量线性增长，因为同一商区内存在客户竞争和边际吸引力递减；采用互补概率乘积形式可刻画饱和效应，并保证购买概率不超过1。
  - 避免在存在多条等长最短路径时人为指定唯一通道，因为这会造成部分商区人流被夸大或低估；采用等概率分流保持路径分配的客观性和空间对称性。
  - 避免只追求赢利最大化而忽略高峰期服务能力，因为高客流商区可能出现排队、拥堵和需求无法满足；设置总承载力不低于商区流量120%的容量约束并保留安全裕度。
  - 避免仅以MS总数衡量分布均衡，因为相同总数可能对应投资过度集中或大小网点结构失衡；分别设置位置分布均衡率和规模类型分布均衡率进行约束。
  - 避免无依据地为不同交通方式设置不同消费水平，因为调查结果显示出行方式与消费档次、餐饮选择的相关性很小；统一消费额期望可减少冗余参数和过拟合。
  - 避免建立过度复杂的跨商区竞争网络，因为新增网点对相邻商区的影响相对较弱且参数难以识别；利用商圈屏蔽假设近似解耦，但仍需通过灵敏度分析检查该简化的影响。
  - 避免只根据期望值方案判断可行性，因为真实客流和购买行为存在随机波动；通过随机模拟检验容量满足、赢利和均衡指标在多情景下的稳定性。
  innovation_points:
  - 以购买概率作为观众购物欲望的量化指标，并用互补事件推导多网点联合吸引概率，统一刻画商区规模效应、同区竞争和边际收益递减。
  - 将最短路径交通分配与商业网点优化连接起来，使商区客流不再依赖主观赋权，而是由交通方式、看台位置、餐饮选择和路径结构共同决定。
  - 构建“赢利期望最大化—容量需求满足—空间位置均衡—规模类型均衡”的多目标约束化框架，实现经济性、服务性与公平性的综合权衡。
  - 提出容量人流比、位置分布均衡率和规模类型分布均衡率等可计算指标，将抽象的购物需求和基本均衡要求转化为可执行的优化约束。
  - 采用“需求可行配置求解+启发式均衡调整+随机仿真检验”的分阶段方法，兼顾复杂非线性整数模型的求解效率、结果可解释性和实际鲁棒性。
- id: A题_2009河南科技大学（郑晨，王文霞，李培飞_A
  source_paper: A题 A题_2009河南科技大学（郑晨，王文霞，李培飞_A
  problem_type: 仿真+预测+综合评价+优化
  keywords:
  - 等效转动惯量
  - 能量误差
  - 计算机闭环控制
  context: 在制动器试验台上利用飞轮机械惯量和电动机补偿惯量模拟车辆道路制动过程，并设计、评价和改进驱动电流控制方法。
  models:
  - name: 能量等效转动惯量模型
    role: 将车辆平动动能等效为试验台主轴与飞轮的转动动能，计算目标等效转动惯量。
    why: 路试与台试等效的核心要求是制动初始状态下能量一致，由动能守恒可直接得到等效惯量与车轮载荷、滚动半径之间的关系。
  - name: 环形飞轮转动惯量与组合枚举模型
    role: 计算各飞轮的转动惯量，枚举飞轮组合形成的机械惯量，并筛选可行的电动机补偿惯量。
    why: 飞轮具有规则环形几何结构，可由转动惯量积分精确计算；飞轮数量较少，采用组合枚举能够完整覆盖全部机械惯量方案。
  - name: 转动动力学微分方程模型
    role: 根据补偿惯量、角加速度和电动机转矩之间的关系计算驱动电流。
    why: 电动机电流与输出转矩成正比，而补偿转矩满足转动定律，因而可将车轮减速度或主轴角加速度映射为实时电流指令。
  - name: 能量方程与主轴力矩平衡模型
    role: 利用瞬时转速、瞬时角加速度和主轴转矩等可观测量建立另一种驱动电流计算方法。
    why: 该模型能够把试验台的离散观测量直接纳入控制关系，比仅依据恒定减速度计算电流更接近实际制动过程。
  - name: 能量误差综合评价模型
    role: 分别计算路试目标制动能量和试验台制动器实际消耗能量，以绝对误差和相对误差评价控制效果。
    why: 题目明确将能量误差作为控制方法优劣的重要量化指标，且能量积分可以综合反映整个制动时段的跟踪性能。
  - name: GM(1,1)灰色预测模型
    role: 依据前序时间段的转速、转矩或电流序列预测下一时间段的控制电流。
    why: 制动过程样本长度有限且信息不完全，灰色模型对小样本时间序列要求较低，并可通过累加生成弱化原始数据的随机波动。
  - name: BP神经网络模型
    role: 学习瞬时转速、瞬时转矩与驱动电流之间的非线性映射，用于离散时间电流控制。
    why: 制动器动力学复杂，难以得到精确解析关系，BP神经网络可通过训练样本和误差反向传播拟合非线性输入输出关系。
  - name: 模糊自整定PID控制模型
    role: 根据跟踪误差及误差变化在线调整PID参数，改进电流控制的实时性、稳定性和适应性。
    why: 固定模型预测和BP网络可能存在预测误差、训练速度慢及控制滞后，模糊自整定PID更适合非线性、时变和工作环境复杂的实时控制系统。
  solution_flow: 输入车轮载荷、滚动半径、飞轮尺寸与密度、基础惯量以及离散转速和转矩数据→通过平动与转动动能等效计算目标惯量→积分计算单个飞轮惯量并枚举机械惯量组合→依据补偿范围筛选机械惯量并确定电动机补偿惯量→建立转动动力学和力矩平衡方程求取驱动电流→按10
    ms步长利用GM(1,1)和BP神经网络预测或拟合下一时段电流→采用模糊自整定PID改进闭环控制→对转矩乘角位移进行离散积分得到台试耗能，并与路试理论能量比较验证。
  validation: 采用双重验证策略：一是将两种动力学电流模型的计算结果进行对比，分析转速控制与转矩控制在精度、稳定性和滞后性方面的差异；二是以路试目标惯量对应的初末转动能之差为基准，将试验台各时间步的转矩与角位移乘积累加得到实际制动能量，计算绝对能量误差和相对误差，论文所得相对误差为5.6527%，并结合单步耗能曲线检查制动过程的连续性与合理性。
  visualization:
  - 主轴转速—时间曲线
  - 制动转矩—时间曲线
  - 驱动电流—时间模拟曲线
  - 单步制动能量散点图及拟合曲线
  - BP神经网络控制流程图
  pitfalls_avoided:
  - 避免只按车辆质量直接匹配试验台质量，因为车辆是平动而试验台是转动，必须先通过动能等效将载荷转换为转动惯量，否则两种制动过程的能量基准不一致。
  - 避免只选择与目标惯量数值最接近的飞轮组合，因为电动机补偿惯量被限制在[-30,30] kg·m²内；必须枚举组合后进行可行性筛选，否则控制指令可能超出设备补偿能力。
  - 避免仅利用分辨率有限且局部保持不变的转速数据直接计算台试耗能，因为这会放大离散测量造成的能量误差；改用连续变化的制动转矩与每步角位移乘积进行累加。
  - 避免把连续动力学公式不加处理地用于数字控制，因为控制器以10 ms为步长运行且当前指令依赖上一时段观测量；应明确单步内角加速度近似恒定并考虑一拍滞后。
  - 避免单纯依赖BP神经网络作为实时控制器，因为其训练速度较慢且可能带来控制滞后；进一步引入模糊自整定PID以提高在线响应速度和参数适应能力。
  - 避免仅用GM(1,1)的拟合结果判断控制质量，因为小样本预测仍可能存在较大偏差；最终需要用全过程能量误差进行独立检验。
  innovation_points:
  - 将能量等效、飞轮组合筛选、电动机虚拟惯量补偿和离散电流控制连接为统一的制动试验台仿真框架，同时允许电动机提供正、负惯量补偿。
  - 在解析动力学控制之外组合GM(1,1)、BP神经网络和模糊自整定PID，形成由短期预测、非线性映射到自适应闭环校正的多层控制改进思路。
- id: B_C07B1wox
  source_paper: B B_C07B1wox
  problem_type: 统计分析+优化
  keywords:
  - 公交线路选择
  - 多目标最短路
  - 改进Floyd算法
  - 换乘优化
  - 步行矩阵
  context: 面向公交实时查询系统，在综合考虑换乘次数、出行时间、费用及步行接驳的条件下，为任意起讫站点选择符合乘客偏好的最优出行路线。
  models:
  - name: 乘客出行心理统计分析模型
    role: 识别影响乘客选线的主要因素并确定优化指标的优先顺序。
    why: 调查结果表明换乘次数、出行时间、路程和费用的关注比例不同，可据此突出换乘次数与时间，并将与时间和费用高度相关的路程指标适当简化。
  - name: 有向赋权公交网络图模型
    role: 将公交站点、直达关系、运行时间和费用转化为图的顶点、弧及权值，为路径优化提供统一表示。
    why: 公交线路具有明确的站点连接关系和上下行方向，适合用有向赋权图描述，并可调用成熟的最短路算法。
  - name: 字典序多目标优化模型
    role: 按照目标优先级构造“换乘最少+用时最短”“用时最短+换乘最少”“换乘最少+费用最少”三种查询方案。
    why: 换乘、时间和费用量纲不同，且少换乘一次与节约多少时间或费用难以等价折算；字典序优化能直接体现不同乘客的首要与次要需求。
  - name: 基于最小加法矩阵运算的改进Floyd模型
    role: 递推计算限定换乘次数或不限定换乘次数时的最短出行时间，并同步记录换乘站点和线路信息。
    why: 传统Floyd算法只能直接处理弧权累加，不能完整反映等车和换乘步行耗时；通过在直达时间矩阵中加入等车时间、在递推中加入步行矩阵，可将换乘成本纳入最短路计算。
  - name: 步行矩阵与乘车矩阵交替递推模型
    role: 处理允许在不同站点间步行接驳后的公交路径选择，描述“步行—乘车—步行—乘车”等组合出行方式。
    why: 站间步行会产生传统同名站换乘模型无法表示的新连接，通过步行时间矩阵与直达乘车矩阵交替进行Floyd运算，可统一搜索多种步行和乘车组合。
  - name: 公交—地铁多模式网络扩展模型
    role: 将地铁站点、地铁运行时间、票价、候车时间和公交地铁接驳时间并入原公交网络。
    why: 通过扩充直达时间矩阵、费用矩阵和步行矩阵，可以在不改变主体求解框架的情况下实现公交与地铁联合优化。
  solution_flow: 数据→整理公交及地铁线路、站点、票价、相邻站运行时间、候车时间和步行时间，并利用乘客心理调查确定指标优先级→模型→建立有向赋权图、直达时间矩阵、直达费用矩阵和步行矩阵，构造三类字典序优化模型→参数→设置公交候车3分钟、地铁候车2分钟、同站换乘步行2分钟、公交相邻站运行3分钟、地铁相邻站运行2.5分钟，并用充分大的数表示不可达→求解→采用改进Floyd最小加法运算逐层增加换乘次数，记录最短时间、费用、换乘站点及线路；在允许站间步行时交替运算步行矩阵与乘车矩阵；对公交地铁联合网络使用扩充矩阵求解→验证→检查路径可达性、矩阵递推稳定性、目标优先级和换乘次数是否满足要求，并用给定6对站点及程序运行时间检验结果的可行性与实时性。
  validation: 对给定的6对起讫站点分别计算三种目标下的最优路线，检查所得路线是否由实际直达线路和合法换乘站点连接，且均能在3次以内换乘到达；对“用时最短”方案以相邻两次递推矩阵相等作为收敛判据，对“换乘最少”方案以首次出现有限可达值确定最少换乘层数；同时测试程序效率，在预先存储直达矩阵后单次点对查询约需1至2秒，以验证实时查询可行性，并通过公交网络连通性保证算法有限步终止。
  visualization:
  - 乘客选线因素占比柱状图
  - 优化算法流程图
  - 公交与地铁有向网络示意图
  - 最优路线及换乘节点路径图
  pitfalls_avoided:
  - 避免直接对换乘次数、时间和费用进行加权求和，因为三类指标量纲不同，权重缺乏客观标定依据，而且固定权重可能掩盖乘客明确的首要偏好。
  - 避免把出行路程作为独立核心目标重复优化，因为路程与时间、费用呈明显正向关联，重复纳入会造成指标冗余和模型复杂化。
  - 避免直接对普通直达时间矩阵运行标准Floyd算法，因为其只累计车上运行时间，会遗漏候车时间和换乘步行时间，从而得到实际总用时并非最短的路线。
  - 避免无限制枚举所有换乘方案，因为乘客通常难以接受过多换乘且组合数量会迅速增长；模型优先搜索3次及以下换乘，仅在仍不可达时继续扩展。
  - 避免在缺少站点空间关系时虚构不同名站点间换乘，前两问仅允许同名站点换乘；第三问在获得站间步行时间后才通过步行矩阵引入异名站接驳。
  - 避免每次查询都运行全点对三重循环Floyd算法，因为其复杂度为O(n^3)且不利于实时服务；实现时固定查询起点计算到其余站点的路线，将单次查询计算降至O(n^2)，并只保留当前矩阵及必要路径信息。
  - 避免将公交与地铁的候车、票价及接驳时间混为同一种权值，因为两种交通方式参数不同；模型分别设置候车时间并在扩展矩阵中显式加入公交地铁步行接驳成本。
  innovation_points:
  - 将多目标公交选线转化为三种具有明确优先级的字典序优化方案，在避免主观权重的同时满足不同乘客的个性化需求。
  - 把候车时间嵌入直达时间矩阵、把换乘步行时间表示为独立步行矩阵，并对Floyd最小加法运算进行递推改造，实现对换乘次数和实际总用时的联合计算。
  - 利用换乘层数递推的首次可达性确定最少换乘次数，并利用矩阵不再变化作为最短时间搜索的停止条件。
  - 通过步行矩阵与乘车矩阵交替进行Floyd运算，统一表示包含多次步行接驳和乘车的组合路线。
  - 采用矩阵扩充方式将地铁无缝并入公交网络，使原有算法可复用于多模式公共交通路径规划。
  - 针对实时查询场景采用固定起点、预存直达矩阵和滚动保存当前矩阵的工程化优化，使单次查询达到1至2秒的响应水平。
- id: D22022011_阎发静_周靖_杨峰_D22022011_阎发静_周靖_杨峰
  source_paper: D22022011_阎发静_周靖_杨峰 D22022011_阎发静_周靖_杨峰_D22022011_阎发静_周靖_杨峰
  problem_type: 优化+分类聚类+统计分析
  keywords:
  - 多目标规划
  - 快速最优分割
  - 等步距下降迭代
  context: 针对盒装药品规格和日需求量差异，在防止药盒重叠、侧翻及旋转并满足储药柜尺寸约束的条件下，优化隔板间距类型、空间冗余和储药柜数量。
  models:
  - name: 最少竖向隔板间距类型优化模型
    role: 确定竖向隔板间距类型的理论最少数量及各类型对应的药盒宽度区间。
    why: 药槽宽度不仅要容纳药盒及2 mm间隙，还必须小于药盒宽度的两倍以及正面、底面对角线，以避免并排重叠、侧翻和水平旋转，因此需在几何安全约束下最小化类型数。
  - name: 多目标规划模型
    role: 同时优化总宽度冗余和竖向隔板间距类型数量。
    why: 增加间距类型可减少宽度冗余，但会提高加工成本并降低通用性，两个目标相互冲突，需要通过多目标优化寻找折中方案。
  - name: 快速最优分割模型
    role: 将按宽度排序的药盒规格划分为若干连续区间，并以总变差为指标快速确定较优分组。
    why: 药盒宽度是有序数据，适合采用有序样本分割；使用中点二分策略可降低穷举所有分割位置的计算量，提高分组效率。
  - name: 基于频数的邻近类型合并模型
    role: 根据各类包含的药盒规格数量，将低频间距类型并入相邻类型，把初始16类优化为12类。
    why: 仅按总变差得到的分类可能包含使用频率很低的槽型，保留这些类型会增加加工成本；邻近合并可在冗余增幅有限的情况下增强储药槽适应性。
  - name: 等步距下降迭代模型
    role: 在1.5 m最大有效高度约束下确定横向隔板间距类型，使总平面冗余和横向类型数取得平衡。
    why: 横向间距类型数与高度冗余、平面冗余同样存在冲突，以2 mm最小间隙为步长逐步调整候选高度，便于搜索满足高度约束的离散设计方案。
  - name: 储药槽容量与正面面积映射模型
    role: 依据药槽长度、药盒长度和最大日需求量计算各药品所需槽数，再将三维配置映射为正面面积以估算最少储药柜数量。
    why: 每槽可容纳药盒数可由长度关系直接确定，所需槽数必须向上取整；将复杂的三维排布转化为二维正面面积汇总，可显著降低柜体数量计算难度。
  solution_flow: 读取药盒长、宽、高及最大日需求量数据并按宽度整理→依据2 mm间隙和防重叠、防侧翻、防旋转条件计算每种药盒允许的药槽宽度范围→建立类型数最小化模型得到4类理论极简方案→建立宽度冗余与类型数的多目标规划，并利用快速最优分割和总变差求得16类初始方案→统计各类型样本频数并合并低频邻近类型，形成12类实用方案→以2
    mm为步长迭代横向间距，在1.5 m有效高度约束下获得13类横向间距→根据1.5 m槽长计算单槽容量和各药品所需槽数→汇总各药品所占正面面积并与单柜有效正面面积比较，借助MATLAB求得至少需要2个储药柜→通过约束复核、频数统计和方案对比检查结果的可行性与合理性。
  validation: 采用内部可行性验证与方案对比验证：逐类检查药槽宽度是否满足2 mm间隙以及防并排重叠、防侧翻、防水平旋转的几何约束；检查横向方案是否满足1.5
    m最大有效高度；利用各类型药盒规格频数直方图识别低利用率槽型，并比较16类与合并后12类方案在加工复杂度、适应性和冗余增量之间的变化；最后复核每种药品的单槽容量、向上取整后的槽数及总正面面积是否覆盖最大日需求量。
  visualization:
  - 储药槽与药盒放置结构示意图
  - 隔板间距类型与药盒规格对应表
  - 各槽型对应药盒规格数量直方图
  - 等步距下降迭代过程示意图
  pitfalls_avoided:
  - 避免将所有药盒统一放入最大宽度药槽，因为过宽的空间可能使窄药盒并排重叠、侧翻或水平旋转，不能只考虑能否放入而忽略输送稳定性。
  - 避免只追求最少隔板类型，因为4类极简设计会带来较大的宽度冗余；同时也避免为每种宽度单独设槽，因为这会显著增加加工成本并降低槽型通用性。
  - 避免机械保留最优分割产生的所有类别，因为部分类型仅覆盖极少量药盒，实际制造收益低；通过频数统计将其并入邻近类型，可减少不必要的槽型。
  - 避免忽略传送装置占用的0.5 m高度，因为储药柜总高虽不超过2 m，但真正可用于横向分层的有效高度只有1.5 m。
  - 避免用普通除法直接作为储药槽数量，因为日需求量不能由不足一个完整槽的容量满足，所需槽数必须向上取整。
  innovation_points:
  - 将防并排重叠、防侧翻和防水平旋转要求转化为药槽宽度小于两倍药盒宽度、正面对角线和底面对角线的显式几何约束。
  - 将多目标规划、快速有序分割和低频类别邻近合并结合起来，先获得统计意义上的细分方案，再依据制造成本和适应性进行工程化简化。
  - 采用2 mm等步距下降迭代处理横向隔板的离散间距选择，使最小安全间隙、总平面冗余、类型数量和有效高度约束能够统一考虑。
  - 将储药柜三维装载问题映射为正面面积配置问题，在保留宽度、高度和槽数需求信息的同时降低计算复杂度。
- id: '20121784_20121784'
  source_paper: 20121784 20121784_20121784
  problem_type: 优化+仿真
  keywords:
  - 方位角
  - 最佳倾角
  - 松弛解法
  context: 基于山西大同典型年气象数据，在建筑尺寸、电池组件刚性铺设和逆变器电气约束下，优化太阳能小屋的光伏组件布置、安装角度及建筑外形，以提高35年发电收益并缩短投资回收期。
  models:
  - name: Hay斜面太阳辐射模型
    role: 将水平面直射、散射和总辐射数据转换为不同倾角与朝向表面上的太阳辐射量。
    why: 屋顶斜面的辐射数据未直接给出，必须结合纬度、赤纬角、时角、倾角和方位角计算其有效辐射量。
  - name: 分段光电转换模型
    role: 根据不同类型电池的启动辐照阈值、弱光响应和转换效率，计算各型号组件在不同建筑表面上的年发电量。
    why: 不同类型电池对低辐照强度的响应范围不同，不能简单使用年总辐射量乘以固定效率。
  - name: 光伏组件整数规划模型
    role: 以发电量最大、单位发电成本最小或35年利润最大为目标，确定各表面应选择的组件型号及整数数量。
    why: 组件数量具有整数性，且受到有效铺设面积、组件成本和投资回收要求等约束，适合采用整数优化。
  - name: 置换松弛与实际排布模型
    role: 先忽略组件不可裁剪和门窗避让等几何细节，求取理论最优上界与优选组件类型，再通过实际刚性排布得到可行方案。
    why: 二维刚性组件排样及门窗避障难以直接转化为简单数学约束，松弛模型可降低求解难度，并为实际排布提供上界和搜索方向。
  - name: 逆变器选型与串并联优化模型
    role: 在逆变器容量、输入电压、组件串联数量及并联支路电压差约束下，使逆变器总投资最小。
    why: 组件铺设方案只有满足逆变器工作电压和容量范围才能实际运行，同时合理分组可降低设备成本。
  - name: 倾角—方位角逐步搜索模型
    role: 先固定方位角搜索最佳倾角，再联合调整倾角和方位角，以年辐射量或发电量最大确定架空安装参数。
    why: 倾角与方位角共同影响入射辐射，逐步搜索可以降低二维连续优化的复杂度并获得近似最优安装方向。
  - name: 太阳能小屋尺寸优化模型
    role: 在建筑规范约束下，以理想收益最大为目标优化小屋长、宽、高及屋顶有效受光面积，再结合实际组件排布修正设计。
    why: 第三问同时涉及建筑形状与光伏铺设，扩大高辐射屋顶面积并采用优化朝向和倾角可显著提高全生命周期收益。
  - name: 全寿命周期经济效益模型
    role: 分阶段考虑组件发电衰减，计算35年发电量、售电收入、净收益和投资回收年限。
    why: 光伏组件输出会随使用年限下降，仅比较首年发电量无法准确判断长期经济可行性。
  solution_flow: 读取大同市逐时典型年辐射数据、建筑尺寸、门窗位置、组件和逆变器参数→利用Hay模型计算屋顶及各立面的年辐射量→按辐照阈值、转换效率和组件面积计算各型号组件在各表面的年发电量与性价比→建立面积松弛的整数规划，获得理论最优上界和优选组件类型→根据组件刚性尺寸、门窗避让和建筑边界进行实际排布→依据功率、电压和并联电压差约束优化串并联分组及逆变器选型→通过逐步搜索确定架空安装的最佳倾角36.6°和方位角7.6°→在建筑要求下优化小屋尺寸并重新排布→分阶段计入发电衰减，计算35年总发电量、净收益和回收期→比较贴附、架空及重新设计三种方案并检验经济可行性。
  validation: 以松弛整数规划得到的理论最优值作为可行方案的上界，将实际刚性排布的组件数量和收益与该上界比较，差距越小说明排布越接近最优；同时逐面核验组件不覆盖门窗、数量为整数、不同表面不混接、异型号组件不串联、逆变器容量与输入电压满足要求，并通过35年分阶段发电衰减和现金流计算检查各铺设面能否在寿命期内回收投资；最后比较贴附方案、最佳角度架空方案和重新设计小屋方案的总发电量、收益与回收期，验证优化改进的有效性。
  visualization:
  - 小屋外形及屋顶倾角示意图
  - 各外表面光伏组件二维铺设阵列图
  - 组件串并联连接与逆变器控制范围示意图
  - 不同方案35年发电量与经济效益对比表
  - 分年限发电量及累计收益表
  pitfalls_avoided:
  - 避免直接将水平面辐射量用于坡屋顶，因为斜面接收辐射受倾角、朝向、日出日落时角和地面反射影响，直接套用会系统性高估或低估发电量。
  - 避免忽略不同电池的最低工作辐照阈值，因为单晶硅、多晶硅和薄膜电池的弱光响应不同，低辐照时仍按额定效率计算会夸大发电量。
  - 避免把光伏组件视为可任意分割的连续面积，因为组件具有固定长宽且不能裁剪，还需避开门窗；论文先用面积松弛求上界，再进行实际刚性排布。
  - 避免仅追求最大发电量而忽略投资成本，因为高效率组件未必具有更高全寿命周期利润，故同时考察单位发电成本、35年净收益和回收期。
  - 避免将不同建筑表面上的组件直接串并联，因为不同朝向造成工作状态不一致且题目明确禁止跨表面连接，故各表面分别分组和配置逆变器。
  - 避免不同型号组件随意串联或并联电压失配，因为异型号串联不符合约束，并联支路电压差过大会导致失配损失，模型将并联电压差限制在10%以内。
  - 避免逆变器只按总功率选型，因为逆变器还受直流输入电压范围和最大容量限制，必须同步确定每串组件数量、并联支路数及逆变器规格。
  - 避免在低辐射表面盲目满铺，因为北立面、北屋顶及部分立面可能在35年内无法回收组件和逆变器成本，应通过逐面经济性筛选决定是否铺设。
  - 避免用首年发电量线性外推35年，因为组件存在分阶段衰减，论文按1—10年、11—25年和26—35年分别计算发电量与收益。
  innovation_points:
  - 采用“先将实际问题数学化、再将数学结果实际化”的置换松弛思路，以连续面积约束下的整数规划给出理论上界和组件类型，再通过刚性排样构造接近上界的可行方案。
  - 把辐射计算、组件弱光响应、几何排布、串并联方式、逆变器选型和35年经济性纳入统一的分层优化框架，而不是只优化组件面积或瞬时发电量。
  - 通过先固定方位角优化倾角、再联合调整方向参数的逐步搜索方法，得到架空安装的最佳倾角和方位角，并将背阳屋顶拓展为连续有效受光面。
  - 在小屋重新设计中，以高辐射屋顶为核心，将建筑长宽高优化与最佳安装角度、实际组件排布联动，实现建筑形态和光伏系统的一体化设计。
- id: 2017_C002
  source_paper: 2017 2017_C002
  problem_type: 统计分析+预测+综合评价
  keywords:
  - 比色法
  - 灰度降维
  - 相关性与回归分析
  context: 利用照片中的RGB、HSV颜色读数建立物质浓度识别模型，并评价实验数据的准确性及分析数据量和颜色维度对模型的影响。
  models:
  - name: RGB-HSV颜色空间转换模型
    role: 根据RGB读数反算色调和饱和度，与原始H、S数据比较，检查颜色数据的单位、量纲、取值范围及记录错误。
    why: RGB与HSV可相互转换，利用两套颜色体系之间的内在一致性能够逐条检验数据质量，并识别H、S颠倒或量程不一致等问题。
  - name: Pearson相关性分析模型
    role: 筛选与浓度显著相关的颜色变量，并判断不同物质适合使用灰度、单个颜色通道还是二分类关系建模。
    why: 颜色读数和浓度均为连续变量，Pearson相关系数及其显著性检验可用于识别线性关联的方向、强度和统计显著性。
  - name: 灰度特征模型
    role: 使用HD=0.2989R+0.587G+0.114B将高度相关的RGB变量压缩为单一颜色特征，作为浓度回归的解释变量。
    why: RGB通道之间存在较强自相关性，直接进行多元回归容易产生多重共线性；灰度既保留整体亮度信息，又能降低模型维度、提高稳定性。
  - name: 一元线性回归模型
    role: 分别建立组胺、溴酸钾、工业碱和奶中尿素的颜色特征到浓度的定量预测关系，其中前三者主要使用灰度，奶中尿素使用B通道。
    why: 经相关性分析后，目标浓度与筛选出的颜色特征具有显著近似线性关系，一元回归参数少、解释性强，适合样本量较小的数据。
  - name: 分段回归与阈值判别模型
    role: 针对工业碱只在较高浓度区间颜色变化明显的现象限定灰度适用范围，并针对硫酸铝钾建立是否含有该物质的阈值分类规则。
    why: 部分物质在低浓度区间存在颜色响应不敏感或平台效应，使用全区间统一线性模型会削弱相关性；阈值或分段建模更符合实际响应特征。
  - name: 多元Logit修正模型
    role: 对附件2中线性回归误差较大的浓度预测结果进行非线性修正。
    why: 当颜色响应与浓度不满足全局线性关系时，Logit形式可以描述具有上下界或饱和趋势的非线性变化，从而降低拟合误差。
  - name: 指数回归模型
    role: 作为附件2线性模型的替代或修正模型，拟合浓度与灰度之间的非线性关系。
    why: 比色反应可能呈现随浓度增加而衰减、增长或逐渐饱和的非线性特征，指数模型比简单线性模型具有更合适的曲率表达能力。
  - name: 三准则数据质量综合评价模型
    role: 从单条记录准确性、同浓度重复实验稳定性和不同浓度可区分性三个层面评价数据质量。
    why: 仅凭单一误差指标无法同时反映颜色体系一致性、重复性和浓度辨识能力，因此结合RGB-HS吻合度、变异系数及组间离散度进行综合评价。
  solution_flow: 数据→按物质和浓度分组，绘制RGB色卡与颜色读数折线图，检查HS量程、方向和记录一致性，对同浓度重复观测求均值→通过RGB-HSV转换检验数据并计算灰度，使用Pearson相关分析筛选显著颜色特征，同时检查RGB通道间自相关性→根据物质响应特点选择灰度线性回归、单通道线性回归、分段回归或阈值判别模型→采用最小二乘法估计斜率、截距、适用区间和分类阈值，并对附件2进一步拟合Logit和指数模型→输出待测浓度或物质存在性判断→通过显著性检验、相关系数、RMSE、拟合图和三准则数据质量评价验证模型，并比较不同数据量与颜色维度下的稳定性。
  validation: 首先利用RGB-HSV转换关系逐条核验原始H、S数据，发现量程、方向或字段错误后进行更正；其次用Pearson相关系数及p值检验特征与浓度关系，用回归方程整体显著性和回归系数显著性检验模型有效性；再通过拟合曲线、残差或预测误差图及RMSE评价线性模型误差，并与Logit、指数模型比较；最后以同物同浓度的变异系数检验重复稳定性，以同物异浓度的离散度检验颜色区分能力，同时明确分段模型和阈值模型的适用范围。
  visualization:
  - RGB色卡对比图
  - 浓度-颜色通道折线图
  - 浓度-灰度散点图及回归拟合曲线
  - 预测值与实测值对比图
  - 残差或误差分布图
  pitfalls_avoided:
  - 避免将R、G、B三个高度相关的通道直接同时用于普通多元回归，因为强多重共线性会使回归系数不稳定、解释失真；改用加权灰度进行降维，只有灰度相关性较弱时才选择显著的单通道。
  - 避免直接相信附件中的H、S字段，因为HSV取值范围、单位以及字段顺序可能与标准定义不一致；通过RGB-HSV反算发现H、S方向或量程异常，并在更正后再建模。
  - 避免对所有浓度区间强行建立同一个线性模型，因为工业碱低浓度段颜色变化极小、硫酸铝钾主要只能区分有无物质；因此采用限定适用域的分段回归或阈值分类。
  - 避免仅凭肉眼观察色卡判断相关性，因为人眼对部分色差不敏感且存在主观偏差；将可视化与Pearson显著性检验、回归检验结合。
  - 避免把重复实验记录直接当成完全独立样本，因为同浓度重复观测可能造成伪重复并影响参数估计；先检查变异系数和极差，在重复性较好时取均值建模。
  - 避免以相关系数高直接等同于模型预测准确，因为高相关不代表残差足够小或函数形式正确；进一步使用RMSE、误差图以及线性、Logit和指数模型的对比进行验证。
  innovation_points:
  - 构建RGB-HS吻合度、同物同浓度变异系数和同物异浓度离散度组成的三层数据质量评价体系，同时覆盖单条数据正确性、重复性和浓度可辨识性。
  - 依据不同物质的颜色响应特征采用差异化建模策略：灰度回归、单通道回归、分段回归和存在性阈值判别，而非使用统一模型处理全部物质。
  - 将颜色空间知识与统计建模结合，先通过RGB-HSV转换进行数据纠错，再利用灰度降维缓解RGB通道共线性。
  - 在线性模型误差较大时引入Logit和指数非线性模型进行修正，并讨论数据量及颜色维度对异常值识别、模型稳定性和预测精度的影响。
- id: 2012_A301
  source_paper: 2012 2012_A301
  problem_type: 综合评价+分类聚类+统计分析
  keywords:
  - 排序检验
  - Wilcoxon符号秩检验
  - TOPSIS秩和排序
  - 主成分分析
  - 逐步回归
  context: 基于评酒员感官评分以及酿酒葡萄、葡萄酒的理化与芳香指标，检验评价差异与可信度，并完成葡萄分级及葡萄酒质量影响关系分析。
  models:
  - name: 排序检验与秩和综合模型
    role: 将不同评酒员对酒样的总评分转换为秩次并汇总为样品秩和，形成各组葡萄酒的综合质量排序。
    why: 评分样本量较小且分布形式难以确定，秩次方法不依赖正态分布，并能减弱评酒员评分尺度差异和异常值的影响。
  - name: Wilcoxon配对符号秩检验
    role: 检验两组评酒员对同一批红、白葡萄酒所得综合排序是否存在显著性差异。
    why: 两组结果属于同一样品上的配对观测，且评分分布未知，使用非参数配对检验比参数均值检验更稳健。
  - name: 组内方差与理想排序方差可信度模型
    role: 分别比较各组评酒员排序的集中程度，以及各组综合排序与20名评酒员共同形成的理想排序之间的偏差，以判断评价可信度。
    why: 当两组评价不存在显著差异时，仅靠显著性检验不能区分优劣，需要以组内一致性和对总体共识排序的接近程度作为可信度依据。
  - name: 芳香指标相关性筛选模型
    role: 计算芳香物质含量与香气感官评分之间的相关系数，保留与香气关系较强的芳香成分并并入葡萄理化指标体系。
    why: 芳香物质种类多且存在缺失和弱相关指标，先筛选可以减少噪声、降低后续综合评价的冗余。
  - name: 基于理想点的TOPSIS秩和排序模型
    role: 以感官评价最优酒样对应的葡萄为理想点，计算各葡萄在每项理化指标上与理想点的接近程度，再对各指标秩次求和得到综合排序。
    why: 指标数量多、量纲和数量级差异明显，且部分指标难以直接判断正向或负向；转换为相对理想样本的距离和秩次后可统一比较。
  - name: 基于多重比较的统计分组模型
    role: 依据葡萄综合秩和及给定置信水平下的临界秩差，对样品进行显著性比较并划分质量等级。
    why: 单纯按排序等距切分缺少统计依据，多重比较能够识别秩和差异不显著的样品群，使分级兼顾排序结果与统计显著性。
  - name: 主成分分析模型
    role: 分别对酿酒葡萄和葡萄酒的高维理化指标进行降维，提取累计方差贡献率超过80%的主成分并解释主要成分含义。
    why: 原始指标数量多、相关性强，直接回归容易出现多重共线性和参数过多问题，主成分可形成较少且相互正交的综合变量。
  - name: 主成分逐步回归模型
    role: 以葡萄主成分为自变量、葡萄酒主成分为因变量建立多个回归方程，刻画葡萄成分与葡萄酒总酚、色泽和白藜芦醇等指标之间的联系。
    why: 研究对象是多变量对多变量关系，先降维再逐步回归可以筛除解释能力弱的主成分，并获得较简洁的关系表达式。
  - name: 秩和相关性与变权综合评价模型
    role: 将葡萄理化指标、葡萄酒理化指标及质量评分统一转换为秩和排序，分析其相关性，并调整指标权重检验仅凭理化指标评价葡萄酒质量的可行性。
    why: 感官评分与化学指标的单位和数据结构不同，直接比较不合理；秩化与变权分析可统一尺度并考察不同指标组合对质量排序的解释能力。
  solution_flow: 数据→汇总每位评酒员的外观、香气、口感和整体评分，对酒样进行平均秩次与秩和排序，并处理并列名次和缺失较多的芳香指标→采用Wilcoxon配对符号秩检验判断两组评价差异，再以组内方差和相对理想排序方差选择可信组→将香气评分与芳香物质做相关筛选，以最佳感官酒样对应葡萄为理想点，计算各理化指标的绝对接近度并转化为秩和→根据多重比较临界秩差进行统计分组，得到红葡萄五级、白葡萄四级→对葡萄和葡萄酒理化指标实施主成分分析，以累计贡献率超过80%确定主成分数，再进行逐步回归→统一构造葡萄、葡萄酒理化指标及质量评分的秩和，开展相关性和变权分析→通过显著性水平比较、两种可信度评价结果一致性及相关性结果验证模型结论。
  validation: 首先在0.05和0.01两个显著性水平下进行Wilcoxon检验，红、白葡萄酒两组评价的p值分别为0.914和0.859，均不拒绝无差异假设，说明结论对显著性水平具有稳定性；其次同时采用组内平均方差和相对20名评酒员理想排序的方差评价可信度，两种方法均得到红葡萄酒第一组更可信、白葡萄酒第二组更可信，构成交叉验证；主成分数量以累计方差贡献率超过80%为保留标准；葡萄分级采用99%置信水平下的多重比较临界秩差控制组间显著性；最后通过理化指标综合秩和与质量秩和的相关性及不同权重方案的结果，检验理化指标评价质量的可行性和稳健性。
  visualization:
  - 两组评酒员综合秩次折线对比图
  - 两组排序与理想排序对比图
  - 多重比较秩和划线分组图
  - 组内方差及理想排序方差对比表
  - 主成分贡献率与载荷表
  - 相关系数筛选表
  pitfalls_avoided:
  - 避免在小样本且评分总体分布未知时直接使用配对t检验或方差齐性检验，因为正态性和方差条件可能不满足，改用Wilcoxon符号秩检验及基于排序偏差的可信度评价。
  - 避免直接比较不同评酒员的原始分数，因为评酒员可能存在评分尺度宽严差异；先在每位评酒员内部排序，并对并列样品取平均秩次，再进行秩和汇总。
  - 避免将无显著差异误解为两组可信度完全相同，因为显著性检验只能说明组间差异证据不足；进一步比较组内一致性和相对共同理想排序的偏差以区分可信程度。
  - 避免把量纲、数量级和方向含义不同的理化指标直接相加，因为这会使大数值指标支配结果；通过理想点距离和秩次转换将异质指标统一到同一排序尺度。
  - 避免在芳香物质数量很多、缺失严重的情况下全部纳入评价，因为弱相关和高缺失变量会引入噪声；先剔除缺失较多成分，再依据与香气评分的相关程度筛选。
  - 避免对大量且高度相关的葡萄与葡萄酒指标直接做多元回归，因为样本量有限时容易产生多重共线性和过拟合；先用主成分分析降维，再以逐步回归建立关系。
  - 避免仅按名次或固定样本数量机械分级，因为相邻样品可能不存在显著差异；利用多重比较的临界秩差划分统计同质组，并尽量减少对无显著差异横线的破坏。
  innovation_points:
  - 将感官质量评分、葡萄理化指标和葡萄酒理化指标逐步转换为统一的秩和排序，消除量纲、数量级和评分尺度差异，使多源异构数据能够在同一框架下比较。
  - 以感官评价最优酒样对应的葡萄作为数据驱动的理想点，将葡萄理化指标与葡萄酒感官质量直接关联，并通过接近度秩和实现综合分级。
  - 采用组内方差和相对20名评酒员共同理想排序的方差两种方法交叉判断可信度，增强评价组选择结论的稳健性。
  - 将非参数显著性检验、TOPSIS思想、多重比较、主成分分析和逐步回归串联，形成从评价一致性、样品分级到指标关系解释和质量可评价性论证的完整建模链条。
- id: A题_09A3
  source_paper: A题 A题_09A3
  problem_type: 优化+仿真+综合评价
  keywords:
  - 驱动电流控制
  - 能量等效
  - 时延误差
  context: 针对车辆制动器试验台，通过飞轮机械惯量与电动机动态补偿共同模拟车辆制动过程，并以能量误差最小为目标设计驱动电流控制方法。
  models:
  - name: 平动—转动能量等效模型
    role: 将车辆载荷的平动动能折算为试验台主轴及飞轮的等效转动惯量。
    why: 路试与台架试验的运动形式不同，以动能相等作为等效原则可建立车辆质量、车轮半径与试验台转动惯量之间的联系。
  - name: 飞轮组合与惯量补偿模型
    role: 枚举飞轮取用组合，计算机械惯量并确定电动机需要补偿的正、负惯量。
    why: 每个飞轮只有取用或不取用两种状态，适合用0-1变量描述，并可从有限组合中选择最接近目标等效惯量的机械配置。
  - name: 基于能量守恒的驱动电流控制基本模型
    role: 建立制动扭矩、等效惯量、机械惯量、电动机扭矩和驱动电流之间的解析关系。
    why: 制动过程本质上是动能耗散与电动机能量补偿过程，结合扭矩—电流线性关系可得到依赖可观测制动扭矩的电流控制公式。
  - name: 能量误差综合评价模型
    role: 以路试制动耗能与试验台制动器耗能之差评价控制方法的模拟精度。
    why: 仅比较瞬时电流或扭矩不能反映整个制动过程的一致性，绝对能量误差和相对能量误差能够衡量全过程累计偏差。
  - name: 基于前一时段观测量的离散控制模型
    role: 利用上一采样时刻的制动扭矩计算当前采样时段的驱动电流，实现可执行的计算机过程控制。
    why: 当前时刻真实扭矩在控制量生成前不可直接获得，而上一时刻扭矩已被观测，采用离散递推便于实时实现。
  - name: Logistic趋势—变幅余弦制动扭矩拟合模型
    role: 拟合制动扭矩随时间、角速度和主轴相位的变化规律，为闭环计算机仿真提供扭矩生成函数。
    why: 实测扭矩整体呈S形增长并叠加与转速和相位有关的振荡，Logistic函数可描述趋势项，变幅余弦项可描述周期波动。
  - name: 反馈修正驱动电流控制模型
    role: 根据驱动扭矩与理想补偿扭矩的偏差构造反馈因子，修正下一时段的电流设定值。
    why: 单纯使用上一时段扭矩会产生固定采样周期的时延，引入反馈可利用已发生的控制偏差降低累计能量误差。
  - name: 基于Laplace变换的时延补偿模型
    role: 在频域中识别时移因子并设计高阶预测补偿方法，以从结构上减弱离散控制的时延误差。
    why: 上一时段数据替代当前数据会在Laplace域引入指数时移因子，频域展开与高阶近似能够比简单反馈更直接地补偿时延。
  - name: 多目标规划拓展模型
    role: 综合协调能量误差、控制稳定性和电流波动等多个控制目标。
    why: 单独追求能量误差最小可能导致反馈过强和电流振荡，多目标规划能够表达精度与稳定性之间的权衡。
  - name: 基于非线性方程的迭代求解模型
    role: 对电流、扭矩和角速度之间的非线性耦合关系进行逐步迭代求解。
    why: 实际制动扭矩受时间、转速和相位共同影响，难以获得完整闭式解，迭代方法适合处理此类动态非线性耦合问题。
  solution_flow: 输入车辆载荷、车轮半径、飞轮尺寸、钢材密度、基础惯量及扭矩—转速观测数据→依据平动与转动动能相等计算目标等效惯量→计算并枚举飞轮组合，确定机械惯量及电动机补偿惯量→由能量守恒和电流—扭矩比例关系推导理想驱动电流→用最小二乘法估计Logistic趋势—变幅余弦扭矩模型参数→按固定步长离散递推电流、角速度和制动扭矩→计算绝对与相对能量误差→通过Laplace变换识别一个采样周期的时延→加入反馈或高阶时延补偿并重新仿真→比较能量误差、稳定性和电流振荡后确定控制方案。
  validation: 采用多层验证：首先检查等效惯量、飞轮惯量和能量守恒关系的量纲及物理一致性；其次以拟合残差方均值检验制动扭矩函数的拟合效果；再次用全过程计算机递推仿真，将试验台制动耗能与目标路试耗能比较，计算绝对和相对能量误差；然后改变初始扭矩与初始转速进行稳定性和敏感性测试；最后比较原始离散控制、反馈控制及Laplace时延补偿方法的误差，并检查反馈系数增大时是否出现电流自激振荡。
  visualization:
  - 制动扭矩与转速随时间变化曲线
  - 实测扭矩与拟合扭矩对比图
  - 理想电流与设计电流时滞对比曲线
  - 离散仿真数据递推流程图
  - 反馈控制结构框图
  - 反馈系数—相对能量误差关系表或折线图
  pitfalls_avoided:
  - 避免直接把车辆质量当作试验台转动惯量；两者量纲和运动形式不同，必须通过线速度与角速度关系以及动能等效进行折算。
  - 避免只选择最接近目标惯量的飞轮组合而忽略负补偿情形；机械惯量既可能小于也可能大于目标惯量，因此电动机扭矩和电流必须允许正、负方向。
  - 避免仅用终点转速或单个时刻误差评价控制效果；瞬时误差可能相互累积或抵消，应对扭矩与角速度乘积进行全过程积分并计算相对能量误差。
  - 避免把上一采样时刻扭矩直接视为当前扭矩而不分析误差来源；该替代会引入时移因子并形成长度为一个采样周期的系统性滞后。
  - 避免只拟合制动扭矩的单调趋势而忽略周期波动；扭矩振幅受角速度影响、相位受主轴转角影响，遗漏振荡项会削弱仿真的真实性。
  - 避免为追求更小能量误差而无限增大反馈系数；反馈过强会使闭环系统产生自激振荡，造成驱动电流剧烈波动甚至失稳。
  - 避免在有限时间步长下无条件忽略高阶项；忽略角速度增量二次项依赖于采样间隔足够小，因此需要通过步长设置和仿真结果检查近似有效性。
  innovation_points:
  - 把车辆平动能量、试验台机械转动能量和电动机补偿能量统一到等效转动惯量框架中，使机械配置与电流控制能够协同设计。
  - 构造同时包含Logistic总体趋势、转速相关变幅和主轴相位振荡的制动扭矩模型，为动态闭环仿真提供较符合物理特征的输入。
  - 利用Laplace变换将离散观测控制的误差明确识别为指数时移因子，从机制上解释了一个采样周期的控制滞后。
  - 在基础滞后控制上引入反馈修正，将相对能量误差由0.219%进一步降低至约0.089%，同时讨论反馈精度与闭环稳定性的权衡。
  - 提出高阶Laplace时延补偿思路，在模型阶数足够大时使能量误差趋近于零，并进一步拓展到多目标规划和非线性迭代控制。
- id: B题_B长沙理工大学 张伯龙 刘举款 张芳
  source_paper: B题 B题_B长沙理工大学 张伯龙 刘举款 张芳
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 加权满意度
  - 双目标规划
  - 层次分析法
  - 二八原则
  - 学费优化
  context: 在高校培养经费需求与学生家庭支付能力相冲突的背景下，确定兼顾学校办学质量和学生可负担性的分专业最优学费标准。
  models:
  - name: 学生加权满意度模型
    role: 以毕业后预期收益与学费之比衡量教育性价比，并结合贫困生资助体系完善程度、二八原则权重和不同层次高校影响权重，计算学生对专业学费的综合满意度。
    why: 学生对学费的评价不仅取决于收费高低，还与预期收益、学校培养质量和贫困生获得资助的能力有关，因此需要构造多因素加权满意度函数。
  - name: 学校加权满意度模型
    role: 根据学费在学费、国家生均拨款和社会资助构成的培养投入中所占比例，度量各类学校对收费标准的满意度，并按不同类型高校数量占比进行加权。
    why: 学校倾向于通过较高学费获得充足培养经费，而不同类别高校的财政拨款、社会资助和代表性不同，需要进行分类计算和总体加权。
  - name: 层次分析法
    role: 由三类高校对学生满意度影响的重要性比较矩阵计算权向量，并用于汇总各类高校学生的满意度。
    why: 高校声誉和培养质量对学生满意度的影响难以直接量化，层次分析法能够将专家比较判断转化为可用于计算的权重，并可通过一致性检验控制判断质量。
  - name: 归一化综合评价模型
    role: 将学生满意度和学校满意度转换到统一尺度，形成可直接比较和组合的双方满意度指标。
    why: 两类满意度的含义、量纲和数值范围不同，若不归一化就直接相加或比较差异，会导致目标函数失真。
  - name: 双目标规划模型
    role: 同时最大化学生与学校满意度之和，并最小化双方满意度差的绝对值，在培养成本和家庭支付能力约束下确定最优学费。
    why: 仅追求总体满意度最大可能以牺牲某一方利益为代价，加入公平性目标后能够兼顾效率与利益均衡。
  - name: 加权和单目标转化模型
    role: 使用偏好系数将满意度总和最大化与满意度差异最小化两个目标合成为单目标函数，并调用 MATLAB 优化工具箱求解。
    why: 双目标问题通常不存在唯一的绝对最优解，引入偏好系数可表达决策者对总体效益与公平性的相对偏好，并便于数值优化。
  - name: 均匀分布参数估计
    role: 在只能获得各专业毕业生预期收益区间时，以区间均匀分布假设选取三类高校的代表性收益参数。
    why: 缺少区间内部概率差异信息时，均匀分布是信息不足条件下较为中性的参数化处理，可为满意度计算提供可操作的预期收益值。
  solution_flow: 收集各专业培养费用、国家生均拨款、社会资助、家庭可支配收入、毕业生预期工资、高校类别占比及资助体系数据→按二八原则构建普通学生与贫困生的学生满意度函数，并构建学校经费满意度函数→利用层次分析法确定高校类别影响权重，利用高校数量占比确定学校侧权重，对双方满意度进行归一化→设置资助体系完善系数、收益期望和偏好系数等参数→建立“满意度之和最大、满意度差最小”的双目标模型，并加入培养经费不低于培养成本、学费不高于家庭可支配收入的约束→通过偏好系数将双目标转化为单目标，使用
    MATLAB 优化工具箱求出各专业最优学费→通过邻域比较、参数敏感性分析和层次分析一致性检验验证结果。
  validation: 首先在材料专业最优学费附近选取多组收费值，比较对应目标函数值，并用六次多项式拟合学费—满意度曲线，检查求得学费是否位于满意度峰值附近；其次采用控制变量法，分别改变资助体系完善程度、毕业生预期收益和偏好系数，考察最优学费及目标值的变化，评价模型稳定性和参数敏感性；最后计算判断矩阵的最大特征值、CI
    和 CR，得到 CR 小于 0.1，以验证层次分析权重具有可接受的一致性。
  visualization:
  - 学费—满意度拟合曲线图
  - 参数敏感性对比表
  - 各专业最优学费结果表
  - 培养费用分类统计表
  - 预期收益区间表
  pitfalls_avoided:
  - 避免只最大化学生与学校满意度之和，因为总和最大可能由一方满意度极高、另一方满意度极低造成；模型额外最小化双方满意度差，以降低利益失衡引发的社会不公平。
  - 避免将不同量纲和不同范围的学生满意度、学校满意度直接相加，因为这会使数值尺度较大的指标支配优化结果；论文先对两类满意度进行归一化。
  - 避免得到脱离现实支付能力或无法覆盖培养成本的学费，通过设置“学费、拨款与社会资助之和不低于培养费用”和“学费不高于家庭可支配收入”两类硬约束保证方案可行。
  - 避免主观构造高校类别权重后不做检查，通过 AHP 的 CI、RI 和 CR 一致性检验确认比较矩阵的不一致程度处于可接受范围。
  - 避免仅报告单组参数下的最优解而忽视参数不确定性，通过改变资助完善系数、收益期望和偏好系数开展控制变量敏感性分析。
  - 避免在缺少预期收益精确数据时任意选点，论文根据已知收益区间采用均匀分布假设生成代表值，使参数选取具有明确的统计依据。
  innovation_points:
  - 将高校学费定价描述为学生与学校两个利益主体之间兼顾总体效益和公平性的双目标满意度优化问题。
  - 把二八原则用于区分贫困生与非贫困生对整体学生满意度的贡献，突出少数支付困难学生在教育公平决策中的重要性。
  - 将毕业生预期收益、学校资助体系完善程度、高校层次和学费共同纳入学生满意度，以教育投资性价比刻画学生侧效用。
  - 综合使用层次分析权重、高校数量占比权重、归一化处理和偏好系数，把定性利益关系转化为可由 MATLAB 求解的定量学费标准。
  - 通过改变政策相关参数分析最优学费变化，使模型不仅能够给出收费结果，还可用于评估财政拨款、社会资助和学校资助政策的影响。
- id: B题_B长沙理工大学_高等教育学费的优化模型
  source_paper: B题 B题_B长沙理工大学_高等教育学费的优化模型
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 加权满意度
  - 双目标规划
  - 层次分析法
  - 二八原则
  - MATLAB优化
  context: 在高校培养成本、政府拨款、社会资助和家庭支付能力等约束下，兼顾学生与学校利益，为不同专业制定双方较为满意的最优学费标准。
  models:
  - name: 学生加权满意度模型
    role: 以预期收益与学费之比衡量教育性价比，并综合贫困生资助体系完善程度、学生群体权重和高校类别权重，形成学生侧满意度函数。
    why: 学生对学费的接受程度同时受就业收益、收费水平、学校培养质量和贫困生资助条件影响，采用加权满意度能够将这些异质因素统一量化。
  - name: 学校加权满意度模型
    role: 根据学费占学校生均教育投入来源的比例计算单类高校满意度，再按不同类别高校的数量占比加权汇总。
    why: 在政府生均拨款和社会资助相对固定时，学费收入越高越有利于覆盖培养成本，因此可用学费与总投入之比刻画学校侧满意度。
  - name: 层次分析法
    role: 通过三类高校的成对比较矩阵计算其对学生满意度影响的权重，并进行一致性检验。
    why: 不同层次高校在声誉、培养质量和就业收益方面影响不同，层次分析法适合把专家判断转化为可用于加权计算的定量权重。
  - name: 归一化综合评价模型
    role: 将学生满意度和学校满意度转换为统一、可比较的无量纲指标，为联合优化提供基础。
    why: 双方满意度的定义和量纲不同，若直接相加或比较会造成目标失真，归一化可以消除尺度差异。
  - name: 双目标学费优化模型
    role: 同时最大化学生与学校满意度之和，并最小化双方满意度差的绝对值，在成本覆盖和家庭支付能力约束下确定最优学费。
    why: 单纯最大化总体满意度可能牺牲其中一方，引入满意度差最小化目标可以兼顾社会效率与利益公平。
  - name: 加权和单目标转化模型
    role: 利用偏好系数将满意度总和最大化与满意度差最小化两个目标合成为单目标，并通过MATLAB优化工具箱求解。
    why: 双目标问题通常不存在唯一的绝对最优解，加权标量化能够表达决策者对总体效益和双方公平性的偏好，并便于数值计算。
  - name: 均匀分布参数估计
    role: 在只能获得各专业毕业生预期工资区间时，以区间均匀分布假设选取不同高校类别的预期收益参数。
    why: 缺乏区间内部概率分布信息时，均匀分布可作为信息不足条件下的简化估计，使预期收益能够进入满意度函数。
  solution_flow: 收集各专业培养费用、不同类别高校生均拨款、社会资助、家庭可支配收入、毕业生预期工资和高校数量占比等数据→基于二八原则构造普通学生与贫困生的学生满意度函数，并构造学校满意度函数→利用层次分析法确定高校类别影响权重，以高校数量占比确定学校侧权重，对双方满意度归一化→建立“满意度之和最大、满意度差最小”的双目标规划，并加入教育投入覆盖培养成本和学费不超过家庭可支付收入的约束→设置资助完善度、预期收益和偏好系数等参数，将双目标加权转化为单目标→调用MATLAB优化工具箱求得各专业最优学费→通过邻域比较、敏感性分析、曲线拟合和判断矩阵一致性检验验证结果。
  validation: 首先在最优学费附近选取多组候选学费，重新计算目标函数值，并通过六次多项式拟合绘制学费—满意度曲线，检查求解值是否位于局部峰值附近；其次采用控制变量法，分别改变高校资助体系完善度、毕业生预期收益和偏好系数，分析最优学费及目标函数值的敏感性和稳定性；最后对层次分析判断矩阵计算最大特征值、CI和CR，得到CR小于0.1，以确认权重判断具有可接受的一致性。
  visualization:
  - 学费—满意度拟合曲线图
  - 不同专业最优学费对比表
  - 参数敏感性分析表
  - 培养费用分类统计表
  - 预期收益区间统计表
  pitfalls_avoided:
  - 避免直接将学生满意度与学校满意度相加，因为二者定义和尺度不同；先进行归一化处理可防止某一指标仅因数值量级较大而主导优化结果。
  - 避免只追求满意度总和最大而造成学生或学校一方利益被过度牺牲；增加双方满意度差绝对值最小化目标，以约束利益失衡和潜在社会矛盾。
  - 避免得到无法覆盖培养成本的低学费方案；设置“学费、政府生均拨款和社会资助之和不低于生均培养费用”的硬约束，保证高校教学投入具有基本财务可行性。
  - 避免得到超出居民支付能力的高学费方案；设置学费不高于多数家庭可支配收入对应上限的约束，保障方案的社会可接受性。
  - 避免未经检验直接采用主观构造的高校类别权重；对层次分析判断矩阵实施一致性检验，只有CR小于0.1时才接受所得权重。
  - 避免把单组参数下的最优值误认为普遍稳定结论；分别扰动预期收益、资助完善度和偏好系数，检验最优学费对关键假设的敏感程度。
  - 避免在缺少工资区间内部统计分布时任意选点；明确采用均匀分布作为信息不足条件下的简化假设，使参数选取规则可解释、可复现。
  innovation_points:
  - 将高校学费定价表述为学生与学校两个利益主体之间的满意度协调问题，同时考虑总体效益最大化与双方公平性。
  - 把二八原则用于贫困生群体权重设计，使人数较少但对学费高度敏感的学生在总体满意度中获得更高影响权重。
  - 将毕业后的个人预期收益与学费之比作为教育性价比指标，并把高校资助体系完善程度嵌入贫困生满意度函数。
  - 综合运用层次分析权重、高校数量占比权重、满意度归一化和多目标规划，将定性利益关系转化为可计算的专业学费标准。
  - 通过偏好系数构造可调节的单目标函数，使决策部门能够在总体满意度与利益均衡之间表达不同政策偏好。
- id: 01025004_刘桥_牟宇超_解中斌_01025004_刘桥_牟宇超_解中斌
  source_paper: 01025004_刘桥_牟宇超_解中斌 01025004_刘桥_牟宇超_解中斌_01025004_刘桥_牟宇超_解中斌
  problem_type: 优化+仿真
  keywords:
  - 空间解析几何
  - 运动学仿真
  - 多目标非线性规划
  - 最小二乘拟合
  - 静力学约束
  context: 针对由多根开槽木条和钢筋联动构成的平板折叠桌，建立其折叠运动模型并在稳固、节材和易加工要求下优化平板尺寸、钢筋位置及滑槽长度。
  models:
  - name: 空间解析几何运动学模型
    role: 将各桌腿木条抽象为定轴转动杆件，以最外侧桌腿端点高度为状态参数，推导各木条端点坐标、倾角和钢筋位置随折叠过程的变化关系。
    why: 桌腿分别在相互平行的平面内转动，并通过同一钢筋联动，几何约束明确，适合利用勾股定理、余弦定理和坐标变换获得可解析计算的运动方程。
  - name: 滑槽长度几何计算模型
    role: 计算钢筋在每根桌腿木条上的初始位置与最终位置，并以二者距离之差确定各木条所需的开槽长度。
    why: 钢筋沿滑槽单向运动，最大位移可直接转化为加工所需的最小槽长，从而把运动约束映射为具体加工参数。
  - name: 桌脚边缘线参数方程模型
    role: 令木条宽度趋于零，将离散桌脚端点推广为连续曲线，构造理想桌脚边缘线的三维参数方程。
    why: 实际桌脚边缘由有限个离散端点组成，连续化处理既能给出数学描述，也便于与实际折线及客户目标轮廓进行比较。
  - name: 多目标非线性规划模型
    role: 以降低重心、减少材料用量和控制桌腿数量为目标，联合优化平板长度、木条数量或宽度、钢筋位置比及相关加工参数。
    why: 稳定性、节材和加工便利性之间存在冲突，且端点坐标、槽长和重心关于设计变量呈非线性关系，因此适合建立带多类约束的多目标非线性规划模型。
  - name: 静力学稳定性约束模型
    role: 通过重心相对高度、最外侧桌脚着地条件、桌腿倾角与摩擦角关系以及截面强度要求限制优化可行域。
    why: 仅满足几何可折叠性不能保证桌子实际稳固，必须将受力平衡、防滑和支撑条件纳入设计约束。
  - name: 目标轮廓最小二乘拟合模型
    role: 以实际桌脚边缘点与客户给定桌脚边缘对应点之间距离的平方和为目标，优化钢筋位置并反算其他设计加工参数。
    why: 客户期望轮廓通常无法被联动机构完全精确实现，平方距离和可量化整体形状误差，并形成可数值求解的参数优化问题。
  - name: MATLAB三维动态仿真模型
    role: 根据各木条端点坐标随状态参数的变化生成折叠桌从平板到成桌状态的三维动态图和中间状态图。
    why: 动态仿真能够直观检查杆件联动、空间干涉和最终造型，并辅助验证解析运动方程的合理性。
  solution_flow: 输入平板尺寸、厚度、木条宽度、目标桌高和桌面轮廓等数据→依据桌面边界完成木条离散并计算各木条长度→建立钢筋联动下的空间几何运动方程，以外侧桌腿高度或转角作为过程参数→计算端点轨迹、倾角、钢筋位置和滑槽长度→建立包含几何可行性、滑槽边界、无干涉、桌脚着地、摩擦角及重心要求的多目标非线性规划模型→利用MATLAB图像法或数值搜索确定可行域和最优平板尺寸、钢筋位置及木条数量→对定制轮廓采用距离平方和最小化进行参数拟合→通过三维动态仿真、约束复核及理想曲线与实际离散边缘对比验证设计。
  validation: 首先将最终状态参数代入解析坐标方程，检查最外侧桌脚是否达到指定桌高并着地；其次验证钢筋全程单向滑动且不超出槽长、对称木条不相交、桌腿倾角不超过摩擦角等可行性条件；再将有限宽木条形成的实际桌脚端点或折线与连续参数方程生成的理想边缘线叠加比较，并用距离平方和衡量拟合误差；最后利用MATLAB三维动态仿真逐帧检查折叠过程是否连续、无干涉且最终形态符合设计要求。
  visualization:
  - 三维折叠过程动态图
  - 多时刻三维状态示意图
  - 桌脚边缘散点及折线图
  - 理想边缘参数曲线与实际端点对比图
  - 多目标优化可行域图
  - 平板切割与滑槽加工示意图
  pitfalls_avoided:
  - 没有把所有桌腿当作相互独立运动，而是利用钢筋固定于最外侧木条并在中间木条槽内滑动的联动关系建模，避免得到彼此不协调、机构无法装配的运动轨迹。
  - 先证明钢筋在滑槽内单向运动，再用初末位置差确定槽长，避免因忽略中间过程中的往复或极值位置而低估实际开槽长度。
  - 没有只优化材料用量，而是同时加入重心、摩擦角、着地、无干涉和滑槽边界约束，避免出现虽然省料但易滑倒、无法展开或无法加工的不可行方案。
  - 区分有限宽木条形成的离散桌脚边缘与木条宽度趋零后的理想连续曲线，避免将连续参数曲线误认为实际加工后能够完全实现的轮廓。
  - 利用对称性只计算部分木条后再镜像扩展，既减少计算量，又避免对称构件重复建模导致编号和坐标符号错误。
  - 对客户自定义轮廓采用整体距离平方和而非只匹配少数特征点，避免局部点吻合但整体桌脚形状偏差过大。
  innovation_points:
  - 以最外侧桌腿端点高度作为统一状态变量，把复杂钢筋联动机构转化为各木条端点坐标的显式函数，实现动态过程、加工参数和最终造型的一体化描述。
  - 将离散木条模型连续化，推导理想桌脚边缘线的三维参数方程，并与实际离散边缘进行误差对比。
  - 把稳固性、材料消耗和加工便利性统一纳入多目标非线性规划，同时融合运动学、几何学和静力学约束。
  - 建立面向客户任意桌面与桌脚轮廓的逆向设计模型，通过最小化轮廓距离反求钢筋位置、平板尺寸和滑槽参数，为折叠桌设计软件提供通用计算框架。
- id: B题_钻井布局模型
  source_paper: B题 B题_钻井布局模型
  problem_type: 优化
  keywords:
  - 网格布局
  - 近似M-N分解
  - 最大覆盖
  context: 在允许平移或旋转单位网格的条件下，确定网格布局，使误差容限内能够落在网格结点附近的旧井数量最大。
  models:
  - name: 单位网格折叠与正方形最大覆盖模型
    role: 解决网格方向固定时的旧井利用最大化问题。
    why: 旧井坐标平移整数个网格单位后，其相对最近网格结点的位置不变，因此可将所有点按坐标小数部分映射到同一单位网格，并将问题转化为边长为2ε的小正方形覆盖最多点的问题。
  - name: 近似M-N整数分解模型
    role: 利用旧井间欧氏距离筛选可能同时利用的井对及其候选网格位移。
    why: 网格平移和旋转会改变坐标但不改变点间欧氏距离；若两口井同时靠近网格结点，则其距离必须在2ε误差内接近某个sqrt(m²+n²)，其中m、n为整数。
  - name: 网格整数分解一致性模型
    role: 通过三角形闭合关系和多点向量一致性条件，筛除无法嵌入同一网格的候选井集合。
    why: 两两距离可近似整数分解只是必要条件，还需保证各边对应的整数向量满足环路分量和为零，从而确保所有候选结点属于同一个方向一致的网格坐标系。
  - name: 兼容图候选集合搜索模型
    role: 将满足两两近似M-N分解的井连接成兼容图，并搜索可能同时利用的较大井集合。
    why: 任何可同时利用的井集合在兼容图中必为团，先进行团式枚举、去重和三点一致性筛选，可显著缩小后续非线性优化的搜索范围。
  - name: 非线性约束可行性优化模型
    role: 对通过组合筛选的候选集合进行最终的充分必要判定。
    why: 构造候选网格结点坐标，使结点间距离严格等于所选整数分解对应的长度，同时要求每口旧井到对应结点的距离不超过ε；该模型能够排除仅满足近似距离条件但实际无法共同嵌入网格的伪解。
  solution_flow: 输入旧井坐标和误差ε→固定方向情形下取坐标小数部分并进行周期边界复制，枚举边长2ε的覆盖窗口→方向可变情形下计算全部井对距离及其近似M-N分解→建立井对兼容关系表并搜索两两兼容集合→利用三角形闭合条件和多点整数向量一致性条件逐层筛选→对剩余候选集合建立网格结点坐标的非线性约束优化模型→根据最优误差是否不超过ε判定可行性，并选择包含旧井数最多的网格布局。
  validation: 首先分别证明两井近似M-N分解条件、三点闭合条件、多点网格一致性条件以及最终非线性方程与误差不等式的必要性或充分必要性；其次用两两距离关系表、三角形一致性和多点闭合条件进行交叉筛选；最后将候选解代回结点间距离等式及旧井到结点的误差约束，只有最大偏差不超过ε的集合才被认定为可行。
  visualization:
  - 单位网格折叠与正方形覆盖示意图
  - 旧井两两近似M-N分解关系矩阵
  - 旧井点与候选网格结点匹配图
  - 三角形整数向量闭合示意图
  pitfalls_avoided:
  - 避免直接在连续的平移量和旋转角上盲目搜索，因为原点与方向均不确定会形成高维连续非凸问题；改用旋转平移下不变的欧氏距离进行离散化筛选。
  - 避免只检查两两距离即可近似表示为sqrt(m²+n²)，因为不同井对可能对应互不兼容的网格方向；进一步加入三角形环路闭合和多点整数分量一致性条件。
  - 避免单位网格取模后遗漏靠近边界的点，因为0与1在周期网格中等价；对距边界不超过ε的点进行周期映射或复制后再做覆盖统计。
  - 避免把必要条件误当成充分条件，因为近似M-N分解及三角形条件不能保证每口井均在ε范围内靠近同一组网格结点；最终使用非线性约束可行性模型作严格判定。
  - 避免直接穷举所有旧井子集和所有整数分解组合，因为组合数量增长迅速；先利用兼容关系、去重、三点条件和多点闭合条件逐层剪枝。
  innovation_points:
  - 抓住整数平移下相对网格结点位置不变的性质，将无限平面上的固定方向布局问题压缩到单个单位网格中的二维最大覆盖问题。
  - 抓住旋转和平移下点间欧氏距离不变的性质，以近似M-N分解将连续网格布局问题转化为有限的整数候选组合问题。
  - 建立从井对距离条件、三角形闭合条件到多点向量一致性条件的分层判定体系，实现由弱必要条件到强一致性条件的高效剪枝。
  - 将离散整数分解筛选与连续非线性可行性优化结合，兼顾候选搜索效率和最终判定的严格性。
- id: 2017_B104
  source_paper: 2017 2017_B104
  problem_type: 分类聚类+统计分析+预测+优化
  keywords:
  - K-means聚类
  - 多元线性回归
  - 贝叶斯-纳什均衡
  context: 针对移动互联网劳务众包平台，依据任务位置、会员分布与信誉等数据研究任务定价规律，并优化定价和任务打包方案以提高完成率、控制平台成本。
  models:
  - name: K-means空间聚类模型
    role: 根据会员或新任务的经纬度划分研究区域，并以聚类中心作为衡量任务偏僻程度的区域中心点。
    why: 任务和会员具有明显的城市集聚特征，先分区可以刻画地域异质性，避免使用单一全局中心造成距离特征失真。
  - name: 多元线性回归定价模型
    role: 以固定底价为基础，将任务偏僻程度、会员密度、任务密度和会员信誉分数密度作为解释变量，利用最小二乘法估计任务价格。
    why: 任务价格由多个可量化的空间与供需因素共同影响，线性模型结构清晰、参数可解释，并能从历史定价数据中识别主要影响方向和强度。
  - name: 局部空间密度模型
    role: 以任务点为圆心、1.5 km为半径，统计邻域内会员数和其他任务数，构造会员密度、任务密度及信誉密度特征。
    why: 会员对任务的响应主要受附近供给和竞争任务影响，局部邻域指标比全区域平均密度更能反映任务点周围的真实供需关系。
  - name: 贝叶斯-纳什均衡线性定价模型
    role: 描述平台报价与会员最低接受价格之间的博弈关系，将回归得到的期望价格变换为兼顾平台收益和会员接受意愿的新价格。
    why: 单纯回归只能复现历史定价规律，不能直接实现完成率与成本之间的权衡；均衡模型能够刻画双方信息不完全条件下的利益互动并优化报价。
  - name: 任务打包启发式优化模型
    role: 识别1.5 km邻域内至少存在两个其他任务的密集任务点，依据价格、完成概率和空间距离构造匹配指标，将三个任务组成任务包并重新定价。
    why: 集中任务存在路线协同和批量完成优势，合理打包可以降低会员单位出行成本、缓解领取限额约束，并进一步提高任务完成率。
  solution_flow: 数据→清洗会员异常记录并将任务、会员经纬度映射到地图→利用K-means划分空间区域并计算区域中心→在1.5 km邻域内统计会员数、任务数和信誉分数，构造偏僻程度、会员密度、任务密度及信誉密度特征→以65元为底价建立多元线性回归模型并用最小二乘法估计系数→使用已完成任务重新标定价格标准，将未完成任务代入并分析价格缺口→引入贝叶斯-纳什均衡得到优化定价并计算完成概率→识别密集任务、按匹配指标进行三任务打包和价格调整→将完整流程迁移至新项目，输出任务价格、平均成本和预计完成率。
  validation: 首先比较回归拟合价格与实际价格，并检查偏僻程度、会员密度和任务密度的系数符号是否符合经济含义；其次以已完成任务拟合的定价标准检验未完成任务，发现89%的未完成任务实际价格低于理论价格，从而验证低价解释；再次通过新旧方案对照评价优化效果，新方案总价格提高约12%而任务完成情况提高约23%，打包后完成率在第二问方案基础上再提高约3.7%；最后将模型迁移到附件三的新区域进行外部应用检验，得到平均价格69.4元和预计完成率93.7%。
  visualization:
  - 任务与会员经纬度地图散点图
  - K-means聚类分区图
  - 回归拟合价格与实际价格对比图
  - 未完成任务理论价格与实际价格差值图
  - 新旧定价方案完成率对比图
  - 打包任务空间分布图
  pitfalls_avoided:
  - 在聚类和密度统计前剔除位于研究城市之外、距离目标区域过远以及编号B1174等错误会员记录，避免异常坐标拉偏聚类中心并虚增局部会员供给。
  - 没有直接使用全省唯一中心衡量任务偏僻程度，而是按会员空间分布聚类后分别计算区域中心，避免广州、深圳等多中心城市群造成距离指标失真。
  - 没有仅以邻域会员数量判断任务吸引力，而是加入邻域其他任务数量对会员密度进行修正，避免忽略任务之间竞争而高估可服务会员数量。
  - 没有把历史回归价格直接当作最优价格，而是进一步引入平台与会员的报价博弈，在会员接受意愿和平台成本之间寻求均衡，避免只拟合历史规则却无法提升完成率。
  - 打包过程中规定已进入任务包的点不再参与后续组合，避免同一任务被重复打包而导致价格、完成率和任务数量重复计算。
  - 对密集任务并非简单按距离任意合并，而是综合价格、预计完成概率和距离构造匹配指标，避免将吸引力差异过大或空间协同性不足的任务强行组合。
  innovation_points:
  - 将地图空间分析、K-means区域划分和局部邻域供需特征结合，构造具有明确业务含义的偏僻程度、会员密度、任务密度及信誉密度指标。
  - 在数据驱动的回归定价基础上叠加贝叶斯-纳什均衡，把历史规律识别扩展为兼顾平台成本与会员效用的策略性定价。
  - 提出基于空间密度、价格和完成概率的三任务打包机制，使定价优化由单任务层面扩展到具有路线协同效应的组合任务层面。
  - 形成可迁移的分区、特征计算、回归定价、均衡修正和密集任务打包流程，可推广至外卖、网约车、跑腿和快递众包等位置服务场景。
- id: B题 电力市场的输电阻塞管理论文_2004年中国大学生数学建模竞赛论文(电力市场的输电阻塞管理)I.pdf
  source_paper: B题 电力市场的输电阻塞管理论文 B题 电力市场的输电阻塞管理论文_2004年中国大学生数学建模竞赛论文(电力市场的输电阻塞管理)I.pdf
  problem_type: 统计分析+优化
  keywords:
  - 输电阻塞管理
  - 多元线性回归
  - 双目标优化
  context: 在电力市场交易与调度一体化背景下，根据机组报价、爬坡能力和线路潮流限制制定安全且阻塞费用尽量低的发电出力方案。
  models:
  - name: 多元线性回归潮流模型
    role: 利用历史试验数据建立6条线路有功潮流与8台发电机组出力之间的近似线性关系，即Y=AX+b。
    why: 题目提供了围绕基准方案的多组出力—潮流数据，在局部运行区间内线性模型结构简单、便于检验，并可直接嵌入后续优化约束。
  - name: 基于报价排序的分段竞价出清模型
    role: 将各机组分段报价按价格从低到高排序，依次选取整段或部分段容量，直至总出力等于预测负荷，并确定清算价和初始出力预案。
    why: 该模型直接对应电力市场按段价择优成交的规则，能够处理最后一个报价段仅部分成交的情形。
  - name: 爬坡约束下的机组出力可行域模型
    role: 根据当前出力和15分钟爬坡速率限定下一时段各机组出力及其调整量的上下界。
    why: 仅按报价排序可能产生物理上无法实现的出力变化，引入爬坡约束可体现相邻时段之间的耦合和机组运行能力。
  - name: 分段阻塞费用模型
    role: 分别计算序内容量被削减造成的利润损失补偿，以及序外容量增发时报价与清算价之间的差额补偿，并折算为15分钟阻塞费用。
    why: 调整前后机组承担的经济损失性质不同，采用阶跃函数和分段价格函数可公平地区分减发与增发，并保持与分段报价制度一致。
  - name: 输电阻塞非线性规划模型
    role: 在负荷平衡、机组容量、爬坡范围和线路潮流限值约束下，以阻塞费用最小为目标调整各机组出力。
    why: 阻塞费用包含阶跃函数和分段价格关系，具有非光滑或分段非线性特征，适合统一表述为约束非线性规划问题。
  - name: 安全优先的双目标规划模型
    role: 先最小化线路潮流绝对值超过限值的最大比例，再在最优安全水平下最小化阻塞费用。
    why: 电网调度必须遵循安全优先、经济性次之的原则，分层双目标比简单加权更能避免费用目标牺牲线路安全。
  - name: 安全裕度比例因子二分搜索模型
    role: 在严格潮流限值下不可行时，对统一安全裕度比例因子R进行二分搜索，寻找使调度模型可行的最小超限比例。
    why: 模型关于允许超限比例具有近似单调可行性，二分法能够高效定位最小必要安全裕度，并判断是否需要拉闸限电。
  solution_flow: 整理32组机组出力与线路潮流数据、分段容量和段价、当前出力、爬坡速率及线路限值→分别对6条线路进行多元线性回归，估计潮流模型Y=AX+b→按分段报价由低到高累加容量，并结合15分钟爬坡约束生成初始出力预案和清算价→将预案代入潮流模型计算各线路潮流并检查绝对值是否越限→若阻塞，则以出力调整量为决策变量，加入负荷平衡、容量、爬坡和潮流安全约束，以阻塞费用最小求解调整方案→若严格限值下无可行解，则启用安全裕度，以二分法搜索最小超限比例并在该安全水平下最小化费用→重新计算潮流、费用和约束余量，判断是否可以避免拉闸限电。
  validation: 对潮流回归模型使用F检验、相关系数或决定系数、残差及置信区间评价整体显著性和拟合效果；对调度结果重新代入Y=AX+b，逐项核验总出力等于预测负荷、机组出力不超过容量边界、15分钟出力变化满足爬坡限制、线路潮流绝对值不超过限值或允许的安全裕度；同时复核清算价、序内减发量、序外增发量和15分钟费用折算，并通过严格限值与启用裕度两种情景的可行性比较判断是否需要拉闸限电。
  visualization:
  - 机组分段报价阶梯图与市场出清线
  - 各线路计算潮流与安全限值对比柱状图
  - 调整前后各机组出力对比图
  - 安全裕度比例因子与模型可行性或阻塞费用关系图
  - 潮流回归预测值—实测值散点图及残差图
  pitfalls_avoided:
  - 线路潮流可能为负，阻塞判断采用潮流绝对值与限值比较，避免只检查正向潮流而漏判反向过载。
  - 出力预案不能仅机械地按最低报价累加，还必须受当前出力和15分钟爬坡速率约束，否则得到的低成本方案可能无法在下一时段实现。
  - 总出力调整量必须满足代数和为零，在负荷不变时保持发电与负荷平衡，避免通过整体增发或减发伪造消除阻塞的结果。
  - 最后成交报价段允许只选取部分容量，避免将所有报价段按不可分割整数段处理而无法精确满足预测负荷。
  - 阻塞费用分别处理序内容量减发和序外容量增发，避免用统一单价忽略两类机组不同的利润损失和报价差额。
  - 费用报价单位为元/MWh而调度时段为15分钟，最终费用乘以1/4进行时间折算，避免将每小时费用直接作为单时段费用。
  - 安全目标与经济目标采用安全优先的分层求解，避免简单加权时因权重选择不当而用较低费用交换过大的线路超限。
  - 严格线路限值下无解时不直接宣布必须拉闸，而是先搜索安全裕度内的最小超限比例，避免忽略电网允许的短时安全裕度。
  innovation_points:
  - 将试验数据得到的线性潮流代理模型直接嵌入市场调度优化，实现数据驱动潮流估计与阻塞管理的一体化。
  - 设计精细计费与简明计费两套阻塞补偿规则，兼顾分段报价下的公平性、计算精度和实际可操作性。
  - 按照阻塞检查、经济调整、安全裕度输电、拉闸限电的顺序构建分层决策机制，清晰体现电网安全优先原则。
  - 利用统一安全裕度比例因子和二分搜索寻找最小必要超限水平，再在该水平下优化阻塞费用，从而将双目标问题转化为可操作的分阶段求解过程。
- id: 2016_C014
  source_paper: 2016 2016_C014
  problem_type: 预测+统计分析
  keywords:
  - 电池剩余放电时间预测
  - 二次多项式拟合
  - 平均相对误差MRE
  context: 基于铅酸电池在不同恒定放电电流及不同衰减状态下的电压—时间数据，预测其达到9V最低保护电压前的剩余放电时间。
  models:
  - name: 固定电流下的二次多项式拟合模型
    role: 分别建立20A至100A九种固定电流下剩余放电时间与端电压的关系，并据此反推出电压—已放电时间曲线。
    why: 二次多项式已能使九条曲线的拟合优度达到99%以上，相比五次多项式参数更少、复杂度更低，可降低过拟合风险并便于计算剩余时间。
  - name: 基于对数电流的变系数放电曲线模型
    role: 将固定电流二次模型的二次项、一次项和常数项系数分别表示为log(I)的线性函数，从而预测20A至100A范围内任意恒定电流下的放电曲线。
    why: 九组拟合系数与log(I)呈近似线性关系且拟合度均超过95%，可将离散电流工况推广为关于电压和电流的连续预测模型。
  - name: 衰减状态时间差比外推模型
    role: 计算相邻衰减状态在相同电压下的放电时间差及其比值，利用稳定阶段近似恒定的差值比外推衰减状态3的完整放电时间和剩余时间。
    why: 电压约降至10.3V后，相邻状态的放电时间差值比趋于常数，可利用新电池、衰减状态1和衰减状态2之间的规律补全衰减状态3的缺失放电过程。
  solution_flow: 数据→按电流分组并倒序整理电压数据，剔除初始放电阶段前10%的瞬态异常数据，将时间由分钟换算为天并构造x=U-9→对九种固定电流分别拟合剩余时间关于电压偏移量的二次模型，获得各项系数及最大放电时间→用各系数关于log(I)的线性回归构造任意电流下的变系数模型，并代入55A生成预测曲线→在不同衰减状态下按相同电压对齐数据，计算时间差D1、D2、D3及差值比R1、R2，以稳定比值外推衰减状态3→通过R²、MRE、残差、实测近邻点及图形对比验证模型。
  validation: 固定电流模型使用拟合优度R²评价整体拟合效果，并从9V开始按相邻电压间隔不超过0.005V的规则抽取样本，计算模型已放电时间与采样已放电时间的平均相对误差MRE；对9.8V下的预测结果，与原始数据中电压最接近9.8V的实测值计算相对误差；任意电流模型对各已知电流进行回代并开展残差分析和MRE检验，同时用55A曲线进行插值预测展示；衰减模型则通过观察R1、R2在稳定放电区间是否趋于常数来验证外推假设。
  visualization:
  - 不同电流下电压—剩余放电时间曲线及拟合曲线对比图
  - 二次多项式系数随log(I)变化的散点图与线性拟合图
  - 模型残差图
  - 55A电压—放电时间预测曲线图
  - 不同衰减状态的电压—放电时间对比曲线图
  - 相邻衰减状态时间差比R1、R2随电压变化曲线图
  - 预测结果与误差统计表
  pitfalls_avoided:
  - 剔除各电流数据前10%的初始放电记录，避免刚开始放电时的钝化和瞬态波动破坏稳定放电阶段的函数关系，导致多项式系数偏移。
  - 采用二次而非五次多项式，虽然五次拟合的R²接近1，但高阶模型复杂且容易追随噪声；二次模型已经达到很高拟合度，更有利于稳健预测和解释。
  - 将时间单位由分钟转换为天，并使用U-Um作为自变量，避免横纵坐标数量级差异过大和自变量偏置过大造成数值计算不稳定、模型系数精度下降。
  - 严格检查相邻电压间隔及样本连续性，没有在60A至100A数据不足时强行拼凑231个连续样本；对90A和100A仅使用实际满足间隔条件的样本，避免违反抽样约束。
  - 通过T剩=Tmax-T放区分剩余放电时间与已放电时间，避免将两类时间变量混用而使预测方向和物理意义颠倒。
  - 任意电流模型不直接对所有电压、电流数据进行无结构曲面拟合，而是先拟合固定电流曲线、再拟合系数随log(I)的规律，避免忽略不同工况之间的层次结构。
  - 衰减状态外推仅使用约10.3V之后差值比趋稳的区间，避免将初始放电阶段尚未稳定的比值直接视为常数而放大外推误差。
  innovation_points:
  - 采用以最低保护电压9V为基准的电压偏移量，并直接拟合剩余放电时间，使模型输出与实际预测目标一致。
  - 通过二次模型系数与log(I)的线性关系，将九个离散电流模型统一为电压和电流共同决定的连续放电曲线模型，可预测55A等未观测电流工况。
  - 利用相邻衰减状态在同一电压下的放电时间差值比稳定性，将电池衰减规律转化为可递推的外推关系，实现对不完整衰减状态曲线的补全。
  - 综合使用R²、按指定电压间隔抽样的MRE、残差分析和近邻实测值相对误差，从整体拟合、局部预测和模型偏差多个角度进行验证。
- id: A题 SARS的传播论文_测控SARS流行趋势的优化模型
  source_paper: A题 SARS的传播论文 A题 SARS的传播论文_测控SARS流行趋势的优化模型
  problem_type: 预测+统计分析+仿真+综合评价
  keywords:
  - SARS传播预测
  - Logistic阻滞增长
  - SEIRQ动力学模型
  - 小世界网络
  - 隔离措施评估
  - 参数拟合
  context: 基于北京、山西等地区的SARS疫情数据建立传播趋势预测模型，并定量评价隔离、人口接触控制、反馈机制和信息公开等防控措施的效果。
  models:
  - name: 早期指数增长模型
    role: 作为基准模型描述疫情暴发初期的病例增长，并与改进模型进行比较。
    why: SARS初期易感者充足且传播速度快，累计病例在短期内近似指数增长，模型参数少、计算简单，但不适合长期外推。
  - name: Logistic SARS模型
    role: 作为核心预测模型拟合累计病例数，估计疫情增长速度、累计病例上限和高峰特征。
    why: 通过微分方程dN/dt=rN-kN²同时表示早期快速增长和后期防控造成的阻滞效应，其中r反映发病增长速率，k反映隔离、消毒等预防措施的综合效果，比恒定传染概率的指数模型更符合完整疫情过程。
  - name: SEIRQ分舱动力学模型
    role: 作为进一步精细化建模方案，刻画易感者、潜伏者、感染者、隔离者和康复者之间的状态转移。
    why: SARS存在潜伏期、隔离、治疗、死亡和恢复等机制，分舱模型能够提供传播阈值、潜伏期、恢复期和隔离效果等更丰富的防控信息，但需要大量可靠的流行病学参数。
  - name: 小世界网络传播模型
    role: 用于仿真人口接触、隔离时机、行为反馈和信息透明度变化对疫情传播的影响。
    why: 传染病传播依赖个体接触网络，网络模型能够通过接触密切程度W、发现隔离速度T和信息透明度Ti构造政策情景，评价提前或延后隔离等措施的非线性影响。
  solution_flow: 收集北京、山西等地区的累计确诊病例数据并确定初始病例数N0；先用指数模型解释疫情初期增长并分析其长期外推缺陷；建立Logistic微分方程，引入发病率r和预防效果指数k；利用Matlab对N0、r、k进行非线性拟合，进而计算理论累计病例上限和疫情高峰特征；将计算曲线与实际病例序列比较，并用决定系数R²评价拟合效果；再用SEIRQ模型说明高精度预测所需的传播机制和数据；最后在小世界网络中改变W、T、Ti及反馈规则，仿真隔离提前或延后、接触减少和信息公开等政策情景。
  validation: 采用时间序列拟合与跨地区验证相结合的策略：分别将Logistic模型用于北京和山西疫情数据，比较公布累计病例与模型计算值，并通过残差平方和与总平方和计算决定系数R²；两地R²均高于0.99，且拟合曲线与实际趋势接近。政策模型则通过控制变量进行情景与敏感性检验，比较不同W、T、Ti及反馈机制下当日患病人数Ni、累计患病人数Nt、高峰规模和疫情持续时间的变化。
  visualization:
  - 实际累计病例与Logistic拟合曲线对比图
  - 当日患病人数Ni与累计患病人数Nt的时间序列图
  - 不同接触程度W和隔离速度T的情景对比图
  - 不同信息透明度Ti及反馈机制下的传播曲线图
  pitfalls_avoided:
  - 避免把疫情初期估计的固定平均传染概率长期外推，因为易感者比例、防控强度和公众行为会随时间变化，指数模型将导致累计病例无限增长并偏离实际。
  - 避免只考虑传染率而忽略隔离和预防措施，因为SARS缺少特效治疗时，隔离、消毒和减少接触是改变传播趋势的关键因素，必须通过预防效果指数或时变参数体现。
  - 避免在数据不足时直接使用高维SEIRQ模型进行精确预测，因为潜伏率、隔离率、治愈率、死亡率和接触率等参数难以可靠估计，隐性感染、死亡病例遗漏及现患病例偏倚会造成参数不可辨识。
  - 避免仅根据累计病例拟合优度判断政策因果效果，因为较高R²只能说明曲线拟合良好，隔离时机和信息公开的影响还需通过网络情景仿真及参数敏感性比较进行评估。
  - 避免忽略公众行为反馈和疫情缓解后的警惕性下降，因为接触程度可能随病例数下降而反弹，从而造成疫情再次回升。
  innovation_points:
  - 在Logistic阻滞增长模型中赋予二次抑制参数k明确的防疫含义，用一个可估计指标综合表示隔离、消毒和预防意识对疫情增长的抑制作用。
  - 将宏观累计病例预测与微观小世界网络仿真结合，既预测疫情规模和趋势，又从接触程度、隔离时机、行为反馈及信息透明度等维度定量评价卫生政策。
  - 采用由简到繁的分层建模框架：指数模型用于短期基准，Logistic模型用于可操作预测，SEIRQ模型用于说明理想精细模型及其数据困难。
- id: A题  奥运会临时超市网点设计论文_奥运会超市网点设计-刘俊
  source_paper: A题  奥运会临时超市网点设计论文 A题  奥运会临时超市网点设计论文_奥运会超市网点设计-刘俊
  problem_type: 统计分析+优化
  keywords:
  - Floyd最短路算法
  - 最优产出理论
  - 整数线性规划
  - 人流量分布
  - 网点选址与配置
  context: 基于奥运观众问卷、场馆交通网络和消费需求，测算20个商区的人流量并优化配置两种规模的临时超市网点。
  models:
  - name: 问卷统计分析模型
    role: 提取观众对交通方式、餐饮方式和购物消费的偏好，并估计人均非餐饮消费额。
    why: 网点需求和人流分配依赖观众行为参数，10600份问卷可通过频数统计、均值分析和相关性分析得到稳定的经验规律。
  - name: Floyd最短路径模型
    role: 计算各场馆出口到交通站点及餐饮地点的最短路径，确定不同出行行为经过的商区。
    why: 交通网络可抽象为赋权图，而观众被假设优先选择最短路径，Floyd算法适合一次性求解网络中多源多目的地之间的最短距离。
  - name: 偏好加权人流分配模型
    role: 利用路径—商区关联矩阵和行为偏好向量，将总观众流量分配到20个商区并计算人流百分比。
    why: 不同交通和餐饮方式具有不同选择概率，将路径经过关系与问卷偏好线性加权，可把微观行为转化为商区层面的人流量。
  - name: 最优产出与边际收益模型
    role: 把大、小超市视为两种产品，通过边际收益等于边际成本推导同一商区内两类超市的最优数量比例。
    why: 两类超市在成本、商圈面积和吸客能力上存在可量化比例，边际分析能够给出利润最大化配置的必要条件，即数量比接近成本比例所决定的目标值。
  - name: 整数线性规划模型
    role: 以各商区大、小超市数量为整数决策变量，在需求覆盖、盈利和数量比例约束下最大化净利润。
    why: 网点数量必须取整数，同时需要协调供给能力、建设经营成本、商业盈利和均衡配置等多重约束，适合采用整数规划统一求解。
  - name: 购买指数—饱和系数修正模型
    role: 引入购买指数和商区饱和系数，修正供给充足即需求完全实现的理想化市场均衡假设。
    why: 实际消费会受缺货感知、消费信心和商圈饱和程度影响，潜在购买力不一定全部转化为实际消费，引入心理与饱和参数可增强模型的现实性。
  solution_flow: 数据：将三次共10600份问卷编码为0-1矩阵，统计交通、餐饮偏好及消费额，并将地图抽象为赋权网络；模型：用Floyd算法计算最短路径，构造路径—商区关联矩阵，再以偏好向量加权得到20个商区的人流量比例；参数：根据人均消费额、人流量、超市成本、商圈面积比、单位供给能力和比例容差确定需求与约束参数；求解：先由边际收益分析推导大、小超市数量比例，再用Lingo求解各商区整数规划，得到两类网点数量；验证：检验三次问卷结果的一致性、规划解的需求覆盖与盈利可行性，并通过购买指数和饱和系数对市场均衡假设进行修正。
  validation: 首先比较三次问卷中各类偏好比例，利用结果高度接近验证样本规律的稳定性；其次检查20个商区人流百分比的归一性及其与主要路径、场馆容量和交通偏好的对应关系；再次将整数规划结果代回需求、盈利和比例容差约束，检验每个商区方案的可行性；对于未知成本和供给参数，采用现实资料进行量级估计以开展可行性检验，并要求实际应用时用调查参数替换；最后引入购买指数k和饱和系数t，考察需求未完全转化为实际消费时方案是否仍能满足k不低于0.95并保持正利润。
  visualization:
  - 消费额分布直方图
  - 交通网络赋权图与最短路径图
  - 20个商区人流量百分比柱状图
  - 各商区大、小超市数量对比表或分组柱状图
  pitfalls_avoided:
  - 避免把几乎等长的路径强行判定为唯一最短路：对于肉眼难以区分的近等长路径，假设观众随机选择并修正路径矩阵，防止细微测距误差导致人流量被集中到单一路径。
  - 避免直接要求整数网点数量严格满足理论比例：由于大、小超市数量必须为整数，使用比例容差约束代替严格等式，否则模型可能无可行解或产生不合理配置。
  - 避免把未知参数的估计值当成永久结论：成本、商圈面积比和供给能力仅用于验证模型可解性，实际决策时必须通过市场调查或试点数据重新标定，否则网点数量会对主观参数高度敏感。
  - 避免将供给能力达到潜在需求等同于需求完全满足：消费者在货品不足或选择受限时可能降低购买意愿，因此引入购买指数和饱和点修正实际消费额。
  - 避免混淆交通偏好与餐饮偏好的概率口径：两组偏好应分别归一化后再结合每日出行次数进行加权，且私车比例应按9%即0.09录入，防止向量录入或重复计数造成总人流失真。
  innovation_points:
  - 将问卷行为偏好、最短路径和路径—商区关联矩阵结合，把观众微观选择转化为商区人流量的定量分布。
  - 把两种规模的临时超市类比为两种产品，利用最优产出理论和边际收益分析推导网点数量比例，再嵌入整数规划。
  - 通过比例容差兼顾理论最优配比与网点数量的整数性，使经济学结论能够转化为可执行方案。
  - 在基础模型上引入购买指数、饱和点和饱和系数，刻画潜在购买力向实际购买力转化的不完全性。
- id: A题 SARS的传播论文_数学建模SARS传播的研究_(3)
  source_paper: A题 SARS的传播论文 A题 SARS的传播论文_数学建模SARS传播的研究_(3)
  problem_type: 预测+统计分析+仿真
  keywords:
  - SARS传播
  - 自愈机制
  - SEIIR微分方程
  - Small-World Network
  - 疫情控制
  context: 针对SARS接触传播、潜伏期、自愈、隔离和免疫等特征，建立宏观与微观模型以刻画疫情演化规律并评估防控措施。
  models:
  - name: 考虑自愈的SEIIR微分方程模型
    role: 从总体层面描述易感者、潜伏者、未发现患者、已隔离患者和免疫者之间的动态转移，并用于疫情拟合与趋势预测。
    why: 分舱微分方程能够清晰表达感染、发病、自愈、隔离及治愈或死亡等连续时间过程，适合对大规模人群疫情进行宏观总量分析。
  - name: 动态Small-World Network传播模型
    role: 从个体接触网络层面模拟病毒传播，研究传染概率、传染期、人员流动、自愈率、疫苗接种率及干预时点的影响。
    why: 现实接触关系并非完全均匀混合，小世界网络同时具有局部聚集和少量远距离连接，可比传统均匀混合模型更真实地描述社会接触结构。
  - name: Sznajd思想与元胞自动机同步更新模型
    role: 规定网络中患者对相邻易感者的传播规则，并同步更新个体的潜伏、传染、隔离治疗和免疫状态。
    why: Sznajd思想适合描述个体通过邻接关系影响其他个体，元胞自动机的同步更新可避免节点遍历顺序对同一时刻状态转移造成非现实偏差。
  solution_flow: 收集香港、台湾和北京的SARS公布数据及人口、潜伏期、治疗期等资料→依据传播机制将人群划分为S、E、未发现患者、已发现并隔离患者和R五类→建立含自愈率、发病率、感染系数、隔离率和免疫率的SEIIR微分方程→由医学资料和日统计数据确定部分参数，其余参数通过反复调整使理论曲线逼近实际曲线→使用Matlab
    ODE45求解并分析无自愈等反事实情形→构建可动态断键重连的Small-World Network，初始化节点状态并按潜伏、感染、隔离、治疗和自愈规则同步迭代→开展Q、L、J、V及疫苗接种率W的单参数和干预敏感性分析，识别传播阈值→拟合北京疫情并比较提前或推迟5天采取措施的结果→通过多地区拟合、实际数据对照和情景分析验证模型。
  validation: 首先将微分方程解与香港实际累计病例曲线对比，并通过参数校准检验拟合程度；随后使用台湾数据进行跨地区外部验证。通过设置自愈率为零构造反事实情景，发现结果与实际疫情严重不符，从而检验自愈机制的必要性。网络模型使用北京疫情数据进行拟合，并比较提前或推迟5天干预产生的峰值和控制时间变化；同时对感染概率、传染期、流动程度、自愈率及疫苗接种率进行敏感性和阈值分析，以检验结论的稳定性与机制合理性。
  visualization:
  - 实际数据与模型拟合时间序列曲线
  - 患病人数峰值及高峰期变化曲线
  - 参数敏感性对比曲线
  - 传播阈值突变曲线
  - 干预提前或推迟的情景对比曲线
  - 人员流动程度与临界疫苗接种率关系图
  pitfalls_avoided:
  - 避免把已发现并隔离的患者继续作为传染源，因为论文假设患者一经发现即严格隔离，继续计入传播会系统性高估感染规模。
  - 避免忽略潜伏期自愈，因为将自愈率设为零后，即使采用极高隔离率仍会预测过长流行期和异常大的感染规模，与实际数据明显矛盾。
  - 避免把公布的累计病例直接等同于全部感染者，因为公开数据通常不包含尚未发现的患者，拟合时必须根据观测口径选择相应状态变量组合。
  - 避免仅采用完全均匀混合假设，因为现实中个体接触具有局部聚集、远距离连接和动态流动特征，单纯宏观模型无法反映具体传播路径。
  - 避免按节点遍历顺序即时更新状态，因为这会让后访问节点受到同一时间步内新状态的额外影响，采用同步更新可保证所有节点依据上一时刻状态统一演化。
  - 避免只考察参数连续变化而忽略临界现象，因为感染概率、传染期、自愈率和疫苗接种率附近可能存在传播阈值，跨过阈值会导致疫情规模发生突变。
  - 避免只评价措施力度而忽视实施时点，因为模拟显示仅提前或推迟5天就会显著改变病例峰值和疫情受控时间。
  innovation_points:
  - 在传统分舱传染病模型中显式引入潜伏感染者自愈通道，并利用实际数据和无自愈反事实结果说明该机制的重要性。
  - 构建由易感、潜伏、未发现患者、已隔离患者和免疫者组成的五状态体系，区分具有传染性的未发现患者与不再传播的隔离患者。
  - 将动态Small-World Network、Sznajd邻居影响思想和元胞自动机同步更新机制结合，形成兼顾社会接触结构与个体状态演化的微观仿真模型。
  - 同时研究感染概率、传染期、人员流动、自愈和疫苗接种的阈值效应，并分析流动性与临界疫苗接种率之间的关系。
  - 通过提前或推迟干预的反事实仿真量化政策时效性，为隔离、减少接触和疫苗接种策略提供决策依据。
- id: B题优秀论文_2002年B题“彩票中的数学”问题的优化模型与评述
  source_paper: B题优秀论文 B题优秀论文_2002年B题“彩票中的数学”问题的优化模型与评述
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 彩票方案设计
  - 中奖概率
  - 心理效用曲线
  - 吸引力评价
  - 非线性优化
  context: 在固定单注价格和设奖率等制度约束下，综合中奖概率、奖金水平、中奖面及地区收入差异，评价现有彩票方案并设计对彩民更具吸引力的方案。
  models:
  - name: 组合概率模型
    role: 计算不同选号规则下各奖级的客观中奖概率及总中奖概率，为评价和优化提供基础数据。
    why: 彩票号码随机且各注相互独立，各奖级事件可通过组合计数精确描述；同时必须排除高级奖与低级奖重复计算造成的概率偏差。
  - name: 模糊心理效用模型
    role: 用隶属度函数描述不同奖金额对彩民的心理吸引力，将客观奖金转化为可比较的满意度。
    why: 彩民对奖金的感受具有非线性、饱和性和模糊性，采用形如 μ(x)=1-exp(-(x/a)^2) 的心理曲线比直接使用奖金金额更符合边际吸引力递减规律。
  - name: 地区实力因子模型
    role: 利用地区平均收入和平均工作年限标定心理效用函数参数，使彩票吸引力评价能够反映地区经济水平差异。
    why: 相同奖金对不同收入地区彩民的吸引程度不同，以人均总收入对应心理曲线中位吸引力的方法标定参数，可减少完全主观赋值。
  - name: 综合吸引力评价模型
    role: 综合各奖级中奖概率、奖金效用、中奖面和奖级结构，构造彩票方案合理性指标并对已有方案排序。
    why: 单独追求一等奖金额或总中奖率都会导致评价偏颇，期望效用式综合指标能够同时反映中奖可能性和中奖后的心理收益。
  - name: 约束非线性优化模型
    role: 以综合吸引力最大化为目标，优化奖项设置、各奖级奖金或奖金比例，生成优于现有方案的新方案。
    why: 心理效用函数和概率—奖金综合指标具有非线性，同时方案还受总设奖率、高低奖奖金次序、奖金非负及奖级比例等约束，因此需要建立明确的非线性规划模型。
  - name: 彩民风险类型分类加权模型
    role: 将彩民划分为冒险型、中立型和避险型，并按群体比例汇总不同类型对高奖、低奖和中奖率的偏好。
    why: 不同风险偏好的彩民对大奖金额与中奖概率的重视程度不同，分类加权可避免用单一偏好代表全部彩民。
  solution_flow: 收集现有彩票规则、奖级奖金、设奖比例和地区收入数据→按选号类型建立组合计数公式，计算各奖级及总中奖概率→检查奖级互斥关系并剔除重复中奖组合→选取模糊心理效用曲线，利用人均年收入和平均工作年限标定实力因子→将中奖概率、奖金效用、中奖面及风险类型权重合成为综合吸引力指标→以吸引力最大化为目标，在总奖金比例、奖级顺序、奖金上下限和概率结构等约束下建立非线性优化模型→使用
    MATLAB 等数值工具求解→与29种现行方案进行排序对比，并开展参数与地区收入敏感性分析。
  validation: 首先使用组合计数和概率归一性检查验证各奖级概率，重点核查“高级奖中奖后不再兼中低级奖”的互斥规则；其次将模型计算结果与29种现行方案的概率表和评价排序进行对照；再次检查优化方案是否满足50%设奖率、奖金非负、高奖金额不低于低奖金额等制度约束；最后改变实力因子、彩民类型比例和效用曲线参数进行敏感性分析，检验方案排序与最优解的稳定性，并结合经济意义判断结果是否出现只追求大奖或只追求中奖率的极端方案。
  visualization:
  - 各方案分奖级中奖概率对比表或柱状图
  - 奖金—心理吸引力曲线
  - 现有方案综合吸引力排序图
  - 实力因子与最优方案敏感性分析图
  pitfalls_avoided:
  - 避免重复计算低级奖概率：若一注已满足高级奖条件便不能再次计入低级奖，否则会高估总中奖率，文中指出传统型6+1/10方案的六等奖尤其容易出现该错误。
  - 避免主观确定评价权重：仅凭个人偏好强调一等奖金额或中奖率会使评价结果系统性偏向特定方案，因此应使用调查数据、风险类型比例或收入参数标定权重和效用参数。
  - 避免用定性拼接代替优化：简单综合若干较好方案或人工修改奖金比例不能证明所得方案最优，必须给出目标函数、决策变量、约束条件和数值求解结果。
  - 避免偏离题目给定条件：单注2元、总设奖率50%等属于既定制度参数，不应耗费篇幅重新优化，否则会改变原问题边界并使方案失去可比性。
  - 避免仅用层次分析法解决设计问题：层次分析法可辅助评价现有方案，但难以直接处理奖金比例和奖级设置的连续决策，且判断矩阵容易受主观赋权影响。
  - 避免把购彩描述成稳定投资或教授选号规律：开奖具有随机性，历史号码不能可靠预测未来结果，模型应服务于方案评价、理性购彩和风险提示，而非承诺提高中奖率。
  innovation_points:
  - 将精确的组合中奖概率与模糊心理效用曲线结合，把“奖金有多高”和“中奖可能性有多大”统一到综合吸引力指标中。
  - 引入与地区收入和消费水平相关的实力因子，使同一彩票方案能够针对不同经济区域进行适应性评价和设计。
  - 按冒险型、中立型和避险型彩民进行群体分层，体现不同风险偏好对大奖金额、低奖覆盖面和中奖率的差异化需求。
  - 在现有方案评价基础上进一步建立约束非线性优化模型，实现从方案排序到新方案定量设计的闭环。
- id: A题_09A2
  source_paper: A题 A题_09A2
  problem_type: 预测+综合评价+统计分析+仿真
  keywords:
  - 等效转动惯量
  - 驱动电流反馈控制
  - 灰色预测
  - 能量误差评价
  - 蒙特卡洛仿真
  context: 针对汽车制动器试验台无法连续配置机械惯量的问题，通过电动机补偿惯量并控制驱动电流，使试验台主轴的制动过程尽可能复现车辆路试时车轮的运动与能量变化。
  models:
  - name: 平动—转动能量等效模型
    role: 将车辆平动动能折算为试验台主轴和飞轮组的转动动能，并计算等效转动惯量J_v=m r²。
    why: 路试车辆与试验台的运动形式不同，必须以能量守恒和无滑动条件建立统一的等效尺度，才能确定试验台需要模拟的目标惯量。
  - name: 离散机械惯量组合与电机惯量补偿模型
    role: 计算主轴及不同飞轮组合形成的机械惯量J_m，并通过J_s=J_v-J_m确定电动机应补偿或消耗的等效惯量。
    why: 试验台飞轮只能提供离散惯量，而目标等效惯量通常无法由机械装置精确实现，因此需要电机对剩余惯量差进行双向补偿。
  - name: 基于转动动力学的驱动电流模型
    role: 由扭矩平衡和做功等效关系推导T_A=((J_v-J_m)/J_v)T_B，并结合电流—扭矩比例关系得到I=K((J_v-J_m)/J_v)T_B。
    why: 该模型直接使用可观测的制动力矩T_B计算驱动电流，且能够统一处理机械惯量不足时的正补偿和机械惯量过大时的负补偿。
  - name: 离散反馈电流控制模型
    role: 将制动过程按时间步长离散，利用当前时刻观测到的制动力矩或角速度变化率确定下一时段的恒定驱动电流。
    why: 制动力矩随时间变化且事先未知，实际控制器只能依据离散采样数据在线计算，因此需要将连续动力学模型转化为可执行的递推控制律。
  - name: 相对能量误差综合评价模型
    role: 以路试制动能量与试验台制动能量之差构造绝对能量误差和相对误差ρ，并依据阈值将控制效果划分为优、良、差。
    why: 绝对能量误差受制动器规格和初始能量影响，采用相对误差能够在给定采样步长下对不同控制方法进行较统一的量化比较。
  - name: 最小二乘转速与制动力矩拟合模型
    role: 对离散转速数据进行线性拟合，并分别使用指数函数和Logistic函数拟合制动力矩的上升及稳定过程。
    why: 拟合模型能够从有限试验数据中提取制动过程的总体变化规律，为路试状态重建和后续随机仿真提供连续基准函数。
  - name: 随机扰动制动力矩仿真模型
    role: 在Logistic基准函数上叠加服从正态分布的随机误差或周期性正弦扰动，生成多组制动力矩序列并重复计算控制误差。
    why: 单次实测数据不能覆盖制动器的随机波动和不同工况，通过随机扰动与重复仿真可以同时评价控制方法的精确性和稳定性。
  - name: 灰色预测前馈补偿模型
    role: 根据历史制动力矩预测下一时段的T_B(t_{k+1})，并以预测值计算当前控制电流，减弱使用滞后观测量造成的后效性。
    why: 当时间步长增大时，直接采用上一采样时刻的扭矩会产生显著延迟误差；灰色预测适合小样本、信息不完全的在线预测场景。
  solution_flow: 输入车辆载荷、车轮半径、主轴与飞轮尺寸、制动力矩和转速采样数据→利用平动—转动能量等效关系计算目标惯量J_v→枚举飞轮组合得到机械惯量J_m并计算补偿惯量J_s→由转动动力学和电流—扭矩关系推导反馈控制律→将制动过程按ΔT离散并在线更新驱动电流→通过最小二乘法和Logistic函数估计制动力矩变化规律及残差分布→叠加随机或周期扰动开展多次计算机仿真→计算总能量误差、逐时段累计能量误差和相对误差ρ→改变时间步长进行敏感性分析→使用灰色预测得到下一时段扭矩并构造前馈补偿控制，比较改进前后的精度与稳定性。
  validation: 采用多层次验证：首先检查车辆平动能量与试验台转动能量的等效关系及正、负惯量补偿方向；其次利用实测扭矩和转速数据计算制动前后能量变化，比较整体能量差与逐时段绝对误差累加结果；再次通过最大误差、均方根误差和平均残差比较指数拟合与Logistic拟合效果；随后在拟合曲线上叠加正态随机扰动或周期扰动并进行多次重复仿真，以相对能量误差的均值和波动评价精确性与稳定性；最后将ΔT由0.01
    s增大到0.1 s进行步长敏感性测试，并比较直接滞后反馈与灰色预测前馈控制的误差，检验改进方法对后效性的抑制能力。
  visualization:
  - 制动力矩与主轴转速时序折线图
  - 制动力矩散点图及Logistic拟合曲线
  - 拟合残差时序图
  - 随机仿真相对能量误差箱线图
  - 不同时间步长下相对能量误差变化曲线
  - 改进前后控制方法能量误差对比柱状图
  pitfalls_avoided:
  - 避免直接把车辆质量当作试验台转动惯量使用；车辆为平动、试验台为转动，必须结合无滑动关系v=rω并通过J_v=m r²完成量纲和能量等效。
  - 避免默认飞轮可以提供连续可调惯量；实际飞轮组合只能形成有限离散值，因此必须显式计算J_m，并检查补偿惯量J_s是否落在电机允许的[-30,30] kg·m²范围内。
  - 避免只考虑机械惯量不足时的正向补偿；当J_m>J_v时J_s和驱动电流应为负，电机需要消耗多余能量，否则会进一步放大模拟误差。
  - 避免仅用制动前后总能量差评价控制器；不同时段的正负误差可能相互抵消，因此同时采用逐时段能量差绝对值累加，以揭示局部跟踪偏差。
  - 避免使用绝对能量误差直接比较不同工况；绝对误差随初始速度、车辆质量和制动器规格变化，采用相对误差ρ归一化后才具有更好的可比性。
  - 避免忽略评价阈值对采样步长的依赖；论文中的优、良、差阈值仅针对ΔT=0.01 s建立，不能不经重新标定直接推广到其他步长。
  - 避免仅依据单次实测制动力矩判断控制稳定性；单次数据具有偶然性，通过残差建模、随机扰动和重复仿真才能评价控制误差的波动程度。
  - 避免用单一指数函数强行拟合制动力矩起始阶段；指数模型在起始段残差较大，改用更符合饱和增长特征的Logistic函数可降低最大误差和均方根误差。
  - 避免将当前采样时刻的扭矩长期作为下一控制区间的真实扭矩；时间步长较大时会产生累积后效性，因此引入下一时段扭矩预测进行前馈修正。
  innovation_points:
  - 把离散飞轮惯量与电机双向能量补偿统一到等效转动惯量框架中，使机械配置和电流控制能够协同设计。
  - 从能量守恒与转动动力学出发，将难以直接测量的目标惯量补偿转化为依赖可观测制动力矩的显式电流控制公式。
  - 同时构造整体能量差和逐时段绝对能量差，并以相对能量误差建立控制效果的分级评价体系。
  - 利用Logistic趋势项、正态随机残差和周期扰动共同生成制动力矩序列，通过重复仿真评估控制策略的精度与稳定性。
  - 针对离散反馈控制的后效性，引入灰色预测形成预测前馈控制，使控制电流由下一时段的扭矩预测值决定，从而降低大时间步长下的累积误差。
- id: B题_cumcm0858
  source_paper: B题 B题_cumcm0858
  problem_type: 优化+统计分析
  keywords:
  - 高等教育学费标准
  - 线性规划
  - 家庭承受能力
  - 地区与专业差异
  - 国家生均拨款
  context: 针对高校学费增长与家庭收入增长不匹配的问题，在保障高校培养质量和居民支付能力的双重约束下，制定分地区、分专业的合理学费及财政拨款标准。
  models:
  - name: 基础分地区学费线性规划模型
    role: 在不考虑助学贷款和专业差异的条件下，测算各地区维持培养质量所需的最低学费，并检验该学费是否处于家庭可承受范围。
    why: 学校生均收入、培养成本和家庭学费负担均可表示为线性关系，适合用线性规划刻画最低学费目标及办学经费、家庭承受能力约束。
  - name: 分地区分专业综合学费优化模型
    role: 综合专业培养成本、奖学金、分层助学贷款和财政拨款浮动，联合确定不同地区、不同专业的个人学费与国家生均拨款。
    why: 基础模型不可行，说明仅依靠家庭缴费和现有拨款无法同时满足办学与承受能力要求，因此需引入资助机制、专业成本差异及可调整的财政拨款变量。
  - name: 家庭承受能力统计测算模型
    role: 通过城乡家庭收入加权和调查学费接受额度，估计家庭年收入及可承受教育支出比例，为优化模型提供支付能力阈值。
    why: 家庭类型和学费接受水平存在差异，采用城乡学生比例、人口结构和调查结果加权，比直接使用单一城镇收入或主观设定阈值更有数据依据。
  - name: 专业培养成本比例估算模型
    role: 以地区平均培养费用为基准，依据现行经济、医学、艺术和农学专业学费比例估算各地区各专业的人均培养成本。
    why: 缺乏完整的分地区分专业成本核算数据，使用现行专业收费结构作为培养成本差异的代理，可在数据受限时形成可计算的成本参数。
  solution_flow: 从《中国统计年鉴》《中国教育经费统计年鉴》、官方网络资料和学费承受能力调查中收集学生人数、财政拨款、学校其他收入、培养支出、奖助学金、城乡收入及现行专业学费数据→统一按地区折算为生均指标，并按城乡学生比例计算家庭平均收入、按调查结果计算承受阈值→建立以最低学费为目标、以办学经费充足和家庭负担可接受为约束的基础线性规划模型→比较培养经费缺口下界与家庭承受上界，发现基础模型无可行解→引入专业成本系数、平均奖学金、按家庭收入分层的助学贷款以及上下浮动20%的国家生均拨款，建立分地区分专业综合优化模型→求解各地区各专业的个人学费和国家生均拨款→通过约束可行性、地区专业差异及政策含义对结果进行解释。
  validation: 首先进行约束一致性检验：检查学校生均总收入是否不低于专业培养费用、扣除奖学金和助学贷款后的家庭实际负担是否不超过收入的9.22%；其次用基础模型的不可行性进行反证式验证，其学费最低需求为3415.2至5030.9元，而家庭承受上限仅为2869.4元，说明引入资助和调整拨款具有必要性；最后比较不同地区、不同专业结果是否符合艺术和医学培养成本较高、农学收费较低等现实规律，并可在财政拨款上下浮动20%及家庭收入区间内开展敏感性分析。
  visualization:
  - 历年大学生人均学费柱状图
  - 学费占家庭收入比例的年度折线图
  - 家庭可承受学费区间分布图
  - 分地区最低学费与家庭承受上限对比柱状图
  - 地区—专业学费及生均拨款分组柱状图或热力图
  pitfalls_avoided:
  - 避免只按高校成本定价而忽略家庭支付能力：同时设置学校收入覆盖培养成本和学费占家庭收入比例上限两个约束，否则可能得到学校可运行但多数家庭无法承担的收费方案。
  - 避免在基础模型无解时强行给出所谓最优学费：通过比较学费下界与承受上界明确判定不可行，并据此引入助学贷款和财政拨款调整，使模型改进具有逻辑依据。
  - 避免直接比较地区总量数据造成规模偏差：将财政拨款、其他收入、培养支出和奖助学金均除以在校生人数转化为生均指标，从而提高不同地区之间的可比性。
  - 避免用单一城镇收入代表全部学生家庭：按照实际城乡大学生比例加权农村与城镇家庭收入，以降低家庭承受能力被高估的风险。
  - 避免对所有专业采用同一收费和拨款标准：利用专业培养成本比例区分经济、医学、艺术和农学，否则会造成高成本专业经费不足或低成本专业收费过高。
  - 避免将国家财政拨款设为不受限制的自由变量：限定其相对现行水平上下浮动不超过20%，防止优化结果脱离短期财政承受能力。
  - 避免采用统一额度助学贷款导致覆盖面过窄：根据家庭收入与学费承受阈值之间的缺口确定贷款额度，使不同困难程度家庭获得差异化支持。
  innovation_points:
  - 构建由简到繁的递进式优化框架，先用基础模型识别现行经费结构与家庭承受能力之间的不可行矛盾，再通过政策变量扩展模型恢复可行性。
  - 将地区差异与专业差异同时纳入学费定价，实现个人学费、专业培养成本和国家生均拨款的差异化配置。
  - 设计与家庭收入挂钩的分层助学贷款机制，使贷款金额等于学费超过家庭可承受额度的缺口，从而扩大资助覆盖面并提高资金利用效率。
  - 把奖学金按地区在校生人数折算为人均期望资助，并纳入家庭实际教育负担约束，使资助政策能够直接参与学费优化。
  - 将国家生均拨款由固定参数改为受20%政策区间约束的决策变量，实现家庭、学校和政府三方负担的联合优化。
- id: B题_cumcm0858—高校学费合理性研究
  source_paper: B题 B题_cumcm0858—高校学费合理性研究
  problem_type: 统计分析+优化
  keywords:
  - 学费标准
  - 线性规划
  - 家庭承受能力
  - 地区与专业差异
  - 国家生均拨款
  context: 针对高校学费增长与家庭收入增长不匹配的问题，在保障公立高校培养质量和居民支付能力的前提下，制定分地区、分专业的合理学费及国家生均拨款标准。
  models:
  - name: 基础分地区学费线性规划模型
    role: 作为基准模型，仅考虑地区差异，在学校生均收入覆盖培养成本和学费不超过家庭承受阈值的约束下最小化学费。
    why: 模型结构简单、参数可由统计年鉴直接计算，能够检验在不考虑助学贷款和奖学金时，办学成本约束与家庭支付能力约束能否同时满足，并为综合模型提供参数基础。
  - name: 分地区分专业综合线性规划模型
    role: 在基础模型上引入专业培养成本差异、奖学金、分层助学贷款和可调整的国家生均拨款，联合确定各地区各专业的个人学费与财政拨款标准。
    why: 不同地区和专业的培养成本存在明显差异，且助学贷款、奖学金和财政拨款能够缓解家庭支付约束；线性规划适合处理成本覆盖、承受能力、拨款浮动范围和学费非负等多重线性约束。
  - name: 家庭学费承受能力测算模型
    role: 利用城乡家庭收入、人口结构、家庭规模和调查得到的可接受学费水平，估计学费占家庭收入的承受阈值，并作为优化模型的约束参数。
    why: 直接使用平均收入或主观设定阈值容易脱离实际，通过调查结果与统计年鉴数据加权可以把居民支付意愿转化为可计算的比例约束。
  - name: 分层助学贷款规则模型
    role: 根据家庭收入与学费负担的差额确定贷款额度：负担未超过阈值时贷款为零，超过阈值时贷款弥补至可承受水平。
    why: 相较于简单区分有贷款和无贷款，按家庭收入缺口分配贷款能够扩大资助覆盖面，提高有限助学贷款资金的使用效率。
  solution_flow: 数据→从《中国统计年鉴》《中国教育经费统计年鉴》及筛选后的权威网络资料中收集高校人数、财政拨款、其他收入、培养支出、城乡家庭收入、学费接受度和专业现行学费等数据→模型→先建立仅含地区差异的基础线性规划，再建立包含地区、专业、奖学金、助学贷款和财政拨款调整的综合线性规划→参数→按高校人数将地区总量数据折算为生均拨款、生均其他收入和生均培养费用，按城乡生源比例计算家庭平均收入，以调查数据估计9.22%的承受阈值，并依据现行专业学费比例估算各专业培养成本→求解→比较成本覆盖所要求的学费下限与家庭承受上限，识别基础模型无可行解；随后在财政拨款上下浮动20%、贷款分层和奖学金抵扣条件下求解各地区各专业的最低学费及对应生均拨款→验证→检查各结果是否满足培养成本、家庭承受能力、学费非负和拨款浮动范围等约束，并比较两个递进模型的可行性和政策含义。
  validation: 采用约束可行性检验与递进模型对比验证：基础模型中，各地区维持培养质量所需的最低学费为3415.2至5030.9元，而家庭承受上限仅为2869.4元，二者冲突，因此判定模型无可行解；综合模型求解后逐项核验学校总生均收入不低于专业培养成本、家庭扣除奖学金和助学贷款后的负担比例不超过承受阈值、学费为正且国家拨款调整幅度不超过20%。同时通过不同地区、不同专业结果的横向比较，检查高培养成本专业是否对应更高的学费或财政补贴。论文未给出独立样本外检验，因此结论主要属于内部一致性和政策情景可行性验证。
  visualization:
  - 历年大学生平均学费柱状图
  - 学费占家庭收入比例的年度折线图
  - 居民可承受学费分布图
  - 分地区学费上下界对比表
  - 分地区分专业学费与国家生均拨款对比表
  pitfalls_avoided:
  - 避免只以学校收入最大化或盈利为目标，因为研究对象是具有公共产品属性的公立高校；采用最低学费目标并设置培养成本覆盖约束，可兼顾教育质量和学生利益。
  - 避免仅比较名义学费而忽略家庭收入差异，因为相同学费对不同收入家庭的负担不同；将学费转化为家庭收入占比并以调查阈值约束，更能反映真实承受能力。
  - 避免把地区财政总量直接用于生均比较，因为各地区高校在校生规模差异显著；将拨款、其他收入和培养支出统一折算为生均指标，保证量纲和比较口径一致。
  - 避免基础模型无解后强行给出学费标准，因为成本覆盖下限高于家庭承受上限说明政策条件本身冲突；论文据此引入助学贷款、奖学金和财政拨款调整，而不是忽略不可行性。
  - 避免对所有专业采用统一培养成本，因为艺术、医学、经济和农业专业的教学资源需求不同；综合模型依据现行专业学费比例近似刻画培养成本差异。
  - 避免助学贷款只覆盖极少数最困难学生，因为二元式资助会遗漏收入略高但仍无法负担学费的家庭；按照学费与可承受金额之间的缺口确定贷款额度，可扩大资助范围。
  - 避免无限提高财政拨款以获得形式上的可行解，因为短期财政资源存在约束；将国家生均拨款限定在现有水平上下20%的政策可操作范围内。
  innovation_points:
  - 构建由基础分地区模型到分地区分专业综合模型的递进式框架，利用基础模型的无解结果识别家庭承受能力与高校培养成本之间的结构性矛盾。
  - 将学费、国家生均拨款、学校其他收入、培养成本和家庭承受能力纳入同一线性规划框架，实现个人支付与政府投入的联合优化。
  - 提出与家庭收入挂钩的差额型助学贷款规则，使贷款金额恰好弥补超过承受阈值的部分，提升资助资金的覆盖面和配置效率。
  - 同时刻画地区差异与专业差异，并提出不同专业采用不同的个人学费和国家生均拨款组合，而非执行单一统一收费标准。
- id: A题_DNA序列的分类
  source_paper: A题 A题_DNA序列的分类
  problem_type: 分类聚类+统计分析
  keywords:
  - DNA序列分类
  - 判别分析
  - 序列相关度
  context: 依据已知类别的DNA序列样本，综合碱基含量与碱基排列位置特征，对人工序列和自然序列进行二分类。
  models:
  - name: 碱基含量特征模型
    role: 将DNA序列转换为可用于统计判别的数值特征向量。
    why: 不同类型DNA序列的碱基丰度可能存在差异，且A、G、T、C含量具有明确的生物学意义；考虑到四种含量之和为1，使用三维向量避免特征完全线性相关。
  - name: 欧氏距离分类模型
    role: 根据待分类样本到A、B两类几何中心的欧氏距离完成初步分类。
    why: 模型简单直观、计算量小，适合作为基准分类方法并用于检验碱基含量特征的可分性。
  - name: 马氏距离分类模型
    role: 利用类别均值和协方差结构衡量样本与各类总体之间的统计距离。
    why: 欧氏距离忽略不同特征的尺度、相关性和类内离散程度，马氏距离通过协方差矩阵修正这些影响，更适合随机样本的统计判别。
  - name: Fisher线性判别模型
    role: 将三维碱基含量特征投影到一维空间，并依据投影后样本与类别中心的距离分类。
    why: 通过最大化类间差异并压缩类内差异，可以获得具有较强判别能力的投影方向，同时便于与距离分类结果进行交叉比较。
  - name: 多模型联合判定准则
    role: 综合欧氏距离、马氏距离和Fisher判别结果，识别稳定分类样本与不可判样本。
    why: 不同模型对边界样本可能给出冲突结论，仅在三种方法结果一致时确认类别，可以降低单一模型误判带来的风险。
  - name: 序列相关度分类模型
    role: 通过平移对齐并统计相同位置碱基的最大匹配数，提取DNA碱基排列特征并完成分类。
    why: 仅使用碱基含量无法区分组成相同但排列不同的序列；自定义相关运算、哑元延拓和最大相关度可以直接刻画非数值DNA序列的位置结构。
  - name: 带反馈的相关度分类模型
    role: 迭代吸收高置信度待分类序列，动态扩充A、B类标准学习样本并重新分类剩余序列。
    why: 一次性分类不能利用已获得的高置信度结果，反馈机制能够逐步更新类别代表信息，改善小样本条件下的分类效果。
  solution_flow: 数据→统计每条DNA序列的A、G、T、C含量并消除含量和为1造成的冗余，同时保留原始排列信息→分别建立欧氏距离、马氏距离和Fisher线性判别模型，并定义面向字符序列的平移匹配相关度模型→由20个已知类别样本估计类别中心、协方差矩阵、Fisher投影向量及类平均相关度→按最小距离、投影距离或相关度比值完成A/B分类，再利用高置信度样本实施反馈迭代→通过学习样本分类准确率、模型间结果一致性和稳定性比较验证分类方案。
  validation: 先将20个已知类别样本回代分类，欧氏距离、马氏距离和Fisher模型均达到95%准确率，相关度模型达到100%；再比较不同方法对A21至A40等未知序列的分类结果，对A30、A32、A33、A39等分歧样本进行一致性检查，并将三种含量判别结果不一致的样本标记为不可判类；同时识别A4这类多模型共同误判的异常样本，并通过带反馈与无反馈相关度算法的结果对比考察稳定性和改进效果。
  visualization:
  - 碱基含量三维散点图及类别中心图
  - 不同分类模型结果对比表
  - 相关度比值W的排序或分布图
  - 反馈迭代过程中的类别样本数量变化图
  pitfalls_avoided:
  - 避免直接同时使用四种碱基含量作为独立特征，因为na+ng+nt+nc=1会导致完全线性相关，并可能使协方差矩阵奇异；因此删去一个维度形成三维特征向量。
  - 避免只采用欧氏距离描述随机样本的接近程度，因为它忽略特征相关性和类内协方差结构；因此引入马氏距离作为统计修正。
  - 避免只根据碱基含量分类，因为组成比例相同的序列可能具有完全不同的排列结构；因此进一步构造基于位置匹配的序列相关度。
  - 避免将A、G、T、C任意编码为连续数值后直接计算普通相关系数，因为编码大小会人为引入不存在的顺序与距离关系；因此采用相同碱基记1、不同碱基记0的符号相关运算。
  - 避免对不同长度序列直接逐位比较造成边界错位和信息遗漏，因此使用哑元在序列两端延拓，并遍历相对平移位置取最大匹配相关度。
  - 避免强制输出所有边界样本的类别，因为不同判别方法在临界样本上可能冲突；因此采用一致性联合判据，将冲突结果标记为不可判类。
  - 避免在反馈过程中优先吸收低置信度样本而造成错误累积，因此A类优先加入W最大的样本、B类优先加入W最小的样本，以高置信度结果逐步扩充训练集。
  innovation_points:
  - 从碱基含量和碱基排列两个互补角度构造特征体系，将传统多元统计判别与非数值序列结构分析结合起来。
  - 针对DNA字符序列自定义二元相关运算、哑元延拓、平移相关序列及最大相关度，使序列无需进行带顺序偏差的数值编码即可比较。
  - 使用类平均相关度之比W同时完成类别判定和可信度度量，为识别边界样本及后续反馈学习提供统一指标。
  - 设计高置信度样本逐步加入标准样本集的反馈分类机制，使未知数据参与类别原型更新，实现迭代式半监督分类。
  - 通过欧氏距离、马氏距离和Fisher判别的联合一致性准则控制误判风险，并显式保留不可判类结果。
- id: 2018_C101
  source_paper: 2018 2018_C101
  problem_type: 统计分析+分类聚类+预测
  keywords:
  - 会员画像
  - K-均值聚类
  - 马尔科夫状态转移
  - 关联规则
  - 精准营销
  context: 针对大型百货商场会员流失与营销成本上升问题，利用消费明细构建会员画像，识别会员价值、生命周期、激活规律及商品连带关系，为精细化运营和促销决策提供依据。
  models:
  - name: 描述性统计与对比分析
    role: 统计会员与非会员的消费金额、购买数量、商品平均价格、单据数量及日均消费金额，刻画两类群体的消费差异和商业价值。
    why: 问题一以群体消费特征比较为主，均值、中位数、极值、总量和日均指标能够直观反映消费水平、消费规模及数据分布差异。
  - name: K-均值聚类模型
    role: 以会员消费金额和消费次数为特征，将会员划分为大众、黄金、铂金和钻石四类，从而识别不同购买力和会员价值。
    why: 会员价值标签未知，属于无监督分类问题；K-均值适合依据连续型消费特征发现内部相似、类别间差异明显的会员群体。
  - name: 基于规则的会员生命周期与活跃状态划分模型
    role: 利用最近无消费天数、累计消费次数和月均消费次数，将会员划分为引入期、成长期、成熟期、休眠期、流失期，并进一步判定活跃或非活跃状态。
    why: 题目未给出生命周期阶段及活跃标准，需要结合零售消费频率和沉默时长建立可解释、可执行的业务规则。
  - name: 马尔科夫状态转移模型
    role: 根据会员逐月活跃状态构造转移概率矩阵，估计非活跃会员转为活跃会员的概率，即会员激活率。
    why: 会员活跃状态具有时间序列上的状态迁移特征，在齐次马尔科夫假设下可通过相邻月份状态统计量化激活、留存和沉默概率。
  - name: 相关分析与一元二次回归模型
    role: 分析会员激活率与月度销售量之间的关联程度，并拟合销售量与激活率的函数关系，用于评估促销活动对会员激活和销售的影响。
    why: 相关系数可衡量两变量的同步变化程度，二次回归能够描述可能存在的非线性关系，并通过决定系数评价拟合效果。
  - name: FP-Growth关联规则模型
    role: 从购物篮数据中挖掘频繁商品组合及X到Y的关联规则，依据支持度计数和置信度提出陈列、降价与捆绑促销建议。
    why: 消费明细规模较大且需要发现多商品连带关系，FP-Growth无需反复生成大量候选项集，通常比Apriori具有更低的数据库扫描与I/O成本。
  solution_flow: 数据→将会员资料、销售单据和商品明细导入SQL Server，按单据号区分会员与非会员，并按会员卡号、消费时间和商品编码清洗去重→模型→先做描述性统计，再以消费金额和消费次数进行K-均值聚类，以最近消费间隔和消费频次划分生命周期，依据逐月消费记录建立活跃状态矩阵和马尔科夫转移矩阵，最后进行激活率回归及FP-Growth购物篮分析→参数→以类内平均距离与类间平均距离之比D最小确定K=4，生命周期阈值设为30天和90天，购物篮频繁项集支持度计数阈值设为50，促销规则置信度建议不低于0.8→求解→输出会员与非会员差异、四类会员中心及人数、五阶段生命周期与活跃人数、状态转移概率、激活率与销售量关系以及高置信度商品规则→验证→通过聚类距离指标、状态人数核对、相关系数、回归决定系数及关联规则支持度和置信度检验结果的区分度、拟合性与业务可解释性。
  validation: 聚类部分比较不同K值下的类内平均距离与类间平均距离之比，选择D最小的K=4，并检查各聚类中心在消费金额和次数上是否呈现清晰梯度；生命周期与状态划分通过各阶段人数汇总与总会员数一致性进行核验；马尔科夫模型检查转移矩阵各行概率和为1，并以非活跃到活跃的转移概率量化整体激活率；促销关系采用相关系数0.83验证激活率与销售量的强相关性，并以二次回归决定系数R²=0.7419评价拟合程度；关联规则通过支持度计数、支持度和置信度筛选，其中支持度计数至少为50、建议置信度至少为0.8，以保证规则具有足够样本基础和较高连带购买概率。
  visualization:
  - 会员与非会员消费特征对比表
  - 不同K值下D指标折线图
  - 聚类中心与类别人数表
  - 会员生命周期阶段人数分布表
  - 月度活跃与非活跃占比趋势图
  - 马尔科夫状态转移矩阵表
  - 激活率与销售量散点拟合图
  - 关联规则支持度与置信度结果表
  pitfalls_avoided:
  - 在构造购物篮前按“会员卡号+消费时间+商品编码”删除同一次消费中的重复商品，避免同一商品重复扫描或重复记账人为抬高支持度计数和置信度。
  - 没有直接主观指定聚类数，而是利用类内平均距离与类间平均距离之比D比较候选K值并取最小值对应的K=4，降低类别数量随意设置导致聚类结构失真的风险。
  - 按“会员卡号+消费时间”界定一次交易并汇总商品集合，避免将同一会员不同时点的购买行为错误合并为一个购物篮，从而产生虚假的商品关联。
  - 在会员与非会员数据覆盖天数不同的情况下补充计算日均消费金额，避免仅比较总消费金额时将观察窗口长度差异完全误判为群体价值差异。
  - 对马尔科夫分析统一采用“当月有消费即活跃、否则非活跃”的月度口径，避免生命周期规则与月度状态转移统计口径混杂而无法构造相邻月份状态矩阵。
  - 为FP-Growth设置支持度计数至少为50，并进一步要求促销规则置信度达到0.8左右，避免依据少量偶然交易形成不稳定、难以推广的促销规则。
  innovation_points:
  - 将描述性统计、会员价值聚类、生命周期规则、状态转移和购物篮关联分析串联为完整会员画像体系，实现从群体价值识别到会员运营和商品促销的闭环分析。
  - 结合最近无消费天数、累计消费次数与月均消费次数，自定义五阶段会员生命周期及活跃状态规则，使抽象的会员生命周期转化为可由数据库直接计算的业务标签。
  - 将月度会员活跃状态表示为二状态马尔科夫链，不仅统计静态活跃占比，还从状态迁移角度量化非活跃会员被重新激活的概率。
  - 把激活率与实际销售量进行相关和回归分析，并将会员行为变化与促销效果联系起来，使状态模型能够进一步服务于营销效果评估。
  - 利用FP-Growth挖掘高置信度商品组合，并将规则直接转化为相邻陈列、前件商品降价和捆绑销售建议，增强模型结果的可执行性。
- id: B18013004邓敏娜_宁凯_董婷婷_B18013004_邓敏娜_宁凯_董婷婷
  source_paper: B18013004邓敏娜_宁凯_董婷婷 B18013004邓敏娜_宁凯_董婷婷_B18013004_邓敏娜_宁凯_董婷婷
  problem_type: 优化+仿真
  keywords:
  - 空间参数曲线
  - 非线性约束优化
  - 折叠机构运动仿真
  context: 针对木条与钢筋联动的创意平板折叠桌，建立其折叠运动、加工参数及在稳固和节材要求下的最优设计模型。
  models:
  - name: 三维几何投影与空间参数曲线模型
    role: 将折叠桌的三维结构投影到俯视平面和截面平面，计算各木条长度、钢筋位置及桌脚边缘线的空间坐标，并描述折叠展开过程。
    why: 折叠桌具有对称性，且木条运动关系可在两个二维平面中利用勾股定理和相似三角形求解，从而降低三维建模难度。
  - name: 基于相似三角形的开槽参数模型
    role: 根据钢筋与各木条的相对运动关系，确定开槽起止位置、开槽长度和木条端部距离等加工参数。
    why: 钢筋在木条槽内的滑动受机构几何关系控制，相似三角形能够直接建立木条长度、空间高度与槽位之间的解析关系。
  - name: 非线性约束优化模型
    role: 以最外侧木条倾角α和钢筋位置比例系数k为核心决策变量，在平衡、受力、支撑高度、开槽范围和左右木条不干涉等约束下优化平板尺寸与钢筋位置。
    why: 目标函数和稳定性约束中包含三角函数、平方根及变量乘积，属于典型的非线性规划问题。
  - name: 分层多目标优化模型
    role: 先最小化平板所需长度以减少木材用量，再在倾角确定后调整钢筋位置，使各木条的最大或总开槽长度尽量小。
    why: 节材与加工方便两个目标量纲和优先级不同，采用分阶段优化可避免直接加权造成权重主观性，并优先保证材料经济性。
  - name: 任意外凸桌面边缘推广模型
    role: 将圆形桌面的边界方程替换为一般外凸曲线，并复用几何计算和非线性优化框架，为定制化设计软件生成材料尺寸及加工参数。
    why: 外凸边界有利于保持木条长度变化连续并降低运动干涉风险，同时使圆桌模型能够推广到多种创意桌面形状。
  solution_flow: 输入桌高、桌面边缘曲线、平板厚度、木条宽度和木条数量等设计数据→利用结构对称性建立三维坐标系并投影到俯视图与截面图→通过边界方程、勾股定理和相似三角形计算木条长度、钢筋轨迹、桌脚边缘线及开槽参数→以α和k为决策变量建立包含平衡、受力、槽位、支撑高度和运动不干涉条件的非线性约束模型→先优化材料用量，再优化开槽长度并用Matlab数值求解→输出平板尺寸、木条长度、钢筋位置和开槽加工表→选取多个中间状态进行折叠展开仿真，并通过改变木条数量检验参数稳定性。
  validation: 采用几何一致性、约束可行性、动态过程和敏感性四类验证：将计算结果回代圆或外凸边界方程及相似三角形关系；检查桌脚展开半径约为桌面半径的0.9至1.1倍、短木条对钢筋能够提供反向水平支撑、槽位不越界且左右木条不相撞；绘制至少8个折叠状态观察钢筋和桌脚边缘线运动是否连续并能在卡槽处稳定；改变单侧木条数n并比较α、k和最大木条长度，结果变化较小，说明优化参数具有一定鲁棒性。
  visualization:
  - 折叠桌三维结构与空间轨迹图
  - 俯视投影图
  - 截面运动关系图
  - 八阶段折叠展开动态图
  - 木板开槽加工图
  - 不同木条数量下的参数对比表
  pitfalls_avoided:
  - 避免直接在三维空间中同时处理全部机构关系；利用对称性只分析局部区域并分解为两个二维投影，使坐标和相似关系更清晰，也减少符号与计算错误。
  - 避免仅以材料最少为目标而得到容易侧翻的结构；加入桌脚展开半径与桌面半径的比例约束，并结合钢筋水平受力方向设置稳定性条件。
  - 避免钢筋槽位超出木条或桌面连接区域而导致方案不可加工；显式约束开槽左右端点，并将开槽长度作为第二阶段优化目标。
  - 避免只验证最终展开状态而忽略展开过程中木条碰撞；增加左右两组木条互不干涉约束，并对多个中间状态进行动态仿真。
  - 避免盲目增加木条数量造成加工复杂度上升；对不同n值进行敏感性比较，在参数变化很小的前提下选取兼顾桌面平滑度和加工难度的木条数量。
  - 避免将圆桌模型生硬用于任意边界；推广时限定桌面边缘为外凸曲线，以降低凹陷边界引起木条长度突变、运动干涉和稳定性下降的风险。
  innovation_points:
  - 将折叠机构的桌脚边缘表示为空间参数曲线，并把钢筋滑动、木条姿态和开槽加工参数统一在同一几何坐标框架内。
  - 使用α和k两个关键影响因子压缩高维设计变量，并采用先节材、后缩短开槽的分层优化策略协调材料成本与加工便利性。
  - 将圆形桌面推广到任意外凸边缘曲线，使模型可作为参数化折叠桌设计软件的计算内核。
  - 把优化结果与多阶段动态可视化结合，不仅输出最优数值，还直观检查展开连续性、卡槽锁定和机构干涉。
- id: C19510015_杨金洪_洪嘉远_谢思霞_C19510015_杨金洪_洪嘉远_谢思霞
  source_paper: C19510015_杨金洪_洪嘉远_谢思霞 C19510015_杨金洪_洪嘉远_谢思霞_C19510015_杨金洪_洪嘉远_谢思霞
  problem_type: 预测+优化
  keywords:
  - 盈亏平衡分析
  - 猪群结构平衡
  - 动态经营策略
  context: 在生猪价格波动、饲养成本较高和养殖容量受限的背景下，确定养猪场的最低繁殖水平、饱和存栏结构及未来三年的最优销售策略。
  models:
  - name: 模型Ⅰ：基础盈亏平衡模型
    role: 在假设全部小猪均转化为肉猪的条件下，计算每头母猪年均产仔量的盈亏平衡阈值。
    why: 销售收入与肉猪、母猪养殖成本近似呈线性关系，适合利用总收入不低于总成本的盈亏平衡条件建模。
  - name: 模型Ⅱ：考虑公猪成本的盈亏平衡模型
    role: 在模型Ⅰ基础上加入公猪与母猪按1:20配种所产生的公猪饲养成本。
    why: 基础模型遗漏了繁殖系统必需的公猪投入，补充该成本可使盈亏阈值更符合完整猪群结构。
  - name: 模型Ⅲ：考虑种猪留种与淘汰更新的盈亏平衡模型
    role: 综合肉猪销售收入、母猪和公猪成本、种猪饲养成本以及种猪年淘汰和补充量，得到最终产仔量阈值。
    why: 养殖场必须持续补充后备种猪，且种猪生育期有限；采用平均4年生育期和每年1/4更新率可刻画长期稳定经营状态。
  - name: 模型Ⅳ：年度猪群结构饱和平衡模型
    role: 根据10000头容量约束、母猪公猪比例、每头母猪年产仔数和种猪更新需求，初步求解母猪存栏数与留种比例。
    why: 当猪场达到饱和并维持稳定时，各类猪只数量必须满足容量守恒和种猪更新平衡，可建立代数方程组直接求解。
  - name: 模型Ⅴ：半年周期猪群结构修正模型
    role: 将计算周期由一年修正为半年，并加入每半年1/8的种猪淘汰量，重新计算饱和状态下的母猪存栏数和留种比例。
    why: 母猪约半年生产一胎，猪场可能在第一胎后即达到容量上限；使用半年周期能够避免年度模型忽略批次时序和期内淘汰的问题。
  - name: 模型Ⅵ：三年分批销售利润模型
    role: 根据9个月育肥周期、半年一胎和预测价格曲线，计算三年内7个销售批次均出售肉猪时的利润。
    why: 生猪销售价格随时间变化，而不同批次的出生和出栏时间具有固定滞后，适合按批次建立收入、育肥成本和种猪成本核算模型。
  - name: 模型Ⅵ优化：肉猪与猪苗销售方案比较模型
    role: 逐批比较单位肉猪销售收益与单位猪苗销售收益，选择收益较高的销售方式，形成三年经营策略。
    why: 低价期继续育肥可能亏损或降低收益，采用批次级离散决策可在出售猪苗和育肥后出售肉猪之间进行利润择优。
  solution_flow: 收集肉猪成本、种猪成本、母猪年成本、配种比例、肉猪重量、猪苗价格和价格预测曲线等数据→建立由简到繁的盈亏平衡模型并确定最低年产仔量→利用容量守恒、配种比例和淘汰更新关系建立猪群结构平衡模型→将周期修正为半年并求得母猪存栏数和留种比例→把价格曲线离散为各销售时点价格，依据9个月生产滞后划分7个销售批次→分别核算出售肉猪和出售猪苗的批次利润并择优→汇总三年总利润与平均年利润，绘制母猪和肉猪存栏曲线。
  validation: 采用递进式模型对比进行结构验证：依次比较模型Ⅰ、Ⅱ、Ⅲ，检验加入公猪成本及种猪淘汰更新后盈亏阈值的变化；比较模型Ⅳ与模型Ⅴ，检验年度周期和半年生产周期对饱和存栏结果的影响；对经营策略则逐批比较肉猪与猪苗的单位收益，并检查总存栏不超过10000头、配种比例满足1:20、留种量能够补偿淘汰量。参数主要通过公开文献和行业资料交叉标定，但未进行独立样本回测。
  visualization:
  - 盈亏平衡收入—成本关系图
  - 生猪价格时间序列曲线
  - 繁殖与销售时序图
  - 分批销售利润对比表
  - 母猪存栏阶梯曲线
  - 肉猪存栏变化曲线
  pitfalls_avoided:
  - 避免只计算肉猪和母猪成本而遗漏公猪成本，因为自然交配条件下必须按约1:20配置公猪，遗漏会低估盈亏平衡产仔量。
  - 避免把全部仔猪都视为可销售肉猪，因为稳定经营必须留出后备种猪补充失去生育能力的公母猪，否则模型无法长期维持繁殖规模。
  - 避免使用一年作为唯一计算周期，因为母猪约半年一胎，猪场可能在首胎后达到10000头上限；采用半年周期可更准确描述批次生产和淘汰。
  - 避免在所有价格时点机械出售肉猪，因为低价期肉猪销售收入可能低于育肥成本；逐批与直接出售猪苗的收益比较可减少亏损。
  - 避免将预测价格直接用于出生时点，因为从配种到肉猪出栏约有9个月滞后，必须将生产批次与对应的未来销售价格正确匹配。
  innovation_points:
  - 采用由基础盈亏平衡到加入公猪、留种和淘汰更新的递进式建模，使最低产仔量由静态会计核算扩展为长期可持续经营阈值。
  - 把生物繁殖周期、育肥滞后、种猪更新周期与市场价格周期统一到分批经营模型中，实现猪群状态与销售决策联动。
  - 将每个批次的产品去向设置为猪苗或肉猪，通过单位利润比较形成简单、可执行的动态销售策略。
  - 在容量约束下同时求解母猪存栏数和仔猪留种比例，使繁殖规模配置与10000头猪场饱和容量相匹配。
- id: B题 露天矿生产的车辆安排论文_2003-露天生产的车辆安排--历年数学建模优秀论文大全
  source_paper: B题 露天矿生产的车辆安排论文 B题 露天矿生产的车辆安排论文_2003-露天生产的车辆安排--历年数学建模优秀论文大全
  problem_type: 优化
  keywords:
  - 双目标规划
  - 回代搜索
  - 优先权系数
  context: 针对露天矿一个8小时班次，在产量、矿石品位、设备能力和车辆无等待等约束下，优化电铲布置、卡车数量、运输路线及运输趟数。
  models:
  - name: 双目标运输调度规划模型Ⅰ
    role: 在满足各卸点需求、铲点供给、矿石品位、装卸能力和班次时间约束的条件下，同时最小化总运量与出动卡车数。
    why: 原则1同时关注运输距离成本和车辆使用成本，且决策变量受到供需、设备服务能力及整数车次等多类约束，适合采用双目标规划描述。
  - name: 回代搜索分步优化模型
    role: 先通过连续松弛求出最少卡车数下界，再将整数卡车数从下界到20辆逐一回代，以总运量最小为目标求解并比较方案。
    why: 直接求解含整数车辆数、整数趟次和复杂时间约束的双目标模型较困难，而卡车数量的可选范围很小，枚举回代能够兼顾可行性与计算效率。
  - name: 优先权加权线性规划模型Ⅱ
    role: 使用全部20辆卡车，在满足最低卸点需求的基础上，以岩石优先的加权总产量最大化，并在产量相近时兼顾总运量。
    why: 原则2要求最大化产量且赋予岩石更高优先级，引入权重系数能够把管理者对岩石产量的偏好转化为可调节的单目标函数。
  - name: 无等待车辆时序安排模型
    role: 依据装车、行驶和卸载周期安排同一路线上的多辆卡车，并在部分路线完成后按就近原则转运车辆。
    why: 仅有运量分配不能保证实际执行时电铲和卸点不发生服务冲突，需要通过时间间隔设计验证多车同线运行的无等待可行性。
  solution_flow: 数据→整理10个铲点的矿石量、岩石量、铁品位，5个卸点的需求量及铲点到卸点距离，并设置载重154吨、装车5分钟、卸载3分钟、班次8小时等参数→模型→建立供需平衡、铲点产能、品位区间、车辆总工时、电铲装车能力、卸点卸载能力和非负性约束下的模型Ⅰ与模型Ⅱ→参数→将运量换算为整数趟次，模型Ⅰ先求卡车数连续下界12.494并上取整为13，模型Ⅱ令优先权系数从0.55至1按0.05递增→求解→利用单纯形法和Matlab求解连续规划，对13至20辆卡车逐一回代，选择总运量最小且车辆最少的方案；对不同权重分别求解并筛选7个主要铲位→验证→比较不同卡车数和不同权重下的结果，检查产能、品位、时间及无等待约束，并将连续运量解转换为可执行的整数趟次和车辆转运计划。
  validation: 采用多层可行性与敏感性验证：首先逐项检查卸点需求、铲点储量、矿石品位28.5%至30.5%、班次总工时以及装卸能力约束；其次对13至20辆卡车进行回代比较，发现总运量和电铲数基本稳定，从而确认13辆卡车方案满足成本最小原则；再次改变岩石优先权系数，比较总产量和岩石产量以检验管理偏好变化对方案的影响；最后通过同线车辆时间间隔分析和完工后车辆转运安排，验证整数趟次方案不会造成电铲或卸点等待冲突。
  visualization:
  - 铲点—卸点运输网络示意图
  - 卡车数量—总运量回代结果表
  - 铲位—卸点运输趟次矩阵表
  - 优先权系数—总产量与岩石产量敏感性表
  pitfalls_avoided:
  - 避免直接采用连续规划得到的12.494辆卡车，因为车辆数量必须为整数且连续解无法执行；将其作为下界并上取整，再对13至20辆进行回代搜索。
  - 避免只按总工时分配车辆而忽略装卸服务冲突，因为电铲和卸点不能同时服务多辆卡车；通过无等待时序安排控制同一路线车辆的到达间隔。
  - 避免将连续运输量直接作为最终调度方案，因为154吨满载要求使运输趟数必须为整数；将运量换算为趟次，并用车辆完工后的跨路线转运弥补分配误差。
  - 避免模型Ⅱ因未限制电铲数量而在全部10个铲位布置电铲，因为这与实际仅可配置有限电铲的条件矛盾；先选择输送量最大的7个铲位固定电铲，再回代求解。
  - 避免用单一固定权重替代管理者偏好，因为不同矿山对岩石产量的重视程度不同；对0.55至1的权重区间进行参数扫描并提供多套备选计划。
  innovation_points:
  - 提出回代搜索的分步算法，将复杂双目标离散规划分解为卡车数下界求解和有限整数区间逐点搜索，降低直接求解难度。
  - 提出“时间四边形”式无等待调度思想，用装车、往返运输和卸载时间关系协调同一路线多车运行。
  - 在产量最大化目标中引入可调岩石优先权系数，并通过权重扫描生成适应不同地理、经济环境和管理偏好的生产计划。
  - 允许卡车完成一条路线后按就近原则跨路线支援，在忽略转场时间的假设下提高车辆利用率并增强整数调度方案的可执行性。
- id: B题 电力市场的输电阻塞管理论文_2004-电力市场的输电阻塞问题--历年数学建模优秀论文大全
  source_paper: B题 电力市场的输电阻塞管理论文 B题 电力市场的输电阻塞管理论文_2004-电力市场的输电阻塞问题--历年数学建模优秀论文大全
  problem_type: 统计分析+优化
  keywords:
  - 输电阻塞
  - 多元线性回归
  - 线性规划
  - 阻塞费用
  - 贪婪算法
  context: 针对含8台发电机组和6条主要线路的电力市场，在负荷需求、机组爬坡能力和线路安全限值约束下，拟合机组出力与线路潮流的关系，并制定兼顾输电安全与阻塞成本的调度方案。
  models:
  - name: 线路潮流多元线性回归模型
    role: 根据历史机组出力数据估计各条线路有功潮流关于8台机组出力的近似表达式，为后续阻塞检验与调度优化提供潮流约束。
    why: 散点图显示单台机组出力与线路潮流具有较明显的线性关系，且电网结构固定时可用线性灵敏度系数近似描述机组出力变化对线路潮流的影响。
  - name: 分段阻塞费用计算模型
    role: 分别计算机组减少序内容量、增加序外容量以及出力不变三种情况下的经济补偿，并形成调度优化的费用依据。
    why: 调度调整对不同机组造成的损失机制不同，采用分段规则能够区分序内容量损失与高报价序外容量损失，并通过赔偿系数兼顾发电方和网方利益。
  - name: 基于报价排序的经济调度模型
    role: 在满足预测负荷、机组出力上下限及爬坡速率约束的条件下，确定各机组的初始出力分配预案和市场清算价。
    why: 各机组采用非递减分段报价，按段价从低到高依次购电具有明确的边际成本结构，可通过线性优化思想和贪婪算法获得最低购电成本方案。
  - name: 最大安全输电能力线性规划模型
    role: 分别在不使用安全裕度和使用安全裕度的情况下最大化机组总出力，得到不同输电阻塞管理原则的负荷阈值983.4828 MW和1094.6 MW。
    why: 回归得到的潮流方程、机组出力边界和线路潮流限值均可线性化，因此可用线性规划稳定求得电网在不同安全标准下的最大可承载负荷。
  - name: 最小阻塞费用安全再调度模型
    role: 当负荷不超过第一阈值时，在所有线路潮流均不超过正常限值的前提下调整机组出力，使总阻塞补偿费用尽可能小。
    why: 阻塞费用主要随机组出力调整幅度变化，可将复杂的分段补偿目标近似转化为出力变化绝对值之和最小，并进一步用平方和目标构造可计算的非线性规划。
  - name: 最小线路越限比例优化模型
    role: 当无法在正常潮流限值内满足负荷时，允许使用线路安全裕度，并最小化各线路潮流超过正常限值的相对比例，同时将阻塞费用作为次级约束或次级优化目标。
    why: 该负荷区间无法完全消除阻塞，直接最小化相对越限程度能够体现“安全第一”，同时通过裕度上界保证任何线路都不超过允许的最终安全范围。
  - name: 拉闸限电与再调度模型
    role: 当预测负荷超过含安全裕度的最大输电能力时，先削减负荷，再调用安全再调度模型确定机组出力。
    why: 超过1094.6 MW后，仅调整发电侧出力已不存在满足线路安全约束的可行解，必须通过限电恢复可行性；论文选择将负荷削减至正常限值下的安全阈值以优先保障输电安全。
  solution_flow: 整理机组当前出力、分段容量、分段报价、爬坡速率及线路潮流样本→绘制散点图并建立6个线路潮流多元线性回归方程→通过回归系数、R²、F检验和p值确定潮流近似模型→依据市场结算规则构造三类分段阻塞补偿费用→结合当前出力和15分钟爬坡速率计算各机组下一时段出力上下限→按报价由低到高贪婪选取段容量，得到满足预测负荷的初始经济调度方案及清算价→将潮流回归方程代入线路约束，检验初始方案是否发生阻塞→用线性规划分别计算正常潮流限值和含安全裕度限值下的最大总出力，划分三种阻塞管理区间→低负荷区间以出力调整量最小近似实现阻塞费用最小，中间区间以线路相对越限比例最小进行安全裕度调度，高负荷区间先拉闸限电再进行安全再调度→重新计算各线路潮流、越限比例和阻塞费用，对方案的安全性与经济性进行验证。
  validation: 回归阶段使用决定系数R²、F统计量和p值检验模型整体显著性，文中6条线路的R²接近1、F值远高于临界值且p值接近0；调度阶段通过总出力等于预测负荷、各机组出力处于爬坡速率决定的上下限内、线路潮流绝对值不超过相应正常限值或安全裕度限值来检验可行性；同时比较983.4828
    MW和1094.6 MW两个最大输电能力阈值下的方案，验证三种管理原则的适用区间，并重新计算阻塞费用与线路越限百分比评价经济性和安全性。
  visualization:
  - 机组出力与线路潮流散点图及线性拟合直线
  - 各线路回归系数与统计检验结果表
  - 各机组调度前后出力对比表
  - 负荷阈值与阻塞管理原则分区图
  - 各线路潮流值、正常限值和安全裕度对比图
  pitfalls_avoided:
  - 避免只按报价高低分配容量而忽略爬坡速率；否则机组在15分钟内可能无法从当前出力达到计划出力，得到的经济调度方案在物理上不可执行。
  - 避免仅保证发电总量等于预测负荷而不检查线路潮流；相同总出力在不同机组间分配会产生不同线路潮流，可能导致局部线路阻塞。
  - 避免把线路安全裕度直接当作常规输电容量长期使用；论文先按正常潮流限值调度，只有正常约束下无可行方案时才使用安全裕度，从而符合安全裕度的应急属性。
  - 避免对序内容量减少和序外容量增加采用同一种补偿公式；两类调整分别对应清算价收入损失和报价高于清算价的成本差异，混合计算会造成补偿不公平。
  - 避免在负荷超过电网最大承载能力时继续强行优化机组出力；此时模型已经无可行解，必须识别1094.6 MW阈值并转入拉闸限电机制。
  - 避免将线路潮流绝对值约束误当作单个线性不等式；应将其拆分为正、负两个方向的线性约束，才能正确覆盖双向潮流越限。
  - 避免贪婪选段时整段加入造成总出力超过预测负荷；最后一个报价段需要允许部分选取，使机组总出力精确等于负荷需求。
  - 避免先选低价段后遗漏机组最低出力要求；算法需要检查各机组下一时段出力下限并修正，否则所得方案可能违反运行约束。
  innovation_points:
  - 将数据驱动的线路潮流回归模型嵌入电力调度优化，以历史样本估计的潮流灵敏度替代复杂的完整潮流计算，实现统计建模与优化决策的衔接。
  - 根据正常潮流限值和含安全裕度限值分别求解最大输电能力，形成983.4828 MW与1094.6 MW两个阈值，并据此自动切换正常再调度、安全裕度调度和拉闸限电三种管理原则。
  - 构造兼顾序内容量减少与序外容量增加的分段补偿机制，并引入0.6至0.8的协商赔偿系数协调发电方与网方利益。
  - 采用分层优化思想处理安全与经济冲突：先保证线路安全或最小化相对越限程度，再在安全可行域内降低阻塞费用，明确体现“安全第一、经济第二”。
  - 针对分段报价结构设计可部分选段的贪婪调度算法，并结合线性规划和逐步优化方法处理不同负荷区间，提高模型的可解释性与求解效率。
- id: B_cumcm0732
  source_paper: B B_cumcm0732
  problem_type: 优化+综合评价
  keywords:
  - 多目标决策
  - 拆点构图法
  - 二维状态更新标号法
  context: 面向公交自主查询系统，在公汽、地铁及步行等出行方式下，根据乘客对时间、费用、换乘次数和体力消耗的不同偏好选择最优路线。
  models:
  - name: 多目标公交线路选择模型
    role: 以总用时、总费用和换乘次数为核心目标，描述任意起终点之间的路线选择问题。
    why: 实际出行中多个指标通常无法同时达到最优，必须根据乘客偏好对相互冲突的目标进行统一决策。
  - name: 分层排序法（字典序优化）
    role: 按照目标重要程度依次优化首要、次要和最次要指标，并用向量标号的字典序比较实现求解。
    why: 适用于乘客能够明确给出时间、费用和换乘次数优先级的情形，可保证低优先级目标不会损害高优先级目标的最优性。
  - name: 目标约束法
    role: 选定一个主要优化目标，并将其他目标转化为费用上限、换乘次数上限或体力消耗上限等约束。
    why: 适用于乘客希望主要指标最优、同时要求其他指标不超过可接受阈值的实际需求。
  - name: 拆点构图法与Dijkstra最短路模型
    role: 通过拆分公交站点，将依赖前后所乘线路的换乘时间或换乘次数转化为固定边权，再利用Dijkstra算法求最小代价路径。
    why: 原公交图中的换乘代价与到站线路和离站线路有关，属于路径相关的动态边权，不能直接应用经典最短路算法；拆点后可将其等价转化为非负固定边权问题。
  - name: 二维状态更新标号法
    role: 以“站点—当前线路”二元组作为搜索状态，直接在扩展状态空间中进行标号永久化、松弛更新和路径回溯。
    why: 它与拆点图的状态表达等价，但无需显式生成大量拆分节点和连接边，可降低构图难度并提高线路查询效率。
  - name: 费用递增可行性搜索
    role: 从较低费用开始逐级增加预算，搜索是否存在满足该费用的可行路线，以确定最低乘车费用。
    why: 分段计费或多票制使费用可能依赖在线路上的累计乘坐区间，难以直接表示为普通固定边权，因此不能简单套用Dijkstra算法。
  - name: 公汽—地铁多模式交通网络模型
    role: 在公汽网络中加入地铁站、地铁线路及公汽与地铁之间的换乘边，并针对不同换乘类型设置时间、费用和次数代价。
    why: 同时考虑公汽和地铁后，会出现地铁内部换乘、公汽与地铁双向换乘以及经地铁站连接不同公汽站等新型状态转移。
  - name: 步行与体力消耗约束模型
    role: 将站点间步行时间纳入网络，并增加体力消耗指标或约束，在公交、地铁和步行组合方案中进行路线优化。
    why: 若允许站点间步行，仅优化时间或费用可能产生步行距离过长的不合理路线，因此需要限制乘客的体力负担。
  solution_flow: 数据→整理公汽站点、地铁站点、线路方向、相邻站关系、票制及各类行驶和换乘时间→构建有向公交网络，并以“站点—当前线路”建立二维状态空间→计算行驶、换乘、费用和体力消耗等转移参数→根据用户偏好选择分层排序法或目标约束法→采用二维状态更新标号算法求解非负代价最优路径，费用目标结合递增预算可行性搜索→通过前驱状态回溯得到完整路线→比较不同目标优先级以及加入地铁、步行前后的时间、费用和换乘次数，完成方案评价。
  validation: 首先证明拆点图中路径边权和与实际乘车代价等价，从而验证最短路转化的正确性；其次用数学归纳法证明二维状态标号在永久化时等于从起点到该状态的最小代价，并依据首次永久化终点状态即得到全局最优解；最后利用多组指定起终点进行案例求解，对不同目标优先级下的路线、时间、费用和换乘次数进行横向比较，同时比较加入地铁前后的结果，检验模型输出是否符合“时间优先通常减少途经站数、换乘优先减少换车、费用优先降低支出”的实际规律。
  visualization:
  - 公交网络及拆点构图示意图
  - 二维状态更新标号算法流程图
  - 不同目标优先级的路线与指标对比表
  - 加入地铁前后的方案对比表
  pitfalls_avoided:
  - 避免直接在“站点”层面使用Dijkstra算法：同一站点由不同线路到达时，后续换乘时间和换乘次数不同，若忽略当前线路会错误地将具有不同未来代价的状态合并。
  - 避免把路径相关的换乘代价直接作为普通固定边权：换乘是否发生取决于前驱线路与后继线路，采用拆点或“站点—线路”状态后才能满足最短路的加性条件。
  - 避免对分段计费线路机械套用最短路算法：多票制费用可能由累计乘坐区间决定，不一定能分解为简单固定边权，因此采用费用递增的可行性搜索。
  - 避免显式拆点导致图规模膨胀：若站点有多条入边和出边，拆点及新增连接边数量会快速增长；二维状态标号法只维护实际存在的站点—线路状态，减少存储和构图开销。
  - 避免用单一加权和代替明确的用户偏好：权重难以解释且可能因量纲不同扭曲结果，分层排序法和目标约束法分别对应严格优先级与可接受阈值，决策含义更清晰。
  - 避免在加入地铁后仅增加地铁行驶边而遗漏换乘关系：模型显式加入地铁内部、公汽到地铁、地铁到公汽以及经地铁站连接不同公汽站的换乘边，防止漏掉可行路线。
  - 避免允许步行后产生过度步行的伪最优方案：仅以费用或换乘次数优化可能倾向于长距离步行，因此加入体力消耗目标或上限约束。
  innovation_points:
  - 提出拆点构图法，将依赖前后线路的动态换乘代价转化为固定非负边权，使公交多目标路线问题能够使用经典最短路思想求解。
  - 提出二维状态更新标号法，以“站点—当前线路”直接表示扩展状态，在保持拆点图等价性的同时避免显式构造大规模改造图。
  - 将二维标号扩展为时间、费用和换乘次数的向量，并通过字典序更新统一实现多目标分层排序。
  - 在标号永久化过程中嵌入目标约束，只扩展满足阈值的状态，从而提前剪除不符合费用、换乘或体力要求的无效搜索分支。
  - 通过调整节点、换乘边和转移代价，将同一算法框架扩展到公汽—地铁—步行多模式交通网络。
- id: A题论文_长江水质的评价和预测
  source_paper: A题论文 A题论文_长江水质的评价和预测
  problem_type: 综合评价+统计分析+预测+优化
  keywords:
  - 归一化综合评价
  - 反应扩散方程反演
  - 回归预测与污染控制
  context: 基于长江流域多站点、多时段水质与水文数据，综合评价流域水质，识别主要污染源分布，预测未来水质趋势并确定满足治理目标所需的最低污水处理量。
  models:
  - name: 分段归一化加权综合评价模型
    role: 将溶解氧、高锰酸盐指数、氨氮和pH值转化为统一尺度，构造单月、单站点水质综合指标并划分水质等级。
    why: 四项指标量纲、优劣方向和合格区间不同，需要以III类与IV类水分界值为统一基准；分段处理还能保证综合指标小于等于1对应可饮用水，并突出任一指标超标造成的水质风险。
  - name: 水域体积加权流域综合评价模型
    role: 根据各观测站代表水域的长度和平均横截面积计算代表水量，对站点评价结果进行加权，得到长江全流域综合评价值。
    why: 不同站点代表的河段长度、流量和水域规模差异明显，直接算术平均会使小支流与大尺度干流具有相同影响，因此采用代表水体体积加权更符合实际贡献。
  - name: 反应扩散方程差分反演模型
    role: 将污染物浓度的时间变化、对流、扩散、外源输入和自然降解统一建模，通过离散观测浓度反演各河段污染源强迫函数。
    why: 污染物在河流中的变化同时受水流输运、纵向扩散、降解和外部排放影响，反应扩散方程具有明确的水动力学与污染迁移机理，差分离散后可直接利用时空观测数据求解未知源强。
  - name: 简化常微分方程污染源反演模型
    role: 在扩散项和浓度时间变化项影响较小时，将偏微分方程简化为稳态对流—降解方程，解析反演分段污染源浓度。
    why: 数据分析表明扩散项与时间变化项相对较小，简化模型能够降低参数不确定性并获得解析公式，同时可作为完整差分反演结果的独立交叉验证。
  - name: 含支流汇入与瞬时混合的污染源反演模型
    role: 利用支流与干流的流量守恒和混合浓度公式，对一个或两个支流汇入的河段进行分段反演，修正支流造成的浓度突变。
    why: 若把支流汇入引起的浓度变化全部归因于干流污染源，会产生源强误判；显式引入支流流量和入口位置可以区分支流输入与河段内部排放。
  - name: 移动平均—一元线性回归预测模型
    role: 对历年各类水质占比进行平滑和趋势回归，预测未来十年可饮用水、IV类、V类及劣V类水的比例变化。
    why: 年度水质比例具有长期趋势但夹杂偶然波动，三项移动平均可削弱随机扰动；线性回归便于利用有限年度样本进行趋势外推，并可通过F检验判断趋势是否显著。
  - name: 二元线性回归污染控制模型
    role: 建立相对排污量与IV、V类水合计比例及劣V类水比例之间的关系，求出满足不可饮用水不超过20%且劣V类水为0时的允许排污阈值，并计算最低年度污水处理量。
    why: 劣V类水数据含大量零值，单独一元回归稳定性较差；将两项治理目标联合纳入二元回归可以减少零值影响，并把水质约束转化为可计算的排污阈值和处理量决策。
  solution_flow: 首先清洗并整理17个站点28个月的四项水质指标、流量、流速、站点距离及近10年分类水质比例和排污数据；再以III类与IV类水界限为基准，对不同量纲和不同优劣方向的指标进行分段归一化，按权重构造月度综合指标和站点评价向量；依据站点拓扑、河段长度及由流量除以流速得到的平均横截面积，估算各站点代表水量并加权得到全流域评价；随后建立反应扩散方程，给定扩散与降解参数、估计分段流速，分别采用差分反演、稳态常微分方程反演和含支流混合反演计算各河段污染源强，并综合三种结果定位主要污染区；对年度水质占比进行三项移动平均、最小二乘回归和F检验，预测未来十年水质趋势，并对各类比例作非负与总和为100%的标准化约束；最后建立相对排污量与水质目标之间的二元线性回归，求得允许相对排污量临界值，用预测排污量减去临界值并乘以平均总流量，得到逐年最低污水处理量。
  validation: 综合评价方面，将归一化后的III类与IV类分界固定为1，并用国家六类水质标准对应值校准综合指标等级，同时检查全流域加权结果是否落入相应等级区间；污染源识别方面，比较差分反演、简化常微分方程反演和含支流反演三种模型的年度源强排序，三者均将高锰酸盐主要污染定位于宜昌南津关至岳阳城陵矶段，将氨氮主要污染定位于攀枝花至重庆朱沱段和宜昌至岳阳段，形成交叉验证；回归方面在显著性水平0.05下进行F检验，对不显著序列先移动平均，仍不显著时不强行拟合，而通过总比例约束补算；预测结果进一步施加比例非负及六类水总和为100%的约束；控制模型通过F检验，并将一元与二元回归得到的排污临界值同历史年份的水质状态对照，二元模型的阈值与历史不可饮用水超过20%及劣V类水出现的位置更一致，因此选作最终结果。
  visualization:
  - 长江干支流观测站相对位置与河段拓扑图
  - 各站点水质综合指标及等级对比柱状图
  - 各河段污染源反演强度热力图或分段折线图
  - 未来十年各类水质占比趋势折线图
  - 相对排污量与不可饮用水比例的回归散点图
  - 未来十年最低污水处理量柱状图
  pitfalls_avoided:
  - 避免直接汇总不同量纲的水质指标：溶解氧、高锰酸盐指数、氨氮和pH值的单位、优劣方向及合格区间不同，直接加权会导致大数值或大量纲指标支配结果，因此先按饮用水分界进行方向一致的分段归一化。
  - 避免用普通加权平均掩盖单项严重超标：当所有指标均合格时采用加权综合值，而存在指标超过分界值时以最大超标指标刻画水质，防止某项严重污染被其他正常指标抵消。
  - 避免把所有观测站等权处理：各站代表的河段长度、横截面积和水量不同，等权平均会高估小水域、低估大水域，因此以代表水域体积作为流域评价权重。
  - 避免将支流汇入造成的浓度突变误判为干流排污：模型利用流量守恒和瞬时混合关系显式处理支流入口，否则反演出的干流源强会混入支流污染贡献。
  - 避免在缺少证据时机械保留反应扩散方程全部项：先评估扩散项和时间变化项的量级，在其影响很小时构造稳态简化模型，减少不稳定差分和参数误差，同时保留完整模型用于对照。
  - 避免对不显著的水质比例序列强行线性外推：先进行F检验和移动平均，连续处理后仍不显著的IV类水不直接回归，而利用六类水比例和为100%的约束推算。
  - 避免预测出负比例或比例总和不等于100%：对预测值实施非负截断，并统一标准化至总和100%，保证预测结果符合水质构成的基本约束。
  - 避免用大量零值的劣V类水数据单独进行不稳定回归：将IV、V类水比例和劣V类水比例联合纳入二元模型，减少零膨胀对斜率和排污阈值估计的干扰。
  - 避免仅凭拟合优度选择治理模型：除F检验外，还把模型临界值与历史排污量及水质状态逐年对照，防止统计显著但治理阈值不符合实际。
  innovation_points:
  - 以III类与IV类水分界为统一锚点构造分段归一化指标，使综合评价值1具有明确的可饮用水判别含义，并结合最大超标项增强风险敏感性。
  - 把站点水质、河段长度、平均横截面积和干支流拓扑结合起来，以代表水体体积完成全流域尺度的综合评价，而非简单站点平均。
  - 采用差分反演、稳态解析反演和含支流混合反演三条路径识别污染源，并通过多模型结论一致性提高污染河段定位的可信度。
  - 将预测与控制连接起来，通过回归模型把水质目标转化为允许相对排污量阈值，再计算逐年最低污水处理量，形成评价、溯源、预测和治理决策的一体化建模链条。
  - 针对劣V类水比例大量为零的问题，将多个不可饮用水指标联合建立二元回归，相比独立一元回归得到更符合历史状态的排污临界值。
- id: B题_钻井布局的数学模型
  source_paper: B题 B题_钻井布局的数学模型
  problem_type: 优化
  keywords:
  - 钻井布局
  - 网格平移与旋转
  - 最大覆盖
  - 映射与覆盖
  - 最大团
  context: 在给定位置误差下，通过平移或旋转单位方格网，使尽可能多的旧井靠近网格节点，从而最大化可利用旧井数量，并判断给定井组能否全部利用。
  models:
  - name: 映射—覆盖模型
    role: 将无限平面上的周期网格布局问题转化为有限单位区域内判决正方形或判决圆的最大覆盖问题。
    why: 利用网格的整数周期性消除节点编号和无界平移变量，显著压缩搜索空间，并统一处理网格平移与坐标平移。
  - name: 全局枚举模型
    role: 按给定精度遍历一个单位周期内的横纵平移量，计算每个布局可利用的旧井数。
    why: 方法直观、可靠且易于实现，适合作为基础解法和其他算法的结果校验基准。
  - name: 单点约束部分穷举模型
    role: 先保证至少一口旧井被利用，再在该井对应的局部误差区域内搜索网格位置并检查其他井。
    why: 最优解至少覆盖一个旧井，因此可排除完全不覆盖旧井的无效平移区域，减少搜索量。
  - name: 边界候选部分穷举模型
    role: 利用最优判决方块可移动到由两点分别卡住左边界和下边界，或由一点卡住左下顶点的性质，枚举有限候选位置。
    why: 将连续位置优化转化为由数据点确定的离散候选集，复杂度约为O(n^3)，且不依赖数值网格精度。
  - name: 涂层叠加模型
    role: 把每口映射井对应的可行平移区域离散成全1小矩阵并叠加，以矩阵最大元素确定最大覆盖数及网格起点。
    why: 将几何覆盖转化为数组累加，精度适中且井点较多时计算快速，也便于直接定位最优平移参数。
  - name: 图论最大团模型
    role: 以旧井为顶点、两井可同时利用为边构造无向图，在棋盘距离下通过最大团求最多可同时利用的旧井集合。
    why: 棋盘距离下两两可同时利用可推出整体同时利用，因此最大团与最优井组严格等价，模型精确且不受离散精度影响。
  - name: 角度—平移全局搜索模型
    role: 在0到90度的对称角度区间内离散旋转角度，并在每个角度下求解固定方向的最大覆盖问题。
    why: 能够直接处理可旋转网格，具有全局性和实现可靠性，可作为旋转优化问题的基准算法。
  - name: 旋转矢量局部搜索模型
    role: 由可同时利用的旧井对确定候选网格方向，并依据角度扰动上界仅在候选方向附近精细搜索。
    why: 两井距离与整数网格矢量长度的匹配关系能显著缩小角度搜索区间，井点数量较小时比全局角度扫描更高效。
  - name: 全局搜索—局部精化模型
    role: 先放大允许误差并以大步长搜索得到最优井数上界，再用真实误差求下界，并对上下界未闭合的角度区间逐步细化。
    why: 误差扩张可为邻近角度建立严格上界，结合区间剪枝能够减少无效搜索；当上下界相等时还能给出最优性证明。
  - name: 最小最大半径旋转中心模型
    role: 选择使所有旧井到旋转中心的最大距离最小的位置，以降低角度扰动造成的最大坐标位移。
    why: 角度搜索步长与最大旋转半径成反比，减小该半径可在保持误差保证的同时增大步长，从而减少角度检查次数。
  - name: 全井可利用性判别模型
    role: 分别在棋盘距离、固定方向欧氏距离和可旋转欧氏距离下，利用坐标极差、判决圆覆盖及整数网格矢量条件判断全部旧井能否利用。
    why: 针对不同距离度量和旋转条件建立充要条件、充分条件或必要条件，可快速排除不可能情形，并为精确搜索提供理论依据。
  solution_flow: 旧井坐标与允许误差数据→利用整数周期将井点映射到单位网格邻域→固定方向时构造判决正方形或判决圆的最大覆盖模型，可采用枚举、边界候选、涂层叠加或最大团求解→允许旋转时将角度限制在0至90度，优化旋转中心并通过全局粗搜索获得上界→恢复真实误差计算下界，对未被剪枝的候选角度局部精化→输出最大可利用井数、井号集合、旋转角度和网格原点→通过多模型结果一致性及上下界闭合验证最优性。
  validation: 首先用全局枚举结果作为数值基准，与部分穷举、涂层法和图论模型的最大井数及井号集合交叉核对；其次用边界候选定理、棋盘距离下最大团等价性和判决圆覆盖条件验证模型正确性；旋转情形通过放大误差得到上界、真实误差搜索得到下界，当二者相等时证明全局最优；最后将所得网格参数代回原坐标，逐井计算其到最近网格节点的距离，确认入选井均不超过允许误差且未入选井不会改变最优计数。
  visualization:
  - 旧井位置与最优网格叠加图
  - 单位映射区域及判决正方形或判决圆覆盖图
  - 平移参数空间覆盖数热力图
  - 旋转角度—最大可利用井数曲线
  - 旧井兼容关系图与最大团高亮图
  pitfalls_avoided:
  - 避免在无限平面上直接枚举所有网格节点；网格具有整数周期性，先将坐标映射到单位区域即可保留可利用关系并把无界搜索化为有限搜索。
  - 避免默认欧氏距离下两两兼容就能推出全部兼容；该性质只在本文棋盘距离的轴对齐方形覆盖中成立，欧氏圆覆盖必须进一步检查公共交集。
  - 避免在高精度要求下盲目使用二维全局网格枚举；其复杂度随精度平方增长，精度较高时应改用数据点确定的边界候选算法。
  - 避免对旋转角度采用未经误差控制的固定粗步长；远离旋转中心的井点位移更大，步长必须依据最大旋转半径和允许误差设定，否则可能漏掉最优角度。
  - 避免只给出粗搜索得到的可行解而声称其全局最优；采用误差放大上界与真实误差下界，只有上下界相等时才确认最大井数。
  - 避免始终以原坐标原点作为旋转中心；过大的最大旋转半径会迫使角度步长过小，应先求解最小覆盖圆式的最小最大半径问题以降低计算量。
  - 避免忽视算法与井点规模的匹配；旋转矢量法需枚举井对，井数较大时候选方向过多，可能比带剪枝的全局—局部精化法更慢。
  - 避免只比较最大覆盖数量而不回代几何约束；离散化和边界取整可能产生误判，最终必须在原坐标中检查每口入选井到最近节点的实际距离。
  innovation_points:
  - 提出映射法则和覆盖法则，把周期性网格平移问题统一转化为有限单位区域中的几何最大覆盖问题。
  - 证明最优判决方块存在由边界点确定的规范位置，从而把连续优化降维为与精度无关的有限候选枚举。
  - 将几何覆盖解释为矩阵涂层叠加，在精度适中、井点较多时实现高效计算。
  - 在棋盘距离下建立井点兼容图，并利用两两兼容蕴含整体兼容的性质，将最大可利用井组严格转化为最大团问题。
  - 构造误差放大上界与真实误差下界相结合的全局搜索—局部精化算法，通过上下界闭合兼顾计算效率和全局最优性证明。
  - 通过最小化所有井到旋转中心的最大距离来放大允许的角度步长，将几何中心选择与搜索复杂度控制结合起来。
  - 针对棋盘距离、固定方向欧氏距离和可旋转欧氏距离分别给出充要条件、充分条件与必要条件，形成分层的可行性判别体系。
- id: A题_DNA分类模型
  source_paper: A题 A题_DNA分类模型
  problem_type: 分类聚类+统计分析+优化
  keywords:
  - DNA序列分类
  - 关键词特征提取
  - 逐步优选与层次判别
  context: 基于少量已知类别的DNA序列，提取具有类别代表性的重复碱基字符串，并建立可用于未知序列的定量分类规则。
  models:
  - name: 广度优先字符串搜索模型
    role: 从A、B两类训练序列中逐层生成并筛选重复出现的字符串，构造候选词集合。
    why: 只有出现至少两次的字符串才可能形成稳定特征，广度优先搜索还能在某一层无新词时及时终止，避免无意义地枚举全部长字符串。
  - name: 标准化频率—分散度统计特征模型
    role: 利用标准化频率t衡量字符串相对于序列长度和理论出现概率的富集程度，利用分散度s衡量字符串覆盖同类样本的广泛程度。
    why: 单纯使用出现次数容易偏向长序列或少数序列中的局部重复，同时考虑t和s可以兼顾出现强度与类别普遍性。
  - name: 幂函数优先级模型与迭代最小二乘优化
    role: 以f(s,t)=s^αt^β评价候选词的重要性，通过对数线性化和最小二乘法估计α、β，并反复选择高优先级词直至参数稳定。
    why: 幂函数能保证优先级随频率和分散度单调增加，对数变换后便于参数估计；迭代优选可降低人工初选关键词带来的主观性。
  - name: 关键词加权分类得分模型
    role: 分别计算序列对A类和B类的权值D_A(P)=Σf_A,i^κ_A x_A,i(P)和D_B(P)=Σf_B,i^κ_B x_B,i(P)，其中x表示关键词出现次数。
    why: 不同关键词的分类能力并不相同，将出现次数与关键词优先级结合，可以把离散字符串特征转化为可比较的类别得分。
  - name: 逐层关键词阈值判别模型
    role: 令关键词数k从16逐步减少到7，在每一层计算类别得分并与阈值r比较，同时依据通过层数、类别得分差设置分类显著性。
    why: 较多关键词对应严格标准，逐层放宽可以在分类覆盖率和区分度之间折中，并允许将对两类均不显著的序列归为其他类别。
  solution_flow: 数据：将1—10号序列作为A类、11—20号序列作为B类，统计候选字符串的出现次数、位置、标准化频率和分散度；模型：用广度优先法提取重复词，以f=s^αt^β建立关键词优先级，再构造A、B两类加权得分和逐层阈值判别规则；参数：对优先级函数取对数后用最小二乘法估计α、β，反复筛选前16个关键词直至参数稳定，并对不同关键词层数k优化影响力因子κ_A,k、κ_B,k；求解：统计未知序列中两类关键词的出现次数，从k=16递减至k=7计算D_A、D_B，与r=4.565比较，根据通过层数和得分差确定类别及显著性；验证：在已知样本、20条待分类序列和182条扩展序列上检验分类表现，并通过随机修改部分碱基测试结果稳定性。
  validation: 首先检查已知A、B样本的类内得分是否足够大并能正确回判；其次考察20条待分类序列在A、B得分和通过层数上的区分度，并以不遗漏样本且双重归类比例不超过5%为条件选择阈值；随后将同一流程应用于182条未知序列评估可推广性；最后随机改变已知序列中的部分字符并重复分类，以分类结果是否保持一致作为扰动稳定性检验。
  visualization:
  - 广度优先字符串搜索流程图
  - 优先级函数迭代优化流程图
  - 优先级关于分散度与标准化频率的三维散点图
  - 关键词出现次数与分散度对比表
  - 分层分类判别流程图
  pitfalls_avoided:
  - 避免直接按字符串原始出现次数选特征，因为原始次数会受到序列长度、字符串长度及理论出现概率影响；模型使用标准化频率进行校正。
  - 避免把集中出现在单条序列中的高频字符串误认为类别公共特征，因为局部重复不代表整个类别；模型同时引入覆盖同类样本数的分散度s。
  - 避免完全依赖人工挑选关键词，因为人工粗选具有主观性且可能遗漏有效特征；模型通过优先级函数、最小二乘估计和反复重排使参数与关键词集合趋于稳定。
  - 避免所有关键词等权造成弱特征干扰，因为各关键词的区分能力不同；模型使用优先级f及其影响力指数κ进行加权。
  - 避免固定使用全部关键词导致判别标准过严、样本无法归类；模型将关键词数从16逐层减少到7，在严格性与覆盖率之间进行折中。
  - 避免强制把每条序列归入A或B，因为实际数据中可能存在两类之外的序列；模型设置显著性规则，并将对两类均不显著的样本归入另类。
  innovation_points:
  - 把DNA碱基组合类比为文章关键词，以重复字符串作为可解释的类别特征，实现从序列数据到词频特征的转换。
  - 构造同时融合标准化频率和样本分散度的幂函数优先级指标，并用迭代最小二乘法联合完成关键词筛选与参数稳定化。
  - 将关键词优先级与其在待测序列中的出现次数结合，建立A、B两套独立的定量分类得分。
  - 采用关键词数量逐层递减的分类机制，并结合通过层数和类别得分差给出分类显著性及另类判定。
- id: A题_DNA序列分类的数学模型
  source_paper: A题 A题_DNA序列分类的数学模型
  problem_type: 分类聚类+统计分析
  keywords:
  - DNA序列分类
  - 几何特征提取
  - 神经网络模式识别
  context: 根据已知类别的DNA序列样本，从碱基组成、排列趋势和几何轨迹中提取特征，并对未知DNA序列进行二分类。
  models:
  - name: 三维P2曲线积分模型
    role: 利用碱基的三种生物化学对称关系将DNA序列映射为三维累积轨迹，并以X方向积分的符号作为分类判据。
    why: 嘌呤与嘧啶、氨基与酮基、强氢键与弱氢键三种划分具有明确的生物学意义；三维轨迹与原DNA序列一一对应，能够在保留序列信息的同时提取整体组成差异。
  - name: 单层感知机模型
    role: 以单碱基、二联体或三联体的频数作为输入，对DNA序列进行线性二分类，并作为神经网络方案的基准模型。
    why: 模型结构简单、训练速度快，适合检验样本在不同频数特征空间中是否线性可分。
  - name: BP双层感知机模型
    role: 通过含隐藏层的前馈神经网络学习序列特征与类别之间的非线性映射。
    why: 原始频数特征呈现线性不可分性，隐藏层与误差反向传播算法能够构造非线性分类边界，提高识别正确率。
  - name: 改进型BP神经网络模型
    role: 调整感知机层响应函数并强化类别信息提取，以改善普通BP网络对相似样本的辨识能力。
    why: 普通BP网络仍无法完全区分特征相近的样本，因此需要通过网络响应方式和信息提取机制的改进提高可分性。
  - name: LVQ学习向量量化模型
    role: 在监督条件下训练竞争层，根据输入特征向量与类别原型之间的距离完成分类。
    why: LVQ适用于模式识别，可通过原型竞争刻画类内相似性，在传统感知机难以完全识别时提供另一种较可靠的分类机制。
  - name: 生物学特征增强BP模型
    role: 将序列中的嘌呤含量及其位置分布信息构造成网络输入，再利用BP网络完成未知序列分类。
    why: 单纯改变网络结构难以解决特征重叠问题，而积分模型已表明嘌呤与嘧啶的整体差异具有显著判别力，将该生物学先验融入输入可明显提高分类正确率。
  - name: 二维随机游动方向区间模型
    role: 将A、C、G、T分别映射为平面上的四个方向，以累积轨迹的平均幅角和类别幅角区间进行判别。
    why: 随机游动轨迹能够同时反映碱基整体含量和局部排列趋势；方向特征对随机扰动较稳定，且比仅统计终点或移动距离保留更多序列结构信息。
  - name: 二维随机游动正态概率模型
    role: 假设经过圆周到实线变换后的平均幅角在各类别中服从正态分布，利用后验概率阈值进行分类，并通过t分布构造均值置信区间。
    why: 硬区间判别可能产生区间外或边界上的不可分类样本，概率模型能够给出柔性类别判断及统计可信度。
  solution_flow: 数据→读取已标注与待分类DNA序列，累计统计A、C、G、T及二联体、三联体频数→分别构造三维P2曲线、神经网络输入特征和二维随机游动轨迹→计算X方向积分、训练感知机/BP/LVQ网络，并估计各类幅角均值、方差与特征区间→依据积分正负、网络输出、幅角区间或后验概率完成二分类→用已知样本回代、重复随机训练、模型间结果对照和置信区间评估验证分类结果。
  validation: 首先用已知类别的前20个序列检验模型，确认三维积分模型的分类与标准答案一致；神经网络采用多次随机抽取样本训练并回代模拟，比较90%、95%和100%的识别率，同时观察训练误差曲线；对未知样本比较积分模型、神经网络模型和二维随机游动模型的分类一致性；随机游动概率模型进一步利用t分布置信区间评价幅角均值估计的统计可信度，并允许证据不足的样本标记为不可分。
  visualization:
  - DNA序列三维P2空间曲线图
  - 二维随机游动轨迹图
  - 神经网络结构图
  - 神经网络训练误差曲线图
  - 类别幅角分布与置信区间图
  pitfalls_avoided:
  - 避免在数据线性不可分时继续依赖单层感知机，因为单一超平面无法完全分离两类样本，论文转而使用BP、LVQ及生物学特征增强网络。
  - 避免只调整神经网络规模而忽略输入特征质量，因为相似序列在简单碱基频数下仍会重叠；引入嘌呤含量及其位置分布后可提高样本可分性。
  - 避免使用全部已知样本训练后再用同一批样本宣称分类能力，因为这种做法会削弱结果的可信度；论文采用随机抽取部分样本、多轮训练和重复模拟进行检验。
  - 避免仅以二维游动距离作为特征，因为非特征随机信息会造成轨迹螺旋摆动并缩短净位移；提取总体前进方向可降低随机扰动影响。
  - 避免强制给所有样本赋予类别，因为幅角落在两类特征区间之外或证据不足时硬分类会产生误判；区间模型保留了不可分类选项，概率模型则给出后验概率。
  innovation_points:
  - 依据三种碱基生物化学对称关系，将A、C、G、T置于正四面体结构中，并构造与DNA序列一一对应的三维P2曲线。
  - 从三维轨迹中发现X方向积分可表征嘌呤与嘧啶的整体差异，从而形成具有明确生物学解释的简洁分类规则。
  - 将几何模型发现的嘌呤分布规律作为先验知识嵌入BP网络输入，实现机理特征与数据驱动分类的结合。
  - 把DNA序列映射为二维随机游动轨迹，以平均幅角提取整体方向趋势，并结合正态概率判别与t置信区间表达分类不确定性。
  - 采用积分模型、神经网络模型和随机游动模型进行多角度交叉判别，通过模型间结果一致性增强结论的稳健性。
- id: A题优秀论文_2002年A_C题车灯线光源的优化设计
  source_paper: A题优秀论文 A题优秀论文_2002年A_C题车灯线光源的优化设计
  problem_type: 优化+仿真+综合评价
  keywords:
  - 旋转抛物面反射
  - 线光源优化
  - 光线追迹
  - 函数最值
  - 亮区仿真
  context: 针对汽车前灯旋转抛物面反射镜，在满足测试屏上指定点照度规范的条件下优化线光源长度与功率，并模拟其一次反射形成的亮区。
  models:
  - name: 空间几何光学反射模型
    role: 根据入射角等于反射角、入射向量与法向量及反射向量共面、反射点位于旋转抛物面上等条件，确定光源点经镜面反射后到达指定测试点的全部可能光路。
    why: 问题的核心约束来自三维镜面反射规律，该模型能够把光线传播问题转化为可由符号计算和数值计算求解的代数方程组。
  - name: 分段光线计数与照度积分模型
    role: 分别统计线光源各位置到达B、C测试点的直射光、平面反射光和非平面反射光条数，并结合区间长度、反射率、入射角余弦和光程平方反比计算照度函数。
    why: 同一光源点可能对应零条、一条或多条有效反射光线，必须先按光线条数变化的临界点分段，才能正确累加各段对测试点照度的贡献。
  - name: 极小功率的最大最小优化模型
    role: 以满足C点照度不低于额定值、B点照度不低于其两倍为约束，将总功率最小化转化为关于半光源长度b的最大最小函数优化。
    why: 单位长度功率与总功率存在线性关系，消去单位功率后可将带照度约束的优化问题降维为单变量函数求极值问题，便于使用数值扫描和绘图求解。
  - name: 描点法光线追迹仿真模型
    role: 离散采样光源和抛物面，在每对采样点处计算反射方向及其与25米测试屏的交点，从而绘制反射亮区并近似显示光强分布。
    why: 直接遍历光源与镜面采样点的方法概念直观，且点的疏密能够在一定程度上反映测试屏上的相对明暗分布，适合用作基准仿真。
  - name: 线段投影亮区仿真模型
    role: 利用线光源经过镜面固定点反射后在测试屏上的像仍为保持比例关系的线段这一性质，仅追踪光源端点和中点，再叠加各镜面采样点对应的有效线段。
    why: 该模型避免对光源内部大量取点，在保持亮区轮廓准确性的同时显著降低计算量，并改善边界模糊问题。
  - name: 设计规范综合评价模型
    role: 从驾驶员反应与制动需求、空间照射范围、光强分布、眩光风险、照明效率和生产成本等角度评价候选光源长度及设计规范的合理性。
    why: 数学目标函数可能出现多个局部最优解，仅依据数值极值无法保证工程可行性，需要结合安全、环境和制造约束进行综合筛选。
  solution_flow: 数据→给定旋转抛物面方程、焦点、线光源位置、B和C测试点坐标、镜面反射率及照度规范，并设置仅考虑直射和一次反射等假设→建立三维反射方程，将反射点分为位于主截面和平面外两类，求出各光源位置对应的有效反射点及反射光线数量→根据光线数量发生变化的临界位置对光源区间分段，构造B、C两点的单位功率照度函数→把约束功率最小化转化为关于半长度b的最大最小函数优化，以0.01为步长进行数值扫描和绘图求极值→得到首个合理最优点b约为1.91毫米，即线光源总长度约为3.82毫米→分别采用描点法和线段法进行一次反射亮区仿真，并剔除会被反射镜再次截获的光线→通过误差估计、双算法轮廓对照、计算效率比较以及照射范围和生产成本分析验证结果。
  validation: 首先对等光程、等入射角近似进行定量误差分析：反射光程相对差异不超过约千分之三，方向余弦相对差异约万分之三，累积相对误差控制在约千分之四；其次用描点法与线段法独立绘制亮区，两者得到的纺锤形轮廓和尺度基本一致，形成交叉验证；再次比较两种算法的运行时间和边界清晰度，确认线段法的效率优势及描点法反映明暗分布的能力；最后比较短光源与长光源产生的照射范围，结合眩光、能量浪费、驾驶安全和生产成本，验证选取首个局部最优长度而非较大长度解的工程合理性。
  visualization:
  - 光源坐标与镜面反射点坐标的函数关系图
  - 反射角余弦差随圆周参数变化的零点图
  - B、C点分段光线数量表
  - 最大最小目标函数随光源半长度变化的曲线图
  - 描点法测试屏亮区散点图
  - 线段法测试屏亮区轮廓图
  - 不同光源长度的光斑范围对比图
  - 反射光程与镜面位置关系图
  - 两种仿真算法运行时间对比表
  pitfalls_avoided:
  - 避免只研究主截面内的二维反射：旋转抛物面上还存在不在主截面内的反射点，若遗漏会低估部分光源区间到达B、C点的光线条数并改变照度函数。
  - 避免默认一个光源点只对应一条反射光线：反射方程可能存在多个有效解，论文通过函数原像数量和圆周参数零点数识别零条、一条、两条乃至潜在更多光路，防止照度贡献漏计。
  - 避免把被镜面截断后产生二次反射的光线计入一次反射亮区：通过计算反射线与镜面开口平面的交点并判断其是否位于开口圆内，剔除无法直接到达测试屏的光线。
  - 避免盲目采用数值上较大的另一个极值点：较长光源虽可能取得相近目标函数值，但会导致光斑范围过大、眩光和能量浪费，并显著增加制造成本，因此结合工程约束选取首个合理局部最优点。
  - 避免未经检验地忽略光程和入射角差异：通过相对误差上界量化验证近似，使分段光线计数替代完整辐射积分具有可解释的精度依据。
  - 避免仅用单一离散算法判断亮区：描点法计算量大且边界较模糊，线段法难以直接呈现光强疏密，采用两种方法互相校验并发挥各自优势。
  innovation_points:
  - 将复杂三维反射问题分解为主截面内反射和非主截面反射，并通过符号求解、函数原像计数和角度差零点搜索确定每个光源位置的反射光线条数。
  - 依据光线条数变化的临界点构造分段照度函数，再把带B、C双点照度约束的最小功率问题转化为单变量最大最小优化问题。
  - 提出基于线段反射投影保持比例关系的线段法，只追踪光源端点和中点即可生成完整亮区轮廓，较双重离散的描点法显著提升计算效率。
  - 将数学最优结果与照射范围、眩光风险、驾驶安全、能量效率和制造成本相结合，对多个极值解进行工程化筛选。
- id: A题  奥运会临时超市网点设计论文_奥运会网点的优化设计
  source_paper: A题  奥运会临时超市网点设计论文 A题  奥运会临时超市网点设计论文_奥运会网点的优化设计
  problem_type: 统计分析+优化+仿真
  keywords:
  - 点阵模型
  - 购买力
  - 混合整数规划
  - 均衡度
  - 搜索法
  context: 基于观众出行、就餐和消费调查数据以及场馆空间布局，优化奥运场馆各商区临时商业网点的规模、类型与数量配置。
  models:
  - name: 描述性统计与稳定性分析模型
    role: 对三次调查数据进行纵向和横向比较，提取出行方式、就餐方式、消费档次、年龄及性别分布规律。
    why: 三次调查的比例基本一致，可将综合百分比作为后续人流分配和购买力计算的稳定输入参数。
  - name: 最短路径点阵模型
    role: 将交通站点或就餐点到各看台的观众路径映射为带权点阵，计算每个商区被经过的人次数及人流量分布。
    why: 场馆通行网络离散且观众被假设沿最短人行路径移动，点阵模型能够清晰表达入口商区、道口商区和途经商区之间的路径关系。
  - name: 购买力加权模型
    role: 把各来源人流量与其消费档次的代表金额结合，将单纯的人流分布转化为各商区的购买力分布。
    why: 商业需求不仅由客流数量决定，还受不同观众消费意愿和消费能力影响，购买力比原始人流量更适合作为网点容量需求指标。
  - name: 混合整数规划模型
    role: 联合确定各商区大型和小型商业网点的整数数量，以及两类网点的连续规模，使供给贴近购买力需求并满足覆盖和均衡约束。
    why: 网点数量必须取整数，而网点规模可连续变化，同时存在需求满足、规模范围和空间均衡等约束，符合混合整数优化的结构。
  - name: 离散搜索求解模型
    role: 将连续规模变量离散化，并逐步改变各商区网点数量下界，在限定总网点数差不超过2的条件下搜索较优配置。
    why: 原混合整数模型变量耦合且含绝对偏差目标，直接解析求解困难；搜索法便于在有限候选空间内获得可实施的局部较优方案。
  - name: 计算机模拟检验模型
    role: 模拟观众在场馆通行网络中的流动及网点供需匹配情况，检验人流分布和配置结果的合理性。
    why: 模拟能够从动态运行角度补充理论约束检验，判断优化方案是否与实际场馆客流规律相符。
  solution_flow: 汇总三次调查数据并检验比例稳定性→提取各交通方式、就餐方式和消费档次的综合比例→依据场馆道路与看台布局建立最短路径点阵，对等长路径按概率分流→通过点权纵向求和计算各商区人流量→以消费档次中点构造消费额系数，将人流加权为商区购买力→以大型和小型网点数量及规模为决策变量，建立供给不低于需求、规模有界且网点数量均衡的混合整数规划→采用离散搜索比较不同网点数量范围下的绝对供需偏差→得到大型网点规模1.15%、小型网点规模0.29%及各商区具体数量方案→通过假设合理性、数据稳定性和计算机模拟进行验证。
  validation: 首先纵向比较三次调查结果，确认出行和就餐比例基本稳定；其次将预演场馆与奥运场馆在设施组成和构建方式上的相似性作为数据迁移依据；再利用场馆对称性、道口商区客流最大以及相邻商区客流递增等结构规律检查点阵模型输出；最后通过计算机模拟检验客流传播和网点供需配置，并分析目标值随网点数量变化的稳定区间。
  visualization:
  - 调查比例交叉统计表
  - 场馆路线流程图
  - 带权点阵图
  - 场馆商区示意图
  - 各商区人流量与购买力分布表
  - 目标函数值随网点数量变化曲线
  - 网点配置结果表
  pitfalls_avoided:
  - 对两条等长最短路径分别赋予0.5概率而不是把全部客流重复计入每条路径，避免多路径情形下的人流重复计算和商区流量虚高。
  - 没有直接用人流量代表商业需求，而是用消费档次代表金额对不同来源客流加权，避免高客流但低消费群体导致网点规模被系统性高估。
  - 将供给设置为不低于购买力需求，同时最小化供给与需求的绝对偏差，避免只强调覆盖需求而造成严重过剩和额外建设成本。
  - 通过限制各商区网点总数的最大值与最小值之差不超过2，避免优化结果仅追求总利润而将网点过度集中在少数高购买力商区。
  - 先检验三次调查比例的稳定性再使用综合比例，避免在问卷回收率较低时直接采用单次抽样结果造成参数偶然性偏差。
  - 将场馆A、B、C既分别计算又作为整体系统综合比较，避免只做局部优化而忽略不同场馆容量和客流结构带来的跨区域配置差异。
  innovation_points:
  - 把场馆通行网络转化为带概率和来源权重的点阵，以统一框架描述入口商区、道口商区及途经商区的人流传播。
  - 提出“购买力=人流量×消费额”的需求指标，并通过修改点阵权值直接从客流模型过渡到商业需求模型。
  - 将网点空间公平性量化为均衡度，并进一步转化为各商区网点总数极差约束，使均衡要求能够进入优化计算。
  - 联合优化大型和小型网点的数量与单位规模，实现离散选址配置和连续容量设计的一体化。
- id: 2017年全国数模题目讲解_B题“拍照赚钱”的任务定价-邓明华
  source_paper: 2017年全国数模题目讲解 2017年全国数模题目讲解_B题“拍照赚钱”的任务定价-邓明华
  problem_type: 统计分析+预测+优化+分类聚类+仿真+综合评价
  keywords:
  - 众包任务定价
  - 任务—会员匹配
  - 吸引力均衡
  - 任务打包
  - 抢单仿真
  context: 针对移动互联网商业检查众包平台，依据任务位置、会员位置与信誉、预订时间和限额等信息，在控制平台总支出的同时优化任务定价与打包方案，以提高任务完成率。
  models:
  - name: 多元回归与Logistic分类模型
    role: 分析历史任务的定价规律，并识别价格、会员密度、任务密度、距离和会员能力等因素对任务完成与否的影响。
    why: 历史价格是连续变量而完成状态是二分类变量，回归和Logistic模型可分别进行定量解释与概率预测，并为后续优化模型提供参数依据。
  - name: 任务吸引力模型
    role: 以任务价格为正向因素、会员到任务的距离或出行成本为负向因素，并结合信誉、活跃度和配额等信息，刻画会员接受任务的意愿。
    why: 任务能否完成并非只由价格决定，而取决于会员感知收益与执行成本的相对关系，吸引力指标能够连接定价、会员选择和最终完成情况。
  - name: 吸引力均衡定价模型
    role: 通过调整各任务价格，使偏远任务、会员稀疏区域任务与普通任务对会员具有相对均衡的吸引力。
    why: 单纯统一提价会增加不必要的成本，而均衡吸引力可以将有限预算重点补偿距离远、竞争力弱和潜在执行者少的任务。
  - name: 任务—会员双目标匹配优化模型
    role: 在任务至多由一名会员执行、会员接单数不超过限额、预订时间和信誉优先规则得到满足的条件下，同时最小化总价格或提价幅度并最大化任务完成数。
    why: 平台目标同时包含成本控制和完成率提升，且任务分配受到容量、时序、竞争及唯一匹配等约束，因此需要采用多目标整数规划或启发式优化。
  - name: 多阶段轮盘赌抢单仿真模型
    role: 按照会员开放预订时间划分批次，在同一批次内依据配额占比、信誉和任务吸引力模拟会员选择及平台派发过程。
    why: 实际机制并不是静态的一对一指派，而是包含先后上线、随机派发、竞争抢单和吸引力阈值，仿真比直接套用确定性分类结果更符合业务流程。
  - name: K-Means或模糊K-Means任务聚类模型
    role: 依据任务间地理距离进行就近打包，或结合远近搭配原则形成任务包，并根据路线节约程度设置打包折扣和总价。
    why: 集中任务联合执行可以共享交通成本，聚类能够将空间邻近关系转化为可操作的任务包，同时支持比较不同聚类数和打包规则的效果。
  - name: 蒙特卡洛综合评价模型
    role: 在不同随机上线、抢单和派发场景下，计算各定价与打包方案的平均完成率、总费用、完成时间及会员间机会均衡程度。
    why: 会员行为和平台派发具有随机性，单次匹配结果不稳定，多次随机模拟能够评价方案的期望表现、波动性和稳健性。
  solution_flow: 数据→清洗任务与会员经纬度、价格、完成状态、信誉、预订时间和限额，计算球面距离并构造会员密度、任务密度、最近会员距离、加权可达能力等降维特征→模型→用回归和分类模型解释历史定价及未完成原因，建立价格—距离—信誉—配额驱动的吸引力模型，再构建成本与完成率双目标定价匹配模型，并用空间聚类生成任务包→参数→通过历史完成记录估计吸引力函数、统一接受阈值、密度半径和价格敏感系数，利用交叉验证或信息准则控制复杂度，并通过轮廓系数或成本—完成率曲线确定聚类数与折扣率→求解→采用整数规划、贪心算法、动态规划或启发式算法生成单任务价格和打包价格，再按预订时间、配额占比、信誉优先与最大吸引原则进行多阶段抢单模拟→验证→将新方案与原方案在同一会员环境和随机种子下重复比较，并将通过历史项目校准的模型迁移至新项目，输出预计完成率、总费用、完成时间及稳健性评价。
  validation: 采用历史回测、交叉验证与蒙特卡洛仿真相结合的策略：先检验回归拟合优度、分类AUC或准确率并比较复杂度，再在附件一上复现会员抢单和平台派发过程，对原定价、单任务新定价及打包定价进行同场景重复实验；统计平均完成率、总支付、单位新增完成任务成本、完成时间和结果方差，并对吸引力阈值、距离衰减系数、预算上限、聚类数及折扣率进行敏感性分析，最后用历史数据校准后的统一参数评价附件三方案的实施效果。
  visualization:
  - 任务与会员经纬度空间散点图或密度热力图
  - 历史价格分布直方图与箱线图
  - 价格和完成状态的空间分布图
  - 任务价格—距离—完成概率关系图
  - 会员—任务吸引力热力图
  - 聚类及任务打包地图
  - 成本—完成率Pareto前沿图
  - 仿真完成率分布图与敏感性分析曲线
  pitfalls_avoided:
  - 避免仅用任务经纬度预测价格或完成率，因为这会隐含定价与会员分布、距离、信誉和限额无关，违背会员是否愿意执行任务的实际机制。
  - 避免把历史完成状态直接等同于是否抢单，因为未完成可能发生在无人预订、抢单后放弃、店铺拒访或平台分配失败等不同阶段，直接混用会使完成概率和价格效应产生偏差。
  - 避免将Logistic回归或神经网络的完成概率直接当作定价规则，因为预测模型只拟合历史机制，无法自动满足预算、会员限额、任务唯一分配、时序和竞争等优化约束。
  - 避免为每个历史任务分别反推吸引力阈值，因为这种做法容易过拟合且无法迁移到新任务；应从附件一学习统一阈值，或采用分层但可外推的阈值模型。
  - 避免只追求最高完成率而无限提价，因为平台目标是在不显著增加总运行成本的前提下提高完成率，应同时报告总费用和单位完成成本并进行双目标权衡。
  - 避免把任务分配简化为静态指派，因为会员开放时间、预订限额占比、信誉优先及同批次随机派发会改变最终匹配，需要通过多阶段仿真或带时序约束的规划表达。
  - 避免直接指定K-Means的聚类数或盲目打包，因为任务包过大会增加执行负担并降低接受率，应利用轮廓系数、包内距离、路线成本和仿真完成率共同确定聚类数及包容量。
  - 避免仅报告模型拟合度而忽略复杂度与稳健性，因为高维距离矩阵容易导致过拟合，应通过密度、最近距离和加权可达能力等特征降维，并使用交叉验证和敏感性分析。
  innovation_points:
  - 以认知价值为基础，将价格、距离、信誉、活跃度、预订配额和开放时间统一映射为任务对会员的吸引力，使定价模型与会员真实选择行为直接衔接。
  - 建立总支出或提价幅度最小、任务完成率最大化的双目标优化模型，并显式纳入最大吸引原则、竞争规则、任务唯一分配、会员限额和时间批次等业务约束。
  - 采用多阶段轮盘赌模拟平台派发和会员抢单，将同批次随机性、配额占比和信誉优先机制融入匹配过程，区别于简单的确定性指派模型。
  - 通过空间聚类和交通成本共享设计任务打包及折扣机制，将提高完成率与节省重复出行成本统一纳入评价。
  - 使用蒙特卡洛重复仿真和成本—完成率Pareto前沿评价方案，不仅给出单一完成率，还刻画方案的成本效率、随机波动和参数稳健性。
- id: A题_关于DNA序列分类问题的模型
  source_paper: A题 A题_关于DNA序列分类问题的模型
  problem_type: 分类聚类+统计分析+优化+综合评价
  keywords:
  - DNA序列特征提取
  - 字符串频率与周期性
  - BP神经网络分类
  context: 根据少量已知类别的DNA序列提取碱基组成、局部字符串、周期性及信息量特征，并据此将未知人工序列和自然序列划分为A类、B类或不确定类别。
  models:
  - name: 单碱基与n元字符串频率统计模型
    role: 从DNA序列中构造可供分类器使用的数值特征向量，包括A、T、C、G频率以及高频二字符、三字符组合频率。
    why: 单碱基频率反映序列的全局组成，二元和三元字符串频率能够补充相邻碱基的局部相关性；更长字符串重复少、分散度大，在小样本条件下不稳定。
  - name: 特征字符串筛选与优先级优化模型
    role: 利用字符串出现频率、标准化频率和分散度筛选能够显著区分A、B两类的关键词，并通过最小二乘法逐步优化优先级函数参数。
    why: 全部字符串直接入模会造成维数过高和噪声累积，而优先级筛选能够保留类间差异明显、类内表现稳定的代表性字符串。
  - name: 三层BP神经网络模型
    role: 学习DNA特征向量到A、B类别标签之间的非线性映射，并对未知人工序列和自然序列进行分类。
    why: DNA序列特征与类别之间难以用显式线性方程描述，BP网络具有非线性逼近、自适应学习、容错和多特征综合能力，适合数据驱动的小样本分类问题。
  - name: 层次分析综合分类模型
    role: 根据关键词的重要程度确定权重，对多个字符串判据进行分层综合，形成量化分类得分和显著性判断。
    why: 不同关键词的判别能力并不相同，层次化加权可以避免简单计数等权处理造成的信息损失，并为不确定类别设置判别依据。
  - name: 同碱基间隔周期性模型
    role: 统计同一种碱基在序列中重复出现的间隔分布，以刻画DNA序列的周期结构。
    why: 仅使用碱基或字符串频率会丢失排列位置信息，而间隔分布能够区分频率相近但组织结构和周期性不同的序列。
  - name: 序列信息增量模型
    role: 将DNA序列视为信息流，通过新增字符带来的信息变化衡量序列的信息含量和结构复杂性。
    why: 信息量特征能够从整体复杂度角度补充频率和周期性指标，使分类依据同时覆盖组成、排列和信息结构。
  - name: 多模型综合判别模型
    role: 综合碱基频率、周期性和信息量等侧重点不同的分类结果，对未知序列给出最终类别。
    why: 任何单一指标都难以充分反映DNA序列的局部与全局性质，多模型集成能够利用互补信息，提高分类的稳健性。
  solution_flow: 数据→对已知A、B类序列进行清洗并统计单碱基频率、二元和三元字符串频率、字符串分散度、同碱基间隔及信息增量→依据频率和分散度筛选特征字符串，构造19维或25维特征向量，并建立关键词优先级与综合权重→设置三层BP网络结构、双曲正切激活函数、5个隐层节点、随机初始权值、学习率和惯性系数，同时用最小二乘法优化关键词优先级参数→采用变步长和变周期BP算法训练网络，比较25-5-1与19-5-1方案，并综合层次分析、周期性和信息量判据完成分类→通过留出检验、阈值敏感性分析和不同模型结果比较验证分类效果，再将可靠的新分类样本加入训练集迭代训练。
  validation: 从20个已知类别样本中分别抽取A类7个和B类7个作为训练集，其余6个作为独立检验集；以总体误差小于10^-5作为训练收敛条件，比较两个网络在检验集上的准确性、命中率及输出值与期望标签±1的接近程度。进一步改变分类阈值，如0、±0.2、±0.5及±0.9，开展敏感性分析；比较二字符与三字符特征方案的学习速度和分类精度，并将已可靠分类的样本追加到训练集重新训练，以检验结果的稳定性和泛化能力。
  visualization:
  - BP网络误差—迭代次数学习曲线
  - 检验样本期望输出与网络输出对比图
  - A、B两类特征字符串频率分布图
  - 不同分类阈值下分类率变化图
  - 同碱基间隔周期分布图
  pitfalls_avoided:
  - 避免仅统计A、T、C、G含量，因为组成频率相同的序列仍可能具有完全不同的局部排列和周期结构，需加入二元、三元字符串及间隔特征。
  - 避免直接使用四字符及更长字符串，因为小样本中长字符串重复频率低、分散度大，容易产生稀疏高维特征并导致过拟合。
  - 避免把单字符、二字符和三字符特征全部无筛选地输入网络，因为40维输入相对于20个已知样本过于复杂，会降低学习速度并削弱泛化能力。
  - 避免只依据训练误差评价模型，因为BP网络可能记忆少量训练样本，必须保留独立检验集考察分类准确率和命中率。
  - 避免机械地将所有网络输出按0阈值强制二分类，因为题目允许序列不具备A、B特征，应通过输出置信区间或显著水平保留不确定类别。
  - 避免从氨基酸层次提取特征，因为给定片段是随机截取的，缺少可靠起始位和阅读框信息，直接进行密码子翻译可能引入错误。
  - 避免使用单一分类指标，因为频率、周期性和信息量分别描述不同性质，单一标准可能出现特征缺失，应采用互补模型综合判别。
  - 避免把新增预测样本无条件加入训练集，因为错误标签会被迭代放大，只应吸收分类置信度高、经多模型一致确认的样本。
  innovation_points:
  - 将DNA序列视为由关键词构成的文章，通过标准化频率、分散度和优先级函数自动提取具有类别代表性的关键字符串。
  - 构造单碱基加三字符和单碱基加二字符两套特征方案，并以并行BP网络比较方式选择更有效的局部相关性表示。
  - 采用变步长、变周期及惯性项结合的改进BP训练策略，在保证误差精度的同时提高网络收敛速度。
  - 把碱基频率、同碱基间隔周期性和序列信息增量三个互补视角进行综合，使模型兼顾DNA序列的局部特征与全局特征。
  - 通过分类阈值和显著水平表达分类置信度，为既不属于A类也不属于B类的序列预留拒识机制。
- id: B题优秀论文_关于公交车调度的优化问题
  source_paper: B题优秀论文 B题优秀论文_关于公交车调度的优化问题
  problem_type: 统计分析+优化
  keywords:
  - 公交车调度
  - 机会约束优化
  - 最小配车数
  context: 根据公交线路各站分时段客流数据，在兼顾乘客候车时间与车辆载客率的条件下，优化发车间隔、班次数量及车辆配置以提高公交公司收益。
  models:
  - name: 最小二乘客流分布拟合模型
    role: 拟合各站累计上车、下车人数随时间变化的分布函数，为候车人数、车内人数和发车间隔约束提供输入。
    why: 各站累计客流是时间的递增函数且一天存在两个客流波峰，可利用五次多项式描述整体变化趋势；高峰误差较大时再按小时分段线性拟合以提高局部精度。
  - name: 公司收益最大化机会约束模型
    role: 以公司利润最大化为目标，将乘客候车超时、车辆超载和低载率事件的发生概率限制在给定小概率范围内。
    why: 乘客到站和候车具有随机性，无法要求所有乘客的候车时间都严格低于阈值，采用概率约束可将乘客满意度定量化并与公司利益协调。
  - name: 最大发车间隔优化模型
    role: 分别求解普通时段、早高峰和晚高峰允许的最大发车间隔，以减少发车次数和运营支出。
    why: 在收入与固定支出近似不变时，利润最大化等价于尽量减少班次，即在候车时间和载客量约束下尽可能增大发车间隔。
  - name: 分时段线性规划模型
    role: 将每小时内上、下车客流近似为线性函数，把候车超时比例和120%载客率约束转化为关于发车间隔的线性不等式。
    why: 原机会约束和积分约束难以直接计算，分段线性化后可使用Matlab稳定求解，并能减小全日五次多项式在高峰时段造成的拟合偏差。
  - name: 最小配车数估算模型
    role: 在无乘客滞留且各发车时刻均有车可发的条件下，以一小时和44分钟为时间步长估计车辆配置下界。
    why: 先获得43辆左右的初始参照值，可以缩小后续全局调度优化的搜索范围，并检查正式方案的车辆规模是否合理。
  - name: 双总站车辆流平衡线性规划模型
    role: 以双向总站初始车辆数和各时段发车数为决策变量，在车辆守恒与班次平衡约束下最小化总班次并确定最小车辆配置。
    why: 车辆完成单程后会进入对向总站，调度过程本质上是跨时段、双站点的车辆流转与库存平衡问题，线性规划可处理一端缺车、另一端囤车及全局班次联动。
  solution_flow: 整理典型工作日各站分时段上下车数据，并将极低客流时段单独处理→构造累计客流函数，先采用最小二乘五次多项式拟合，再针对高峰误差按小时进行分段线性化→建立以公司利润最大化为目标、以候车超时概率和载客率为约束的机会约束模型→取候车超时概率参数α=5%，设置普通时段10分钟、早高峰5分钟的服务阈值和120人的容量上限→将积分约束转化为发车间隔的线性不等式，用Matlab求出各时段最大发车间隔→分别以60分钟和44分钟周转步长估算无滞留条件下的最小配车数→以估算值为初值建立双总站车辆守恒线性规划，用Maple搜索车辆总数、总站初始配车数和各时段班次的整体最优方案→检查候车超时比例、超载、滞留、总站可发车性和车辆流平衡，并对拟合误差及结果波动范围进行分析。
  validation: 采用误差分析与约束可行性检验相结合的策略：将拟合客流与样本实际客流比较，识别全局五次拟合在7:00—8:00等高峰时段的严重低估，并通过按小时分段线性拟合修正；随后验证各方案下车辆载客人数不超过120、候车时间超限乘客比例不超过5%、各站无明显乘客滞留、每个规定发车时刻总站均有车可发以及双向累计发车量和车辆库存满足守恒关系；同时比较60分钟与44分钟周转假设下的配车结果，以检验方案对行程时间设定的敏感性。
  visualization:
  - 分时段发车间隔表
  - 公交调度时刻表
  - 各站累计上下车客流拟合曲线
  - 实际客流与拟合客流误差对比图
  - 双总站车辆库存随时间变化图
  pitfalls_avoided:
  - 避免直接求解含随机候车时间和复杂积分的原始机会约束模型，因为约束难以写成可计算的显式函数；通过按小时分段线性化将其转为线性规划，提高可解性。
  - 避免使用单一全日五次多项式直接控制高峰调度，因为整体拟合会平滑尖峰并严重低估高峰客流；对高峰时段分段拟合可降低由客流低估导致的运力不足风险。
  - 避免对所有站点机械加入相同容量约束，因为部分站点下车人数持续多于上车人数，车辆负荷不会继续增加；仅保留上车人数大于下车人数的关键站点可减少冗余约束和计算量。
  - 避免在没有车辆规模参照的情况下直接进行全局搜索，因为车辆数、班次和总站库存相互联动会造成搜索空间过大；先估算43辆的配置下界再进行Maple优化。
  - 避免将极低客流的边缘时段与正常时段统一拟合，因为其客流规律和运力需求明显不同；将上行22:00—23:00、下行5:00—6:00单独处理并配置一辆车，可防止其扭曲一般模型参数。
  innovation_points:
  - 将难以直接度量的乘客利益表示为候车超过5分钟或10分钟的乘客比例不超过给定概率α，从而把服务满意度转化为可进入优化模型的机会约束。
  - 采用“客流拟合—发车间隔优化—最小配车估算—双总站全局调度”的分层建模框架，由简单到复杂逐步缩小搜索范围并形成完整调度方案。
  - 将双向总站视为相互补充的车辆库存节点，通过跨时段车辆守恒约束同时优化初始配车、发车班次和车辆总数。
  - 针对整体多项式在高峰期失真问题，引入按小时分段线性客流模型，在保持线性规划可解性的同时提高高峰运力配置的可靠性。
- id: B题__钻井布局_问题评述
  source_paper: B题 B题__钻井布局_问题评述
  problem_type: 优化
  keywords:
  - 钻井布局
  - 网格选址
  - 混合整数规划
  - 环面距离
  - 最大团
  - 最小覆盖圆
  context: 通过选择单位网格的平移参照点及可选旋转角，使尽可能多的旧钻井位于某个网格结点的允许误差邻域内，并研究全部旧井可同时利用的判定条件。
  models:
  - name: 非线性混合整数规划模型
    role: 描述固定坐标轴、纵横距离条件下旧井利用数量最大化问题，以网格参照点为连续变量、旧井是否利用为0-1变量、对应网格结点编号为整数变量。
    why: 该模型能够准确表达网格平移、整数格点归属、误差邻域约束和最大利用井数目标，是原问题最直接的数学规划形式。
  - name: 低维参数遍历搜索模型
    role: 在参照点参数(s,t)及旋转角参数θ的可行范围内搜索，逐点计算满足纵横距离或欧氏距离误差要求的旧井数量。
    why: 尽管目标函数含取整和离散跳变，但设计参数至多只有三个，适合采用遍历、分段搜索或加速搜索获得数值最优解。
  - name: 整数不等式可解性判定模型
    role: 将全部旧井同时利用的问题分解为横、纵两个一维整数不等式组，并通过区间交集和取整结果判断公共网格平移量是否存在。
    why: 固定方向且采用纵横距离时，横纵坐标相互独立；在误差小于四分之一格长的条件下，每个整数变量最多只有两个候选值，可得到计算复杂度为O(n)的充要判据。
  - name: 单位环面几何模型
    role: 对井点坐标取小数部分，将无限周期网格压缩到单位正方形，并使用周期边界下的环面距离描述井点与网格参照点的接近程度。
    why: 网格具有整数平移周期性，取小数部分可显著降低搜索区域；把单位正方形相对边粘合为环面，才能正确处理跨边界点之间的最短距离。
  - name: 最大团模型
    role: 在固定坐标轴和纵横距离下，以旧井为顶点、两口井可同时利用为连边，将最大可同时利用井集转化为特殊图上的最大团。
    why: 该情形具有两两可利用即可推出整体可利用的性质，因此成对兼容关系能够完整刻画集合可行性，并提供组合优化求解途径。
  - name: 最小覆盖圆模型
    role: 在固定坐标轴和欧氏距离下，将全部旧井同时利用转化为寻找半径不超过允许误差的圆域覆盖所有取模后的井点。
    why: 欧氏距离邻域为圆域，最小覆盖圆由两个边界点形成的直径圆或三个边界点形成的外接圆决定，因此可通过任意两点距离及锐角三角形外接圆半径建立充要判据。
  - name: 凸包与候选支撑点检验模型
    role: 先构造井点凸包，再在凸包顶点中寻找最远点对和决定最大外接圆的三点，以检验最小覆盖圆条件。
    why: 最小覆盖圆的支撑点必位于凸包边界，预先剔除内部点可以减少无效的两点、三点组合检验，提高欧氏距离判定效率。
  solution_flow: 井点坐标与允许误差数据→根据距离类型及坐标轴是否允许旋转选择模型→对坐标取小数部分并建立周期环面距离，设置网格平移参数(s,t)、旋转角θ和0-1利用变量→固定方向的纵横距离问题采用整数区间判定、最大团或二维搜索，欧氏距离问题采用镜像展开、最小覆盖圆或三点检验，方向不定时联合搜索θ→以可利用旧井数量最大为目标得到布局方案→通过充要条件、边界处理、模型等价性和遍历结果进行验证。
  validation: 首先用整数不等式判据与环面几何两两距离判据交叉验证固定方向纵横距离结果；其次对欧氏距离检查所有候选点对的距离不超过2倍误差，并检查锐角三角形外接圆半径不超过误差，或直接计算最小覆盖圆复核；再将解析或组合算法结果与低维穷举搜索结果比较，并对搜索步长、旋转角离散化误差及单位正方形周期边界附近的镜像点进行敏感性和边界测试。
  visualization:
  - 取模后井点在单位正方形或环面上的散点图
  - 网格平移与旧井误差邻域叠加图
  - 旧井兼容关系图及最大团高亮图
  - 最小覆盖圆与凸包示意图
  - 目标值随参照点或旋转角变化的热力图
  pitfalls_avoided:
  - 避免把坐标取小数部分后的单位正方形仍当作普通平面区域，因为左右边界及上下边界实际周期粘合，忽略环面距离会错误判断靠近相对边界的井点不兼容。
  - 避免在欧氏距离情形仅依据两两兼容关系建立普通最大团模型，因为两两可同时利用不能保证存在同一个半径为误差值的圆覆盖全体点，至少需要检查三点确定的覆盖圆。
  - 避免在坐标轴方向可变时直接套用固定方向的两两独立或三点判据，因为旋转角是所有井共享的全局变量，不同子集可能依赖不同角度而无法合并为统一布局。
  - 避免混淆纵横距离与欧氏距离的误差邻域，前者对应轴平行正方形，后者对应圆域；用正方形覆盖替代圆覆盖会把仅满足坐标分量误差但直线距离超限的井误判为可利用。
  - 避免仅凭固定步长角度搜索宣称获得严格最优解，因为最优旋转角可能不落在离散采样点上；需要事件点分析、步长敏感性检验或给出误差上界。
  - 避免遗漏取整端点和整数变量候选范围，因为参照点限制在半开区间且误差邻域含边界，错误使用四舍五入、上取整或下取整会改变临界井的可行性。
  innovation_points:
  - 利用网格整数平移的周期性，把无限平面布局问题压缩为单位环面上的低维选址问题。
  - 证明固定方向、纵横距离下整体可利用等价于任意两口井可利用，从而将几何选址转化为特殊图的最大团问题。
  - 证明固定方向、欧氏距离下整体可利用等价于任意三口井可利用，并以最小覆盖圆的两点或三点支撑结构给出几何判据。
  - 针对环面周期边界提出镜像点扩展和切补展开方法，使周期距离问题能够转化为普通平面几何计算。
  - 从整数不等式与几何覆盖两条途径建立等价充要条件，其中代数判据可在线性时间内验证固定方向纵横距离下的整体可行性。
- id: A题优秀论文_血管管道的三维重建
  source_paper: A题优秀论文 A题优秀论文_血管管道的三维重建
  problem_type: 优化+统计分析+仿真
  keywords:
  - 血管管道三维重建
  - 最大覆盖与中轴线搜索
  - 分段最小二乘拟合
  context: 根据100张等间距平行血管切片的二值图像，在定半径滚动球管道假设下估计管道半径和中轴线，并重建其三维形态。
  models:
  - name: 最大覆盖法
    role: 在各切片中搜索最大内切圆，并以各切片估计半径的均值确定滚动球的固定半径。
    why: 相比依赖离散轮廓切线和差分导数的切线法，该方法更直观、易于通过二值矩阵匹配实现，且计算复杂度和离散轮廓敏感性较低。
  - name: 定半径圆覆盖优化模型
    role: 固定估计半径，以圆心横纵坐标为决策变量，以圆周与切片区域的匹配点数最大为目标，逐层确定中轴线交点。
    why: 避免对每张切片同时搜索圆心和半径所造成的计算量增大及结果不稳定，并利用管道半径固定的先验条件提高定位一致性。
  - name: 拟牛顿非线性优化模型
    role: 求解定半径圆覆盖目标函数，获得每张切片上的最优圆心坐标。
    why: 相较网格搜索和蒙特卡罗搜索，拟牛顿法计算量较小、收敛速度较快；同时可借助相邻切片圆心作为初值，提高搜索效率和准确性。
  - name: 回溯修正策略
    role: 当相邻球心间距发生异常突变时回退并重新搜索，以修正转角附近可能出现的局部搜索失效。
    why: 中轴线在转角处变化较大，直接沿用上一切片圆心作为初值可能不够接近真实最优点，回溯可降低错误初值导致的轨迹跳变。
  - name: 分段最小二乘与三次样条连接模型
    role: 对中轴线在XY、YZ和XZ平面上的投影点进行分段拟合，并平滑连接各分段，从而精确定位中轴线。
    why: 一次性高阶多项式拟合容易产生龙格振荡；分段拟合兼顾局部趋势与整体平滑性，三次样条连接还能减小分段连接处的不连续。
  - name: 滚动球包络仿真模型
    role: 令固定半径球沿拟合后的中轴线滚动，通过球面包络生成血管管道的三维表面。
    why: 该模型直接对应题设中的管道几何生成机制，可将估计得到的半径和中轴线转化为可检验的三维重建结果。
  solution_flow: 读取100张512×512切片图像并二值化为像素矩阵→利用最大覆盖法分别搜索各切片的最大内切圆→对切片半径估计值求均值，得到固定半径29.529→以定半径圆与切片区域的匹配点数最大为目标建立圆心优化模型→采用拟牛顿非线性优化逐层搜索圆心，并利用相邻切片初值和回溯策略修正异常跳变→将100个圆心组成离散中轴线，分别投影到XY、YZ、XZ平面→采用分段最小二乘和三次样条连接进行平滑拟合→令固定半径球沿拟合中轴线滚动，生成三维管道表面→重新截取指定层面并与原始切片轮廓叠加比较，完成模型验证和误差分析。
  validation: 采用逆向截面验证：从重建后的三维管道沿Z轴重新截取第5张和第50张切面，将重建截面外轮廓与对应原始切片轮廓叠加比较；两者基本重合，说明滚动球包络能够较好复现原始切片。同时通过比较拟合前后的中轴线投影和三维形态，检验分段拟合对轨迹平滑性及局部振荡的改善。
  visualization:
  - 切片轮廓三维堆叠图
  - 最大内切圆匹配图
  - 中轴线在XY、YZ、XZ平面的投影图
  - 拟合前后中轴线对比图
  - 滚动球管道三维重建图
  - 重建截面与原始轮廓叠加验证图
  pitfalls_avoided:
  - 避免直接使用轮廓切线法估计最大内切圆，因为像素轮廓离散且需用差分近似导数，切线方向和切点容易受锯齿噪声影响。
  - 避免在每张切片中同时搜索圆心和半径，因为联合搜索计算量大，而且最大内切圆搜索对离散误差较敏感；先对半径取总体均值再定半径定位圆心可提高稳定性。
  - 避免采用全域细网格搜索，因为二维网格精度提高会导致搜索点数平方级增长，运行时间长且有限步长仍会带来较大定位误差。
  - 避免单纯依赖蒙特卡罗随机搜索，因为获得稳定高精度结果需要大量随机采样，并且不同运行结果可能波动。
  - 避免机械地以上一层圆心作为下一层唯一初值，因为管道转角处中轴线位移可能突然增大，容易使局部优化落入错误位置；通过球心间距异常检测和回溯重搜进行修正。
  - 避免对全部投影点进行单个高阶多项式拟合，因为15阶等高阶多项式在端点或多节点区域容易产生龙格振荡；采用分段最小二乘和三次样条连接保持平滑。
  - 避免只凭三维图形的视觉效果判断模型正确性，因为外观平滑不等于切片信息被准确恢复；通过重建模型再切片并与原图轮廓叠加进行闭环检验。
  innovation_points:
  - 将三维血管重建转化为二维切片上的最大覆盖和定半径圆心优化问题，使复杂空间几何问题能够逐层求解。
  - 利用固定半径球沿中轴线滚动形成包络，不仅生成三维管道，还能反向截取切面与原始图像比较，形成建模、重建与验证的闭环。
  - 利用相邻切片连续性为非线性优化提供初值，并引入基于球心间距异常的回溯策略，兼顾搜索速度与转角处的鲁棒性。
  - 采用分段最小二乘结合三次样条连接处理中轴线投影，在平滑离散搜索误差的同时规避整体高阶多项式拟合的振荡问题。
- id: B题_钻井布局的设计
  source_paper: B题 B题_钻井布局的设计
  problem_type: 优化
  keywords:
  - 周期正方形网格
  - 网格距离
  - 最大完全子图
  - 局部搜索
  - 旋转优化
  context: 在允许平移或旋转单位正方形钻井网格并给定旧井位置误差容限的条件下，确定能够保留利用的旧井数量最多的网格布局，并判定全部旧井可利用的条件。
  models:
  - name: 固定方向周期网格最大覆盖模型
    role: 描述网格仅允许平移时的旧井利用数量最大化问题。
    why: 单位网格具有整数平移周期性，可将无限平面上的布局搜索约化到一个单位正方形内，并以切比雪夫型网格距离判断旧井是否落入误差邻域。
  - name: 全面离散搜索模型
    role: 遍历单位周期内的所有候选平移量，获得固定精度下的全局最优布局。
    why: 目标函数是离散计数函数，难以直接解析优化；按坐标数据精度和误差要求设置步长后，地毯式搜索实现简单且不易遗漏候选区域。
  - name: 旧井邻域局部搜索模型
    role: 将平移参数的搜索范围缩小到各旧井对应的误差邻域，提高求解效率。
    why: 任何至少利用一口旧井的有效网格结点都必须位于某口旧井的误差邻域内，因此搜索整个单位周期存在大量无效计算。
  - name: 相容图最大完全子图模型
    role: 把固定方向、切比雪夫型误差下的最大旧井集合选择转化为最大团问题。
    why: 两口旧井能够被同一网格同时利用，当且仅当其周期网格距离不超过两倍误差；以此建立相容边后，可利用旧井集合对应图中的完全子图。
  - name: 单位胞折叠与滑动窗口模型
    role: 将旧井坐标按整数部分折叠到单位正方形，并通过边界复制和小正方形滑窗直观寻找最密集点集。
    why: 网格布局只与坐标的小数部分有关，但单位胞具有首尾相接的周期边界；复制邻边附近的点后，可把周期覆盖问题转化为普通平面上的定尺寸窗口最大覆盖问题。
  - name: 可旋转网格联合优化模型
    role: 同时搜索网格旋转角度和平移量，求可利用旧井数的最大值。
    why: 正方形网格具有九十度旋转对称性，只需在角度区间零到二分之π内搜索；对每个角度旋转旧井坐标后，可复用固定方向的平移优化模型。
  - name: 欧氏周期网格距离可行性模型
    role: 在圆形误差容限下判断旧井与最近网格结点的距离，并检验给定旧井集合能否被同一网格利用。
    why: 当位置误差按欧氏距离度量时，应使用到整数格点集合的最短周期欧氏距离，并通过寻找一个同时落入所有旧井误差圆的网格基准点完成可行性判断。
  - name: 全部旧井可利用的充要条件模型
    role: 给出固定方向下全部旧井可被保留的理论判据，并为程序提前终止和结果证明提供依据。
    why: 在切比雪夫型周期距离下，全部点可利用等价于任意两点最大网格距离不超过两倍误差；在欧氏距离下，则等价于存在一个网格基准点到所有旧井的周期欧氏距离均不超过误差。
  solution_flow: 输入旧井坐标与误差容限→利用取整或取模运算将坐标折叠到单位周期胞并处理周期边界→固定方向时构造切比雪夫型或欧氏型周期网格距离→建立最大覆盖模型，并采用全面搜索、旧井邻域局部搜索或最大完全子图算法求解→允许旋转时按角度步长旋转坐标，在零到二分之π内重复平移优化→记录最大可利用井数、旧井编号及最优平移和角度范围→利用充要条件、不同算法结果一致性和步长精度分析验证结果。
  validation: 采用多重交叉验证：全面搜索与局部搜索应得到相同的最优井数和旧井集合；固定方向的搜索结果再与相容图最大团结果核对；通过网格距离定理和全部旧井可利用的充要条件进行理论验证；将最优布局绘制在折叠单位胞或旋转网格图上进行几何复核；缩小平移步长和角度步长开展敏感性检验，确认最优计数在更高精度下保持稳定。论文数值算例中，固定方向的多种方法均得到4口旧井，可旋转情形的全面搜索与局部搜索均得到6口旧井。
  visualization:
  - 单位胞折叠散点图及周期边界复制图
  - 定尺寸正方形滑动窗口覆盖图
  - 最优旋转网格与旧井位置叠加图
  - 旋转角度—最大可利用井数曲线
  pitfalls_avoided:
  - 避免直接在无限平面搜索网格平移量：单位正方形网格对整数平移不变，搜索范围可严格压缩到一个单位胞，否则计算量无界且包含大量重复布局。
  - 避免忽略单位胞的周期边界：靠近零边界与靠近一边界的点在周期网格距离下可能非常接近，若仅看普通单位正方形散点图会漏掉跨边界的可行点组，因此需要使用模距离或复制边界点。
  - 避免混淆切比雪夫误差与欧氏误差：方形容差应采用两坐标最大偏差，圆形容差应采用欧氏距离；混用距离会改变可行域形状并导致旧井利用判定错误。
  - 避免把欧氏距离下的两两相容误认为整体相容：多个误差圆即使任意两两相交，也未必存在公共交点，因此最大团方法的整体充分性不能直接照搬到欧氏圆形容差情形，必须检验是否存在同时覆盖所有点的中心。
  - 避免对旋转角度进行多余的全圆搜索：正方形网格每旋转二分之π即与原网格等价，只需搜索零到二分之π的基本角度区间。
  - 避免角度步长或平移步长过大造成漏解：步长应结合坐标精度、误差容限及点到旋转中心的最大半径确定，并通过缩小步长的敏感性检验控制离散化误差。
  - 避免将局部搜索范围任意缩小而失去完备性：局部搜索必须基于有效网格基准点至少落入某口旧井误差邻域这一必要条件，否则可能排除真正的最优布局。
  innovation_points:
  - 利用网格的整数周期性把无限平面上的布局优化降维为单位正方形或二维环面上的有限搜索问题。
  - 定义切比雪夫型和欧氏型周期网格距离，将最近网格结点判定统一为标准距离约束。
  - 将固定方向、方形误差下的旧井选择问题转化为相容图最大完全子图问题，实现几何优化与图论组合优化的连接。
  - 以旧井误差邻域替代整个单位胞进行局部搜索，在保持候选区域完备性的同时显著降低计算量。
  - 通过坐标旋转复用固定方向模型，把网格平移与旋转的联合优化分解为外层角度搜索和内层平移覆盖。
  - 同时给出算法求解、几何目测、图上滑窗和充要条件证明，形成数值结果、直观解释与理论判据相互印证的多层次方案。
- id: B题优秀论文_公交车调度问题的研究
  source_paper: B题优秀论文 B题优秀论文_公交车调度问题的研究
  problem_type: 优化+仿真+统计分析
  keywords:
  - 公交车调度
  - 多目标规划
  - 时间步长法
  context: 针对带软时间窗的单线路单车型公交系统，在单车场和双车场两种运营条件下协调乘客候车体验与公交公司车辆投资、运营成本，制定静态及动态发车调度方案。
  models:
  - name: 双车场多目标规划模型
    role: 分别确定上行和下行各时段的发车次数，并实现运客能力与实际运输需求的匹配。
    why: 线路两端均可存车和发车时，上下行可独立建模；以运力和运量的加权偏差及发车次数为目标，能够同时兼顾满载率、乘客需求和公司运营成本。
  - name: 双车场时间步长运营仿真模型
    role: 将各时段发车次数转换为等间隔发车时刻表，模拟车辆进出两个车场、站台滞留和车内载客状态，并搜索不间断运营所需的最小车辆数。
    why: 车辆周转、进出场和发车队列具有动态性，仅靠静态规划难以确定实际配车量；时间步长法可按先进先出和按时发车原则复现完整运营过程。
  - name: 单车场多目标优化模型
    role: 在环线式运营条件下联合优化总车辆数、总车次和乘客平均不方便程度，并形成各时段发车间隔。
    why: 单车场不能在另一端长期存车，需要将上下行车辆周转统一考虑；多目标模型可以同时衡量车辆投资、运营成本和乘客候车体验。
  - name: 人机交互局部搜索与仿真模型
    role: 基于客流高低峰构造初始发车间隔，在其邻域内反复仿真、统计指标并筛选局部最优时刻表。
    why: 原问题具有多目标、多约束和整数发车间隔，直接寻找全局最优解计算量大且难以保证收敛；用数据分析生成合理初值可显著缩小搜索范围并提高方案可实施性。
  - name: 静态与动态车辆调度模型
    role: 静态方案给出全天固定车队规模，动态方案进一步计算各时段实际所需车辆数及车场可调配库存。
    why: 按全天高峰配置固定车辆会导致低谷期大量闲置，动态调度可在保证车流不中断的条件下降低非高峰期车辆占用和运营资源浪费。
  solution_flow: 整理分时段、分站点的上下车客流及站间距离数据→计算各时段人公里需求、满载率和客流高低峰→分别建立双车场运力供需匹配模型与单车场成本—候车体验多目标模型→设置满载率、供求匹配比、发车间隔和上下行总车次平衡等参数与约束→双车场采用二次规划求各时段车次，单车场依据客流构造初始时刻表并进行邻域搜索→用时间步长法模拟发车、到站、上下客、滞留、车辆周转和车场库存→搜索满足时刻表且不中断运营的最小车辆数→统计平均满载率、平均候车时间、总车次及服务概率→对供求匹配控制参数和候选时刻表进行对比，确定静态与动态调度方案。
  validation: 采用仿真统计和参数敏感性比较验证方案：对供求匹配控制参数k取0.80、0.85、0.90、0.95，比较平均满载率、平均候车时间、总车辆数和总发车次数，选取综合表现适中的k=0.90；逐时检查两个始发站在每个发车时刻均有车辆可发，确保全日无运营间断；同时检验满载率、发车间隔、上下行总车次平衡等约束，并用高峰期5分钟内及非高峰期10分钟内等车概率评价软时间窗服务水平。
  visualization:
  - 分时段发车次数与发车间隔表
  - 分时段动态配车量及双车场库存状态表
  - 参数敏感性与运营指标对比表
  - 满载率分布图
  - 乘客候车时间或软时间窗满足概率图
  pitfalls_avoided:
  - 避免只优化总车次而忽略乘客体验：总车次减少会使平均候车时间和不方便程度上升，因此将候车体验设为主要目标，并通过满载率和软时间窗约束保障服务水平。
  - 避免由高峰期需求直接把最大车辆数当作全天实际使用量：论文进一步计算分时段最小车辆需求和车场库存，使低谷期闲置车辆能够维修或调作他用，减少资源浪费。
  - 避免上下行车次数不匹配导致车场车辆日终失衡：双车场模型增加上下行单程总车次相等的约束，保证始发车场每天起始车辆规模可以恢复。
  - 避免仅凭静态运力公式确定配车数而忽略车辆周转：通过时间步长仿真实时更新两个车场的存车状态，并以运行过程中的最大车辆缺口确定最小车队规模。
  - 避免完全随机生成时刻表造成搜索空间过大且难以收敛：先依据高峰客流、线路长度和平均速度构造合理初始发车间隔，再在其附近搜索局部最优解。
  - 避免把发车间隔细化到司机无法执行的秒级：将发车间隔限制为以分钟为单位的正整数，提高时刻表的可操作性。
  - 避免默认均匀到站假设在高峰期仍然精确：明确指出该假设可能放大误差，并建议高峰期缩短采样间隔、增加滞留人数数据或按等到站人数划分统计时段。
  innovation_points:
  - 将运客能力与实际人公里运输需求的匹配偏差作为双车场模型的核心目标，并引入平均满载率修正运力影响。
  - 把两个车场视为车辆发射源和接收端，通过实时模拟存车状态搜索保证车流不间断的最小车辆数。
  - 将多目标规划与时间步长运营仿真结合，使规划所得车次能够进一步转化为可执行的发车时刻表并接受动态可行性检验。
  - 同时给出固定车队的静态调度和分时段用车的动态调度，以定量指标协调乘客候车利益与公交公司的投资、运营成本。
  - 针对单车场复杂多目标问题采用数据驱动初值、人机交互和局部仿真搜索，在可计算性与方案质量之间取得平衡。
- id: A题论文_水质的评价和预测模型
  source_paper: A题论文 A题论文_水质的评价和预测模型
  problem_type: 综合评价+统计分析+预测+优化
  keywords:
  - 变权TOPSIS
  - 灰色关联分析
  - 一维水质模型
  - GM(1,1)
  - ARMA时间序列
  - 线性回归
  context: 基于长江沿线多站点、多指标水质监测及水文排污数据，综合评价水质、反演污染源分布、预测污染趋势并确定未来污水处理需求。
  models:
  - name: S形变权函数
    role: 将各污染指标所属水质类别映射为动态权重，并形成逐月、逐观测点的权重矩阵。
    why: 固定权重难以体现从III类可饮用水跨越到IV类不可饮用水时的质变，也不能同时突出水质类别差异和同类别内污染程度差异。
  - name: 变权TOPSIS综合评价模型
    role: 对每个月17个观测点的溶解氧、pH、高锰酸盐指数和氨氮进行综合量化评价。
    why: 水质评价属于多属性决策问题，TOPSIS可在统一指标极性和量纲后，根据观测点到正、负理想解的距离刻画综合污染程度。
  - name: 灰色关联分析模型
    role: 将各观测点跨月份的TOPSIS评价序列与逐月理想评价序列比较，形成长期综合排名。
    why: 能够综合利用时间序列整体形态和相对差异，避免仅凭单月评价或简单均值判断站点长期水质。
  - name: 稳态一维水质模型
    role: 描述污染物沿河道随水流输移和降解的过程，计算上游及本河段污染源对段末观测站浓度的贡献。
    why: 在河长远大于河宽和水深、短期流速近似稳定且横向扩散影响可忽略的条件下，一维稳态模型能以较少参数表达污染物浓度沿程衰减。
  - name: 质量守恒与等效点源反演模型
    role: 将河段内分散污染源等效为段中央连续稳定点源，联立段首、段末浓度及流量数据反演各河段月排污量。
    why: 直接获得沿河全部污染源数据较困难，而质量守恒可以利用上下游监测差异估算区间排放量，并据此识别主要污染区域。
  - name: 灰色GM(1,1)趋势预测模型
    role: 预测不可饮用类水比例及未来废水排放量的确定性增长趋势。
    why: 历史年度数据样本较少且具有明显增长趋势，GM(1,1)对小样本、信息不完全的单调趋势序列具有较强适用性。
  - name: ARMA时间序列模型
    role: 对从原始不可饮用水比例序列中剔除确定性趋势后的平稳周期波动进行预测。
    why: 单独使用GM(1,1)难以反映周期性和随机波动，ARMA可依据自相关与偏自相关特征刻画平稳残差结构。
  - name: 二元线性回归模型
    role: 建立不可饮用类水比例与长江年总流量、废水排放总量之间的数量关系。
    why: 水质恶化同时受稀释水量和污染排放量影响，线性回归可将二者纳入统一关系并用于计算约束下的允许排放上限。
  - name: 约束阈值优化模型
    role: 在IV、V类水比例不超过20%且劣V类水比例不增加的约束下，求允许废水排放量上限，并计算未来各年所需处理量。
    why: 治理目标本质上是满足水质约束的排放控制问题，预测排放量与允许排放上限之差可直接转化为最低污水处理需求。
  solution_flow: 整理各站点逐月污染指标、水质类别、流量流速和历年排污数据→统一指标极性与量纲，利用S形函数生成动态权重→采用变权TOPSIS计算站点月度污染评价值，再以灰色关联度形成长期综合排名→按观测站位置划分河段，将段内污染源等效为中央稳定点源，联立稳态一维输移降解方程和质量守恒关系反演月排污量并定位主要污染区→以IV、V和劣V类水比例之和构造污染状态序列，将其分解为确定性趋势与平稳波动，分别用GM(1,1)和ARMA预测后叠加→回归不可饮用水比例与总流量、排污量的关系，在水质约束下求排污上限131.59亿吨→使用GM(1,1)预测未来排放量，并以预测排放量减去允许上限得到未来10年污水处理量。
  validation: 采用多层内部一致性验证：检查S形权重是否满足水质越差权重越大且III类到IV类跃升明显；检查TOPSIS结果是否符合越接近负理想解污染越严重的方向性；用段末实测浓度与上游衰减贡献、段内点源贡献之和满足质量守恒来检验排污反演；依据自相关和偏自相关的拖尾、截尾特征选择ARMA结构，并将趋势项与波动项重构原序列；检查回归约束交集和排放上限的可行性，同时将预测出的持续恶化趋势与专家关于长江生态风险的判断进行合理性对照。论文未给出独立测试集误差、回归显著性和参数敏感性检验，实际应用时应补充滚动预测误差、残差诊断及敏感性分析。
  visualization:
  - S形变权函数曲线图
  - 观测站综合评价值与排名柱状图
  - 分河段污染物排放量对比图
  - 不可饮用类水比例历史值与预测值趋势图
  - GM趋势项与ARMA波动项分解图
  - 未来排放量、允许上限及所需处理量对比图
  pitfalls_avoided:
  - 避免直接沿用固定指标权重，因为固定权重无法突出III类到IV类由可饮用向不可饮用转变的质变，会低估关键污染指标的风险。
  - 避免直接比较不同量纲和不同偏好的指标，因为溶解氧是极大型、pH是居中型，而高锰酸盐指数和氨氮是极小型；先进行极性一致化和标准化可防止评价方向颠倒或量纲主导结果。
  - 避免只依据最严重单项指标或单个月份评价整体水质，因为这会忽略其他指标贡献和跨期稳定性；采用TOPSIS与灰色关联的两阶段评价兼顾多指标和多时段信息。
  - 避免把段末污染浓度全部归因于本河段排放，因为段末浓度同时包含上游污染物输移后的剩余量；模型先计算上游衰减贡献，再通过质量守恒反演新增排放。
  - 避免在缺少详细污染源位置和排放记录时逐源估计，因为参数不可辨识；将分散源等效为河段中央连续稳定点源可降低模型复杂度并使排污量可求。
  - 避免仅用GM(1,1)外推含周期波动的水质序列，因为灰色模型主要刻画确定性增长趋势；先做趋势分解，再用ARMA描述平稳周期和随机波动。
  - 避免只根据废水排放量解释水质变化，因为河流总流量具有稀释作用；回归模型同时纳入总流量和排放量，以降低遗漏关键解释变量造成的偏差。
  - 避免将预测排放量直接当作处理需求，因为在水质约束下仍存在允许排放额度；所需处理量应取预测排放量与允许排放上限之差。
  innovation_points:
  - 构造具有III类到IV类明显跃迁特征的S形变权函数，对不同水质类别下的同种污染指标动态赋权，并与TOPSIS结合形成变权综合评价。
  - 按照观测站位置分段，将河段内所有分散污染源等效为段中央连续稳定点源，利用一维输移降解模型和质量守恒从上下游监测数据反演区间排污量。
  - 将不可饮用类水比例分解为确定性增长趋势和平稳周期波动，分别使用GM(1,1)与ARMA预测后叠加，兼顾小样本趋势和周期随机性。
  - 把水质比例约束通过线性回归转换为允许排污量上限，再将排放预测与约束阈值结合，直接得到未来逐年的污水处理需求。
- id: 2020_D027
  source_paper: 2020 2020_D027
  problem_type: 统计分析
  keywords:
  - 重复水印文本
  - 有效内容缺失
  - 建模信息不可识别
  context: 所提供内容仅包含大量重复的微信公众号宣传水印，未包含可用于识别问题背景、数据、模型与结论的论文正文。
  models:
  - name: 文本去重与有效内容检测
    role: 识别并剔除重复水印，判断剩余文本是否包含可提取的建模信息
    why: 原始内容高度重复且无实质论文正文，必须先进行文本质量检测，不能据此虚构论文采用的核心模型
  solution_flow: 原始文本→统计重复片段并去重→检测问题描述、变量、公式、算法和结果等有效信息→确认有效论文内容缺失→停止模型知识提取并标记需补充原文
  validation: 通过重复率检查、关键词覆盖检查和结构完整性检查进行验证；去重后未发现题目、摘要、模型公式、参数估计、求解结果或误差分析，因此无法实施论文模型的拟合检验、对比验证或敏感性分析。
  visualization:
  - 文本片段频次柱状图
  - 重复内容占比饼图
  pitfalls_avoided:
  - 避免根据微信公众号水印臆测论文主题，因为水印不包含研究对象、目标变量或约束条件，无法支持问题类型判断
  - 避免虚构核心模型及求解结果，因为原文没有任何公式、数据、参数和结论，强行补全会造成事实性错误
  innovation_points:
  - 采用内容有效性审查作为建模知识提取的前置环节，防止低质量文本导致错误归纳
  - 通过重复文本检测区分页面水印与论文正文，并明确标记信息缺失而非进行无依据推断
- id: B题优秀论文_2002年B题彩票中的数学
  source_paper: B题优秀论文 B题优秀论文_2002年B题彩票中的数学
  problem_type: 统计分析+综合评价+优化
  keywords:
  - 中奖概率与期望收益率
  - 公平尺度与博彩心理
  - 非线性规划
  context: 针对传统型与乐透型彩票，综合中奖收益、公平程度和彩民博彩心理评价现有奖金方案，并在给定销售注数下优化玩法参数、奖项比例和奖金额。
  models:
  - name: 古典概率模型
    role: 根据传统型和乐透型彩票的选号规则，计算各奖级的单注中奖概率。
    why: 各奖级中奖事件可通过有限等可能结果的组合计数表示，古典概率能够直接为收益计算和方案优化提供基础参数。
  - name: 二项分布与正态近似模型
    role: 描述销售n注时各奖级中奖注数的随机分布，并估计中奖注数的期望与波动。
    why: 每注是否中某一奖级可视为伯努利试验，因此中奖注数服从二项分布；当销售量足够大时，可依据大数定律和正态近似简化分析。
  - name: 单注期望收益率模型
    role: 综合高项奖被取走的概率和低项奖的期望兑付额，计算每注彩票的平均收益率。
    why: 彩票方案的经济吸引力不能仅由头奖金额判断，期望收益率能够统一衡量各奖级概率、奖金以及销售规模对彩民收益的影响。
  - name: 公平尺度模型
    role: 以同一奖项组内中奖概率与单注奖金额的乘积尽量相等为原则，度量奖金分配的公平程度。
    why: 低概率奖项通常应对应高奖金，以概率与奖金近似成反比可刻画不同奖级单位中奖机会所获得回报的一致性；乘积型公平因子在各项回报均衡时达到较大值。
  - name: 博彩心理函数
    role: 使用饱和型函数将单注期望收益率转换为彩民对方案的心理吸引力。
    why: 彩民兴趣对收益的反应通常并非线性增长，函数W(t)=1-exp(-t)能够表示吸引力随收益增加而上升、但边际作用逐渐减弱的心理特征。
  - name: 综合评价判别函数
    role: 将博彩心理因子与公平因子相乘，对29种既有彩票方案进行综合评分和排序。
    why: 单独采用收益或公平性均无法完整反映方案合理性，乘法合成可使收益吸引力和奖金分配公平性共同约束最终评价结果。
  - name: 混合整数非线性规划模型
    role: 以综合评价函数最大化为目标，联合优化乐透型彩票的选号参数、奖级数量、高项奖分配比例和低项奖金额。
    why: 玩法参数M、N和奖级设置具有离散性，而中奖概率、头奖金额、兑付概率及评价函数之间存在非线性关系，因此适合采用带离散枚举的非线性规划求解。
  solution_flow: 数据→整理彩票规则、单注价格、总奖金比例、销售注数及各奖级奖金约束→利用组合计数计算传统型和乐透型各奖级中奖概率→将中奖注数建模为二项随机变量，并在大样本下采用正态近似→计算高项奖至少出现一注中奖者的概率、低项奖期望兑付额和单注期望收益率→构造概率与奖金乘积型公平因子及饱和型博彩心理函数→建立综合判别函数并对29种方案评分排序→以判别函数最大化为目标，设置M、N、奖金比例、奖金额、奖级递减和一等奖上下限等约束→使用MATLAB进行枚举与非线性规划求解→改变销售注数进行稳定性和敏感性比较，得到不同销量下的最优方案。
  validation: 采用多层验证：首先检查各奖级中奖概率和奖金比例是否满足概率规则及预算约束；其次分别在100万、150万、200万、300万等销售规模下计算单注平均收益率，观察其随销量增加趋于稳定值；再次将评价函数应用于29个已知方案，通过评分排序比较传统型、乐透型及带特别号玩法的相对优劣；最后对100万至500万注的多个销售情景重复优化，检验最优玩法、奖金比例和低项奖金额对销售规模的敏感性。模型验证仍存在局限，即销售量被当作外生给定值，尚未验证方案吸引力对实际销量的反馈作用。
  visualization:
  - 29种彩票方案综合评分排序条形图
  - 单注期望收益率随销售注数变化的折线图
  - 不同销售规模下最优玩法与奖金参数对比表
  - 各奖级中奖概率—单注奖金额双对数散点图
  pitfalls_avoided:
  - 明确规定每注只兑付最高奖级而不能重复领奖，避免在计算期望兑付额时对同一注彩票的多个匹配奖级重复计奖。
  - 高项奖使用1-(1-P_i)^n计算至少出现一名中奖者的概率，而不是直接把nP_i当作必然中奖注数，避免在极低概率奖项上高估奖金实际兑付。
  - 将高项奖与低项奖分组建立公平尺度，避免一等奖与固定小奖因概率数量级差异过大而使统一乘积指标失真。
  - 在优化中加入奖金比例和为1、奖金额逐级递减、一等奖金额上下限等约束，避免得到数学评分较高但不符合彩票发行规则或奖级倒挂的不可实施方案。
  - 针对不同销售注数分别求解并比较结果，避免把固定销量下的最优参数误认为适用于所有市场规模；同时明确指出销量内生性未解决，防止过度推广结论。
  - 不把历史开奖号码用于趋势预测，而依据组合概率分析随机中奖事件，避免陷入将独立随机号码误判为可预测规律的错误。
  innovation_points:
  - 把单注期望收益、公平尺度和博彩心理三个维度整合为统一判别函数，使彩票方案能够同时进行量化评价、排序和优化。
  - 用各奖级中奖概率与单注奖金乘积的均衡程度刻画公平性，并以乘积型指标反映奖项内部回报偏离公平状态的程度。
  - 将高项奖至少被取走的概率显式纳入期望收益与奖金计算，使极小概率头奖的空缺风险能够进入评价模型。
  - 在同一框架内联合优化乐透型玩法参数、高项奖分配比例和低项奖金额，并通过多种销售规模情景给出差异化最优方案。
- id: A题优秀论文_管道切片的三维重建
  source_paper: A题优秀论文 A题优秀论文_管道切片的三维重建
  problem_type: 优化+仿真
  keywords:
  - 管道切片三维重建
  - 最大内切圆
  - 跨切片球截面约束
  context: 根据100张离散BMP管道切片图像，反演滚动球半径及各层轴心坐标，并重建管道中轴线及其空间投影。
  models:
  - name: 连续最大内切圆模型
    role: 从切片连续边界中估计最大内切圆的圆心和半径范围，为管道半径及轴心位置提供初始解。
    why: 滚动球在经过球心的切片上形成半径最大的截面圆；在横断面为圆且轴线横向变化相对平缓的假设下，最大内切圆半径等于球半径，其圆心即切片轴心。
  - name: 基于Bresenham算法的离散圆搜索模型
    role: 在BMP像素网格上搜索半径为30的所有内含圆，并生成各切片的候选轴心坐标。
    why: 原始数据是离散像素图像，直接采用与图像生成机制一致的整数圆算法，可以减少连续圆与锯齿状像素边界不匹配造成的系统误差。
  - name: 跨切片球截面一致性筛选模型
    role: 利用候选轴心对应球体在上下29层切片中的截面圆必须被相应切片包含这一约束，筛除不可能的候选轴心。
    why: 半径为30的球与距离球心层数为i的切片相交时，截面圆半径由球面几何关系唯一确定，因此能够利用多层信息提高轴心识别的唯一性和准确性。
  - name: 尖端特性二次筛选模型
    role: 针对71至99层因上方切片信息缺失而保留多个候选点的情况，通过切片尖端包络来源确定轴心。
    why: 靠近数据端部时双向跨层约束不完整，而切片边界尖端只能由特定层球体的较小截面圆形成，可补充缺失的方向信息。
  - name: 分段线性中轴线重建模型
    role: 将相邻切片的轴心坐标用空间直线段连接，形成完整中轴线，并计算其在XY、YZ和ZX平面上的投影。
    why: 相邻切片间距仅为1个单位，在薄层条件下可将局部中轴线近似为直线，方法简单、稳定且便于三维重建和投影绘制。
  solution_flow: 读取100张512×512二值BMP切片并转化为0-1矩阵→利用四邻域规则提取边界点与内部区域→通过连续最大内切圆搜索估计半径接近30→在0号切片上用Bresenham离散圆确定半径30及圆心(0,160)→逐层扫描可容纳直径60的内部区间并生成所有候选轴心→依据半径30球体在上下29层产生相应截面圆的几何关系进行跨切片筛选→对71至99层采用尖端特性二次筛选→连接相邻层轴心构造分段线性三维中轴线→消去相应坐标得到三个坐标平面的投影→由轴心和球截面圆重新生成切片并进行误差验证。
  validation: 采用反向重构验证：对目标层汇总其上下29层轴心对应球体在该层形成的离散截面圆，并叠加生成理论切片；将重构图像与原BMP切片逐像素比较，以相异像素占比作为相对误差。第40层误差约为3%，同时连续模型所得最大圆半径多数接近30，且Bresenham圆与绘图软件生成的半径30像素圆边缘重合，从参数、生成机制和重构结果三个层面验证模型。
  visualization:
  - 三维管道中轴线图
  - 中轴线XY平面投影图
  - 中轴线YZ平面投影图
  - 中轴线ZX平面投影图
  - 原始切片与重构切片对比图
  pitfalls_avoided:
  - 避免直接把BMP锯齿边界当作连续几何边界精确拟合，因为像素取舍和舍入会导致不同方向上的离散半径不一致；改用Bresenham整数圆与像素网格直接匹配，降低图像离散化系统误差。
  - 避免仅凭单张切片的最大内切圆确定轴心，因为非凸或多圆包络区域可能存在多个同半径候选圆心；引入上下29层球截面包含关系，利用跨层一致性排除伪解。
  - 避免在71至99层继续机械使用对称的上下层筛选，因为靠近数据末端时上方切片缺失，信息不足会留下大量候选点；改用边界尖端的截面圆来源进行二次判别。
  - 避免忽略模型的不可辨识性，因为当中轴线沿竖直方向上升缓慢并作剧烈螺旋运动时，切片最大内切圆可能大于真实球半径；论文明确增加轴线横向变化相对平缓、最大内切圆半径等于球半径的可识别性假设。
  - 避免强行拟合高阶全局光滑曲线，因为数据只有逐层离散轴心且层间距很小，高阶拟合可能产生振荡和额外误差；采用相邻轴心分段线性连接以保持局部稳定性。
  innovation_points:
  - 将连续最大内切圆思想与面向BMP像素生成机制的离散Bresenham圆模型结合，既利用真实几何结构，又针对离散图像系统误差进行校正。
  - 把单层图像识别转化为多层球面几何一致性问题，利用球体在上下29层中的确定截面半径对候选轴心进行全局筛选。
  - 针对端部切片信息不完整造成的非唯一性，引入切片尖端包络来源特性补充约束，提高末端轴心坐标的可辨识性。
  - 采用轴心反演后重新生成切片并逐像素比较的闭环检验方式，使三维重建结果能够在原始二维数据层面得到量化验证。
- id: A题论文_长江水质评价和预测研究
  source_paper: A题论文 A题论文_长江水质评价和预测研究
  problem_type: 综合评价+统计分析+预测+优化
  keywords:
  - 综合污染指数
  - 一次累加拟合与时间序列预测
  - 多元线性回归与线性规划
  context: 基于长江多年水质、流量和废水排放数据，评价区域污染状况、识别主要污染源、预测未来十年水质并制定最小污水处理方案。
  models:
  - name: 归一化综合污染指数模型
    role: 将溶解氧、高锰酸盐指数、氨氮和pH值合成为单一指标，用于比较不同年份及不同观测点的污染程度。
    why: 原始水质指标量纲、取值范围和污染方向不同，归一化并综合后可以降低多指标直接比较的困难。
  - name: 基于自净系数的污染物质量平衡模型
    role: 结合相邻监测站的污染物浓度、流量、距离和平均流速，估计河段间高锰酸盐与氨氮的污染增量并识别主要污染来源区域。
    why: 下游水质差可能是上游污染累积和沿程自净共同作用的结果，仅按监测点浓度高低无法准确判断污染源。
  - name: 一次累加多项式拟合模型
    role: 对各类水质河长百分比进行一次累加以削弱随机波动，再通过多项式拟合预测未来十年各类水质比例。
    why: 原始年度序列样本较少且波动明显，一次累加可提高序列平滑性，使长期趋势更易拟合。
  - name: 指数型时间序列趋势模型
    role: 将可饮用水与污染水比例聚合后进行对数线性趋势预测，并给出预测误差和区间。
    why: 该模型能够描述水质比例随时间的总体指数变化趋势，并补充一次累加模型对随机波动反映不足的问题。
  - name: 多元线性回归模型
    role: 建立废水排放总量与长江总流量及IV类、V类、劣V类水比例之间的定量关系，为污水处理量计算提供约束方程。
    why: 优化问题需要把水质控制目标转换为可计算的污水处理量，而历史数据可用于估计各影响因素与废水总量之间的线性关系。
  - name: 线性规划模型
    role: 在IV类与V类水比例之和不超过20%、劣V类水比例为0等条件下，最小化未来十年的污水处理总量。
    why: 目标函数以及水质比例上限、非负性和年度控制条件均可线性表达，适合使用线性规划获得最小治理成本对应的方案。
  solution_flow: 整理多年监测站水质、流量、河长和废水排放数据→统计各类水质比例并构造综合污染指数→根据站间距离与平均流速计算传播时间，利用自净衰减和质量平衡估计河段污染增量→对各类水质比例进行一次累加、多项式拟合和还原预测，并将各类别预测值归一化至总和100%→使用指数型时间序列模型预测总体趋势→以RMSE和预测区间评估误差并比较两类预测结论→利用历史数据拟合废水排放量的多元线性回归关系→将预测比例及水质控制标准代入线性规划，求解未来十年最小污水处理总量和年度处理量。
  validation: 先用历史样本比较拟合值与实际值，并采用均方根误差RMSE衡量时间序列预测误差；针对小样本使用t分布构造约80%置信水平的预测区间；同时比较一次累加拟合模型与时间序列模型所得总体恶化趋势是否一致，并检查归一化后各类水质比例之和是否为100%、线性规划结果是否满足IV类与V类水合计不超过20%及劣V类水为0的约束。
  visualization:
  - 各年份水质类别河长占比堆积柱状图
  - 各观测点综合污染指数热力图
  - 相邻河段污染物增量折线图
  - 历史值与预测值及预测区间对比图
  - 未来十年年度污水处理量柱状图
  pitfalls_avoided:
  - 避免直接比较不同量纲的溶解氧、高锰酸盐、氨氮和pH值，因为量纲及污染方向不一致会导致综合判断失真，故先按水质标准归一化后构造综合指数。
  - 避免把水质最差的下游观测点直接认定为污染源，因为污染物可能由上游输入并在下游累积，故引入流量、传播时间和自净衰减进行站间质量平衡。
  - 避免直接使用各年绝对评价河长建模，因为不同年份评价河长差异较大会造成不可比，故改用各类水质占评价河长的百分比进行预测。
  - 避免各水质类别独立预测后比例总和不等于100%，因为这会产生不合法的组成数据，故按当年各类别预测值总和进行再归一化修正。
  - 避免将计算得到的负污染增量解释为实际负排放，因为负值不符合污染源新增量的物理含义，论文将其截断为0；但实际应用中仍应进一步检查测量误差、自净系数设定和支流汇入影响。
  - 避免只依赖平滑后的累加模型判断趋势，因为其可能掩盖年度随机波动，故增加时间序列模型、RMSE和预测区间作为补充验证。
  innovation_points:
  - 以I类水标准为基准自定义综合污染指数，将四项水质指标压缩为可用于跨地区、跨年份比较的单一污染尺度。
  - 将相邻监测站的浓度与流量转换为污染物通量，并结合平均流速、自净系数和传播时间反推河段污染增量，实现污染来源的空间定位。
  - 将一次累加多项式预测与指数型时间序列预测结合，分别提取平滑长期趋势和刻画随机误差，提高预测结论的可解释性。
  - 把水质比例预测、多元回归和线性规划串联起来，将未来水质控制目标转化为最小污水处理总量及年度治理方案。
- id: A题优秀论文_2002年A_C题车灯线光源的优化设计问题(1)
  source_paper: A题优秀论文 A题优秀论文_2002年A_C题车灯线光源的优化设计问题(1)
  problem_type: 优化+仿真+综合评价
  keywords:
  - 反射定律与反射点计数
  - 光强数值积分
  - 线光源功率优化
  context: 在旋转抛物面车灯和指定测试屏约束下，确定满足B、C两点光强要求且总功率最小的线光源长度，并仿真测试屏上的亮区。
  models:
  - name: 旋转抛物面几何光学反射模型
    role: 根据反射定律、抛物面法向量以及入射光线与反射光线的角平分条件，建立线光源点、反射点和测试点之间的坐标关系。
    why: 车灯反射面具有旋转抛物面结构，几何光学模型能够直接描述一次反射路径，并为后续计算传播距离和光强提供基础。
  - name: 反射点分类与计数模型
    role: 将反射点划分为纬圆上的非共面反射点和平面XOY内的反射点，并结合反射面的有限尺寸确定不同光源位置对应的反射点数量。
    why: 同一光源点到同一测试点可能存在多个有效反射点，若遗漏或重复计算，会直接造成光强积分误差。
  - name: 光强衰减与线光源叠加模型
    role: 采用与传播距离平方成反比的球面波衰减关系，计算线光源微元经各反射点到达B、C两点的光强，并利用积分完成线光源各点贡献的叠加。
    why: 在忽略衍射、干涉和反射损耗的假设下，各点光源贡献可以线性叠加，适合将连续线光源转化为可计算的光强积分。
  - name: 数值积分模型
    role: 对线光源长度和轴向坐标进行离散化，用求和近似B、C两点的光强积分，得到光强随半长度变化的数值关系。
    why: 反射点坐标和光强函数难以写成可直接积分的显式解析表达式，因此需要使用离散求和获得稳定的数值结果。
  - name: 光强约束下的功率最小化模型
    role: 以线光源总功率最小为目标，以B点光强不低于2E0、C点光强不低于E0为约束，搜索最优线光源半长度和对应单位长度功率。
    why: 问题同时包含照明性能下限和节能目标，属于典型的非线性约束优化问题，可通过对长度离散搜索并比较所需最小功率求解。
  - name: 光线追迹与亮区仿真模型
    role: 计算光线在抛物面上的一次反射方向及其与测试屏的交点，将所有光源点和反射点产生的屏幕交点叠加，绘制亮区形状。
    why: 仅检查B、C两点不能反映整体照明范围，光线追迹能够直观检验设计产生的光斑位置、形状和覆盖区域。
  solution_flow: 输入旋转抛物面尺寸、线光源位置、测试屏位置及B、C两点光强阈值→参数化抛物面并求法向量→依据反射定律推导光源点到B、C的反射点方程→按非共面纬圆情形和平面情形分类求解并统计有效反射点→采用距离平方反比模型计算点光源贡献→离散线光源并数值积分得到EB(l)和EC(l)→在EB≥2E0、EC≥E0约束下计算各候选长度所需功率并取最小值→得到最优线光源长度约2l=3.7
    mm→追迹反射光线并在测试屏上叠加生成梭形亮区→结合安全性和测试点设置对测试方案进行综合评价。
  validation: 首先利用反射点坐标代回抛物面方程、共面条件和角平分条件进行几何一致性检验，并通过有限反射面边界核验反射点是否有效；其次用典型光源位置的数值解和反射点数量分段结果检查求根与计数逻辑；然后验证最优解同时满足EB≥2E0和EC≥E0，并比较可行长度对应的最低功率；最后通过光线追迹得到测试屏梭形亮区，对照抛物面对称性和预期聚光特征进行可视化验证。论文未系统进行步长收敛性、余弦照度定律及实车实验验证，因此结果主要属于简化假设下的数值验证。
  visualization:
  - 反射几何关系示意图
  - 反射点方程的函数图像
  - 三维反射光线追迹图
  - 测试屏二维亮区图
  pitfalls_avoided:
  - 避免默认每个光源点只有一个反射点：论文区分纬圆反射点和平面内反射点，并分段统计数量，否则会遗漏多路径贡献或重复累计光强。
  - 避免将无限抛物面上的数学解全部视为有效解：通过0≤Y≤21.6及X、Z范围约束筛除落在实际反射面之外的反射点，防止虚假光强贡献。
  - 避免强行推导不可得的显式光强函数：当eB(x)和eC(x)无法写成便于积分的解析式时，采用离散化和数值积分，使优化问题仍可计算。
  - 避免只求满足光强约束的任意长度：将单位长度功率、总长度和两点光强约束统一到功率最小化模型中，以免得到满足照明要求但能耗过高的方案。
  - 避免仅凭B、C两个标量指标判断整体照明效果：进一步仿真测试屏亮区，以识别光斑覆盖范围和形状；同时指出两点测试仍可能遗漏眩光与侧向照明风险。
  innovation_points:
  - 证明并利用非XOY平面反射点的法线必经过光源—目标连线与抛物面对称轴交点，从而将三维反射点搜索约化为由光源位置唯一确定的纬圆问题。
  - 对不同光源位置的有效反射点数量进行分段刻画，将多反射路径计数纳入光强积分，提高了光强计算的完整性。
  - 把几何光学推导、数值积分、约束功率优化和光线追迹仿真串联为统一流程，既给出最优线光源长度，又展示整体亮区。
  - 不局限于求解题设指标，还从测试距离、侧向照明、眩光风险和测试点数量等方面评价测试方案，并明确指出模型未考虑余弦照度定律和屏面光照面积变化的局限。
- id: A题优秀论文_2002年A_C题车灯线光源的优化设计问题
  source_paper: A题优秀论文 A题优秀论文_2002年A_C题车灯线光源的优化设计问题
  problem_type: 优化+仿真+综合评价
  keywords:
  - 旋转抛物面反射
  - 反射点计数
  - 数值积分
  - 功率最小化
  - 光线追迹
  context: 在给定旋转抛物面车灯、线光源位置和测试屏照度约束的条件下，确定使车灯功率最小的线光源长度，并模拟测试屏上的反射亮区。
  models:
  - name: 几何光学反射点模型
    role: 利用反射定律、抛物面法向量及入射光线与反射光线的角平分关系，建立线光源点、反射点和测试点之间的坐标关系。
    why: 测试点光强取决于所有可达反射路径，必须先准确确定反射点的位置及其存在条件。
  - name: 反射点分段计数模型
    role: 根据反射面的有限尺寸和反射点的两类几何情形，分段确定每个点光源到达B点或C点的有效反射点个数。
    why: 同一光源点可能对应多个反射点且数量随横坐标变化，若直接假设反射点唯一，会遗漏光路并导致光强计算错误。
  - name: 线光源光强积分模型
    role: 将线光源分解为连续点光源，按距离衰减计算各有效反射路径对B、C两点的光强贡献，再沿线光源积分叠加得到总光强。
    why: 在线性叠加和忽略干涉的假设下，微元积分能够把点光源的几何光路结果推广到线光源。
  - name: 约束功率最小化模型
    role: 以线光源半长和单位长度功率为决策变量，在B点光强不低于2E0、C点光强不低于E0的约束下最小化总功率。
    why: 问题同时包含照明性能约束和节能目标，适合表示为带非线性光强约束的优化问题。
  - name: 离散数值积分与枚举优化算法
    role: 离散候选半长和光源坐标，数值求解反射点、近似计算光强积分，并比较各可行长度对应的最低功率。
    why: 反射点方程和光强函数难以获得完整显式表达式，采用数值方法可直接处理分段、多根和非线性问题。
  - name: 光线追迹仿真模型
    role: 根据反射光线参数方程追踪线光源各点发出的光线，在测试屏上叠加得到亮区形状。
    why: 测试屏上的二维亮区难以仅由少数测试点反映，光线追迹能够直观展示整体照明范围和光斑结构。
  - name: 测试方案定性综合评价
    role: 从测试距离、转弯侧向照明、测试点数量、眩光风险及实车试验必要性等方面评价原测试方案。
    why: 仅以B、C两点照度和能耗评价车灯无法完整反映道路安全性和实际使用效果。
  solution_flow: 输入旋转抛物面、线光源及B、C测试点的几何参数→计算抛物面法向量并依据反射定律建立反射点方程→将反射点划分为非轴截面情形和XOY平面情形，确定不同光源位置对应的有效反射点数量→按传播距离衰减计算点光源对B、C的光强贡献→离散线光源坐标并进行数值积分，得到光强随半长变化的函数→施加EB≥2E0、EC≥E0约束并最小化总功率→数值搜索得到最优半长l=1.85
    mm，即线光源长度2l=3.7 mm→利用光线追迹模拟测试屏亮区→结合照度约束、光斑形状和实际行车需求评价方案。
  validation: 采用几何可行性与数值结果相结合的内部验证：检查反射点是否位于规定的有限抛物面范围内，并满足共面条件、法向角平分条件和反射定律；通过分段计数核查不同光源坐标下反射点的存在性与数量；检验最优解是否同时满足B、C两点的光强下限，并比较候选长度对应的最低功率；利用光线追迹所得梭形亮区对点照度计算进行空间一致性检查。论文未开展实验标定、步长收敛分析和实车数据验证，因此最终结果仍需通过网格加密及物理测试进一步确认。
  visualization:
  - 车灯反射几何关系示意图
  - 反射点方程数值解函数图
  - 三维反射光线束图
  - 测试屏二维亮区图
  pitfalls_avoided:
  - 避免将每个点光源对应的反射点简单视为唯一点：旋转抛物面上可能同时存在纬圆反射点和平面内反射点，遗漏多重反射路径会低估测试点光强。
  - 避免忽略反射面的有限边界：通过0≤Y≤21.6及横向坐标范围筛除落在实际反射面之外的数学解，防止把不可实现光路计入积分。
  - 避免强求不存在或极其复杂的显式光强表达式：对线光源长度和光源坐标离散化，并使用数值求根与数值积分处理非线性、多根问题。
  - 避免只验证功率目标而不检查照度可行性：先由B、C两点约束筛选可行长度，再在可行域内比较最低功率。
  - 避免用单个点光源的光强直接代表线光源：依据无干涉假设对线光源微元贡献进行积分叠加，从而反映不同位置光源点及多条反射路径的共同作用。
  innovation_points:
  - 证明了非XOY平面反射点的法线必经过光源点与目标点连线和抛物面对称轴的交点，从而将三维反射点搜索约化为由光源位置唯一确定的纬圆问题。
  - 将反射点按几何情形分类并给出其数量随光源横坐标变化的分段关系，提高了光强积分中有效光路识别的准确性。
  - 把几何光学推导、数值积分和约束优化统一起来，在无法得到显式光强函数时仍能求得最优线光源长度。
  - 在点照度优化之外加入光线追迹，得到测试屏上的梭形亮区，实现了局部指标计算与整体照明形态仿真的结合。
- id: B题_长方体材料截断切割的优化设计
  source_paper: B题 B题_长方体材料截断切割的优化设计
  problem_type: 优化+仿真+统计分析
  keywords:
  - 长方体截断切割
  - 最短路径
  - 切割顺序优化
  - 分类枚举
  - 蒙特卡洛仿真
  context: 在水平与垂直切割单位面积费用不同且调整刀具会产生额外费用的条件下，优化六次截断切割的顺序，以使从长方体材料中切出目标小长方体的总加工费用最小。
  models:
  - name: 尺度变换与费用对称化模型
    role: 将水平切割与垂直切割单位面积费用不同的问题转化为单位费用相同的等价问题。
    why: 通过按费用比缩放长方体高度并同步调整垂直切割单价，可保持各切割方案总费用不变，同时获得方向对称性，便于推导统一的优化准则。
  - name: 相邻交换与有序切割模型
    role: 求解无刀具调整额外费用时的全局最优切割顺序。
    why: 比较两次相邻切割交换前后的截面面积可证明：不同方向切割应按对应边界距离从大到小排列；通过类似冒泡排序的局部交换，可将任意方案调整为费用不增的单调递减序列，从而得到全局最优解。
  - name: 候选切割方式缩减模型
    role: 利用同方向两次切割的支配关系压缩一般情形下的搜索空间。
    why: 同方向的两刀若先执行对应距离较大的一刀，后续保留材料的尺寸不会更大，且刀具调整次数不变，因此至少存在一个最优解满足该顺序约束，可将全部720种排列缩减为90种候选方式。
  - name: 状态图最短路径模型
    role: 在计入切割面积费用和刀具调整费用时精确求解全局最优切割方案。
    why: 每次切割都会使材料进入新的状态，且单次费用只依赖当前状态、切割动作及上一垂直切割方向，因此可将状态表示为图顶点、切割表示为有向边、加工费用表示为边权，原问题等价于起点到终点的最短路径问题。
  - name: 分层动态规划搜索模型
    role: 利用状态图的无环分层结构改进通用最短路径标号算法。
    why: 状态层数等于已完成的切割次数，所有边只从低层指向高层，因此可以逐层更新最小费用和前驱节点，避免通用算法中的重复标号，提高搜索效率并恢复最优切割路径。
  - name: 按刀具调整次数分类枚举模型
    role: 对小规模问题进行精确求解，并分析调整费用变化时最优方案的分段结构。
    why: 候选方案数量仅为90，且刀具调整次数只有1、2、3三种可能；先分别求每一类的最小切割费用，再比较切割费用与调整费用之和，可一次得到不同调整费用参数区间内的全部最优解。
  - name: 综合启发式优化准则
    role: 在不执行完整精确搜索时快速产生近似最优切割方案。
    why: 局部最优准则能同时考虑当前切割费与调刀费，但缺乏全局性；有序切割准则具有全局面积优化性质，却忽略调刀费。先局部决策至某一垂直方向完成，再按有序准则安排余下切割，并与纯有序方案择优，可兼顾稳定性、计算便利性和整体效果。
  - name: 蒙特卡洛随机仿真评价模型
    role: 比较局部最优、有序切割和综合优化三类准则的近似性能。
    why: 随机生成长、宽、高各分段尺寸及刀具调整费用，以精确最优费用为基准计算浪费率，可从均值与分布两个层面评价不同参数条件下各启发式准则的稳健性。
  solution_flow: 输入长方体三个方向的分段尺寸、水平与垂直单位面积切割费用及单次刀具调整费用→利用尺度变换将两类单位面积费用对称化→在无额外费用时通过相邻交换证明并应用距离降序的有序切割准则，同时分析最优解唯一性→在一般情形下用同方向切割的支配关系将720种排列缩减为90种→构造包含材料状态和上一垂直切割方向的分层状态图，将单次切割费与调刀费作为边权→采用逐层动态规划求最短路径，或按1、2、3次调刀分类枚举求精确最优方案→针对快速决策构造局部最优与有序切割相结合的综合准则→通过随机仿真计算相对精确最优解的浪费率，并结合具体实例验证最优方案、费用及参数分界点。
  validation: 首先用相邻交换论证和支配关系从理论上验证无额外费用准则及候选集缩减不会遗漏至少一个最优解；其次将状态图最短路径或分类枚举得到的精确最优费用作为基准，对随机生成的尺寸与调整费用样本分别运行局部最优、有序切割和综合准则，计算浪费率的均值及分布；最后使用具体算例核算每刀截面面积、总切割费用、调刀次数和总费用，并通过比较不同调整费用下的线性费用函数确定最优方案切换阈值。
  visualization:
  - 不同优化准则浪费率分布图
  - 浪费率均值对比表
  - 长方体切割位置示意图
  - 不同调刀次数下总费用随调整费用变化的分段折线图
  pitfalls_avoided:
  - 避免直接在720种切割排列上无差别穷举：利用同方向两次切割的支配关系固定其相对顺序，将候选数降至90，既减少计算量又保证候选集中仍含全局最优解。
  - 避免忽略水平与垂直切割单位面积费用不同而直接套用距离降序准则：先按费用比进行尺寸与单价的等价变换，否则相邻交换中的方向对称性不成立，可能得到错误顺序。
  - 避免把仅考虑当前一步费用的贪心方案误认为全局最优：当前截面较小或暂时不调刀的选择会改变后续材料尺寸和调刀次数，因此一般情形采用最短路径或分类枚举获得精确解。
  - 避免在调刀费用较大时机械使用无额外费用下的有序切割准则：该准则只优化截面面积，可能因频繁改变切割方向产生较高额外费用，故需将调刀状态纳入状态图或使用综合准则。
  - 避免仅报告启发式算法的平均表现而掩盖不稳定性：除浪费率均值外还考察其分布和离散程度，以识别局部最优准则可能出现的较差样本。
  - 避免只给出单一参数值下的最优方案：分类枚举将方案按调刀次数分组，并比较关于调整费用的线性总费用，从而获得参数变化时的最优区间和临界点。
  innovation_points:
  - 通过几何尺度变换把方向单位切割费用不一致的问题等价转化为具有水平—垂直对称性的标准问题，为相邻交换证明创造条件。
  - 利用局部相邻交换推导出无额外费用时按边界距离降序切割的简洁全局最优准则，并进一步刻画最优解的唯一性与并列条件。
  - 将材料状态与上一垂直切割方向联合编码为图节点，使截面费用和刀具调整费用统一转化为边权，并利用固定六层的结构进行分层最短路径搜索。
  - 依据同方向切割的支配关系压缩排列空间，再按刀具调整次数分类，可一次性获得调整费用参数变化时的分段最优方案。
  - 将局部费用敏感的贪心准则与全局面积有序准则组合，并与纯有序方案择优，形成计算简单且经随机仿真验证具有较低浪费率的综合启发式方法。
- id: A题_DNA序列中的结构与简化模型
  source_paper: A题 A题_DNA序列中的结构与简化模型
  problem_type: 分类聚类+统计分析
  keywords:
  - DNA序列结构
  - 特征提取
  - 序列分类
  - 碱基丰度
  - 几何表示
  context: 通过提取由A、T、C、G组成的DNA序列在局部与整体尺度上的结构特征，对人工序列和自然序列进行分类，从而辅助发现序列、结构与生物功能之间的关系。
  models:
  - name: 单碱基丰度特征模型
    role: 统计A、T、C、G在序列中的出现频率，并构造四维基础特征向量。
    why: 模型简单、可解释性强，能够反映不同序列片段的碱基组成差异，适合作为人工数据分类的基准特征。
  - name: 多字符片段特征模型
    role: 统计二联体、三联体或更长字符串的出现频率，并通过显著性评价和特征排序筛选分类变量。
    why: 相较单碱基频率，该模型保留了字符排列顺序和局部关联信息，对结构更复杂的自然DNA序列具有更强的区分能力。
  - name: 欧氏距离与马氏距离分类模型
    role: 计算待分类序列与各类别代表特征之间的距离，并按照最小距离原则确定类别。
    why: 欧氏距离便于实现，马氏距离能够考虑特征之间的相关性及尺度差异，适用于基于碱基丰度向量的分类。
  - name: Fisher线性判别模型
    role: 寻找使类间差异最大、类内差异最小的投影方向，对DNA序列特征进行监督分类。
    why: 能够将多维特征压缩为判别性较强的组合指标，在特征维数较低、类别信息已知时具有较好的稳定性和可解释性。
  - name: 统计聚类模型
    role: 依据序列特征之间的相似度或距离形成类别，用于探索DNA序列的潜在结构分组。
    why: 分类目标本质上涉及样本间相似性，聚类方法不必预先完全掌握序列的生物学结构，适合开放式结构发现。
  - name: BP神经网络分类模型
    role: 以筛选后的统计特征作为输入，学习特征与类别之间的非线性映射并输出分类结果。
    why: DNA序列类别与统计特征之间可能存在复杂的非线性关系，BP网络比简单线性判别函数具有更强的拟合与识别能力。
  - name: 信息熵与综合判别模型
    role: 将DNA序列视为信息流，以字符分布及其变化引起的熵变化刻画结构，再融合多个指标形成综合判别函数。
    why: 信息熵能够从不确定性和信息量角度描述序列的有序程度，可补充普通频率统计难以反映的结构差异。
  - name: 关键词与层次分类模型
    role: 将DNA序列类比为文本，通过优选法识别具有类别代表性的字符片段，并利用关键词实施逐层分类。
    why: DNA字符串与文本都可视为符号序列，文本分类中的关键词思想能够提取局部高辨识度模式，并降低一次性多类别判别的难度。
  - name: DNA序列几何分类模型
    role: 把碱基序列映射为几何轨迹或几何统计量，再依据几何形态和距离完成分类。
    why: 几何表示能够同时编码字符组成和排列顺序，不必严重依赖小规模训练集，并在自然数据分类中表现出较高准确率。
  - name: Z曲线简化模型
    role: 将四种碱基的累计分布转换为低维几何曲线或数值特征，用于区分不同类型的DNA序列。
    why: Z曲线能以紧凑形式保留DNA序列的组成与顺序信息，具有直观性，并便于在竞赛条件下进行简化计算和分类。
  solution_flow: 数据→分别整理少量短人工序列和182条较长自然DNA序列，完成长度统计、字符编码与必要的归一化→模型→提取单碱基丰度、多字符片段频率、信息熵或几何特征，采用显著性检验、重要性排序或优选法筛选特征，再建立距离判别、Fisher判别、聚类、BP神经网络或几何分类模型→参数→确定片段长度、特征维数、距离度量、判别阈值、网络层数与节点数等参数，并针对人工数据和自然数据的分布差异调整分类规则→求解→计算各序列的特征向量或几何轨迹，训练或构造分类器，输出类别标签，必要时融合多个模型的判别结果→验证→分别在人工数据与自然数据上统计分类正确率，比较不同特征、不同分类器及修正前后结果，检验模型的泛化能力和稳定性。
  validation: 采用分层次对照验证：首先在结构较清晰、类别已知的人工序列上检查特征和算法能否正确区分样本；随后在182条长度更长、来源更复杂的自然序列上进行外部效果检验，并以分类正确率评价模型。进一步比较单碱基特征与多字符特征、欧氏距离与马氏距离、线性判别与神经网络、训练依赖方法与几何无训练方法的结果；同时分析人工数据与自然数据在样本数、序列长度和生物来源上的差异，避免仅以人工数据上的高准确率证明模型有效。
  visualization:
  - A、T、C、G碱基丰度柱状图
  - 多字符片段频率热力图
  - 特征重要性排序图
  - 二维或三维特征散点分类图
  - 聚类树状图
  - DNA序列几何轨迹图或Z曲线图
  - 不同模型分类正确率对比柱状图
  - 分类混淆矩阵
  pitfalls_avoided:
  - 避免只使用A、T、C、G单碱基频率处理全部数据，因为该特征忽略字符顺序和局部关联，虽然对人工序列可能有效，但对复杂自然序列的区分能力通常不足。
  - 避免把人工序列与自然序列不加区别地套入同一统计规则，因为人工样本仅约20个且序列较短，而自然数据有182条且长度更大，两类数据存在明显的样本规模、长度和来源分布差异。
  - 避免直接将小样本中估计出的统计规律外推到大规模自然样本，因为参数估计容易不稳定，并可能造成显著的泛化误差，应针对自然数据修正特征归一化、阈值或分类方法。
  - 避免将题目中的“结构”机械限定为编码区与非编码区，因为题目所指结构还包括碱基丰度、局部片段、长程相关性等多种规律，过窄的生物学假设会限制模型的适用范围。
  - 避免只使用不重叠三联子作为唯一特征，因为未知阅读框起点会使三联子划分产生偏移，导致同一序列在不同起始位置下得到不同特征和不稳定结果。
  - 避免在引入高阶字符串特征后保留全部变量，因为片段长度增加会使特征维数指数增长，引发计算复杂度上升、样本稀疏和过拟合，必须进行特征筛选与重要性排序。
  - 避免未经修正地套用通用聚类或判别算法，因为DNA序列长度不一致、特征相关且尺度不同，直接计算距离可能失真，应采用频率归一化、马氏距离或更适合非线性关系的分类器。
  - 避免过度依赖复杂生物学背景而忽视题目给出的实际数据，因为竞赛问题是对真实基因组问题的适度抽象，模型应首先由数据支持，而不能把未经验证的生物学设想当作确定条件。
  innovation_points:
  - 将传统的“特征提取—分类”框架扩展为多尺度特征体系，同时利用单碱基丰度、局部字符串频率、信息熵和几何结构刻画DNA序列。
  - 把DNA序列视为信息流，通过字符分布变化导致的信息熵变化识别隐藏结构，并融合多个模型构造综合判别目标函数。
  - 将DNA字符串类比为自然语言文本，引入关键词筛选、优选法和层次分类思想，从高辨识度局部片段中提取类别信息。
  - 采用几何映射或Z曲线把符号序列转换为可计算、可视化的轨迹，使碱基组成与排列顺序同时得到表达。
  - 构造不依赖或较少依赖训练集的几何分类方法，降低小样本人工序列与大规模自然序列分布不一致带来的泛化风险。
  - 根据人工数据和自然数据的规模、长度及来源差异动态调整分类策略，而不是强求单一模型无差别处理全部数据。
- id: B题优秀论文_公交车调度优化模型
  source_paper: B题优秀论文 B题优秀论文_公交车调度优化模型
  problem_type: 统计分析+优化+综合评价+仿真
  keywords:
  - 公交车调度
  - 时空客流不均衡
  - 目标规划
  context: 基于某公交线路各时段、各站点上下行客流数据，在兼顾乘客候车与拥挤感受以及公交公司运营效益的条件下制定全天发车时刻表并确定最少配车数。
  models:
  - name: 客流时空特征统计模型
    role: 计算分时段客运量、时间不均匀系数、线路断面客流量和高峰站点，并划分高峰、平峰与低峰时段。
    why: 原始数据是分时段、分站点、分方向的上下车人数，必须先转化为能够反映时间波动和空间断面拥挤程度的调度参数。
  - name: 公交运行参数计算模型
    role: 根据周转时间、计划载客量、满载率、客流量和周转系数确定各时段行车频率、配车数、正班车数、加班车数及发车间隔。
    why: 客流需求不能直接转化为时刻表，需要通过车辆容量和线路周转能力建立客流需求与车辆供给之间的数量关系。
  - name: 整数化行车间隔分配模型
    role: 将非整数行车间隔分解为相邻的两个整数间隔，并计算采用两种间隔的车辆班次数。
    why: 理论计算得到的发车间隔可能包含小数分钟，而实际调度需要精确到分钟且便于司机和调度人员执行。
  - name: 目标规划时刻表优化模型
    role: 以车辆尽可能晚出车、尽可能早收车为目标，在满足半程运行时间、相邻班次间隔和运营时间范围等约束下生成双向发车时刻表。
    why: 该模型能够把乘客服务约束与公交公司缩短车辆及人员在岗时间的经营目标统一到同一优化框架中。
  - name: 乘客—公交公司满意度评价模型
    role: 分别以车辆超过额定载客量的程度和低于收益载客量的程度度量乘客与公交公司的不满意度，并据此评价调度方案。
    why: 仅以车辆数或运行时间评价方案会忽略利益冲突，双主体指标可以同时刻画拥挤服务水平和运营经济性。
  - name: 计算机模拟与迭代调整模型
    role: 对初始运行参数和时刻表进行循环计算、可行性检查及微调，直至各项运行要求得到满足。
    why: 时刻变量数量多、约束具有离散性且整体模型非线性，直接解析求解困难，采用程序模拟和人工微调更具可操作性。
  solution_flow: 数据→汇总各时段、各站点和上下行方向的上下车人数，计算时段客运量与线路断面客流→利用时间不均匀系数识别高峰、平峰和低峰时段及高峰站点→结合线路里程、平均速度、调度时间、车辆容量和满载率确定周转时间、行车频率、分时段配车数及正班和加班车数→按候车时间上限计算发车间隔，并将小数间隔整数化分配→构建以晚出车、早收车和缩短在岗运行时间为目标的时刻表目标规划模型→通过计算机模拟并从高峰时段向前后推算生成双向发车时刻表→检查运行时间、班次间隔、载客水平和车辆衔接约束→计算乘客与公交公司的满意度并评价方案，最终得到最少约42辆车的调度结果。
  validation: 采用约束可行性检验与结果指标评价相结合的策略：检查高峰期发车间隔不超过5分钟、其他时段不超过10分钟，相邻班次采用整数化后的允许间隔，车辆往返衔接符合分时段周转时间，发车时刻处于运营时间范围；再根据各时段平均载客量计算乘客拥挤不满意度和公交公司收益不足不满意度，并通过程序循环调整参数和时刻表。论文给出的方案得到乘客不满意度0.32、公交公司不满意度0.54，即相应满意度约为0.68和0.46，但对50%最低满载率与120%最高满载率的差异约束验证仍不充分。
  visualization:
  - 分时段客流量与时间不均匀系数折线图
  - 高峰站点断面客流分布图
  - 双向公交发车时刻表
  - 车辆班次运行甘特图
  - 参数迭代求解流程图
  - 乘客与公交公司满意度对比图
  pitfalls_avoided:
  - 避免只按平均客流连续、均匀发车，因为客流在时间和空间上均不均衡，平均化处理会造成高峰运力不足而低峰车辆闲置。
  - 避免直接使用各站上车总人数确定班次，因为车辆是否拥挤取决于沿线累计上车减累计下车形成的最大断面客流，而不是单站上车量。
  - 避免将理论小数发车间隔直接写入时刻表，因为实际运营通常按整分钟执行；通过相邻整数间隔组合可保持总班次数并提高可操作性。
  - 避免仅以减少车辆数或运行时间作为单一评价标准，因为这可能牺牲乘客候车和拥挤体验；模型同时设置候车间隔、载客水平及双主体满意度指标。
  - 避免一次计算后直接定案，因为周转时间、频率、配车数和班次衔接彼此影响；采用参数回退、循环调整和人工微调可减少不可行班次。
  - 避免在随机因素缺乏可靠数据时建立过度复杂模型，通过假设准点到达、同车型、全程正班和终点对开控制模型规模，但这也限定了模型的适用范围。
  innovation_points:
  - 将客流时间不均匀性与线路空间断面不均匀性同时纳入公交车辆调度，实现高峰多车、低峰少车以及车辆有早出、有晚出的差异化安排。
  - 以每辆车首次出车和末次收车时刻构造目标函数，使车辆尽可能晚出、早收，从而间接压缩车辆及驾驶人员的在岗待命时间。
  - 设计双主体满意度指标，分别以超额载客造成的拥挤和低于收益载客量造成的经济损失评价乘客与公交公司的利益。
  - 将连续计算得到的行车间隔转化为两个相邻整数间隔的组合，在保持需求班次数的同时增强时刻表的实际执行性。
  - 采用从高峰时段向前后推算并结合计算机模拟和人工微调的求解方式，以应对高维、离散和非线性的时刻表编制问题。
- id: A题优秀论文_血管切片的三维重建
  source_paper: A题优秀论文 A题优秀论文_血管切片的三维重建
  problem_type: 仿真+统计分析
  keywords:
  - 血管三维重建
  - 平行切线与中轴线提取
  - 多项式拟合
  context: 根据100张等间距二维血管切片，在固定半径球沿光滑中轴线滚动形成管壁的假设下，估计血管中轴线和半径并重建三维血管。
  models:
  - name: 固定半径球滚动包络模型
    role: 描述血管的三维几何结构，并依据拟合中轴线和估计半径生成重建血管。
    why: 该模型能将复杂血管表面简化为中轴线与固定半径两个核心要素，且曲率半径大于管道半径时可避免局部包络退化。
  - name: 平行切线中点定理模型
    role: 确定每张切片中中轴线交点的候选位置及对应直径端点。
    why: 在模型假设下，中轴线与切片的交点必为一条边界弦的中点，且弦两端边界切线平行，为二维切片反推三维中轴线提供了几何依据。
  - name: 离散边界最大最小距离算法
    role: 以截面上、下弧之间的最大最短距离估计管道直径，替代难以直接计算的边界切线。
    why: 图像边界由离散像素构成，局部切线估计不稳定；最大最小距离方法只依赖点间距离，便于编程且对像素离散误差更稳健。
  - name: 候选中心聚集度筛选模型
    role: 当一个截面存在多个可能中心时，选择到其他候选点距离总和最小的点作为中轴线交点。
    why: 平行切线中点条件只是必要条件，可能产生多个候选解；距离总和最小准则可选出位于候选点集中区域的代表性中心。
  - name: 相邻切片递推跟踪模型
    role: 从第99层开始，利用相邻切片中心和直径端点变化较小的性质，逐层限制搜索区域并提取全部100个中心点。
    why: 切片间距小且中轴线充分光滑，相邻截面的几何位置连续，局部搜索能够降低错误匹配概率和整体计算量。
  - name: 参数多项式拟合模型
    role: 将100个离散中轴点拟合为空间参数曲线，其中z(t)=t，分别对x(t)和y(t)进行多项式拟合。
    why: 切片层号天然可作为参数，多项式可平滑离散点并提供显式、可计算的中轴线方程，便于球滚动包络仿真和任意平面截取。
  solution_flow: 数据：读取100张位于z=0至99的切片边界点，并将每条边界划分为上弧和下弧；模型：基于固定半径球滚动包络假设和平行切线中点定理，将中心提取转化为两弧间的离散距离搜索；参数：先在z=99截面计算直径和中心，再利用相邻切片连续性逐层递推获得100个中心点与直径，取直径均值59.1238
    pixel，得到半径R=29.5619 pixel；求解：令z(t)=t，分别以七次和六次多项式拟合x(t)、y(t)，再令半径为R的球沿拟合曲线滚动生成三维血管；验证：重新截取重建血管并与原切片进行面积、位置和随机投点三类比较。
  validation: 采用三重验证策略：第一，将重建血管在z=30至69的40个平面上重新截取，以交集面积除以并集面积计算截面面积重合率，平均达到96.8024%；第二，分别计算原截面与重建截面边界点坐标均值所定义的“重心”，其平均偏移量为3.35722
    pixel；第三，将球与目标平面相交的参数区间等分为240段，在所得圆周上按半径比例随机抽取7200个点，统计投点落入原截面的比例，平均超过94%，从形状重合、位置偏差和随机覆盖三个角度交叉检验模型。
  visualization:
  - 100张切片叠加形成的XOY平面投影图
  - 平行切线与直径中点几何示意图
  - 中轴线折线和多项式拟合曲线在XOY、YOZ、XOZ平面上的投影对比图
  - 原始截面与重建截面的叠加重合图
  - 三维球滚动包络血管重建图
  pitfalls_avoided:
  - 避免直接对像素化边界求精确切线：离散边界不光滑，数值微分会放大像素噪声，因此改用两弧间最大最短距离估计直径。
  - 避免将平行切线中点条件误当作充分条件：单张截面可能出现多个候选中心，因此使用候选点到其余候选点距离总和最小的聚集度准则消除多解。
  - 避免对每张切片进行无约束全局搜索：利用中轴线光滑和相邻切片间距小的性质，以前一层端点附近的局部弧段限定下一层搜索范围，从而减少计算量并降低跳点风险。
  - 避免仅用高阶多项式拟合残差评价重建质量：点拟合良好并不必然意味着管道截面吻合，因此通过截面交并比、重心偏移和随机投点进行几何层面的多指标验证。
  - 避免忽略球滚动包络的几何可行性：明确假设中轴线曲率半径大于管道半径，以减少球包络发生自交或局部退化的风险。
  innovation_points:
  - 证明并利用“中轴线截点是平行切线对应边界弦中点”的几何定理，将三维血管中轴线识别转化为二维切片边界上的可计算问题。
  - 针对离散图像无法稳定作切线的困难，以最大最短距离算法构造可编程的改进切线法，在计算精度和运算量之间取得平衡。
  - 将相邻切片的空间连续性引入逐层递推搜索，实现中轴线点和直径端点的稳定跟踪。
  - 采用面积重合率、重心偏移量和随机投点比例三种互补指标进行模型检验，增强了重建结果的可信度。
- id: B题_一类运输问题的建模
  source_paper: B题 B题_一类运输问题的建模
  problem_type: 优化
  keywords:
  - 钢管订购与运输
  - 网络最短路
  - 混合整数二次规划
  - 分支定界
  - 运输问题
  context: 在钢厂产能、最低订购量和铁路—公路分段计价等约束下，为线形或树形天然气管网制定总采购与运输费用最小的钢管供应方案。
  models:
  - name: 铁路—公路网络最短路模型
    role: 预处理各钢厂到管网节点的单位最低运输费用，并形成后续优化模型的费用系数。
    why: 钢管从钢厂到施工点需经过铁路和公路网络，先分别按照不同运输方式的计价规则求最短路径和最低运费，可将复杂路径选择压缩为钢厂—管网节点之间的费用矩阵。
  - name: 树形管网网络流二次规划模型
    role: 联合决定各钢厂向各管网节点的供货量，以及每条管段从两端分别配送的长度。
    why: 管段内逐公里配送产生等差累加运费，费用可表示为关于配送长度的凸二次函数；节点流量平衡、管段覆盖和钢厂产能约束则可统一表示为网络流约束，且模型同时适用于线形管道和树形管网。
  - name: 混合0-1规划与分支定界模型
    role: 处理钢厂总订购量必须为0或处于最低订购量与产能上限之间的非凸约束。
    why: 最低起订量约束是互斥条件，不能用普通连续约束准确表达；引入钢厂启用变量，或将每个钢厂分支为“不采购”和“采购不少于500单位”，即可利用二次规划松弛给出下界并剪枝求得全局最优解。
  - name: 逐公里离散化线性运输模型
    role: 将每公里管段视为一个需求点，直接确定每个单位管段由哪家钢厂供应，作为二次规划模型的等价或替代建模方案。
    why: 预先计算钢厂供应每个单位管段的最低综合费用后，目标函数和供需约束均为线性形式；松弛子问题具有标准运输问题结构，可利用运输问题的整数性和表上作业法降低求解难度。
  - name: 参数扰动敏感性分析
    role: 评估钢厂销售价格和产能上限变化对钢厂选择、订购量及最小总费用的影响。
    why: 最优方案可能在价格或产能跨越临界值时发生结构性切换，逐项扰动参数能够识别对采购运输方案影响最大的钢厂及参数阈值。
  solution_flow: 整理钢厂价格、产能、最低订购量、铁路与公路里程及运价数据→构建铁路和公路网络并用最短路算法计算钢厂到各管网节点的最低单位运费→设置节点供货量和管段双向配送长度变量，建立采购费用、干线运输费用与管段内二次配送费用之和最小的网络流模型→加入节点流量平衡、每条管段完全覆盖、非负性、产能及最低起订量约束→对最低起订量约束进行0-1化或分支，将节点松弛为标准凸二次规划并通过分支定界求解→以逐公里离散化的线性运输模型或启发式调整方法进行交叉求解→检查供需平衡、产能和起订量可行性，并通过价格与产能扰动分析方案稳定性。
  validation: 首先核验每条管段两端配送长度之和等于管段长度、各节点到货量等于其向相邻管段的配送量，并检查每个启用钢厂满足最低订购量和产能上限；其次比较树形网络流二次规划与逐公里离散化线性模型的钢厂选择、分配结果及总费用；对不足1公里按1公里计费导致的连续松弛误差进行理论估计，单个非整数分界点的费用低估不超过0.025万元，并可将分界点取整复算真实费用；最后扰动钢厂价格和产能，观察最优值及订购方案是否在临界参数处发生切换，以检验稳定性和敏感性。
  visualization:
  - 铁路—公路—管网拓扑图及最短运输路径图
  - 各管段供货来源与双向配送分界示意图
  - 钢厂订购量与产能上限对比柱状图
  - 钢厂价格或产能扰动下总费用及方案切换的敏感性曲线
  pitfalls_avoided:
  - 避免直接按总里程统一计算运费，因为铁路与公路的计价规则不同，必须分别求铁路最短路并叠加公路费用，否则得到的费用矩阵并不代表真实最低运输成本。
  - 避免用0≤订购量≤产能上限替代“订购量为0或不少于最低起订量”的约束，因为这种连续松弛会产生0到500之间的不可执行采购方案；应通过0-1启用变量或分支定界恢复原约束。
  - 避免机械地强制所有管段配送长度为整数而显著增加计算复杂度，因为在两端边际成本相等时，非整数分界与相邻整数分界具有相同实际最优性；只需对连续二次表达造成的微小费用低估进行取整复算和误差修正。
  - 避免将不足1公里按1公里计费直接替换为连续里程计费后仍沿用原最优费用，因为用平方积分形式替代离散累加形式虽然不改变最优配送方案，但会使总费用系统性减少0.05倍的管道总长度。
  - 避免只对每个单位管段选择当前费用最低的钢厂后便宣称全局最优，因为最低起订量和产能上限会耦合不同管段的选择；初始贪心分配后必须按最小增量费用原则调整，或使用分支定界精确求解。
  innovation_points:
  - 将运输费用拆分为钢厂到管网节点的网络最短路费用和管段内部双向配送费用，使铁路—公路复合运输与树形管网覆盖能够在统一框架下优化。
  - 利用管段内逐公里运费的等差累加结构，把空间配送成本转化为凸二次函数，并通过节点流量平衡将线形管道模型自然推广到树形管网。
  - 针对最低起订量构造二次规划松弛与分支定界框架，既保持了连续凸子问题易求解的优势，又能保证钢厂启用决策满足离散业务规则。
  - 提出逐公里离散化的线性运输等价模型，利用运输问题的整数性使0-1分配变量可由线性松弛自动获得，并可与二次规划结果交叉验证。
  - 对整数里程计价、连续松弛误差和最优解不唯一现象进行定量分析，区分了方案最优性与目标值计算偏差。
- id: B题_一类运输问题的建模1
  source_paper: B题 B题_一类运输问题的建模1
  problem_type: 优化
  keywords:
  - 钢管订购与运输
  - 网络最短路
  - 混合整数规划
  - 二次规划
  - 分支定界
  context: 在钢厂产量、最低订购量及铁路和公路分段运价约束下，为线形或树形输气管网制定总采购费用与运输费用最小的钢管订购运输方案。
  models:
  - name: 网络最短路模型
    role: 计算各钢厂经铁路和公路到各管网结点的单位最低运输费用，形成后续优化模型的费用系数。
    why: 钢厂、车站和管网结点及其连接线路天然构成加权网络，运输路径费用的预处理可转化为Dijkstra算法等最短路问题。
  - name: 凸二次规划模型
    role: 以钢厂到管网结点的运量和各管段从两端配送的长度为决策变量，联合优化采购分配与管内公路配送。
    why: 沿管段逐公里配送的累计运费呈等差求和结构，可表示为关于配送长度的二次函数；结点流量平衡、管段覆盖和产能约束则可线性表达。
  - name: 混合0-1规划与分支定界模型
    role: 处理钢厂订购量必须为零或处于最低订购量与产量上限之间的非连续约束。
    why: 最低起订量约束无法直接写成普通连续规划约束，引入是否启用钢厂的0-1变量，或对“不订购”和“至少订购500单位”两种情形分支，可获得全局最优解。
  - name: 公里离散化线性运输模型
    role: 将管网划分为逐公里需求段，用0-1变量决定每段钢管的供应钢厂，作为二次规划模型的等价或替代建模方式。
    why: 每公里管段需求固定为一个单位，钢厂到每段的最低综合费用可预先计算，使问题转化为带产能和最低订购量约束的线性运输问题；其松弛子问题具有整数最优解，可用表上作业法求解。
  - name: 启发式调整与遗传算法
    role: 为大规模公里离散模型提供快速可行解：先逐段选择最低费用钢厂，再以最小增量费用原则调整至满足订购约束，也可对0-1供应序列进行遗传搜索。
    why: 逐公里离散后变量规模较大，但编码结构简单，启发式和遗传算法能够降低求解难度并为精确算法提供较好的初始上界。
  - name: 参数扰动敏感性分析
    role: 评估钢厂销售价格和产量上限变化对最优订购钢厂集合、运输方案及总费用的影响。
    why: 采购价格和产能可能改变钢厂启用状态并导致方案发生离散跃迁，仅报告单一最优方案不足以支持实际决策。
  solution_flow: 整理钢厂价格、产能、最低订购量及铁路和公路里程数据→构建铁路—公路—管网拓扑并用最短路算法计算钢厂到各管网结点的单位最低运价→定义结点运量和管段双向配送长度，建立含流量平衡、管段覆盖、产能及最低订购量约束的二次规划模型→将最低订购量条件写成0-1约束或采用分支定界，对各节点求解连续凸二次规划松弛→也可将管网逐公里离散，计算钢厂到每一公里管段的最低综合费用并求解线性运输模型→比较两类模型的订购量、配送边界和总费用→扰动钢厂销价及产量上限，重新优化并识别方案变化阈值。
  validation: 采用多层验证：检查每条管段从两端配送的长度之和是否等于管段长度、各管网结点输入量是否等于向相邻管段的输出量、钢厂订购量是否满足零订购或最低订购量至产能上限的条件；用公里离散线性模型与结点—管段二次模型交叉比较最优采购分配和总费用；对非整数配送边界分析不足1公里按1公里计价造成的误差，证明单条边最大偏差仅为0.025万元且不改变最优性；通过价格和产能参数扰动检验方案稳定性并确定最优钢厂组合发生改变的临界区间。
  visualization:
  - 铁路—公路—管网拓扑图及最短运输路径图
  - 各管段钢管供应来源分区图
  - 钢厂订购量与产能上限对比柱状图
  - 总费用随钢厂价格或产能变化的敏感性曲线
  pitfalls_avoided:
  - 避免直接按地理距离选择钢厂，因为铁路与公路采用不同的计价规则且可能存在多条联运路径；应先分交通方式计算最短路径及对应运价，再形成统一费用系数。
  - 避免把最低订购量误写成普通区间约束0至产能上限，因为这会允许订购量落在0与500之间并产生实际不可执行的伪最优解；应使用0-1启用变量或分支定界处理析取约束。
  - 避免遗漏管段两端均可供货的事实，因为强制所有钢管从单侧运输会高估公路运费；应设置两个方向的配送长度并令其和等于该管段长度。
  - 避免机械地强制所有配送长度为整数，因为连续松弛出现非整数边界时可能只是相邻两种整数配送方案费用相同；应分析不足1公里计价造成的误差后再取整，而不是无谓扩大整数规划规模。
  - 避免把逐公里累计运费简单当作线性费用，因为配送距离越远，新增一公里钢管的运输成本越高；精确表达应采用等差求和形成的二次项，或逐公里离散后分别计价。
  - 避免仅给出一个最优方案而不检验参数稳定性，因为钢厂价格或产能的小幅变化可能触发钢厂启用状态改变；应通过参数扰动识别方案跃迁和敏感钢厂。
  innovation_points:
  - 将钢厂至管网的长途联运成本与沿管段的短途配送成本分层处理，用网络最短路预处理费用系数，再以流量平衡和二次累计运费统一描述线形及树形管网。
  - 针对同一问题构造结点—管段二次规划和逐公里离散线性运输模型，两种建模视角可交叉验证，并可根据网络规模选择精确分支定界、表上作业法或启发式算法。
  - 对不足1公里按1公里计价引起的非整数最优解和目标值偏差进行定量分析，说明连续松弛的误差上界及其不改变最优方案的条件。
  - 利用问题松弛解中仅少数钢厂违反最低订购量约束的特点进行针对性分支，大幅减少理论上最多为2的钢厂数次方的子问题数量。
- id: B题_最佳灾情巡视路线的数学模型
  source_paper: B题 B题_最佳灾情巡视路线的数学模型
  problem_type: 优化
  keywords:
  - 加权网络图
  - 旅行商问题
  - 均衡分组与路径规划
  context: 针对灾情发生后多个巡视组从县政府出发、访问全部乡镇和村并返回的任务，设计兼顾总路程、完成时间和组间均衡性的巡视路线。
  models:
  - name: 加权网络图模型
    role: 将乡镇和村抽象为顶点、公路抽象为边，并以道路长度或行驶时间作为边权，形成巡视路线优化的基础模型。
    why: 灾情巡视本质上是在道路网络上访问指定节点的问题，图模型能够准确表达道路连通关系、重复经过路段以及距离和时间成本。
  - name: 最短路与度量闭包模型
    role: 计算任意两个巡视节点之间的最短路径，并据此构造以最短路长度为边权的加权完备图。
    why: 原公路网通常不是完备图，而旅行商算法需要处理节点间的直接转移成本；用最短路构造度量闭包可将最佳推销员回路等价转化为完备图上的最佳哈密尔顿圈问题。
  - name: 旅行商问题模型
    role: 在单个巡视组内部寻找从县政府出发、访问组内全部节点并返回的近似最短闭合路线。
    why: 每组都需访问指定节点并回到起点，目标是最小化路程或时间，与旅行商问题的结构一致；该问题属于NP困难问题，适合采用近似算法求解。
  - name: 多旅行商均衡分组模型
    role: 将全部巡视节点划分给多个巡视组，同时兼顾各组路线长度或完成时间的均衡以及总巡视成本最小。
    why: 多个巡视组的决策不仅包括各组内部路径，还包括节点分配；单纯分别求最短路无法保证总成本较小和组间工作量均衡。
  - name: 基于最短路树的启发式分区模型
    role: 以县政府为根构造最短路树，根据干枝邻接关系、长短枝搭配和停留时间进行初始分组，再通过节点转移微调分区。
    why: 直接枚举所有节点划分的计算规模过大，而保持同一干枝节点集中、合并相邻干枝可减少重复道路，长短枝搭配和停留时间约束又有助于改善均衡性。
  - name: 多起点二边交换近似算法
    role: 利用对角线完全法、随机搜索和人工构造等方式生成多个初始圈，再通过二边逐次修正法进行局部优化，选取其中权值最小的路线。
    why: 二边交换算法对初始解敏感，多种初始圈和随机搜索能够降低陷入较差局部最优解的风险，并在可接受计算量下获得较优路线。
  - name: 最小最大完成时间模型
    role: 在巡视组数量给定或人员充足时，以所有组完成时间的最大值为目标，确定最短总体完工时间和相应分组路线。
    why: 并行巡视的实际完成时刻由最慢巡视组决定，因此应优化最大组完成时间，而不是仅优化所有组时间之和。
  - name: 参数灵敏度分析模型
    role: 分析乡镇停留时间、村庄停留时间和车辆速度变化时，原均衡分组保持可行的参数范围。
    why: 实际停留时间和车速具有不确定性，通过均衡度与最大允许时间误差建立参数不等式，可检验方案的稳定性并给出可接受变化边界。
  solution_flow: 将乡镇、村、公路及其长度或时间整理为加权网络数据→计算节点间最短路并构造度量完备图→以最短路树干枝结构、空间邻接关系、路线长度和停留时间为依据进行初始分组→定义路线或完成时间均衡度并设定最大允许均衡度→对每组使用多初始圈与二边交换算法求近似最佳旅行商回路→依据均衡度转移部分节点并重复求解，得到总成本较小且均衡的方案→利用总停留时间和行驶时间下界判断最少巡视组数，并以最小最大完成时间组织并行巡视→通过全网近似最短回路对照、约束检查和参数灵敏度分析验证结果。
  validation: 首先利用总停留时间与不可避免的行驶时间建立巡视组数量下界，并检查所得组数是否能在规定时限内完成；其次将分组后各组路线长度之和与全网络单组近似最佳巡回长度进行比较，判断多组方案的额外路程是否合理；再次计算各组路线或总时间的实际均衡度，检验其是否低于最大允许均衡度，并逐项核查所有节点均被访问、每组均从指定点出发并返回且无漏点；最后使用多种初始圈重复运行局部搜索，比较所得解的一致性，并通过参数允许区间分析检验停留时间和车速变化下分组方案的稳健性。
  visualization:
  - 加权道路网络与巡视路线图
  - 以县政府为根的最短路树及干枝分组图
  - 各组路线长度、停留时间、行驶时间和总时间对比表
  - 参数变化允许区间表
  pitfalls_avoided:
  - 避免把原始稀疏公路网直接当作完备旅行商图，否则不存在道路直连的节点对无法定义转移成本；先以节点间最短路构造度量闭包，保证旅行商模型可求且能还原为实际道路路线。
  - 避免只最小化各组路线总和而忽视并行任务的最长完成时间，因为灾情巡视的整体完工时刻由最慢组决定；通过均衡度和最小最大目标约束组间差异。
  - 避免仅按地理位置或节点数量平均分组，因为不同节点的道路距离和停留时间并不相同，可能造成表面平均但实际工作量严重失衡；分组时同时考虑干枝结构、长短枝搭配及乡镇和村的停留时间。
  - 避免将单次二边交换结果直接视为全局最优，因为局部搜索高度依赖初始圈且旅行商问题为NP困难问题；采用人工构造、对角线完全法和随机搜索产生多个初始圈后择优。
  - 避免在判断最少巡视组数时只用总停留时间除以时限，因为这会漏掉往返道路所需的行驶时间；论文同时加入路程和车速形成的时间消耗，并对候选组数进行可行性检验。
  - 避免要求不同巡视组的实际道路轨迹完全互斥，因为返回县政府或通往偏远节点时可能不可避免地共用路段或经过其他节点；模型区分经过与停留，允许重复经过但不重复执行巡视任务。
  - 避免参数变化后仍默认原分组均衡，因为车速和不同类型节点的停留时间会改变各组总时间；通过参数不等式明确原分组保持均衡的允许范围。
  innovation_points:
  - 定义路线均衡度和时间均衡度，将“各组尽可能均衡”的定性要求转化为可计算、可设阈值的定量约束。
  - 利用以县政府为根的最短路树提取干枝，并提出同枝集中、邻枝合并、长短枝搭配和停留时间均衡等可操作的启发式分组准则。
  - 把多种初始圈生成方法与二边逐次修正法结合，缓解局部搜索对初始解敏感的问题，提高近似旅行商路线的质量。
  - 从最小最大完成时间角度处理多人并行巡视，并优先从距离起点较远、可选路线较少的节点开始分配，提高限时分组搜索的有效性。
  - 推导停留时间和车辆速度变化时保持原均衡分组的参数关系与允许区间，使路线方案不仅给出静态最优结果，还具备灵敏度和稳健性解释。
- id: A题 SARS的传播论文_SARS传播的数学原理及预测与控制
  source_paper: A题 SARS的传播论文 A题 SARS的传播论文_SARS传播的数学原理及预测与控制
  problem_type: 预测+优化+仿真+统计分析
  keywords:
  - SARS传播
  - 负反馈差分方程
  - 虚拟变量CAPM
  context: 基于北京等地区的疫情数据建立SARS传播预测与隔离政策仿真模型，并利用医疗板块股票数据分析SARS对医疗行业收益的影响。
  models:
  - name: 负反馈差分方程时间序列模型
    role: 描述累计确诊、疑似、死亡和治愈人数的动态演化，并预测疫情发展趋势。
    why: 社会防控力度和公众行为会随疫情严重程度动态调整，具有典型的负反馈特征，差分方程也适合处理按日统计的离散疫情数据。
  - name: 非线性最小二乘参数优化模型
    role: 以拟合值与实际累计确诊数据的残差平方和最小为目标，估计自然传播能力和防控反馈强度等参数。
    why: 模型参数难以直接观测，且传播过程具有非线性，因此采用MATLAB的fminsearch进行无约束数值优化能够从数据中识别参数。
  - name: 隔离政策情景仿真模型
    role: 模拟在不同基准日期提前或推迟5天实施隔离措施时，累计确诊人数和疫情曲线的变化。
    why: 政策实施时间难以通过现实对照实验评估，基于已标定的传播模型进行反事实仿真可以定量比较不同干预时点的效果。
  - name: 带虚拟变量的CAPM回归模型
    role: 控制市场系统性风险后，检验SARS事件是否给医疗行业带来显著的额外日收益。
    why: CAPM可分离市场收益因素，加入SARS事件虚拟变量后可利用OLS估计疫情冲击的方向、幅度及统计显著性。
  solution_flow: 收集北京、广州、山西和香港的逐日确诊、疑似、死亡、治愈数据以及17只医疗股票和深圳成指数据→根据疫情引发社会防控响应的机制构建负反馈差分方程，并构造等权医疗板块指数和带虚拟变量的CAPM→以累计确诊数据残差平方和最小为目标，使用fminsearch估计传播与反馈参数，以OLS估计CAPM系数→递推预测疫情曲线，仿真隔离政策提前或滞后5天的反事实情景，并检验虚拟变量系数→通过样本长度下标准差稳定性、预测值与实际值比较、跨地区拟合及回归显著性检验验证模型。
  validation: 首先逐步增加用于拟合的天数，观察预测误差标准差是否趋于稳定，并据此确定约25天的最低有效样本长度；其次将25天后预测结果与实际累计确诊、疑似和死亡数据比较；再次将同一方法迁移到广州、山西和香港进行跨地区外部验证；经济影响模型则通过虚拟变量系数的t检验、整体F检验和Durbin-Watson统计量检查影响显著性与残差自相关。
  visualization:
  - 实际值与预测值时间序列对比曲线
  - 误差标准差随样本天数变化曲线
  - 不同地区疫情拟合对比图
  - 隔离政策提前或滞后的多情景仿真曲线
  - 政策实施日期与累计确诊影响比值图
  pitfalls_avoided:
  - 避免仅用固定传染率进行长期外推，因为公众警惕程度和政府控制力度会随疫情变化；将传播率设为受病例规模影响的负反馈变量，以降低结构性预测偏差。
  - 避免在样本量不足时直接认定拟合可靠，因为少量数据可能造成参数不稳定；通过误差标准差随样本天数增加而趋稳来确定最低数据量。
  - 避免只在北京样本上评价模型而产生地域过拟合，通过广州、山西和香港数据进行跨区域验证。
  - 避免把医疗股上涨全部归因于SARS，因为同期市场整体波动也会影响收益；在CAPM中控制市场超额收益，并用事件虚拟变量识别疫情的增量影响。
  - 避免将疑似病例拟合偏差简单解释为模型失效，因为疑似病例认定具有较强主观性和口径变化风险；论文将其与较稳定的累计确诊、死亡序列分开评价。
  innovation_points:
  - 将电子线路中的负反馈思想迁移到传染病传播建模，用自然传播参数和防控反馈参数分别刻画疾病传播能力与社会控制能力。
  - 采用误差标准差趋于稳定作为训练数据量是否充足的判据，而非只报告单次拟合优度。
  - 利用已标定模型开展隔离政策提前或滞后5天的反事实仿真，量化政策时点的边际影响。
  - 构造17只股票的等权医疗板块指数，并在传统CAPM中加入SARS虚拟变量以识别疫情对行业收益的短期冲击。
- id: B题论文_2005年B_D题DVD在线租赁问题
  source_paper: B题论文 B题论文_2005年B_D题DVD在线租赁问题
  problem_type: 预测+优化+仿真+统计分析
  keywords:
  - 二项分布
  - 0-1整数规划
  - 贪婪算法
  - 随机模拟
  - 动态随机优化
  context: 针对在线DVD租赁网站，在会员需求和归还行为具有随机性的条件下，研究DVD需求预测、最小购买量确定、订单分配及动态库存决策问题。
  models:
  - name: 极大似然需求预测模型
    role: 根据抽样调查结果估计总体会员对各类DVD的需求人数。
    why: 样本中愿意观看某DVD的比例可视为总体偏好概率的观测值，利用极大似然估计能够将1000名会员的调查结果推广至10万名会员。
  - name: 基于二项分布的随机模拟模型
    role: 估计在给定服务周期和满足比例要求下，各种DVD的最小购买量。
    why: 会员属于月租两次或一次的类别具有随机性，DVD在月中和月末的返还与再分配也具有随机性，二项分布和蒙特卡洛模拟能够描述不同类别会员数量及服务覆盖率的波动。
  - name: 线性满意度量化模型
    role: 将会员对DVD的偏好顺序转化为可用于优化计算的满意度矩阵。
    why: 原始订单仅给出偏好排序，不能直接构造目标函数；采用线性级差赋值可保留偏好高低关系，并将未申报DVD的满意度设为0以区分喜欢与不喜欢。
  - name: DVD分配0-1整数规划模型
    role: 在库存约束和每名会员获得3张DVD的约束下，最大化所有会员的总满意度并得到精确分配方案。
    why: 每张DVD是否分配给某名会员是离散的二元决策，且分配数量受会员配额和各DVD库存限制，因此适合建立0-1整数规划。
  - name: 偏好优先贪婪分配算法
    role: 快速生成大规模订单下的近似最优DVD分配方案，并作为购买量搜索中的内嵌分配策略。
    why: 精确0-1规划在会员和DVD数量较大时计算代价高，按偏好等级逐层分配能优先满足高偏好需求，在显著降低计算时间的同时保持较高满意度。
  - name: 机会约束购买量模型
    role: 求解以需求量固定比例购买DVD时，使至少95%的会员满意这一事件以不低于99%概率发生的最小购买比例。
    why: 会员类别无法事先确定，满意人数是随机变量，单次确定性结果不能保证服务水平；机会约束能够同时表达满意率目标和置信度要求。
  - name: 单调随机搜索模型
    role: 通过逐步增加购买比例并重复随机仿真，寻找满足机会约束的最小购买比例。
    why: 服务达标概率随购买比例增加而单调不减，但其解析表达式难以获得，因此可利用单调性进行步进搜索，并通过重复模拟估计达标概率。
  - name: 带贴现因子的动态随机库存模型
    role: 综合当前购买成本、会员满意度带来的潜在收益、随机归还量和库存演化，制定多期DVD购买决策。
    why: DVD购买会影响后续多期库存和服务能力，且归还数量具有随机性；动态随机优化能够刻画库存状态转移及当前收益与未来收益之间的权衡。
  solution_flow: 数据：利用1000名会员的偏好样本和订单矩阵统计各DVD需求人数，并依据60%月租两次、40%月租一次的会员结构描述随机归还过程；模型：先用极大似然估计和二项分布模拟预测需求及最小购买量，再构造满意度矩阵和0-1规划完成精确分配，同时设计贪婪算法处理大规模订单，随后建立满足率为95%、置信度为99%的机会约束购买模型，最后扩展为多期动态随机库存模型；参数：由样本比例估计总体需求，设购买量与需求量的比例系数为决策参数，并将未申报DVD满意度设为0；求解：使用Matlab进行随机模拟和步长为0.01的单调搜索，使用Lingo求解0-1规划，每个候选购买比例重复模拟1000次，以至少990次达到950名满意会员为可行判据，得到购买比例约为0.32；验证：通过比例关系检验、重复仿真和精确算法与贪婪算法的结果对比评估模型稳定性与算法精度。
  validation: 首先比较不同DVD的需求人数与最小购买量，发现两者近似成正比，并建议使用F检验进一步验证比例关系；其次对每个购买比例独立随机生成会员类别并重复模拟1000次，以达标次数不少于990次检验99%置信水平下至少95%会员满意的机会约束；再次将贪婪算法总满意度37519与0-1规划精确最优值39681比较，近似解仅低5.45%，并通过改变初始库存进行多轮对比，验证贪婪策略的精度和稳定性。
  visualization:
  - 需求人数与最小购买量对比表
  - 最小购买量—需求人数散点图及比例拟合线
  - 购买比例—服务达标概率曲线
  - 0-1规划与贪婪算法满意度对比柱状图
  - 多期库存量、购买量与归还量变化折线图
  pitfalls_avoided:
  - 避免直接把1000名样本人数当作全部会员需求量，而是先用样本偏好比例进行极大似然估计并映射到10万名会员，否则会系统性低估购买规模。
  - 避免忽略两类会员归还周期不同的问题，将月租两次会员与月租一次会员分别建模，并限定月中仅回收和再分配前一类会员的DVD，否则会高估月中可用库存和周转能力。
  - 避免直接用偏好名次作为无差别类别标签，而是构造有序满意度数值并将未申报DVD设为0，否则无法建立可计算的总满意度目标，也可能把不喜欢的DVD错误视为低偏好DVD。
  - 避免只追求总满意度而遗漏库存与会员配额约束，在0-1规划中同时限制每种DVD的分配量不超过库存、每名会员获得3张DVD，否则所得方案在实际运营中不可执行。
  - 避免在大规模订单中反复求解复杂0-1规划，将经过精确模型对照验证的贪婪算法用于随机搜索中的重复分配，否则1000次以上的仿真会产生过高计算成本。
  - 避免用一次随机分配结果判断购买量是否充足，采用1000次重复模拟并设置990次达标的统计判据，否则购买决策容易受到单次随机会员结构的偶然影响。
  - 避免仅检查会员是否得到部分喜欢的DVD，明确规定A类会员两次共获得6张满意DVD、B类会员获得3张满意DVD才计为满意，否则会放宽服务标准并低估购买量。
  - 避免只考虑当期购买成本和满意度，扩展模型通过库存状态方程和贴现效用纳入未来归还量及潜在收益，否则短期最优购买决策可能损害长期经营效果。
  innovation_points:
  - 发现并利用最小购买量与DVD需求量近似成正比的规律，将高维逐品种购买决策简化为单一购买比例参数的搜索问题。
  - 把会员偏好排序转化为满意度矩阵，并将顾客满意最大化的业务目标转化为可精确求解的0-1整数规划。
  - 设计按偏好等级逐层分配的贪婪算法，并用整数规划最优解量化其误差，实现分配质量与实时计算效率的平衡。
  - 将贪婪分配算法嵌入蒙特卡洛机会约束搜索，在会员类别随机的情况下联合确定购买量和分配策略。
  - 通过缩短决策周期、随机化会员归还量并引入贴现因子，将静态单月模型扩展为考虑库存演化和长期收益的动态随机决策模型。
- id: B题_钢管的订购和运输解答模型
  source_paper: B题 B题_钢管的订购和运输解答模型
  problem_type: 优化
  keywords:
  - 运输问题
  - 非线性最小费用流
  - 分支定界
  context: 在钢厂产能及最低开工产量约束下，联合确定钢管订购量、工厂至管线关节点的运输量和沿线铺设分配量，使生产、运输与铺设总费用最小。
  models:
  - name: 最短路径预处理模型
    role: 将铁路、公路混合运输网络压缩为各钢厂到各管线关节点的单位最小运输费用矩阵SAP。
    why: 工厂到关节点的运输费用具有可叠加性，可先独立求最小费用路径；通过将铁路距离按分段运价转换为费用并与公路费用合并，可消除运输方式和路径细节，降低后续优化规模。
  - name: 线性费用流网络模型一
    role: 把每单位长度钢管设置为独立需求节点，将生产、运输和沿管线铺设统一表示为最小费用最大流问题。
    why: 铺设费用可通过单位容量、边际费用依次为1至管段长度的平行边线性化，能够直接使用标准最小费用最大流算法，并作为直观的基础模型。
  - name: 改进的线性费用流网络模型二
    role: 合并同一管段内的单位需求节点，在保持线性费用表达的同时减少网络节点数。
    why: 基础模型的节点数随管道总长度增长，计算复杂度约为O(Tl^4)；节点合并可将节点规模降至工厂数、关节点数和管段数的量级，提高求解效率。
  - name: 非线性费用流网络模型
    role: 直接用流量的凸二次函数q(q+1)/2表示钢管从管段端点向铺设位置运输的累计费用。
    why: 该模型避免为每一单位长度建立节点或平行边，在保留真实铺设费用结构的同时显著压缩网络规模；凸递增边际费用也适合采用逐单位增广的最小费用流方法。
  - name: 边际费用增广算法
    role: 求解含凸非线性费用边的最小费用流网络。
    why: 标准最小费用路算法要求固定单位费用，而非线性边不存在固定单价；以正向增流的上边际费用和反向减流的下边际费用构造增量网络，可将每次增广转化为当前边际成本下的最短路问题。
  - name: 有上下限的网络流变换模型
    role: 处理给定工厂生产区间[Low_i, High_i]时的最低产量约束。
    why: 通过增加虚拟节点和固定下限流量，将带下限的产量边转换为普通容量边，并在目标值中补加最低产量对应的生产费用，从而复用非线性最小费用流算法。
  - name: 分支定界模型
    role: 处理工厂产量属于半连续集合{0}∪[500,L_i]的开工决策。
    why: 产量为零或不低于500的约束是非凸析取约束，不能由单一区间网络流直接表达；对落入(0,500)的松弛解分别建立停产分支和开工分支，并利用松弛目标值剪枝，可获得全局最优可行方案。
  solution_flow: 数据→整理钢厂单价、产能、铁路和公路里程、铁路分段运价及各管段长度→分别计算铁路最短距离并转换为费用，再与公路费用网络合并→再次运行最短路径算法得到钢厂至关节点的最小单位运费矩阵SAP→建立包含生产、干线运输和沿线铺设费用的非线性最小费用流模型→通过虚拟节点设置各工厂产量上下限→采用上下边际费用构造增量网络并逐次求最小费用增广路→对产量落入(0,500)的工厂实施停产或至少生产500的分支定界搜索→比较节点下界与当前最优可行费用并剪枝→输出最优生产量、运输量、铺设分配量和总费用→通过约束核验、算法正确性论证及复杂度分析验证结果。
  validation: 首先检查总生产与管道总需求的流量平衡、各工厂产能限制、管段两端供给量之和等于管段长度，以及每个工厂产量满足0或不少于500；其次利用凸费用边的上下边际费用证明增量网络中的最短增广路保持最小费用性质；再以分支节点的松弛最优值作为下界，与当前最优可行解比较实施安全剪枝；最后对不同网络建模方式的目标值与方案进行一致性或可行性核对，并通过O(V^3Tl)至O(V^3Tl2^n)的复杂度分析确认方法适用于给定数据规模。
  visualization:
  - 钢厂—关节点—管段—汇点的分层网络流图
  - 钢厂到关节点的最小运输费用矩阵热力图
  - 分支定界搜索树
  - 各钢厂最优产量柱状图
  - 管段两端供给量堆叠图
  pitfalls_avoided:
  - 避免直接在原铁路、公路混合网络上同时优化生产和运输，因为运输方式、节点与路径细节会造成模型规模膨胀；先用最短路径生成SAP费用矩阵可将路径选择压缩为供需点间单价。
  - 避免把铁路运费误设为与距离成线性关系，因为铁路采用分段运价；先求铁路最短距离，再按运价表映射为费用，才能正确比较铁路与公路方案。
  - 避免仅比较钢厂到关节点的直达铁路费用和直达公路费用，因为最优运输路线可能由铁路与公路多次衔接组成；将铁路最小费用边嵌入公路费用图后再次求最短路，可覆盖混合运输路径。
  - 避免为每公里钢管建立独立节点导致约5000个节点和O(Tl^4)级计算量；通过管段节点合并和凸非线性费用函数将网络规模降至与工厂数、关节点数和管段数相关。
  - 避免对q(q+1)/2型铺设费用使用固定单位费用，因为其边际成本随流量变化；正向边采用上边际费用、反向边采用下边际费用，才能正确构造残量网络。
  - 避免把产量约束{0}∪[500,L_i]错误放松为[0,L_i]后直接接受结果，因为可能出现0到500之间的不合法产量；分支为停产和至少生产500两种情形才能恢复可行性。
  - 避免在分支定界中仅凭启发式方案删除节点，因为这可能丢失全局最优解；必须以松弛问题的最优费用作为下界，只有下界不优于当前最优值时才剪枝。
  - 避免遗漏最低产量对应的生产成本，因为带下限网络变换只对超过Low_i的部分计费；求得网络费用后需补加ΣLow_iR_i。
  innovation_points:
  - 采用两阶段网络压缩：先以最短路径把铁路、公路混合网络转化为钢厂—关节点运输价格表，再把逐公里铺设节点压缩为管段节点。
  - 将沿管线运输的累计费用表示为凸离散函数q(q+1)/2，以紧凑的非线性费用流替代大量单位容量平行边。
  - 把标准最小费用增广路算法推广到非线性费用网络，使用上下边际费用分别描述正向增流和反向退流。
  - 将带产量下限的网络流变换与分支定界结合，统一处理工厂的半连续开工约束{0}∪[500,L_i]。
  - 在同一网络中联合优化生产地点、生产数量、长途运输路径和管段两端铺设分配，避免将三个相互依赖的阶段割裂求解。
- id: B题_灾情巡视路线的设计
  source_paper: B题 B题_灾情巡视路线的设计
  problem_type: 优化
  keywords:
  - 灾情巡视路线
  - 多组车辆路径规划
  - 最小生成树
  - 最短路径
  - 启发式算法
  - 均衡优化
  context: 在公路网络上为多个巡视组设计覆盖全部乡镇和村庄的闭合巡视路线，并在总路程、完成时间、分组数量和组间均衡性等目标之间进行优化。
  models:
  - name: 加权图网络模型
    role: 将县城、乡镇和村庄表示为节点，将公路表示为带距离权重的边，形成整个路线优化问题的基础。
    why: 巡视对象和公路连接关系具有典型网络结构，图模型能够准确表达道路可达性、实际路程及路线覆盖约束。
  - name: 多旅行商问题模型
    role: 把多组巡视路线设计转化为从县城出发、覆盖全部节点并返回县城的多旅行商优化问题。
    why: 各巡视组均需访问分配给自己的节点并形成回路，该结构与多旅行商问题一致；同时该问题属于NP难问题，适合采用近似与启发式方法求较优解。
  - name: 最小生成树模型
    role: 计算覆盖全部节点所需总路程的下界，并为初始路线生成和区域划分提供骨架。
    why: 任何覆盖所有节点的巡视网络都不能短于公路图最小生成树的权重，因此最小生成树既能提供可比较的理论下界，也能生成总路程较短的初始结构。
  - name: 基于最小生成树的深度优先搜索初始路线模型
    role: 按照各组路程上下限在最小生成树上进行深度优先搜索，形成多条覆盖节点的初始巡视回路。
    why: 相较人工分区和逐步加入法，该方法能够利用最小生成树的低成本结构，通常可得到总路程更短、质量更稳定的启发式初始解。
  - name: Floyd全源最短路径模型
    role: 计算任意两个节点之间的最短路及各节点到县城的最短距离，为行驶时间计算和最短时间路线构造提供数据。
    why: 巡视组从一个村镇转移到另一个村镇时应沿实际公路最短路径行进，全源最短路径可以避免直接使用不可达的直线距离，并支持后续多次路径查询。
  - name: 距离均衡度模型
    role: 量化各巡视组路程之间的离散程度，并作为路线可行性判据和边界调整算法的终止条件。
    why: 仅最小化总路程可能导致少数组承担绝大部分任务，使用显式均衡指标可以把“各组路线尽量均衡”的定性要求转化为可计算约束。
  - name: 相对时间均衡度模型
    role: 综合各组行驶时间与乡镇、村庄巡视停留时间，衡量各组总作业时间的均衡性。
    why: 完成全部巡视的时间由最慢组决定，缩小各组总时间差异比单纯平衡行驶距离更能降低整体完工时间。
  - name: 边界调整启发式算法
    role: 在相邻区域之间转移边界节点，优先调整路程最长与最短的区域，直至满足距离均衡度要求。
    why: 局部调整边界节点可保持区域连通和路线基本结构，同时以较低计算代价改善多组路线的均衡性。
  - name: 转移点调整启发式算法
    role: 在固定分组数量下，从耗时较长的组向耗时较短的组转移少量节点，以降低最大巡视时间。
    why: 当初始方案中各组时间已经接近时，大规模重构容易增加总路程，而小范围节点转移能够精细改善最大完工时间。
  - name: 最短路调整启发式算法
    role: 从距县城最远的节点开始构造路线，在最短时间上限内沿返回路径或通过插入额外节点尽可能覆盖更多未巡视节点。
    why: 最远节点到县城的往返与巡视时间决定完工时间下界，以该下界为时间限制进行贪心插点，可以在保持最短时间的同时减少所需巡视组数。
  - name: 巡视时间等效路程模型
    role: 将乡镇和村庄的固定巡视停留时间按行驶速度折算为等效路程，统一计算路线成本。
    why: 将行驶时间和节点服务时间统一到同一量纲后，可直接使用路径算法比较包含不同类型节点的巡视路线。
  solution_flow: 数据→将县城、乡镇、村庄及公路整理为带权图，并录入节点类型、道路距离、行驶速度和巡视停留时间→用最小生成树计算总路程下界，用Floyd算法计算任意两点最短路径→预设巡视组数、距离或时间均衡阈值及单组时间上限→分别通过人工分区、逐步加入法和基于最小生成树的深度优先搜索生成初始路线，选择总路程较短的方案→针对总路程与距离均衡目标采用边界调整，针对最短完成时间采用转移点调整，针对最短时间下的最少组数采用最短路排序与贪心插点→计算各组路程、服务时间、总时间、总路程和均衡度→通过下界比较、可行性检查、分组数反证及参数敏感性分析验证方案。
  validation: 首先以最小生成树权重作为总路程理论下界，评价启发式路线与下界的差距；其次逐条检查所有乡镇和村庄是否被覆盖、路线是否沿公路连通、各组是否从县城出发并返回以及是否满足时间上限；再利用距离均衡度和相对时间均衡度检验组间负荷是否达到规定精度；对于限定时间问题，通过证明较少分组无法完成、同时构造更多分组的可行路线来确定最小组数；最后改变乡镇与村庄巡视时间、行驶速度和均衡阈值，观察最优路线是否变化，以进行敏感性和稳定性分析。
  visualization:
  - 公路网络与最小生成树叠加图
  - 分区着色的多组巡视路线图
  - 各组巡视路程与总时间对比柱状图
  - 启发式调整前后均衡度对比图
  - 参数变化下最大完工时间敏感性曲线
  pitfalls_avoided:
  - 避免直接追求多旅行商问题的精确全局最优；该问题属于NP难问题，节点较多时穷举不可行，因此采用高质量初始解与局部启发式调整。
  - 避免只最小化总路程而忽略组间负荷；总路程最短的极端方案可能让一组承担几乎全部任务，因此引入距离均衡度和时间均衡度作为约束与评价指标。
  - 避免用节点间直线距离代替实际公路距离；节点可能没有道路直接相连，使用Floyd最短路径才能反映真实可行的转移成本。
  - 避免只计算车辆行驶时间而遗漏乡镇和村庄的巡视停留时间；论文将不同节点的服务时间加入总耗时，并可按速度折算为等效路程。
  - 避免未经证明便认定某一分组数量可行或最优；通过证明三组无法满足时间限制并构造四组可行方案，确定满足约束的最少分组数。
  - 避免完全依赖人工分区造成初始解质量不稳定；同时比较直接判断法、逐步加入法和最小生成树深度优先搜索法，并选择总路程更短的初始方案。
  - 避免为改善局部均衡而导致路线反复振荡或搜索不终止；调整算法设置均衡精度、最大调整次数和状态回退规则。
  - 避免在最短时间问题中仅沿原最短路径返回而浪费剩余时间；改进算法允许插入满足时间上限的未访问节点，以减少完成任务所需的巡视组数。
  innovation_points:
  - 提出“初始可行路线生成＋针对性启发式调整”的两阶段建模框架，将复杂的多目标路线设计拆解为易实现的构造与优化过程。
  - 以最小生成树同时承担总路程下界估计和初始路线骨架生成两种功能，提高了初始解质量并为结果评价提供基准。
  - 定义距离均衡度和相对时间均衡度，把组间均衡这一主观要求转化为可计算、可设阈值的模型约束。
  - 针对不同决策目标分别设计边界调整、转移点调整和最短路调整规则，而不是用单一算法处理所有场景。
  - 将乡镇和村庄的巡视停留时间按行驶速度折算为等效路程，实现道路成本与节点服务成本的统一处理。
  - 以最远节点对应的最短服务时间作为整体完工时间下界，并在该时间上限内贪心插入节点，从而实现“最短时间下最少巡视组数”的二层优化。
  - 提出添加多个县城虚拟点、将多组路线问题转化为单路线问题的改进思路，为多旅行商问题提供了新的近似求解方向。
- id: 2020_B108
  source_paper: 2020 2020_B108
  problem_type: 统计分析
  keywords:
  - 重复水印文本
  - 有效信息缺失
  - 内容质量检测
  context: 所提供内容仅包含重复的微信公众号宣传水印，未出现论文题目、问题背景、数据、公式、模型或结论，因而无法提取实际建模背景。
  models:
  - name: 重复文本检测
    role: 识别并剔除高频重复的宣传水印，判断文本中是否存在有效论文内容。
    why: 原始材料由同一组宣传语大量重复构成，必须先进行去重和内容质量检查，才能避免将噪声误判为建模信息。
  - name: 有效信息完整性检验
    role: 检查文本是否包含问题描述、变量、数据、模型、求解结果和验证方法等建模要素。
    why: 去重后未发现任何论文正文或数学建模要素，因此不能可靠推断论文采用的核心模型。
  solution_flow: 原始文本→清洗微信公众号水印并去重→检测建模关键词与结构要素→确认有效论文内容缺失→停止模型、参数和求解流程推断→通过人工复核重复文本结果。
  validation: 对去重前后的文本进行频次统计和人工抽查，核验剩余内容是否含题目、数据、公式、模型名称、求解结果及误差分析；结果表明文本仅为重复宣传信息，无法开展模型有效性验证。
  visualization:
  - 重复文本词频柱状图
  - 文本信息完整性检查表
  pitfalls_avoided:
  - 避免根据水印内容臆造论文主题和问题类型，因为材料中没有任何可支持具体建模任务的正文证据
  - 避免虚构模型、参数、验证结果和创新点，因为这会将推测错误地表述为论文事实
  - 避免把高频出现的“数学模型”误认为具体模型名称，因为该词仅属于公众号宣传语而非论文方法
  innovation_points:
  - 采用先去重、再进行建模要素完整性检验的信息质量控制流程
  - 在原文证据不足时明确报告不可提取性，保证结构化建模知识的可追溯性与真实性
- id: B题优秀论文_2002年B题彩票方案的合理性优化
  source_paper: B题优秀论文 B题优秀论文_2002年B题彩票方案的合理性优化
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 模糊综合评判
  - 中奖概率
  - 奖金分配效用
  - 问卷赋权
  - 线性规划
  context: 针对29种彩票方案，从彩民吸引力、中奖概率、奖金分配效用和销售者利润等方面评价其合理性，并进一步优化奖项及奖金设置。
  models:
  - name: 多层次模糊综合评判模型
    role: 建立“合理度—彩民吸引力与销售者利润—中奖概率、奖金分配效用与单注期望收益—各级奖项”的层次评价体系，将彩票方案的合理性量化并排序。
    why: 彩票合理性受多个难以直接统一度量的因素共同影响，模糊综合评判能够通过分层、归一化和加权合成，将定性偏好与定量指标转化为可比较的综合得分。
  - name: 问卷调查与迭代赋权模型
    role: 根据100份问卷确定中奖概率、奖金分配效用、期望收益及不同奖级的重要性权重，并通过迭代获得稳定权值。
    why: 彩民对高额奖金、中奖频率和期望收益的偏好具有群体差异，采用调查数据赋权比研究者直接主观指定权重更有现实依据。
  - name: 古典概率与组合概率模型
    role: 分别计算传统型、n/m型、无特别号型和6+1/m型彩票中各奖项的单注中奖概率及总中奖率。
    why: 彩票摇奖属于有限等可能样本空间中的组合事件，可利用组合数和古典概率公式准确描述不同玩法的中奖机会。
  - name: 伯努利试验与期望奖金模型
    role: 将每张彩票是否中某奖视为伯努利试验，估计各奖项的期望中奖注数，并结合销售额、返奖率和奖级分配比例计算每注期望奖金。
    why: 在销量较大时，各奖项中奖注数可由二项分布描述，并可借助中心极限定理进行近似；使用期望中奖注数能够把中奖概率与实际奖金分摊联系起来。
  - name: 线性规划优化模型
    role: 以综合合理度最大化为目标，在返奖率、奖金总额和奖项设置等约束下寻找更优的奖金分配方案。
    why: 在权重和中奖概率给定后，合理度可表示为奖金配置变量的线性组合，相关资金与奖级约束也可线性化，适合使用线性规划和Lingo求解。
  - name: 权重敏感性与稳定性分析模型
    role: 设置冒险型、保守型彩民权重，并对奖级权重进行小幅扰动，比较方案得分和排序变化。
    why: 综合评价结果依赖偏好权重，敏感性分析能够检验优选方案是否稳健，并揭示不同彩民群体对奖级设置的差异化反应。
  solution_flow: 数据：整理29种彩票的玩法规则、奖项设置、销售额、返奖比例及100份彩民问卷；模型：构建多层次评价指标体系，利用组合概率计算各奖中奖率，以伯努利试验和期望值计算中奖注数及各级期望奖金；参数：由问卷均值和迭代确定各层权重，对中奖率、期望收益和奖金效用进行归一化；求解：加权合成各方案合理度并排序，筛选出方案26和27，再以合理度最大化建立线性规划优化奖项与奖金配置；验证：通过典型方案解释、冒险型与保守型情景比较以及权重微扰分析检验结果的合理性和稳定性。
  validation: 首先检查高合理度方案是否同时体现较高中奖率或较高额奖金，以进行结果解释；其次分别采用冒险型和保守型权重重新计算合理度，观察模型能否反映不同风险偏好；最后对奖级权重矩阵作小幅扰动，对比扰动前后的合理度曲线及方案排序，结果显示总体排序变化较小，说明模型具有一定稳定性。
  visualization:
  - 合理度层次结构图
  - 29种方案中奖率与合理度对比表
  - 不同风险偏好下的合理度对比表
  - 权重扰动前后合理度折线图
  pitfalls_avoided:
  - 避免完全凭研究者主观经验指定权重：通过100份问卷和迭代方法确定权值，使评价更能反映目标彩民群体的真实偏好。
  - 避免直接加总量纲不同的中奖率、奖金金额和期望收益：先对各奖项期望奖金等指标进行归一化，再实施加权综合，防止奖金数量级过大而支配最终得分。
  - 避免只依据一等奖金额评价彩票方案：同时纳入总中奖率、各级奖金分配效用和单注期望收益，减少单一指标造成的片面结论。
  - 避免将固定返奖率下的销售者利润重复作为变化指标：在返奖率固定为50%的比较条件下，将一级权重简化为彩民吸引力权重为1、销售者利润权重为0，防止常量指标干扰方案排序。
  - 避免仅报告单组权重下的最优结果：通过冒险型、保守型权重和小幅权重扰动开展敏感性分析，检验方案排序是否过度依赖特定偏好参数。
  - 避免混淆理想化评价与现实收益：明确说明基准模型暂不考虑奖池滚存、税收和销售成本，并指出万元以上奖金税后折算及滚存概率会改变实际效用。
  innovation_points:
  - 将彩票合理性分解为多层指标体系，把中奖概率、奖金分配效用、期望收益和发行方利益统一转化为可比较的综合合理度。
  - 采用问卷调查与迭代稳定化方法确定评价权重，减少传统层次评价中直接主观赋权带来的偏差。
  - 把组合中奖概率、伯努利期望中奖注数与奖金分配效用相连接，使彩票规则能够映射为彩民可感知的期望奖金指标。
  - 针对冒险型和保守型彩民构造不同权重情景，使同一评价框架能够刻画风险偏好异质性。
  - 在综合评价基础上进一步建立线性规划模型，实现由现有方案排序向新方案优化设计的扩展。
- id: B题优秀论文_公交车调度
  source_paper: B题优秀论文 B题优秀论文_公交车调度
  problem_type: 优化+统计分析
  keywords:
  - 公交车调度
  - 多目标非线性规划
  - 加权分析法
  context: 根据分时段、分站点的上下行客流数据，在兼顾公交公司运营效率与乘客等待和拥挤体验的条件下，优化发车间隔及最小配车数。
  models:
  - name: 分时段等间隔发车模型
    role: 将全天划分为五个客流时段，并以各时段发车次数或固定发车间隔作为决策变量。
    why: 客流具有明显的高峰、平峰和低谷特征，分段后既能反映客流变化，又能降低连续时刻调度的复杂度并增强方案可操作性。
  - name: 三目标非线性规划模型
    role: 同时最大化车辆平均满载率，并最小化乘客等待抱怨率和拥挤抱怨率。
    why: 公交调度需要协调运营方与乘客双方利益，单一指标无法完整描述车辆利用效率、候车体验和乘车舒适度之间的冲突。
  - name: 加权和单目标优化模型
    role: 利用非负权重将满载率、拥挤抱怨率和等待抱怨率合成为单一目标函数并进行数值求解。
    why: 原三目标模型难以直接求解，加权和方法能够将其转化为常规单目标优化问题，便于使用 MATLAB 计算各时段发车次数和间隔。
  - name: 车辆循环与最小配车模型
    role: 根据上下行发车累计量、车辆单程运行时间及两端车场车辆存量，计算满足调度计划的最小车辆数。
    why: 仅优化发车间隔不能保证车辆在上下行端点之间及时周转，必须显式考虑车辆空间转移和车场供需平衡。
  solution_flow: 数据→分析各站点、各时段上下车客流并将全天划分为五个时段→以各时段发车次数和发车间隔为决策变量，递推计算各车经过各站后的载客量→构造平均满载率、等待抱怨率和拥挤抱怨率三个目标→设置车辆载客量不超过120人等约束，并取权重0.2、0.3、0.5转化为单目标优化→用
    MATLAB 分别求解上下行发车间隔→结合单程运行时间和两端车场车辆存量计算最小配车数→将连续最优间隔调整为便于执行的整数分钟方案并平衡上下行车辆→通过载客上限扰动和客流图分析验证模型。
  validation: 采用约束参数灵敏度检验，将单车载客上限由120人分别调整为115人和125人，比较总车辆数及调度方案，结果基本不变，说明模型对容量参数扰动较稳定；同时绘制上下行客流量图检查分时段假设，识别上下车人数差异较大的局部时段，并据此指出应缩短这些时段的数据采样间隔。该验证仍存在局限，即未系统比较多组目标权重下的解和
    Pareto 权衡关系。
  visualization:
  - 上下行分时段客流量折线图
  - 上下行分时段发车间隔时刻表
  pitfalls_avoided:
  - 避免直接对全天采用统一发车间隔，因为早晚高峰与平峰客流差异显著，统一间隔会造成高峰等待过长或低谷车辆空驶。
  - 避免只追求平均满载率，因为过度压缩发车次数会增加乘客等待和拥挤；模型同时引入等待抱怨率与拥挤抱怨率以约束服务质量。
  - 避免仅依据上下行各自的局部最优结果直接确定车队规模，因为两端车辆可能出现一侧短缺、另一侧过剩；通过车辆循环平衡和人工调整降低总配车数。
  - 避免直接采用带小数的理论最优发车间隔，因为其难以编制和执行实际时刻表；将间隔调整为整数分钟，并重新核算满载率、抱怨率和车辆数。
  - 避免忽视分段边界处的客流归属，因为车辆到站时刻可能跨越相邻时段；载客量递推时根据实际到站时刻选用对应时段的客流率。
  - 避免把粗粒度客流数据视为完全均匀，因为局部上下车人数差异过大会破坏分段内稳定客流假设；通过客流图识别异常时段并建议细化采样。
  innovation_points:
  - 将车辆平均满载率、乘客等待抱怨率和拥挤抱怨率统一纳入多目标调度框架，实现运营效率与服务质量的联合权衡。
  - 在发车间隔优化之后进一步引入上下行车辆循环与车场存量平衡，通过少量调度调整将理论方案的56辆车降低到可执行方案的52辆车。
  - 根据乘客忍耐时间设置分时段等待抱怨函数，早高峰采用5分钟阈值、其他时段采用10分钟阈值，使服务评价更贴近实际。
  - 从客流图中识别高峰进入和退出阶段的数据聚合误差，提出在客流突变时段缩短统计采样间隔以改进后续调度精度。
- id: 2017年全国数模题目讲解_D题 2017全国数学建模讲评会
  source_paper: 2017年全国数模题目讲解 2017年全国数模题目讲解_D题 2017全国数学建模讲评会
  problem_type: 优化
  keywords:
  - 巡检线路排班
  - 旅行商问题
  - 最短路
  - 错时上班
  - 时间窗口
  context: 针对化工厂26个巡检点，在巡检周期、服务耗时、道路连通、班次、休息和进餐等约束下，联合优化巡检人数、巡检路线与时间表。
  models:
  - name: 旅行商问题（TSP）
    role: 求解遍历全部巡检点的最短闭合路线，并估计完成一次全点巡检所需的最短时间。
    why: 巡检工人需要从调度中心出发并访问多个巡检点，TSP可直接压缩总行走时间；全点最优路线的行走时间为68分钟，加上67分钟巡检耗时后总计135分钟。
  - name: 人员数量下界模型
    role: 利用全点巡检最短总时间与最小巡检间隔估计同时在岗人数的理论下界。
    why: 最小巡检间隔为35分钟，故人员下界为向上取整的135/35，即4人，可用于评价固定上班和错时上班方案是否达到最优。
  - name: Dijkstra最短路模型
    role: 计算调度中心XJ0022到其余巡检点的最短路径和距离，为固定上班条件下的区域划分提供依据。
    why: 所有工人必须同时从调度中心出发，远近不同会造成明显的路程负担差异，因此需要按最短路距离实现近点多分、远点少分。
  - name: 多旅行商分区与启发式均衡模型
    role: 将26个巡检点划分为5个工作区域，并分别求解各区域的巡检顺序，使各工人的周期长度和工作量尽量均衡。
    why: 直接建立完整VRPTW模型复杂且不易求解，而问题规模仅有26个点，采用分区后分别求解TSP的启发式方法更稳定、易实施，也能满足巡检间隔约束。
  - name: 周期性错时排班模型
    role: 令4名工人沿同一条全点TSP路线依次间隔35分钟出发，并按140分钟周期循环巡检。
    why: 4名工人的出发间隔总计140分钟，而一轮全点巡检仅需135分钟，剩余5分钟可休息；该方案既满足最短35分钟巡检间隔，又达到4人的理论下界。
  - name: 机动替班调度模型
    role: 安排1名机动工人在正式工人进餐时接替其巡检任务，并设计接替、进餐和返回岗位的时间链。
    why: 30分钟进餐会造成连续巡检缺口，原有人员难以在不违反巡检周期的情况下自行消化，因此通过错峰进餐和单名机动人员轮流替班可避免多人同时离岗。
  solution_flow: 数据：读取26个巡检点的巡检周期、巡检耗时、道路连通关系、步行时间及调度中心位置，构造加权网络；模型：先求全点TSP得到68分钟路程时间，与67分钟巡检时间合并为135分钟，再结合35分钟最小巡检间隔得到4人的理论下界；参数：固定上班时依据调度中心到各点的Dijkstra最短路距离，将巡检点划分为5组，并控制每组点数、巡检周期及总工作量；求解：各组分别采用TSP或插入、邻域交换等启发式算法确定路线并生成逐点时间表，休息利用路线中的5至10分钟空闲，进餐由第6名机动工人错峰替班；错时方案中4名工人每隔35分钟沿全点TSP路线出发，每轮135分钟后休息5分钟，以140分钟为循环周期，并按7小时整数轮次设计交接班，进餐时再配置1名机动工人；验证：逐点检查相邻两次巡检的时间间隔、路线可达性、班次边界、调度中心交接、休息进餐时长和个人工作量，并用理论下界证明错时方案的4人配置最优。
  validation: 首先以135分钟全点最短巡检时间除以35分钟最小巡检间隔，证明任何方案至少需要4名并行巡检人员；其次根据完整的逐点时间表，逐项核验每个巡检点相邻两次访问间隔不超过其规定周期，所有行走边均存在且行走时间与网络数据一致；再检查固定班组是否同时从XJ0022出发、交接是否发生在调度中心、单班工作时长是否合理，以及休息和进餐期间是否由空闲时间或机动人员覆盖；最后比较固定上班5人、固定上班含进餐6人、错时上班4人、错时上班含进餐5人的在岗需求，并确认错时方案达到人员下界。
  visualization:
  - 巡检点道路连通网络图
  - 调度中心到各点的最短路径图
  - 分区着色的多旅行商路线图
  - 逐点巡检时间表
  - 人员排班甘特图
  - 机动人员替班时序表
  pitfalls_avoided:
  - 避免直接建立规模庞大且难以求解的完整VRPTW模型：点数只有26个，先用TSP、最短路和启发式分区即可得到可执行方案，能防止模型形式复杂但无法产生排班结果。
  - 避免把固定上班误解为每个人可以在不同地点或不同时间启动：固定班组中的人员应同时在调度中心XJ0022上班，否则相当于删除统一出发约束，会人为降低问题难度并错误地得到4人方案。
  - 避免只给巡检路线图而不给逐点时间表：没有到达和巡检时刻就无法核验各点的巡检周期、休息、进餐及交接班约束，因此必须输出可检查的时间表。
  - 避免让所有工人在12时和18时同时进餐：同时离岗会导致巡检中断，并可能使替班人数接近原班人数；采用进餐时间窗口内错峰进餐，只需配置1名机动人员。
  - 避免仅凭平均工作量判断人员充足：即使135/35给出4人的下界，固定上班时统一从中心出发会产生重复路程和同步约束，实际仍需5人，理论下界不能直接当作所有场景的可行解。
  - 避免忽略交接班地点约束：换班和进餐替换只能在调度中心完成，因此错时方案必须在完成整轮巡检后交接，不能在任意巡检点直接换人。
  - 避免只优化人数而忽视工作量公平：分区时同时考虑点数、中心距离、巡检耗时和线路周期，防止部分工人路线过长而其他工人长期空闲。
  innovation_points:
  - 采用“全点TSP时间除以最小巡检间隔”构造人员数量下界，并将该下界直接用于判断错时排班方案的全局最优性。
  - 将错时巡检类比为列车发车：4名工人每隔35分钟沿同一最短路线出发，利用135分钟巡检时间与140分钟循环周期之间的5分钟余量实现连续覆盖和自然休息。
  - 固定上班方案采用“中心最短路距离分区加组内TSP”的分解策略，以近点多分、远点少分的方式同时控制重复路程与人员工作量。
  - 将休息与进餐区别处理：短休息嵌入路线中的自然空闲时间，较长进餐则通过单名机动人员和链式错峰替班解决，从而减少额外人力。
  - 根据140分钟巡检循环和7小时换班周期设计周循环排班，使每日换班时刻提前3小时，并在7天后恢复原有周期。
- id: B题_钢管的订购和运输
  source_paper: B题 B题_钢管的订购和运输
  problem_type: 优化
  keywords:
  - 钢管订购与运输
  - 产能约束
  - 最小面积模型
  - 网络流
  - 灵敏度分析
  context: 在钢管铺设线路为链状或树状网络的条件下，综合考虑采购成本、运输费用、铺设费用、最低订购量和产量上限，制定总费用最小的购运与铺设方案。
  models:
  - name: 最小面积模型
    role: 求解无分岔线性管道线路上的钢管供应区段划分及最小总费用。
    why: 链状线路可用铺设位置作为横坐标、各钢厂单位综合费用作为纵坐标，每个购运方案对应一条覆盖全线路的拼接折线，其下方面积恰好表示总费用，因而可将规划问题转化为直观且可手工求解的面积最小化问题。
  - name: 容量约束下的费用差积分分配模型
    role: 在钢厂产量上限存在时，确定各钢厂应优先供应的线路区段。
    why: 无容量约束时直接选择费用折线的下包络线即可，但产量上限会使该方案不可行；通过最大化指定长度区段上的单位费用差积分，可将有限产能配置到相对替代收益最大的区段。
  - name: 树状管网网络流非线性规划模型
    role: 处理存在分岔的树状管道线路，并统一描述采购、运输、铺设和节点流量平衡。
    why: 树状线路无法直接使用一维折线面积法，而网络流变量能够描述钢管由钢厂运至节点以及沿各树边铺设的数量，并可通过节点守恒、边容量、生产上下限等约束构造具有通用性的优化模型。
  - name: 线性规划近似与灵敏度分析模型
    role: 分析钢材单价和产量上限变化对最优方案及总费用的影响。
    why: 铺设费用项在总费用中占比较小且是主要非线性来源，暂时忽略该项后模型可近似为线性规划，从而利用目标系数允许变化区间、边际费用和分段线性关系开展灵敏度分析。
  solution_flow: 数据→整理各钢厂单价、产能上下限、节点距离、运输费率和铺设费率，并识别线路的链状或树状拓扑→对链状线路绘制各钢厂单位综合费用折线，剔除被支配且不满足经济性要求的钢厂，构造最小面积模型；对树状线路定义钢厂至节点的运输量、节点供给量和树边铺设量，建立网络流非线性规划模型→根据最低订购量、产量上限、边长度和节点流量守恒设置参数与约束→链状情形利用费用差积分最大化逐厂分配供应区段，树状情形使用SAS求解规划模型→比较连续费用与离散费用方案、检验容量与流量约束，并通过参数扰动和近似线性规划验证最优方案的稳定性。
  validation: 首先利用费用折线的下包络线给出无容量限制时的理论下界，再通过费用差积分的交换判据说明有限产能被配置到节约额最大的区段，从而验证链状方案的最优性；其次检查各钢厂订购量是否满足零生产或最低订购量、产量上限条件，并检查树状管网各节点的流量守恒与各边铺设量范围；再次分别按连续运输费用和阶梯式离散运输费用计算，确认由于最优运输量呈整数或半整数结构，两种计费方式得到相同分配方案且总费用差异很小；最后利用SAS重新求解参数扰动后的模型，获得总费用关于单价和产能的分段线性关系、左右差商及有效区间，并与图解判断和线性规划近似结果交叉验证。
  visualization:
  - 各钢厂单位综合费用—铺设位置折线图及下包络线
  - 最优供应区段分配图
  - 树状管网节点—边网络图
  - 总费用随钢材单价或产量上限变化的灵敏度曲线
  pitfalls_avoided:
  - 避免在存在产量上限时直接把费用折线下包络线当作可行最优解，因为最低费用钢厂可能无法供应下包络线对应的全部线路长度，必须通过费用差积分把有限产能配置到替代收益最大的区段。
  - 避免仅因某钢厂局部运输距离较近就将其纳入方案，因为还需同时考虑钢材单价和最低订购量；例如供应区段过短时可能达不到500单位的最低订购量，强行启用反而会显著增加总成本。
  - 避免将链状线路的一维图解法机械套用于树状分岔线路，因为树中一个节点可能关联父边和多条子边，必须利用网络流守恒变量描述各方向的铺设量。
  - 避免把连续运费近似未经检验地替代题目规定的离散运费，因为阶梯计费可能改变区段切换点；论文进一步检查了最优运输量的整数或半整数结构，确认离散计费下分配方案不变。
  - 避免仅用当前某钢厂的供应量判断价格敏感性，因为价格变化可能引发钢厂间替代并改变产量；应结合供应线路长度、左右方向差商以及重新优化后的产量调整综合判断。
  - 避免把未达到产能上限的钢厂仍视为具有显著产能边际价值，因为只要其新上限不低于当前最优产量，上限的小幅变化不会改变可行域中的最优点和总费用。
  innovation_points:
  - 将链状管道的采购运输规划几何化为多条单位费用折线下方面积最小问题，使复杂规划能够通过图解和手工判别完成。
  - 提出基于单位费用差积分最大化的区段选择准则，用相对替代收益解释产能受限条件下各钢厂的最优供应位置。
  - 针对树状管网引入父节点、后继节点和边铺设量变量，构建兼顾采购、运输、铺设及节点守恒的通用网络流非线性规划模型。
  - 将精确非线性模型的参数扰动结果与忽略小比例非线性铺设费用后的线性规划灵敏度分析结合，既获得定量边际影响，也提高了结果解释性。
  - 利用价格变化的左右差商揭示钢厂之间的替代与互助效应，说明总费用对价格上涨和下降可能具有不对称响应。
- id: B题优秀论文_2002年B题彩票方案的优选模型
  source_paper: B题优秀论文 B题优秀论文_2002年B题彩票方案的优选模型
  problem_type: 综合评价+优化
  keywords:
  - 层次分析法
  - 合理度评价
  - 约束优化
  context: 针对传统型与乐透型彩票发行方案，综合考虑各奖项奖金设置、总中奖概率及其对彩民的吸引力，对已有方案进行合理性评价并设计约束条件下的最优方案。
  models:
  - name: 标准化加权合理度评价模型
    role: 将奖项奖金比例、低项奖金额和总中奖概率转化为无量纲影响力，并通过加权求和得到彩票方案的合理度G。
    why: 各评价因素的量纲和数量级不同，采用向量模确定标准值并进行归一化，可以实现不同因素之间的统一比较与综合评价。
  - name: 层次分析法（AHP）
    role: 构建目标层、准则层和因素层的递阶结构，通过两两比较判断矩阵计算各奖金及中奖概率因素的权重。
    why: 彩票合理性受多个具有层次关系的因素共同影响，AHP能够将专家对因素重要性的判断定量化，并可通过一致性检验控制主观判断的逻辑一致性。
  - name: 约束目标优化模型
    role: 以合理度G最大为目标，将彩票类型、号码设置、奖项数量、奖金比例、奖金金额和总中奖概率作为决策变量，在现实约束下寻找最优发行方案。
    why: 彩票设计不仅要追求较高吸引力，还必须满足高项奖比例和为1、奖金分级递减、变量合理浮动区间及中奖概率生成规则等实际限制，因此需要建立约束优化模型。
  - name: 分段穷举搜索
    role: 遍历总号码数、中奖号码数及各变量浮动区间，并将高项奖比例和低项奖金额分阶段搜索以获得最大合理度方案。
    why: 模型包含离散号码组合与连续或离散化奖金变量，解析求解困难；在给定有限区间和步长后，穷举搜索易于实现且能够比较全部候选组合，分段搜索还能显著降低计算量。
  solution_flow: 整理29种彩票方案的奖项、奖金与中奖概率数据，并按传统型和乐透型分别处理→根据彩票规则计算各奖项中奖概率及总中奖概率→利用向量单位化确定各因素标准值并计算无量纲影响力→建立递阶层次结构和判断矩阵，通过特征根法求取AHP权重并完成一致性检验→构造加权合理度G，对已有方案计算、排序和筛选→以G最大化建立含奖金比例、金额区间、奖项顺序和中奖概率规则的约束优化模型→采用Matlab进行分段穷举搜索→比较不同中奖面和变量浮动区间下的最优方案，检验结果的可行性与稳定性。
  validation: 首先对AHP各层判断矩阵及总排序进行一致性检验，以CR小于0.1作为权重可接受的标准；其次将模型应用于已有29个方案，通过合理度排序识别传统型与乐透型的最优方案；最后在不同总中奖概率区间和不同变量浮动范围下重复优化，比较最优方案及合理度变化，同时检查高项奖比例和为1、奖金等级递减、变量区间和彩票组合规则等约束是否全部满足。
  visualization:
  - 彩票方案递阶层次结构图
  - 各方案合理度排序柱状图
  - 判断矩阵与权重汇总表
  - 不同中奖面下最优方案对比表
  pitfalls_avoided:
  - 避免直接对奖金比例、奖金金额和中奖概率进行相加，因为三类指标的量纲与数量级不同，直接加权会使大数值指标不合理地主导评价结果。
  - 避免将传统型与乐透型彩票混合标准化，因为两类彩票的规则和中奖概率结构不同，统一处理可能造成标准值与合理度不可比。
  - 避免AHP权重完全依赖主观判断而不检验，通过判断矩阵的一致性比例CR检验排除逻辑矛盾过大的权重结果。
  - 避免不同方案因奖项数量不一致而无法形成同维向量，将未设置的低项奖金额记为0，从而保证评价指标维度统一。
  - 避免只最大化吸引力而产生不现实方案，通过奖金比例和为1、奖金上下界、奖项金额递减和中奖概率生成规则等约束保证方案可实施。
  - 避免对全部决策变量一次性进行高维穷举导致计算量过大，先搜索高项奖比例、再固定其结果搜索低项奖金额，以分段遍历降低计算复杂度。
  innovation_points:
  - 将奖项设置、奖金水平和总中奖概率统一定义为相对于标准值的影响力，并利用样本向量的模确定标准值，形成可比较的无量纲合理度指标。
  - 提出决策变量合理浮动区间的概念，使彩票发行部门能够根据政策偏好和经营要求调整约束，并快速生成相应的最优方案。
  - 将AHP综合评价与约束优化衔接，先利用历史方案确定权重和标准值，再以同一合理度指标指导新方案设计。
  - 采用高项奖与低项奖分段遍历策略，在保留穷举搜索直观性和可解释性的同时减少高维组合搜索的计算量。
- id: B题优秀论文_2002年B题彩票方案的评价
  source_paper: B题优秀论文 B题优秀论文_2002年B题彩票方案的评价
  problem_type: 综合评价+优化
  keywords:
  - 彩票吸引力效用函数
  - 层次分析法与熵值取权法
  - 动态规划
  context: 在彩票总奖金比例固定的条件下，以设奖方案对不同类型彩民的吸引力作为评价标准，并进一步优化抽奖方式及各等级奖金分配。
  models:
  - name: 饱和型吸引力效用函数
    role: 将各等级的中奖概率和奖金额映射为可加权合成的吸引力，并构造彩票方案的综合评价指标。
    why: 彩民吸引力随中奖概率或奖金额增加而单调上升，但边际吸引力逐渐减弱，因此借用高通滤波传输函数构造单调递增且具有饱和特征的效用函数。
  - name: 层次分析法
    role: 确定不同奖级以及中奖概率吸引力、奖金额吸引力之间的主观权重，用于模型一的综合评价。
    why: 评价指标具有目标层、准则层和奖级层的层次结构，且缺少直接的彩民偏好统计数据，适合通过成对比较表达专家判断并进行权重合成。
  - name: 熵值取权法
    role: 根据各方案指标的差异程度客观确定各奖级的中奖概率权重和奖金额权重，用于模型二的综合评价。
    why: 熵权能够减少完全依赖主观比较矩阵带来的偏差，并使区分不同方案能力较强的指标获得较大权重。
  - name: 异质彩民群体加权模型
    role: 将彩民划分为偏重中奖面的保守型群体和偏重奖金的冒险型群体，按群体占比汇总方案吸引力。
    why: 不同彩民的风险偏好和收益偏好存在明显差异，单一代表性彩民难以反映总体市场需求，采用群体混合可以提高评价的现实解释性。
  - name: 一维资源分配动态规划模型
    role: 在给定抽奖方式下，将奖金池在不同奖级之间进行最优配置，使方案综合吸引力最大。
    why: 各奖级可视为依次分配奖金资源的阶段，分配金额或比例是决策变量，总奖金构成统一资源约束，符合典型多阶段资源分配问题的结构。
  - name: 抽奖方式枚举优化
    role: 遍历不同的“m选n”组合，并比较各抽奖方式经过奖金优化后的最大吸引力。
    why: 候选范围有限且离散，直接遍历m从25到70、n从5到12可以获得全局最优候选，避免连续近似造成不可实施的抽奖参数。
  solution_flow: 整理各彩票方案各奖级的中奖概率与奖金额数据，将缺失奖级按概率和奖金均为0处理→分别按列归一化概率矩阵和奖金矩阵，消除数量级差异→利用饱和型效用函数将概率、奖金转换为吸引力，依据截止频率思想取效用函数参数约为0.2→模型一通过层次分析法计算奖级权重及中奖面、奖金额权重，模型二通过熵值法计算客观奖级权重并设置保守型与冒险型彩民的偏好和群体比例→加权合成各方案总吸引力并排序→在给定“m选n”方式下用动态规划优化奖金分配，再遍历候选抽奖方式→得到“34选6”及高项奖60%、25%、15%，低项奖370元、15元、8元且不设七等奖的优化方案。
  validation: 首先对层次分析法的成对比较矩阵进行一致性检验，得到最大特征根约为7.19728、CI约为0.03288、CR约为0.02491，小于0.1，因而权重可接受；其次分别采用AHP主观赋权模型和熵值客观赋权、异质群体模型对候选方案排序，通过两类评价结果的对照检验结论稳定性；同时检查效用函数的单调递增、边际效用递减和取值区间性质，并在动态规划后对所有候选“m选n”方式进行枚举比较以验证所得方案在给定搜索范围内最优。需要注意，论文缺少真实销量或彩民调查数据的外部验证，成对比较矩阵也未充分反映奖级间非整数倍差异。
  visualization:
  - 吸引力效用函数曲线图
  - 层次分析结构图
  - 彩票方案吸引力降序柱状图
  pitfalls_avoided:
  - 避免直接对中奖概率和奖金额原始值加权求和：两类指标及不同奖级之间存在显著数量级差异，直接相加会使大数值指标支配结果，因此先对概率矩阵和奖金矩阵按列归一化。
  - 避免把吸引力假设为无限线性增长：当奖金或中奖概率已经较高时，其新增部分对彩民的边际吸引力会下降，因此采用具有饱和特征的单调效用函数，而不是简单线性函数。
  - 避免将所有彩民视为偏好完全相同：论文设置保守型和冒险型群体，并分别赋予中奖面与奖金额不同权重，否则总体吸引力可能掩盖群体间风险偏好差异。
  - 避免将缺失奖级当作缺失数据删除：统一设置七个奖级，并将未设奖级的中奖概率和奖金记为0，从而保证不同方案具有相同指标维度并可直接比较。
  - 避免未经检验直接采用AHP权重：对判断矩阵计算CI和CR并确认CR小于0.1，否则不一致的专家判断会导致权重和最终排序缺乏可信度。
  - 避免仅凭局部经验选择抽奖方式：对有限范围内的“m选n”组合进行遍历，并对每个组合先求最优奖金配置，防止只比较未优化方案或陷入局部选择。
  innovation_points:
  - 将彩票吸引力拆分为中奖面吸引力和奖金额吸引力，再细分至各奖级，并借用高通滤波系统的传输函数构造具有边际效用递减特征的吸引力函数，实现概率与奖金的统一效用化评价。
  - 结合AHP主观赋权、熵值客观赋权和异质彩民群体加权进行多视角评价，再将评价函数嵌入动态规划与离散枚举中，实现从既有方案排序到抽奖方式、奖金结构联合优化的衔接。
- id: B题_钻井布局
  source_paper: B题 B题_钻井布局
  problem_type: 优化
  keywords:
  - 钻井布局
  - 0-1规划
  - 模1映射
  - 网格穷举搜索
  - 最小外接圆
  - 坐标变换
  context: 在允许平移或旋转单位正方形网格的条件下，使尽可能多的旧井位于某个网格结点的给定误差邻域内，并判断全部旧井能否同时利用。
  models:
  - name: 0-1规划模型
    role: 用二元变量表示每口旧井是否可利用，并以可利用旧井总数最大化作为统一目标。
    why: 每口旧井只有利用或舍弃两种离散状态，目标可自然表示为所有0-1变量之和，适合刻画最大覆盖问题。
  - name: 单位网格模1映射模型
    role: 将所有旧井坐标按横、纵坐标模1映射到同一个单位正方形基本域内。
    why: 整数网格具有周期性，模1映射保持旧井相对其所在网格单元的位置及激活状态，可将无限网格搜索压缩为有限基本域搜索。
  - name: 固定方向下的邻域覆盖穷举模型
    role: 在方向给定时，通过平移误差邻域，搜索能够覆盖最多像点的位置；无穷范数下使用边长为2ε的正方形邻域。
    why: 映射后只需在有限区域内搜索两个平移参数，且候选点数量较少，穷举方法实现简单并能直接获得最大可利用井数。
  - name: 旋转—平移三维状态空间搜索模型
    role: 以旋转角θ和网格平移量u、v构成状态空间，对无方向约束情形逐角度搜索最优网格布局。
    why: 网格与旧井坐标系的相对关系可由一个旋转参数和两个平移参数唯一确定；正方形网格具有90度周期性，因此只需搜索0≤θ<π/2。
  - name: 欧氏距离圆覆盖模型
    role: 在无方向约束问题中，用半径为ε的圆形误差邻域判断映射像点是否可被同一网格结点覆盖。
    why: 问题采用二范数定义误差，圆形覆盖准确对应旧井到最近网格结点的欧氏距离约束。
  - name: 最小外接圆判定模型
    role: 计算全部映射像点的最小覆盖圆半径R，并以R≤ε作为全部旧井可同时利用的判定条件。
    why: 所有像点能否落入同一个误差圆，本质上等价于点集最小外接圆半径是否超过允许误差，因而可给出直接的几何判定。
  - name: 中垂线二分逼近算法
    role: 在点集凸包及其直径中垂线上迭代搜索最小外接圆圆心和半径。
    why: 通过比较直径端点确定的半径与其余点到圆心的最大距离来调整搜索方向，可将连续圆心搜索转化为一维二分逼近。
  - name: 距离型充分必要条件筛选模型
    role: 利用两点距离、三点最小覆盖圆和点集直径等条件，对全部旧井可利用性进行快速预判。
    why: 若存在点对距离大于2ε则必不可行；若任意点对距离不超过√3ε则可保证可行；三点最小覆盖圆半径超过ε也可快速排除整体可行性。
  solution_flow: 数据→读取旧井平面坐标并设定网格边长、误差ε及距离范数→建立旧井利用状态的0-1最大覆盖目标→对坐标实施旋转并按模1映射到单位基本域→固定方向时搜索平移参数，无方向约束时在θ∈[0,π/2)上离散搜索并对每个角度优化u、v→统计误差正方形或误差圆内的像点数并输出最优井号、角度和位移→对完全利用问题先用点对及三点判据筛选，再计算最小外接圆半径→通过已知最优子集、正反例和不同模型结果的一致性进行验证。
  validation: 首先将有方向约束问题作为无方向模型的特殊情形，检查搜索结果的一致性；其次把问题二得到的6个最优像点代入最小外接圆算法，验证其半径R≤ε，同时对全部12个点计算得到R>ε，从可行与不可行两方面检验判定算法；再利用Dij>2ε的必要条件、Dij≤√3ε的充分条件以及任意三点最小覆盖圆判据进行交叉核验，并检查所输出旧井逐点满足相应距离阈值。
  visualization:
  - 旧井原坐标与模1映射像点散点图
  - 单位基本域及周期边界复制示意图
  - 旋转网格与最优覆盖布局图
  - 误差正方形或误差圆覆盖图
  - 凸包与最小外接圆示意图
  - 旋转角—最大可利用井数曲线
  pitfalls_avoided:
  - 避免直接在无限网格上搜索：利用网格周期性将坐标模1映射到单位基本域，否则搜索范围无界且会产生大量等价布局。
  - 避免忽略基本域的周期边界：位于左右边界或上下边界附近的像点可能被同一误差邻域同时覆盖，若只在单个正方形内普通搜索会漏掉最优解，因此需复制边缘区域或采用环面距离。
  - 避免将无方向约束误当成单纯平移问题：网格旋转会改变映射点分布，必须同时搜索旋转角θ及平移量u、v。
  - 避免搜索重复角度：正方形网格旋转π/2后与原网格等价，因此将角度限制在[0,π/2)可减少冗余计算。
  - 避免混用距离范数：有方向约束问题采用无穷范数并对应正方形邻域，无方向问题采用二范数并对应圆形邻域，邻域形状错误会直接改变可利用井集合。
  - 避免仅凭点集直径不超过2ε就认定全部可行：该条件只是必要条件而非充分条件，还需通过三点覆盖判据或最小外接圆半径完成最终判断。
  - 避免步长过大造成漏解：旋转角和平移参数的离散步长必须结合局部精化或几何临界位置设置，否则窄小的最优参数区域可能被跳过。
  - 避免在周期复制区域中重复计算同一源点：同一旧井可能产生多个周期像点，但一个误差圆内只能按一个源点计数，否则会虚增可利用井数。
  innovation_points:
  - 提出模1映射原理，将无限周期网格上的布局问题压缩到一个单位基本域内，同时保持旧井激活状态不变。
  - 把有方向与无方向约束统一为旋转—平移状态空间中的最大邻域覆盖问题，使固定方向算法可直接复用于每一个给定旋转角。
  - 通过扩展基本域或复制边界区域处理周期环绕覆盖，避免边界附近像点导致的最优解遗漏。
  - 针对全部旧井可利用问题构造分层几何判据，以点对距离和三点最小覆盖圆快速筛选，再以点集最小外接圆给出最终判定。
  - 提出基于凸包直径中垂线的二分逼近方法求点集最小覆盖圆，将二维连续圆心搜索简化为迭代距离平衡过程。
- id: B题_洗衣机的节水程序设计
  source_paper: B题 B题_洗衣机的节水程序设计
  problem_type: 优化+分类聚类+综合评价
  keywords:
  - 洗衣机节水
  - 动态规划
  - 非线性整数规划
  - 衣物分类
  - 残留浓度递推
  context: 针对洗衣机“加水—漂洗—脱水”的周期过程，在满足洗涤效果和设备运行约束的条件下，根据衣物重量及面料属性确定最优漂洗次数和单次注水量，以使总用水量最小。
  models:
  - name: 污垢浓度与残留量递推模型
    role: 利用衣物脱水后的保水量、污垢浓度和每轮注水量，建立洗涤及多轮漂洗后污垢残留量的递推关系，并将洗涤效果转化为末轮浓度阈值约束。
    why: 漂洗效果取决于上一轮残留污水中的污垢被新注入清水稀释并排出的过程，质量守恒和浓度递推能够直接刻画各轮操作之间的状态传递关系。
  - name: Freundlich吸附修正模型
    role: 描述衣物纤维对洗涤剂包裹污垢形成的乳浊液微团的吸附作用，并修正脱水后衣物上的污垢残留量。
    why: 仅考虑衣物中残留污水会低估实际残污量，引入与衣料性质有关的吸附参数可增强模型的物理合理性，并体现不同面料对耗水量的影响。
  - name: 动态规划模型
    role: 将每轮漂洗视为一个决策阶段，以污垢残留量或浓度为状态、注水量为决策变量，在终端洗涤效果达标的条件下最小化累计用水量。
    why: 洗衣过程具有明显的多阶段序贯结构，当前漂洗结果决定下一轮的初始状态，符合动态规划的阶段性、状态转移性和整体最优性特征。
  - name: 拉格朗日乘子优化模型
    role: 在给定漂洗次数和终端浓度约束时，求解各轮注水量的连续优化问题，并证明最优方案中各轮注水量相等。
    why: 目标函数为各轮注水量之和，终端浓度由各轮稀释比例的乘积决定，适合通过带等式约束的条件极值方法获得解析结构。
  - name: 非线性整数规划模型
    role: 联合确定整数漂洗轮数和受上下限约束的单轮注水量，实现满足浓度阈值条件下的总用水量最小化。
    why: 漂洗次数只能取整数，而浓度递推和注水量之间存在非线性关系，同时还必须满足最小浸没水量和洗衣机最大容量等实际约束。
  - name: 层次分析法衣物分类模型
    role: 综合衣物洗涤难度、洗涤时间和用水需求等因素计算不同面料的排序权重，并将衣物划分为适合分批洗涤的类别。
    why: 不同面料的吸水率、保水率、脱水率和污染程度差异显著，先进行多指标综合排序与分类，可避免混洗时由最难洗衣物支配全部衣物的程序参数。
  solution_flow: 数据：采集衣物质量、污染程度、吸水率、脱水后保水率、面料吸附参数、洗涤剂效能、洗衣桶尺寸及浓度阈值→模型：建立最小注水量公式、污垢残留与浓度递推模型，并用Freundlich关系修正纤维吸附作用→参数：按层次分析结果对衣物分类，为各类衣物确定属性参数和设备注水上下限→求解：先证明固定轮数下等量注水最优及固定总水量下少量多次效果更好，再通过拉格朗日乘子法和非线性整数规划搜索最佳漂洗轮数与单轮水量→验证：选取毛料、纯棉等典型衣料进行计算，并在实际双桶洗衣机上测试，对比理论轮次和用水量与实测结果。
  validation: 采用理论推导与实机实验相结合的验证策略：首先利用重要不等式和反证法证明“各轮等量注水”的最优性，再通过单调性分析证明固定总水量下增加漂洗次数可降低末轮浓度；随后针对三组典型衣料参数计算最佳漂洗轮次和用水量，并在同型号大容量双桶洗衣机上进行测试，以计算值与实测值的一致性检验模型有效性。
  visualization:
  - 洗衣机最佳节水运行程序流程图
  - 衣物属性变量对总用水量影响曲线图
  - 不同衣料理论值与实测值对比表
  - 衣物分类递阶层次结构图
  pitfalls_avoided:
  - 避免把所有衣物视为同一洗涤对象：不同面料的吸水率、保水率、脱水率和吸附能力差异会显著改变残污量，统一设置程序容易造成部分衣物洗不净或额外耗水，因此先进行衣物分类并分别赋参。
  - 避免只优化单次注水量而忽略漂洗轮数：单轮水量与轮数共同决定累计稀释效果，仅减少单次水量可能导致末轮浓度不达标，因此将整数轮数和连续注水量联合优化。
  - 避免出现数学上趋向零注水、实际却无法运行的伪最优解：模型加入衣物必须被浸没和适当悬浮、洗涤剂必须充分溶解以及洗衣机最大注水高度等上下限约束。
  - 避免将各轮漂洗彼此独立处理：每轮开始时的污垢来自上一轮脱水后的残留污水和纤维吸附，忽略状态传递会低估后续浓度，因此采用递推状态方程描述全过程。
  - 避免完全忽略衣物纤维的吸附效应：若只按残留水量计算污垢，会系统性低估漂洗需求，因此利用Freundlich吸附关系对残污量进行修正。
  - 避免仅凭经验给出“少量多次”和“等量注水”规则：论文通过重要不等式、反证法、单调性分析和拉格朗日条件对两项节水准则进行数学证明，使程序设计具有可解释的最优性依据。
  innovation_points:
  - 将洗衣机漂洗过程抽象为多阶段状态转移问题，把洗涤效果阈值转化为终端浓度约束，并用动态规划统一描述轮次选择和逐轮注水决策。
  - 从数学上推导出固定漂洗次数时各轮等量注水最优、固定总水量时少量多次更有效的两项节水准则，为洗衣机控制程序提供直接可执行的规则。
  - 在基础稀释模型上引入衣物纤维对乳浊液微团的Freundlich吸附修正，使衣物材质参数能够进入残污量和总用水量计算。
  - 将层次分析衣物分类、机理模型和非线性整数规划结合，形成从衣物识别与分批、参数计算到最佳轮次及水量控制的完整节水程序。
- id: B题 露天矿生产的车辆安排论文_露天矿生产车辆安排计划优化设计
  source_paper: B题 露天矿生产的车辆安排论文 B题 露天矿生产的车辆安排论文_露天矿生产车辆安排计划优化设计
  problem_type: 优化
  keywords:
  - 露天矿车辆调度
  - 整数规划
  - 多目标分层优化
  - 电铲利用率
  - 线路车次安排
  context: 针对露天矿一个班次内电铲、卡车及装卸点能力受限且矿石品位需达标的生产场景，优化各铲位至卸点的运输车次、设备配置和车辆安排。
  models:
  - name: 线性规划电铲初始布点模型
    role: 通过松弛车次整数约束和部分设备约束求得各铲位的能力利用率，并按利用率筛选电铲初始安置点。
    why: 电铲数量约束与是否启用铲位的逻辑关系不易直接线性表达，先用线性规划布点可删除无效线路变量和冗余约束，缩小后续整数规划规模。
  - name: 最小总运量整数规划模型
    role: 以各铲位到各卸点的整数运输车次为决策变量，在供应、产量、装卸能力、矿石品位及设备数量约束下求最小总运输量。
    why: 运输车次具有离散性，且所有主要能力与品位约束均可线性化，因此整数线性规划能够直接给出可执行的线路车次方案。
  - name: 带优先级的多目标整数规划模型
    role: 依次优化总产量最大、岩石产量最大和总运量最小三个具有严格优先级的目标。
    why: 多个目标之间存在明确的业务优先顺序，采用序贯求解并将上一级最优值加入下一级约束，可避免简单加权造成高优先级目标被牺牲。
  - name: 电铲利用率上下界弹性约束模型
    role: 对已布置电铲设置最低利用率和最大利用率，保证设备具有基本经济利用水平，同时为卡车接续和现场波动预留余量。
    why: 只追求数学最优容易使部分电铲接近满负荷运行，导致调度弹性不足、实际不可执行；上下界约束能够在目标值和方案鲁棒性之间折中。
  - name: 卡车数量与线路配置模型
    role: 根据最优运输车次、线路循环时间和班次有效工作时间，计算总卡车需求及各线路所需的最少卡车数。
    why: 在假设卡车原则上不等待的条件下，车辆需求可由运输任务对应的累计作业时间确定，无需在主整数规划中同时引入大量车辆级调度变量。
  solution_flow: 整理铲位矿石与岩石供应量、铁品位、线路运行时间、装卸时间、班次长度和设备数量等数据→将供应量和产量要求统一换算为车次并计算线路最大运量→松弛整数约束求解线性规划，根据铲位利用率完成电铲初始布点→设置电铲最大、最小利用率并精简无效变量与约束→求解最小总运量整数规划，或按总产量、岩石产量、总运量的优先顺序逐级求解多目标整数规划→根据车次和循环作业时间计算卡车总数及线路车辆配置→通过不同利用率参数方案的目标值、设备利用均衡性、调度弹性和约束满足情况进行比较验证。
  validation: 采用多方案敏感性与可行性对比：改变电铲最大利用率和最低利用率阈值，比较总运量、吨公里、电铲数量、卡车数量及各铲位利用率；逐项核验铲位供应、卸点最低产量、装卸能力、矿石品位和设备总量约束；对接近满负荷但目标值更优的方案判定为弹性不足，并优先选择目标值略有损失但利用率更均衡、现场可执行性更高的方案，必要时额外增加一辆卡车作为调度冗余。
  visualization:
  - 铲位—卸点运输车次矩阵表
  - 各铲位电铲利用率对比表
  - 各线路卡车配置表
  - 不同利用率参数方案的目标值与设备数量对比图
  - 分层多目标求解流程图
  pitfalls_avoided:
  - 避免将运输车次按连续变量处理，因为车次必须为整数，直接采用线性规划结果会产生无法执行的分数车次。
  - 避免在主模型中同时刻画每辆卡车的逐时调度，因为这会显著增加变量规模；先优化线路车次，再依据累计作业时间配置卡车，可降低求解复杂度。
  - 避免令电铲利用率达到理论满负荷，因为装卸点不可能全班次连续作业且会受卡车接续影响，满负荷解通常缺乏现场可行性和抗扰动能力。
  - 避免只设置电铲最大利用率而忽略最低利用率，因为昂贵电铲若长期低负荷运行会造成设备配置不经济。
  - 避免用简单加权法合并产量、岩石产量和总运量目标，因为权重难以客观确定且可能破坏业务优先级；采用逐级锁定最优值的词典序优化。
  - 避免直接求解包含全部铲位与线路变量的大规模整数模型，因为大量未启用铲位对应的变量和约束会拖慢求解；先通过线性规划筛选电铲布点并精简模型。
  - 避免仅依据目标函数值选择方案，因为目标值最优的方案可能存在利用率过高、分布不均和弹性过小的问题；需同时考察设备均衡性与可实施性。
  innovation_points:
  - 采用“线性规划松弛布点—模型精简—整数规划求车次”的两阶段求解框架，以较低计算成本处理电铲选址和线路车次的组合优化。
  - 同时设置电铲最大与最低利用率，将调度弹性、设备经济性和现场可执行性显式纳入优化模型。
  - 以词典序方式依次实现总产量最大、岩石产量最大和总运量最小，准确表达生产目标的优先级。
  - 将线路车次优化与卡车数量计算分离，在保证业务逻辑的同时降低主模型规模，并可根据高负荷程度追加车辆冗余。
  - 不机械接受数学目标最优解，而是通过利用率参数敏感性分析在运输成本、设备均衡和方案鲁棒性之间进行多方案比选。
- id: 2017年全国数模题目讲解_A题CT系统参数标定及成像蔡志杰
  source_paper: 2017年全国数模题目讲解 2017年全国数模题目讲解_A题CT系统参数标定及成像蔡志杰
  problem_type: 优化+仿真+统计分析
  keywords:
  - CT系统参数标定
  - Radon逆变换
  - 约束最小二乘
  - 图像重建
  - 椭圆拟合
  context: 利用已知圆形标定介质的CT投影数据估计探测器间距、旋转角度、旋转中心及衰减系数，并据此重建未知介质的形状、位置和吸收率分布。
  models:
  - name: Beer-Lambert射线衰减模型
    role: 建立入射强度、射线路径长度与介质衰减系数之间的物理关系，并将CT测量值转化为沿射线的衰减积分。
    why: CT投影的本质是射线沿传播路径的衰减累积，该模型具有明确物理基础，可把成像问题转化为线积分反演问题。
  - name: 射线与圆或椭圆的解析求交模型
    role: 计算不同探测器射线穿过标定介质的弦长，为衰减系数和探测器间距标定提供理论路径长度。
    why: 标定介质几何形状已知，利用直线与圆、椭圆的交点判别式能够直接获得精确弦长，避免数值积分带来的额外误差。
  - name: 有界非线性最小二乘参数标定模型
    role: 通过最小化理论投影与实测投影之间的平方误差，依次估计衰减系数、探测器单元间距、首射线偏移及扫描角度。
    why: 投影数据存在离散误差和测量噪声，且待估参数以非线性形式进入弦长和投影表达式，约束最小二乘能够兼顾拟合精度与参数物理可行性。
  - name: 旋转中心几何标定模型
    role: 利用各扫描角度下投影平移量与旋转中心坐标之间的线性关系，估计旋转中心位置及其到参考射线的距离。
    why: 旋转中心偏移会使所有投影产生系统性错位，利用多角度几何方程联合估计比直接从单幅投影判断更加稳定。
  - name: 离散CT系统矩阵模型
    role: 将成像区域划分为像素，建立每条射线在各像素中的路径长度矩阵，并形成线性方程组以描述投影值与像素衰减系数的关系。
    why: 该模型完整刻画了CT离散反问题，能够把未知介质的二维吸收率重建转化为线性代数求解问题。
  - name: 逆Radon变换与滤波反投影模型
    role: 根据标定后的扫描角度和投影数据快速重建未知介质的二维衰减系数图像。
    why: 直接构造和求解大规模系统矩阵计算量大且易病态，逆Radon变换具有成熟、快速且适合多角度平行束CT数据的优势。
  - name: 阈值分割与一般二次曲线椭圆拟合模型
    role: 从重建图像中提取非零吸收区域的边界，并拟合椭圆方程以确定目标的中心、长短轴、方向和轮廓。
    why: 重建结果存在背景噪声和离散像素误差，先阈值化再进行椭圆拟合可将灰度图转化为可解释的几何参数。
  solution_flow: 读取已知圆形模板及多角度投影数据→依据Beer-Lambert定律将测量值表示为射线衰减积分→利用圆或椭圆弦长公式构造理论投影→根据有效探测器数量确定探测器间距和首射线偏移的物理边界→采用有界非线性最小二乘估计衰减系数、探测器间距和初始偏移→结合投影序列的平移关系逐角度标定扫描角度，并由多角度几何方程求旋转中心→将校正后的投影组织为正弦图→采用逆Radon变换或离散系统矩阵重建二维吸收率→通过阈值分割、边界提取和椭圆拟合获得未知介质的形状、位置及衰减参数→使用已知模板重建结果和投影残差检验模型。
  validation: 以几何尺寸和衰减系数已知的标定模板进行闭环验证：比较理论投影与实测投影的最小二乘残差，检查探测器间距、扫描角度和旋转中心是否满足物理约束与角度连续性；再使用标定参数重建已知模板，比较重建轮廓、中心、尺寸和衰减系数与真值的偏差，并可将重建图像重新正投影，与原始投影数据进行一致性检验。
  visualization:
  - 多角度投影正弦图
  - CT重建灰度图
  - 吸收率等高线图
  - 目标边界与椭圆拟合叠加图
  - 理论投影与实测投影残差曲线
  pitfalls_avoided:
  - 避免直接对含平方根的弦长表达式进行无约束优化，因为迭代点一旦超出圆域就会导致根号内为负并造成求解失败；通过代数平方形式重构残差并加入参数边界提高数值稳定性。
  - 避免仅凭单条射线或单个投影估计探测器间距，因为有效射线数量受边界截断和离散采样影响；利用有效探测器数量的上下界推导间距区间，使结果符合标定圆直径这一几何约束。
  - 避免将180个扫描角度完全独立拟合，因为噪声会造成角度跳变和累计错位；对相邻角度施加单调且增量不超过约2度的连续性约束，并利用切线几何先限定首角度范围。
  - 避免忽略坐标系与投影角定义之间的90度差异，因为这会导致重建图像整体旋转或镜像；在角度标定和逆Radon输入时统一射线方向、法线方向及图像坐标约定。
  - 避免直接求逆规模巨大的病态系统矩阵，因为像素数和射线数较大时存储量、计算量和噪声放大均十分严重；实际重建采用成熟的滤波反投影算法，并以系统矩阵模型作为理论依据。
  - 避免把重建背景中的微小非零灰度误判为真实介质，因为滤波反投影会产生振铃和离散噪声；根据衰减系数合理范围进行阈值截断，再开展轮廓识别和几何拟合。
  innovation_points:
  - 将复杂的CT系统联合标定拆分为衰减系数与探测器间距、扫描角度、旋转中心三个相互衔接的约束优化子问题，降低了直接高维联合优化的敏感性和计算难度。
  - 把圆或椭圆的解析弦长公式、有效射线数量和相邻扫描角度连续性共同转化为参数约束，使数据拟合同时满足CT设备的物理结构和扫描运动规律。
  - 采用“物理投影模型标定—逆Radon快速重建—阈值分割与椭圆拟合参数化解释”的组合框架，实现从原始投影数据到目标形状、位置和吸收率的完整反演。
- id: A题_自动化车床管理
  source_paper: A题 A题_自动化车床管理
  problem_type: 统计分析+优化
  keywords:
  - 自动化车床维护
  - 期望成本优化
  - 检查与刀具更换策略
  - 故障分布拟合
  - 穷举搜索
  context: 针对自动化车床加工过程中刀具及其他原因引起的随机故障，优化零件检查间隔和刀具更换周期，以最小化单位合格零件的长期平均费用。
  models:
  - name: 刀具故障正态分布拟合模型
    role: 刻画刀具首次故障前加工零件数X1的概率分布，并为后续故障概率和期望成本计算提供基础。
    why: 对100次刀具故障记录绘制直方图后呈近似钟形，利用极大似然估计得到均值和标准差，并通过卡方拟合优度检验确认正态分布假设可接受。
  - name: 其他故障几何分布模型
    role: 描述刀具故障以外的随机原因导致首次故障前的加工件数X2。
    why: 假设每加工一个零件发生其他故障的机会相同且相互独立，因此首次故障等待件数适合用几何分布表示，并依据刀具故障占95%、其他故障占5%的比例估计参数p。
  - name: 竞争故障最小值模型
    role: 将刀具故障与其他故障合成为工序总体首次故障间隔X=min(X1,X2)。
    why: 工序在任一故障源首先发生时即进入故障状态；在X1与X2相互独立的假设下，可通过两个生存函数的乘积得到总体故障分布。
  - name: 完全检查条件下的更新报酬期望成本模型
    role: 在检查结果能够准确反映工序状态时，计算预防性换刀和故障后换刀两类情形的周期期望总成本及单位零件平均成本。
    why: 目标同时包含检查费、预防性换刀费、故障调节费和检查滞后造成的不合格品损失，采用期望周期成本除以期望周期产量能够统一比较不同检查间隔n和换刀次数m。
  - name: 不完全检查条件下的期望成本模型
    role: 在单次抽检可能误判工序状态时，按故障发生位置、发现故障的检查时刻以及到期仍未发现故障等情形计算平均成本。
    why: 第二种情形存在漏检、误停机和故障发现滞后，必须显式计入合格品与不合格品的检测概率、误判损失、故障期间废品损失和最终换刀费用。
  - name: 变间隔检查优化模型
    role: 用随加工进程逐渐缩短的检查间隔改进等间隔检查方案。
    why: 总体故障概率并非均匀分布，随着累计加工件数增加，刀具故障风险上升；采用等差递减间隔可使检查频率与风险变化趋势更加匹配。
  - name: 粗细两阶段穷举搜索模型
    role: 在整数决策空间内寻找检查间隔n和换刀检查次数m的最优组合。
    why: 目标函数包含离散概率、分段成本和整数变量，难以直接求解析最优解；先以较大步长定位候选区域，再以步长1精细搜索，可以在可控计算量下获得全局候选最优解。
  solution_flow: 收集100次刀具故障前加工件数数据并绘制直方图→用极大似然估计正态分布参数并进行卡方拟合优度检验→依据95%与5%的故障构成估计其他故障的几何分布参数→由X=min(X1,X2)构造总体故障分布→分别建立完全检查和不完全检查条件下的周期期望成本模型→以检查间隔n、检查次数m及周期T=nm为决策参数→先在限定范围内粗粒度穷举，再在优选区域逐点搜索→得到模型1中n=18、m=20等最优策略→通过成本表及变间隔方案对结果进行比较和改进。
  validation: 首先使用直方图进行分布形态检查，再以卡方拟合优度检验验证刀具寿命服从正态分布的假设，统计量4.09小于显著性水平0.05下的临界值16.919；优化阶段通过不同n、m组合的费用表进行全局离散比较，并采用粗搜索后细搜索检验最优点附近的稳定性；最后将等间隔方案与风险递增条件下的变间隔方案比较，以单位零件平均费用是否下降作为改进有效性的验证标准。
  visualization:
  - 刀具故障件数分布直方图及正态拟合曲线
  - 检查间隔n与换刀次数m的平均费用矩阵表
  - 单位平均费用等高线图或三维曲面图
  - 等间隔与变间隔检查策略对比图
  pitfalls_avoided:
  - 避免只建立刀具单一故障源模型：其他故障虽然仅占5%，仍会改变总体故障间隔和维护成本，因此用几何分布建模并通过最小值竞争机制合并，而不是直接忽略。
  - 避免将故障发生时刻等同于故障发现时刻：故障通常在两次检查之间发生，检查滞后会持续产生不合格品，若不计算从故障发生到下一次发现之间的损失，会系统性低估长检查周期的成本。
  - 避免仅比较单次检查费或单次换刀费：检查过密和检查过疏分别造成检查成本上升与废品损失上升，因此以完整更新周期的期望总费用除以期望产量作为统一目标。
  - 避免混淆预防性更换与事后更换：周期结束仍正常时支付预防性换刀费K，发现故障后则支付调节恢复费用D，两种事件概率和成本结构不同，必须分开计算。
  - 避免假定抽检结果完全准确：复杂情形中存在漏检和工序正常时的误停机，模型显式加入不合格品检出概率、漏检概率及误判损失M，否则会高估抽检的识别能力。
  - 避免直接在过大的整数空间逐点盲搜：利用刀具寿命均值约为600件缩小T=nm的候选范围，再采用粗细两阶段搜索，在保留全局比较能力的同时降低计算量。
  - 避免默认等间隔检查必然最优：故障风险随累计加工件数变化，固定间隔可能在前期检查过密、后期检查过疏，因此进一步采用递减的变间隔策略。
  innovation_points:
  - 将正态分布的刀具故障与几何分布的其他随机故障统一为竞争故障模型，对占比仅5%的其他故障进行了显式处理。
  - 以更新周期期望成本和期望产量之比构造单位零件长期平均费用，同时纳入检查费、预防性换刀费、故障调节费和检查滞后废品损失。
  - 在不完全检查场景中按故障位置与首次检出时刻分层求期望，进一步考虑漏检、误停机和故障前后不合格率差异。
  - 依据故障风险随刀具使用时间上升的特征，将固定检查周期改进为等差递减的变间隔检查策略。
  - 采用先粗后细的整数穷举搜索，使复杂离散期望成本模型无需解析求导也能获得可实施的检查与换刀方案。
- id: A题_车床管理优化模型
  source_paper: A题 A题_车床管理优化模型
  problem_type: 统计分析+优化+仿真
  keywords:
  - 自动化车床管理
  - 定期检查
  - 预防性换刀
  - 期望管理成本
  - 枚举搜索
  - 蒙特卡罗仿真
  context: 针对自动化车床随机故障导致的不合格品损失，在检查、调节、换刀和故障损失之间权衡，以确定最优检查间隔与预防性换刀周期。
  models:
  - name: 刀具寿命分布拟合与卡方检验模型
    role: 根据历史刀具故障记录估计刀具寿命分布、平均故障间隔及相关概率参数。
    why: 故障发生时间具有随机性，需要先利用历史数据建立概率分布，才能计算不同换刀周期下的故障概率和期望成本。
  - name: 单位零件期望管理成本模型
    role: 将检查费、故障调节费、检查滞后损失和检查间隔内不合格品损失统一折算为单位零件成本。
    why: 不同成本的发生频率和计量尺度不同，转化为长期单位产出的期望成本后才能进行统一比较和优化。
  - name: 定期检查与预防性换刀联合优化模型
    role: 以检查间隔和换刀间隔为决策变量，在基础成本中加入预防性换刀费用及换刀后故障率变化，求取联合最优策略。
    why: 缩短检查间隔可减少次品但会增加检查费，提前换刀可降低故障风险但会增加刀具费，两类决策存在耦合，必须联合权衡。
  - name: 竞争故障率与平均故障间隔修正模型
    role: 综合刀具损坏和其他原因引起的故障，通过故障率叠加修正定期换刀后的平均故障间隔。
    why: 若只考虑刀具故障，会高估预防性换刀的改善效果；将其他故障源纳入可使成本估计更符合实际。
  - name: 一维枚举搜索与整数优化模型
    role: 遍历可行换刀周期，并对相应检查间隔及单位成本进行计算，选出满足整数生产约束的最优组合。
    why: 检查件数和换刀件数必须取正整数，且寿命分布对应的故障概率随换刀周期变化，直接使用连续解析解不能保证得到真实可执行的最优策略。
  - name: 动态自动检查调节模型
    role: 依据局部样本次品率和累计次品率进行状态判定，在确认故障后自动报警并调节工序。
    why: 联合使用短期与累计质量信息，可以减少将正常随机次品误判为设备故障所造成的停机损失。
  - name: 蒙特卡罗生产过程仿真模型
    role: 模拟随机刀具寿命、故障发现、检查滞后、次品产生和换刀过程，检验理论最优策略的长期平均成本。
    why: 解析模型依赖均匀故障位置和期望成本等简化假设，随机仿真能够验证策略在重复生产场景中的稳定性和可实现性。
  solution_flow: 整理历史刀具故障寿命和生产成本数据→采用卡方检验拟合刀具寿命分布并估计平均故障间隔、分位概率及其他原因故障率→按更新周期拆分检查费、调节费、检查滞后损失、区间次品损失和换刀费→利用竞争故障率修正预防性换刀后的平均故障间隔→建立以单位零件期望管理成本最小为目标、以检查间隔和换刀间隔为整数决策变量的模型→先由一阶条件获得检查间隔候选值，再对换刀周期进行枚举搜索并作整数邻域比较→通过蒙特卡罗仿真、成本曲线和参数灵敏度分析验证结果。
  validation: 先检查目标成本关于检查间隔呈下凸形态，并比较连续极值点附近整数方案；再通过蒙特卡罗方法重复模拟生产、故障、检查和换刀过程，将仿真得到的长期单位零件平均成本与理论期望成本对照；同时改变故障损失费、检查费、调节费、检查滞后数和寿命分布参数进行灵敏度与误差分析，考察最优策略的稳定性及其与实际生产常识的一致性。
  visualization:
  - 单位零件期望成本随检查间隔变化的下凸曲线
  - 检查间隔与换刀间隔对应的二维成本热力图或等高线图
  - 刀具寿命分布直方图与正态拟合曲线
  - 蒙特卡罗仿真成本分布箱线图
  - 关键参数灵敏度折线图
  - 自动检查调节算法流程图
  pitfalls_avoided:
  - 避免只最小化次品损失而忽略检查费、调节费和换刀费，因为过度检查或过早换刀虽然能降低故障损失，却可能使总管理成本反而上升。
  - 避免将故障发现时仅有一个不合格品作为默认情形，因为定期抽检存在发现滞后，故障在相邻检查点之间发生会累积多个不合格品，必须计算区间内平均次品数。
  - 避免忽略检查过程仍在连续生产的事实，因为检查耗时会额外产生滞后零件及损失，遗漏该项将系统性高估最优检查间隔。
  - 避免把预防性换刀视为能够消除全部故障，因为非刀具原因仍可能导致停机，需要采用故障率叠加修正平均故障间隔。
  - 避免直接把连续求导所得检查周期作为最终方案，因为生产件数只能取整数，应对理论极值点附近整数以及全部候选换刀周期进行搜索比较。
  - 避免仅凭局部次品率触发停机，因为正常工序也可能随机出现少量次品；结合局部与累计次品率可降低误报警和无故障停机损失。
  - 避免只报告优化结果而不检验随机波动，因为期望成本模型可能掩盖极端寿命和有限样本误差，需要用蒙特卡罗仿真及灵敏度分析检验稳健性。
  innovation_points:
  - 将检查费、调节费、检查滞后损失和检查区间内累积次品损失统一分摊到单位零件，形成可直接优化的长期期望成本表达式。
  - 特别刻画故障发生在两个检查点之间时的不合格品累积数量，并把检查期间不停机造成的额外滞后损失单独纳入成本。
  - 将定期抽检与预防性换刀作为两个相互耦合的决策变量联合优化，而非分别制定局部策略。
  - 利用刀具寿命经验分布计算提前失效概率，并通过竞争故障率综合刀具故障与其他故障源。
  - 采用解析极值、整数枚举搜索和蒙特卡罗仿真相结合的方法，兼顾模型可解释性、决策可执行性与随机环境下的可靠性。
  - 设计融合短期次品率与累计次品率的动态自动检查规则，以降低正常工序被误判为故障所产生的停机成本。
- id: A题论文_长江水质的评价预测模型及其实用性研究
  source_paper: A题论文 A题论文_长江水质的评价预测模型及其实用性研究
  problem_type: 综合评价+仿真+预测+统计分析+优化
  keywords:
  - 模糊综合评价
  - 灰色GM(1,1)预测
  - 单侧置信下限
  context: 针对长江流域多指标水质评价、污染源定位、未来水质变化预测及污水处理量控制问题，建立综合评价、扩散仿真与风险约束预测模型。
  models:
  - name: 模糊综合评价指数FCI模型
    role: 融合溶解氧、高锰酸盐指数、氨氮等指标，对各观测站逐月水质进行综合量化评价，并识别主要污染因子。
    why: 水质等级边界具有模糊性，且不同指标的量纲、优劣方向和重要程度不同，模糊关系矩阵与权重矩阵能够将多指标信息统一为可比较的综合指数。
  - name: 简化一维水质扩散模型
    role: 模拟污染物沿长江水流方向的输移与降解，并结合等效污染源概念辅助判定污染源位置。
    why: 长江干流具有明显的一维顺流输移特征，在忽略下游逆向影响并假设稳定排放的条件下，一维模型能够以较低复杂度刻画浓度、流速、流量和降解之间的关系。
  - name: 水质分类与相对比模型
    role: 将水质划分为A类可饮用水、B类污染水和C类严重污染水，并以B类或C类占比与A类占比的比值作为预测对象。
    why: 三类水质占比之和为1，存在明显线性约束；采用以较大占比为分母的相对比可降低波动影响，并减少直接预测多个相关比例时产生的不一致。
  - name: 带修正因子的灰色GM(1,1)模型
    role: 预测B类与A类、C类与A类的相对比以及未来污水排放总量，再还原得到各类水质比例和年度排污趋势。
    why: 历史样本数量较少且总体趋势较明显，灰色模型对小样本、贫信息时间序列较适用；修正因子可利用回验误差调整下一期预测的系统性偏高或偏低。
  - name: 正态总体均值单侧置信下限模型
    role: 根据历史长江总流量估计未来总流量在0.95和0.90置信水平下的保守下限。
    why: 未来流量波动明显且缺乏稳定时间趋势，将其视为随机变量并使用单侧置信下限，可在控制水质时避免直接采用均值而低估低流量年份的污染风险。
  - name: 插值阈值与污水处理量控制模型
    role: 由废水直排量与长江总流量之比和B、C类水质比例的对应关系，插值得到满足B类水不超过20%、C类水为0的最大排污强度，再计算各年的最低污水处理量。
    why: 水质比例与单位流量污染负荷的变化趋势较一致，利用经验插值可从水质控制目标反推出允许排污阈值，并结合流量置信下限形成具有风险水平的处理方案。
  solution_flow: 数据→整理各观测站逐月水质指标、历年A/B/C类水质比例、污水直排量和长江总流量，识别并修正异常年份→模型→用模糊综合评价模型生成时空FCI信息表，以一维扩散模型模拟污染物输移，用相对比和GM(1,1)预测水质与排污量，用正态单侧置信下限描述未来流量风险→参数→构造指标权重、模糊隶属关系矩阵和水质等级向量，估计GM(1,1)发展系数与修正因子，计算流量均值、标准差及t分位数，并插值得到最大排污强度0.0273→求解→获得各地区综合水质、主要污染因子、污染源定位结果、未来十年各类水质比例、排污总量及0.95和0.90置信水平下的年度污水处理量→验证→采用留出年份回验、残差和相对误差分析检验灰色预测，并通过发展系数判断中长期适用性，同时比较不同置信水平方案的环保风险与治理成本。
  validation: 灰色模型使用前7年数据拟合、后3年数据作样本外检验，比较预测值与实际值并计算残差和误差；同时检查发展系数绝对值是否小于0.3，以判断GM(1,1)用于中长期预测的适用性。综合评价结果通过干流与支流水质差异及已知污染较重站点进行合理性核验；污水处理方案则比较0.95与0.90两种置信水平下的允许排污量和处理量，开展稳健性与实际成本权衡。
  visualization:
  - 观测站—月份FCI时空信息表或热力图
  - A、B、C三类水质比例的未来十年趋势折线图
  - 预测值与实际值对比表或折线图
  - 不同置信水平下年度污水处理量对比图
  pitfalls_avoided:
  - 避免直接用单一水质指标判定总体水质，因为不同污染指标可能给出冲突等级；通过模糊隶属度和权重合成保留等级边界的不确定性。
  - 避免直接分别预测三个水质比例，因为WA、WB、WC之和为1，独立预测可能违反比例和约束；改为预测B/A和C/A两个相对比后统一还原。
  - 避免将突变年份直接输入趋势模型，因为异常值会显著改变GM(1,1)的累加趋势并放大长期预测偏差；论文对1998年及2003年异常数据进行剔除并用相邻年份均值或插值替代。
  - 避免仅以长江历史平均流量计算允许排污量，因为低流量年份的稀释能力更弱，按均值控制可能导致水质超标；采用单侧置信下限进行保守计算。
  - 避免忽略污水排放量与河流流量的共同影响，因为相同排污量在不同流量条件下产生的污染程度不同；使用废水直排量与总流量之比作为关键污染负荷指标。
  - 避免只追求最高置信水平而忽视实施成本，因为更保守的0.95方案会显著增加企业治理负担；通过比较0.95和0.90方案提出分阶段控制策略。
  innovation_points:
  - 构造FCI信息表，将模糊综合水质指数与主要污染因子同时映射到时间和空间两个维度，实现长江沿线水质的统一比较。
  - 引入等效污染源概念，并与简化一维水质扩散模型结合，以较低参数复杂度实现污染源定位和扩散仿真。
  - 将受总和约束的水质比例转换为相对比后使用带修正因子的GM(1,1)预测，兼顾小样本建模、比例约束和系统误差校正。
  - 把排污总量趋势预测、河流流量单侧置信下限和水质阈值插值结合起来，得到带置信水平的年度污水处理量方案。
  - 提出前期采用0.95高置信水平强化治理、后期采用0.90置信水平兼顾企业成本与积极性的动态管理思路。
- id: A题优秀论文_利用切片的二维空间相关操作实现血管的三维重建
  source_paper: A题优秀论文 A题优秀论文_利用切片的二维空间相关操作实现血管的三维重建
  problem_type: 统计分析+仿真
  keywords:
  - 二维空间相关
  - 快速傅立叶变换
  - 血管三维重建
  context: 根据连续二维血管切片图像，估计血管半径和各切片上的中轴线交点，并重建血管及其中轴线的三维空间形态。
  models:
  - name: 等半径球包络几何模型
    role: 将血管表示为沿中轴线连续排列的等半径球的包络面，建立切片轮廓、血管半径与中轴线交点之间的几何关系。
    why: 该假设使每张切片中半径最大的圆对应球心位于切片平面内的截面，其圆心可直接解释为中轴线与切片平面的交点。
  - name: 切片叠加投影与最短宽度估计模型
    role: 对全部二值切片进行像素或运算得到血管在平面上的投影，并在宽度稳定区通过两侧轮廓间的最短距离估计直径和半径。
    why: 投影中段的稳定宽度等于等径球包络体的直径，可在不依赖单张切片姿态的情况下得到模板半径，文中估计得到直径60像素、半径30像素。
  - name: 二维模板空间相关模型
    role: 以半径为30像素的空心圆作为模板，与每张切片进行二维相关运算，以相关峰位置定位最大截面圆的圆心。
    why: 相关值能够衡量模板与局部图形的重合程度，完全匹配时取得极大值，因此适合从切片中搜索指定半径的圆形边界。
  - name: 基于FFT的快速相关计算模型
    role: 利用相关定理，将空间域相关转换为切片频谱与模板频谱复共轭的乘积，再通过逆FFT得到相关图。
    why: 频域乘法可显著降低二维相关的计算量，使大量切片的模板匹配过程更加快速、简便。
  - name: 多峰中间点稳健定位模型
    role: 当像素离散化导致相关图出现多个并列峰值时，将峰值点按横坐标排序并选取中间点作为当前切片的中轴线交点。
    why: 相邻候选峰通常来自最大圆附近难以区分的近似圆，结合血管连续性和局部中轴线近似直线的假设，取中间位置可降低离散误差造成的定位偏移。
  - name: 复合多项式曲线拟合模型
    role: 对各切片得到的离散中轴线坐标进行分段或复合多项式拟合，平滑局部扭折并形成连续三维中轴线。
    why: 直接连接像素级定位点会产生4至5处明显扭折，多项式平滑能够利用中轴线的连续性改善三维曲线形态。
  - name: 等半径球包络三维仿真模型
    role: 沿拟合后的三维中轴线生成半径固定的球包络面，完成血管实体的三维造型并支持重新切片。
    why: 该模型与前述几何假设一致，可将半径和中轴线参数转化为完整血管表面，并为结果验证提供可重切片的仿真对象。
  solution_flow: 数据：读取0至99号二值血管切片并进行像素或叠加，形成平面投影；模型：采用等半径球包络描述血管，在投影稳定区测量最短宽度，并用空心圆模板对各切片进行二维相关；参数：得到血管直径60像素、半径30像素，并按FFT周期边界将模板圆心设置在频域计算对应的坐标原点；求解：计算切片与模板的FFT，将切片频谱乘以模板频谱的复共轭后进行逆FFT，提取相关峰，对多峰切片选取峰值集合中间点，再用复合多项式拟合三维中轴线并生成等半径球包络血管；验证：对重建血管重新切片，与原始切片逐像素比较，并检查中轴线三维图及各坐标平面投影。
  validation: 采用几何一致性与回代重构双重验证：首先检查各切片定位点是否满足中轴线连续性，并通过三维中轴线及其在X-Y、Z-Y、X-Z平面的投影观察异常扭折；其次从重建的三维血管模型中按原位置重新生成切片，与原始位图比较，结果轮廓仅相差约1像素，说明半径估计、中心点定位和包络重建具有较好一致性。
  visualization:
  - 全部切片像素或叠加形成的血管平面投影图
  - 空心圆与实心圆模板及其相关结果对比图
  - 各切片二维相关强度图
  - 三维中轴线曲线图
  - 中轴线在X-Y、Z-Y和X-Z平面的投影图
  - 血管三维实体造型及重构切片对比图
  pitfalls_avoided:
  - 避免使用实心圆作为相关模板：实心圆与最大圆附近的许多区域都有较大面积重叠，导致目标位置和非目标位置的相关值差异很小；改用空心圆可突出边界匹配，使相关峰的对比度更高。
  - 避免忽略FFT相关运算的循环边界和模板原点偏移：若模板中心偏离坐标原点，相关图会产生整体平移；将空心圆分置于图像四角，使其圆心对应原点，可保证相关峰坐标与原切片坐标一致。
  - 避免把多个并列最大相关峰误判为多个真实中轴线交点：切片像素化会形成锯齿边界，当中轴线与切片法向夹角较大时，最大圆与邻近小圆难以分辨；因此结合连续性假设对峰值集合取中间点，而不是任取一个峰。
  - 避免直接连接离散中心点形成不光滑中轴线：像素误差和多峰定位会造成局部扭折，使用复合多项式拟合可抑制高频抖动并保持整体连续趋势。
  - 避免仅凭三维图形外观判断重建质量：视觉上合理的模型仍可能与原始数据不一致，因此对重建模型重新切片并与输入切片逐像素比较。
  - 避免混淆坐标方向：论文采用的X轴方向与原题要求相反，实际复现或解释结果时需统一坐标系，必要时对X坐标进行方向变换。
  innovation_points:
  - 将图像相关作为圆形截面相似度度量，并利用FFT和逆FFT快速定位每张切片中的最大圆圆心，从而近乎一步获得中轴线离散坐标。
  - 采用空心圆边界模板替代实心圆模板，放大最大圆与邻近相似区域之间的相关差异，提高峰值检测的辨识度。
  - 利用FFT周期边界条件将圆模板拆分放置在图像四角，使模板中心等效位于坐标原点，避免相关结果发生坐标平移。
  - 针对离散位图引起的多峰现象，引入峰值集合中间点和中轴线连续性约束，提高中心点估计的稳健性。
  - 提出利用4f光学系统和全息频谱模板直接实现相关运算的方案，可减少切片图像数字化存储造成的信息损失并提升定位精度。
- id: A题_最优刀具更换周期上界_检查间隔下界的证明
  source_paper: A题 A题_最优刀具更换周期上界_检查间隔下界的证明
  problem_type: 统计分析+优化
  keywords:
  - 刀具寿命截尾正态分布
  - 预防性更换周期
  - 检查间隔优化
  context: 根据刀具故障寿命数据建立随机故障模型，联合优化刀具预防性更换周期与产品检查间隔，使单位合格产品的平均生产费用最小。
  models:
  - name: 刀具寿命截尾正态分布模型
    role: 描述刀具在生产一定数量零件后发生故障的概率，并为期望费用与合格品产量计算提供概率基础。
    why: 对100次刀具故障时的产量数据分析表明，刀具寿命可近似服从参数为均值600、标准差196的截尾正态分布。
  - name: 单位合格产品平均费用模型
    role: 以一个刀具更新周期内的期望总费用H(T,n)与期望合格品数量L(T)之比G(T,n)=H(T,n)/L(T)作为优化目标。
    why: 比值目标同时计入换刀费、检查费、故障损失和不合格品损失，能够统一比较不同更换周期与检查间隔的经济性。
  - name: 预防性更换与故障更换联合决策模型
    role: 规定刀具寿命X小于T时故障后更换，X不小于T时在周期T进行预防性更换，并将T与检查间隔n作为联合决策变量。
    why: 该策略同时覆盖随机故障更换和计划性更换两种实际情形，能够在故障风险与过早换刀成本之间取得平衡。
  - name: 导数单调性与解析边界模型
    role: 通过对目标函数关于n求偏导，以及研究生存函数乘积x[1-F(x)]的单调性，推导最优检查间隔下界和最优换刀周期上界。
    why: 解析边界可以缩小整数优化的搜索区域，并为最优解范围提供严格证明，而不是仅依赖数值枚举。
  - name: 基准方案支配比较模型
    role: 选择T1=350且F(T1)=0.1的可行方案，通过交叉相乘比较H(T,n)L(T1)-H(T1,n)L(T)，排除T大于等于551的方案。
    why: 费用目标是分式形式，交叉相乘可避免直接处理两个比值，并能利用概率与单调性下界完成全区间支配证明。
  solution_flow: 收集100次刀具故障产量数据→识别并设定刀具寿命截尾正态分布参数μ=600、σ=196→按故障更换和预防性更换两种情形构造期望总费用H(T,n)与期望合格品数量L(T)→建立平均费用目标G(T,n)=H(T,n)/L(T)→对n求偏导并证明当n小于sqrt(2tμ/f)时目标随n下降，得到整数下界n≥8→证明x[1-F(x)]在指定区间单调递减→选取基准周期T1=350进行分式目标支配比较→先证明最优T<600，再利用F(551)=0.4及单调性将上界收紧为T<551→在有限区域内搜索或比较候选整数解。
  validation: 采用解析证明与数值代入相结合的验证策略：首先通过一阶、二阶导数证明x[1-F(x)]的单调性；其次由目标函数关于n的偏导证明n≥8；然后验证充分条件以排除T≥600；最后代入T1=350、m(T1)=34、F(551)=0.4，证明对任意T≥551和n≥8均有G(T,n)>G(350,n)，从而验证最优周期上界T<551。
  visualization:
  - 刀具寿命概率密度函数、分布函数与生存函数曲线
  - 平均费用G(T,n)关于更换周期T和检查间隔n的三维曲面或等高线图
  - T[1-F(T)]单调性曲线及T=551上界标记图
  - 不同检查间隔下平均费用随更换周期变化的对比折线图
  pitfalls_avoided:
  - 避免只最小化单周期总费用：不同更换策略对应的合格品产量不同，使用H(T,n)/L(T)才能公平比较单位合格品成本。
  - 避免把故障后到下一次检查之间的不合格品数量固定为n：故障位置在检查区间内具有随机性，模型采用(n+1)/2作为平均不合格品数量。
  - 避免仅靠网格枚举宣称全局最优：论文通过偏导、单调性和基准方案支配关系严格排除n<8与T≥551的区域。
  - 避免忽略n的整数属性：解析式给出的下界为sqrt(2tμ/f)=sqrt(60)，实际决策需向上取整，因此得到n≥8。
  - 避免受公式排版或OCR影响误读检查间隔下界：若误写为2tμ/f会得到60，与论文的n≥8结论矛盾；结合求导中的n平方项可确认正确表达式含平方根。
  - 避免在正态尾部直接使用缺乏证明的经验判断：通过研究x[1-F(x)]的一、二阶导数，严格确定其在相关区间内递减。
  innovation_points:
  - 从平均费用分式目标出发，解析推导出最优检查间隔的一般下界sqrt(2tμ/f)，将连续分析结果转化为整数决策边界。
  - 构造x[1-F(x)]的单调性引理，并将其用于控制尾部区间的期望合格产量项，从理论上排除过长的换刀周期。
  - 采用可行基准方案与所有候选方案进行交叉乘积支配比较，在不直接求解复杂分式随机优化问题的情况下，将最优换刀周期上界由均值600进一步收紧到551。
- id: B题_订购和运输钢管的最优方案
  source_paper: B题 B题_订购和运输钢管的最优方案
  problem_type: 优化+仿真
  keywords:
  - 混合整数二次规划
  - 多式联运最短路
  - 钢管订购运输优化
  context: 在钢厂产能、最低开工产量和管线各区段需求约束下，确定钢管采购来源、运输目的地及双向铺设数量，使采购、运输与铺设总费用最小。
  models:
  - name: 多运输方式最短费用路径模型
    role: 计算各钢厂到各管线节点的最小单位运输费用矩阵，为总费用优化模型提供运输成本系数。
    why: 运输网络同时包含公路和铁路，且铁路运价为分段函数，不能直接以几何距离或单一路程作为运输成本，需要先将不同运输方式统一转换为费用权重后求全局最短费用路径。
  - name: Floyd全源最短路模型
    role: 分别求铁路、公路局部最短路径，再对融合后的费用矩阵求任意两点间的全局最小运输费用。
    why: 网络节点数量有限且需要同时获得多个钢厂到多个管线节点的费用，Floyd算法适合一次性计算全源点对最短路，并可同步保存路径矩阵。
  - name: 混合整数二次规划模型
    role: 联合决定钢厂是否开工、各钢厂向各节点的供货量以及节点向各方向的铺设量，以最小化采购费、运输费和铺设费之和。
    why: 钢厂开工状态是0-1变量，供货与流量平衡是线性约束，而沿管线逐段铺设产生等差累积费用，对铺设量表现为二次函数，因此适合采用混合整数二次规划。
  - name: 成本差额优先级与变量降维模型
    role: 依据不同钢厂向同一节点供货的单位成本差，判断供货优先级并剔除明显高成本的运输变量，缩小优化规模。
    why: 完整运输变量矩阵较大，且远距离交叉运输通常受成本支配；利用成本差额和空间位置进行预分析，可在不显著损害最优性的前提下减少计算量。
  - name: 参数灵敏度与情景仿真模型
    role: 分析钢厂售价和产能上限变化对最优购运方案及总费用的影响，识别关键钢厂和产能扩张的边际价值。
    why: 价格与产能具有不确定性，仅给出单一最优方案不足以支持决策，需要通过参数扰动和重复优化检验方案稳定性及资源扩建收益。
  - name: 树形管网多支路扩展模型
    role: 将线性管道上的左右铺设变量推广为多个支路铺设变量，以处理存在分叉节点的树形管网。
    why: 线性管道的双向流量表达无法覆盖三支路及以上节点，增加支路变量和对应区段平衡约束后，可保持原有费用结构并推广到一般树形网络。
  solution_flow: 整理钢厂价格、产能、铁路与公路网络、分段运价、管线节点及区段长度数据→分别构造铁路和公路邻接权矩阵→使用Floyd算法求各运输方式的局部最短路，将路程按各自运价转换为费用并融合，再次求解得到钢厂至节点的最小运输费用矩阵→建立包含钢厂启用变量、供货量和各方向铺设量的混合整数二次规划，设置产能、最低开工量、节点流量守恒、区段需求和边界约束→根据单位成本差、地理位置和产能上限判断供货优先级并压缩变量范围→使用Lingo求得最优订购、运输和铺设方案→对售价及产能进行1%至10%等幅度扰动并重新求解，比较目标值与方案变化→将双向铺设结构扩展为多支路结构并求解树形管网情景。
  validation: 采用多层验证：先通过最小费用矩阵和空间位置进行定性判断，检查最优解是否符合就近低成本供货规律；再核验各钢厂供货量是否满足不开工为零、开工不少于500且不超过产能上限，节点到货量是否全部用于铺设，各区段铺设量是否恰好等于区段长度；将分析得到的供货范围、满负荷钢厂和停产钢厂与Lingo数值解交叉验证；最后通过价格和产能扰动仿真检验方案稳定性，并利用边际成本变化解释关键参数的影响方向和饱和现象。
  visualization:
  - 钢厂—铁路—公路—管线节点运输网络图
  - 钢厂到管线节点最小单位费用热力图
  - 钢厂—节点最优供货流向图
  - 产能变化率—总费用下降率灵敏度曲线
  - 不同钢厂参数扰动结果对比表
  pitfalls_avoided:
  - 避免直接把物理距离当作运输成本，因为铁路采用分段运价且公路与铁路单位运费不同；先分别求局部最短路并转换成费用权重，才能正确比较多式联运方案。
  - 避免只考虑采购价而忽略运输费和铺设费，因为低出厂价钢厂可能距离过远，且集中在单个节点卸货会增加逐段铺设的二次累积费用，三项成本必须联合优化。
  - 避免把钢厂产能约束仅写成供货量不超过上限，因为题目规定钢厂一旦启用至少生产500单位；引入0-1启用变量并设置最低开工量，防止出现少量供货但仍被视为可行的失真方案。
  - 避免遗漏管线端点条件，因为首节点不能向左铺设、末节点不能向右铺设；加入y1=0和z15=0可防止模型向管线范围之外分配钢管。
  - 避免只做节点到货平衡而不做区段需求平衡，因为到货量全部用完并不代表每一段管道都得到满足；通过相邻节点的相向铺设量之和等于区段长度，保证管线连续完整铺设。
  - 避免未经分析就求解完整变量矩阵造成计算冗余；利用明显高成本区域、成本支配关系和供货优先级压缩候选变量，同时保留合理的备选供货范围，降低求解规模。
  - 避免将线性管道的左右铺设变量机械用于树形管网，因为分叉节点存在三条或更多支路；对每条支路单独设置铺设变量和流量平衡约束，防止支路需求被遗漏。
  innovation_points:
  - 将铁路和公路的不同计费规则统一映射为费用距离，采用“分运输方式局部最短路—费用矩阵融合—全局最短路”的两阶段方法生成多式联运最低成本矩阵。
  - 把钢管采购、运输和沿线铺设统一纳入一个混合整数二次规划，其中二次项刻画从卸货节点向外逐段铺设时运距递增形成的累积费用。
  - 利用单位成本差额而非仅按最低单位成本排序，衡量稀缺产能分配给不同节点所带来的机会收益，据此确定供货优先级并辅助降维。
  - 通过价格偏导、产能扰动和重复优化识别关键钢厂，揭示扩产收益随需求被满足而降为零的边际饱和特征。
  - 将线状管网模型推广到树形管网，通过增加分支铺设变量与分支区段约束保持模型结构的可扩展性。
- id: A题_自动化车床管理(1)
  source_paper: A题 A题_自动化车床管理(1)
  problem_type: 统计分析+优化+仿真
  keywords:
  - 自动化车床管理
  - 检查间隔优化
  - 预防性换刀
  - 期望损失
  - 故障率
  - 蒙特卡罗仿真
  context: 针对自动化车床连续加工中随机故障、质量检查与定期换刀之间的成本权衡，确定使单个零件长期期望损失最小的检查和换刀策略。
  models:
  - name: 无故障工作时间概率分布模型
    role: 根据刀具故障记录估计工序无故障工作时间的概率分布，为期望损失计算提供随机输入。
    why: 工序故障具有随机性，必须利用历史故障数据进行分布拟合；刀具故障约占全部故障的95%，因此用修正后的刀具寿命正态分布近似工序寿命具有一定合理性。
  - name: 更新周期期望损失率优化模型
    role: 以相邻两次刀具更新之间为一个周期，分别计算周期期望损失E(L)和期望周期长度E(T)，最小化长期平均成本C=E(L)/E(T)。
    why: 检查、故障调节、不合格品和预防性换刀费用均在更新周期内发生，采用更新报酬思想可以把长期生产效益统一转化为单位产出的平均期望损失。
  - name: 固定检查间隔与定期换刀联合优化模型
    role: 令换刀间隔满足Σ1=mΣ0，在不同故障发生区间下分段计算费用，并通过遍历搜索联合确定检查间隔Σ0和换刀间隔Σ1。
    why: 检查过频会增加检测费用，检查过疏会增加故障后未及时发现所产生的不合格品损失；定期换刀同样存在提前更换费用与故障风险之间的权衡，且Σ1=mΣ0便于现场执行。
  - name: 基于危险率的变检查间隔模型
    role: 利用危险率h(x)=p(x)/[1-F(x)]构造随设备年龄变化的检查频率n(x)=(f/t)h(x)，使稳定期检查较疏、故障高发期检查较密。
    why: 等间隔检查没有利用故障风险随使用时间变化的信息；危险率刻画设备已运行至x仍未故障时下一时段发生故障的条件风险，可用于自适应安排检查。
  - name: 蒙特卡罗仿真模型
    role: 随机生成无故障工作时间样本，在给定检查与换刀策略下模拟周期损失和周期长度，并搜索近似最优方案。
    why: 仿真能够独立复现随机故障和离散检查过程，用于核验解析期望模型的结果及其稳定性。
  - name: 灵敏度与参数误差分析模型
    role: 改变正常状态不合格率P、故障状态不合格率q、误停机损失以及寿命分布均值和标准差，观察最优策略与单位损失的变化。
    why: 寿命分布和质量参数均由样本估计或近似得到，分析参数扰动可识别关键影响因素并检验结论的稳健性。
  solution_flow: 收集刀具故障记录并绘制频数直方图、进行正态分布检验→根据刀具故障占比修正工序无故障时间分布参数→以刀具更新为周期，分故障发生在检查区间内或超过换刀时刻两种情形建立E(L)与E(T)→设置Σ1=mΣ0并遍历整数检查间隔和换刀倍数，最小化C=E(L)/E(T)→得到固定间隔策略Σ0=18、Σ1=342→利用危险率构造递减的变检查间隔方案→通过蒙特卡罗仿真、灵敏度分析和分布参数误差分析验证结果。
  validation: 首先从拟合层面检验无故障时间近似服从正态分布；其次生成随机寿命样本，对不同检查和换刀参数进行蒙特卡罗搜索，将仿真结果与解析模型结果比较；最后分别扰动P、q、误停机损失以及寿命分布均值和标准差，考察目标值和策略变化。论文发现解析解与仿真解较接近，寿命参数小幅扰动引起的相对误差有限，但仅模拟1000次导致仿真精度不足，应通过扩大样本量、设置随机种子并给出置信区间进一步改进。
  visualization:
  - 无故障工作时间频数分布直方图及正态拟合图
  - P-C与q-C灵敏度散点图或折线图
  - 检查间隔序列变化表或阶梯图
  - 解析结果与蒙特卡罗结果对比表
  - 参数扰动与相对误差表
  - 自动检查和调整算法流程图
  pitfalls_avoided:
  - 避免只最小化单周期总费用：不同策略会改变周期长度，直接比较E(L)会偏向短周期，因此使用E(L)/E(T)衡量长期单位产出的平均损失。
  - 避免仅考虑检查费用而忽略故障发现延迟：故障可能发生在两次检查之间，必须计入从故障时刻到下一次检查期间产生的不合格品损失。
  - 避免将检查间隔和换刀间隔完全独立设置：约束Σ1=mΣ0可保证定期换刀前必有检查，也使策略便于现场按整数件数执行。
  - 避免把随机故障时刻当作确定值：通过概率密度分段积分计算不同故障区间的期望费用和周期长度，保留故障寿命的不确定性。
  - 避免盲目使用等间隔检查：设备危险率随使用时间变化，采用前疏后密的变间隔检查可减少低风险阶段的无效检测并加强高风险阶段监控。
  - 避免仅凭单一最优结果下结论：使用蒙特卡罗仿真、灵敏度分析和参数误差分析交叉检验，以识别模型对估计误差和质量参数的依赖。
  - 避免过度相信有限次数仿真：论文明确指出1000次模拟偏少、随机误差较大，因此仿真结果只能作为近似验证，不能直接替代解析期望模型。
  - 避免把正态寿命近似视为绝对事实：工序寿命由刀具寿命近似得到，需检验分布并扰动均值和标准差评估近似误差。
  innovation_points:
  - 将质量检查和预防性换刀统一为更新周期内的长期平均期望损失率优化问题，实现两类维护决策的联合权衡。
  - 利用危险率把设备年龄与检查频率联系起来，提出稳定期检查间隔长、故障高发期检查间隔短的非等间隔策略。
  - 将解析积分、离散遍历搜索与蒙特卡罗仿真结合，用仿真对理论最优策略进行独立核验。
  - 同时考察正常状态不合格率、故障状态不合格率和寿命分布参数，识别出正常状态不合格率P对长期成本更敏感，为实际质量控制提供管理重点。
- id: A题论文_长江水质的评价预测模型
  source_paper: A题论文 A题论文_长江水质的评价预测模型
  problem_type: 综合评价+预测+优化+统计分析
  keywords:
  - 变权综合评价与Borda排序
  - 一维水质模型
  - 灰色预测与二元线性回归
  context: 基于长江多观测站、多月份的水质与水文数据，对流域水质进行综合评价，识别主要污染源江段，预测未来水质趋势，并确定污水处理需求。
  models:
  - name: 指标差异化归一化模型
    role: 将pH、溶解氧、氨氮和高锰酸盐指数转化为方向一致、尺度统一的污染度指标。
    why: 不同指标的污染机理和量纲不同：pH偏离中性时污染度增大，溶解氧越高污染度越低，而氨氮和高锰酸盐指数越高污染越严重，因此不能使用同一种标准化公式。
  - name: Logistic变权综合评价模型
    role: 依据指标所处水质等级动态确定污染权重，并加权计算各观测站逐月的综合污染值。
    why: 水质类别具有由最差指标决定的“不越界性”，固定权重容易掩盖单项严重污染；Logistic心理函数能够强化明显的等级差异，同时弱化同一等级内的小幅波动。
  - name: Borda综合排序模型
    role: 汇总17个观测站在28个月中的逐月排序，形成跨月份的总体水质污染排名。
    why: 逐月污染值存在时间波动，直接求均值可能受异常月份和指标尺度影响；Borda法利用名次信息实现多时段排序集结，结果直观且稳健。
  - name: 稳态一维对流降解水质模型
    role: 描述污染物沿河段输移和降解过程，并结合上下游浓度、流量和河段长度估算各江段污染物排放量。
    why: 长江干流可近似视为沿程输移的一维系统；在月尺度稳定、断面均匀且弥散相对流速较弱的假设下，对流扩散方程可简化为指数衰减模型。
  - name: 排污口上下游情景平均模型
    role: 分别假设排污口位于河段上游和下游，计算两种边界情景下的排污量并取平均，识别主要污染源江段。
    why: 实际排污口位置未知，上下游两种假设可形成排污量估计的代表性边界，取均值能够降低单一位置假设导致的系统偏差。
  - name: 年总流量均值预测模型
    role: 以历史多年平均流量作为未来10年的年总流量输入。
    why: 历史总流量围绕稳定水平随机波动且整体变化较小，在缺少显著趋势时使用均值比复杂外推模型更简洁。
  - name: GM(1,1)灰色预测模型
    role: 建立年排污量与时间的关系，预测未来10年的排污总量。
    why: 历史年度样本较少且排污量具有发展趋势，灰色模型适用于小样本、信息不完全条件下的趋势预测。
  - name: 二元线性回归模型
    role: 分别建立可饮用水比例和中度污染水比例与年总流量、年排污量之间的关系，并按枯水期、丰水期、水文年及全流域、干流、支流分类预测。
    why: 各级水质比例同时受到水量稀释作用和排污负荷影响，二元回归可定量分离两类因素，并便于开展多情景预测。
  - name: 极限载污量约束下的污水处理需求模型
    role: 在水质比例约束基础上求得长江极限载污量，并以预测排污量减去允许排污量，计算未来逐年的最低污水处理量。
    why: 治理目标不是简单预测污染，而是确保排放不超过水体承载上限，因此需要将预测结果转化为满足环境约束的处理需求。
  solution_flow: 收集17个观测站28个月的pH、溶解氧、氨氮和高锰酸盐指数数据以及历史流量、排污量和各级水质比例数据→按指标污染机理分别进行谷形、反向隶属度和极差归一化→通过水质等级限值和Logistic函数确定动态权重，计算逐站逐月综合污染值→采用Borda法汇总28个月名次并形成17个站点的综合排序→将观测站划分为若干江段，利用稳态一维对流降解模型，在排污口位于上游和下游两种情景下反演排污量并取均值，识别高锰酸盐指数和氨氮的主要污染源江段→用历史均值估计未来总流量，以GM(1,1)预测未来排污量→拟合水质比例关于总流量和排污量的二元线性回归模型，预测未来可饮用水和污染水比例→加入水质控制约束求极限载污量，以预测排污量与允许排污量之差计算逐年最低污水处理量→通过等级不越界检查、模型拟合检验和结果趋势合理性分析进行验证。
  validation: 评价模型通过检查变权设置能否保持“最差指标决定水质等级”的不越界性，并比较逐月排序与水质类别的一致性；污染源模型比较排污口位于河段上游、下游两种边界情景的估计结果，以情景均值降低位置不确定性；GM(1,1)和二元回归应利用历史拟合残差、相对误差、决定系数及显著性检验评价预测可靠性，并检查预测水质比例是否位于0到100%之间；最终结果还需通过可饮用水比例随排污量增长而下降、处理量非负且排放不超过极限载污量等物理与环境约束进行合理性验证。
  visualization:
  - 17个观测站Borda综合排名表或水平条形图
  - 各观测站逐月综合污染值热力图
  - 各江段氨氮和高锰酸盐指数排污量对比柱状图
  - 历史及未来排污量GM(1,1)趋势折线图
  - 未来可饮用水与污染水比例变化折线图
  - 未来10年最低污水处理量柱状图
  pitfalls_avoided:
  - 避免对所有水质指标采用统一的正向极差标准化，因为pH具有偏离中性后两侧污染度均增大的谷形特征，溶解氧则与污染程度反向变化，统一处理会造成评价方向错误。
  - 避免使用固定权重简单加权，因为单项指标严重超标可能被其他良好指标抵消，导致综合评价跨越实际水质等级；变权函数通过提高严重污染指标的权重保持等级不越界。
  - 避免仅依据单月数据判断站点总体水质，因为水质存在季节性和随机波动；Borda法聚合28个月名次，可减少个别异常月份对总体排序的支配。
  - 避免在排污口位置未知时直接采用单一位置反演排污量，因为污染物经历的输移降解距离不同会显著改变估计结果；设置上游、下游两种情景并取均值可缓解位置误差。
  - 避免在稳态一维模型中无条件忽略所有输移机制；论文仅在月内浓度近似稳定、断面沿程均匀且弥散作用相对较小时忽略时间项和弥散项，否则简化模型可能失真。
  - 避免只按时间趋势预测水质比例，因为水质同时受总流量的稀释能力和排污量影响；二元回归将两类关键驱动因素共同纳入。
  - 避免将预测排污量直接当作污水处理量，因为水体本身具有一定环境容量；应先求极限载污量，再计算超过承载能力的部分，并保证处理需求非负。
  - 避免忽略比例预测的边界约束，因为线性回归可能给出小于0%或大于100%的结果；外推时必须进行区间检查，必要时采用截断或有界回归修正。
  innovation_points:
  - 依据不同水质指标的物理含义分别构造谷形、递减型和极差型标准化函数，使归一化结果统一表达污染程度。
  - 将水质等级不越界原则与Logistic心理函数结合形成动态权重，突出单项严重污染对综合水质的决定作用。
  - 采用“逐月变权评价+Borda跨期集结”的两层排序框架，同时保留月度差异和长期综合表现。
  - 针对排污口位置不确定性设置河段上游与下游两种边界情景，并以情景平均排污量识别主要污染源。
  - 构建“排污量灰色预测—水质比例回归预测—极限载污量约束—处理量计算”的评价、预测与治理闭环。
- id: A题论文_基于回归分析的长江水质预测与控制
  source_paper: A题论文 A题论文_基于回归分析的长江水质预测与控制
  problem_type: 综合评价+统计分析+仿真+预测+优化
  keywords:
  - 长江水质
  - 污染源定位
  - 回归预测与控制
  context: 基于长江沿线多站点的水质与水文监测数据，综合评价水质现状、识别主要污染源，并预测和控制未来水污染发展趋势。
  models:
  - name: 频度统计模型
    role: 统计各水质等级及主要污染物超标事件的出现频率，量化长江整体水质和污染物的时空分布特征。
    why: 水质等级和超标次数均属于离散统计信息，频度与比例能够直观反映不同年份、站点和污染类型的严重程度。
  - name: 标准化综合评价模型
    role: 对不同站点的氨氮、溶解氧和高锰酸盐指数进行无量纲化，并构造多污染物综合排序指数。
    why: 各项水质指标的单位、量纲和波动范围不同，不能直接相加比较，标准化后才能进行跨指标综合评价和地区排序。
  - name: 一维河道水质模型
    role: 描述污染物沿河流方向的输移与一阶降解，并结合流量、流速、站点距离和质量守恒反推各河段的污染物纳入量。
    why: 长江干流河长远大于河宽，且流速较大，污染物变化主要由纵向推移和降解决定，因此可忽略横向、竖向梯度及较弱的扩散作用。
  - name: 一阶污染物降解模型
    role: 用指数衰减关系计算污染物从上游断面输移至下游断面后的剩余浓度。
    why: 污染物自然净化过程可近似服从一阶反应动力学，模型形式简单，并能与河段旅行时间直接结合。
  - name: 质量守恒污染源反演模型
    role: 利用相邻断面的污染物通量差和河段内自然降解量，估算河岸及支流向各河段排入的污染质量。
    why: 仅比较上下游浓度会忽略流量变化和自然降解，采用污染物质量通量平衡能够更合理地定位主要污染河段。
  - name: 指数预测模型
    role: 预测未来十年的废水排放总量，为长期水质趋势判断提供外生驱动信息。
    why: 历史废水排放量具有随时间增长的趋势，指数模型适合刻画具有相对增长率特征的排放序列。
  - name: 正态分布模型
    role: 对长江总流量进行分布验证与随机模拟，为水质比例和污染控制分析提供流量情景。
    why: 在缺少完整未来水文参数时，可用概率分布概括总流量的随机波动，并生成用于预测分析的流量样本。
  - name: Logistic预测模型
    role: 预测不可饮用水占总流量比例等具有上下界的水质比例指标。
    why: 水质比例限定在0到100%之间，Logistic模型可以避免长期预测产生超出合理范围的比例值，并刻画非线性增长趋势。
  - name: 线性回归模型
    role: 拟合水质等级比例随时间及污染排放变化的趋势，并作为未来水质预测和控制量反推的基础。
    why: 模型结构清晰、参数易估计，适合在水文和水质机理参数不足时进行宏观趋势预测，也便于设置污染比例控制目标。
  - name: 回归控制模型
    role: 根据预测关系反推所需的污水处理或排放控制强度，使劣Ⅴ类水年度消失概率达到95%，并将Ⅳ、Ⅴ类水比例控制在20%以内。
    why: 将回归预测关系与概率和比例约束结合，可以把水质治理目标转化为可量化的排污控制要求。
  solution_flow: 整理17个监测点近28个月水质数据及干流站点的流量、流速和距离数据→按国家水质等级标准进行频度统计，并对多类污染指标标准化后计算综合指数和地区排序→分析氨氮、高锰酸盐指数的时间序列与空间超标频次，识别持续型和分时型污染特征→设定降解系数，利用站点间平均流速和距离计算污染物旅行时间→将一维对流降解方程简化为指数衰减形式，再通过质量守恒反演各河段污染物排入量并定位污染源→分析近十年各等级水质比例的共线变化，提炼“缓冲性”和“两极性”特征→使用指数模型预测废水排放量、正态分布模型模拟总流量，并分别采用Logistic模型和线性回归模型预测未来十年不可饮用水比例→比较模型表现并利用回归关系反推控制方案，使水质达到给定的概率和比例约束。
  validation: 先依据国家水质分类阈值检查监测结果与等级判定的一致性，再用不同年份和站点的频度统计结果交叉验证综合评价排序；污染源反演中将计算出的下游浓度与实际监测浓度进行对照，并检查相邻断面污染物质量守恒；对总流量数据进行正态分布适配检验与模拟合理性检查；对Logistic模型和线性回归模型分别开展拟合优度、残差及显著性等综合检验，并比较二者预测结果是否满足比例边界和历史趋势；最终通过概率约束检验控制方案能否实现劣Ⅴ类水消失概率95%以及Ⅳ、Ⅴ类水比例不超过20%的目标。
  visualization:
  - 各水质等级年度占比统计表
  - 各监测点污染物标准化指数及综合排序表
  - 氨氮和高锰酸盐指数月度时间序列折线图
  - 可饮用水与不可饮用水比例趋势图
  - 不同预测模型拟合与外推对比图
  - 主要污染河段空间分布示意图
  pitfalls_avoided:
  - 避免直接将不同量纲的氨氮、溶解氧和高锰酸盐指数相加，因为单位和离散程度不同会导致数值尺度较大的指标支配综合评价；通过标准化后再构造综合指数。
  - 避免只根据污染物浓度差判断污染源，因为上下游流量不同且污染物沿程会自然降解；改用浓度与流量形成的质量通量，并扣除自然降解量后反演河段排污量。
  - 避免在流速较大的长江干流上建立参数过多的高维扩散模型，因为横向、竖向监测数据及扩散系数不足，容易造成参数不可辨识；依据河流尺度和输移特征采用一维对流降解模型。
  - 避免把所有污染物视为相同的排放模式，因为氨氮表现为少数污染源长期持续超标，而高锰酸盐表现为多个污染源分时超标；分别归纳为单污染源持续污染型和多污染源分时污染型。
  - 避免在未来水文、水质机理参数缺失时强行使用一维或高维机理模型进行长期预测，因为边界条件和参数无法可靠确定；转而使用历史统计序列与回归模型进行宏观预测。
  - 避免仅采用无界线性外推预测水质比例，因为长期结果可能低于0%或高于100%；引入具有比例边界的Logistic模型并与线性回归结果比较。
  - 避免将Ⅱ类与Ⅲ类水比例的此消彼长误判为整体水质剧烈波动，因为两者具有明显共线性；合并分析后识别出相对稳定的水质“缓冲区”。
  - 避免把pH等稳定指标机械纳入综合指数，因为各站点pH均处于正常范围，继续纳入会增加冗余并削弱主要污染指标的区分度；综合排序重点采用氨氮、溶解氧和高锰酸盐指数。
  innovation_points:
  - 综合污染物超标事件的时间频率和空间集中程度，将氨氮概括为“单污染源持续污染型”，将高锰酸盐概括为“多污染源分时污染型”，使污染治理策略可按污染类型差异化制定。
  - 将一维对流降解模型与相邻断面质量守恒结合，在监测站点有限的条件下反演河段纳污量，实现主要污染源的定量定位。
  - 从不同水质等级比例的共线变化中提出Ⅱ、Ⅲ类水的“缓冲性”以及Ⅰ类水减少、劣Ⅴ类水增加的“两极性”，形成对长期水质演化机制的结构化解释。
  - 将趋势预测与治理控制统一起来，不仅给出未来不可饮用水比例，还通过回归关系反推治理强度，并以劣Ⅴ类水消失概率和Ⅳ、Ⅴ类水比例作为明确控制约束。
- id: 2020_A147
  source_paper: 2020 2020_A147
  problem_type: 统计分析
  keywords:
  - 文本去重
  - 内容缺失检测
  - 信息质量评估
  context: 所提供内容仅包含重复的微信公众号水印与宣传信息，未出现实际问题背景、数据、公式或论文正文。
  models:
  - name: 未识别（论文正文缺失）
    role: 无法从现有重复水印文本中确定核心建模方法及其作用
    why: 原始材料不包含模型名称、数学公式、变量定义、算法步骤或实验结果，无法可靠推断模型
  solution_flow: 文本去重与噪声识别→检查问题描述、数据、模型和结果是否存在→判定有效正文缺失→停止模型与参数推断→等待补充完整论文后再提取和验证
  validation: 通过逐段去重和关键词检查验证内容有效性；现有文本均为重复宣传水印，缺少可用于复现、交叉验证、误差分析或敏感性分析的模型与结果。
  visualization:
  - 重复文本频次柱状图
  - 有效信息占比饼图
  pitfalls_avoided:
  - 避免根据水印宣传文本臆造模型，因为材料中没有任何公式、变量或算法证据
  - 避免虚构求解结果与验证指标，因为原文未提供数据、参数、图表或实验结论
  innovation_points:
  - 采用重复文本检测识别文档提取异常，防止将页眉页脚噪声误判为论文正文
  - 在证据不足时明确标记不可识别项，以保持结构化知识提取结果的可追溯性
- id: A题优秀论文_2002年A_C题车灯线光源的优化设计模型
  source_paper: A题优秀论文 A题优秀论文_2002年A_C题车灯线光源的优化设计模型
  problem_type: 优化+仿真
  keywords:
  - 线光源优化设计
  - 旋转抛物面镜面反射
  - 分段积分与模拟散斑
  context: 在汽车前照灯旋转抛物面灯罩中，优化过焦点水平放置的线光源长度和功率，使指定光屏点的照度满足要求，并分析反射光亮区分布。
  models:
  - name: 空间解析几何与镜面反射模型
    role: 建立线光源点、抛物面反射点、切平面法线及光屏目标点之间的几何关系，判定反射光线能否到达指定点。
    why: 灯罩是旋转抛物面，反射过程满足入射线、法线和反射线共面以及反射定律，适合用向量、切平面和虚像共线条件进行刻画。
  - name: 有效投射点分段模型
    role: 按照线光源不同位置到达B点或C点的反射路径条数，将线光源划分为若干区段，并确定各段对应的积分权重。
    why: 不同光源位置产生的有效反射点数量并不相同，若统一积分会错误计算目标点接收到的光强，因此必须根据反射线条数分段。
  - name: 最小功率分段积分优化模型
    role: 以线光源半长为决策变量、总功率最小为目标，以B点和C点光照强度达到规范下限为约束，求解最佳长度及最小功率。
    why: 光源长度同时影响单位长度功率和可到达目标点的光线路径数量，分段积分能够将几何反射关系转化为可比较的功率下界函数。
  - name: 变步长数值搜索模型
    role: 对线光源位置参数逐步细分搜索，计算有效反射点个数，校验并完善解析推导得到的区间分界点。
    why: 反射点方程组非线性且可能存在多组有效解，单纯依赖必要条件无法准确确定反射线数量，数值搜索可以识别解的个数及其变化临界值。
  - name: 模拟散斑光斑仿真模型
    role: 离散扫描线光源点和抛物面反射点，将反射光线与光屏的交点投影到二维平面，生成亮区分布。
    why: 亮区边界和光线聚集程度难以直接得到完整解析表达式，通过大量离散光线追迹可以直观呈现类椭圆亮区、中心聚光和局部无光区。
  solution_flow: 输入抛物面尺寸、焦点位置、光屏及B、C点坐标等几何数据→建立旋转抛物面方程、切平面法线和镜面反射关系→利用虚像点、反射点与目标点共线条件构造非线性方程组→以线光源点位置为参数进行变步长搜索，确定B点和C点对应的反射线数量及分段阈值→按各区段的直射与反射路径条数建立光强分段积分和最小功率约束→比较不同半长区间内的功率下界，得到最优半长1.9
    mm、总长度3.8 mm及相应最小功率→离散追迹反射光线并绘制模拟散斑图→通过临界光线比例关系估计亮区长半轴并与仿真图进行核对。
  validation: 首先用变步长逐步细分搜索检验解析区间划分，确认不同光源位置处到达B点、C点的有效反射点数量；其次将最优长度代回几何方程，检查全部可行反射点均位于灯罩口径范围内；再次利用虚像共线和临界光线比例关系计算亮区最远位置，所得长半轴约3167
    mm，并与模拟散斑图近似吻合；最后从亮区类椭圆形状、中心光线密集及短轴附近无光区等特征进行定性合理性检验。该验证仍受模型未计入辐射照度余弦定律、距离平方反比适用依据不足及散斑精度有限的约束。
  visualization:
  - 线光源半长与最低功率关系分段曲线
  - 光屏反射光模拟散斑图
  - 线光源—抛物面—光屏空间反射示意图
  pitfalls_avoided:
  - 避免把反射光线共面的必要条件直接当作可到达目标点的充分条件：进一步引入虚像点、反射点和目标点三点共线条件，并结合数值搜索排除不满足真实反射路径的伪解。
  - 避免对整条线光源使用统一的反射光线条数和统一积分域：B点与C点在不同光源区段接收到的反射线数量不同，分段积分可防止高估或低估目标点光强。
  - 避免只依据解析临界值而忽略非线性方程的多解性：采用变步长逐步细分搜索统计有效反射点个数，从而识别0条、2条或4条反射线对应的区间。
  - 避免得到最优长度后不检查物理可实现性：将最优线光源端点代回反射几何关系，验证有效反射点未超出抛物面灯罩的实际范围。
  innovation_points:
  - 将线光源按到达指定点的有效反射线条数进行分段，把复杂的空间反射几何转化为分段积分优化问题。
  - 采用解析几何推导与变步长计算机搜索相结合的方法，既缩小搜索范围，又校验非线性反射方程的有效解数量。
  - 通过功率—半长度分段曲线进行数形结合，在B点和C点双重照度约束下直观确定最优线光源长度。
  - 利用模拟散斑光线追迹与临界光线比例分析相结合，同时给出亮区形状的定性解释和长半轴的定量估计。
- id: A题_刀具问题的仿真及灵敏度分析
  source_paper: A题 A题_刀具问题的仿真及灵敏度分析
  problem_type: 优化+仿真+统计分析
  keywords:
  - 预防性换刀与检查策略
  - 蒙特卡洛仿真
  - 参数灵敏度分析
  context: 针对车床刀具随机故障及产品质量检测存在误判的问题，联合优化换刀间隔、检查间隔和检查策略，以最小化单位正品的平均生产费用。
  models:
  - name: 单位正品期望费用比模型
    role: 以一个生产更新周期内的期望总费用与期望正品数之比作为目标函数，统一计入检查、换刀、故障和废品损失等费用。
    why: 生产周期长度、故障时刻和正废品数量均具有随机性，采用期望费用与期望产出的比值能够合理衡量长期单位正品平均费用。
  - name: 离散事件蒙特卡洛仿真模型
    role: 模拟刀具故障、正废品产生、定期检查、质量误判和换刀等随机事件，估计不同策略及参数组合下的单位正品平均费用。
    why: 好刀可能产生废品、坏刀也可能产生正品，且多个随机事件和条件分支相互作用，解析表达式复杂，仿真更适合估计长期运行绩效。
  - name: 检查策略决策模型
    role: 构造单次检查、连续复检以及向前或向后复查等七种策略，并规定不同检查结果下继续生产或立即换刀的决策规则。
    why: 检查既会增加直接费用，又会降低好刀误换和坏刀漏检的损失，必须将检查规则作为离散决策变量与换刀、检查间隔联合比较。
  - name: 网格穷举优化模型
    role: 在候选换刀间隔和检查间隔的整数网格上搜索，使仿真估计的单位正品平均费用最小。
    why: 决策变量为有界整数，维度较低，但目标函数受随机性影响且难以求导，穷举搜索能够稳定处理非光滑、非凸的黑箱目标。
  - name: 单因素灵敏度分析模型
    role: 分别改变好刀正品率、坏刀正品率、预防性换刀费、废品损失和故障换刀费，观察最优间隔及最小费用的变化。
    why: 可识别关键参数、解释最优策略变化方向，并检验方案对概率和成本参数扰动的稳健性。
  solution_flow: 数据→设定好刀正品概率p1、坏刀正品概率p2、刀具故障分布及检查费、换刀费、废品损失等参数→建立七种检查策略和单位正品期望费用目标→以换刀间隔u、检查间隔n及策略编号为决策变量→先通过大规模蒙特卡洛仿真定位近似最优区域，再在局部整数网格内穷举搜索→比较各策略的最小费用并选出近似最优方案→通过重复大样本仿真、固定参数交叉比较、最优邻域波动分析及单因素灵敏度分析验证结果。
  validation: 采用多数情形1亿次、关键结果10亿次的重复仿真降低随机误差；以p1=1、p2=0的理想情形作为基准，与可解释的最优间隔规律进行对照；将多个候选参数组合代入全部七种策略进行交叉比较，避免只在各策略自身最优点上比较；考察近似最优解邻域内单位正品费用波动不超过约5%的现象以评估稳健性；最后改变p1、p2、换刀费、废品损失和故障换刀费，检查最优参数变化是否符合经济机理。
  visualization:
  - 检查策略程序流程图
  - 换刀间隔—检查间隔费用矩阵表
  - 不同检查策略最小费用对比表
  - 参数灵敏度热力图或等高线图
  pitfalls_avoided:
  - 避免把检查结果等同于刀具真实状态：由于好刀仍有2%的废品概率、坏刀仍有40%的正品概率，单次检查存在好刀误换和坏刀漏检，论文通过连续复检及前后复查策略显式处理误判。
  - 避免只追求高检查频率：增加检查次数虽然能降低误判和坏刀持续生产的损失，但会显著增加检查费用，因此将检查间隔与误判损失放入同一单位正品费用目标中权衡。
  - 避免仅优化换刀间隔或检查间隔中的一个：不同检查策略会改变最佳u和n，二者存在耦合，必须与策略类型联合搜索，否则可能得到局部且不可比的方案。
  - 避免直接依赖复杂解析推导：刀具故障、其他故障、首次检出废品和多次复检会产生大量条件分支，强行写出闭式表达式容易漏情形，因此采用事件仿真遍历随机过程。
  - 避免用小样本仿真噪声判断细微优劣：近似最优区域的费用差异较小，论文对一般结果使用1亿次、关键结果使用10亿次仿真，以减少随机波动导致的错误排序。
  - 避免认定某种策略在所有参数组合下恒优：交叉比较表明同一策略并非对所有u、n都占优，策略排序还依赖p1、p2及成本参数，因此参数变化后需要重新仿真优化。
  innovation_points:
  - 将预防性换刀、周期检查和带误判的质量判别统一为长期单位正品平均费用最小化问题，同时优化连续型经营绩效与离散检查规则。
  - 设计七种单检、复检及前向或后向复查策略，系统刻画防止好刀误换与防止坏刀漏检之间的权衡。
  - 采用“大范围仿真定位—小范围穷举精搜”的混合求解方式，在解析模型过于复杂时兼顾计算可行性和参数搜索精度。
  - 通过多参数灵敏度分析发现换刀间隔u集中在约300附近、相较检查间隔n更稳定，从而识别u为更重要的优化参数。
  - 在基础模型上进一步纳入与刀具故障相互独立的其他故障，并通过遍历事件组合扩展期望费用模型。
- id: B题 电力市场的输电阻塞管理论文_电网输电分配与阻塞管理的数学模型
  source_paper: B题 电力市场的输电阻塞管理论文 B题 电力市场的输电阻塞管理论文_电网输电分配与阻塞管理的数学模型
  problem_type: 统计分析+优化
  keywords:
  - 输电阻塞管理
  - 多元线性回归
  - 二次规划
  context: 在电力市场负荷需求、机组爬坡能力和线路潮流限值约束下，确定经济的机组出力预案，并通过再调度消除或缓解输电阻塞。
  models:
  - name: 多元线性回归潮流代理模型
    role: 拟合6条线路有功潮流关于8台发电机组出力的线性关系，为潮流预测和优化约束提供显式表达式。
    why: 机组出力与线路潮流的散点图呈近似线性关系，线性回归计算简单且便于直接嵌入后续规划模型。
  - name: 基于报价排序的经济出力分配模型
    role: 按照机组分段报价由低到高分配负荷，在满足总负荷和机组爬坡范围的条件下确定预案出力及统一清算价。
    why: 购电费用与清算价、负荷和交易时长成正比，因此优先调用低报价容量能够降低清算价和预案购电费用。
  - name: 输电阻塞管理二次规划模型
    role: 以阻塞补偿费用最小为目标，在功率平衡、机组出力能力、爬坡限制和线路潮流限值约束下优化各机组增减出力。
    why: 阻塞费用同时与调节电量、报价差及平均出力速率有关，形成分段二次目标；潮流代理关系及主要约束为线性，适合采用二次规划求解。
  - name: 调节方向枚举模型
    role: 用0-1参数区分机组序外增发与序内减发，并枚举各机组调节方向后分别求解对应的连续二次规划。
    why: 增发和减发采用不同的补偿价格且涉及绝对值，方向枚举可将分段目标和符号约束转化为标准二次规划。
  - name: 安全裕度松弛优化模型
    role: 当严格线路限值下无可行解时，将线路安全裕度作为受控松弛量，通过逐次减半参数寻找风险尽可能小的可行调度方案。
    why: 高负荷场景中机组能力与电网安全约束可能互相冲突，适度利用安全裕度能够避免模型直接无解，并在供电可行性、阻塞费用和安全风险之间折中。
  solution_flow: 读取机组历史出力、线路潮流、分段报价、爬坡速率和潮流限值数据→利用散点图判断线性关系并建立多元线性回归潮流代理模型→根据当前出力和15分钟爬坡限制计算各机组可行出力区间→按分段报价排序满足预测负荷，得到预案出力、清算价和购电费用→将预案出力代入回归方程计算线路潮流并识别阻塞线路→构建以阻塞费用最小为目标的二次规划，枚举增发或减发方向并求解→若严格潮流限值下无可行解，则引入安全裕度并逐次减小松弛参数→对982.4MW和1052.8MW两种负荷场景比较调整出力、线路越限程度、阻塞费用和安全风险。
  validation: 首先通过机组出力与线路潮流的散点图检验线性建模假设；随后将预案及调整后的机组出力回代6个回归方程，计算线路潮流并与各线路限值比较；最后使用982.4MW和1052.8MW两个负荷场景进行实证检验，分别验证严格限值下消除阻塞的可行性，以及高负荷无严格可行解时安全裕度方案的可行性，并核对总出力平衡、机组出力区间、最大越限比例和阻塞费用。
  visualization:
  - 机组出力与线路潮流散点图
  - 各线路预测潮流与潮流限值对比图
  - 调整前后各机组出力对比表
  - 不同负荷场景阻塞费用与最大越限比例对比图
  pitfalls_avoided:
  - 避免只按报价高低分配出力而忽略机组爬坡能力，因为15分钟内机组无法任意升降出力，忽略该约束会产生物理上不可执行的预案。
  - 避免将总发电量满足负荷等同于调度方案可行，因为即使功率平衡成立，部分线路仍可能超过潮流限值并引发输电阻塞。
  - 避免直接用复杂潮流计算嵌入优化而造成求解困难，通过多元线性回归构造显式潮流代理关系，使线路约束能够进入二次规划。
  - 避免把增发和减发统一按同一价格计算，因为序外增发与序内减发的补偿规则不同，必须通过方向变量和符号约束分别计费。
  - 避免在严格潮流限值下无解时仍强行输出所谓最优方案，通过可行性检查识别高负荷场景，并引入可控安全裕度或进一步考虑拉闸限电。
  - 避免仅追求较低阻塞费用而忽略安全代价，因为使用线路安全裕度虽能减少调节量和费用，却会提高线路越限比例与运行风险。
  innovation_points:
  - 将数据驱动的多元线性回归潮流代理模型与电力市场阻塞管理二次规划耦合，实现从历史数据拟合到调度优化的一体化建模。
  - 依据序外增发和序内减发的差异化补偿规则构造分段二次阻塞费用，并通过调节方向枚举转化为可求解的连续二次规划。
  - 针对高负荷下严格安全约束无可行解的情形，引入线路安全裕度和逐次减半搜索机制，形成由严格消阻塞到风险受控松弛的分层求解策略。
- id: B题_灾情巡视的最佳路线
  source_paper: B题 B题_灾情巡视的最佳路线
  problem_type: 优化
  keywords:
  - 多旅行商问题
  - 最短路径
  - 多目标优化
  - 集合覆盖
  - 启发式算法
  context: 在洪灾背景下，根据县域道路交通网络设计从县城出发并返回的灾情巡视分组与路线，使总路程、组间均衡性及完成时间等指标尽可能优化。
  models:
  - name: 最短路径度量闭包模型
    role: 以原道路网中任意两点之间的最短路径长度为边权，将稀疏非完全图转化为满足三角不等式的完全图。
    why: 原道路网中部分乡村之间没有直接道路，构造度量闭包后可统一应用旅行商模型，且完全图上的最优巡回与原图上的最优巡视路线等价。
  - name: 多旅行商问题模型
    role: 描述多个巡视组均从县城出发、覆盖全部乡镇和村庄并返回县城的联合路线优化问题。
    why: 各巡视组共享同一基地且共同覆盖全部节点，与单基地多旅行商问题的结构一致，可直接刻画分组和路径选择。
  - name: 增广完全图上的哈密尔顿圈模型
    role: 将县城复制为与巡视组数相对应的多个虚拟节点，通过求增广图的哈密尔顿圈并按虚拟节点分段，得到各巡视组的闭合路线。
    why: 该变换可把多旅行商问题转化为单旅行商问题，使各段路线均以县城为起终点，并保证在总路程目标下与原问题对应。
  - name: 旅行商0-1整数规划模型
    role: 以边是否被选取为二元变量，以总边权最小为目标，并利用度约束和子回路消除约束形成完整巡回。
    why: 整数规划能够严格表达哈密尔顿圈及其最优性条件，并防止所选边形成多个互不连通的小环。
  - name: 总路程—均衡性多目标优化模型
    role: 同时优化所有巡视路线的总长度与各组路线长度或巡视时间的极差，并可通过加权或主次目标转化为单目标。
    why: 总路程最短通常会导致组间任务严重不均衡，两项目标相互冲突，必须根据灾情巡视的实际需求进行折中。
  - name: 最小生成树与最短路径树辅助分组模型
    role: 依据最小生成树、从县城出发的最短路径树、单旅行商近似路线或地理邻近关系生成初始分区。
    why: 原问题规模较大且属于NP难问题，先利用具有较好距离结构的子图分组，再对各组求小规模旅行商路线，可显著降低计算复杂度。
  - name: 带服务时间的极小化最大完成时间模型
    role: 将每组行驶时间与乡镇、村庄的停留时间相加，以各组完成时间的最大值最小为目标，并满足给定时限。
    why: 在应急巡视中总体完成时刻由最慢的一组决定，使用极小化最大完成时间比仅最小化总时间更符合实际。
  - name: 可行集最小覆盖模型
    role: 将在给定最短时间内能够由同一组完成巡视的节点集合定义为可行集，用最少可行集覆盖全部节点。
    why: 当最短完成时间由最远节点的往返与停留时间决定后，剩余任务转化为在该时间上限下寻找最少巡视组，正好对应集合覆盖问题。
  - name: 启发式局部调整与搜索模型
    role: 采用就近归组、边界节点交换、最小插入、最近邻、对换调优或计算机搜索改进分组和组内路线。
    why: 旅行商和集合覆盖均属于NP难问题，在实际规模下求全局精确解不现实，启发式方法能够在可接受时间内获得高质量近似解。
  solution_flow: 数据：将县城、乡镇和村庄抽象为节点，道路及里程抽象为加权边，并给定车辆速度、不同类型节点的停留时间和巡视时限；模型：先用全点对最短路径构造度量完全图，再建立多旅行商、总路程—均衡性多目标及带服务时间的极小化最大完成时间模型，最短时限下进一步建立可行集覆盖模型；参数：确定巡视组数、目标权重或主次关系、车速、乡镇与村庄服务时间，并计算各节点到县城的最短距离；求解：利用最小生成树、最短路径树或地理位置形成初始分组，对各组求旅行商路线，再通过边界节点交换和局部搜索改善总路程与均衡性，并用下界判断最少组数；验证：检查节点覆盖、路线闭合、时间限制和组间均衡性，将候选方案与单旅行商下界、最远节点时间下界及其他方案进行对比。
  validation: 首先以原图单旅行商近似最优路线长度作为多组路线总长度的下界，以所有行驶时间和停留时间之和除以时限证明较少分组不可行；其次用县城到最远乡镇的最短路径往返时间加停留时间构造最短完成时间下界；随后逐组核验路线均从县城出发并返回、全部待巡视节点至少被服务一次、仅经过不停留的中转节点得到正确标记、各组完成时间不超过限制；最后比较不同方案的总里程、最大完成时间、极差和分组数，并通过局部节点交换后指标不再显著改善来检验方案稳定性。
  visualization:
  - 县域加权道路网络与分组巡视路线图
  - 最短路径树或最小生成树分区图
  - 各巡视组路程与完成时间对比柱状图
  - 总路程—组间极差的帕累托权衡图
  pitfalls_avoided:
  - 避免直接在存在大量不相邻点对的稀疏道路图上套用完全图旅行商算法；先以点对最短路径构造度量闭包，保证任意节点间转移有明确成本且满足三角不等式。
  - 避免只优化多组路线总里程而忽略任务均衡；总里程最短可能造成某一组路线或工作时间过长，因此同时考察极差或最大完成时间。
  - 避免把增广完全图的整数规划当作实际规模下必然可精确求解的方法；旅行商问题属于NP难问题，节点扩增后计算量更大，应采用分组、启发式搜索和局部优化。
  - 避免只按地理区域平均划分节点数量；乡镇与村庄的停留时间不同，且道路距离不均匀，应按行驶时间与加权服务量联合平衡。
  - 避免将路线经过某节点误认为已完成该节点巡视；模型中需区分仅作为道路中转的经过节点和需要停留服务的巡视节点。
  - 避免仅给出某个分组数而不证明其最小性；应利用总工作量下界、单旅行商路程下界和最远节点时间下界排除更少分组。
  - 避免把总巡视时间最小与最短完工时间混淆；并行巡视的实际完工时间取决于各组时间的最大值，而不是各组时间之和。
  - 避免忽略服务时间参数变化对路线结构的影响；当停留时间权重增大时应优先均衡乡村服务量，当车速降低或路程权重增大时应更重视路线长度均衡。
  innovation_points:
  - 通过复制县城节点，把单基地多旅行商问题转化为增广完全图上的单旅行商问题，再由虚拟县城节点切分出多条巡视闭链。
  - 采用先分组、后求组内旅行商路线、再进行组间边界调整的分层启发式框架，兼顾大规模问题的计算可行性和解的质量。
  - 将总路程最短与组间均衡显式构造成多目标问题，并使用总里程、极差和最大完成时间评价不同折中方案。
  - 利用最远乡镇的往返最短路径与停留时间确定理论最短完工时间，再把该时限下的最少分组问题转化为可行集最小覆盖。
  - 对车速和不同节点停留时间进行参数化分析，揭示服务时间权重增大时应均衡加权节点数、行驶时间权重增大时应均衡路线长度的规律。
  - 在严格数学最优之外考虑应急管理的现实折中，允许以极小的时间超限换取减少一个巡视组，为人力物力配置提供可解释的备选方案。
- id: B题优秀论文_2002年B题彩票运行方案的合理性研究
  source_paper: B题优秀论文 B题优秀论文_2002年B题彩票运行方案的合理性研究
  problem_type: 综合评价+仿真+统计分析
  keywords:
  - 彩票奖金设置
  - Logistic函数
  - 蒙特卡洛仿真
  context: 针对多种彩票销售规则与奖金设置方案，从彩民吸引力和经营运行稳定性两个方面评价其相对合理性并筛选最优方案。
  models:
  - name: 吸引力指数模型
    role: 综合衡量彩票方案对冒险型与稳健型彩民的吸引程度。
    why: 彩民对奖金的心理响应具有先快速增长、后趋于饱和的特征，适合用改造后的Logistic函数描述；同时通过加权整合最高奖吸引力与总中奖概率吸引力。
  - name: 稳定性指数模型
    role: 衡量实际发放奖金相对预定奖金额的波动程度，评价经营管理机构的运行风险。
    why: 一等奖保底、封顶及低等奖固定奖金会使实际返奖率随机偏离预定返奖率，难以直接解析计算，因此采用计算机仿真估计偏差。
  - name: 蒙特卡洛投注仿真模型
    role: 模拟大量投注和开奖过程，估计各奖项中奖频率、实际总奖金额及返奖率分布。
    why: 开奖后各奖项中奖人数具有随机性且事前不可知，通过大规模重复模拟可依据大数定律近似获得中奖概率与运行波动特征。
  - name: 综合指数模型
    role: 将吸引力与稳定性合成为单一评价指标，用于29种方案的排序与优选。
    why: 单独提高吸引力可能牺牲经营稳定性，以吸引力指数为分子、稳定性偏差指数为分母，可使高吸引力且低波动的方案获得更高综合得分。
  solution_flow: 数据：整理各方案的中奖规则、各奖项概率、奖金比例、保底与封顶约束及预定返奖率→模型：将彩民划分为冒险型和稳健型，分别构造基于最高奖金与总中奖概率的吸引力因子，再建立奖金偏差型稳定性指标和比值型综合指标→参数：将吸引力因子归一化到0至100，设置两类彩民权重各为0.5，并依据奖金和中奖概率达到心理饱和的经验条件确定Logistic参数→求解：计算各方案吸引力指数，进行大规模蒙特卡洛投注与开奖仿真得到稳定性指数，再计算综合指数并排序→验证：比较各方案在单项指标与综合指标下的排序，结合大数定律检查模拟频率的概率解释，并分析最优方案是否同时满足高吸引力与低返奖波动。
  validation: 采用约2000万次模拟降低中奖频率和奖金波动估计的随机误差，并依据大数定律用模拟中奖频率逼近理论中奖概率；同时通过吸引力指数、稳定性指数和综合指数的交叉比较进行合理性检验，确认综合最优方案并非仅依靠单项指标的极端取值获胜。论文未给出独立真实开奖数据验证，因此结论主要属于仿真与相对排序验证。
  visualization:
  - Logistic吸引力函数曲线图
  - 中奖概率—稳健型吸引力曲线图
  - 综合吸引力函数曲面或曲线图
  - 各方案指标对比表
  - 综合指数排序柱状图
  pitfalls_avoided:
  - 避免仅按中奖概率评价方案，因为彩票吸引力还显著受到最高奖金及彩民风险偏好的影响，仅比较中奖面会低估高额奖金的心理效应。
  - 避免只追求吸引力指数最大化，因为同时提高最高奖金和中奖率可能压缩经营机构利润并加剧返奖波动，导致方案在经营层面不可持续。
  - 避免直接用单期盈利评价稳定性，因为实际中奖人数随机且单期开奖不具代表性，改用大量仿真下实际奖金额相对预定奖金额的平均偏差。
  - 避免将返奖率低于预期简单视为经营优势，因为长期盈利过度可能削弱彩民信任和后续销量；返奖率高于预期则会造成相对亏损，两侧偏离均应受到惩罚。
  - 避免不同量纲指标直接相加，通过将吸引力指标归一化到0至100，并以吸引力与稳定性偏差的比值形成可比较的综合指数。
  innovation_points:
  - 借鉴并改造Logistic函数描述最高奖金带来的心理吸引力饱和效应，将彩民风险偏好划分为冒险型和稳健型后进行加权评价。
  - 将经营风险从静态利润问题转化为实际返奖率偏离预定返奖率的稳定性问题，并利用蒙特卡洛仿真处理中奖人数与奖金支出的随机性。
  - 采用先计算吸引力、再评估稳定性、最后构造综合指数的逐步优化框架，使消费者偏好与经营机构利益能够在同一评价体系中权衡。
- id: B题优秀论文_公交车调度问题的数学模型
  source_paper: B题优秀论文 B题优秀论文_公交车调度问题的数学模型
  problem_type: 统计分析+仿真+优化
  keywords:
  - 公交车调度
  - 客流密度
  - 确定性运行仿真
  - 多目标优化
  - 车辆配置
  context: 根据公交线路各站分时段上下客流、站间运行时间和车辆容量，在兼顾乘客候车体验与公交公司运营效益的条件下制定全天发车时刻表并确定最少配车数。
  models:
  - name: 分时客流密度模型
    role: 将各站按小时统计的上下车人数转换为随时间变化的来客密度和下车密度，为车辆运行计算提供输入。
    why: 原始数据是分时段汇总客流，而运行模型需要计算任意两次车辆到站之间的乘客到达量和下车量，因此需用密度函数及其积分连接统计数据与动态过程。
  - name: 确定性公交运行仿真模型
    role: 在给定发车时刻表后，逐车逐站计算车辆到离站时刻、下车人数、可用容量、实际上车人数、车内人数和站台滞留人数。
    why: 在缺少完整随机分布信息且需保证模型可计算的情况下，将客流和运行时间确定化，可以清晰描述公交车沿线路顺序运送乘客的过程。
  - name: 先到先上排队与滞留递推模型
    role: 按乘客已错过车辆的趟数记录候车队列，在容量受限时优先安排等待时间较长的乘客上车，并将未上车乘客递推至下一班车。
    why: 仅统计站台总人数无法准确计算超时候车人数；按候车趟数分层递推既体现先到先服务原则，又能跟踪不同乘客群体的实际等待时间。
  - name: 加权多目标优化模型
    role: 以高峰候车超时率、平峰候车超时率和低载客率区段比例的加权和为目标，优化发车时刻或分时段发车间隔。
    why: 乘客希望缩短候车时间，而公交公司希望避免车辆低载运行，两类目标相互冲突，采用无量纲比例指标和加权和可形成可比较、可求解的统一目标函数。
  - name: 分时段等间隔发车模型
    role: 将全天划分为平峰、早高峰和晚高峰，并分别以固定发车间隔作为决策变量。
    why: 直接优化每一辆车的发车时刻会产生大量变量且难以实际执行，分时段等间隔策略可显著降维，并形成便于公交部门操作的规则化时刻表。
  - name: 带时序的车辆配置模型
    role: 根据上下行优化后的发车时刻、全程运行时间和车辆在终点站的方向转换关系，计算完成全天班次所需的最少车辆数。
    why: 发车总班次数不等于实际车辆数，同一车辆可以在上下行之间循环使用，因此必须考虑车辆时序衔接和始末站车辆平衡。
  solution_flow: 数据：整理各站分时段上下车人数、站间距离、平均车速、车辆标准容量与容量上限，并识别早晚高峰；模型：将客流统计量转换为来客密度和下车密度，建立逐车逐站的确定性运行、先到先上排队及滞留递推模型；参数：设置标准容量100人、容量上限120人、高峰候车阈值5分钟、平峰候车阈值10分钟，并确定各评价指标权重；求解：给定平峰、早高峰和晚高峰发车间隔，生成双向时刻表，运行仿真并计算高峰超时率、平峰超时率和低载区段比例，通过枚举比较或直接搜索获得近似最优方案；配车：依据上下行班次的时间衔接和车辆折返关系求最少车辆数；验证：比较多个候选间隔方案的综合目标值、发车总量及配车数量，并检查容量、候车和始末站车辆平衡要求。
  validation: 采用多方案数值对比验证：分别计算不同分时段发车间隔以及上下行高峰间隔交换方案的候车超时率、低载区段比例、综合目标值、全天班次数和双向配车数；同时检查车辆载客量不超过120人的容量约束、滞留乘客能否正确递推、每个始发站早发车前与晚收车后的车辆状态是否一致。该论文的验证主要属于情景枚举与内部一致性检验，未进行独立日期客流数据上的样本外实证验证。
  visualization:
  - 公交运行模型流程图
  - 上下行车辆折返时间轴图
  - 候选调度方案指标对比表
  - 分时段发车间隔与综合目标值对比图
  pitfalls_avoided:
  - 避免直接把每辆车的发车时刻全部设为独立决策变量，因为这会造成决策维数过高、搜索困难且最终时刻表不便于实际执行，改用平峰和高峰分段等间隔发车实现降维。
  - 避免只按平均载客率评价方案，因为平均值会掩盖局部车辆超载或大量空驶，模型同时跟踪逐车逐站载客量并统计低于50%载客率的区段比例。
  - 避免将未能上车的乘客在下一时段重新视为新到乘客，因为这样会低估真实等待时间和候车超时率，模型按已等候趟数保存并递推滞留队列。
  - 避免用标准容量100人作为绝对装载上限，因为题目允许满载率最高达到120%，模型区分标准容量B与容量上限120人，使服务和安全指标保持一致。
  - 避免仅根据全天发车总班次数估算车辆数，因为车辆能够重复运行且上下行之间存在折返衔接，配车模型显式考虑运行时序和终点站车辆转换。
  - 避免将上下行运行、客流排队和车辆配置一次性构造成过于庞大的联合模型，因为其变量和时序约束会显著增加求解难度，论文先分方向优化运行方案，再单独进行车辆配置。
  innovation_points:
  - 用“已错过车辆趟数”对站台乘客分层，并结合先到先上原则建立递推关系，从而能够在容量约束下精确计算乘客滞留和候车超时率。
  - 将社会效益和企业效益分别量化为高峰候车超时率、平峰候车超时率及低载区段比例，并通过加权目标函数统一进行权衡。
  - 采用“分方向运行优化—双向时序配车”的分解框架，在保留公交运行关键机制的同时降低整体问题的计算复杂度。
  - 利用平峰、早高峰和晚高峰分段等间隔策略压缩决策空间，使优化结果能够直接转化为易执行的公交调度规则。
- id: B题_蛋白质氨基酸的组合问题
  source_paper: B题 B题_蛋白质氨基酸的组合问题
  problem_type: 优化+仿真
  keywords:
  - 多元线性丢番图方程
  - 氨基酸组合
  - 分支限界深度优先搜索
  - 化学信息约束
  - 整数解枚举
  context: 根据蛋白质总分子量及可获得的元素组成、氨基酸定性定量信息，枚举并筛选其所有可能的氨基酸组成。
  models:
  - name: 最一般非负整数线性方程模型
    role: 作为无辅助信息时的基准模型，求解满足总分子量约束的全部氨基酸计数组合。
    why: 蛋白质分子量可表示为各类氨基酸残基分子量与其数量乘积之和，因此问题可直接转化为多元线性丢番图方程。
  - name: 含氮量约束模型
    role: 利用生命蛋白质含氮比例的经验范围筛除不符合化学规律的整数解。
    why: 仅使用总分子量会产生大量组合解，而蛋白质含氮量通常处于相对稳定的区间，可形成有效的附加不等式约束。
  - name: 已知蛋白质分子式的元素守恒模型
    role: 在质量守恒之外加入碳、氢、氧、氮、硫等元素原子数守恒方程，显著压缩解空间。
    why: 质谱实验能够给出蛋白质的准确分子式，多维元素平衡比单一分子量方程提供了更强的组成识别能力。
  - name: 已知部分氨基酸存在的平移模型
    role: 将已确认存在的每种氨基酸预先扣除一份，再对剩余分子量求非负整数解。
    why: 层析等定性实验可确认部分氨基酸必然存在，将正整数下界通过变量平移转化为非负整数约束，可减少剩余质量和搜索规模。
  - name: 已知全部氨基酸种类的降维模型
    role: 仅保留定性分析确认的氨基酸变量，并要求这些变量为正整数。
    why: 完全水解后的定性分析能够排除不存在的氨基酸，减少变量个数是降低组合爆炸、缩短运行时间和减少候选解的直接方法。
  - name: 0-1氨基酸组成模型
    role: 将每类氨基酸的数量限制为0或1，构造高度简化的子集和模型。
    why: 在特定小分子量或教学化场景中，0-1假设可大幅缩小搜索空间并提高求解速度，但只适合作为强假设下的近似模型。
  - name: 定性种类与分子式联合线性方程组模型
    role: 面向无微机但具备化学分析设备的实验室，通过已知氨基酸种类和元素原子数建立低维线性方程组并手工求整数解。
    why: 当候选氨基酸种类较少时，质量及元素守恒方程可提供足够约束，先求线性方程组通解再筛选正整数解具有人工可操作性。
  - name: 氨基酸比例约束唯一解模型
    role: 利用自动分析仪给出的氨基酸种类及比例关系，将多个计数变量表示为同一比例参数的倍数并直接确定组成。
    why: 定量分析提供的比例信息几乎消除了组合不确定性，结合总分子量即可求出公共倍数，使结果达到唯一或近唯一。
  - name: 分支限界深度优先枚举算法
    role: 遍历各模型的可行整数解，并利用剩余质量、变量上下界及附加化学约束提前剪枝。
    why: 直接枚举所有变量组合的计算量极大，深度优先搜索便于逐层赋值，分支限界可及时排除不可能达到目标分子量的分支。
  solution_flow: 数据：整理各氨基酸残基的分子量、元素组成及实验获得的分子式、存在种类、含氮量或比例信息；模型：以总分子量守恒建立非负整数方程，并按可用实验信息逐步加入元素守恒、正整数下界、变量筛选、0-1或比例约束；参数：确定目标分子量、候选氨基酸集合、元素总数和含氮比例区间；求解：采用深度优先搜索与分支限界枚举全部可行整数解，低维情形可先求线性方程组通解再筛选整数解，比例已知时直接代数求解；验证：对多组不同分子量和约束强度的数据测试，比较候选解数量、运行时间及化学约束满足情况。
  validation: 采用多组测试数据进行对照验证：分别记录基础模型与加入含氮量、元素组成、已知种类等约束后的解数和运行时间，考察分子量增长时计算规模的变化；将所有输出解回代总分子量方程、元素守恒方程和正整数或比例约束，检查其可行性；同时比较不同模型的解空间缩减效果，并分析分子量、元素计数和含氮量区间存在测量误差时结果的敏感性。
  visualization:
  - 不同模型解的个数与运行时间对比表
  - 分子量—候选解数量关系图
  - 分子量—运行时间关系图
  - 约束逐步加入后的解空间缩减图
  pitfalls_avoided:
  - 避免对所有氨基酸数量组合进行无剪枝穷举，因为变量多且上界随蛋白质分子量增大，会造成严重的组合爆炸；采用深度优先搜索和分支限界提前终止不可行分支。
  - 避免仅凭总分子量断言氨基酸组成唯一，因为一个多元线性方程通常对应大量非负整数解；通过含氮量、元素组成、种类及比例等独立信息缩小可行域。
  - 避免忽略同分子量氨基酸造成的不可辨识性，因为亮氨酸与异亮氨酸的分子式和分子量均相同，而谷酰胺与赖氨酸可能分子量相同但分子式不同；对前者保留等价性说明，对后者利用元素组成变量加以区分。
  - 避免把含硫氨基酸与普通变量完全混同，因为常见氨基酸中仅少数含硫，硫原子数能提供很强的识别信息；通过硫元素守恒及必要的化学实验进行特殊处理。
  - 避免将含氮比例经验范围视为绝对定律，因为不同资料给出的区间存在差异且蛋白质可能有例外；应将其作为可调筛选约束并开展区间敏感性分析。
  - 避免在实际蛋白质上无条件使用每种氨基酸数量只能为0或1的假设，因为真实蛋白质通常会重复包含同一种氨基酸；更合理的做法是根据实验知识设置各变量的上下界。
  - 避免忽视分子量和元素计数的测量误差，因为整数方程对目标值的小幅变化可能非常敏感并导致解集突变；实际应用中应使用容差区间而非机械地要求精确相等。
  innovation_points:
  - 建立从无辅助信息到分子式、部分种类、全部种类和定量比例信息的分层模型体系，使模型可按实验室设备条件和信息获取能力灵活选择。
  - 将质谱、含氮量、层析定性、元素守恒和自动分析仪比例等化学实验知识系统转化为线性等式、不等式、变量下界及降维约束。
  - 通过变量平移将已知存在条件由正整数约束转化为标准非负整数问题，在保持模型结构统一的同时减少目标分子量和搜索规模。
  - 采用深度优先搜索结合分支限界求取全部可行解，并以解的个数和运行时间双指标评价不同附加信息对模型效率的改善程度。
  - 针对无微机环境设计低维线性方程组和人工整数筛选方案，使建模方法兼顾计算机求解与手工求解场景。
  - 提出利用氨基酸分子量之间的代数关系、官能团数量、酸碱性及极性分类信息进一步分解变量组，为后续降低维度和提高可辨识性提供方向。
- id: A题优秀论文_血管的三维重建
  source_paper: A题优秀论文 A题优秀论文_血管的三维重建
  problem_type: 仿真+优化
  keywords:
  - 三维重建
  - 最大内切圆
  - Bézier曲线拟合
  context: 根据血管的连续二维切片图像，在等径管道假设下重建血管中轴线与管道半径，并通过改变切片方向降低重建误差。
  models:
  - name: 等径管道球滚动包络模型
    role: 描述血管三维几何结构，为从二维切片恢复管道半径和中轴线提供理论基础。
    why: 血管被假设为固定半径球沿连续中轴线滚动形成的包络面，因此切片轮廓可表示为一族圆的包络线。
  - name: 截面最大内切圆搜索模型
    role: 逐层确定切片与中轴线的交点及管道半径。
    why: 等径管道切片中最大内切圆的圆心位于中轴线与切片的交点，其半径等于管道半径，可将三维重建转化为二维距离最大化问题。
  - name: Bézier样条曲线拟合模型
    role: 将各切片得到的离散最大内切圆圆心拟合为连续、光滑的血管中轴线。
    why: 血管中轴线连续且不存在严重扭曲，Bézier样条具有良好的光滑性和几何可控性，适合处理离散中心点。
  - name: 旋转切面修正模型
    role: 从不同方向重新生成截面，修正中轴线与原始切片夹角过小时产生的中心点偏差。
    why: 当中轴线近似平行于切片时，截面信息不足且最大内切圆圆心可能不唯一；选择近似垂直于中轴线的旋转切面可获得更接近圆形、信息更稳定的截面。
  - name: 基于中轴线的截面重建仿真模型
    role: 由拟合中轴线和管道半径反向生成各层截面，用于定量评价并辅助修正模型。
    why: 重建截面能够与原始图像直接比较覆盖、遗漏和溢出区域，使三维轴线误差转化为可计算的二维区域差异。
  solution_flow: 数据：导入100张BMP切片并转换为三维矩阵，利用边缘检测提取各层单连通区域的闭合轮廓，以稀疏矩阵存储；模型：在每个截面内搜索候选点，计算候选点到全部边界点的最小距离，并最大化该距离以获得最大内切圆；参数：以前一层圆心作为当前层局部搜索起点，得到各层圆心Ci和半径Ri，以各层半径均值估计固定管径R，并用Bézier样条拟合圆心序列；求解：生成连续三维中轴线，再绕指定竖直轴构造旋转切面，对与中轴线近似垂直的截面重复最大内切圆计算，更新中心点和轴线；验证：分别计算边界点到重建轴线的半径残差，以及重建截面与原始截面的区域差异率，对修正前后的结果进行比较。
  validation: 采用两类验证策略：第一类从若干切片轮廓中随机抽取边界点，计算其到拟合轴线的最短距离与估计管道半径之差的绝对值，并按层求平均，观察误差随切片层数的分布；第二类由中轴线和半径反向重建截面，设原截面面积为N(i)、重建截面面积为M(i)、二者重叠面积为P(i)，以[N(i)-P(i)+M(i)-P(i)]/M(i)衡量遗漏与溢出误差。修正后第30、40、50、60、70层误差由5.7%、6.5%、7.1%、6.8%、6.5%降至3.2%、2.5%、2.7%、3.0%、3.2%，说明旋转切面修正有效。
  visualization:
  - 中轴线三维透视图及三视图
  - 分层平均距离残差折线图
  - 原始截面与重建截面叠加图
  - 修正前后中轴线侧视对比图
  - 修正前后误差对比表
  pitfalls_avoided:
  - 避免在每一层进行无范围限制的全局穷举搜索：利用血管连续性，将前一层最大内切圆圆心作为下一层搜索起点并限定局部范围，从而显著减少距离计算量。
  - 避免直接把切片几何中心当作中轴线交点：倾斜或弯曲管道的截面并非标准圆形，几何中心会产生系统偏差，因此改用具有几何定理支撑的最大内切圆圆心。
  - 避免忽略切片方向造成的信息退化：当中轴线与切片近似平行时，轴线关于z方向的变化率增大，有限切片难以准确定位交点，因此通过旋转切面获得近似垂直截面。
  - 避免将多个并列最大内切圆圆心简单平均：这些点可能沿轴线投影方向形成曲线，直接平均会偏离真实中轴线，应对候选点进行样条拟合并选取更合理的代表点。
  - 避免仅依赖直观图形判断重建质量：同时使用边界距离残差和截面区域差异率进行定量验证，防止光滑曲线在视觉上合理但实际存在覆盖或遗漏误差。
  - 避免将等径模型无条件推广到变径血管：最大内切圆半径等于统一管径的结论依赖固定半径假设，若血管半径显著变化，应改用局部变半径管道模型。
  innovation_points:
  - 利用等径管道切片轮廓为圆族包络线的几何性质，将三维血管中轴线识别转化为逐层最大内切圆搜索。
  - 建立边界点到轴线的距离残差与重建截面区域差异率两种互补误差评价方法。
  - 针对中轴线与原切片夹角过小导致的误差，自适应地从其他方向构造旋转切面并重新估计中心点。
  - 通过中轴线反向投影和球截圆叠加重建二维截面，使模型验证结果能够进一步用于中轴线修正。
- id: B题_截断切割优化模型
  source_paper: B题 B题_截断切割优化模型
  problem_type: 优化
  keywords:
  - 长方体截断切割
  - 切割次序优化
  - 0-1规划
  - 参数化费用分析
  - 调刀成本
  context: 在从待加工长方体中切出位置与尺寸已知的成品长方体时，综合考虑各次切割面积、水平与垂直切割单价差异及调刀费用，确定总加工费用最小的六面切割次序。
  models:
  - name: 分类枚举与参数化费用优化模型
    role: 在限定每对平行面先切厚度较大一侧后，将可行切割次序缩减为90种，并按调刀次数分类，分别求出各类最小切割面积及关于调刀费用的线性总费用表达式。
    why: 问题规模较小且切割次序离散，经过支配关系降维后可以完整遍历；分类后还能直观分析调刀费用变化对最优方案的影响。
  - name: 0-1切割次序规划模型
    role: 以0-1变量表示某一面是否在某一步切割，通过行列唯一性约束形成排列矩阵，并利用费用影响矩阵、最大省费矩阵刻画先前切割对后续切割面积和费用的影响。
    why: 切割次序本质上属于带顺序依赖成本的组合优化问题，0-1规划能够统一表达面与切割位置的对应关系、可行次序约束以及总费用最小化目标。
  - name: 零调刀费用下的厚度排序准则模型
    role: 当调刀额外费用为零时，将六个待切部分按等效厚度从大到小依次切割；厚度相同时，对相应面进行全排列以获得全部最优解。
    why: 通过相邻两次切割的交换比较可证明先切厚度较大的部分不会增加费用，因此特殊参数条件下无需枚举或求解整数规划即可直接得到最优次序。
  solution_flow: 输入待加工长方体与成品长方体的长、宽、高、六侧切除厚度、水平和垂直单位面积费用及单次调刀费用→通过缩放高度进行等效转换，统一水平面与垂直面的单位面积切割费用→证明每对平行面应先切厚度较大的一侧，将6!种次序压缩为90种可行次序→根据每一步剩余长方体尺寸计算切割面积和基础费用，并识别刀具方向变化次数→按调刀次数分类，得到各类最小费用关于调刀费用的线性表达式→比较各费用函数或求其下包络，确定不同参数区间内的最优切割方案→在零调刀费用情形使用厚度降序准则直接求解→通过理论证明、实例计算和全枚举程序进行验证。
  validation: 首先采用两种切割顺序的费用差比较，证明平行面中厚切除侧优先以及零调刀费用下厚度降序准则的最优性；其次对给定尺寸实例计算各类费用函数并用交点划分调刀费用区间；最后由计算机完整枚举90种可行切割次序，将枚举所得最优费用和最优次序与模型及图解结果对照，结果一致，同时用反例说明“每次选择当前切割面积最小的面”的贪心规则并非最优。
  visualization:
  - 待加工长方体与成品长方体相对位置及六面编号示意图
  - 各调刀次数类别的总费用—调刀费用直线图
  - 费用函数下包络及最优参数区间图
  pitfalls_avoided:
  - 避免直接处理全部6!=720种切割排列：利用同一对平行面中先切厚度较大一侧的支配性结论，将候选方案缩减为90种，既降低计算量，也排除了必然费用较高的次序。
  - 避免直接比较水平面与垂直面的原始切割面积：两类面的单位面积费用不同，若不先做高度等效缩放，单纯按面积比较会产生错误排序。
  - 避免采用“每次选择当前费用或面积最小的面”的局部贪心策略：当前面积最小不代表对后续尺寸缩减贡献最大，切割费用还受待切部分厚度和体积影响，因此局部最优不能保证总费用最小。
  - 避免忽略调刀成本对最优解的改变：不同切割次序的面积成本和调刀次数存在权衡，必须将方案按调刀次数分类并比较参数化总费用，而不能只最小化切割面积。
  - 避免将不完整的0-1规划过度推广：原模型未完全给出任意调刀费用下调刀次数的统一数学表达式，因此对其适用范围作了限制，并以枚举分类模型处理一般参数情形。
  innovation_points:
  - 提出平行面厚侧优先的支配规则，并用理论证明将切割次序空间由720种有效压缩为90种。
  - 通过缩放长方体高度进行等效转换，把水平与垂直单位面积费用统一，从而简化后续面积比较和优化计算。
  - 将候选次序按调刀次数分类，把总费用写成调刀费用参数的线性函数，并利用直线下包络给出不同参数区间对应的最优方案。
  - 构造费用影响矩阵、最大省费矩阵和0-1切割次序矩阵，尝试系统描述前序切割对后续切割费用的动态影响。
  - 在调刀费用为零的特殊情形下给出经过交换论证的厚度降序最优准则，并允许通过相同厚度面的全排列得到全部最优解。
- id: A题_非线性交调的频率设计_A题
  source_paper: A题 A题_非线性交调的频率设计_A题
  problem_type: 统计分析+优化
  keywords:
  - 非线性交调频率设计
  - 最小二乘多项式回归
  - 离散约束优化
  context: 针对非线性系统产生的二阶、三阶交调干扰，在给定频率范围、接收带和信噪比约束下设计三个整数输入频率。
  models:
  - name: 三次多项式输入输出模型
    role: 描述非线性系统的输入输出关系，并为交调频率及其振幅的推导提供基础。
    why: 二次项和三次项能够产生题目要求考虑的二阶、三阶交调，而更高次项的拟合系数很小，其影响处于稳定性允许范围内。
  - name: 多元最小二乘回归模型
    role: 根据实验数据估计三次多项式中各阶项的系数。
    why: 系统参数未知且已有输入输出观测数据，最小二乘法能够通过最小化残差平方和获得稳定、可计算的参数估计。
  - name: 交调频率展开模型
    role: 将多频输入代入非线性输出函数，识别二阶和三阶交调的频率形式及对应振幅。
    why: 交调来源于输入信号的乘方与混频，代数展开可系统得到频率组合，并剔除远离接收带、不会造成干扰的项。
  - name: 信噪比判别模型
    role: 对位于接收带边缘附近的交调项进行二次筛选，判断其干扰是否可以忽略。
    why: 仅依据频率间隔无法评价接收带外但距离较近的交调影响，需要结合目标信号振幅与交调振幅的分贝比进行判定。
  - name: 整数穷举约束优化模型
    role: 在允许频段内枚举互不干扰的整数频率组合，并依次施加接收带约束和信噪比约束得到可行解。
    why: 输入频率限定为整数且搜索范围有限，穷举能够完整覆盖可行域，避免连续优化取整造成漏解或约束失效。
  - name: 基本交调条件与充要条件模型
    role: 将大量交调限制化简为少数关键不等式，刻画频率组成为可行解的充分必要条件。
    why: 原始交调条件数量多且相互关联，通过有效条件、基本条件、对称性引理和充要条件定理可直接构造全部解并解释其结构。
  - name: 灵敏度与稳定性分析模型
    role: 分析拟合系数、高次项和输入频率微小波动对最终频率解的影响。
    why: 实际系统存在参数估计误差、模型截断误差和发射频率误差，必须验证所得离散解在合理扰动下仍保持可行。
  solution_flow: 实验输入输出数据→选取三次多项式并用多元最小二乘法估计系数→将多频输入代入模型并展开二阶、三阶交调频率及振幅→删除远离目标频带的无效交调项→在整数频率范围内穷举候选组合→利用接收带隔离条件筛选→对接收带边缘附近的交调使用信噪比阈值再次筛选→得到最终频率组→通过系数扰动、高次项误差、频率扰动及理论充要条件验证结果。
  validation: 首先将手工最小二乘拟合结果与软件拟合结果比较以验证参数估计精度；随后求出保证“可行解仍可行、非可行解仍不可行”的系数扰动区间；再比较高次多项式项引起的交调振幅变化与该稳定区间，验证三次模型截断的合理性；同时分析输入频率微小波动对接收带约束的影响；最后用基本交调条件、解组对称性和充要条件定理重新推导全部解，并与计算机穷举结果核对。
  visualization:
  - 候选频率组合及分层筛选结果表
  - 拟合值与实测值对比图
  - 多项式系数稳定区间图
  - 频率轴上的输入频率、交调频率与接收带分布图
  pitfalls_avoided:
  - 避免直接假设线性输入输出关系，因为线性模型不能生成二阶、三阶交调，无法反映问题的核心干扰机制。
  - 避免盲目采用过高阶多项式，因为高阶模型会增加参数估计和交调展开的复杂度；论文通过高阶系数量级及稳定性范围证明三次截断已足够。
  - 避免枚举所有代数展开项后逐项判断，因为大量交调频率必然远离目标接收带；先按频率范围剔除无效项可显著减少计算量。
  - 避免只按交调是否落入接收带进行硬判定，因为接收带外但靠近边缘的交调仍可能造成明显干扰；因此增加信噪比阈值筛选。
  - 避免把频率作为连续变量求解后再简单取整，因为取整可能破坏频率间隔和交调约束；直接在整数可行域中穷举可保证解的完整性。
  - 避免将各个交调约束视为彼此独立，因为其中存在冗余和逻辑蕴含关系；通过有效交调条件和基本交调条件完成约束降维。
  - 避免只报告数值解而不检验鲁棒性，因为拟合系数、模型阶数和实际发射频率都存在误差；稳定性分析确保结果在合理扰动下不改变。
  - 避免仅依赖计算机搜索而缺乏理论解释，通过充要条件和对称性定理验证穷举无漏解，并揭示解成对出现的原因。
  innovation_points:
  - 将数据驱动的三次多项式拟合、交调机理展开、整数穷举和信噪比筛选整合为一套完整的频率设计方法。
  - 从大量二阶、三阶交调限制中提炼出基本交调条件，并证明其与完整交调条件在可取频率组上的等价性。
  - 证明解组关于频段中点具有对称性，从而解释可行解成对出现的结构，并可缩小搜索范围。
  - 给出频率组存在的充分必要条件及直接构造步骤，使问题由逐项穷举提升为可推广的解析判定。
  - 同时考察拟合系数波动、高次项截断误差和输入频率微扰，形成多层次的鲁棒性验证框架。
- id: 2020_C109
  source_paper: 2020 2020_C109
  problem_type: 统计分析
  keywords:
  - 文本重复
  - 水印噪声
  - 正文缺失
  context: 所提供内容仅包含大量重复的微信公众号水印信息，未包含可识别的论文问题背景、建模过程或研究结论。
  models:
  - name: 未识别（论文正文缺失）
    role: 无法从现有文本中确定论文采用的核心模型及其作用。
    why: 输入内容不含模型名称、数学公式、变量定义或方法描述，若指定具体模型将构成无依据推断。
  solution_flow: 输入文本→识别高频重复水印→判定有效论文正文缺失→无法提取模型与参数→无法复原求解和验证流程
  validation: 通过文本去重与内容完整性检查进行验证；去除重复的“微信公众号：数学模型”等水印后无有效论文正文，因此不能识别原论文的实验验证、误差分析、敏感性分析或稳健性检验策略。
  visualization:
  - 重复文本词频统计图（可用于诊断水印噪声）
  - 有效文本与噪声文本占比图（可用于展示正文缺失情况）
  pitfalls_avoided:
  - 避免根据“数学模型”公众号名称臆测论文主题，因为来源标识不能代表具体研究问题。
  - 避免虚构模型、参数和验证结果，因为现有文本未提供任何公式、数据、图表或结论依据。
  innovation_points:
  - 采用去重与高频短语识别判断输入文本是否被水印噪声覆盖。
  - 在证据不足时明确标注信息不可识别，避免生成未经原文支持的建模知识。
- id: B题_钢管订购和运输策略
  source_paper: B题 B题_钢管订购和运输策略
  problem_type: 优化+统计分析
  keywords:
  - 混合整数二次规划
  - 钢管订购运输
  - 灵敏度分析
  - 树形网络
  - 曲线拟合
  context: 在钢厂产能、最低订购量和管道铺设需求等约束下，确定线形或树形管网的钢管采购、运输与铺设方案，并分析价格及产能变化对总费用的影响。
  models:
  - name: 单位钢管最小购运费用模型
    role: 将钢管售价和从钢厂到各管道节点的运输费用合并为单位最小购运费用系数cij，为后续优化提供成本参数。
    why: 预先压缩采购与运输路径信息，可以避免在主模型中重复处理具体运输路线，降低决策维度并使目标函数更清晰。
  - name: 线形管网混合整数二次规划模型
    role: 联合决定钢厂是否启用、各钢厂向各节点供应的数量以及相邻节点区段两端分别承担的铺设长度，使采购、运输和铺设总费用最小。
    why: 钢厂启用状态需要0-1变量，最低订购量、产能和节点供需平衡可用线性约束描述，而节点到具体铺设位置的累计运输费用呈二次形式，因此适合采用混合整数二次规划。
  - name: 参数扰动与曲线拟合灵敏度分析模型
    role: 逐个改变钢厂销售价格或产量上限，重复求解优化模型，并拟合参数变化与总费用、购运计划变化之间的关系。
    why: 最优方案可能随价格和产能发生分段或非线性变化，单纯依靠局部导数难以完整反映方案切换，采用离散扰动、重复优化和曲线比较更直观稳健。
  - name: 有向树形管网混合整数二次规划模型
    role: 把线形管网模型推广到树形管网，通过对树边定向并建立各节点的流量平衡关系，优化树上钢管的订购、运输和铺设。
    why: 将树定向为根节点入度为0、其余节点入度为1的有向树后，每个非根节点都有唯一入边，便于统一表达入边剩余铺设量、出边铺设量和节点到货量之间的守恒关系。
  solution_flow: 整理钢厂售价、产能上限、最低订购量、运输距离和管道边长等数据→计算钢厂到各节点的单位最小购运费用cij→设置钢厂启用变量xi、节点供货量yij和区段铺设分配变量z→建立包含产能、最低订购量、总需求、节点平衡及变量边界的混合整数二次规划模型→利用Lingo求得最低总费用及购运方案→在限定范围内逐个扰动钢管售价和产能上限并重复求解→利用Matlab拟合敏感性曲线，比较不同钢厂对总费用和购运计划的影响→通过树边定向和节点流量守恒将模型推广至树形管网。
  validation: 论文主要采用可行性校验与敏感性复算进行验证：检查各钢厂采购量是否满足启用条件、最低订购量和产能上限，核对钢管总量是否等于管道总里程，并验证各节点及各边的铺设量守恒；随后对价格和产能参数进行多组扰动，重复求解并比较最优费用及方案变化，通过拟合曲线的变化趋势和不同钢厂之间的结果对比检验模型响应的合理性，同时以线形管网作为树形模型的特殊情形检查推广模型的一致性。
  visualization:
  - 钢管售价变动—最优总费用变化拟合曲线
  - 产能上限变动—总费用及各钢厂采购量变化曲线
  pitfalls_avoided:
  - 用500xi≤Σjyij≤sixi把钢厂启用状态与采购量联动，避免未启用钢厂仍产生供货量，也避免启用钢厂的订单低于最低生产批量。
  - 同时设置总需求约束和节点铺设量平衡约束，避免钢管在相邻区段间被重复计算或出现已采购数量无法对应具体铺设里程的情况。
  - 设置0≤z≤w限制每条边由起点侧承担的铺设长度，避免出现铺设量超过边长、负铺设量或通过不合理回运来降低目标值的伪解。
  - 将价格波动限制在原售价的10%以内，并将产能变化限制在减少300至增加600的区间，避免依据局部拟合结果对钢厂破产或超大规模扩产等极端情景进行失真外推。
  - 对树形管网先进行统一定向，使除根节点外的每个节点只有一条入边，避免无向树中入流、出流定义含混而导致节点守恒式遗漏或重复。
  - 把到达节点后的逐公里转运费用显式写成二次累计费用，而不是简单采用固定单位费用，避免忽略铺设位置距离节点越远、累计运输成本越高的特征。
  innovation_points:
  - 以单位钢管最小购运费用cij整合采购价格和干线运输成本，再与节点到具体铺设位置的二次累计运输费用联合优化，形成结构简洁的混合整数二次规划模型。
  - 利用区段分割变量z描述相邻两个节点分别承担同一管段的铺设长度，在较少变量下实现采购、节点配送和末端铺设的一体化决策。
  - 采用参数扰动、重复优化与Matlab曲线拟合相结合的方法，识别对总费用和购运计划影响最大的钢厂，而不仅给出单一静态最优方案。
  - 通过给树的每条边定向并按根节点、内部节点和叶节点分别建立守恒关系，将线形管道模型推广到一般树形管网，增强了模型的通用性。
- id: A题_自动化车床管理建模分析
  source_paper: A题 A题_自动化车床管理建模分析
  problem_type: 统计分析+优化
  keywords:
  - 预防性换刀
  - 定期质量检查
  - 更新过程平均费用
  - 竞争故障风险
  - 误判损失
  context: 针对同时存在刀具故障、非刀具故障及质量检验误判的自动化车床，利用故障寿命数据确定最优换刀间隔与检查间隔，以最小化单位零件平均费用。
  models:
  - name: 刀具寿命分布拟合模型
    role: 根据100次刀具故障记录建立刀具寿命的经验分布或连续拟合分布F(x)，并计算预防性换刀条件下的故障特征。
    why: 换刀间隔会改变刀具实际故障概率和平均故障间隔，因此必须先用寿命数据刻画刀具可靠性；同时应明确F(x)是在无非刀具故障条件下的条件分布。
  - name: 故障率叠加与平均故障间隔模型
    role: 分别计算预防性换刀下的刀具平均故障间隔a_u和非刀具平均故障间隔b，再通过1/c=1/a_u+1/b得到工序综合平均故障间隔c。
    why: 刀具故障和非刀具故障共同造成工序失效，不能仅依据刀具寿命数据计算总故障率；在独立风险假设下，故障率叠加能够统一两类故障。
  - name: 单位产品平均费用模型
    role: 将预防性换刀费用k/u、检查费用t/n、不合格品损失及故障修复费用统一折算为每生产一个零件的长期平均费用。
    why: 换刀与检查具有不同周期，单位产品平均费用可以将各项成本置于同一尺度，并在故障率较低时近似替代单位合格品平均费用，使目标函数更易计算。
  - name: 条件不合格品数量期望模型
    role: 计算相邻两次检查之间发生故障后产生的不合格品平均数m，并在低故障率条件下近似取m≈(n+1)/2。
    why: 故障不能立即被发现，检查间隔决定故障后继续生产的不合格品数量，该期望是连接检查策略与质量损失的关键变量。
  - name: 检验误判损失修正模型
    role: 将正常工序检出不合格品导致的误停机损失，以及故障工序检出合格品导致的漏检和延期发现损失加入目标函数。
    why: 当检验结果并非完全可靠时，只计算检查费用和真实故障损失会系统性低估成本；误停机与漏检对最优检查间隔具有相反影响。
  - name: 更新周期—报酬模型
    role: 在假设任一工序故障后均更换新刀的条件下，以新刀投入至故障或预防性换刀为一个更新周期，计算周期期望费用C、期望产量T及长期平均费用L=C/T。
    why: 故障后统一换刀可形成独立同分布的更新周期，利用更新报酬思想能够直接处理随机周期长度，并完整核算检查、维修、废品和换刀费用。
  - name: 竞争风险最小寿命模型
    role: 令刀具故障时间X1与非刀具故障时间X2竞争，以Y=min(X1,X2)表示工序首次故障时间，构造综合故障间隔分布G(x)。
    why: 工序终止由最先发生的故障决定，取最小值比简单缩放刀具寿命或按故障比例混合分布更符合故障机理。
  - name: 离散联合参数优化模型
    role: 在u=sn及整数约束下，对换刀间隔u和检查间隔n进行联合寻优；给定u时可由n≈sqrt(2ct/f)获得候选值，再枚举和比较总费用。
    why: 综合故障间隔c依赖换刀间隔u，两个决策变量相互耦合，必须比较联合可行组合，不能用一次性的分步单参数优化代替全局搜索。
  solution_flow: 数据→由100次刀具故障记录建立经验分布或拟合F(x)，并根据刀具故障占95%、非刀具故障占5%估计非刀具故障率→设定检查间隔n、换刀间隔u及u=sn等管理约束→计算预防性换刀下的刀具故障间隔、综合故障间隔和检查延迟造成的不合格品期望→建立单位产品平均费用模型，或在统一换刀假设下建立更新周期费用率C/T→在第二问中加入误停机和漏检损失参数→对整数参数(u,n)进行解析初筛与网格枚举联合优化→比较两类建模口径、检查概率权重和边界情形，并通过敏感性分析检验策略稳定性。
  validation: 首先核验各随机情形的概率权重之和为1，并确认刀具寿命F(x)仅用于无非刀具故障条件；其次检查无非刀具故障、无误判、检查间隔趋小或换刀间隔趋大等退化情形是否回到相应简化模型；再用单位费用模型与更新周期—报酬模型对最优区间和费用变化趋势进行交叉验证；最后改变寿命分布拟合方式、搜索步长、故障率、换刀费、检查费和废品损失费开展敏感性分析，并在最优点邻域加密枚举以排除粗网格造成的伪最优。
  visualization:
  - 刀具寿命经验分布函数与拟合分布曲线
  - 刀具可靠度或故障率随加工件数变化曲线
  - 单位平均费用关于换刀间隔和检查间隔的三维曲面图
  - 不同换刀间隔下最优检查间隔及最小费用折线图
  - 费用构成堆叠柱状图
  - 关键成本与故障率参数的敏感性分析图
  pitfalls_avoided:
  - 不能忽略非刀具故障，因为其虽然只占约5%，仍会改变综合故障间隔、修复成本和最优策略；直接按刀具寿命优化会高估工序可靠性。
  - 不能把刀具寿命分布F(x)当作包含全部故障的无条件分布，因为该数据是在无非刀具故障条件下得到的条件分布；混合不同情形时若条件不一致，会出现概率权重之和不为1。
  - 不能先在固定n下求u，再固定所得u求n并直接宣称全局最优，因为c随u变化且费用中u、n相互耦合，单次坐标式寻优可能停在非全局最优组合。
  - 不能简单令综合故障间隔Y=0.95X1，因为故障比例不是寿命的线性缩放系数；更合理的处理是通过独立故障率叠加或Y=min(X1,X2)构造竞争风险分布。
  - 不能简单用0.95F(x)+0.05H(x)替代综合首次故障分布，因为刀具故障与非刀具故障是竞争发生关系，而不是先随机选择故障类型再抽取寿命的普通混合关系。
  - 不能只加权各情形的单位产品费用而忽略周期长度差异；更新模型中应先分别求期望总费用和期望总产量，再计算C/T，否则长短周期会被赋予错误权重。
  - 不能把检验视为完全准确，因为正常状态下的误停机会增加停机损失，故障状态下的漏检会延长不合格生产时间，两类误判均会显著改变最优检查频率。
  - 不能采用过粗搜索步长后直接接受最优结果，因为u和n为离散变量且费用曲面可能较平坦或存在多个局部低点；应在候选最优区域加密搜索并复算费用。
  innovation_points:
  - 将定期质量检查与预防性换刀放入同一长期平均费用框架，同时统筹检查费、换刀费、维修费和不合格品损失。
  - 同时考虑刀具故障和非刀具故障，并通过故障率叠加或竞争风险模型纠正只分析刀具寿命的局限。
  - 针对不同维修机制给出无明显更新点的平均故障率模型和有更新点的更新周期—报酬模型两种建模路径。
  - 将正常工序误停机和故障工序漏检两种检验误判显式货币化，使检查策略能够反映真实检测性能。
  - 提出可扩展的动态管理思路，包括复检机制以及随刀具使用年龄增加而缩短检查间隔的自适应检查策略。
- id: A题优秀论文_2002年A_C题车灯灯丝长度优化设计的数学模型和数值模拟
  source_paper: A题优秀论文 A题优秀论文_2002年A_C题车灯灯丝长度优化设计的数学模型和数值模拟
  problem_type: 优化+仿真
  keywords:
  - 车灯灯丝长度优化
  - 光线跟踪
  - 反射点轨迹积分
  context: 在旋转抛物面汽车前照灯满足测试屏上B、C两点最低光强规范的条件下，优化均匀线光源的长度并使其总功率最小。
  models:
  - name: 几何光学反射向量模型
    role: 根据灯丝点光源、抛物面反射点及其法向量，计算反射光线的方向和测试屏落点。
    why: 车灯尺寸远大于光波波长，可采用几何光学近似；反射向量公式能够把光源位置、反射面几何结构和屏幕照射位置统一关联起来。
  - name: 面元受光能量模型
    role: 利用立体角、距离平方反比和入射角余弦，计算点光源照射到反射面微元上的能量。
    why: 不同反射点与光源的距离和入射角不同，所接收并反射的能量并不相同，必须进行能量加权而不能仅统计光线条数。
  - name: 光线跟踪数值仿真模型
    role: 离散灯丝和抛物反射面，逐条计算反射光线在测试屏上的落点与能量，并估计B、C点附近的光强函数h_B(l)和h_C(l)。
    why: 该模型实现直接、适用于复杂光路和遮挡判断，不要求显式求出全部反射点轨迹，可用于数值模拟和交叉验证。
  - name: 反射点轨迹积分模型
    role: 求解能把灯丝上各点发出的光反射至B、C点的反射点方程，并沿灯丝位置对各反射点的光强贡献进行积分。
    why: 目标仅涉及测试屏上的特定点，直接追踪有效反射点可减少大量无关光线计算，并获得更明确的光强积分表达式。
  - name: 约束功率优化模型
    role: 建立min W，约束W·h_B(l)≥2、W·h_C(l)≥1，并将其化为W(l)=max{2/h_B(l),1/h_C(l)}的一维优化问题。
    why: 光强与总功率成正比，先计算单位功率下的光强即可分离功率变量；利用两项约束的平衡点h_B(l)=2h_C(l)可确定全局最优灯丝长度。
  solution_flow: 输入抛物面尺寸、焦点位置、灯丝布置和25米测试屏上的B、C点坐标→建立坐标系并推导反射向量及面元能量公式→分别构造光线跟踪模型和反射点轨迹积分模型→对给定灯丝长度计算单位功率光强h_B(l)、h_C(l)→分析光强函数的起亮值、峰值和单调区间→数值求解h_B(l)=2h_C(l)得到最优长度l*→计算最小功率W*=1/h_C(l*)=2/h_B(l*)→通过加密离散、模型对比和遮挡检验验证结果，得到最优灯丝长度约3.89毫米。
  validation: 采用网格收敛检验，将灯丝分段数和反射面剖分密度同时加倍，并缩小B、C点附近的统计区域，若计算光强和最优长度无显著变化则认为精度可信；同时比较光线跟踪与反射点轨迹积分两种独立模型的结果，检查h_B、h_C应具有起亮后上升、达到峰值再下降的物理规律，验证最优解满足两项光强约束且位于相应峰值区间，并在全光路遍历中检查反射面自身遮挡。
  visualization:
  - h_B(l)与h_C(l)随灯丝长度变化曲线及约束平衡点图
  - 测试屏反射光亮区与光强分布图
  - 抛物面反射点轨迹图
  - 灯丝—反射面—测试屏三维光线追踪图
  pitfalls_avoided:
  - 避免仅用落入目标区域的光线条数代表光强，因为不同光线对应的传播距离、入射角和面元大小不同，其携带的反射能量并不相等。
  - 避免在离散精度未经检验时直接接受仿真结果，因为灯丝分段、反射面网格和目标邻域面积都会显著影响点光强估计，必须进行同步加密和收敛测试。
  - 避免把反射面到测试屏的坐标变换默认视为一一映射，因为实际车灯反射可能存在多个反射点对应同一屏幕点的多值情形，并可能出现雅可比行列式为零的奇异点，使普通变量代换公式失效。
  - 避免忽略反射面自身遮挡，因为部分按反射公式得到的光线可能被灯体或反射面再次阻挡，若全部计入会高估测试屏光强和亮区范围。
  - 避免直接对灯丝长度和功率进行低效二维搜索，因为利用光强与功率的线性关系可先求单位功率光强，再将问题降为W(l)=max{2/h_B(l),1/h_C(l)}的一维优化。
  - 避免只检查单个测点约束，因为B点要求达到2倍额定光强、C点要求达到1倍额定光强，忽略任一约束都可能得到功率较小但不符合工业规范的方案。
  innovation_points:
  - 同时建立直接光线跟踪模型与反射点轨迹积分模型，从正向离散仿真和目标点反求有效反射路径两个角度描述同一光学系统。
  - 将均匀线光源表示为连续点光源叠加，并把各点光源经多个反射点产生的能量贡献进行加权积分，准确处理多反射点和非均匀能量贡献。
  - 利用单位功率光强函数将功率变量分离，并通过h_B(l)=2h_C(l)的约束平衡关系直接定位最优灯丝长度，而非进行盲目枚举。
  - 提出通过反射面到测试屏的坐标变换及雅可比行列式精确计算光束面积，同时明确指出多值映射和雅可比奇异情形下需要采用广义积分处理。
- id: A题_施肥方案对作物_蔬菜的影响
  source_paper: A题 A题_施肥方案对作物_蔬菜的影响
  problem_type: 预测+优化+统计分析
  keywords:
  - 多元二次回归
  - 施肥响应面
  - 最优施肥组合
  - 多重共线性
  - 边际产量
  context: 基于土豆和生菜在不同氮、磷、钾施肥水平下的试验数据，分析肥料用量及其交互作用对产量的影响，并确定产量最大或成本最小的施肥方案。
  models:
  - name: 三元二次回归模型
    role: 建立氮、磷、钾施用量与作物产量之间的非线性生产函数，用于产量预测、效应分析和施肥优化。
    why: 作物产量通常随施肥量呈先增加后递减的规律，二次项能够描述肥效递减和内部最优点，交互项能够刻画不同营养元素之间的协同或制约关系。
  - name: 全回归模型
    role: 对一次项、二次项及可识别的交互项进行整体拟合，完成参数估计、显著性检验和模型适度性检验。
    why: 全回归能够系统考察候选影响项，为识别主要营养元素、二次效应及潜在交互作用提供完整基准。
  - name: 逐步回归模型
    role: 从候选一次项、平方项和交互项中筛选显著变量，分别构造土豆和生菜的简化产量模型。
    why: 候选项之间存在较强相关性，逐步回归可以减少冗余项、缓解参数不稳定，并识别土豆中显著的施肥交互作用以及生菜中不显著的交互作用。
  - name: 二次响应面模型
    role: 分析回归曲面的典型特征、主导方向、敏感方向和最佳响应水平，并求取最大产量对应的施肥组合。
    why: 响应面方法适合对多个连续投入变量进行联合优化，可通过驻点和曲面形状判断最优点性质，同时评价各肥料在最优点附近的敏感程度。
  - name: 边际产量与肥效递减模型
    role: 对产量函数分别求一阶、二阶偏导，分析增加单位肥料带来的产量变化以及肥效递减速度。
    why: 一阶偏导具有明确的边际产量含义，二阶偏导能够衡量作物对施肥量的敏感性，为控制过量施肥和解释最优施肥水平提供依据。
  - name: 等产量条件下的最小成本组合模型
    role: 在给定目标产量和肥料价格条件下，利用边际技术替代率确定氮、磷、钾的最低成本组合。
    why: 单纯追求最大产量未必具有最佳经济效益，将边际产量之比与肥料价格之比结合，可以把生物学最优扩展为经济学最优。
  solution_flow: 整理土豆和生菜的氮、磷、钾施肥量及产量数据→假定其他生产条件一致、试验独立且误差同方差正态→对变量进行中心化、标准化或编码，并以方差膨胀因子和矩阵秩检查多重共线性→分别建立三元二次全回归模型并进行参数估计、F检验和t检验→采用逐步回归筛选显著的一次项、平方项和交互项，比较两种作物的主导肥料及交互差异→利用二次响应面分析驻点、曲面凹凸性、特征方向和敏感方向，求取试验范围内的最大产量及对应施肥量→对生产函数求一阶和二阶偏导，分析边际产量、肥效递减和施肥敏感性→结合肥料价格与边际替代率求解给定产量下的最小成本组合→通过拟合优度、显著性检验、残差诊断、预测区间回判和农业机理一致性验证结论。
  validation: 采用多层验证：首先以方差膨胀因子检查变换后模型的共线性是否减弱，并检查设计矩阵是否满秩；其次通过方差分析F检验验证回归方程整体显著性，通过参数t检验及置信区间判断各效应项的显著性和估计稳定性；再利用复相关系数或决定系数评价拟合精度，绘制残差对观测值或拟合值散点图，检查残差是否在零值两侧随机分布且无系统偏差；使用原始样本回判，确认观测产量落入给定置信水平的预测区间；比较全回归、逐步回归和响应面回归所得主导因素与最优点是否一致；最后确认最优点位于试验范围内，并用土豆偏重钾肥需求、生菜偏重磷肥需求等农艺规律进行外部合理性检验。
  visualization:
  - 残差—拟合值散点图
  - 实际产量—预测产量对比图
  - 三维二次响应曲面图
  - 等产量线或响应面等高线图
  - 肥料主效应与敏感性排序图
  pitfalls_avoided:
  - 避免直接用原始施肥量拟合全部一次项、平方项和交互项，因为这些派生变量之间容易产生严重多重共线性，使最小二乘参数失真；论文通过中心化、标准化、区间编码和方差膨胀因子检查降低该影响。
  - 避免在设计矩阵不满秩时仍强行估计全部参数，因为部分交互项可能由其他项线性表示，导致参数不可识别；论文检查矩阵秩，并在全回归阶段仅保留可识别项，再借助逐步回归研究交互作用。
  - 避免仅依据较高的拟合优度认定模型可靠，因为高拟合度不能排除系统偏差、参数不显著或误差结构异常；论文同时使用F检验、t检验、参数置信区间、残差图和预测区间回判。
  - 避免对土豆和生菜套用完全相同的变量结构，因为不同作物对营养元素及其交互作用的反应不同；论文分别建模，识别出交互作用对土豆显著、对生菜不显著。
  - 避免把试验区间外的二次模型极值直接作为推荐方案，因为多项式外推可能产生不符合农艺规律的虚假最优点；论文强调最优施肥点在试验范围内达到，从而提高结论可信度。
  - 避免只报告最大产量而忽略最优点附近的敏感性和经济性，因为某些肥料的微小偏差可能导致明显减产，且最大产量方案未必成本最低；论文进一步分析响应面的陡缓方向、边际产量和最低成本组合。
  innovation_points:
  - 将全回归、逐步回归和二次响应面回归串联使用，以完整拟合、变量筛选和联合优化相互校验，提高模型稳健性与解释性。
  - 针对土豆和生菜分别识别主导营养元素及交互作用差异，而不是建立统一经验模型，体现了作物类型的异质性。
  - 不仅求出最佳施肥量和最大产量，还通过响应面特征方向分析最优点附近的敏感性，指出实际施肥中应重点控制的肥料用量。
  - 从回归生产函数进一步推导边际产量、肥效递减速度和边际技术替代率，将统计拟合结果转化为可执行的定量施肥与成本控制规则。
  - 将统计显著性、预测回判、试验范围约束与农业机理一致性结合，形成数据证据和领域知识相互支持的验证框架。
- id: 2017年全国数模题目讲解_数学建模评阅情况-谢金星
  source_paper: 2017年全国数模题目讲解 2017年全国数模题目讲解_数学建模评阅情况-谢金星
  problem_type: 统计分析+综合评价
  keywords:
  - 竞赛参赛数据统计
  - 论文综合评阅
  - 评分标准化
  - 违规检测
  - 模型检验
  context: 基于2017年全国大学生数学建模竞赛的报名、送评、获奖与评阅数据，分析竞赛规模及获奖结构，并构建公平、规范的论文综合评阅机制。
  models:
  - name: 描述性统计模型
    role: 统计各赛区参赛学校数、本科与专科队数、同比增长率、送评数量及获奖比例，刻画竞赛规模和结构。
    why: 原始资料以分类计数和年度对比数据为主，描述性统计能够直接揭示地区差异、规模变化和奖项分布特征。
  - name: 分段比例配额模型
    role: 根据赛区报名队数所在区间，按12%、10%、8%和5%的分段比例计算送全国评阅的论文基数。
    why: 分段递减比例既兼顾不同赛区的参赛规模，又避免大型赛区按固定比例获得过多名额，有助于平衡代表性与评阅容量。
  - name: 多指标综合评价模型
    role: 依据假设合理性、建模创造性、结果正确性和表述清晰性等维度，对参赛论文进行百分制综合评分与等级评定。
    why: 数学建模论文质量不能由单一结果精度决定，需要同时评价模型原理、方法创新、论证质量、结果可信度和写作规范。
  - name: 评委评分标准化模型
    role: 剔除各评委评分的高分段和低分段后，对中间分数进行均值与方差校准，降低评委尺度差异。
    why: 不同评委存在宽严程度和分数离散程度差异，标准化处理可增强跨评委评分的可比性与最终排名的公平性。
  - name: 随机多评委交叉评阅模型
    role: 通过随机编号、随机分卷和回避制度，使一等奖申报论文由3人评阅、二等奖申报论文由2人评阅，并对分歧较大的论文复核。
    why: 多评委独立评价能够降低单个评委主观偏差，随机分配与回避机制可减少利益关联和系统性偏差。
  - name: 异常与相似性检测模型
    role: 识别论文及程序中的雷同、抄袭、过度引用和其他违规情况，并结合多名专家复核作出认定。
    why: 仅依赖人工阅读难以及时发现大规模文本或程序相似问题，自动相似性筛查与人工审核结合可兼顾效率和认定准确性。
  solution_flow: 汇总各赛区报名、送评、获奖及违规数据→按地区、组别、题号和奖项进行描述性统计与同比分析→使用分段比例配额模型确定送评基数→建立包含合理性、创造性、正确性和清晰性的综合评价指标→随机分卷并组织多评委独立评分→对评分进行均值与方差标准化→复核级差较大、等级边界及疑似违规论文→核对纸质版、电子版、程序和结果的一致性→形成最终奖项与质量分析结论。
  validation: 采用多层验证策略：同一论文由2至3名评委独立评阅以检验评价一致性；对标准化后级差较大的论文进行集体讨论和复核；将一等奖申报论文与二等奖论文横向比较以校验等级边界；由多名专家和组长复核雷同或抄袭嫌疑，避免仅凭相似度直接定性；核验纸质版、电子版、源程序与计算结果的一致性；对具体建模论文还应开展关键假设合理性论证、模型结果检验和敏感性分析。
  visualization:
  - 各赛区参赛队数分组柱状图
  - 本科与专科队数堆叠柱状图
  - 年度报名规模及增长率对比图
  - 各题获奖等级分布图
  - 送评与获奖转化率漏斗图
  - 论文评阅与复核流程图
  pitfalls_avoided:
  - 避免只有算法而没有明确数学模型，因为评阅者无法判断算法所依据的机制、变量关系和适用条件。
  - 避免只有程序而没有算法流程，因为代码本身不能替代方法说明，也难以检查求解逻辑与结果可复现性。
  - 避免只针对单个数据集就事论事，因为缺乏一般化表达会削弱模型的迁移能力和学术价值。
  - 避免省略模型检验或仅做形式化检验，因为未经误差、敏感性或一致性分析的结果无法证明稳定性和可信度。
  - 避免罗列大量无关紧要的假设，因为冗余假设会掩盖决定模型有效性的关键条件，且增加逻辑不一致风险。
  - 避免只列参考文献而不在正文标注引用位置，因为读者无法区分作者原创工作与外部资料，容易构成不规范引用或抄袭。
  - 避免大段照搬文献或网络程序，即使列出来源也可能属于过度引用，并会削弱论文的独立性与创造性。
  - 避免纸质论文、电子论文、程序与结果不一致，因为这会破坏结果的可复现性，并可能引发真实性或违规质疑。
  - 避免夸大模型优点或泛泛描述不足，因为优缺点分析应对应模型机制、关键假设和实际误差，才能提供有效评价。
  - 避免仅追求与标准答案一致或数值精度最高，因为竞赛更重视方法合理性、创造性和完整论证，偶然得到好结果不能替代可靠模型。
  innovation_points:
  - 将随机匿名分卷、多评委交叉评阅、回避制度、评分标准化和争议复核组合成完整的公平性控制机制。
  - 采用分段递减比例分配送评名额，在赛区规模差异明显的条件下兼顾覆盖面、代表性与全国评阅工作量。
  - 综合评价不以结果精度或与评阅要点的一致性为唯一标准，而是同时强调关键假设、模型创造性、结果正确性和表达清晰性。
  - 将论文文本相似性、程序相似性、引用规范及纸质版与电子版一致性纳入质量控制，实现学术规范与建模质量的联合审查。
  - 强调详细摘要、模型原理、算法流程、程序说明、敏感性分析和模型检验的完整证据链，提高论文的可理解性与可复现性。
- id: B题_灾情巡视路线寻优模型
  source_paper: B题 B题_灾情巡视路线寻优模型
  problem_type: 优化
  keywords:
  - 灾情巡视路线优化
  - 多旅行商问题
  - 最小生成树分解
  context: 将县政府出发、遍历全部乡镇和村庄并返回的灾情巡视任务抽象为赋权连通图，在单组、多组、限时及人员充足等条件下优化巡视总路程、完成时间和组间均衡性。
  models:
  - name: 赋权连通图模型
    role: 将县政府、乡镇和村庄表示为顶点，将公路表示为带距离权的无向边，并以点权表示不同地点的停留时间。
    why: 道路网络具有天然的图结构，边权和点权能够统一描述行驶时间、巡视停留时间及路线连通关系。
  - name: 旅行商回路优化模型
    role: 在单组巡视或每个分区内部寻找从县政府出发、覆盖所有指定节点并返回县政府的最短闭合巡视路线。
    why: 任务要求遍历所有目标地点并回到起点，本质上属于一般旅行商问题，可用最短回路目标刻画总距离或总时间。
  - name: 最小生成树分解模型
    role: 先利用最小生成树反映节点之间的邻近关系，再将道路网络划分为若干尽量连通、规模或点权接近的子图。
    why: 最小生成树以较小边权连接全部节点，便于形成地理上紧凑的巡视区域，并显著降低直接求解多旅行商问题的组合复杂度。
  - name: 多组均衡最小最大优化模型
    role: 以各组完成时间的最大值最小为主要目标，同时兼顾总路程最短和各组巡视负担接近。
    why: 多组并行巡视的整体完成时间由最慢小组决定，仅优化总距离可能造成严重失衡，因此需要采用最小化最大组耗时的思想。
  - name: 扩环—增环—换枝局部优化模型
    role: 在生成树分区得到的初始路线基础上，通过扩展回路、增加局部环和替换重复枝边，迭代缩短路线。
    why: 旅行商问题属于NP困难问题，直接精确求解运算量大；依据局部边权增量判断是否调整，可用较低计算成本获得较优可行解。
  - name: 最短路树标号分组算法
    role: 在巡视人员和车辆充足时，按节点到县政府的最短距离依次构造巡视点集，在给定时间下限内尽可能吸收其他节点并确定所需组数。
    why: 人员充足情形的目标是压缩最长巡视时间，最短路树能够识别最远节点形成的时间下界，并支持在该下界约束下逐组覆盖节点。
  - name: 参数敏感性与路线再平衡模型
    role: 分析乡镇或村庄停留时间变化对各组总耗时的影响，并通过组间转移节点重新调整路线。
    why: 点权变化会改变原有分组的均衡性和最优性，利用耗时增量比较可以判断何时必须重新分配巡视节点。
  solution_flow: 数据：读取道路拓扑、公路长度、县政府位置、乡镇与村庄类别及对应停留时间；模型：构建带边权和点权的无向连通图，将单组任务表述为旅行商回路，将多组任务表述为连通分区下的均衡多回路优化；参数：根据车速把距离转换为行驶时间，并设置乡镇、村庄停留时间、巡视组数或完成时限；求解：先求最小生成树，根据节点数或点权和进行连通均衡分区，再连接各分区与县政府的最短路径，采用扩环、增环、换枝策略生成并改进闭合路线；对限时问题枚举或递增组数，对人员充足问题利用最短路树标号算法确定时间下界及分组数；验证：检查全节点覆盖、路线闭合和分区连通性，比较局部调整前后的距离增量、各组耗时最大值及均衡程度，并通过停留时间变化开展敏感性分析。
  validation: 首先验证每条路线均从县政府出发并返回、所有乡镇和村庄至少被覆盖一次且各子图保持可达；其次对扩环、增环和换枝分别计算调整前后的边权差，仅接受能够缩短总路程或降低最大完成时间的操作；再次比较各组路程、点权和与完成时间，检验并行巡视的均衡性以及是否满足给定时限；最后改变乡镇、村庄停留时间，观察最优分组和最长耗时是否发生变化，并据此进行节点转移和路线再平衡。该方法属于启发式近似求解，只能验证可行性、局部改进性和结果合理性，不能证明得到全局最优解。
  visualization:
  - 道路赋权网络图
  - 最小生成树及分区示意图
  - 各组巡视回路图
  - 分组路程与完成时间对比表
  - 停留时间参数敏感性曲线
  pitfalls_avoided:
  - 避免只最小化所有小组的总路程，因为并行任务的完工时间取决于最慢小组，总路程较短仍可能出现某一组负担过重；模型同时控制最大组耗时和组间均衡性。
  - 避免直接在完整道路图上穷举多条旅行商回路，因为旅行商及多旅行商问题计算复杂度高；先用最小生成树分区，再进行局部回路优化可显著压缩搜索空间。
  - 避免仅按节点数量机械均分，因为乡镇与村庄停留时间不同，节点数相同并不代表工作量相同；限时分组时改用点权和衡量巡视负担。
  - 避免分区后出现不连通区域或与县政府无法形成闭合路线，因为这会产生不可执行方案；分解时优先保持子图连通，并保留子图到县政府的最短路径节点。
  - 避免把生成树直接作为巡视路线，因为树上叶枝通常需要原路往返，会造成大量重复路程；通过扩环、增环和换枝将树状结构调整为尽可能完整的回路。
  - 避免在停留时间参数变化后继续沿用原分组，因为点权变化可能使原有均衡关系失效；通过耗时增量分析判断阈值并重新转移节点。
  - 避免将启发式结果宣称为严格全局最优，因为局部调整可能停留在局部最优；论文明确其近似性质，并以可行性、局部增益和均衡效果评价结果。
  innovation_points:
  - 提出基于最小生成树的连通均衡分解方法，将复杂的多组巡视问题拆分为若干规模较小的子图旅行商问题。
  - 设计扩环、增环和换枝三类可手工计算的局部优化规则，通过边权增量快速减少枝路重复和总行程。
  - 将道路距离形成的边权与乡镇、村庄停留时间形成的点权统一纳入巡视时间计算，使模型可同时处理最短距离和最短完工时间目标。
  - 针对固定组数、限定时间和人员充足三种情形分别建立求解策略，并以最远节点的最短往返时间构造人员充足情形下的完工时间下界。
  - 利用节点在组间转移后的时间增量开展参数敏感性分析，使路线能够随不同类型地点的停留时间变化进行动态再平衡。
- id: A题_零件的参数设计(1)
  source_paper: A题 A题_零件的参数设计(1)
  problem_type: 优化+仿真+统计分析
  keywords:
  - 零件参数设计
  - 有约束非线性规划
  - 蒙特卡罗仿真
  - 线性近似
  - 容差优化
  context: 针对大批量产品的零件参数与容差等级设计，在标定值范围和离散容差等级约束下，最小化零件成本与产品性能偏离目标值所造成的质量损失之和。
  models:
  - name: 有约束非线性规划模型
    role: 将零件标定值、容差等级、零件成本和质量损失统一纳入总费用最小化框架。
    why: 产品性能由多个随机零件参数通过复杂非线性经验公式共同决定，且标定值具有区间约束、容差等级具有离散约束，因此适合建模为混合变量的有约束非线性优化问题。
  - name: 两步分解优化模型
    role: 先固定容差等级优化各零件标定值，再固定标定值遍历并优化容差等级。
    why: 标定值是连续变量而容差等级是离散变量，直接联合搜索计算量过大；分步求解能够显著降低复杂度，并通过联合优化结果对比证明其近似误差较小。
  - name: 蒙特卡罗仿真模型
    role: 模拟相互独立的正态分布零件参数，并通过产品性能经验公式生成性能参数样本，以估计其分布和期望质量损失。
    why: 产品性能经验公式复杂，难以解析推导输出变量的概率分布，随机模拟可以直接处理非线性传播和阶梯型质量损失函数。
  - name: 一阶泰勒线性化与正态近似模型
    role: 在零件参数标定值附近对产品性能函数作一阶展开，解析计算产品性能参数的近似均值、方差和分布。
    why: 独立正态随机变量的线性组合仍服从正态分布，因此线性化后可避免每次计算目标函数都进行大规模仿真，从而提高优化效率。
  - name: 均方偏差代理目标模型
    role: 以产品性能参数相对目标值的均方偏差作为质量损失的替代目标，简化原阶梯型损失函数。
    why: 均方偏差可分解为方差与均值偏差平方之和，既鼓励输出集中于目标值附近，又便于解析计算和梯度搜索；当质量损失为抛物线型时还具有直接经济意义。
  - name: 梯度下降与一维寻优模型
    role: 在零件标定值允许区间内搜索连续变量子问题的局部最优解。
    why: 线性近似或代理目标关于标定值可导，梯度方向能够提供有效下降方向，并可结合步长搜索处理多维连续优化。
  - name: 离散枚举模型
    role: 在标定值确定后，对筛选后的容差等级组合进行遍历，选取总费用最低的配置。
    why: 容差等级数量有限且属于离散决策，枚举可以在候选集合内保证找到最优组合；预先删除成本过高的等级可进一步减少计算量。
  - name: 卡方拟合优度检验
    role: 检验线性化后用正态分布近似产品性能参数实际分布的合理性。
    why: 正态近似是解析计算质量损失和加速优化的关键前提，需要利用蒙特卡罗样本频数与理论正态概率进行统计一致性检验。
  solution_flow: 输入零件标定值上下界、候选容差等级及成本、产品性能经验公式和质量损失标准→假设各零件参数相互独立且服从正态分布，并令标准差为容差的三分之一→建立零件成本与期望质量损失之和的有约束非线性规划模型→固定初始容差等级，利用蒙特卡罗仿真或一阶泰勒线性化计算产品性能分布及目标函数→采用梯度法和一维寻优确定标定值→固定标定值，筛选并枚举容差等级组合以获得最低总费用→使用均方偏差代理目标进行快速复核→通过正态拟合优度检验、重复仿真误差分析以及分步解与联合优化解对比验证结果。
  validation: 首先在最优方案处生成大量蒙特卡罗样本，将产品性能参数样本分组，并采用卡方拟合优度检验验证正态近似；其次对同一参数方案重复进行蒙特卡罗模拟，观察目标函数波动范围，以量化随机仿真的精度上限；再次在线性近似模型中同时优化标定值与容差等级，将所得总费用与两步分解结果比较，检验分步策略的有效性；最后比较蒙特卡罗法、线性近似法和代理目标法的优化结果，进行多模型交叉验证，并通过多个初始点搜索降低陷入较差局部最优解的风险。
  visualization:
  - 不同方法下标定值、容差等级与总费用的结果对比表
  - 产品性能参数样本直方图与理论正态密度曲线叠加图
  - 梯度迭代过程中目标函数值的收敛曲线
  - 重复蒙特卡罗仿真所得总费用的误差箱线图
  - 不同容差等级组合对应成本、质量损失和总费用的分组柱状图
  pitfalls_avoided:
  - 避免直接对连续标定值和全部离散容差等级进行联合穷举，因为组合数量会随零件数和等级数指数增长；采用先优化标定值、再筛选并枚举容差等级的两步策略控制计算复杂度。
  - 避免在缺乏依据时直接假定产品性能参数严格服从正态分布，因为非线性经验公式可能导致偏态或厚尾；先通过一阶线性化给出正态近似的理论来源，再利用蒙特卡罗样本进行拟合优度检验。
  - 避免每次目标函数求值都重新进行大规模蒙特卡罗模拟，因为随机波动会干扰梯度方向且计算成本高；引入线性近似和均方偏差代理目标获得稳定、可解析的目标函数。
  - 避免只考虑零件采购成本而忽略容差对产品合格率和质量损失的影响，因为最低等级零件未必带来最低总费用；模型同时计入零件成本与期望质量损失。
  - 避免把梯度法得到的单个结果误认为全局最优，因为非线性目标函数可能存在多个局部极值；采用多个初始点重复搜索，并与枚举、蒙特卡罗和联合优化结果进行比较。
  - 避免报告超过仿真能力的数值精度，因为有限样本会使目标函数估计产生随机波动；通过同一方案的重复模拟估计误差范围，并将其作为结果精度上限。
  innovation_points:
  - 将零件标定值设计与容差等级配置统一表示为零件成本和期望质量损失之和的随机非线性优化问题。
  - 提出连续标定值优化与离散容差等级选择相分离的两步求解策略，在显著降低计算量的同时保持接近联合优化的结果。
  - 同时采用蒙特卡罗仿真和一阶泰勒线性化两条路径计算产品性能分布，实现高保真评估与快速解析优化之间的互补。
  - 引入产品性能相对目标值的均方偏差作为代理目标，将复杂阶梯型质量损失转化为均值偏差平方与方差之和，便于梯度求解。
  - 通过拟合优度检验、重复仿真误差评估和分步策略对照实验，对分布近似、数值精度及优化策略分别进行验证。
- id: A题_一类投资组合问题的建模与分析
  source_paper: A题 A题_一类投资组合问题的建模与分析
  problem_type: 优化
  keywords:
  - 投资组合优化
  - 收益-风险权衡
  - 非连续交易成本
  - 多目标优化
  - 线性规划
  context: 在资金总额有限且证券交易同时包含固定费用和比例费用的条件下，确定证券选择及投资金额，以协调净收益最大化与投资风险最小化。
  models:
  - name: 带非连续交易成本的收益-风险双目标投资组合模型
    role: 统一描述证券选择、资金分配、净收益、交易成本、预算约束和总体风险，是问题的原始模型。
    why: 投资决策同时追求高收益和低风险，且固定交易费用使成本函数在零投资点不连续、非凸，必须在模型中显式反映是否购买与购买多少两个层次。
  - name: 固定风险水平下的最大净收益模型
    role: 给定投资者可承受的风险上限，在预算约束下求净收益最大的投资组合。
    why: 将风险作为约束、收益作为目标，能够直接匹配具有明确风险承受能力的投资者，并可通过改变风险上限分析收益与风险的依存关系。
  - name: 固定盈利水平下的最小风险模型
    role: 给定最低净收益要求，寻找总体风险最小的投资组合。
    why: 适用于投资者先设定收益底线、再尽可能规避风险的决策情形，也是双目标模型的一种标准标量化方式。
  - name: 风险-收益加权和模型
    role: 利用风险偏好参数将净收益和总体风险合成为单目标，生成不同偏好下的投资方案。
    why: 投资者对收益和风险的相对重视程度不同，加权参数可以刻画这种偏好，并用于比较不同参数下证券选择和资金配置的变化。
  - name: 最大单项风险度量模型
    role: 以各项证券风险损失量中的最大值度量投资组合总体风险。
    why: 该度量反映不同证券的极端风险损失通常不会同时发生，避免简单累加风险造成的过度保守，并能通过引入辅助变量转化为线性约束。
  - name: 大资金条件下的线性规划近似模型
    role: 在总资金相对各证券最低起投额和固定交易费用足够大时，将交易成本近似线性化，并把投资金额归一化为资金比例后求解。
    why: 原模型因固定交易费用而非凸、非连续，一般求解较困难；在大资金假设下，固定费用影响相对较小，固定风险模型和加权和模型可转化为标准线性规划并由成熟软件稳定求解。
  - name: 收益效率排序贪心模型
    role: 在特定线性化情形下，按单位风险或单位资金对应的净收益效率降序配置资金，快速构造最优方案。
    why: 当模型退化为具有单一容量约束的线性资源分配问题时，优先投资收益效率最高的项目即可达到最优，无需调用通用线性规划程序。
  solution_flow: 数据→整理各证券收益率、风险损失率、固定交易费、比例交易费、起投条件、银行收益率和资金总额→定义证券投资额、银行存款额及交易成本分段函数→计算扣除交易费用后的净收益，并以最大单项风险损失定义总体风险→建立预算约束下的收益-风险双目标模型→分别采用固定风险、固定收益和风险收益加权三种方式标量化→在资金总额足够大时线性化交易费用、归一化投资比例，并引入辅助变量线性化最大风险→使用线性规划软件或特定条件下的收益效率排序算法求解→改变风险上限、收益下限和偏好参数，比较投资品种、投资比例、净收益与风险→通过原始非连续成本复算、敏感性分析及方案对比验证结果。
  validation: 将线性化方案代回原始分段交易成本函数，重新核算总支出、净收益和最大风险，检查预算、风险上限及最低收益约束是否满足；对风险上限、目标收益、风险偏好参数、收益率、风险率和交易费率进行扰动，观察证券选择与配置比例的稳定性；同时比较固定风险、固定收益和加权和模型得到的非劣方案，检查其是否形成一致的风险-收益有效前沿。论文指出参赛方案普遍缺少模型验证、评价和敏感性分析，因此这些步骤应作为必要补充。
  visualization:
  - 风险-收益有效前沿图
  - 不同偏好参数下投资比例堆叠柱状图
  - 参数敏感性折线图
  - 交易成本线性近似误差对比图
  pitfalls_avoided:
  - 预算约束中必须计入交易费用；若只约束证券购买金额之和不超过总资金，会低估实际资金占用，使所得组合在现实中不可行。
  - 必须按照题意使用最大单项风险损失作为总体风险，而不能未经说明替换为方差、标准差或风险简单求和，否则模型含义与题设假设不一致，结果也无法直接比较。
  - 不能把含固定费用的交易成本函数直接视为光滑函数；该函数在零投资点不连续且整体非凸，直接调用依赖梯度或可微条件的非线性规划程序可能得到错误结果或局部结果。
  - 线性化交易成本必须以总资金足够大、单项投资通常超过起投值且固定费用相对较小为前提；若资金不足以覆盖各项目起步值，证券选择会产生明显离散效应，简单线性近似可能改变最优解。
  - 不能只给出某一个偏好参数下的单一最优组合；收益和风险构成多目标决策，单一结果高度依赖投资者偏好，应通过多组风险上限、收益下限或权重展示方案变化。
  - 随机模拟或粗粒度枚举不宜作为主要精确求解方法；其计算量大、精度受采样或步长影响，并可能遗漏由固定交易费用引起的最优离散组合。
  innovation_points:
  - 将投资决策分解为是否购买证券和购买多少两个层次，并用含固定成本与比例成本的非连续交易费用函数刻画真实交易机制。
  - 采用最大单项风险损失而非风险简单相加来度量组合风险，体现不同证券风险损失通常不会同时发生的现实特征。
  - 通过固定风险、固定收益和加权和三种标量化模型系统揭示收益与风险的相互依存关系，而不是仅求一个缺乏偏好解释的单点最优解。
  - 在大资金条件下将非凸、非连续模型化简为线性规划，并通过辅助变量处理最大值风险，从而兼顾模型真实性与计算可行性。
  - 从一维装箱问题归约说明一般形式模型具有NP难性质，为采用近似化、结构化算法和数值优化方法提供复杂性依据。
- id: A题_自动化车床管理的数学模型
  source_paper: A题 A题_自动化车床管理的数学模型
  problem_type: 统计分析+优化
  keywords:
  - 自动化车床管理
  - 检查与换刀策略
  - 期望单位正品成本
  context: 针对刀具随机故障和产品质量误判条件下的自动化车床管理问题，联合优化产品检查间隔与预防性换刀间隔，以降低单位合格品的期望成本。
  models:
  - name: 刀具故障寿命正态分布模型
    role: 描述刀具故障发生时刻的随机规律，并计算故障落入各生产区间的概率。
    why: 历史数据表明刀具寿命可用均值为600.0、标准差约为195.644的正态分布拟合，从而可通过密度函数积分量化不同故障区间的概率。
  - name: 条件伯努里质量模型
    role: 分别描述刀具正常和故障后生产合格品的概率，并刻画定期抽检结果。
    why: 正常刀具生产合格品的概率为0.98，故障刀具生产合格品的概率为0.4，抽检结果可据此表示为分阶段伯努里事件。
  - name: 事件遍历与全概率期望模型
    role: 遍历刀具故障区间、首次检出不合格品时刻及达到强制换刀上限等互斥情形，计算总费用与合格品数量的期望。
    why: 不同事件路径对应误判停机、故障换刀、正常换刀、检查和废品损失等不同成本，只有进行完备的互斥分类才能避免漏算或重复计费。
  - name: 期望更新成本率优化模型
    role: 以每个生产更新周期内的期望总费用与期望合格品数之比作为目标函数，联合确定检查间隔s和换刀上限u。
    why: 直接最小化单周期总费用可能通过减少产量获得虚假优势，而E(F)/E(N)能够统一衡量每件合格品承担的长期平均成本。
  - name: 离散穷举搜索模型
    role: 在s取1至100、u取100至600的整数可行域内搜索全局最优策略。
    why: 决策变量为整数且目标函数由分段积分、多重求和和事件条件构成，难以直接求导；有限可行域穷举可稳定获得全局最优解。
  - name: 多故障独立扩展模型
    role: 在刀具故障之外加入服从区间[0,22800]均匀分布的其他故障，并扩展事件联合遍历。
    why: 实际设备不仅存在刀具故障，通过独立故障时间模型可检验基础策略在更真实生产环境中的变化和稳健性。
  solution_flow: 数据→利用历史故障数据估计刀具寿命正态分布参数，并给定正常与故障刀具的合格率及各类成本→模型→以检查间隔s和最大生产量u为决策变量，划分刀具故障时段与首次检出不合格品时刻，按全概率公式构造E(F)和E(N)，建立min
    E(F)/E(N)→参数→代入合格率0.98与0.4，以及废品、检查、故障调节、误判停机和正常换刀费用→求解→对s=1至100、u=100至600进行整数穷举，得到基础情形s=54、u=304；若要求u为s的整数倍，则得到s=51、u=306；考虑其他故障时得到s=40、u=314→验证→比较约束变化和故障机制扩展前后的最优策略及目标值，检查结论的稳定性。
  validation: 首先检查所划分事件是否互斥且完备，使各事件概率之和接近1；其次在有限整数可行域内实施全域穷举，并比较最优点与邻域方案的目标函数值；再次增加“u为s的整数倍”的现实约束，比较最优成本仅发生小幅变化；最后加入独立的其他故障后重新优化，观察最优检查与换刀间隔的调整，以进行情景稳健性验证。
  visualization:
  - 检查间隔s与换刀上限u对应的单位正品成本等高线图
  - 不同故障情景及约束条件下最优策略与目标值对比柱状图
  pitfalls_avoided:
  - 避免只最小化单个生产周期的总费用，因为不同策略产生的合格品数量不同，直接比较总费用会偏向低产量策略；采用E(F)/E(N)衡量单位合格品成本。
  - 避免将刀具故障简单放在检查点上，因为故障可能发生在两次检查之间的任一产品位置；将每个检查区间进一步按单件产品细分并对故障密度积分。
  - 避免漏掉未检出不合格品和刀具在换刀上限后才故障的尾部事件，因为这些情形分别对应故障换刀或正常预防换刀；模型显式加入j=n+1和i=n+2两类边界事件。
  - 避免混淆误判停机、故障调节和正常换刀成本，因为三者触发机制不同；分别使用费用a、d、k并按事件路径计入。
  - 避免把故障前后的产品合格率视为相同，因为刀具状态改变会显著影响废品数量；模型分别采用0.98和0.4计算分段合格品期望。
  - 避免对非光滑整数目标函数直接使用连续求导法，因为事件边界随s和u离散变化；在有限范围内采用穷举搜索保证不遗漏全局最优整数方案。
  innovation_points:
  - 将刀具寿命分布、抽检机制、产品质量概率和多种经济损失统一到更新周期的期望成本率框架中，实现检查间隔与换刀间隔的联合优化。
  - 通过“故障发生区间—首次检出不合格品时刻”的二维事件遍历，精细刻画故障、误判和漏检对合格品数量及成本的联合作用。
  - 利用单位合格品期望成本而非单周期总成本作为评价指标，使不同生产周期长度和产量规模的策略具有可比性。
  - 将基础单故障模型扩展为刀具故障与其他故障相互独立的多故障模型，增强了模型对实际设备运行环境的适应性。
- id: B题_管道订购和运输
  source_paper: B题 B题_管道订购和运输
  problem_type: 优化
  keywords:
  - 管道订购与运输
  - 非凸二次规划
  - 线性规划与模拟退火
  context: 在钢厂供给能力、最低起订量和管道分段需求约束下，联合确定钢管采购来源、节点运输量及沿管线左右铺设量，使采购与运输总费用最小。
  models:
  - name: 最短运输路径费用模型
    role: 预处理各钢厂到管线节点的运输成本，形成单位综合费用矩阵C_ij。
    why: 钢管从钢厂到节点可能经过不同公路或铁路路径，先求单位运费最小路径可将复杂路网压缩为标准运输费用矩阵，并与出厂价格合并。
  - name: 两阶段非凸二次规划模型
    role: 统一描述钢厂到节点的采购运输和节点到施工段的二次转运铺设决策，以总费用最小为目标。
    why: 沿管线运输费用随左右铺设距离呈二次变化，同时钢厂存在“不生产或至少生产500单位”的析取约束，因此原问题属于非连续可行域上的非凸二次优化问题。
  - name: 固定节点到货量的线性规划模型
    role: 根据分段运输费用在两端均分时最小的性质，先固定各节点到货量，将主要的采购运输决策转化为线性规划。
    why: 钢厂到节点的长距离运输费用占总成本的大部分；固定铺设分配后，目标函数和供需约束均可线性化，从而快速获得质量较高的可行初始解。
  - name: 钢厂启停情景枚举模型
    role: 分别考察最低产量边界上的钢厂停产组合，处理“产量为0或不低于500”的逻辑约束。
    why: 直接忽略析取约束可能得到不可行解，而对处于500单位边界的钢厂进行启停比较，可以在不引入复杂整数变量的情况下改进线性规划结果。
  - name: 网络拆分与分区优化模型
    role: 依据工厂与节点的距离和供给饱和情况，将原运输网络拆成左右子网络并逐步调优。
    why: 局部区域的优势供应商关系较明确，拆分后可降低问题规模，并利用右侧最优供应结构和左侧供给缺口进行针对性优化。
  - name: 模拟退火优化模型
    role: 以分区优化所得可行解为初始解，对非凸模型进行全局近似搜索。
    why: 原模型含二次费用和非连续可行域，常规局部优化容易陷入局部最优；模拟退火可接受一定概率的劣解，从而增强跳出局部最优的能力。
  solution_flow: 数据→根据路网计算各钢厂到各节点的最小运输费用并叠加出厂价，形成C_ij→建立采购运输与沿线铺设相结合的两阶段非凸二次规划→推导单段铺设费用的最小值、最大值及均分最优性质→固定节点到货量，将主体问题转化为线性规划→比较边界钢厂的启停组合，得到总费用1297186的可行解→按左右区域拆分网络并利用优势供应关系重新优化，得到1288326→以该解为模拟退火初值继续搜索，获得近似最优费用1278198→通过约束可行性、费用界和多方案目标值比较验证结果。
  validation: 首先检验各施工段左右供给量之和等于分段需求、各节点流量平衡、钢厂供给不超过产能且满足停产或至少生产500单位的逻辑条件；其次利用单段二次运输费用的解析最小值和最大值构造费用范围，检查计算结果的合理性；最后比较全工厂生产、S4停产、S7停产、S4与S7同时停产、网络拆分优化及模拟退火等方案的目标值，确认费用由1297186下降至1288326并进一步下降至1278198，以多阶段改进和可行性检查支持结果的有效性。
  visualization:
  - 钢厂—运输网络—管线节点示意图
  - 不同钢厂启停方案的供给量与总费用对比表
  - 各节点或施工段运输费用分布表
  - 模拟退火目标函数收敛曲线
  pitfalls_avoided:
  - 避免将“钢厂停产或产量至少为500”直接当作普通连续区间约束；该条件会造成非连续可行域，若允许产量处于0到500之间将产生不符合订购规则的伪最优解，因此采用启停情景比较处理。
  - 避免直接对完整非凸二次规划进行一次性求解；二次铺设费用与析取约束叠加后难以保证全局最优，因此先利用均分性质线性化并构造高质量可行解，再用模拟退火改进。
  - 避免只优化钢厂到节点的长途运输费用而遗漏节点到具体铺设地点的二次转运费用；后者虽占比相对较小，但会改变节点到货量和左右铺设量的最优分配。
  - 避免机械地让所有钢厂都维持最低产量；对恰处于500单位边界的S4、S7进一步测试停产情景，发现二者同时停产可降低采购运输费用。
  - 避免在全网络上平均分配供应而忽视空间优势；通过识别S5、S6对右侧节点的相对成本优势并拆分网络，减少了远距离和交叉运输。
  innovation_points:
  - 从单段二次运输费用出发解析推导左右供给均分时费用最小，并据此固定节点到货量，将非线性主体近似转化为可直接求解的线性规划。
  - 采用“线性规划构造可行解—钢厂启停情景调优—网络拆分局部优化—模拟退火全局改进”的分层混合求解框架，兼顾求解效率与解的质量。
  - 利用运输网络的地理和成本结构识别优势供应商及区域供给缺口，将大规模网络拆为结构相似的子问题进行优化。
  - 以解析费用上下界、多个启停方案和连续改进的目标值共同验证结果，而非仅依赖单次启发式算法输出。
- id: B题_管道订购与运输问题
  source_paper: B题 B题_管道订购与运输问题
  problem_type: 优化
  keywords:
  - 产量未定运输模型
  - 等价费用转换
  - 组合优化
  context: 在钢厂供应能力和最低订购量约束下，联合确定钢管订购数量、供应分配及运输路线，使管道建设的采购与运输总费用最小。
  models:
  - name: Floyd最短路径模型
    role: 计算铁路网络以及等价公路网络中钢厂到各单位管道需求点的最短运输路径和最低单位费用。
    why: 运输网络包含多个站点和不同路线，需要通过全源最短路径算法统一获得任意节点间的最低运输成本。
  - name: 铁路与销售价格等价公路转换模型
    role: 依据单位费用相等原则，将分段铁路运费和钢管销售价格统一折算为等价公路距离或公路运输费用。
    why: 统一费用口径后可将采购与多式联运问题转化为单一公路运输问题，降低网络结构和目标函数的复杂度。
  - name: 产量未定的0-1运输模型
    role: 以每单位管道为一个需求点，决定各需求点由哪个钢厂供应，并同时确定各钢厂的实际订购量。
    why: 每个需求点需求量为1，必须且只能由一个钢厂供应，同时钢厂存在停产、最低订购量500和产量上限等离散约束，适合采用带产量选择约束的0-1运输模型。
  - name: 改进的最小元素法
    role: 按照当前最低单位费用依次分配需求点，为大规模0-1运输模型快速构造可行初始方案。
    why: 直接求解数千个需求点对应的0-1规划计算规模较大，贪婪分配能够以较低计算成本生成质量较好的初始解。
  - name: 改进的伏格尔法
    role: 利用最优供应选择与备选供应选择之间的费用差额确定分配优先级，生成更具全局性的初始方案。
    why: 费用差额可以反映需求点失去最低费用供应机会后的机会损失，能够弥补最小元素法只关注局部最低费用的不足。
  - name: 试探法与两两对调迭代模型
    role: 对供应量低于500的钢厂分别试探调整至0或500，并通过需求点供应者两两交换持续降低总费用。
    why: 该局部搜索方法能够修复最低订购量约束，并利用交换邻域消除初始方案中可通过供应者互换改进的局部不合理分配。
  solution_flow: 数据→整理钢厂售价、产量上限、铁路和公路网络、运价表及管道各单位位置→利用Floyd算法计算铁路最短路，并按等费用原则将铁路运费和钢厂售价折算为公路费用→计算各钢厂到全部单位需求点的最低单位费用矩阵C→建立每个需求点需求量为1、钢厂订购量取0或不低于500且不超过产量上限的0-1运输模型→分别采用改进的最小元素法和改进的伏格尔法生成初始解→对供应量低于500的钢厂试探停用或提升至500→对不同钢厂负责的需求点进行两两对调迭代→检查供需、产能和最低订购量约束，并比较不同初始解优化后的总费用与稳定性。
  validation: 首先进行可行性检验，确认每个需求点恰好由一个钢厂供应、各钢厂供应量不超过产量上限且启用后的订购量不少于500；其次比较改进的最小元素法与改进的伏格尔法所得初始费用，检验伏格尔法的改进效果；再次对低于500的供应量分别进行降为0和提升至500的双方案试探，选择费用更低者；最后从两种不同初始方案出发执行两两对调局部搜索，两者均收敛到相同费用，并确认所有成对交换均不能继续降低目标值，以此验证结果的稳定性和局部最优性，但不能据此严格证明全局最优。
  visualization:
  - 钢厂—需求点最低单位费用矩阵热力图
  - 钢厂供应区间与最优运输路线分布图
  - 不同算法及迭代阶段总费用对比图
  pitfalls_avoided:
  - 避免仅以15个管道站点代替全部实际需求位置，因为站点无法反映5171或5903个单位管段的空间差异，会造成运输距离和费用估计偏差；论文将管道按单位长度离散为需求点。
  - 避免将铁路、公路运输费和钢管销售价直接混合比较，因为三类费用的计价方式和量纲表达不同；通过等费用折算将其统一纳入最低单位费用矩阵。
  - 避免使用普通运输模型允许任意小额订购，因为钢厂实际供应量具有停用或至少订购500单位的离散要求；模型显式加入0或区间[500，产量上限]约束，并对不足500的初始供应量进行修复。
  - 避免直接求解超大规模0-1规划导致计算资源难以承受，因为需求点数量达到数千；采用启发式初始分配与局部交换相结合的组合优化算法降低求解难度。
  - 避免只使用最小元素贪婪法造成局部最优，因为抢占当前最低费用供应可能迫使其他需求点使用高成本方案；改进伏格尔法依据机会损失确定优先级。
  - 避免将不同初始解得到相同结果误认为严格证明全局最优，因为两两对调仅搜索特定邻域；论文结果最多说明在该交换邻域下无法继续改进。
  innovation_points:
  - 提出费用等价转换原则，将铁路运输、道路运输和钢管销售价格统一转化为单一公路运输成本，从而简化采购—多式联运联合优化问题。
  - 将连续管道按单位长度离散为数千个需求点，建立兼顾空间位置差异、钢厂产能和最低订购量的产量未定0-1运输模型，统一处理不同线路情形。
  - 针对大规模模型设计改进的最小元素法和改进的伏格尔法，并结合0或500供应量试探和钢厂间需求点两两对调，形成“初始解构造—约束修复—局部优化”的分阶段算法。
- id: B题论文_2005年B_D题DVD在线租赁问题研究
  source_paper: B题论文 B题论文_2005年B_D题DVD在线租赁问题研究
  problem_type: 统计分析+优化
  keywords:
  - 期望周转次数
  - DVD库存配置
  - 0-1整数规划
  context: 针对在线DVD租赁网站，在会员租赁频率和偏好已知但个体类型不可辨识的条件下，确定各类DVD的最少采购量及最大化整体会员满意度的分配方案。
  models:
  - name: 基于期望周转次数的DVD需求量模型
    role: 根据愿意观看某类DVD的人数、目标覆盖率和单张DVD在给定周期内的期望利用次数，计算各类DVD的最少准备数量。
    why: 会员的月租赁次数具有随机性且个体类型事先不可区分，使用概率期望可以从总体比例出发估计DVD的平均周转能力，并将随机租赁行为转化为可计算的库存需求。
  - name: 三个月多阶段周转期望模型
    role: 枚举不同会员类型形成的租赁序列及其概率，计算单张DVD三个月内利用次数的期望值，并据此估算长期库存需求。
    why: 三个月内DVD会经历多次归还和再出租，简单地将单月期望线性放大不能充分描述不同租赁序列，因此需要按可能方案及其发生概率计算综合期望。
  - name: 0-1整数规划分配模型
    role: 在各类DVD库存容量和每位会员恰好获得3张DVD的约束下，确定会员与DVD之间的分配关系，使总体不满意度最小，即整体满意度最大。
    why: 每位会员是否获得某类DVD属于离散的二元决策，同时存在库存容量和固定分配数量约束，0-1整数规划能够统一表示这些条件并获得全局最优分配方案。
  - name: 会员可辨识条件下的优先分配下界模型
    role: 假设能够识别高频租赁会员并优先向其分配DVD，计算一个月和三个月条件下的理论最小采购量，作为原库存模型的对照基准。
    why: 优先满足周转速度更快的会员可以提高单盘利用次数，该模型虽依赖较强假设，但可提供理论下界，用于评价不可辨识会员条件下库存方案的合理性。
  solution_flow: 数据→利用会员中60%每月租两次、40%每月租一次的比例以及各DVD的偏好人数，将抽样调查数据按会员总体规模扩展→建立期望周转模型，得到单月期望利用次数1.6，并通过租赁序列及概率计算三个月期望利用次数4.4489→结合单月50%和三个月95%的目标覆盖率，计算各类DVD需求量并向上取整→以会员是否获得某类DVD为0-1变量，将偏好排序转化为不满意度成本，对未选择项目赋充分大的惩罚值→加入每类DVD分配量不超过库存、每位会员恰好获得3张DVD等约束→使用LINGO求解整数规划，得到最小总体不满意度及具体分配方案→通过理论下界比较、约束检查和分配结果合理性分析进行验证。
  validation: 首先建立可识别会员类型并优先服务高频会员的理想化模型，以其采购量作为理论下界，与会员不可辨识条件下的期望模型结果比较，二者较接近则说明库存估计合理；其次检查整数规划解是否满足每类DVD分配量不超过库存、每位会员恰好获得3张DVD等硬约束；最后统计被分配给未表达观看意愿会员的DVD数量，结果仅有4张出现此情况，其余DVD基本分配给偏好排序较高的会员，从业务意义上验证分配方案的合理性。
  visualization:
  - 各类DVD单月与三个月最少采购量对比表
  - 会员—DVD最优分配结果表
  - 实际库存方案与理论下界对比图
  pitfalls_avoided:
  - 没有直接假设网站能够识别每位会员属于每月租一次还是两次的群体，因为题设只给出总体比例，强行分类并优先排序会高估DVD周转次数、低估实际采购量。
  - 没有采用大规模贪心分配，因为局部优先满足高偏好会员可能提前耗尽热门DVD库存，无法保证全体会员满意度的全局最优，因而改用0-1整数规划。
  - 没有把偏好数据中的0直接视为最优满意度，因为0实际表示会员未选择或不愿观看该DVD；将其替换为充分大的惩罚值可避免模型错误地优先分配这些DVD。
  - 库存需求计算后没有采用四舍五入，而是向上取整，因为DVD数量必须为非负整数，向下取整可能导致目标覆盖率无法达到。
  - 没有简单地用单月周转期望乘以3估计三个月周转能力，而是考虑不同会员类型连续租赁形成的路径及其概率，避免忽略跨期归还和再出租机制。
  innovation_points:
  - 将不同租赁频率会员的随机行为转化为单张DVD的期望周转次数，并进一步通过多阶段租赁序列计算三个月利用次数期望，使采购量与实际周转机制相联系。
  - 把偏好名次转换为不满意度成本，并以充分大数惩罚未表达观看意愿的分配，在库存约束和每人固定获得3张DVD的条件下构造可直接求解的0-1整数规划。
  - 设计会员类型可辨识的优先分配模型作为理论下界，与现实条件下的不可辨识模型进行对照，从而兼顾方案求解与模型有效性检验。
- id: A题优秀论文_2002年A_C题关于“车灯线光源的优化设计”问题的光学思路
  source_paper: A题优秀论文 A题优秀论文_2002年A_C题关于“车灯线光源的优化设计”问题的光学思路
  problem_type: 优化+仿真
  keywords:
  - 线光源优化设计
  - 抛物面反射镜
  - 照度分布
  context: 针对焦点附近线光源经抛物面镜面反射后照射远处屏幕的问题，确定合理的线光源长度并计算屏面照度分布。
  models:
  - name: 朗伯余弦定律模型
    role: 描述线光源各点沿不同方向的发光强度，并为照度计算引入与出射方位角有关的修正因子。
    why: 实际灯丝等漫射光源的发光强度随方向余弦变化，若将其错误地视为各方向等强点光源，会造成斜向观察或照射时亮度失真。
  - name: 平方反比照度模型
    role: 计算光线由线光源点传播到抛物面反射点时的能量衰减。
    why: 光源点到反射面之间属于同心光束传播，其照度与传播距离平方成反比。
  - name: 向量反射定律模型
    role: 根据入射光向量和抛物面单位法向量计算反射光方向，建立光源点、反射点与屏面落点之间的几何映射。
    why: 镜面反射具有明确的方向约束，向量方程能够统一处理抛物面上任意反射点并便于数值光线追迹。
  - name: 近轴平行光与象散光束判别模型
    role: 判断偏离焦点的线光源点经抛物面反射后能否近似形成平行光束，必要时计算子午焦线、弧矢焦线及屏上光斑形状。
    why: 非轴上光源会产生象散，只有在焦线足够远或分离很小时才能采用平行光近似，否则会低估光斑变形和照度非均匀性。
  - name: 屏面照度余弦定律模型
    role: 利用反射光与屏面法线夹角的余弦修正屏面接收照度。
    why: 同一光束斜入射时会分布到更大的屏面面积上，因此单位面积照度随入射角余弦降低。
  - name: 照度叠加与光线追迹仿真模型
    role: 对所有线光源点和抛物面反射点的分照度进行积分或离散求和，获得屏面总照度、光斑及等照度线。
    why: 屏面任一点的照度由多条反射路径共同贡献，且光源和反射面均为连续分布，需要通过叠加得到完整照度场。
  - name: 几何比例初估模型
    role: 根据光源偏移与远场光斑偏移的近似比例，快速估计满足屏幕覆盖范围所需的线光源长度。
    why: 抛物面反射后的光束近似平行且光斑半径远小于目标屏幕尺度，可用近轴几何关系得到约3.12毫米的长度基准，辅助优化初始化和结果校核。
  solution_flow: 输入抛物面焦距、口径半径、屏幕距离与尺寸等几何参数，并将线光源离散为光源点、反射镜离散为反射点；依据朗伯余弦定律和平方反比定律计算入射到镜面的分照度；计算抛物面法向量并用向量反射定律求反射方向及其与屏面的交点；通过边界光线检查近似平行光假设，必要时转用象散光束分析；使用屏面照度余弦定律计算各路径贡献，对全部光源点和反射点积分叠加形成总照度场；以屏幕覆盖范围和照度分布要求为约束，调节线光源长度，并以约3.12毫米的几何初估值作为初值或基准；最终输出最优长度、光斑分布和等照度线，并通过特例与量级分析验证结果。
  validation: 采用多层校验：首先令光源点位于抛物面焦点，检查反射光是否平行于光轴且屏上光斑半径是否约等于反射镜开口半径36毫米；其次对线光源端点发出的边界光线进行追迹，检查子午与弧矢焦线是否足够远，以验证平行光近似；再将优化长度与几何比例得到的约3.12毫米进行量级比较，若差异过大则回查模型或程序；最后通过网格加密、光源点和反射点积分顺序互换以及能量贡献量级比较，检验数值收敛性和结果稳定性。
  visualization:
  - 光源—抛物面—屏幕的光线追迹图
  - 屏面二维照度云图
  - 等照度线图
  - 子午焦线与弧矢焦线示意图
  - 不同线光源长度下的光斑轮廓对比图
  pitfalls_avoided:
  - 避免把线光源离散点错误地视为各方向等强点光源；否则会遗漏朗伯方向因子，使斜向发光贡献被高估并导致照度分布失真。
  - 避免在反射光从镜面传播到屏幕时机械乘以反射点到屏幕距离的平方反比因子；这种处理等价于把镜面反射镜误当成漫反射面，不符合镜面反射的方向性。
  - 避免未经检验就把所有离轴光源的反射光视为严格平行光；离轴点可能产生象散，必须通过边界光线以及子午、弧矢焦线位置判断近似是否成立。
  - 避免将线光源直射屏幕的贡献与反射光等量处理；其照度相对反射光约为极小量级，可忽略以降低计算复杂度，但应先进行量级估计。
  - 避免忽略线光源实体对反射光的遮挡而产生不连续暗带；为突出数学关系，应明确采用透明、无遮挡的理想线光源假设，否则屏面照度突降会干扰长度优化。
  - 避免只输出最终数值而缺少中间诊断；按单个光源点先计算分照度，可利用焦点光源对应光斑半径约36毫米这一物理基准及时发现追迹或叠加错误。
  innovation_points:
  - 将几何光学的向量光线追迹与光度学的朗伯定律、平方反比定律、入射余弦定律和照度叠加统一到同一计算框架中，实现从传播路径到屏面照度的完整建模。
  - 引入象散光束分析作为平行光近似的前置判别，使模型能够根据离轴程度在简化模型和精细模型之间自适应选择。
  - 采用“先按单个光源点叠加全部反射点，再对所有光源点叠加”的分层算法，使每个阶段都能利用光斑尺寸进行物理校验。
  - 利用光斑尺度远小于屏幕尺度的特点构造线光源长度的几何初估值，为数值优化提供可靠初值和独立的结果校核标准。
- id: B题_灾情巡视路线最优解的证明
  source_paper: B题 B题_灾情巡视路线最优解的证明
  problem_type: 优化
  keywords:
  - 灾情巡视路线
  - 最短路径
  - 多车辆路径规划
  - 最小完工时间
  - 组合下界证明
  context: 在县政府派出足够多巡视人员、各乡镇和村具有固定停留时间且车辆速度给定的条件下，确定完成全部灾情巡视的最短时间，并设计满足时限的最优分组巡视路线。
  models:
  - name: 图论最短路径模型
    role: 计算县城与各乡镇、村之间以及节点相互之间的最短距离、最短路径和行驶时间，为巡视时间下界及路线构造提供基础数据。
    why: 道路网络并非节点间完全直连，巡视路线的真实成本应由路网中的最短通行距离决定，不能直接采用直线距离或局部边长。
  - name: 带服务时间的极小化最大完工时间模型
    role: 将每个巡视组的总时间表示为行驶时间与各节点停留时间之和，以所有巡视组中耗时最长者最小为目标，刻画多人并行巡视的最短完成时间。
    why: 各巡视组可同时执行任务，整体完成时间取决于最慢的一组，因此目标应是最小化最大路线时间，而不是简单最小化所有路线总里程。
  - name: 多旅行商问题与车辆路径规划模型
    role: 把乡镇和村分配给多个巡视组，并确定每组从县城出发、访问分配节点后返回县城的访问顺序。
    why: 问题同时包含节点分组和组内访问次序两个决策，具有多旅行商问题或带时间上限车辆路径问题的典型结构。
  - name: 基于容量与路径可行性的组合下界模型
    role: 利用总停留时间、往返行驶时间、最短距离和节点组合不可共线等条件，逐层证明在给定时限内完成巡视所需分组数的下界。
    why: 仅给出一个可行方案不能证明最优性，必须通过排除超时节点组合、计算每条回路可容纳的最大服务量，建立与可行方案组数一致的理论下界。
  - name: 邻近节点插入与路线调整启发式
    role: 在满足单组巡视时限和分组数约束的基础上，按照尽量沿最短路行驶、优先合并邻近乡镇和村的原则逐步修改路线，降低总巡视时间和总里程。
    why: 多组路径的组合搜索规模较大，启发式插入和局部调整能够在已有可行分组上快速获得更优的巡视方案。
  solution_flow: 数据→将县城、乡镇和村抽象为道路网络节点，整理道路距离、行驶速度及各节点固定停留时间→模型→利用最短路径算法计算节点间最短距离和行驶时间，建立带服务时间的多组巡视极小化最大完工时间模型→参数→以规定巡视时限为单条回路时间上限，根据停留时间和往返成本推导节点可共线条件→求解→先由最远节点的最短往返时间与停留时间确定整体最短完成时间下界，再通过组合排除、容量计数和旅行商回路长度约束证明最少分组数，随后构造同组数的可行路线并用邻近插入和局部调整改进→验证→逐条核算路线里程、行驶时间、停留时间和最大完工时间，并用理论下界与可行方案上界重合证明最优性。
  validation: 采用“下界证明加可行解构造”的双重验证策略：首先由县城至最远巡视点的最短往返时间和该点停留时间给出最短完成时间下界；其次针对不同停留时间水平，推导某些远端乡镇和村不能出现在同一回路、两点或三点组合的最优旅行商回路不得超过相应里程阈值等必要条件，并通过分类计数得到最少巡视组数；最后给出达到该组数且每条路线均不超过规定时限的完整方案，逐条复算路线距离与巡视时间，使下界与可行解一致，从而验证最短时间和最少分组结论。
  visualization:
  - 节点最短路径网络图
  - 县城至各节点最短距离与行驶时间表
  - 分组巡视路线及时间里程对照表
  pitfalls_avoided:
  - 避免把多人并行巡视误建模为总路程最小问题，因为总体完工时间由最长的一条巡视回路决定，总路程较小并不保证最早完成。
  - 避免仅依据节点总停留时间估算分组数，因为远端节点的往返行驶成本会显著压缩单组可用服务时间，必须同时考虑路程和停留时间。
  - 避免只检查县城到单个节点的最短距离就判定多个节点可被同组巡视，因为节点之间的连接顺序可能产生额外绕行，应核算完整旅行商回路长度。
  - 避免将构造出的较好路线直接宣称为最优解，因为可行解只能给出上界；论文进一步证明最短时间和最少组数下界，并使其与构造方案一致。
  - 避免默认任意远端节点都能沿各自最短路径顺便合并，因为不同最短路径可能不共享中间节点，新增节点还可能使总巡视时间超过时限，需分类检查邻接和插入可行性。
  innovation_points:
  - 将最短路径表与节点固定停留时间结合，把单条巡视回路的时间限制转化为对可访问节点集合的组合约束，从而形成可操作的最少分组证明。
  - 针对难以直接整体求解的多组路径问题，按停留时间层级和节点远近逐层排除不可能的共线组合，再通过计数累加得到严格分组下界。
  - 同时使用最远节点下界证明最短完工时间、使用组合下界证明最少巡视组数，并构造达到下界的路线，实现理论最优性证明与实际方案设计的统一。
  - 在严格满足时限和最少组数的基础上，采用沿最短路和优先访问邻近节点的局部改进原则，进一步压缩总巡视时间与总行驶里程。
- id: A题_关于_非线性交调的频率设计_的评注_A题的解答和有关情况
  source_paper: A题 A题_关于_非线性交调的频率设计_的评注_A题的解答和有关情况
  problem_type: 优化+统计分析
  keywords:
  - 非线性交调
  - 频率配置
  - 三阶多项式回归
  - 傅里叶分析
  - 信噪比
  - 稳定性分析
  context: 针对通信系统中非线性放大器产生的交调干扰，在允许频率范围及接收带宽约束下设计多路输入信号的频率配置，使接收带内干扰满足信噪比要求。
  models:
  - name: 无常数项三阶多项式回归模型
    role: 根据输入—输出实验数据拟合非线性器件的幅度响应关系，为交调频率及幅度计算提供基础。
    why: 题目只考虑到三阶交调，采用三阶多项式能够保留主要非线性效应；同时物理上零输入应对应零输出，因此去除常数项比单纯追求拟合优度更合理。
  - name: 频率约束组合优化模型
    role: 在频率取值范围、频率间隔和接收带宽等约束下，筛选不会产生直接带内冲突的候选频率配置。
    why: 频率为离散整数且可选组合有限，适合通过约束推导结合枚举或整数规划求出全部可行配置，并可避免无分析地进行大量重复判断。
  - name: 多频信号傅里叶展开模型
    role: 将多频输入代入非线性响应式，识别基频、谐波以及和频、差频等交调分量，并计算各频率分量的系数。
    why: 傅里叶表示可以统一处理不同类型的交调项，比直接展开高次三角多项式更清晰，且便于推广到多输入信号和更高阶非线性。
  - name: 交调信噪比评价模型
    role: 计算每个候选配置中目标信号幅度与落入接收带的交调干扰幅度之比，并据阈值筛选最终设计。
    why: 仅保证交调频率不与载频完全重合仍不足以确保通信质量，必须考虑接收带内干扰的实际强度，信噪比是直接对应工程要求的判据。
  - name: 参数敏感性与稳定性分析模型
    role: 考察多项式阶数、拟合系数、输入幅度及接收带宽变化对最终频率配置的影响。
    why: 器件数据、工作幅度和接收带宽均可能存在误差或变化，稳定性分析可判断最优配置是否对模型假设和参数扰动具有鲁棒性。
  solution_flow: 输入—输出实验数据与频率设计约束→依据零输入零输出的物理条件建立无常数项三阶多项式回归模型并检验系数显著性→将多频正弦输入代入非线性模型，利用傅里叶展开推导基频和各类三阶交调频率及幅度系数→根据频率范围、间隔和接收带宽建立离散约束，推导可行条件并枚举候选配置→逐组计算接收带内交调干扰及信噪比→按照信噪比阈值筛选最终频率设计→改变拟合阶数、参数、输入幅度和带宽进行稳定性验证与推广分析。
  validation: 先通过回归显著性检验和拟合优度验证输入—输出模型，并比较含常数项与无常数项模型，在拟合结果接近时依据物理边界条件选择后者；再对候选配置逐一复算交调频率和幅度，检查其是否进入各接收带以及信噪比是否达到规定阈值；最后通过引入更高阶多项式、扰动拟合系数与输入幅度、改变接收带宽等敏感性实验，检验最终频率配置的稳定性和鲁棒性。
  visualization:
  - 输入—输出特性散点图及多项式拟合曲线
  - 各候选频率配置的信噪比对比柱状图
  - 载频、接收带与交调频率分布图
  - 参数或带宽扰动下可行配置变化的敏感性曲线
  pitfalls_avoided:
  - 避免仅按拟合优度保留回归常数项，因为零输入时非零输出不符合器件的基本物理边界条件，即使统计指标略有改善也可能导致错误的交调幅度估计。
  - 避免把所有高次展开项一概纳入计算，因为部分谐波和交调频率不可能进入给定接收带；先依据频率范围进行理论排除可显著降低计算量。
  - 避免只检查交调频率是否与信号频率完全相等，因为交调只要落入有限宽度的接收带就可能造成干扰，还需计算其幅度及信噪比。
  - 避免完全依赖计算机对数百种组合和上万次条件进行盲目枚举，因为缺少数学化简容易造成重复计算、漏判和程序错误；应先推导频率约束的充分必要条件。
  - 避免用缺乏明确数学表达的目标函数直接套用规划软件，因为目标函数若不能准确体现带内交调强度和工程阈值，所得数值最优解未必具有实际意义。
  - 避免忽略负输入区间及高阶非线性假设，因为拟合模型在实验数据覆盖范围外的延拓方式会影响交调系数，应通过替代模型和高阶模型进行敏感性比较。
  innovation_points:
  - 将物理边界条件、统计回归与离散频率优化相结合，以无常数项三阶多项式描述非线性器件，而非仅依据统计拟合指标选模。
  - 利用多维傅里叶系数统一计算基频及和频、差频等交调分量，使方法能够自然推广到多个输入信号和更高阶交调。
  - 采用“频率可行性初筛—交调幅度计算—信噪比复筛”的分层求解结构，同时兼顾计算效率和工程通信质量。
  - 通过高阶模型、输入幅度和接收带宽扰动研究配置稳定性，将单次最优频率设计扩展为具有鲁棒性评价的工程方案。
- id: D_附件2 中华人民共和国土地增值税暂行条例
  source_paper: D D_附件2 中华人民共和国土地增值税暂行条例
  problem_type: 统计分析
  keywords:
  - 土地增值税
  - 四级超率累进税率
  - 扣除项目金额
  - 税收优惠
  - 增值率
  context: 依据土地增值税法规，对房地产转让收入、扣除项目、增值额及优惠条件进行结构化核算，并确定应纳税额。
  models:
  - name: 应税收入确认模型
    role: 识别货币收入、实物收入、其他收入及视同销售收入，形成土地增值税计税收入。
    why: 土地增值额以转让房地产取得的全部价款及相关经济利益为基础，且产权是否转移直接决定是否计入应税收入。
  - name: 扣除项目归集模型
    role: 归集土地取得成本、房地产开发成本、开发费用、转让税金、加计扣除及旧房评估价格等合法扣除金额。
    why: 扣除项目金额同时影响增值额和增值率，是确定适用税率与最终税额的核心变量，必须按照凭证条件和法定口径分类计算。
  - name: 土地增值额与增值率计算模型
    role: 根据应税收入与扣除项目金额计算增值额，并以增值额除以扣除项目金额得到增值率。
    why: 土地增值税采用超率累进税率，税率档位由增值额相对于扣除项目金额的比例决定。
  - name: 四级超率累进分段计税模型
    role: 按照增值率所在区间匹配税率和速算扣除系数，计算土地增值税应纳税额。
    why: 法规明确设置30%、40%、50%、60%四档税率及0、5%、15%、35%的速算扣除系数，适合用分段函数精确表达。
  - name: 税收优惠规则判定模型
    role: 判定普通标准住宅免税、国家征用收回免税以及个人住房转让免税或减半征税等情形。
    why: 优惠政策包含住宅属性、增值率、持有年限、产权转移和分别核算等多重条件，需要规则化判定以避免错误适用。
  solution_flow: 数据→采集房地产转让收入、产权转移情况、住宅属性、居住年限、成本费用、税金、评估价格及合法凭证→模型→依次进行应税收入确认、扣除项目归集、优惠资格判定和四级超率累进计税→参数→计算增值额V=R-D、增值率q=V/D，并设置20%、50%、100%、200%等政策阈值及对应税率和速算扣除系数→求解→按适用档位计算税额T=V×税率-D×速算扣除系数，再根据免税或减半规则调整→验证→开展临界值测试、分档直接累进计算与速算法交叉核验、凭证审查及多情景敏感性分析。
  validation: 首先对增值率20%、50%、100%、200%及其左右邻域进行边界测试，验证“包括本比例数”的区间归属和税额连续性；其次将速算扣除法与逐级分段累加法进行交叉核算；再次核对应税收入、扣除项目及会计凭证，确保未发生产权转移的自用或出租房地产不计收入且不扣对应成本；最后分别构造普通住宅、非普通住宅、个人住房不同居住年限和旧房转让等案例，验证免税、减半及正常征税规则。
  visualization:
  - 增值率—应纳税额分段折线图
  - 扣除项目金额构成堆叠柱状图
  - 税收优惠条件判定流程图
  - 不同开发情景税负对比柱状图
  pitfalls_avoided:
  - 避免将四级超率累进税率误解为对全部增值额简单适用单一名义税率；应使用法规规定的速算扣除系数或逐级累加，否则会在跨档时高估税额。
  - 避免在50%、100%、200%临界点错误选择税率档位；法规明确每级上限均包括本比例数，错误处理等号会造成边界税额偏差。
  - 避免将普通住宅仅凭单一指标认定；容积率不低于1.0、单套面积不超过144平方米、成交价格不超过同级土地平均地价1.2倍须同时满足，否则不能按普通住宅处理。
  - 避免普通住宅与其他房地产混合核算后仍适用20%以内免税优惠；未分别或不能准确核算增值额时，普通标准住宅不得享受该优惠。
  - 避免将转为企业自用或出租但产权未转移的房地产视同销售；此类资产不征土地增值税，清算时既不计收入，也不能扣除对应成本费用。
  - 避免扣除无合法有效凭证的成本费用；法规要求扣除项目具有合法凭证，缺失凭证会使相关金额不具备税前扣除资格。
  - 避免对所有纳税人统一采用20%加计扣除；该优惠仅适用于从事房地产开发的纳税人，其他主体不得套用。
  - 避免利息支出重复或超限扣除；能够分摊并提供金融机构证明时按规定限额据实扣除，否则应按土地成本与开发成本之和的一定比例计算开发费用。
  - 避免将旧房扣除方法与新建房地产开发项目混用；旧房应以经税务机关确认的重置成本价乘成新度折扣率后的评估价格等作为扣除依据。
  innovation_points:
  - 将应税收入确认、扣除项目归集、住宅分类、税收优惠和累进计税整合为可执行的规则引擎，实现不同房地产转让情景下的自动判定与税额计算。
  - 采用临界值邻域分析与速算法、逐级累加法双重计算机制，系统检验20%、50%、100%、200%政策阈值附近的税负连续性和计算准确性。
  - 设置收入、成本、利息扣除比例及住宅分类指标的情景敏感性分析，量化关键参数变化对增值率、税率档位和最终税负的影响。
- id: 2020_C305
  source_paper: 2020 2020_C305
  problem_type: 统计分析
  keywords:
  - 重复水印文本
  - 正文缺失
  - 信息完整性检测
  context: 所提供内容仅包含微信公众号推广语的重复文本，未出现实际论文题目、问题背景、数据、模型或结论，因而无法提取原论文的建模方案。
  models:
  - name: 重复文本检测
    role: 识别并归并高频重复的广告、水印和页眉页脚文本
    why: 输入内容由高度重复的固定短语构成，需要先排除非论文正文信息，防止将水印误判为研究内容
  - name: 信息完整性检查
    role: 检查问题背景、变量、数据、模型、求解结果与验证等建模要素是否存在
    why: 去除重复文本后没有剩余的实质性论文内容，因此必须通过完整性检查判定材料不足，而不能臆造模型
  solution_flow: 原始文本→统计文本片段频次并识别重复水印→去重与噪声过滤→检查背景、数据、公式、模型、结果和验证信息→判定正文缺失→输出不可进行实质建模知识提取的结论
  validation: 对去重前后的唯一文本片段、重复频次和语义内容进行人工复核，确认全部有效片段均为推广信息，且不存在可用于还原论文方法的题目、公式、数据、图表或结论。
  visualization:
  - 文本片段词频柱状图
  - 重复文本频次分布图
  pitfalls_avoided:
  - 避免根据“数学模型”等水印词推断具体问题类型，因为这些词仅代表公众号名称，不能证明论文采用了某种模型
  - 避免虚构模型、求解流程和验证结果，因为输入中不存在任何实质性论文证据，强行提取会造成事实性错误
  - 避免把大量重复文本视为多页有效正文，因为其内容完全相同，重复次数不增加可用建模信息
  innovation_points:
  - 采用先去重、再进行建模要素完整性审查的异常输入处理流程
  - 使用证据约束的结构化抽取策略，在正文缺失时明确标记信息不足而不进行无依据补全
- id: B题__节水洗衣机_问题数学建模及若干评注
  source_paper: B题 B题__节水洗衣机_问题数学建模及若干评注
  problem_type: 优化+仿真
  keywords:
  - 节水洗衣机
  - 动态递推
  - 非线性规划
  context: 在满足衣物洗净效果及洗衣机单轮容量约束的条件下，优化洗衣轮数和各轮用水量，使洗衣全过程的总用水量最小。
  models:
  - name: 污物溶解特性模型
    role: 描述每轮洗涤时用水量与污物溶解率之间的关系，并为污物转移过程提供基础参数。
    why: 洗衣效果不仅由污水排出比例决定，还受污物能否充分从衣物转移到水中的影响；显式引入溶解特性可避免默认污物完全溶解这一过强假设。
  - name: 污物残留量动态递推模型
    role: 逐轮计算洗涤、排水和甩干后衣物上的残留污物量，刻画洗衣系统的动态演化。
    why: 洗衣过程由重复的“加水—溶解污物—脱去污水”周期构成，前一轮残留污物和残留污水会直接影响后一轮，因此适合用离散动态方程描述。
  - name: 非线性规划模型
    role: 以各轮用水量和洗衣轮数为决策变量，以总用水量最小为目标，并加入洗净效果、最小转动水量和最大容量等约束。
    why: 最终残留污物率表现为各轮洗净因子的乘积，约束具有非线性，而优化目标是直接寻找满足洗净要求的最节水程序。
  - name: 最少洗衣轮数下界模型
    role: 利用单轮最大洗净能力和洗净效果函数的单调性，推导达到目标洗净率所需的最少轮数。
    why: 先确定轮数下界可以显著缩小搜索范围，并排除无论怎样分配用水都无法满足洗净要求的方案。
  - name: 轮数枚举与连续优化模型
    role: 在合理的小范围内枚举洗衣轮数，并对每个固定轮数求解连续非线性规划，最后选择总用水量最小的方案。
    why: 实际洗衣轮数通常较少，没有必要直接采用复杂的混合整数非线性规划算法；枚举轮数更稳定、易实现且便于解释。
  solution_flow: 数据→通过实验获得不同衣物量、材质、脏污程度下的最小转动水量、最大容量、脱水后残留水量、初始污物量及溶解特性→建立逐轮污物残留动态方程→将最终残留污物率设为洗净效果约束，并以总用水量最小构建非线性规划→利用单调性求最少洗衣轮数，在合理轮数范围内枚举并逐一求解连续优化问题→比较各方案总用水量，输出最优轮数和各轮用水量→通过仿真、实验和敏感性分析检验洗净效果及节水性能。
  validation: 首先将最优方案代回动态递推方程，验证最终残留污物率、单轮最小用水量和容量上限等约束均满足；其次开展洗衣仿真或实物实验，对比模型预测的逐轮污物浓度与实测浓度；再改变衣物量、残留水量、溶解特性和目标洗净率进行敏感性分析；最后与等水量分配、固定轮数及传统洗衣程序比较总用水量，并检查乘积约束计算中的浮点下溢问题。
  visualization:
  - 逐轮残留污物率折线图
  - 总用水量随洗衣轮数变化曲线
  - 各轮最优用水量柱状图
  - 溶解率随单轮用水量变化曲线
  - 不同洗净要求下节水效果对比图
  pitfalls_avoided:
  - 避免无理由地假设污物能够完全溶解，因为实际溶解率受用水量、洗涤剂浓度、衣物材质和洗涤时间影响，忽略该因素会高估单轮洗净能力。
  - 避免把洗涤剂排除在污物之外，因为洗涤剂本身也不应残留在衣物上，若只计算原始污物会低估漂洗需求。
  - 避免混淆“本轮加水量”和“本轮实际用水量”，因为后者还包括上一轮脱水后留在衣物中的水，忽略残留水的自然复用会导致水量核算不准确。
  - 避免直接使用复杂的混合整数非线性规划，因为实际轮数范围很小，先求轮数下界再枚举可降低算法复杂度并提高求解稳定性。
  - 避免在论文中堆砌停电、误操作等与核心机制无关的假设，因为过多无效假设会掩盖“溶污物—脱污水”这一主要矛盾。
  - 避免提出多个模型却不深入分析，因为模型数量并不代表质量，应围绕动态递推和节水优化完成参数解释、求解及验证。
  - 避免直接计算大量小洗净因子的连乘，因为可能出现浮点下溢；可采用对数变换或设置机器可表示的最小正数进行数值保护。
  innovation_points:
  - 将洗涤和漂洗统一抽象为重复的“溶污物—脱污水”元动作，从宏观层面建立可递推的统一模型。
  - 把衣物原有污物与洗涤剂统一视为需要去除的总污物，使洗涤阶段和漂洗阶段能够在同一状态变量体系下处理。
  - 显式引入用水量与污物溶解率之间的溶解特性，而不是默认污物在每轮完全溶入水中。
  - 将上一轮脱水后残留水量纳入下一轮实际用水，实现对残留水自然复用的准确刻画。
  - 通过单调性先推导最少洗衣轮数，再采用轮数枚举和连续非线性优化求解，兼顾理论分析、计算效率与可解释性。
  - 提出在各轮溶解特性相同时最优轮数可能等于最少轮数且各轮最优用水量相等的结构性猜想，为进一步简化模型提供方向。
- id: 2017年全国数模题目讲解_C题讲评2017昆明  崔恒建
  source_paper: 2017年全国数模题目讲解 2017年全国数模题目讲解_C题讲评2017昆明  崔恒建
  problem_type: 预测+统计分析
  keywords:
  - 颜色读数与物质浓度辨识
  - 单调非线性回归
  - 误差分析与变量选择
  context: 利用照片中的R、G、B、H、S颜色读数建立物质浓度预测模型，并评估不同数据集、样本量和颜色维度对辨识可靠性的影响。
  models:
  - name: 多元线性回归模型
    role: 建立颜色特征R、G、B、S、H与物质浓度之间的基准预测关系。
    why: 模型结构简单、参数易估计且便于解释各颜色维度的影响，可作为非线性模型的比较基准。
  - name: Logistic单调回归模型
    role: 通过Logistic函数对颜色特征的线性组合进行单调非线性变换，刻画浓度变化的饱和型或S型规律。
    why: 颜色响应与浓度之间通常具有单调性但未必线性，Logistic变换能够体现上下界、饱和效应和机理约束。
  - name: 广义线性模型
    role: 利用已知连接函数将颜色变量的线性预测子映射为浓度预测值，扩展普通线性回归。
    why: 当响应变量与颜色特征的关系可通过已知单调函数线性化时，可兼顾可解释性与非线性拟合能力。
  - name: 单指标模型
    role: 将多维颜色变量压缩为一个线性指标，再以未知函数描述该指标与浓度的关系，用于探索未知响应曲线。
    why: 在单调变换形式未知时，不必预先限定为线性或Logistic形式，能够以半参数方式提高模型灵活性。
  - name: 逐步回归与惩罚变量选择模型
    role: 筛除冗余颜色维度，识别对浓度预测真正有效的变量，并比较降维前后的误差。
    why: R、G、B、H、S之间可能高度相关，变量选择可以缓解多重共线性和小样本过拟合，同时分析颜色维数对模型的影响。
  solution_flow: 读取并清洗不同物质的浓度与R、G、B、H、S数据→利用矩阵散点图、箱线图和控制图检查趋势、异常点及数据匹配问题→分别建立多元线性回归、Logistic单调回归及可选的单指标模型→用最小二乘或相应非线性估计方法求解参数→通过逐步回归或惩罚项选择颜色变量→计算残差、标准化MSE、MSCV、R²和调整R²→识别2σ或3σ异常点并开展样本量、颜色维度敏感性分析→依据拟合误差、预测误差和数据匹配程度评价数据质量并选择最终浓度预测模型。
  validation: 采用拟合与预测相结合的验证策略：以残差图、标准化残差、MSE、R²和调整R²评价样本内拟合，以留一交叉验证得到MSCV评价样本外预测能力；使用2σ、3σ准则及箱线图识别离群点，检查异常点对参数和误差的影响；比较线性模型与Logistic单调模型、全变量与筛选变量模型，并改变样本量和颜色维数进行敏感性分析，防止仅凭高拟合度判断关系可靠。
  visualization:
  - 矩阵散点图
  - 残差图
  - 3σ控制图
  - 箱线图
  - 浓度真实值与预测值对比图
  - 不同样本量或颜色维数下的误差比较图
  pitfalls_avoided:
  - 避免只建立线性模型并报告拟合结果，因为颜色响应可能具有单调饱和或S型非线性，单纯线性关系可能产生系统性偏差。
  - 避免只使用R²评价模型，因为小样本和增加自变量会虚增拟合度；同时使用调整R²、MSE和交叉验证MSCV衡量泛化误差。
  - 避免忽略异常点和数据错配，因为个别颜色读数异常或浓度—颜色记录不匹配会显著扭曲回归系数；使用标准化残差、2σ/3σ准则和箱线图进行识别。
  - 避免将全部颜色变量机械纳入模型，因为R、G、B、H、S可能存在强相关和信息重复，容易引发多重共线性及小样本过拟合；采用逐步回归或惩罚变量选择进行降维。
  - 避免以样本内MSE代替预测能力，因为训练误差通常偏乐观；采用留一交叉验证MSCV比较不同模型和变量组合。
  - 避免仅因模型可拟合就认定颜色与浓度关系已确定，因为数据覆盖范围、样本数量及局部不匹配均会影响可辨识性；需综合拟合、预测误差、单调性和样本敏感性作出判断。
  innovation_points:
  - 将颜色—浓度关系的物理单调性引入回归建模，通过Logistic等单调变换刻画饱和型响应，而非局限于普通线性拟合。
  - 建立基于模型的数据质量评价体系，用残差、MSE、MSCV、调整R²及异常点检测综合判断不同物质数据能否支持稳定的浓度辨识。
  - 结合逐步回归或惩罚变量选择研究颜色维度的有效性，在保证预测精度的同时减少冗余变量和共线性影响。
  - 通过改变样本量与颜色维数开展敏感性分析，将模型精度、数据规模和特征维度纳入统一比较框架。
- id: A题_投资组合与模糊规划模型
  source_paper: A题 A题_投资组合与模糊规划模型
  problem_type: 优化
  keywords:
  - 投资组合优化
  - 双目标规划
  - 模糊线性规划
  context: 在考虑资产收益率、风险损失率、交易费用和银行存款的条件下，为不同风险偏好的投资者确定资金的最优配置方案。
  models:
  - name: 含交易费用的收益—风险双目标规划模型
    role: 建立投资组合问题的完整基础模型，同时最大化净收益并最小化总体投资风险。
    why: 投资决策同时涉及收益与风险两个相互冲突的目标，且实际可投资资金会受到交易费用和最低收费规则的影响，因此需要双目标规划进行统一刻画。
  - name: 大额资金近似线性规划模型
    role: 在投资总额较大时简化分段交易费用约束，使原模型转化为更易求解的线性形式。
    why: 大额投资下按比例收取的交易费用通常超过最低交易费，可忽略最低收费导致的分段结构，从而降低模型复杂度且保持较好的近似精度。
  - name: 最大风险辅助变量线性化模型
    role: 用辅助变量表示各项资产风险贡献的最大值，将总体风险目标及其约束线性化。
    why: 论文以单项投资风险中的最大值衡量总体风险，直接使用最大值会形成非光滑目标；增加上界辅助变量及线性约束后可使用线性规划方法求解。
  - name: 偏好系数加权多目标优化模型
    role: 按照投资者对收益和风险的重视程度，将双目标规划合成为单目标规划，并生成不同偏好下的有效投资组合。
    why: 加权法结构清晰、计算方便，能够通过连续调整偏好系数描述从极端厌恶风险到单纯追求收益的不同投资行为。
  - name: 模糊线性规划模型
    role: 将收益目标和风险目标分别转化为隶属度函数，通过最大化最小目标达成度获得折中投资方案。
    why: 收益期望和风险容忍度通常具有模糊性，隶属函数可表达最高期望、最低可接受水平及允许偏差，并减少直接指定精确目标权重的依赖。
  - name: 小额资金绝对收益优化模型
    role: 处理投资额较小时最低交易费不可忽略的投资组合选择问题。
    why: 小额资金下比例交易费近似可能失效，最低收费会显著改变净收益和最优配置；采用绝对收益及真实交易费用进行建模更符合实际。
  solution_flow: 数据：整理各资产平均收益率、风险损失率、交易费率、最低交易费、银行利率和投资总额→模型：将银行存款视为零风险且零交易费资产，建立含交易费用的收益—风险双目标模型→参数：设定投资比例、风险上界辅助变量、收益与风险偏好系数，以及模糊目标的理想值、最低可接受值和容许偏差→求解：大额资金情形下进行交易费近似和风险线性化，分别采用偏好系数加权法、参数规划和模糊线性规划求取有效投资组合；小额资金情形改用绝对收益和分段交易费用求解→验证：比较不同偏好系数、风险约束松弛程度及两类多目标方法所得组合的收益和风险表现，并检查极端偏好结果是否符合经济直觉。
  validation: 采用参数敏感性分析和方法交叉比较进行验证：改变收益—风险偏好系数，观察资产配置、净收益和总体风险是否呈现合理的权衡关系；将偏好系数加权法与模糊线性规划的有效解进行对照；检查偏好系数取极端值时是否分别趋向无风险资产或最高收益资产；同时区分大额与小额投资，检验忽略最低交易费的近似条件是否成立。
  visualization:
  - 偏好系数—资产配置堆叠图
  - 收益—风险有效前沿图
  - 不同方法投资组合对比表
  - 偏好系数与收益风险关系表
  pitfalls_avoided:
  - 避免把银行存款排除在资产集合之外：将其统一建模为零风险、零交易费资产，可保证极端风险厌恶情形存在合理可行解。
  - 避免直接忽略最低交易费：仅在投资总额足够大、比例手续费高于最低收费时使用线性近似；小额投资则保留真实收费规则，否则会高估分散投资的净收益。
  - 避免直接求解含最大值的非线性风险目标：引入总体风险辅助变量并约束其不小于每项资产的风险贡献，从而消除非光滑结构并提高可解性。
  - 避免仅给出单一主观权重下的投资方案：对偏好系数实施参数规划，输出一系列有效组合，使决策者能够根据风险承受能力选择。
  - 避免用简单加总风险而忽略风险集中：以各资产风险贡献的最大值衡量总体风险，能够限制资金过度集中于某一高风险资产。
  - 避免假定收益和风险目标可以被精确指定：采用模糊隶属函数描述目标的满意程度及容许偏差，更符合投资者偏好的不确定性。
  innovation_points:
  - 将银行存款与市场资产统一纳入同一投资组合框架，以零风险、零交易费参数实现一致建模。
  - 使用最大单项风险贡献刻画总体风险，体现投资分散能够降低风险集中程度，并通过辅助变量实现线性化。
  - 同时采用偏好系数加权法和模糊线性规划求解双目标问题，以两种不同的偏好表达机制进行结果比较。
  - 根据投资规模区分大额资金近似模型与小额资金绝对收益模型，使交易费用处理与实际收费机制相匹配。
- id: B题 电力市场的输电阻塞管理论文_电力市场的输电阻塞管理模型
  source_paper: B题 电力市场的输电阻塞管理论文 B题 电力市场的输电阻塞管理论文_电力市场的输电阻塞管理模型
  problem_type: 统计分析+优化
  keywords:
  - 输电阻塞管理
  - 多元线性回归
  - 多目标优化
  context: 在15分钟分时竞价的电力市场中，根据机组报价、负荷需求、爬坡约束和线路潮流限制制定发电出力方案，并协调输电安全与阻塞费用。
  models:
  - name: 多元线性回归潮流模型
    role: 建立各输电线路有功潮流与各发电机组出力之间的近似线性关系，为后续阻塞判断和调度优化提供约束表达式。
    why: 线路潮流计算较复杂，而题目假设有功潮流与机组出力近似呈线性关系，因此可利用历史或给定样本进行回归，得到便于嵌入优化模型的线性潮流方程。
  - name: 按报价排序的市场清算模型
    role: 按照段价由低到高依次选取机组段容量，在满足负荷需求和爬坡约束的条件下形成初始出力预案，并确定统一清算价。
    why: 该模型直接对应电力市场的竞价交易规则，能够处理段容量部分入选以及边际报价段决定清算价的情形。
  - name: 正交变换无阻塞优化模型
    role: 通过施密特正交化处理潮流关系，在满足负荷平衡、机组出力和爬坡约束的条件下寻找不发生输电阻塞的出力分配方案。
    why: 正交变换能够降低线路潮流约束之间的相关性，改善模型表达和数值求解的稳定性，并便于分析可行调度空间。
  - name: 线路越限最小化模型
    role: 当无法完全消除阻塞时，调整各机组出力，使线路潮流超过额定限值的相对百分比尽可能小，并控制在安全裕度以内。
    why: 仅要求线路不越限可能导致模型无可行解，引入相对越限比例后可在极端负荷条件下获得兼顾供电连续性与线路安全的折中方案。
  - name: 阻塞费用与安全度多目标优化模型
    role: 综合考虑因改变市场初始出力方案产生的发电补偿费用和线路运行安全度，求取近似最优的阻塞调度方案。
    why: 输电阻塞管理同时涉及经济性与安全性，单独最小化费用可能造成严重越限，单独追求安全又可能带来过高补偿成本，因此需要通过权重参数进行多目标协调。
  solution_flow: 数据→整理各机组分段报价、段容量、当前出力、爬坡速率、负荷预测及线路潮流样本→用SPSS多元线性回归建立线路潮流关于机组出力的线性方程→按段价排序并结合15分钟爬坡能力确定初始出力预案和清算价→利用正交变换构造无阻塞优化模型→若无可行解则引入线路安全裕度并最小化相对越限程度→计算因增发、减发产生的阻塞费用，并用权重参数协调费用与安全度→使用MATLAB求解并输出机组出力、线路潮流、阻塞费用和安全度→通过数值实验检查负荷平衡、出力边界、爬坡限制和线路安全约束。
  validation: 采用数值实验进行验证：首先检验回归潮流值与给定潮流样本的一致性；其次核对所有机组出力之和是否等于预测负荷，并逐台检查出力上下限及15分钟爬坡约束；再次将优化出力代入潮流回归方程，检查各线路是否消除越限或是否控制在相对安全裕度内；最后比较初始市场方案与阻塞调整方案的费用和安全度，并通过改变费用—安全权重参数进行敏感性分析。
  visualization:
  - 各线路实际潮流与回归预测潮流对比图
  - 机组初始出力与阻塞调整后出力对比柱状图
  - 线路潮流占限值比例图
  - 阻塞费用—安全度权衡曲线
  pitfalls_avoided:
  - 避免忽略机组爬坡速率，因为一个时段只有15分钟，直接按报价填满段容量可能得到物理上无法实现的出力方案；模型允许段容量部分入选以保证可执行性。
  - 避免将清算价对应的整段容量强制全部选取，因为负荷通常不会恰好等于若干完整报价段容量之和，边际段必须允许部分成交才能满足功率平衡。
  - 避免在阻塞无法完全消除时仍使用严格线路限值，否则优化模型可能无可行解；通过相对越限比例和安全裕度构造渐进式安全约束。
  - 避免只按报价高低重新调度而忽略经济补偿，因为已中标机组被减发、未中标机组被增发会造成利益转移，必须将报价与清算价之差计入阻塞费用。
  - 避免直接把复杂潮流关系无依据地线性化，因为线性系数需要由给定运行数据进行多元回归估计，并应通过样本拟合误差验证其适用性。
  - 避免混淆相邻时段的参照时刻，因为负荷预测、当前出力和计划出力均需统一到时段结束时刻，才能正确计算爬坡可达范围。
  innovation_points:
  - 利用多元线性回归将复杂电网潮流计算转化为可直接嵌入调度优化的线性机组出力—线路潮流关系，并结合施密特正交化改善约束处理。
  - 建立从正常无阻塞调度、允许安全裕度运行到必要时限电的分层决策框架，使模型能够适应不同程度的输电阻塞。
  - 将统一清算机制下的阻塞补偿费用与线路相对越限安全度纳入同一多目标模型，实现市场经济性和电网安全性的协调优化。
- id: 2020_B078
  source_paper: 2020 2020_B078
  problem_type: 统计分析
  keywords:
