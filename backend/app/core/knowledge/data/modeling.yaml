- id: 1993_93建模题目
  source_paper: 1993 1993_93建模题目
  problem_type: 优化+综合评价+统计分析
  keywords:
  - 非线性交调频率设计
  - 整数约束优化
  - 图论排序
  context: 针对非线性系统的抗交调频率配置与比赛不完全、场次不均衡条件下的足球队排名，分别建立频谱约束优化模型和基于比赛网络的综合评价模型。
  models:
  - name: 非线性输入输出特性拟合模型
    role: 利用离散输入输出数据估计系统的静态非线性函数，并计算不同频率成分通过系统后产生的基频及交调振幅。
    why: 系统只给出有限组输入输出观测值，必须先获得可解析或可数值计算的非线性关系，才能展开频谱并评价信噪比。
  - name: 二阶与三阶交调频谱生成模型
    role: 枚举由原始频率形成的二阶组合频率fi±fj和三阶组合频率fi±fj±fk，并合并落在同一频率上的振幅贡献。
    why: 题目明确只考虑二阶、三阶交调，组合频率枚举能够完整表达接收带干扰和边界信噪比约束。
  - name: 整数约束频率配置模型
    role: 在三个给定整数频率区间内搜索频率组合，使载频彼此避开接收带、交调不进入±5接收带，并满足±6处的信噪比要求。
    why: 候选频率均为整数且取值区间有限，问题本质上是带非线性频谱约束的离散可行性搜索或最大最小信噪比优化问题。
  - name: 比赛关系图模型
    role: 将球队表示为节点、比赛表示为带方向和权重的边，把进球差、胜负结果或场均表现转化为两队实力差的观测。
    why: 比赛数据存在未交手和交手次数不同的情况，图模型能够统一表示不完全的两两比较数据，并揭示排名是否可识别。
  - name: 图拉普拉斯最小二乘排名模型
    role: 通过最小化各场比赛观测结果与球队实力评分差之间的残差，求得球队综合实力分并据此排序。
    why: 最小二乘模型可利用全部比赛信息，避免只统计总积分造成的赛程不均衡偏差；当比赛图连通并加入零均值约束后，评分具有唯一性。
  solution_flow: 数据→清洗非线性系统输入输出表和球队比赛记录，识别重复比赛、未比赛标记及比赛场次→对系统静态特性进行低阶非线性拟合，对足球比赛构造带权比较图→由拟合系数计算基频及二阶、三阶交调振幅，由比赛结果确定边权和实力差观测→枚举整数频率三元组并逐项检查接收带与信噪比约束，同时求解带归一化约束的图拉普拉斯最小二乘方程→输出可行频率方案及其最小信噪比、球队评分与名次→通过频谱复算、残差分析、连通性检查和敏感性分析验证结果。
  validation: 频率设计部分对每个候选方案重新生成完整的二阶、三阶频率集合，合并同频交调项，逐一核验载频区间、载频间隔、±5接收带禁入和±6处SNR大于10分贝等条件，并比较不同非线性拟合阶数下方案是否稳定；球队排名部分检查比赛图连通性和线性方程秩，对拟合残差进行分析，并采用留一场比赛或留一组对阵的交叉验证、边权扰动和排名相关系数检验名次稳定性。
  visualization:
  - 非线性输入输出拟合曲线及残差图
  - 载频与交调频率谱线图
  - 接收带约束示意图
  - 球队比赛关系网络图
  - 球队评分排序条形图
  - 排名敏感性热力图
  pitfalls_avoided:
  - 不能只判断交调频率是否重合而忽略振幅叠加；多个二阶或三阶组合可能落在同一频率，若不进行相位一致条件下的代数合并或保守幅值合并，会错误估计SNR。
  - 不能把±5禁入条件与±6信噪比条件混为一谈；前者是硬性的频率隔离约束，后者允许交调存在但要求其相对载频振幅足够小。
  - 避免使用过高阶多项式精确穿过全部输入输出数据；高阶拟合容易产生区间振荡，并会放大交调系数误差，应通过低阶拟合、残差和稳定性比较确定阶数。
  - 输入信号瞬时值可能为负，而给定静态数据主要位于非负区间；直接向负区间外推可能失真，必须明确系统对称性假设、工作点变换或对外推不确定性进行敏感性检验。
  - 球队交手次数不一致时不能直接累计净胜球或胜场；比赛多的球队会被系统性放大，应采用场均指标、逐场观测或按场次设置权重。
  - 比赛图不连通时不能强行给出所有球队的统一唯一名次；不同连通分量之间缺少直接或间接比较信息，实力评分只能在各分量内部确定。
  - 最小二乘实力模型只决定评分差，整体平移不改变目标函数；若不加入评分和为零或固定一队评分的归一化约束，方程组将奇异且解不唯一。
  innovation_points:
  - 将频率位置约束与由实际非线性特性决定的交调振幅约束统一起来，以最大化最小信噪比作为多个可行整数频率方案之间的稳健选择准则。
  - 利用组合频率哈希归并机制统一处理不同表达式产生的同频交调项，从而避免重复计数并提高有限枚举效率。
  - 将不完整足球赛程转化为带权图上的实力差估计，使排名算法可自然推广到任意N支球队，并用图连通性给出排名可识别的明确条件。
  - 同时报告球队评分、残差和名次稳定区间，而非只给出单一排序，使综合评价结果具有可解释性和不确定性说明。
