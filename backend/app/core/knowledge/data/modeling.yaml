- id: B题_足球排名次问题
  source_paper: B题 B题_足球排名次问题
  problem_type: 综合评价+优化+统计分析
  keywords:
  - 不完全成对比较
  - 足球队排序
  - 加权有向图
  context: 依据12支足球队之间场次不均且部分比赛缺失的进球比分，建立可推广到任意N支球队的综合实力排序算法，并分析实现唯一排序所需的数据条件。
  models:
  - name: 比赛关系加权有向图模型
    role: 将球队表示为节点，将两队比赛及净胜球、胜负或进球比等信息表示为带权边，统一描述不完整的对赛数据。
    why: 原始数据具有明显的成对比较结构且包含未比赛项，图模型能够保留比赛关系并用于判断数据网络是否连通。
  - name: 成对比较实力评分模型
    role: 把每场比赛结果转换为两队实力差异或相对优势，汇总同一对球队的多场比赛，构造球队间的比较矩阵。
    why: 仅使用总积分容易受到比赛场次和对手强弱不一致的影响，成对比较可以直接利用比分信息并兼容非完整赛程。
  - name: 加权最小二乘排序模型
    role: 以各队潜在实力分值为未知参数，最小化模型实力差与观测比赛优势之间的加权残差，据此得到综合评分和排名。
    why: 实际比赛结果通常存在循环胜负和随机波动，难以满足完全传递性；最小二乘能够在矛盾数据下求得整体意义上的最佳一致排序，并可推广到任意N支球队。
  - name: 图连通性与可识别性判定模型
    role: 通过比较图的连通分量及模型系数矩阵的秩，判断所有球队的相对实力是否能够被确定，以及排序是否唯一。
    why: 若球队被分成互不比赛的若干组，则组间缺少任何相对信息，无法形成统一排名；连通性是实力参数可识别的核心条件。
  solution_flow: 数据→整理每两队的比赛场次、胜负、进球数和净胜球，识别未比赛项并构造比赛关系图→将比分转换为标准化的成对优势指标，按比赛场次或信息可靠度设置权重→建立球队潜在实力分值与观测优势之间的加权最小二乘模型，并施加分值和为零或指定基准队等归一化约束→求解N支球队的综合实力分值并按降序排名→利用残差、排序稳定性及比赛图连通性检验模型的拟合效果和排名可识别性。
  validation: 首先检查比赛关系图是否连通以及正规方程矩阵在归一化约束下是否满秩；其次比较模型预测的两队强弱关系与实际胜负结果，计算一致率和加权残差；再采用逐场或逐队留出法重新估计排名，检验对缺失比赛和异常大比分的敏感性；最后改变胜平负、净胜球及比赛场次权重，比较名次是否稳定。若球队评分相同或差异小于不确定性范围，应报告并列或排名区间，而不是强行区分。
  visualization:
  - 球队两两比赛结果与缺失情况热力图
  - 比赛关系加权有向网络图
  - 球队综合实力评分及置信区间排序条形图
  - 不同权重或留出样本下的名次稳定性图
  pitfalls_avoided:
  - 避免直接按总积分或总进球数排名，因为各队比赛场次和对手强弱可能不同，原始总量缺乏可比性。
  - 避免把未比赛的X当作0比0或平局，因为这会人为加入不存在的比较信息并系统性扭曲评分。
  - 避免直接使用进球比且不处理0进球，因为分母为零会导致指标无定义或产生极端权重；应使用净胜球、平滑后的对数进球比或有界变换。
  - 避免忽略比较图不连通问题，因为互不相连的球队组之间不存在可识别的相对尺度，任何跨组排名都缺乏数据依据。
  - 避免在存在循环胜负时要求所有成对关系完全传递，因为足球结果包含随机性；采用整体误差最小化可处理T1胜T2、T2胜T3而T3胜T1等矛盾。
  - 避免由单场悬殊比分主导排名，因为偶然的大比分可能成为高杠杆点；可对净胜球截尾、标准化或进行稳健性检验。
  innovation_points:
  - 将不完整、不均衡的足球赛程转化为加权图上的成对比较问题，使未比赛数据无需主观填补即可参与统一建模。
  - 把排名可行性归结为比赛关系图的连通性和参数模型的可识别性，从理论上说明任意N支球队能够形成统一排名的数据条件。
  - 综合利用胜负、比分差和比赛次数确定比较强度与可靠度，并通过归一化约束获得具有可比性的潜在实力评分。
  - 通过留出检验、权重扰动和排名区间分析评估名次稳定性，避免将微小评分差异解释为确定的先后顺序。
- id: 1994_94建模题目
  source_paper: 1994 1994_94建模题目
  problem_type: 优化+统计分析+仿真
  keywords:
  - 地形约束路径优化
  - 冲突图着色与装箱
  - 组合枚举与互开风险
  context: 针对山区公路选线与锁具安全装箱两个问题，分别在地形、坡度和工程成本约束下优化线路，并依据钥匙互开关系设计分箱、标志及销售方案。
  models:
  - name: 二维地形插值模型
    role: 根据离散高程数据构造连续地形曲面，计算任意线路位置的高程、坡度及山谷和山峰位置。
    why: 原始高程仅在规则网格点上给出，而线路位置通常不经过网格点，必须通过双线性插值、双三次插值或样条插值获得连续高程信息。
  - name: 带工程类型与坡度约束的最短路模型
    role: 将候选道路节点及一般路段、桥梁、隧道构造成加权网络，以总工程成本最小为目标确定起点、居民点和矿区之间的线路。
    why: 道路选线同时受到线路长度、地形坡度、桥隧单价和必经点约束，离散化后可转化为带可行边筛选和分段成本的最短路问题。
  - name: 桥梁与隧道分段成本模型
    role: 识别跨越溪流或穿越山体的路段，分别计算桥长、隧道长度及对应工程费用，并执行坡度限制。
    why: 三类工程的单位成本和允许坡度不同，尤其隧道长度超过300米后单价发生跳变，不能用统一距离成本代替。
  - name: 居民区入口选择优化模型
    role: 在给定矩形居民区内选择最优通过点，并与两侧线路联合优化。
    why: 第二问只要求经过居民区而非固定居民点，通过点本身是决策变量，应避免先指定入口再局部选线导致整体方案非最优。
  - name: 锁具状态组合枚举模型
    role: 枚举5个槽高组成的钥匙编码，并筛除不同槽高少于3种或不满足相邻槽高差限制的编码，以确定一批锁具的准确数量。
    why: 槽高取值空间有限，可用穷举精确处理制造约束，避免使用独立性假设造成重复计数或漏计。
  - name: 锁具互开冲突图模型
    role: 将每把锁具作为顶点，将仅有一个对应槽不同且高度差为1的锁具对连接为冲突边，用于描述可能互开的关系。
    why: 互开关系天然具有图结构，装箱安全可表述为同箱或共同销售集合中不得出现冲突边。
  - name: 图着色与独立集装箱模型
    role: 依据冲突图对锁具分类、装箱并设计箱体标志，使可同时出售的箱组之间不存在互开冲突。
    why: 图着色可将冲突顶点分入不同类别，独立集可构造内部无冲突的箱组，适合给出可执行的60把一箱装箱和标志规则。
  - name: 随机装箱风险统计模型
    role: 计算顾客随机购买一箱或多箱时出现至少一对互开锁具的概率、互开对数期望等抱怨指标。
    why: 原装箱方式属于从整批锁具中随机抽取，风险可通过组合概率、超几何分布、容斥或蒙特卡洛仿真进行量化。
  solution_flow: 先清洗高程表、溪流宽度函数、工程单价和坡度限制，利用二维插值重建地形并离散生成候选节点与边；按一般道路、桥梁和隧道分别判断可行性及计算成本，采用最短路或整数规划求解固定居民点方案，再将居民区内通过点纳入决策进行联合优化；随后枚举全部合法钥匙编码，按互开判据建立冲突图，通过图着色、独立集划分和60把一箱的容量约束生成装箱及标志方案，计算可保证无互开的最大购买箱数；最后以组合概率和随机仿真评估原随机装箱方案的一箱、两箱及多箱风险。
  validation: 公路方案通过逐段复算水平长度、高差、坡度、工程类型、桥宽、隧道长度和总成本进行约束核验，并采用更细网格重新求解、不同插值方法对比及单价和坡度阈值敏感性分析检验稳定性；锁具方案通过穷举程序交叉核对合法锁具总数和全部冲突边，逐箱检查容量及箱内、可联合销售箱间是否存在冲突，并用蒙特卡洛结果与组合概率或互开对数期望进行一致性验证。
  visualization:
  - 高程等值线叠加最优公路线、桥梁与隧道位置图
  - 三维地形曲面与线路纵断面坡度图
  - 锁具互开冲突网络图
  - 购买箱数与互开概率或期望互开对数关系图
  pitfalls_avoided:
  - 避免直接用相邻测量点连线代替连续地形，因为网格间可能存在被忽略的陡坡，导致计算线路违反一般路段或隧道坡度限制。
  - 避免仅按最短几何距离选线，因为一般道路、桥梁和隧道单价差异明显，且隧道超过300米存在单价跳变，距离最短不等于成本最低。
  - 避免把溪流宽度视为常数，因为桥梁长度随交叉位置的x坐标变化，错误处理会扭曲跨谷位置及桥梁成本。
  - 避免将居民区问题简化为固定经过矩形中心，因为最优入口可能位于边界，固定代表点会损失整体最优性。
  - 避免假设各把锁具之间的互开事件相互独立，因为同一锁具可连接多个冲突对象，直接相乘会错误估计至少一次互开的概率。
  - 避免只保证单箱内部无冲突而忽略多箱联合销售，因为顾客购买的不同箱之间仍可能存在互开边，必须在标志和销售规则中控制箱间兼容性。
  innovation_points:
  - 将连续地形插值、工程类型判别与离散最短路统一起来，并把桥梁宽度函数和隧道分段计价直接嵌入边权，实现可施工约束下的成本优化。
  - 把锁具互开问题转化为冲突图上的独立集、着色和容量装箱问题，以箱体标志编码箱间兼容关系，使销售人员能够依据标志组合出售并给出无互开的购买箱数保证。
  - 同时使用严格组合枚举与蒙特卡洛仿真评价随机装箱风险，以互开概率和期望互开对数从发生可能性与严重程度两个维度量化顾客抱怨。
- id: 2021_C169
  source_paper: 2021 2021_C169
  problem_type: 统计分析
  keywords:
  - 文本去重
  - 信息缺失识别
  - 内容质量诊断
  context: 所提供内容仅包含重复的微信公众号水印与宣传文字，未包含可用于识别具体建模问题的论文正文。
  models:
  - name: 重复文本检测
    role: 识别输入内容中的高频重复片段并判断有效论文信息是否存在
    why: 全文几乎由相同宣传文字重复构成，需要先进行内容去重与有效性诊断，且无法据此可靠推断论文所使用的数学模型
  solution_flow: 原始文本→重复片段统计与去重→有效内容筛查→确认缺少问题描述、数据、公式和结果→停止模型推断并报告信息不足
  validation: 通过逐段比对和关键词频次检查验证文本高度重复，同时检查是否存在研究目标、变量定义、数据表、数学公式、求解结果及误差分析；这些核心内容均未出现，因此无法开展论文模型的实质性验证。
  visualization:
  - 重复文本词频柱状图
  - 有效信息占比饼图
  pitfalls_avoided:
  - 避免根据微信公众号名称臆造研究背景，因为宣传来源不能反映论文的实际研究对象
  - 避免虚构模型、参数和验证结果，因为原文未提供问题描述、数据、公式或实验结论，强行推断会产生不可靠的结构化知识
  innovation_points:
  - 采用内容有效性诊断作为建模知识提取前置步骤，防止低质量文本污染知识库
  - 在证据不足时明确标注不可识别信息，而非用常见模型模板补全不存在的论文内容
