    why: 原始文本由同一宣传语反复组成，必须先进行重复性和信息有效性检查，才能避免虚构论文模型与结论。
  solution_flow: 原始文本→规范化并统计重复片段→检测有效建模术语、公式与结果→判定论文正文缺失→输出不可进行实质模型提取的质量评估结论
  validation: 通过重复片段频次核验、去重后文本检查以及模型名称、变量、公式、数据、结果等关键要素完整性检查进行验证；去重后仅剩推广信息，证明缺少可供分析的论文正文。
