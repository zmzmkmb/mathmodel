    why: 去重后仍无建模正文，无法可靠提取具体数学模型及求解方案
  solution_flow: 原始文本→重复片段识别与去重→建模要素检索→内容完整性判断→确认缺少论文正文→输出受限的信息提取结论
  validation: 通过逐段比对确认文本均为重复推广内容，并检索问题描述、变量、公式、算法、实验结果和误差指标等关键要素；未发现可用于交叉验证的论文信息。
