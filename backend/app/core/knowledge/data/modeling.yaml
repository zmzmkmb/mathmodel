- id: A题_风险投资组合的线性规划模型
  source_paper: A题 A题_风险投资组合的线性规划模型
  problem_type: 优化
  keywords:
  - 投资组合优化
  - 多目标线性规划
  - 有效投资曲线
  context: 针对多种风险资产与银行存款构成的投资组合，在交易费用和资金总额约束下寻求收益最大、风险最小的投资方案。
  models:
  - name: 收益—风险多目标非线性规划模型
    role: 描述投资组合设计的原始问题，以净收益最大化和总体风险最小化为双重目标，并纳入交易费用与资金约束。
    why: 投资者同时关注收益和风险，且两者相互冲突；交易费函数和总体风险函数又使原始问题具有非线性特征。
  - name: 线性加权多目标转化模型
    role: 利用权因子将收益最大化与风险最小化合并为单目标函数，并通过改变权因子生成不同风险偏好下的方案。
    why: 线性加权法能够显式反映投资者的主观风险偏好，并将多目标问题转化为可直接求解的单目标优化问题。
  - name: 交易费用线性近似模型
    role: 在投资总规模较大的假设下，将带有购买额阈值和固定费用特征的不连续交易费函数近似为投资额的线性函数。
    why: 原交易费函数不连续、难以直接优化；当投资规模充分大时，阈值附近附加费用占总资金比例很小，线性近似对最优决策影响有限。
  - name: 极大风险辅助变量线性化模型
    role: 引入总体风险辅助变量，并设置其不小于各项资产风险暴露的线性约束，将最大值形式的风险函数转化为线性约束。
    why: 最大风险函数含有非光滑的最大值运算，引入辅助变量后可使用上图形式等价表达，并在目标函数最小化作用下自动取到实际最大风险值。
  - name: 参数化线性规划模型
    role: 对多个权因子分别求解投资比例、净收益和总体风险，形成候选最优投资组合及有效投资曲线。
    why: 线性规划求解稳定、速度快，可借助成熟优化程序进行批量计算，并揭示不同风险偏好对应的收益—风险权衡关系。
  solution_flow: 数据→输入各资产平均收益率、风险损失率、交易费率、购买额阈值及资金总额→建立收益最大与风险最小的原始多目标模型→在大规模投资假设下线性近似交易费用，并用辅助变量线性化最大风险→设置权因子，将双目标加权为单目标线性规划→在多个权因子取值下调用线性规划程序求解→计算各方案的投资比例、净收益和风险→绘制有效投资曲线并筛选典型方案→结合适用条件、临界参数和原问题结果进行验证。
  validation: 对不同权因子进行参数扫描，检查最优净收益和总体风险是否随谨慎程度增强而单调下降，并核验资金守恒、非负性及风险上界约束；通过有效投资曲线确认候选方案满足给定风险下收益最大或给定收益下风险最小的帕累托有效性；同时分析交易费线性近似的适用范围和临界投资规模，指出投资额接近购买阈值或总投资规模不足时线性规划结果可能偏离原非连续模型。
  visualization:
  - 收益—风险有效投资曲线
  - 权因子与净收益、总体风险关系图
  - 不同权因子下资产配置结果表
  pitfalls_avoided:
  - 避免直接对含最大值的总体风险函数进行非光滑优化：通过引入风险辅助变量及一组线性上界约束实现等价线性化，提高求解稳定性。
  - 避免忽略交易费用导致收益被系统性高估：将交易费计入净收益和资金约束，并仅在投资规模充分大时采用线性近似。
  - 避免把交易费用的线性近似视为无条件精确：论文明确讨论购买额阈值附近的近似误差，并给出投资规模或参数临界条件下结果可能不可靠的说明。
  - 避免只给出单一主观最优方案：对权因子进行多点扫描，形成有效投资曲线，使不同风险承受能力的投资者能够选择相应方案。
  - 避免将加权目标值直接当作实际经济指标：求解后分别计算并报告净收益和总体风险，以保持结果的经济可解释性。
  innovation_points:
  - 将不连续交易费近似、最大风险辅助变量转化和多目标线性加权结合起来，把复杂的投资组合问题统一转化为可快速求解的线性规划。
  - 通过连续改变风险偏好权因子批量生成典型最优组合和有效投资曲线，使主观风险偏好与客观投资决策建立直观联系。
  - 不仅给出最优配置，还分析线性近似模型的适用边界和临界投资规模，增强了模型结论的可用性与可信度。
